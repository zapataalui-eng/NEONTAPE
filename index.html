ng=\"utf-8\")\n\n\ndef http_text(url: str, params: dict | None = None, headers: dict | None = None, timeout: int = 20) -> str:\n    if params:\n        url += (\"&\" if \"?\" in url else \"?\") + urllib.parse.urlencode(params)\n    req = urllib.request.Request(url, headers={\"User-Agent\": \"Mozilla/5.0 (stock-alerts bot)\", **(headers or {})})\n    try:\n        with urllib.request.urlopen(req, timeout=timeout) as r:\n            return r.read().decode(\"utf-8\", errors=\"replace\")\n    except urllib.error.HTTPError as e:\n        raise ApiError(f\"HTTP {e.code} from {urllib.parse.urlparse(url).netloc}\") from None\n    except urllib.error.URLError as e:\n        raise ApiError(f\"could not reach {urllib.parse.urlparse(url).netloc}: {e.reason}\") from None\n\n\n# ---------- Paid sources: only used when needed, each with a budget ----------\n\nPROVIDERS = {  # name: (env var, budget period, label)\n    \"alphavantage\": (\"ALPHAVANTAGE_API_KEY\", \"day\", \"Alpha Vantage\"),\n    \"lunarcrush\": (\"LUNARCRUSH_API_KEY\", \"month\", \"LunarCrush\"),\n    \"financialdatasets\": (\"FINANCIAL_DATASETS_API_KEY\", \"month\", \"Financial Datasets\"),\n    \"claude\": (\"ANTHROPIC_API_KEY\", \"day\", \"Claude\"),\n}\n\n\nclass Budgets:\n    \"\"\"Counts paid calls per day/month, stops at your limit, and tells you once when a source runs out.\"\"\"\n\n    def __init__(self, knowledge: dict, cfg: dict, now_iso: str):\n        self.k = knowledge.setdefault(\"budgets\", {})\n        self.cfg, self.day, self.month = cfg, now_iso[:10], now_iso[:7]\n        self.notices: list[Alert] = []\n\n    def _e(self, name: str) -> dict:\n        period = self.day if PROVIDERS[name][1] == \"day\" else self.month\n        e = self.k.setdefault(name, {})\n        if e.get(\"period\") != period:\n            e.clear()\n            e.update(period=period, used=0, out=False, alerted=False, why=\"\")\n        return e\n\n    def limit(self, name: str) -> int:\n        return int(self.cfg.get(f\"budget_{name}\", 0))\n\n    def has_key(self, name: str) -> bool:\n        return bool(os.environ.get(PROVIDERS[name][0], \"\").strip())\n\n    def can(self, name: str) -> bool:\n        if not self.has_key(name) or self.limit(name) <= 0:\n            return False\n        e = self._e(name)\n        if e[\"out\"]:\n            return False\n        if e[\"used\"] >= self.limit(name):\n            self.mark_out(name, \"your budget is reached\")\n            return False\n        return True\n\n    def use(self, name: str) -> None:\n        self._e(name)[\"used\"] += 1\n\n    def mark_out(self, name: str, why: str) -> None:\n        e = self._e(name)\n        e[\"out\"], e[\"why\"] = True, why[:120]\n        if e[\"alerted\"]:\n            return\n        e[\"alerted\"] = True\n        _, per, label = PROVIDERS[name]\n        resets = \"tomorrow\" if per == \"day\" else \"next month\"\n        self.notices.append(Alert(\n            f\"budget:{name}:{e['period']}\", \"budget\", f\"⚠️ {label} credits used up\",\n            compose(f\"{label} is out for this {per}. The bot keeps going with free sources and resets {resets}.\",\n                    [f\"Used {e['used']} of {self.limit(name)} this {per}.\", f\"Reason: {why}\"]),\n            self.cfg[\"priority_budget\"], color=COLORS[\"orange\"]))\n\n    def table(self) -> list[dict]:\n        out = []\n        for name, (_, per, label) in PROVIDERS.items():\n            e = self._e(name)\n            out.append({\"name\": label, \"per\": per, \"used\": e[\"used\"], \"limit\": self.limit(name),\n                        \"connected\": self.has_key(name), \"out\": e[\"out\"], \"why\": e[\"why\"]})\n        return out\n\n\ndef _paid_error(budgets: Budgets, name: str, err: str) -> None:\n    low = err.lower()\n    if any(w in low for w in (\"429\", \"402\", \"rate limit\", \"premium\", \"payment required\", \"quota\", \"25 requests\",\n                              \"credit\", \"exceeded\")):\n        budgets.mark_out(name, err)\n\n\ndef alpha_vantage(budgets: Budgets, params: dict, as_text: bool = False):\n    if not budgets.can(\"alphavantage\"):\n        return None\n    budgets.use(\"alphavantage\")\n    p = {**params, \"apikey\": os.environ[PROVIDERS[\"alphavantage\"][0]]}\n    try:\n        if as_text:\n            txt = http_text(AV_URL, p, timeout=30)\n            if txt.lstrip().startswith(\"{\"):\n                r = json.loads(txt)\n            else:\n                return txt\n        else:\n            r = http_json(\"GET\", AV_URL, params=p)\n    except (ApiError, ValueError) as e:\n        _paid_error(budgets, \"alphavantage\", str(e))\n        return None\n    if isinstance(r, dict):\n        msg = r.get(\"Note\") or r.get(\"Information\") or r.get(\"Error Message\")\n        if msg:\n            _paid_error(budgets, \"alphavantage\", msg)\n            return None\n    return r\n\n\ndef lunar_social(budgets: Budgets, sym: str) -> dict | None:\n    if not budgets.can(\"lunarcrush\"):\n        return None\n    budgets.use(\"lunarcrush\")\n    topic = urllib.parse.quote(f\"${sym.lower()}\")\n    try:\n        r = http_json(\"GET\", f\"{LUNAR_URL}/public/topic/{topic}/v1\",\n                      {\"Authorization\": f\"Bearer {os.environ[PROVIDERS['lunarcrush'][0]]}\"})\n    except ApiError as e:\n        _paid_error(budgets, \"lunarcrush\", str(e))\n        return None\n    d = (r or {}).get(\"data\", r) or {}\n    sent = d.get(\"types_sentiment\") or {}\n    vals = [float(v) for v in sent.values() if isinstance(v, (int, float))] if isinstance(sent, dict) else []\n    if not vals and not d.get(\"interactions_24h\"):\n        return None\n    return {\"sentiment\": round(sum(vals) / len(vals)) if vals else None,\n            \"interactions_24h\": d.get(\"interactions_24h\"), \"posts\": d.get(\"num_posts\"),\n            \"trend\": d.get(\"trend\")}\n\n\ndef fd_metrics(budgets: Budgets, sym: str) -> dict | None:\n    if not budgets.can(\"financialdatasets\"):\n        return None\n    budgets.use(\"financialdatasets\")\n    try:\n        r = http_json(\"GET\", f\"{FD_URL}/financial-metrics/snapshot\",\n                      {\"X-API-KEY\": os.environ[PROVIDERS[\"financialdatasets\"][0]]}, {\"ticker\": sym})\n    except ApiError as e:\n        _paid_error(budgets, \"financialdatasets\", str(e))\n        return None\n    s = (r or {}).get(\"snapshot\") or {}\n    keep = (\"price_to_earnings_ratio\", \"revenue_growth\", \"earnings_growth\", \"net_margin\", \"return_on_equity\",\n            \"debt_to_equity\")\n    out = {k: s.get(k) for k in keep if s.get(k) is not None}\n    return out or None\n\n\ndef earnings_soon(budgets: Budgets, knowledge: dict, sym: str, today: str) -> str | None:\n    \"\"\"Next earnings date if within 3 months (Alpha Vantage calendar, fetched at most once a day).\"\"\"\n    cal = knowledge.setdefault(\"earnings_calendar\", {})\n    if cal.get(\"day\") != today:\n        txt = alpha_vantage(budgets, {\"function\": \"EARNINGS_CALENDAR\", \"horizon\": \"3month\"}, as_text=True)\n        if isinstance(txt, str) and txt.startswith(\"symbol\"):\n            rows = {}\n            for line in txt.splitlines()[1:]:\n                parts = line.split(\",\")\n                if len(parts) >= 3 and parts[0] and parts[2]:\n                    rows.setdefault(parts[0].upper(), parts[2])\n            cal.clear()\n            cal.update(day=today, dates=rows)\n    return (cal.get(\"dates\") or {}).get(sym)\n\n\ndef trading_days_until(today: str, then: str) -> int:\n    d0, d1 = date.fromisoformat(today), date.fromisoformat(then)\n    n, d = 0, d0\n    while d < d1:\n        d += timedelta(days=1)\n        if d.weekday() < 5:\n            n += 1\n    return n\n\n\ndef av_fundamentals(budgets: Budgets, knowledge: dict, sym: str, today: str) -> dict | None:\n    \"\"\"Company overview + earnings beat history (cached a week).\"\"\"\n    cache = knowledge.setdefault(\"fundamentals\", {})\n    c = cache.get(sym)\n    if c and (date.fromisoformat(today) - date.fromisoformat(c[\"day\"])).days < 7:\n        return c\n    ov = alpha_vantage(budgets, {\"function\": \"COMPANY_OVERVIEW\", \"symbol\": sym})\n    if not ov:\n        return c\n    ea = alpha_vantage(budgets, {\"function\": \"EARNINGS\", \"symbol\": sym}) or {}\n    q = (ea.get(\"quarterlyEarnings\") or [])[:8]\n    beats = [x for x in q if _f(x.get(\"surprisePercentage\")) is not None]\n    out = {\"day\": today, \"name\": ov.get(\"Name\", sym), \"sector\": ov.get(\"Sector\", \"\"),\n           \"pe\": _f(ov.get(\"PERatio\")), \"target\": _f(ov.get(\"AnalystTargetPrice\")),\n           \"rev_growth\": _f(ov.get(\"QuarterlyRevenueGrowthYOY\")),\n           \"beat_rate\": (sum(1 for x in beats if _f(x[\"surprisePercentage\"]) > 0) / len(beats)) if beats else None,\n           \"quarters\": len(beats)}\n    cache[sym] = out\n    return out\n\n\ndef _f(x):\n    try:\n        v = float(x)\n        return v if math.isfinite(v) else None\n    except (TypeError, ValueError):\n        return None\n\n\n# ---------- Free research: Google News + Yahoo Finance + Benzinga ----------\n\n@dataclass\nclass Research:\n    symbol: str\n    articles: int = 0\n    sites: int = 0\n    score: float = 0.0        # about -3 (very bad) .. +3 (very good)\n    good: int = 0\n    bad: int = 0\n    top: list = field(default_factory=list)    # [impact, headline, site]\n    sources: list = field(default_factory=list)\n    complete: bool = False    # met your \"15 articles from 10 sites\" rule\n    when: str = \"\"\n\n    def line(self) -> str:\n        tone = \"positive\" if self.score >= 0.3 else \"negative\" if self.score <= -0.3 else \"mixed/neutral\"\n        return (f\"Free research: {self.articles} articles from {self.sites} sites \"\n                f\"({', '.join(self.sources)}): {tone} ({self.good} good, {self.bad} bad).\")\n\n\ndef parse_rss(xml_text: str) -> list[dict]:\n    import xml.etree.ElementTree as ET\n    try:\n        root = ET.fromstring(xml_text)\n    except ET.ParseError:\n        return []\n    out = []\n    for it in root.iter(\"item\"):\n        src = it.find(\"source\")\n        out.append({\"title\": (it.findtext(\"title\") or \"\").strip(),\n                    \"link\": (it.findtext(\"link\") or \"\").strip(),\n                    \"summary\": re.sub(r\"<[^>]+>\", \" \", it.findtext(\"description\") or \"\")[:300],\n                    \"published\": it.findtext(\"pubDate\") or \"\",\n                    \"site\": (src.get(\"url\") if src is not None and src.get(\"url\") else \"\") or \"\",\n                    \"site_name\": (src.text or \"\").strip() if src is not None else \"\"})\n    return out\n\n\ndef domain_of(url: str) -> str:\n    d = urllib.parse.urlparse(url).netloc.lower()\n    return d[4:] if d.startswith(\"www.\") else d\n\n\ndef free_research(sym: str, state: dict, cfg: dict, now_iso: str) -> Research:\n    arts, sources = [], []\n    q = f\"{sym} stock when:7d\"\n    try:\n        g = parse_rss(http_text(GNEWS_URL, {\"q\": q, \"hl\": \"en-US\", \"gl\": \"US\", \"ceid\": \"US:en\"}))\n        for a in g:\n            # Google titles end in \" - Source\"\n            if a[\"site_name\"] and a[\"title\"].endswith(\" - \" + a[\"site_name\"]):\n                a[\"title\"] = a[\"title\"][: -len(a[\"site_name\"]) - 3]\n            a[\"domain\"] = domain_of(a[\"site\"]) or a[\"site_name\"].lower() or \"news.google.com\"\n        arts += g\n        if g:\n            sources.append(\"Google News\")\n    except ApiError as e:\n        print(f\"  Google News failed for {sym}: {e}\")\n    try:\n        y = parse_rss(http_text(YAHOO_RSS_URL, {\"s\": sym, \"region\": \"US\", \"lang\": \"en-US\"}))\n        for a in y:\n            a[\"domain\"] = domain_of(a[\"link\"]) or \"finance.yahoo.com\"\n        arts += y\n        if y:\n            sources.append(\"Yahoo Finance\")\n    except ApiError as e:\n        print(f\"  Yahoo Finance failed for {sym}: {e}\")\n    for ts, impact, cat, head in state.get(\"news\", {}).get(\"events\", {}).get(sym, []):\n        arts.append({\"title\": head, \"summary\": \"\", \"domain\": \"benzinga.com\", \"link\": \"\"})\n    if state.get(\"news\", {}).get(\"events\", {}).get(sym):\n        sources.append(\"Benzinga\")\n\n    seen, uniq = set(), []\n    for a in arts:\n        key = re.sub(r\"\\W+\", \" \", a[\"title\"].lower()).strip()[:80]\n        if key and key not in seen:\n            seen.add(key)\n            uniq.append(a)\n    r = Research(sym, len(uniq), len({a[\"domain\"] for a in uniq}), sources=sources, when=now_iso)\n    impacts = []\n    for a in uniq:\n        k = rate_headline(a[\"title\"], a.get(\"summary\", \"\"))\n        if not k or k[0] == 0:\n            continue\n        imp = k[0] * k[1] * k[2]\n        impacts.append(imp)\n        r.good += k[0] > 0\n        r.bad += k[0] < 0\n        r.top.append([round(imp, 2), a[\"title\"][:120], a[\"domain\"]])\n    if impacts:\n        r.score = round(sum(impacts) / len(impacts) * min(1.0, len(impacts) / 5), 2)\n    r.top = sorted(r.top, key=lambda x: -abs(x[0]))[:5]\n    r.complete = r.articles >= cfg[\"research_min_articles\"] and r.sites >= cfg[\"research_min_sites\"]\n    return r\n\n\ndef get_research(sym: str, state: dict, knowledge: dict, cfg: dict, now_iso: str) -> Research:\n    cache = knowledge.setdefault(\"research\", {})\n    c = cache.get(sym)\n    if c and (parse_ts(now_iso) - parse_ts(c[\"when\"])).total_seconds() < cfg[\"research_cache_hours\"] * 3600:\n        return Research(**c)\n    r = free_research(sym, state, cfg, now_iso)\n    cache[sym] = r.__dict__.copy()\n    # keep the cache small\n    for k in sorted(cache, key=lambda s: cache[s][\"when\"])[:-60]:\n        del cache[k]\n    return r\n\n\ndef research_uncertain(r: Research) -> bool:\n    \"\"\"True when free sources can't settle it: too little coverage, or good and bad news cancel out.\"\"\"\n    return (not r.complete) or (abs(r.score) < 0.3 and r.good > 0 and r.bad > 0)\n\n\n# ---------- Long-term statistics from years of free price history ----------\n\ndef long_stats_from_closes(dates: list[str], closes: list[float]) -> dict | None:\n    n = len(closes)\n    if n < 252:\n        return None\n    years = n / 252\n    cagr = ((closes[-1] / closes[0]) ** (1 / years) - 1) * 100\n    peak, mdd = closes[0], 0.0\n    for c in closes:\n        peak = max(peak, c)\n        mdd = min(mdd, (c / peak - 1) * 100)\n    rets = [(closes[i] / closes[i - 1] - 1) * 100 for i in range(1, n)]\n    drops = [i for i in range(1, n) if rets[i - 1] <= -4.0 and i + 10 < n]\n    after = [(closes[i + 10] / closes[i] - 1) * 100 for i in drops]\n    by_year: dict[str, list[float]] = {}\n    for d, c in zip(dates, closes):\n        by_year.setdefault(d[:4], []).append(c)\n    full = [v for y, v in sorted(by_year.items())[:-1] if len(v) > 200]\n    up_years = sum(1 for v in full if v[-1] > v[0])\n    return {\"years\": round(years, 1), \"cagr\": round(cagr, 1), \"max_drawdown\": round(mdd, 1),\n            \"best_day\": round(max(rets), 1), \"worst_day\": round(min(rets), 1),\n            \"pct_days_up\": round(sum(1 for r in rets if r > 0) / len(rets) * 100),\n            \"drops_4pct\": len(drops), \"after_drop_10d\": round(sum(after) / len(after), 1) if after else None,\n            \"up_years\": up_years, \"full_years\": len(full)}\n\n\ndef long_stats(alp: \"Alpaca\", knowledge: dict, sym: str, today: str) -> dict | None:\n    cache = knowledge.setdefault(\"long_stats\", {})\n    c = cache.get(sym)\n    if c and (date.fromisoformat(today) - date.fromisoformat(c[\"day\"])).days < 7:\n        return c\n    try:\n        bars = alp.daily_bars([sym], date.fromisoformat(today) - timedelta(days=int(365.25 * 6))).get(sym) or []\n    except ApiError as e:\n        print(f\"  history failed for {sym}: {e}\")\n        return c\n    st = long_stats_from_closes([b[\"t\"][:10] for b in bars], [float(b[\"c\"]) for b in bars])\n    if st:\n        st[\"day\"] = today\n        cache[sym] = st\n    return st\n\n\ndef stats_line(st: dict | None) -> str:\n    if not st:\n        return \"\"\n    s = (f\"History ({st['years']:g} yrs): {st['cagr']:+.0f}%/yr, worst drop {st['max_drawdown']:.0f}%, \"\n         f\"up {st['up_years']} of {st['full_years']} full years, worst day {st['worst_day']:.0f}%.\")\n    if st.get(\"after_drop_10d\") is not None and st[\"drops_4pct\"] >= 3:\n        s += f\" After its {st['drops_4pct']} drops of 4%+ in a day, it averaged {st['after_drop_10d']:+.1f}% over the next 10 days.\"\n    return s\n\n\n# ---------- Track record: how did past buy alerts do? ----------\n\ndef record_buy(knowledge: dict, sym: str, price: float, day: str) -> None:\n    knowledge.setdefault(\"track\", []).append({\"sym\": sym, \"day\": day, \"price\": round(price, 4), \"status\": \"open\",\n                                              \"result\": None})\n    knowledge[\"track\"] = knowledge[\"track\"][-300:]\n\n\ndef update_track(knowledge: dict, allm: dict, cfg: dict, today: str) -> None:\n    for t in knowledge.get(\"track\", []):\n        if t[\"status\"] != \"open\":\n            continue\n        m = allm.get(t[\"sym\"])\n        if not m:\n            continue\n        g = (m.price / t[\"price\"] - 1) * 100\n        if g >= cfg[\"profit_pct\"]:\n            t.update(status=\"win\", result=round(g, 2), closed=today)\n        elif g <= -cfg[\"stop_pct\"]:\n            t.update(status=\"loss\", result=round(g, 2), closed=today)\n        elif (date.fromisoformat(today) - date.fromisoformat(t[\"day\"])).days > 28:\n            t.update(status=\"expired\", result=round(g, 2), closed=today)\n\n\ndef track_summary(knowledge: dict) -> dict:\n    tr = knowledge.get(\"track\", [])\n    w = sum(t[\"status\"] == \"win\" for t in tr)\n    l = sum(t[\"status\"] == \"loss\" for t in tr)\n    e = sum(t[\"status\"] == \"expired\" for t in tr)\n    o = sum(t[\"status\"] == \"open\" for t in tr)\n    done = w + l\n    return {\"alerts\": len(tr), \"wins\": w, \"losses\": l, \"expired\": e, \"open\": o,\n            \"win_rate\": round(w / done * 100) if done else None}\n\n\ndef track_line(knowledge: dict) -> str:\n    s = track_summary(knowledge)\n    if not (s[\"wins\"] + s[\"losses\"]):\n        return \"Track record: no finished buy alerts yet.\"\n    return (f\"Track record: {s['wins']} of {s['wins'] + s['losses']} finished buy alerts hit +2% before -2% \"\n            f\"({s['win_rate']}%). It needs about 53%+ to beat costs.\")\n\n\n# ---------- Ideas: trending stocks from the news + near-setups ----------\n\ndef note_trending(knowledge: dict, raw_items: list[dict], interest: set[str], now_iso: str) -> None:\n    tr = knowledge.setdefault(\"trending\", {})\n    for it in raw_items:\n        tickers = [t.upper() for t in it.get(\"symbols\") or []]\n        if not (1 <= len(tickers) <= 3):\n            continue\n        k = rate_headline(it.get(\"headline\") or \"\", it.get(\"summary\") or \"\")\n        if not k or k[0] == 0:\n            continue\n        for t in tickers:\n            if t in interest or t in MACRO_TICKERS or not t.isalpha() or len(t) > 5:\n                continue\n            tr.setdefault(t, []).append([it.get(\"created_at\") or now_iso, round(k[0] * k[1] * k[2], 2),\n                                         (it.get(\"headline\") or \"\")[:100]])\n    cutoff = parse_ts(now_iso) - timedelta(hours=48)\n    for t in list(tr):\n        tr[t] = [x for x in tr[t] if _safe_ts(x[0]) >= cutoff][-10:]\n        if not tr[t]:\n            del tr[t]\n\n\ndef trending_ideas(knowledge: dict, n: int = 3) -> list[dict]:\n    out = []\n    for t, xs in knowledge.get(\"trending\", {}).items():\n        net = sum(x[1] for x in xs)\n        pos = sum(1 for x in xs if x[1] > 0)\n        if pos >= 2 and net > 0:\n            out.append({\"symbol\": t, \"mentions\": len(xs), \"net\": round(net, 2), \"headline\": xs[-1][2]})\n    return sorted(out, key=lambda d: (-d[\"net\"], -d[\"mentions\"]))[:n]\n\n\ndef dynamic_universe(knowledge: dict, today: str) -> list[str]:\n    dyn = knowledge.setdefault(\"dynamic\", {})\n    for s in list(dyn):\n        if dyn[s] < today:\n            del dyn[s]\n    return sorted(dyn)\n\n\ndef add_dynamic(knowledge: dict, syms: list[str], today: str, keep_days: int, cap: int) -> None:\n    dyn = knowledge.setdefault(\"dynamic\", {})\n    until = (date.fromisoformat(today) + timedelta(days=keep_days)).isoformat()\n    for s in syms:\n        if s not in dyn and len(dyn) < cap:\n            dyn[s] = until\n\n\n# ---------- Obsidian vault + app dashboard ----------\n\ndef log_alerts(knowledge: dict, alerts: list[Alert], now_iso: str) -> None:\n    log = knowledge.setdefault(\"alerts_log\", [])\n    for a in alerts:\n        log.append({\"t\": now_iso[:16], \"kind\": a.kind, \"sym\": a.symbol, \"title\": a.title,\n                    \"message\": a.message[:1500], \"color\": a.color, \"url\": a.url})\n    knowledge[\"alerts_log\"] = log[-300:]\n\n\ndef write_vault(knowledge: dict, state: dict, holdings: list, allm: dict, alerts: list[Alert],\n                budgets: Budgets, now_iso: str, root: Path | None = None) -> None:\n    root = root or HERE / \"vault\"\n    (root / \"Stocks\").mkdir(parents=True, exist_ok=True)\n    (root / \"Daily\").mkdir(parents=True, exist_ok=True)\n    today = now_iso[:10]\n    if alerts:\n        p = root / \"Daily\" / f\"{today}.md\"\n        head = \"\" if p.exists() else f\"---\\ntags: [daily, stock-bot]\\n---\\n# {today}\\n\\n\"\n        with open(p, \"a\", encoding=\"utf-8\") as f:\n            f.write(head)\n            for a in alerts:\n                link = f\"[[{a.symbol}]] \" if a.symbol else \"\"\n                f.write(f\"- {now_iso[11:16]} {link}**{a.title}**: {a.message.splitlines()[0]}\\n\")\n    syms = {h.symbol for h in holdings} | {a.symbol for a in alerts if a.symbol}\n    for sym in sorted(syms):\n        m = allm.get(sym)\n        lines = [f\"---\\ntags: [stock, stock-bot]\\nupdated: {now_iso[:16]}\\n---\", f\"# {sym}\", \"\"]\n        if m:\n            lines += [f\"**Price** {money(m.price)}\" + (f\" • momentum rank #{m.rank}\" if m.rank else \"\") + f\" • RSI {m.rsi:.0f} • \"\n                      f\"12-mo {m.ret_12_1:+.0f}% • normal daily swing ±{m.atr_pct:.1f}%\", \"\"]\n        st = knowledge.get(\"long_stats\", {}).get(sym)\n        if st:\n            lines += [\"## Long-term stats\", stats_line(st), \"\"]\n        fu = knowledge.get(\"fundamentals\", {}).get(sym)\n        if fu:\n            lines += [\"## Fundamentals (Alpha Vantage)\",\n                      f\"{fu.get('name')} • {fu.get('sector')} • P/E {fu.get('pe')} • analyst target {fu.get('target')} • \"\n                      f\"beat earnings in {round((fu.get('beat_rate') or 0) * 100)}% of last {fu.get('quarters')} quarters\", \"\"]\n        rs = knowledge.get(\"research\", {}).get(sym)\n        if rs:\n            r = Research(**rs)\n            lines += [\"## Latest research\", r.line()] + [f\"- ({x[0]:+.1f}) {x[1]} *({x[2]})*\" for x in r.top] + [\"\"]\n        ev = state.get(\"news\", {}).get(\"events\", {}).get(sym, [])\n        if ev:\n            lines += [\"## Recent news (rated)\"] + [f\"- {e[0][:16].replace('T', ' ')} ({e[1]:+.1f}) {e[2]}: {e[3]}\" for e in ev[-8:]] + [\"\"]\n        hist = [x for x in knowledge.get(\"alerts_log\", []) if x[\"sym\"] == sym][-10:]\n        if hist:\n            lines += [\"## Alerts\"] + [f\"- {x['t'].replace('T', ' ')} {x['title']}\" for x in hist] + [\"\"]\n        (root / \"Stocks\" / f\"{sym}.md\").write_text(\"\\n\".join(lines), encoding=\"utf-8\")\n    bt = budgets.table()\n    mem = [f\"---\\ntags: [stock-bot]\\nupdated: {now_iso[:16]}\\n---\", \"# Bot Memory\", \"\",\n           \"## Track record\", track_line(knowledge), \"\",\n           \"## Paid sources (used / limit)\"] + \\\n          [f\"- {b['name']}: {'not connected' if not b['connected'] else str(b['used']) + ' / ' + str(b['limit']) + ' per ' + b['per'] + (' (OUT)' if b['out'] else '')}\"\n           for b in bt] + [\"\", \"## Watching extra (from the news)\"] + \\\n          [f\"- [[{s}]] until {d}\" for s, d in sorted(knowledge.get(\"dynamic\", {}).items())] + [\"\"]\n    (root / \"Bot Memory.md\").write_text(\"\\n\".join(mem), encoding=\"utf-8\")\n\n\ndef write_dashboard(knowledge: dict, state: dict, cfg: dict, holdings: list, allm: dict, ranked: list,\n                    regime_txt: str, budgets: Budgets, now_iso: str, market_open: bool,\n                    path: Path | None = None) -> None:\n    path = path or HERE / \"app\" / \"dashboard.json\"\n    path.parent.mkdir(parents=True, exist_ok=True)\n    regime = regime_txt.startswith(\"market healthy\")\n    mkt = news_view(state, MARKET_KEY, now_iso)\n    hold = []\n    for h in holdings:\n        m = allm.get(h.symbol)\n        if not m:\n            hold.append({\"symbol\": h.symbol, \"buy\": h.buy_price, \"shares\": h.shares}); continue\n        v, pts, why = hold_advice(m, regime, news_view(state, h.symbol, now_iso), mkt)\n        hold.append({\"symbol\": h.symbol, \"buy\": h.buy_price, \"shares\": h.shares, \"price\": round(m.price, 2),\n                     \"gain\": round((m.price / h.buy_price - 1) * 100, 2),\n                     \"pl\": round((m.price - h.buy_price) * h.shares, 2) if h.shares else None,\n                     \"stop\": round(h.buy_price * (1 - cfg[\"stop_pct\"] / 100), 2), \"advice\": v, \"why\": why})\n    watch = []\n    for m in ranked[:15]:\n        nv = news_view(state, m.symbol, now_iso)\n        ok, fails = buy_check(m, cfg, regime, nv)\n        watch.append({\"symbol\": m.symbol, \"rank\": m.rank, \"price\": round(m.price, 2), \"score\": round(m.score),\n                      \"r12\": round(m.ret_12_1), \"rsi\": round(m.rsi), \"atr\": round(m.atr_pct, 1),\n                      \"news\": nv.score, \"setup\": ok, \"fails\": fails[:3], \"risk\": risk_label(m.atr_pct)})\n    data = {\"updated\": now_iso[:16], \"market_open\": market_open, \"regime\": regime_txt,\n            \"market_news\": mkt.label, \"holdings\": hold, \"watch\": watch,\n            \"ideas\": trending_ideas(knowledge, 5), \"alerts\": list(reversed(knowledge.get(\"alerts_log\", [])[-60:])),\n            \"budgets\": budgets.table(), \"track\": track_summary(knowledge),\n            \"account_size\": cfg[\"account_size\"]}\n    path.write_text(json.dumps(data, indent=1), encoding=\"utf-8\")\n\n\n# =============================================================================\n# One scan\n# =============================================================================\n\ndef build_metrics(alp: Alpaca, symbols: list[str], today_et: str, market_open: bool,\n                  live: bool = True) -> dict[str, Metrics]:\n    start = date.fromisoformat(today_et) - timedelta(days=420)\n    bars = alp.daily_bars(symbols, start)\n    prices = alp.live_prices(symbols) if live else {}\n    out = {}\n    for sym in symbols:\n        b = bars.get(sym) or []\n        if b and market_open and b[-1][\"t\"][:10] == today_et:\n            b = b[:-1]  # drop today's unfinished bar\n        if len(b) <= MIN_HISTORY:\n            continue\n        s = Series.from_bars(b)\n        m = metrics_at(sym, s, len(s) - 1, prices.get(sym))\n        if m:\n            out[sym] = m\n    return out\n\n\ndef send_all(alerts: list[Alert], notifier: Notifier, sent: set, state: dict) -> None:\n    for a in alerts:\n        if notifier.send(a):\n            sent.add(a.key)\n            if a.kind == \"buy\":\n                state[\"buys_today\"] = state.get(\"buys_today\", 0) + 1\n    state[\"sent_today\"] = sorted(sent)\n\n\ndef run_scan(cfg: dict, alp: Alpaca, notifier: Notifier, holdings: list[Holding],\n             state: dict, now_override: dict | None = None, force: bool = False,\n             knowledge: dict | None = None, write_files: bool = False) -> list[Alert]:\n    knowledge = knowledge if knowledge is not None else {}\n    clock = now_override or alp.clock()\n    now_iso = clock[\"timestamp\"]\n    today = now_iso[:10]\n    is_open = clock[\"is_open\"] or force\n    budgets = Budgets(knowledge, cfg, now_iso)\n\n    if state.get(\"day\") != today:\n        state[\"day\"], state[\"sent_today\"], state[\"buys_today\"] = today, [], 0\n    sent = set(state.get(\"sent_today\", []))\n    hstates = state.setdefault(\"holdings\", {})\n    for k in list(hstates):\n        if k not in {h.key for h in holdings}:\n            del hstates[k]  # you sold it (removed the line): forget its memory\n    held = {h.symbol for h in holdings}\n    universe = sorted(set(cfg[\"universe\"]) | set(dynamic_universe(knowledge, today)))\n\n    # 1. News runs on every pass, even before the open, so overnight stories reach you early\n    events: list[NewsEvent] = []\n    if cfg[\"news\"]:\n        try:\n            events = process_news(alp, cfg, state, set(universe) | held, now_iso, budgets, knowledge, held)\n        except ApiError as e:\n            print(f\"News check failed: {e}\")\n\n    if not is_open:\n        alerts = news_alerts(events, holdings, {}, cfg, sent, None, state, now_iso, False) + budgets.notices\n        send_all(alerts, notifier, sent, state)\n        log_alerts(knowledge, alerts, now_iso)\n        print(f\"Market closed (next open {clock['next_open'][:16]}). {len(alerts)} alert(s) sent.\")\n        return alerts\n\n    # 2. Prices and rankings\n    symbols = sorted(set(universe) | held | {MARKET})\n    allm = build_metrics(alp, symbols, today, clock[\"is_open\"])\n    ranked = score_all([m for s, m in allm.items() if s in universe])\n    regime, regime_txt = market_ok(allm.get(MARKET))\n    mkt = news_view(state, MARKET_KEY, now_iso)\n    print(f\"{today}: scanned {len(allm)} stocks; {regime_txt}\")\n    update_track(knowledge, allm, cfg, today)\n\n    # 3. News about what you own\n    alerts = news_alerts(events, holdings, allm, cfg, sent, regime, state, now_iso, True)\n\n    # 4. Your sell rules (free research on what you own feeds the advice)\n    for h in holdings:\n        m = allm.get(h.symbol)\n        if not m:\n            print(f\"  no data for {h.symbol}, skipped\")\n            continue\n        nv = news_view(state, h.symbol, now_iso)\n        rs = get_research(h.symbol, state, knowledge, cfg, now_iso)\n        if abs(rs.score) > abs(nv.score):\n            nv = NewsView(rs.score, \"web news \" + (\"positive\" if rs.score > 0 else \"negative\"),\n                          rs.top[0][1] if rs.top else \"\")\n        alerts += holding_alerts(h, m, regime, cfg, hstates.setdefault(h.key, {}), sent, nv, mkt)\n\n    # 5. Buy setups: chart checks -> free research (15+ articles, 10+ sites) -> paid sources only if needed\n    for m in ranked:\n        if state.get(\"buys_today\", 0) + sum(a.kind == \"buy\" for a in alerts) >= cfg[\"max_buy_alerts_per_day\"]:\n            break\n        if m.symbol in held or m.symbol in MACRO_TICKERS or f\"buy:{m.symbol}\" in sent:\n            continue\n        nv = news_view(state, m.symbol, now_iso)\n        ok, _ = buy_check(m, cfg, regime, nv)\n        if not ok:\n            continue\n        a = evaluate_buy(m, nv, cfg, state, knowledge, budgets, alp, today, now_iso)\n        if a:\n            alerts.append(a)\n            record_buy(knowledge, m.symbol, m.price, today)\n\n    # 6. Ideas: once a day, stocks worth looking into (near-setups + trending in the news)\n    if \"ideas\" not in sent and clock[\"is_open\"]:\n        idea = ideas_alert(ranked, regime, cfg, state, knowledge, now_iso, today)\n        if idea:\n            alerts.append(idea)\n\n    # 7. Close summary\n    mins_left = minutes_until(now_iso, clock.get(\"next_close\", \"\"))\n    if \"summary\" not in sent and mins_left is not None and 0 < mins_left <= cfg[\"summary_minutes_before_close\"]:\n        alerts.append(summary_alert(holdings, allm, ranked, regime, regime_txt, cfg, state, now_iso, knowledge))\n\n    alerts += budgets.notices\n    send_all(alerts, notifier, sent, state)\n    log_alerts(knowledge, alerts, now_iso)\n    if write_files:\n        write_vault(knowledge, state, holdings, allm, alerts, budgets, now_iso)\n        write_dashboard(knowledge, state, cfg, holdings, allm, ranked, regime_txt, budgets, now_iso, True)\n    if not alerts:\n        print(\"No alerts this run.\")\n    return alerts\n\n\ndef evaluate_buy(m: Metrics, nv: NewsView, cfg: dict, state: dict, knowledge: dict, budgets: Budgets,\n                 alp: Alpaca, today: str, now_iso: str) -> Alert | None:\n    \"\"\"Deep check of a stock that passed the chart checks. Free first, paid only when needed.\"\"\"\n    rs = get_research(m.symbol, state, knowledge, cfg, now_iso)\n    print(f\"  {m.symbol}: {rs.line()}\")\n    if rs.score <= cfg[\"news_block_buy_score\"]:\n        print(f\"  {m.symbol}: skipped, web news is negative\")\n        return None\n    extra = [rs.line()] + [f\"  • {x[1]} ({x[2]})\" for x in rs.top[:2]]\n    social = None\n    if research_uncertain(rs):  # free sources couldn't settle it: ask social data\n        social = lunar_social(budgets, m.symbol)\n        if social and social.get(\"sentiment\") is not None:\n            extra.append(f\"Social (LunarCrush): {social['sentiment']}% positive, \"\n                         f\"{social.get('posts') or '?'} posts, trend {social.get('trend') or '?'}.\")\n            if social[\"sentiment\"] < 40:\n                print(f\"  {m.symbol}: skipped, social mood is negative\")\n                return None\n    nxt = earnings_soon(budgets, knowledge, m.symbol, today)\n    if nxt:\n        days = trading_days_until(today, nxt)\n        if days <= cfg[\"earnings_blackout_days\"]:\n            print(f\"  {m.symbol}: skipped, earnings in {days} trading day(s)\")\n            return None\n        extra.append(f\"Next earnings: {nxt} (in {days} trading days). Prices can jump either way that day.\")\n    st = long_stats(alp, knowledge, m.symbol, today)\n    if st:\n        extra.append(stats_line(st))\n    hz = rule_horizon(m, nv if abs(nv.score) >= abs(rs.score) else NewsView(rs.score, \"web news\", \"\"), cfg, st)\n    if hz[\"horizon\"] == \"LONG-TERM\":  # long holds deserve a look at the business (cached a week)\n        fu = av_fundamentals(budgets, knowledge, m.symbol, today) or None\n        fm = fd_metrics(budgets, m.symbol) if not fu else None\n        if fu:\n            up = (fu[\"target\"] / m.price - 1) * 100 if fu.get(\"target\") else None\n            extra.append(f\"Business: P/E {fu.get('pe') or '?'}\"\n                         + (f\", analysts' target {up:+.0f}% away\" if up is not None else \"\")\n                         + (f\", beat earnings {round(fu['beat_rate'] * 100)}% of the last {fu['quarters']} quarters\"\n                            if fu.get(\"beat_rate\") is not None else \"\") + \".\")\n        elif fm:\n            extra.append(\"Business: \" + \", \".join(f\"{k.replace('_', ' ')} {v:.2f}\" for k, v in fm.items()) + \".\")\n    elif hz[\"horizon\"] == \"MEDIUM\" and research_uncertain(rs):\n        ai = ai_horizon(m, nv, cfg, budgets)  # only when everything else is still unclear\n        if ai:\n            hz = ai\n    extra.append(track_line(knowledge))\n    return buy_alert(m, cfg, nv, hz, extra)\n\n\ndef ideas_alert(ranked: list, regime: bool, cfg: dict, state: dict, knowledge: dict, now_iso: str,\n                today: str) -> Alert | None:\n    near = []\n    for m in ranked:\n        if m.symbol in MACRO_TICKERS:\n            continue\n        ok, fails = buy_check(m, cfg, regime, news_view(state, m.symbol, now_iso))\n        if not ok and len(fails) <= 2 and m.rank <= cfg[\"top_n\"]:\n            near.append((m, fails))\n        if len(near) >= 3:\n            break\n    trend = trending_ideas(knowledge, 3)\n    add_dynamic(knowledge, [t[\"symbol\"] for t in trend], today, cfg[\"ideas_watch_days\"], cfg[\"max_extra_watch\"])\n    if not near and not trend:\n        return None\n    lines = []\n    if near:\n        lines.append(\"Almost buy setups (watch these):\")\n        lines += [f\"• {m.symbol} #{m.rank} {money(m.price)}: waiting on {', '.join(f)}\" for m, f in near]\n    if trend:\n        lines.append(\"Trending in the news (positive):\")\n        lines += [f\"• {t['symbol']}: {t['mentions']} stories, e.g. \\\"{t['headline'][:80]}\\\"\" for t in trend]\n        lines.append(f\"The bot will also watch these for {cfg['ideas_watch_days']} days.\")\n    names = \", \".join([m.symbol for m, _ in near] + [t[\"symbol\"] for t in trend])\n    return Alert(\"ideas\", \"ideas\", \"💡 Stocks to look into\", compose(names, lines),\n                 cfg[\"priority_ideas\"], color=COLORS[\"buy\"])\n\n\ndef parse_ts(ts: str) -> datetime:\n    \"\"\"Parses Alpaca timestamps, which can carry 9-digit fractions: 2026-11-18T10:00:00.123456789-05:00\"\"\"\n    ts = ts.replace(\"Z\", \"+00:00\")\n    ts = re.sub(r\"(\\.\\d{6})\\d+\", r\"\\1\", ts)\n    return datetime.fromisoformat(ts)\n\n\ndef minutes_until(now_iso: str, then_iso: str) -> float | None:\n    try:\n        return (parse_ts(then_iso) - parse_ts(now_iso)).total_seconds() / 60\n    except (ValueError, TypeError):\n        return None\n\n\ndef summary_alert(holdings, allm, ranked, regime, regime_txt, cfg, state=None, now_iso=\"\", knowledge=None) -> Alert:\n    state = state or {}\n    lines, total = [], 0.0\n    mkt = news_view(state, MARKET_KEY, now_iso) if now_iso else None\n    for h in holdings:\n        m = allm.get(h.symbol)\n        if m:\n            g = (m.price / h.buy_price - 1) * 100\n            nv = news_view(state, h.symbol, now_iso) if now_iso else None\n            pl = \"\"\n            if h.shares:\n                d = (m.price - h.buy_price) * h.shares\n                total += d\n                pl = f\" ({signed_money(d)})\"\n            lines.append(f\"{h.symbol} {g:+.1f}%{pl} • {hold_advice(m, regime, nv, mkt)[0]}\"\n                         + (f\" • 📰 {nv.label}\" if nv and abs(nv.score) >= 0.4 else \"\"))\n    if not lines:\n        lines.append(\"No holdings logged.\")\n    watch = [m for m in ranked if m.symbol not in MACRO_TICKERS][:5]\n    lines.append(\"Top momentum: \" + \", \".join(m.symbol for m in watch))\n    lines.append(regime_txt[:1].upper() + regime_txt[1:])\n    if mkt and abs(mkt.score) >= 0.4:\n        lines.append(f\"Market news: {mkt.label}\")\n    if knowledge is not None:\n        lines.append(track_line(knowledge))\n    simple = (f\"Open profit/loss: {signed_money(total)} on your stocks.\" if any(h.shares for h in holdings)\n              else f\"{len(holdings)} stock(s) tracked.\")\n    return Alert(\"summary\", \"summary\", \"📊 Close summary\", compose(simple, lines),\n                 cfg[\"priority_summary\"], color=COLORS[\"info\"])\n\n\n# =============================================================================\n# Backtest: buy setup + your fixed exits, on real history\n# =============================================================================\n\n@dataclass\nclass TradeStats:\n    label: str\n    trades: list[float] = field(default_factory=list)\n    days: list[int] = field(default_factory=list)\n\n    def line(self) -> str:\n        t = self.trades\n        if not t:\n            return f\"{self.label:28} no trades\"\n        wins = [x for x in t if x > 0]\n        losses = [x for x in t if x <= 0]\n        gw, gl = sum(wins), -sum(losses)\n        pf = gw / gl if gl else float(\"inf\")\n        return (f\"{self.label:28}{len(t):>7}{len(wins) / len(t) * 100:>8.1f}%\"\n                f\"{(sum(wins) / len(wins) if wins else 0):>+9.2f}%\"\n                f\"{(sum(losses) / len(losses) if losses else 0):>+9.2f}%\"\n                f\"{sum(t) / len(t):>+10.3f}%{pf:>8.2f}{sum(self.days) / len(self.days):>7.1f}\")\n\n\ndef simulate_exit(s: Series, entry_i: int, entry: float, stop_pct: float, tgt_pct: float,\n                  max_days: int, cost_pct: float) -> tuple[float, int]:\n    \"\"\"Bought at the open of entry_i. Returns (% result after costs, days held).\n    If the stop and target are both touched on the same day, assumes the stop hit first.\"\"\"\n    stop, tgt = entry * (1 - stop_pct / 100), entry * (1 + tgt_pct / 100)\n    last = min(len(s) - 1, entry_i + max_days - 1)\n    for j in range(entry_i, last + 1):\n        o = s.o[j] if j > entry_i else entry\n        if o <= stop:\n            return (o / entry - 1) * 100 - cost_pct, j - entry_i + 1   # gapped through the stop\n        if s.l[j] <= stop:\n            return -stop_pct - cost_pct, j - entry_i + 1\n        if o >= tgt:\n            return (o / entry - 1) * 100 - cost_pct, j - entry_i + 1\n        if s.h[j] >= tgt:\n            return tgt_pct - cost_pct, j - entry_i + 1\n    return (s.c[last] / entry - 1) * 100 - cost_pct, last - entry_i + 1\n\n\ndef run_backtest(cfg: dict, data: dict[str, list[dict]], max_days: int = 20,\n                 cost_pct: float = 0.1) -> list[TradeStats]:\n    series = {s: Series.from_bars(b) for s, b in data.items() if len(b) > MIN_HISTORY + 5}\n    if MARKET not in series:\n        raise ValueError(\"backtest needs SPY data\")\n    all_dates = sorted({d for s in series.values() for d in s.dates})\n    idx = {s: {d: i for i, d in enumerate(ser.dates)} for s, ser in series.items()}\n    universe = [s for s in cfg[\"universe\"] if s in series]\n    setup = TradeStats(\"Buy setup, your ±2% exits\")\n    setup_atr = TradeStats(\"Buy setup, 2×ATR/3×ATR exits\")\n    base = TradeStats(\"Any day in uptrend, ±2%\")\n    busy_until: dict[str, int] = {}\n    stop, tgt = cfg[\"stop_pct\"], cfg[\"profit_pct\"]\n    for d in all_dates:\n        ms = []\n        for sym in universe:\n            i = idx[sym].get(d)\n            if i is None or i + 1 >= len(series[sym]):\n                continue\n            m = metrics_at(sym, series[sym], i)\n            if m:\n                ms.append(m)\n        if not ms:\n            continue\n        score_all(ms)\n        si = idx[MARKET].get(d)\n        spy = metrics_at(MARKET, series[MARKET], si) if si is not None else None\n        regime, _ = market_ok(spy)\n        for m in ms:\n            if m.symbol in (MARKET, \"QQQ\"):\n                continue\n            s, i = series[m.symbol], idx[m.symbol][d]\n            entry = s.o[i + 1]\n            if m.price > m.sma50 > m.sma200 and regime and i % 5 == 0:\n                r, n = simulate_exit(s, i + 1, entry, stop, tgt, max_days, cost_pct)\n                base.trades.append(r); base.days.append(n)\n            if busy_until.get(m.symbol, -1) >= i:\n                continue\n            ok, _ = buy_check(m, cfg, regime)\n            if not ok:\n                continue\n            r, n = simulate_exit(s, i + 1, entry, stop, tgt, max_days, cost_pct)\n            setup.trades.append(r); setup.days.append(n)\n            a = m.atr_pct\n            r2, n2 = simulate_exit(s, i + 1, entry, 2 * a, 3 * a, max_days, cost_pct)\n            setup_atr.trades.append(r2); setup_atr.days.append(n2)\n            busy_until[m.symbol] = i + n\n    return [setup, setup_atr, base]\n\n\ndef print_backtest(stats: list[TradeStats], first: str, last: str, max_days: int) -> None:\n    print(f\"\\nBacktest {first} to {last} (max hold {max_days} days, 0.1% cost per trade)\")\n    print(f\"{'':28}{'Trades':>7}{'Win %':>9}{'Avg win':>9}{'Avg loss':>9}\"\n          f\"{'Per trade':>10}{'PF':>8}{'Days':>7}\")\n    for s in stats:\n        print(s.line())\n    print(\"\\nPer trade = average result per trade after costs. Above 0 means the rules made money.\")\n    print(\"PF (profit factor) = total won / total lost. Above 1.2 is decent, below 1.0 loses.\")\n    print(\"With ±2% exits you need to win more than ~53% of trades just to break even after costs.\")\n    print(\"Past results don't predict future results.\")\n\n\n# =============================================================================\n# Commands\n# =============================================================================\n\ndef cmd_scan(cfg, args):\n    alp = Alpaca.from_env(cfg[\"data_feed\"])\n    po = Pushover.from_env(cfg)\n    notifier = po if (po and not args.dry_run) else PrintNotifier()\n    if not po:\n        print(\"(No Pushover keys: alerts will only print here.)\")\n    holdings, errs = load_holdings()\n    state, knowledge = load_state(), load_knowledge()\n    run_scan(cfg, alp, notifier, holdings, state, force=args.force, knowledge=knowledge,\n             write_files=not args.dry_run)\n    if errs:\n        import zlib\n        msg = \"holdings.txt has problems (those lines are ignored):\\n\" + \"\\n\".join(errs)\n        print(msg)\n        key = f\"holdings-error:{zlib.crc32(msg.encode())}\"\n        if key not in state.get(\"sent_today\", []):\n            if notifier.send(Alert(key, \"error\", \"⚠️ Check holdings.txt\", msg[:1000], 1)):\n                state.setdefault(\"sent_today\", []).append(key)\n    if not args.dry_run:\n        save_state(state)\n        save_knowledge(knowledge)\n\n\ndef cmd_report(cfg, args):\n    import copy\n    alp = Alpaca.from_env(cfg[\"data_feed\"])\n    clock = alp.clock()\n    now_iso = clock[\"timestamp\"]\n    today = now_iso[:10]\n    holdings, errs = load_holdings()\n    for e in errs:\n        print(\"holdings.txt:\", e)\n    # Read the news without marking anything as seen (a report never changes the alert memory)\n    state = copy.deepcopy(load_state())\n    state.setdefault(\"news\", {})[\"last\"] = \"\"\n    state[\"news\"][\"seen\"] = []\n    events = []\n    if cfg[\"news\"]:\n        try:\n            events = process_news(alp, cfg, state, set(cfg[\"universe\"]) | {h.symbol for h in holdings}, now_iso)\n        except ApiError as e:\n            print(f\"News check failed: {e}\")\n    symbols = sorted(set(cfg[\"universe\"]) | {h.symbol for h in holdings} | {MARKET})\n    allm = build_metrics(alp, symbols, today, clock[\"is_open\"])\n    ranked = score_all([m for s, m in allm.items() if s in cfg[\"universe\"]])\n    regime, txt = market_ok(allm.get(MARKET))\n    mkt = news_view(state, MARKET_KEY, now_iso)\n    print(f\"\\n{today} • market {'OPEN' if clock['is_open'] else 'closed'} • {txt}\"\n          + (f\" • market news {mkt.score:+.1f} ({mkt.label})\" if mkt.label else \"\") + \"\\n\")\n    print(f\"{'#':>3} {'Sym':6}{'Price':>10}{'Score':>7}{'12-1m':>8}{'6-1m':>7}{'Off hi':>8}\"\n          f\"{'RSI':>5}{'ATR%':>6}{'News':>6}  Buy setup?\")\n    for m in ranked[: args.top]:\n        nv = news_view(state, m.symbol, now_iso)\n        ok, fails = buy_check(m, cfg, regime, nv)\n        extra = f\"  [{rule_horizon(m, nv, cfg)['horizon'].lower()}]\" if ok else \"\"\n        print(f\"{m.rank:>3} {m.symbol:6}{m.price:>10.2f}{m.score:>7.0f}{m.ret_12_1:>+7.0f}%\"\n              f\"{m.ret_6_1:>+6.0f}%{m.from_high_pct:>7.1f}%{m.rsi:>5.0f}{m.atr_pct:>6.1f}{nv.score:>+6.1f}  \"\n              + (\"YES\" + extra if ok else \"no: \" + \"; \".join(fails[:2])))\n    if holdings:\n        print(\"\\nYour holdings:\")\n        for h in holdings:\n            m = allm.get(h.symbol)\n            if not m:\n                print(f\"  {h.symbol}: no data\"); continue\n            g = (m.price / h.buy_price - 1) * 100\n            v, pts, why = hold_advice(m, regime, news_view(state, h.symbol, now_iso), mkt)\n            print(f\"  {h.symbol:6} bought {h.buy_price:.2f} now {m.price:.2f} ({g:+.2f}%)  {v} ({pts:+d})\")\n            print(\"         \" + \" | \".join(why))\n    if events:\n        print(\"\\nBiggest stories (last 24h) for your stocks and the market:\")\n        for ev in sorted(events, key=lambda x: -abs(x.impact))[:12]:\n            arrow = \"▲\" if ev.direction > 0 else \"▼\" if ev.direction < 0 else \"•\"\n            print(f\"  {arrow} {ev.symbol:8}{ev.impact:+5.1f}  {ev.category[:28]:28}  {ev.headline[:90]}\")\n\n\ndef cmd_test_alert(cfg, args):\n    po = Pushover.from_env(cfg)\n    if not po:\n        sys.exit(\"Set PUSHOVER_TOKEN and PUSHOVER_USER first (GitHub secrets or .env).\")\n    t = lambda simple, why: compose(simple, why)\n    samples = [\n        Alert(\"t1\", \"buy\", \"🛒 TEST BUY: XYZ $100.00 • MODERATE risk\",\n              t(\"Buy about $15.00 (~0.15 sh). Medium hold: about 2–6 weeks.\",\n                [\"This is a test. Real buy alerts explain the rank, trend, news and hold time here.\"]),\n              cfg[\"priority_buy\"], sound=cfg[\"sound_buy\"], color=COLORS[\"buy\"]),\n        Alert(\"t2\", \"profit\", \"🟡 TEST SELL OFFER: XYZ +2.1%\", t(\"You hit your +2% target.\", [\"Test.\"]),\n              cfg[\"priority_profit\"], sound=cfg[\"sound_buy\"], color=COLORS[\"yellow\"]),\n        Alert(\"t3\", \"profit8\", \"🔵 TEST SOLID SELL: XYZ +8.3%\", t(\"Solid gain. Selling locks it in.\", [\"Test.\"]),\n              cfg[\"priority_profit\"], sound=cfg[\"sound_buy\"], color=COLORS[\"blue\"]),\n        Alert(\"t4\", \"profit20\", \"🟢 TEST BIG WIN: XYZ +21.0%\", t(\"Huge gain. Strongly consider selling.\", [\"Test.\"]),\n              cfg[\"priority_profit\"], sound=cfg[\"sound_buy\"], color=COLORS[\"green\"]),\n        Alert(\"t5\", \"news\", \"📰 TEST XYZ ▼ bad news\", t(\"Leadership exit. Advice: LEAN SELL.\", [\"Test.\"]),\n              cfg[\"priority_news\"], sound=cfg[\"sound_sell\"], color=COLORS[\"news_bad\"]),\n        Alert(\"t6\", \"stop\", \"🔴 TEST SELL NOW: XYZ -2.1%\",\n              t(\"This is the emergency alert.\", [\"It repeats every minute until you tap Acknowledge.\"]),\n              cfg[\"priority_stop\"], sound=cfg[\"sound_sell\"], color=COLORS[\"red\"]),\n    ]\n    for a in (samples if args.all else samples[:5]):\n        po.send(a)\n    if not args.all:\n        print(\"Add --all to also send the emergency (repeating) alert.\")\n\n\ndef cmd_backtest(cfg, args):\n    alp = Alpaca.from_env(cfg[\"data_feed\"])\n    symbols = sorted(set(cfg[\"universe\"]) | {MARKET})\n    start = date.today() - timedelta(days=int(365.25 * args.years) + 420)\n    print(f\"Downloading {len(symbols)} stocks, {args.years:g} years...\")\n    data = alp.daily_bars(symbols, start)\n    stats = run_backtest(cfg, data, args.max_days)\n    spy = data.get(MARKET, [])\n    print_backtest(stats, spy[MIN_HISTORY][\"t\"][:10] if len(spy) > MIN_HISTORY else \"?\",\n                   spy[-1][\"t\"][:10] if spy else \"?\", args.max_days)\n\n\ndef main(argv=None):\n    p = argparse.ArgumentParser(description=\"Stock Alerts scanner\")\n    p.add_argument(\"--config\", type=Path)\n    sub = p.add_subparsers(dest=\"cmd\", required=True)\n    s = sub.add_parser(\"scan\"); s.add_argument(\"--dry-run\", action=\"store_true\")\n    s.add_argument(\"--force\", action=\"store_true\", help=\"run even if the market is closed\")\n    r = sub.add_parser(\"report\"); r.add_argument(\"--top\", type=int, default=25)\n    t = sub.add_parser(\"test-alert\"); t.add_argument(\"--all\", action=\"store_true\")\n    b = sub.add_parser(\"backtest\"); b.add_argument(\"--years\", type=float, default=5)\n    b.add_argument(\"--max-days\", type=int, default=20)\n    args = p.parse_args(argv)\n    cfg = load_config(args.config)\n    try:\n        {\"scan\": cmd_scan, \"report\": cmd_report, \"test-alert\": cmd_test_alert,\n         \"backtest\": cmd_backtest}[args.cmd](cfg, args)\n    except ApiError as e:\n        sys.exit(f\"Error: {e}\")\n\n\nif __name__ == \"__main__\":\n    main()\n", "test_scanner.py": "\"\"\"Offline tests. Run: python -m unittest test_scanner -v\"\"\"\nimport json\nimport math\nimport os\nimport random\nimport tempfile\nimport threading\nimport unittest\nfrom datetime import date, timedelta\nfrom http.server import BaseHTTPRequestHandler, HTTPServer\nfrom pathlib import Path\nfrom urllib.parse import parse_qs, urlparse\n\nimport scanner as S\n\n\ndef make_bars(closes, start=date(2023, 1, 2), wiggle=0.005, seed=1):\n    rng = random.Random(seed)\n    out, d, prev = [], start, closes[0]\n    for c in closes:\n        while d.weekday() >= 5:\n            d += timedelta(days=1)\n        o = prev\n        hi = max(o, c) * (1 + abs(rng.gauss(0, wiggle)))\n        lo = min(o, c) * (1 - abs(rng.gauss(0, wiggle)))\n        out.append({\"t\": f\"{d.isoformat()}T05:00:00Z\", \"o\": o, \"h\": hi, \"l\": lo, \"c\": c, \"v\": 1000})\n        prev, d = c, d + timedelta(days=1)\n    return out\n\n\ndef trend(n, start=100.0, daily=0.001, noise=0.0, seed=0):\n    rng = random.Random(seed)\n    p, out = start, []\n    for _ in range(n):\n        p *= math.exp(daily + rng.gauss(0, noise)); out.append(p)\n    return out\n\n\nCFG = S.load_config(Path(S.__file__).parent / \"config.json\")\n\n\nclass Indicators(unittest.TestCase):\n    def test_sma(self):\n        self.assertEqual(S.sma_series([1, 2, 3, 4], 2), [None, 1.5, 2.5, 3.5])\n\n    def test_rsi_extremes(self):\n        self.assertEqual(S.rsi_series(list(range(1, 40)))[-1], 100.0)\n        self.assertLess(S.rsi_series(list(range(40, 1, -1)))[-1], 1.0)\n\n    def test_rsi_known_value(self):\n        # Classic Wilder example closes (first RSI ~70.53)\n        c = [44.34, 44.09, 44.15, 43.61, 44.33, 44.83, 45.10, 45.42, 45.84, 46.08, 45.89,\n             46.03, 45.61, 46.28, 46.28]\n        self.assertAlmostEqual(S.rsi_series(c)[14], 70.53, delta=0.1)\n\n    def test_atr_and_rolling_max(self):\n        h, l, c = [10] * 20, [9] * 20, [9.5] * 20\n        self.assertAlmostEqual(S.atr_series(h, l, c)[-1], 1.0)\n        self.assertEqual(S.rolling_max([1, 5, 2, 3, 1, 0], 3), [1, 5, 5, 5, 3, 3])\n\n    def test_pct_ranks(self):\n        self.assertEqual(S.pct_ranks([10, 30, 20]), [0.0, 100.0, 50.0])\n        self.assertEqual(S.pct_ranks([1, 1]), [50.0, 50.0])\n\n\nclass MetricsAndScoring(unittest.TestCase):\n    def test_needs_a_year(self):\n        s = S.Series.from_bars(make_bars(trend(200)))\n        self.assertIsNone(S.metrics_at(\"X\", s, len(s) - 1))\n\n    def test_momentum_math(self):\n        s = S.Series.from_bars(make_bars(trend(300, daily=0.001)))\n        m = S.metrics_at(\"X\", s, len(s) - 1)\n        self.assertAlmostEqual(m.ret_12_1, (math.exp(0.001 * 231) - 1) * 100, places=4)\n        self.assertGreater(m.sma50, m.sma200)\n\n    def test_live_price_override(self):\n        s = S.Series.from_bars(make_bars(trend(300)))\n        m = S.metrics_at(\"X\", s, len(s) - 1, price=999.0)\n        self.assertEqual(m.price, 999.0)\n        self.assertEqual(m.prev_close, s.c[-1])\n        self.assertEqual(m.high_52w, 999.0)\n\n    def test_ranking_prefers_stronger(self):\n        ms = []\n        for sym, d in ((\"FAST\", 0.002), (\"MID\", 0.001), (\"SLOW\", -0.0005)):\n            s = S.Series.from_bars(make_bars(trend(300, daily=d)))\n            ms.append(S.metrics_at(sym, s, len(s) - 1))\n        ranked = S.score_all(ms)\n        self.assertEqual([m.symbol for m in ranked], [\"FAST\", \"MID\", \"SLOW\"])\n        self.assertEqual(ranked[0].rank, 1)\n        self.assertEqual(ranked[0].of, 3)\n\n\ndef mk(**kw):\n    base = dict(symbol=\"X\", price=105, prev_close=104, sma20=102, sma50=100, sma200=90,\n                sma200_prev=88, rsi=60, atr_pct=1.5, ret_12_1=40, ret_6_1=20, high_52w=108,\n                score=90, rank=1, of=70)\n    base.update(kw)\n    return S.Metrics(**base)\n\n\nclass BuyRules(unittest.TestCase):\n    def test_clean_setup_passes(self):\n        ok, fails = S.buy_check(mk(), CFG, True)\n        self.assertTrue(ok, fails)\n\n    def test_each_filter(self):\n        cases = {\n            \"market\": (mk(), False),\n            \"rank\": (mk(rank=40), True),\n            \"uptrend\": (mk(sma50=110), True),\n            \"200-day\": (mk(sma200_prev=95), True),\n            \"52w\": (mk(high_52w=130), True),\n            \"RSI\": (mk(rsi=80), True),\n            \"below 20\": (mk(sma20=106), True),\n            \"extended\": (mk(sma20=95), True),\n            \"jumpy\": (mk(atr_pct=4.0), True),\n            \"red\": (mk(prev_close=106), True),\n        }\n        for name, (m, regime) in cases.items():\n            ok, fails = S.buy_check(m, CFG, regime)\n            self.assertFalse(ok, name)\n            self.assertEqual(len(fails), 1, f\"{name}: {fails}\")\n\n    def test_buy_alert_text(self):\n        a = S.buy_alert(mk(atr_pct=2.6), CFG)\n        self.assertIn(\"🛒 BUY: X\", a.title)\n        self.assertIn(\"HIGHER risk\", a.title)\n        self.assertIn(\"$102.90\", a.message)   # stop\n        self.assertIn(\"$107.10\", a.message)   # +2%\n        self.assertIn(\"stop out on noise\", a.message)\n        self.assertIn(\"X 105.00\", a.message)\n        self.assertLessEqual(len(a.message), 1024)\n\n    def test_market_regime(self):\n        self.assertTrue(S.market_ok(mk(price=110, sma200=100))[0])\n        self.assertFalse(S.market_ok(mk(price=95, sma200=100))[0])\n        self.assertFalse(S.market_ok(None)[0])\n\n\nclass HoldAdvice(unittest.TestCase):\n    def test_strong(self):\n        v, pts, _ = S.hold_advice(mk(), True)\n        self.assertTrue(v.startswith(\"HOLD: strong\"), (v, pts))\n\n    def test_breaking(self):\n        v, _, why = S.hold_advice(mk(price=95, sma20=100, sma50=99, sma200=101, rsi=35, rank=60), False)\n        self.assertTrue(v.startswith(\"SELL\"), v)\n        self.assertTrue(any(\"50-day\" in w for w in why))\n\n    def test_overbought_lowers_score(self):\n        _, a, _ = S.hold_advice(mk(rsi=60), True)\n        _, b, _ = S.hold_advice(mk(rsi=85), True)\n        self.assertLess(b, a)\n\n\nclass YourSellRules(unittest.TestCase):\n    \"\"\"Walks a price path through your rules and checks exactly which alerts fire.\"\"\"\n    def walk(self, prices, entry=100.0, days=None):\n        h = S.Holding(\"NVDA\", entry, \"2026-11-18\", 0.5)\n        hstate, sent, fired = {}, set(), []\n        for k, p in enumerate(prices):\n            if days and k in days:\n                sent = set()  # new trading day\n            for a in S.holding_alerts(h, mk(symbol=\"NVDA\", price=p), True, CFG, hstate, sent):\n                fired.append((p, a.kind, a.priority))\n                sent.add(a.key)\n        return fired\n\n    def test_stop_at_minus_2(self):\n        f = self.walk([100, 99.0, 98.4, 97.9, 97.5, 97.0])\n        kinds = [k for _, k, _ in f]\n        self.assertEqual(kinds, [\"near\", \"stop\"])\n        self.assertEqual(f[-1][2], 2)        # emergency priority\n        self.assertEqual(f[-1][0], 97.9)     # fired the first time it crossed -2%\n\n    def test_not_sold_between_0_and_minus_2(self):\n        f = self.walk([100, 99.5, 99.0, 98.6, 99.2, 100.1])\n        self.assertNotIn(\"stop\", [k for _, k, _ in f])\n\n    def test_profit_offer_and_steps(self):\n        f = self.walk([100, 101, 102.1, 102.5, 103, 104.2, 103, 106.5])\n        self.assertEqual([(p, k) for p, k, _ in f if k == \"profit\"],\n                         [(102.1, \"profit\"), (104.2, \"profit\"), (106.5, \"profit\")])\n\n    def test_warning_when_gain_fades(self):\n        f = self.walk([100, 101, 102.5, 101.5, 100.4, 100.2, 101.8, 100.3])\n        warns = [p for p, k, _ in f if k == \"warn\"]\n        self.assertEqual(warns, [100.4, 100.3])   # fires once, re-arms after +1.5%, fires again\n\n    def test_no_warning_if_never_up(self):\n        f = self.walk([100, 100.3, 100.1, 100.4])\n        self.assertEqual(f, [])\n\n    def test_stop_once_per_day_then_again_next_day(self):\n        f = self.walk([97.5, 97.0, 96.0, 97.2], days={2})\n        self.assertEqual([k for _, k, _ in f], [\"stop\", \"stop\"])\n\n    def test_fast_drop_from_profit_sends_one_alert(self):\n        f = self.walk([100, 102.5, 98.3])\n        self.assertEqual([k for _, k, _ in f], [\"profit\", \"near\"])\n\n    def test_messages_fit_pushover(self):\n        h = S.Holding(\"NVDA\", 100.0, \"\", 0.5)\n        for p in (97, 98.3, 103):\n            for a in S.holding_alerts(h, mk(price=p), True, CFG, {\"warn_armed\": True}, set()):\n                self.assertLessEqual(len(a.message), 1024)\n                self.assertLessEqual(len(a.title), 250)\n\n\nclass HoldingsFile(unittest.TestCase):\n    def test_formats(self):\n        hs, errs = S.parse_holdings(\"# x\\nnvda 182.5\\nAMD $1,155.60 2026-11-18 0.19\\n\\nBRK.B 500 # note\\n\")\n        self.assertEqual([(h.symbol, h.buy_price, h.bought, h.shares) for h in hs],\n                         [(\"NVDA\", 182.5, \"\", None), (\"AMD\", 1155.6, \"2026-11-18\", 0.19),\n                          (\"BRK.B\", 500.0, \"\", None)])\n        self.assertEqual(errs, [])\n\n    def test_errors_are_friendly(self):\n        hs, errs = S.parse_holdings(\"NVDA\\nAMD abc\\n123 5\\nTSLA -4\")\n        self.assertEqual(hs, [])\n        self.assertEqual(len(errs), 4)\n        self.assertIn(\"SYMBOL PRICE\", errs[0])\n        self.assertIn(\"isn't a number\", errs[1])\n\n    def test_shipped_template_is_empty(self):\n        hs, errs = S.load_holdings(Path(S.__file__).parent / \"holdings.txt\")\n        self.assertEqual((hs, errs), ([], []))\n\n\nclass Pushover(unittest.TestCase):\n    def test_payload(self):\n        p = S.Pushover(\"tok\", \"usr\", CFG)\n        f = p.payload(S.Alert(\"k\", \"stop\", \"T\", \"M\" * 2000, 2, \"X\", \"siren\", \"http://u\", \"chart\"))\n        self.assertEqual(f[\"priority\"], \"2\")\n        self.assertEqual(f[\"retry\"], \"60\")\n        self.assertEqual(f[\"expire\"], \"900\")\n        self.assertLessEqual(len(f[\"message\"]), 1024)\n        self.assertEqual(f[\"html\"], \"1\")\n        f1 = p.payload(S.Alert(\"k\", \"buy\", \"T\", \"M\", 1))\n        self.assertNotIn(\"retry\", f1)\n\n\nclass Backtest(unittest.TestCase):\n    def test_exit_simulation(self):\n        s = S.Series.from_bars([\n            {\"t\": \"2026-01-01T\", \"o\": 100, \"h\": 101, \"l\": 99, \"c\": 100},\n            {\"t\": \"2026-01-02T\", \"o\": 100, \"h\": 102.5, \"l\": 99.5, \"c\": 102},\n            {\"t\": \"2026-01-03T\", \"o\": 95, \"h\": 96, \"l\": 94, \"c\": 95},\n        ])\n        self.assertEqual(S.simulate_exit(s, 0, 100, 2, 2, 10, 0), (2.0, 2))          # target day 2\n        r, n = S.simulate_exit(s, 0, 100, 2, 5, 10, 0)                                  # gap below stop\n        self.assertAlmostEqual(r, -5.0); self.assertEqual(n, 3)\n        both = S.Series.from_bars([{\"t\": \"x\", \"o\": 100, \"h\": 103, \"l\": 97, \"c\": 100}])\n        self.assertEqual(S.simulate_exit(both, 0, 100, 2, 2, 10, 0), (-2.0, 1))      # stop first\n        self.assertEqual(S.simulate_exit(both, 0, 100, 2, 2, 10, 0.1), (-2.1, 1))    # costs\n\n    def test_runs_on_synthetic_market(self):\n        data = {\"SPY\": make_bars(trend(700, daily=0.0005, noise=0.008, seed=9))}\n        for k in range(12):\n            data[f\"S{k}\"] = make_bars(trend(700, daily=0.0002 * k, noise=0.012, seed=k), seed=k)\n        cfg = dict(CFG, universe=list(data))\n        stats = S.run_backtest(cfg, data)\n        self.assertEqual(len(stats), 3)\n        self.assertGreater(len(stats[2].trades), 0)\n        for st in stats:\n            for r in st.trades:\n                self.assertTrue(-60 < r < 60)\n\n\n# ---------------------------------------------------------------------------\n# End to end against fake Alpaca + fake Pushover servers\n# ---------------------------------------------------------------------------\n\nclass Fake(BaseHTTPRequestHandler):\n    world = {}\n    pushes = []\n    calls = []\n\n    def log_message(self, *a):\n        pass\n\n    def reply(self, obj, code=200):\n        b = json.dumps(obj).encode()\n        self.send_response(code); self.send_header(\"Content-Type\", \"application/json\")\n        self.end_headers(); self.wfile.write(b)\n\n    def do_GET(self):\n        u = urlparse(self.path); q = {k: v[0] for k, v in parse_qs(u.query).items()}\n        if u.path.startswith(\"/v2/\") and self.headers.get(\"APCA-API-KEY-ID\") != \"K\":\n            return self.reply({\"message\": \"forbidden\"}, 403)\n        if u.path == \"/v2/clock\":\n            return self.reply(self.world[\"clock\"])\n        syms = q.get(\"symbols\", \"\").split(\",\")\n        if u.path == \"/v2/stocks/bars\":\n            # two pages to exercise pagination\n            bars = {s: self.world[\"bars\"][s] for s in syms if s in self.world[\"bars\"]}\n            if \"page_token\" not in q:\n                first = {s: b[:200] for s, b in bars.items()}\n                return self.reply({\"bars\": first, \"next_page_token\": \"p2\"})\n            return self.reply({\"bars\": {s: b[200:] for s, b in bars.items()}, \"next_page_token\": None})\n        if u.path in (\"/rss/search\", \"/rss/2.0/headline\"):\n            key = \"gnews\" if u.path == \"/rss/search\" else \"yahoo\"\n            Fake.calls.append(key)\n            body = self.world.get(key, \"<rss><channel><\/channel><\/rss>\").encode()\n            self.send_response(200); self.send_header(\"Content-Type\", \"application/rss+xml\")\n            self.end_headers(); self.wfile.write(body); return\n        if u.path == \"/query\":\n            Fake.calls.append(\"av:\" + q.get(\"function\", \"\"))\n            r = self.world.get(\"av\", {}).get(q.get(\"function\"), {\"Information\": \"premium endpoint\"})\n            if isinstance(r, str):\n                self.send_response(200); self.end_headers(); self.wfile.write(r.encode()); return\n            return self.reply(r)\n        if u.path.startswith(\"/public/topic/\"):\n            Fake.calls.append(\"lunar\")\n            r = self.world.get(\"lunar\")\n            return self.reply(r) if r is not None else self.reply({\"error\": \"limit\"}, 429)\n        if u.path == \"/financial-metrics/snapshot\":\n            Fake.calls.append(\"fd\")\n            r = self.world.get(\"fd\")\n            return self.reply(r) if r is not None else self.reply({\"error\": \"Payment Required\"}, 402)\n        if u.path == \"/v1beta1/news\":\n            if \"news\" not in self.world:\n                return self.reply({\"message\": \"not found\"}, 404)\n            return self.reply({\"news\": self.world[\"news\"], \"next_page_token\": None})\n        if u.path == \"/v2/stocks/snapshots\":\n            return self.reply({s: {\"latestTrade\": {\"p\": self.world[\"live\"][s]}}\n                               for s in syms if s in self.world[\"live\"]})\n        self.reply({\"message\": \"nope\"}, 404)\n\n    claude_calls = []\n\n    def do_POST(self):\n        n = int(self.headers.get(\"Content-Length\") or 0)\n        raw = self.rfile.read(n).decode()\n        if self.path.startswith(\"/v1/messages\"):\n            body = json.loads(raw)\n            Fake.claude_calls.append(body)\n            reply = self.world.get(\"claude_reply\")\n            if callable(reply):\n                reply = reply(body)\n            if reply is None:\n                return self.reply({\"error\": \"overloaded\"}, 529)\n            return self.reply({\"content\": [{\"type\": \"text\", \"text\": reply}]})\n        form = {k: v[0] for k, v in parse_qs(raw).items()}\n        Fake.pushes.append(form)\n        self.reply({\"status\": 1, \"request\": \"abc\"})\n\n\nclass EndToEnd(unittest.TestCase):\n    @classmethod\n    def setUpClass(cls):\n        cls.srv = HTTPServer((\"127.0.0.1\", 0), Fake)\n        threading.Thread(target=cls.srv.serve_forever, daemon=True).start()\n        base = f\"http://127.0.0.1:{cls.srv.server_address[1]}\"\n        cls._orig = (S.TRADING_URL, S.DATA_URL, S.PUSHOVER_URL, S.CLAUDE_URL, S.AV_URL, S.LUNAR_URL,\n                     S.FD_URL, S.GNEWS_URL, S.YAHOO_RSS_URL)\n        S.TRADING_URL = S.DATA_URL = S.LUNAR_URL = S.FD_URL = base\n        S.PUSHOVER_URL = base + \"/1/messages.json\"\n        S.CLAUDE_URL = base + \"/v1/messages\"\n        S.AV_URL = base + \"/query\"\n        S.GNEWS_URL = base + \"/rss/search\"\n        S.YAHOO_RSS_URL = base + \"/rss/2.0/headline\"\n\n    @classmethod\n    def tearDownClass(cls):\n        (S.TRADING_URL, S.DATA_URL, S.PUSHOVER_URL, S.CLAUDE_URL, S.AV_URL, S.LUNAR_URL,\n         S.FD_URL, S.GNEWS_URL, S.YAHOO_RSS_URL) = cls._orig\n        cls.srv.shutdown()\n\n    def setUp(self):\n        Fake.pushes, Fake.claude_calls, Fake.calls = [], [], []\n        for k in (\"ANTHROPIC_API_KEY\", \"ALPHAVANTAGE_API_KEY\", \"LUNARCRUSH_API_KEY\", \"FINANCIAL_DATASETS_API_KEY\"):\n            os.environ.pop(k, None)\n        closes = {\"SPY\": trend(320, daily=0.0006)}\n        # A clean leader: steady uptrend, small pullback near the end, green today\n        lead = trend(300, daily=0.0025) + trend(20, start=1, daily=-0.0005)\n        lead = lead[:300] + [lead[299] * x for x in lead[300:]]\n        closes[\"LEAD\"] = lead\n        for k in range(10):\n            closes[f\"S{k}\"] = trend(320, daily=-0.0003 + 0.0001 * k, noise=0.01, seed=k)\n        closes[\"HELD\"] = trend(320, daily=0.001)\n        bars = {s: make_bars(c, wiggle=0.002) for s, c in closes.items()}\n        today = \"2030-01-15\"\n        live = {s: c[-1] for s, c in closes.items()}\n        live[\"LEAD\"] = closes[\"LEAD\"][-1] * 1.012      # bounces back above its 20-day today\n        live[\"HELD\"] = 100 * 0.979                     # holding is down 2.1% -> SELL NOW\n        Fake.world = {\n            \"clock\": {\"timestamp\": f\"{today}T14:40:00.123456789-05:00\", \"is_open\": True,\n                      \"next_open\": \"2030-01-16T09:30:00-05:00\", \"next_close\": f\"{today}T16:00:00-05:00\"},\n            \"bars\": bars, \"live\": live,\n        }\n        self.cfg = dict(CFG, universe=[\"SPY\", \"LEAD\"] + [f\"S{k}\" for k in range(10)], top_n=3,\n                        max_atr_pct=10)\n\n    def scan(self, state, holdings):\n        alp = S.Alpaca(\"K\", \"SECRET\")\n        po = S.Pushover(\"tok\", \"usr\", self.cfg)\n        return S.run_scan(self.cfg, alp, po, holdings, state)\n\n    def test_full_scan(self):\n        state = {}\n        holdings = [S.Holding(\"HELD\", 100.0, \"2030-01-10\", 1)]\n        alerts = self.scan(state, holdings)\n        kinds = sorted(a.kind for a in alerts)\n        self.assertIn(\"stop\", kinds)\n        self.assertIn(\"buy\", kinds)\n        stop = next(p for p in Fake.pushes if \"SELL NOW\" in p[\"title\"])\n        self.assertEqual(stop[\"priority\"], \"2\")\n        self.assertEqual(stop[\"retry\"], \"60\")\n        buy = next(p for p in Fake.pushes if \"🛒 BUY\" in p[\"title\"])\n        self.assertIn(\"LEAD\", buy[\"title\"])\n        self.assertEqual(state[\"day\"], \"2030-01-15\")\n\n        # Second run same day: no repeats\n        Fake.pushes = []\n        self.assertEqual(self.scan(state, holdings), [])\n        self.assertEqual(Fake.pushes, [])\n\n    def test_summary_near_close(self):\n        Fake.world[\"clock\"][\"timestamp\"] = \"2030-01-15T15:45:00-05:00\"\n        alerts = self.scan({}, [])\n        self.assertIn(\"summary\", [a.kind for a in alerts])\n\n    def test_market_closed_does_nothing(self):\n        Fake.world[\"clock\"][\"is_open\"] = False\n        self.assertEqual(self.scan({}, []), [])\n        self.assertEqual(Fake.pushes, [])\n\n    def test_weak_market_blocks_buys(self):\n        spy = trend(300, daily=0.0005) + trend(20, start=1, daily=-0.012)\n        spy = spy[:300] + [spy[299] * x for x in spy[300:]]\n        Fake.world[\"bars\"][\"SPY\"] = make_bars(spy)\n        Fake.world[\"live\"][\"SPY\"] = spy[-1]\n        alerts = self.scan({}, [])\n        self.assertNotIn(\"buy\", [a.kind for a in alerts])\n\n    def test_sold_holding_memory_is_cleared(self):\n        state = {\"holdings\": {\"OLD|1|\": {\"profit_level\": 2}}}\n        self.scan(state, [])\n        self.assertNotIn(\"OLD|1|\", state[\"holdings\"])\n\n    def test_todays_partial_bar_is_dropped(self):\n        b = Fake.world[\"bars\"][\"LEAD\"]\n        b.append(dict(b[-1], t=\"2030-01-15T05:00:00Z\", c=1.0))   # bogus partial bar for today\n        alerts = self.scan({}, [])\n        self.assertIn(\"LEAD\", [a.symbol for a in alerts if a.kind == \"buy\"])\n\n\nclass Workflow(unittest.TestCase):\n    def test_workflow_file(self):\n        y = (Path(S.__file__).parent / \".github/workflows/scan.yml\").read_text()\n        self.assertIn('cron: \"7,22,37,52 13-21 * * 1-5\"', y)\n        self.assertIn(\"contents: write\", y)\n        for sec in (\"APCA_API_KEY_ID\", \"APCA_API_SECRET_KEY\", \"PUSHOVER_TOKEN\", \"PUSHOVER_USER\"):\n            self.assertIn(f\"secrets.{sec}\", y)\n        self.assertNotIn(\"${{ inputs.command }}\\n\", y.split(\"run: |\")[1])  # no inline injection\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n\n\n# ---------------------------------------------------------------------------\n# News, sizing, colors, hold time\n# ---------------------------------------------------------------------------\n\nclass NewsRules(unittest.TestCase):\n    def r(self, h, summ=\"\"):\n        return S.rate_headline(h, summ)\n\n    def test_ceo_scandal_is_large_negative(self):\n        d, st, conf, cat = self.r(\"Nvidia CEO Jensen Huang resigns after reports of affair with alleged spy\")\n        self.assertEqual((d, st), (-1, 3))\n        self.assertIn(\"leadership exit\", cat)\n        self.assertIn(\"scandal\", cat)\n\n    def test_beat_and_raise_is_positive(self):\n        d, st, conf, _ = self.r(\"Nvidia beats estimates, raises guidance on AI demand\")\n        self.assertEqual((d, st), (1, 3))\n        self.assertAlmostEqual(conf, 0.7)\n\n    def test_beat_but_cut_guidance_is_mixed(self):\n        d, st, conf, cat = self.r(\"Retailer beats estimates but cuts guidance for holiday quarter\")\n        self.assertEqual(d, 0)\n        self.assertTrue(cat.startswith(\"mixed\"))\n\n    def test_rumors_and_opinion_get_low_confidence(self):\n        self.assertAlmostEqual(self.r(\"Apple reportedly in talks for takeover bid of studio\")[2], 0.4)\n        self.assertAlmostEqual(self.r(\"Why is Tesla stock down after the downgrade?\")[2], 0.25)\n\n    def test_macro_and_misc(self):\n        self.assertEqual(self.r(\"Fed cuts rates by a quarter point\")[0], 1)\n        self.assertEqual(self.r(\"Inflation heats up again in October CPI\")[0], -1)\n        self.assertEqual(self.r(\"FDA approves Lilly's new drug\")[:2], (1, 3))\n        self.assertEqual(self.r(\"Analyst downgrades Apple to neutral\")[:2], (-1, 1))\n        self.assertIsNone(self.r(\"Company to present at investor conference\"))\n\n    def test_word_boundaries(self):\n        self.assertIsNone(self.r(\"Spyglass Partners hosts webinar\"))   # 'spy' only as a whole word\n        self.assertIsNone(self.r(\"Quarterly webinar scheduled\"))\n\n\nclass NewsMemory(unittest.TestCase):\n    def test_decay(self):\n        state = {\"news\": {\"events\": {\"X\": [[\"2030-01-15T10:00:00Z\", -2.0, \"scandal\", \"h\"]]}}}\n        now = S.news_view(state, \"X\", \"2030-01-15T10:00:00Z\")\n        day = S.news_view(state, \"X\", \"2030-01-16T10:00:00Z\")\n        self.assertAlmostEqual(now.score, -2.0)\n        self.assertAlmostEqual(day.score, -1.0)\n        self.assertEqual(day.label, \"scandal\")\n        self.assertEqual(S.news_view(state, \"Y\", \"2030-01-15T10:00:00Z\").score, 0.0)\n\n\nclass Sizing(unittest.TestCase):\n    def test_small_account(self):\n        d, sh = S.position_size(100.0, CFG)            # $30 acct, 1% risk / 2% stop = $15, cap 50% = $15\n        self.assertEqual(d, 15.0)\n        self.assertAlmostEqual(sh, 0.15)\n\n    def test_cap_wins(self):\n        d, _ = S.position_size(50.0, dict(CFG, account_size=1000, risk_per_trade_pct=2))   # by risk $1000 -> cap $500\n        self.assertEqual(d, 500.0)\n\n    def test_risk_labels_and_level_filter(self):\n        self.assertEqual([S.risk_label(x) for x in (1.0, 2.0, 3.0)], [\"LOW\", \"MODERATE\", \"HIGHER\"])\n        ok, fails = S.buy_check(mk(atr_pct=2.0), dict(CFG, risk_level=\"low\"), True)\n        self.assertFalse(ok)\n        self.assertIn(\"low risk\", fails[0])\n        self.assertTrue(S.buy_check(mk(atr_pct=2.0), CFG, True)[0])\n\n    def test_buy_alert_first_line_is_simple(self):\n        a = S.buy_alert(mk(), CFG, S.NewsView(1.2, \"analyst upgrade\", \"Firm upgrades X\"))\n        first = a.message.split(\"\\n\")[0]\n        self.assertIn(\"Buy about $15.00\", first)\n        self.assertIn(\"hold:\", first)\n        self.assertIn(\"WHY\", a.message)\n        self.assertIn(\"analyst upgrade\", a.message)\n        self.assertIn(\"-$0.30\", a.message)        # loss at the -2% stop on $15\n        self.assertIn(\"+$0.30\", a.message)        # +2% on $15\n\n\nclass NewsInDecisions(unittest.TestCase):\n    def test_bad_news_blocks_buy(self):\n        ok, fails = S.buy_check(mk(), CFG, True, S.NewsView(-1.5, \"scandal\", \"h\"))\n        self.assertFalse(ok)\n        self.assertIn(\"bad news\", fails[0])\n\n    def test_bad_news_turns_hold_into_sell(self):\n        base = S.hold_advice(mk(rank=30), True)[1]\n        v, pts, why = S.hold_advice(mk(rank=30), True, S.NewsView(-2.0, \"leadership exit\", \"h\"))\n        self.assertEqual(pts, base - 2)\n        self.assertTrue(why[0].startswith(\"✗ bad news\"))\n\n\nclass ProfitColors(unittest.TestCase):\n    def walk(self, prices):\n        h = S.Holding(\"AMD\", 100.0, \"\", 1)\n        st, out = {}, []\n        for p in prices:\n            out += [a for a in S.holding_alerts(h, mk(symbol=\"AMD\", price=p), True, CFG, st, set())]\n        return out\n\n    def test_tiers(self):\n        al = self.walk([102.2, 108.5, 121.0])\n        self.assertEqual([a.kind for a in al], [\"profit\", \"profit8\", \"profit20\"])\n        self.assertTrue(al[0].title.startswith(\"🟡 SELL OFFER\"))\n        self.assertTrue(al[1].title.startswith(\"🔵 SOLID SELL\"))\n        self.assertTrue(al[2].title.startswith(\"🟢 BIG WIN\"))\n        self.assertEqual(al[1].color, S.COLORS[\"blue\"])\n        self.assertEqual(al[2].color, S.COLORS[\"green\"])\n        self.assertIn(\"+$8.50 on your 1 sh\", al[1].message.split(\"\\n\")[0])\n\n    def test_html(self):\n        a = S.Alert(\"k\", \"x\", \"T\", \"Up <5%> & more\\n\\nWHY\\nline <b>\", 1, color=\"#2563eb\")\n        h = S.to_html(a)\n        self.assertTrue(h.startswith('<font color=\"#2563eb\"><b>Up &lt;5%&gt; &amp; more<\/b><\/font>'))\n        self.assertIn(\"<b>WHY<\/b>\", h)\n        self.assertIn(\"line &lt;b&gt;\", h)\n\n\nclass HoldTime(unittest.TestCase):\n    def test_rules(self):\n        self.assertEqual(S.rule_horizon(mk(rsi=70), None, CFG)[\"horizon\"], \"SHORT-TERM\")\n        self.assertEqual(S.rule_horizon(mk(), S.NewsView(1.0, \"earnings beat\", \"h\"), CFG)[\"horizon\"], \"SHORT-TERM\")\n        self.assertEqual(S.rule_horizon(mk(price=103, sma20=101), None, CFG)[\"horizon\"], \"LONG-TERM\")\n        self.assertEqual(S.rule_horizon(mk(price=103, sma20=101, ret_12_1=10), None, CFG)[\"horizon\"], \"MEDIUM\")\n\n\nclass ClaudeFeatures(unittest.TestCase):\n    \"\"\"Claude rater + hold-time check against a fake API (no real calls).\"\"\"\n    @classmethod\n    def setUpClass(cls):\n        EndToEnd.setUpClass.__func__(cls)\n\n    @classmethod\n    def tearDownClass(cls):\n        EndToEnd.tearDownClass.__func__(cls)\n\n    def setUp(self):\n        Fake.claude_calls = []\n        os.environ[\"ANTHROPIC_API_KEY\"] = \"sk-test\"\n\n    def tearDown(self):\n        os.environ.pop(\"ANTHROPIC_API_KEY\", None)\n\n    def test_rater_parses_and_caps_confidence(self):\n        Fake.world = {\"claude_reply\": 'Here you go: [{\"id\":\"1\",\"symbol\":\"NVDA\",\"category\":\"leadership\",'\n                                      '\"direction\":-1,\"strength\":3,\"confidence\":0.99,\"why\":\"CEO out\"}]'}\n        r = S.rate_with_claude([{\"id\": \"1\", \"symbols\": [\"NVDA\"], \"headline\": \"h\", \"summary\": \"\"}], CFG)\n        self.assertEqual(r[(\"1\", \"NVDA\")][\"confidence\"], 0.85)\n        body = Fake.claude_calls[0]\n        self.assertEqual(body[\"model\"], \"claude-haiku-5-5\")\n        self.assertIn(\"never add outside facts\", body[\"system\"])\n\n    def test_rater_failure_falls_back(self):\n        Fake.world = {\"claude_reply\": None}\n        self.assertIsNone(S.rate_with_claude([{\"id\": \"1\", \"symbols\": [\"X\"], \"headline\": \"h\", \"summary\": \"\"}], CFG))\n        Fake.world = {\"claude_reply\": \"sorry, no js
