s.\n\n### 4. GitHub: runs it with your PC off\n1. Make a free account at **github.com**. Click **+ → New repository**, name it `stock-alerts`, choose **Private**, and create it empty.\n2. Click **uploading an existing file**, drag in **everything in this folder** (including the `.github` folder), then **Commit changes**.\n3. Check that `.github/workflows/scan.yml` shows up in the repo.\n\n### 5. Add your keys as secrets\nIn the repo: **Settings → Secrets and variables → Actions → New repository secret**\n\n| Name | Value |\n|---|---|\n| `APCA_API_KEY_ID` | Alpaca key ID |\n| `APCA_API_SECRET_KEY` | Alpaca secret |\n| `PUSHOVER_TOKEN` | Pushover API token |\n| `PUSHOVER_USER` | Pushover user key |\n| `ANTHROPIC_API_KEY` | Claude API key (optional) |\n\n### 6. Test it\nIn **Actions → Stock scanner → Run workflow**:\n- **`test-alert`**: 6 sample alerts (🛒 🟡 🔵 🟢 📰 🔴). The last one repeats until you tap Acknowledge.\n- **`report`**: today's rankings, a News column, your holdings with advice, and the biggest stories of the last 24 hours.\n- **`backtest`**: how the buy setup and your ±2% rules did on 5 years of real prices.\n\n### 7. Make \"Log your buy\" work\nIn `config.json`, set:\n```json\n\"holdings_edit_url\": \"https://github.com/YOUR-USERNAME/stock-alerts/edit/main/holdings.txt\",\n```\n\n### 8. Link Robinhood (optional, recommended): no more typing buys\nRobinhood has no official API, so the bot reads your account through **SnapTrade Personal**\n(free for personal use, read-only for this bot: it never places trades).\n1. Make an account at https://snaptrade.com/personal and turn on two-factor login.\n2. In the SnapTrade dashboard, connect Robinhood.\n3. On the **API Key** page, create a Personal key. Copy the client ID and consumer key.\n4. Add GitHub secrets `SNAPTRADE_CLIENT_ID` and `SNAPTRADE_CONSUMER_KEY`.\n\nEvery scan then reads your Robinhood stocks (average cost and shares) and alerts with your rules.\nYou get a 🧾 note when a new buy shows up and ✅ when a stock is sold. SnapTrade re-reads Robinhood\nwhen the bot asks (every 30 minutes, `broker_refresh_minutes`), so a fresh buy can take a scan or two to appear.\n`holdings.txt` still works for stocks outside Robinhood.\n\n---\n\n## Daily use (from your phone)\n\n- **Scan now** (app, or Run workflow → `scan-now`): a full scan on demand, also after the close (it uses the\n  latest prices and labels buys \"BUY AT NEXT OPEN\"). Always ends with a 📡 summary.\n- **Tell the bot** (app box, or Run workflow → `ask` with your request): `check NVDA`, `watch TSLA`,\n  `stop watching TSLA`, `set stop to 3%`, `set target to 4%`, `risk low`, `I have $50`, `max 2 buys a day`,\n  `pause alerts` (only SELL NOW still comes), `resume alerts`, `scan now`. Simple rules read it first; Claude only if\n  they can't and you added a key. Replies arrive as a 🤖 notification.\n- Stock alerts come with a chart of the real last 90 days of prices, with your buy, stop and target lines.\n\n- **Buy alert →** buy in Robinhood. If it's linked, you're done. Otherwise tap **Log your buy** and paste the line the alert gives you (e.g. `NVDA 182.50 2026-11-18 0.08`), then **Commit changes**.\n- **Also place a real -2% stop order in your broker.** Alerts can be 15–30 minutes late (the 15-minute checks plus GitHub delays), and prices can jump overnight. A real stop order is the only thing that enforces your rule instantly.\n- **Sold? →** delete the line and commit.\n- A typo in `holdings.txt` gets you a ⚠️ alert naming the line.\n\n---\n\n## How a BUY is chosen\n\n**Momentum score (0–100) compared with the list:** 40% the 12-month gain (skipping the last month), 30% the 6-month gain, 20% closeness to the 52-week high, 10% distance above the 200-day average.\n\n**Every check must pass:**\n- Market healthy (SPY above its 200-day)\n- Top 15 rank\n- Price > 50-day > 200-day, and the 200-day rising\n- Within 10% of the 52-week high\n- RSI 45–72\n- 0–6% above the 20-day average\n- Fits your risk level\n- Up on the day\n- No bad news in the last ~2 days\n\nAt most 3 buy alerts a day.\n\n## How news is rated\n\n- **Keyword rules (always on, free):** about 20 categories, including earnings beats and misses, guidance raised or cut, upgrades and downgrades, CEO exits, scandals, probes and lawsuits, FDA decisions, takeovers, share offerings, buybacks, recalls and hacks, tariffs and export bans, and Fed rates and inflation. Rumors (\"reportedly\", \"in talks\") get lower confidence. Opinion and list headlines (\"3 stocks to buy\", headlines ending in \"?\") get very low confidence.\n- **Claude (if you add a key):** reads each new headline and summary and rates direction, size and confidence. It's told never to add outside facts and never to be more than 85% confident. If the call fails, the keyword rules take over automatically.\n- News fades over time (half its weight every 24 hours) and is forgotten after 3 days.\n\n---\n\n## Why these rules (2026 evidence)\n\n- **Momentum led in 2026:** Morningstar named it the best-performing factor globally in Q2 2026 ([Morningstar](https://indexes.morningstar.com/insights/markets-review/blt49b23cb4e87c0d8d/morningstar-factor-monitor-q2-2026)).\n- **It can crash fast:** it dropped sharply at the early-June 2026 turning point ([Morningstar](https://indexes.morningstar.com/insights/perspective/blt863fcc07f2931f5f/momentum-investors-are-winning-but-not-by-betting-on-quality)). That's why buys pause when SPY is below its 200-day.\n- **Tight stops get shaken out by noise:** a January 2026 CFA Institute article found tight stops often cut trades on normal price swings ([CFA Institute](https://rpc.cfainstitute.org/blogs/enterprising-investor/2026/why-tight-stop-losses-often-hurt-investors-and-what-robust-capital-growth-really-requires)). So the bot filters out jumpy stocks and warns you when a stock's normal swing is bigger than 2%. **Run the backtest.** It compares your ±2% exits with wider, volatility-based exits.\n\n### Reading the backtest\n- **Per trade** above 0 means the rules made money after costs. **PF** (profit factor) above 1.2 is decent; below 1.0 loses money.\n- With ±2% exits you must win **more than about 53%** of trades just to break even.\n- The \"Any day in uptrend\" row is a no-skill baseline. The buy setup should beat it.\n- The backtest doesn't include news, because the free historical news feed isn't used in it.\n\n---\n\n## Settings (`config.json`)\n\n| Setting | Default | Meaning |\n|---|---|---|\n| `stop_pct` | 2.0 | 🔴 SELL NOW at this % below your buy |\n| `profit_pct` / `profit_step_pct` | 2 / 2 | 🟡 at +2%, then every +2% |\n| (fixed tiers) | 8 / 20 | 🔵 at +8%, 🟢 at +20% |\n| `account_size` | 30 | Your trading money |\n| `risk_per_trade_pct` / `max_position_pct` | 1 / 50 | Sizing caps |\n| `risk_level` | moderate | low / moderate / any |\n| `news` | true | Turn news on or off |\n| `news_alert_min_strength` | 2 | 1 = alert on small stories too |\n| `horizon_ai` | true | Ask Claude about hold time (needs a key) |\n| `priority_*` | 1 (stop = 2) | 0 normal, 1 loud, 2 emergency/repeating |\n| `universe` | built-in ~70 | Your own list, e.g. `[\"NVDA\",\"AAPL\"]` |\n\n---\n\n## Good to know\n- **Pattern day trading:** in a *margin* account under $25k, buying and selling the same stock on the same day 4+ times in 5 business days gets you flagged. In a *cash* account, money from a sale settles in 1 business day before you can reuse it.\n- **Taxes:** profitable sales are taxable. Short-term gains are taxed like regular income.\n- **Schedules pause** after 60 days with no repo activity. The bot's own saves keep it awake.\n- **If scheduled runs never appear** but manual runs work, push any small edit and wait a day, or make the repo public. (Public means anyone could see your holdings file.)\n- **Run on your PC:** put the keys in `.env` (see `.env.example`), then run `py scanner.py report` or `py scanner.py scan --dry-run`.\n- **Tests:** `python -m unittest test_scanner` (74 tests, all offline).\n- Not financial advice. The bot gives rule-based alerts, not guarantees.\n", "config.json": "{\n  \"_read_me\": \"Percentages are plain numbers (2.0 = 2%). Leave universe empty to use the built-in list of ~70 big, liquid stocks.\",\n\n  \"stop_pct\": 2.0,\n  \"near_stop_gap_pct\": 0.5,\n  \"warn_band_pct\": 0.5,\n  \"warn_arm_pct\": 1.5,\n  \"profit_pct\": 2.0,\n  \"profit_step_pct\": 2.0,\n\n  \"top_n\": 15,\n  \"rsi_min\": 45,\n  \"rsi_max\": 72,\n  \"max_from_high_pct\": 10.0,\n  \"max_above_sma20_pct\": 6.0,\n  \"max_atr_pct\": 3.0,\n  \"max_buy_alerts_per_day\": 3,\n  \"require_green_day\": true,\n\n  \"priority_buy\": 1,\n  \"priority_profit\": 1,\n  \"priority_warning\": 1,\n  \"priority_near_stop\": 1,\n  \"priority_stop\": 2,\n  \"priority_summary\": 0,\n  \"emergency_retry_sec\": 60,\n  \"emergency_expire_sec\": 900,\n  \"sound_buy\": \"cashregister\",\n  \"sound_sell\": \"siren\",\n\n  \"chart_url\": \"https://finance.yahoo.com/quote/{symbol}\",\n  \"holdings_edit_url\": \"\",\n  \"summary_minutes_before_close\": 25,\n\n  \"account_size\": 30.0,\n  \"risk_per_trade_pct\": 1.0,\n  \"max_position_pct\": 50.0,\n  \"risk_level\": \"moderate\",\n\n  \"news\": true,\n  \"news_ai_model\": \"claude-haiku-5-5\",\n  \"news_alert_min_strength\": 2,\n  \"news_alert_min_confidence\": 0.5,\n  \"news_block_buy_score\": -0.4,\n  \"horizon_ai\": true,\n  \"horizon_ai_model\": \"claude-haiku-5-5\",\n  \"web_search_tool\": \"web_search_20250305\",\n  \"web_search_max_uses\": 2,\n  \"priority_news\": 1,\n  \"priority_market_news\": 0,\n  \"max_market_news_alerts_per_day\": 2,\n\n  \"research_min_articles\": 15,\n  \"research_min_sites\": 10,\n  \"research_cache_hours\": 4,\n  \"earnings_blackout_days\": 2,\n  \"budget_alphavantage\": 20,\n  \"budget_lunarcrush\": 500,\n  \"budget_financialdatasets\": 100,\n  \"budget_claude\": 6,\n  \"priority_budget\": 0,\n  \"priority_ideas\": 0,\n  \"ideas_watch_days\": 5,\n  \"max_extra_watch\": 8,\n\n  \"data_feed\": \"iex\",\n  \"universe\": []\n}\n", "holdings.txt": "# YOUR STOCKS. After you buy, add one line:  SYMBOL  BUY_PRICE\n# Optional extras on the same line: date bought, number of shares.\n#\n#   NVDA 182.50\n#   AMD 155.60 2026-11-18 0.19\n#\n# After you sell, DELETE the line. Lines starting with # are ignored.\n", ".github/workflows/scan.yml": "name: Stock scanner\n\non:\n  schedule:\n    # Every 15 min, Mon-Fri, 13:00-21:59 UTC. That covers market hours in both\n    # winter and summer time. The script exits right away when the market is closed.\n    # Odd minutes (07/22/37/52) because GitHub delays jobs scheduled on the hour.\n    - cron: \"7,22,37,52 13-21 * * 1-5\"\n  workflow_dispatch:\n    inputs:\n      command:\n        description: \"What to run\"\n        type: choice\n        options: [scan, scan-now, ask, report, test-alert, backtest]\n        default: scan\n      request:\n        description: \"For ask: what you want the bot to do (e.g. watch TSLA, set stop to 3%)\"\n        type: string\n        default: \"\"\n\npermissions:\n  contents: write   # lets the bot save its alert memory (state.json)\n\nconcurrency:\n  group: scanner\n  cancel-in-progress: false\n\njobs:\n  run:\n    runs-on: ubuntu-latest\n    timeout-minutes: 10\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Run\n        env:\n          CMD: ${{ inputs.command || 'scan' }}\n          BOT_REQUEST: ${{ inputs.request }}\n          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}\n          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}\n          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}\n          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}\n          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}                     # optional, used only when needed\n          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}               # optional\n          LUNARCRUSH_API_KEY: ${{ secrets.LUNARCRUSH_API_KEY }}                   # optional\n          FINANCIAL_DATASETS_API_KEY: ${{ secrets.FINANCIAL_DATASETS_API_KEY }}   # optional\n          SNAPTRADE_CLIENT_ID: ${{ secrets.SNAPTRADE_CLIENT_ID }}                 # optional: Robinhood sync\n          SNAPTRADE_CONSUMER_KEY: ${{ secrets.SNAPTRADE_CONSUMER_KEY }}           # optional: Robinhood sync\n        run: |\n          case \"$CMD\" in\n            scan|report|backtest) python3 scanner.py \"$CMD\" ;;\n            scan-now) python3 scanner.py scan --force ;;\n            ask) python3 scanner.py ask ;;\n            test-alert) python3 scanner.py test-alert --all ;;\n            *) echo \"unknown command\"; exit 1 ;;\n          esac\n\n      - name: Save memory (alerts, knowledge, Obsidian vault, app data)\n        if: ${{ contains(fromJSON('[\"scan\",\"scan-now\",\"ask\"]'), inputs.command || 'scan') }}\n        run: |\n          git config user.name \"stock-scanner\"\n          git config user.email \"stock-scanner@users.noreply.github.com\"\n          git add state.json knowledge.json config.json vault app/dashboard.json 2>/dev/null || git add state.json\n          if git diff --cached --quiet; then echo \"no changes\"; exit 0; fi\n          git commit -m \"scanner: update alert memory [skip ci]\"\n          for i in 1 2 3; do\n            git pull --rebase --autostash && git push && exit 0\n            sleep 5\n          done\n          echo \"could not save state\"; exit 1\n", ".gitignore": ".env\n__pycache__/\n", ".env.example": "# Only needed to run the scanner on your own PC. On GitHub, use repo Secrets instead.\n# Copy this file to \".env\" and fill in. Never upload .env anywhere.\nAPCA_API_KEY_ID=your_alpaca_key_id\nAPCA_API_SECRET_KEY=your_alpaca_secret\nPUSHOVER_TOKEN=your_pushover_api_token\nPUSHOVER_USER=your_pushover_user_key\n# Optional: lets Claude rate the news and check forums for hold time (pay-as-you-go API key)\nANTHROPIC_API_KEY=\nALPHAVANTAGE_API_KEY=\nLUNARCRUSH_API_KEY=\nFINANCIAL_DATASETS_API_KEY=\nSNAPTRADE_CLIENT_ID=\nSNAPTRADE_CONSUMER_KEY=\n", "state.json": "{}\n", "knowledge.json": "{}\n", "app/dashboard.json": "{\"updated\": \"\", \"holdings\": [], \"alerts\": [], \"watch\": [], \"ideas\": [], \"budgets\": [], \"track\": {}}\n", "vault/Welcome.md": "---\ntags: [stock-bot]\n---\n# Stock Bot Vault\n\nThe bot writes here after every scan:\n- **Bot Memory**: track record and how many paid credits are used\n- **Stocks/**: one note per stock (stats, research, news, alerts)\n- **Daily/**: every alert, by day\n\nOpen this `vault` folder in Obsidian to read it, search it and see links between stocks and days.\n", "vault/Stocks/.keep": "", "vault/Daily/.keep": ""}</script>
<script>
"use strict";
const BOT_VERSION = "d1c07777";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("nt:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("nt:" + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem("nt:" + k); } catch (e) {} }
};
const KEEP = new Set(["config.json", "holdings.txt", "state.json", "knowledge.json", "app/dashboard.json",
  "vault/Welcome.md", "vault/Stocks/.keep", "vault/Daily/.keep"]);
const SECRETS_REQ = ["APCA_API_KEY_ID", "APCA_API_SECRET_KEY", "PUSHOVER_TOKEN", "PUSHOVER_USER"];
const SECRETS_RH = ["SNAPTRADE_CLIENT_ID", "SNAPTRADE_CONSUMER_KEY"];
const SECRETS_OPT = ["ANTHROPIC_API_KEY", "ALPHAVANTAGE_API_KEY", "LUNARCRUSH_API_KEY", "FINANCIAL_DATASETS_API_KEY"];

let conf = store.get("conf", null);
let dash = null, holdings = { text: null }, tab = "home", alertFilter = "all", loading = false, secretsHave = store.get("secretsHave", null);
let job = store.get("job", null);   // a bot run you started from the app: {label, since}
const appUrl = () => location.origin + location.pathname;

/* ---------- theme ---------- */
const mqDark = matchMedia("(prefers-color-scheme: dark)");
function applyLook() {
  const t = store.get("theme", "dark");
  document.documentElement.dataset.theme = t === "auto" ? (mqDark.matches ? "dark" : "light") : t;
  document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
}
mqDark.addEventListener?.("change", applyLook);

/* ---------- utf-8 base64 ---------- */
function enc(str) { const b = new TextEncoder().encode(str); let s = ""; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
function dec(b64) { const bin = atob(b64.replace(/\s/g, "")); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }

/* ---------- GitHub ---------- */
function friendly(status, msg) {
  if (status === 401) return "GitHub rejected your access key. Make a new one in Bot → Setup.";
  if (status === 403) return "Your access key is missing a permission (" + msg + ").";
  if (status === 404) return "GitHub couldn't find that. Check the username, repo name and key.";
  if (status === 409) return "Your repo is empty. Install the bot in Bot → Setup.";
  if (status === 422) return msg || "GitHub didn't accept that.";
  return msg || ("GitHub error " + status);
}
async function gh(path, { method = "GET", body, raw = false } = {}) {
  let r;
  try {
    r = await fetch("https://api.github.com" + path, {
      method, cache: "no-store",
      headers: Object.assign({ "Authorization": "Bearer " + conf.token,
        "Accept": raw ? "application/vnd.github.raw+json" : "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28" }, body ? { "Content-Type": "application/json" } : {}),
      body: body ? JSON.stringify(body) : undefined });
  } catch (e) { const er = new Error("No connection to GitHub. Check your internet."); er.status = 0; throw er; }
  if (r.status === 204) return null;
  const text = await r.text();
  if (!r.ok) { let m = text; try { m = JSON.parse(text).message; } catch (e) {} const er = new Error(friendly(r.status, m)); er.status = r.status; throw er; }
  if (raw) return text;
  return text ? JSON.parse(text) : null;
}
const repoPath = () => "/repos/" + encodeURIComponent(conf.owner) + "/" + encodeURIComponent(conf.repo);
const cpath = p => repoPath() + "/contents/" + p.split("/").map(encodeURIComponent).join("/");
async function readFile(p) {
  try { const j = await gh(cpath(p)); return { text: dec(j.content || ""), sha: j.sha }; }
  catch (e) { if (e.status === 404 || e.status === 409) return { text: null, sha: null }; throw e; }
}
async function writeFile(p, text, sha, msg) {
  return gh(cpath(p), { method: "PUT", body: Object.assign({ message: msg, content: enc(text) }, sha ? { sha } : {}) });
}
async function dispatch(command, request) {
  const repo = await gh(repoPath());
  const inputs = { command };
  if (request) inputs.request = request;
  await gh(repoPath() + "/actions/workflows/scan.yml/dispatches", { method: "POST", body: { ref: repo.default_branch || "main", inputs } });
}

/* ---------- run a bot job and follow it (polls only while it runs and the app is open) ---------- */
let jobTimer = null;
async function startJob(command, request, label) {
  if (!conf || !conf.installed) return toast("Set up the bot first (Bot tab)", true);
  if (job) return toast("The bot is still on your last request", true);
  try {
    await dispatch(command, request);
    job = { label, since: new Date().toISOString() }; store.set("job", job);
    render(); followJob();
  } catch (e) {
    if (e.status === 422 && /request/.test(e.message)) { toast("Updating your bot first…"); await install(true); return startJob(command, request, label); }
    toast(e.message, true);
  }
}
function followJob() {
  clearTimeout(jobTimer);
  if (!job || document.hidden) return;
  jobTimer = setTimeout(async () => {
    try {
      const r = await gh(repoPath() + "/actions/runs?event=workflow_dispatch&per_page=3");
      const run = (r.workflow_runs || []).find(x => x.created_at >= job.since.slice(0, 19));
      const age = (Date.now() - Date.parse(job.since)) / 1000;
      if (run && run.status === "completed") {
        const ok = run.conclusion === "success";
        toast(ok ? job.label + ": done. Check your notifications." : job.label + " failed. Open Bot → Bot runs.", !ok);
        job = null; store.del("job"); await load(true); return;
      }
      if (age > 600) { job = null; store.del("job"); render(); return; }
    } catch (e) { /* try again next tick */ }
    followJob();
  }, 6000);
}

/* ---------- toast + sheet ---------- */
let toastT;
function toast(msg, err) { const t = $("#toast"); t.textContent = msg; t.className = "on" + (err ? " err" : ""); clearTimeout(toastT); toastT = setTimeout(() => t.className = "", err ? 5000 : 2800); }
function openSheet(html) { $("#sheetbody").innerHTML = html; $("#sheet").classList.add("on"); $("#sheetback").classList.add("on"); }

/* ---------- data ---------- */
async function load(quiet) {
  if (!conf || loading) return;
  loading = true; $("#refresh").classList.add("busy");
  try {
    const [d, h] = await Promise.all([
      gh(cpath("app/dashboard.json"), { raw: true }).then(t => JSON.parse(t)).catch(e => { if (e.status === 404 || e.status === 409) return null; throw e; }),
      gh(cpath("holdings.txt"), { raw: true }).catch(e => { if (e.status === 404 || e.status === 409) return null; throw e; })]);
    dash = d; holdings = { text: h };
    store.set("cache", { dash, holdingsText: h });
  } catch (e) { if (!quiet) toast(e.message, true); }
  finally { loading = false; $("#refresh").classList.remove("busy"); render(); }
}
function parseHoldings(text) {
  const out = [];
  (text || "").split("\n").forEach((raw, i) => {
    const line = raw.split("#")[0].trim(); if (!line) return;
    const p = line.replace(/,/g, "").split(/\s+/);
    const price = parseFloat((p[1] || "").replace("$", ""));
    if (!p[0] || !(price > 0)) return;
    let bought = "", shares = null;
    p.slice(2).forEach(x => { if (/^\d{4}-\d\d-\d\d$/.test(x)) bought = x; else if (+x > 0) shares = +x; });
    out.push({ symbol: p[0].toUpperCase(), buy: price, bought, shares, line: i, src: "manual" });
  });
  return out;
}
/* Stocks the bot watches: Robinhood ones from the dashboard + ones you logged by hand */
function myStocks() {
  const fromDash = (dash && dash.holdings) || [];
  const manual = parseHoldings(holdings.text);
  const rh = fromDash.filter(x => x.src && x.src !== "manual");
  const rhSyms = new Set(rh.map(x => x.symbol));
  const byDash = {}; fromDash.forEach(x => { if (!x.src || x.src === "manual") byDash[x.symbol + "|" + x.buy] = x; });
  return rh.concat(manual.filter(m => !rhSyms.has(m.symbol)).map(m => Object.assign({}, byDash[m.symbol + "|" + m.buy] || {}, m)));
}

/* ---------- formatting ---------- */
const money = x => (x < 0 ? "-$" : "$") + Math.abs(x).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const smoney = x => (x >= 0 ? "+" : "-") + money(Math.abs(x)).replace("-", "");
const pct = x => (x >= 0 ? "+" : "") + x.toFixed(2) + "%";
function ago(ts) {
  if (!ts) return "";
  const t = Date.parse(ts.length === 16 ? ts + ":00" : ts); if (!t) return ts.replace("T", " ");
  const m = Math.round((Date.now() - t) / 60000);
  return m < 1 ? "just now" : m < 60 ? m + "m ago" : m < 1440 ? Math.round(m / 60) + "h ago" : Math.round(m / 1440) + "d ago";
}
const KIND = { buy: "--violet", profit: "--amber", profit8: "--blue", profit20: "--up", stop: "--down", near: "--orange",
  warn: "--orange", summary: "--faint", ideas: "--violet", budget: "--orange", error: "--orange", info: "--cyan", reply: "--cyan" };
function alertColor(a) {
  if (a.kind === "news" || a.kind === "mnews") return (a.title || "").includes("▲") ? "var(--up)" : "var(--down)";
  return "var(" + (KIND[a.kind] || "--faint") + ")";
}
let sparkN = 0;
function spark(vals, opts = {}) {
  vals = (vals || []).filter(v => v > 0);
  if (vals.length < 3) return "";
  const w = opts.w || 300, h = opts.h || 64, pad = 3;
  const lines = (opts.lines || []).filter(l => l && l.v > 0);
  const all = vals.concat(lines.map(l => l.v));
  let lo = Math.min(...all), hi = Math.max(...all); if (hi === lo) { hi += 1; lo -= 1; }
  const X = i => pad + i * (w - 2 * pad) / (vals.length - 1), Y = v => pad + (hi - v) * (h - 2 * pad) / (hi - lo);
  const pts = vals.map((v, i) => X(i).toFixed(1) + "," + Y(v).toFixed(1));
  const up = vals[vals.length - 1] >= vals[0];
  const col = opts.color || (up ? "var(--up)" : "var(--down)");
  const id = "g" + (++sparkN);
  return '<svg class="' + (opts.cls || "spark") + '" viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + col + '" stop-opacity=".28"/><stop offset="1" stop-color="' + col + '" stop-opacity="0"/></linearGradient></defs>' +
    '<path d="M' + pts.join(" L") + " L" + X(vals.length - 1).toFixed(1) + "," + h + " L" + X(0) + "," + h + 'Z" fill="url(#' + id + ')"/>' +
    lines.map(l => '<line x1="0" x2="' + w + '" y1="' + Y(l.v).toFixed(1) + '" y2="' + Y(l.v).toFixed(1) + '" stroke="' + l.c + '" stroke-width="1" stroke-dasharray="4 4" vector-effect="non-scaling-stroke" opacity=".8"/>').join("") +
    '<path d="M' + pts.join(" L") + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>';
}

      : '<div class="chips">' + chips.map(([k, l]) => '<button class="chip" data-q="' + esc(k) + '">' + esc(l) + "</button>").join("") + "</div>") +
    (last && !job ? '<div class="reply">You: <b>' + esc(last.text || "(empty)") + "</b><br>Bot: " + esc((last.did || []).join(" · ")) + "</div>" : "") +
    "</section>";

function alertsHtml() {
  const all = (dash && dash.alerts) || [];
  const groups = { all: () => true, buys: a => a.kind === "buy" || a.kind === "ideas",

    news: a => a.kind === "news" || a.kind === "mnews" };

    [["all", "All"], ["buys", "Buys"], ["sells", "Sells"], ["news", "News"]].map(([k, l]) => '<button class="chip" data-filter="' + k + '" aria-pressed="' + (alertFilter === k) + '">' + l + "</button>").join("") + "</div>";
  if (!list.length) return h + emptyState(dash ? "Nothing here yet. The bot alerts you when something's worth acting on." : "No results yet. The bot runs every 15 minutes on weekdays.");
  h += '<div class="feed">' + list.map(a => {
    const [simple, ...rest] = (a.message || "").split("\n");

      (why ? '<div class="why">' + esc(why) + "</div>" : "") +

      (a.sym ? '<button class="btn small" data-q="ask:check ' + esc(a.sym) + '">Ask bot about ' + esc(a.sym) + "</button>" : "") + "</div></div>";
  }).join("") + "</div>";
  if (all[0]) store.set("lastSeen", all[0].t);
  return h;
}

/* ---------- setup wizard (a real sequence, so it's numbered) ---------- */

  const secretRow = (s, opt) => '<div class="secret"><span class="' + (secretsHave && secretsHave.includes(s) ? "ok" : "no") + '">' + (secretsHave && secretsHave.includes(s) ? "●" : "○") + "</span><code>" + s + "</code>" + (opt ? '<span class="hint">' + opt + "</span>" : "") + "</div>";
  let h = "";
  h += step(1, c.owner ? "done" : "now", "Make an empty private repo",
    "<p>On GitHub, make a new repository, set it to <b>Private</b>, and leave everything else empty.</p>" +
    '<a class="btn small" href="https://github.com/new" target="_blank" rel="noopener">Open GitHub</a>');

    '<label class="f"><span>Repo name</span><input name="repo" autocapitalize="off" autocorrect="off" spellcheck="false" value="' + esc(c.repo || "") + '" required></label>' +
    '<label class="f"><span>Access key</span><input name="token" type="password" autocomplete="off" placeholder="' + (c.token ? "Saved. Paste to replace" : "github_pat_…") + '"' + (c.token ? "" : " required") + "></label>" +
    '<button class="btn primary wide">Connect</button><p class="hint">The key stays on this phone only.</p></form>');
  h += step(3, c.installed ? "done" : c.token ? "now" : "", "Install the bot",
    "<p>Copies the bot into your repo. The app keeps it updated by itself after this; your stocks and settings are kept.</p>" +
    '<div class="prog"><i id="instprog"></i></div><p class="hint" id="insttext"></p><button class="btn' + (c.token && !c.installed ? " primary" : "") + ' wide" data-act="install"' + (c.token ? "" : " disabled") + ">" + (c.installed ? "Reinstall the bot" : "Install the bot") + "</button>");
  h += step(4, c.secrets ? "done" : c.installed ? "now" : "", "Add your keys",
    "<p>Add each under <b>New repository secret</b>: exact name, then the key.</p>" +
    SECRETS_REQ.map(s => secretRow(s)).join("") + SECRETS_RH.map(s => secretRow(s, "Robinhood")).join("") + SECRETS_OPT.map(s => secretRow(s, "optional")).join("") +
    '<div class="btns">' + (c.owner ? '<a class="btn small" target="_blank" rel="noopener" href="https://github.com/' + esc(c.owner) + "/" + esc(c.repo) + '/settings/secrets/actions/new">Open secrets page</a>' : "") +
    '<button class="btn small" data-act="checksecrets"' + (c.installed ? "" : " disabled") + ">Check my keys</button></div>");
  h += step(5, "", "Test it", "<p>Sends 6 sample alerts with real charts. The last one repeats until you tap Acknowledge.</p>" +

  if (c.token) h += '<button class="btn danger wide" style="margin:6px 0 14px" data-act="disconnect">Disconnect this phone</button>';
  return h;
}

let installing = false;
async function install(quiet) {
  if (installing) return; installing = true;
  const BOT = JSON.parse(document.getElementById("botfiles").textContent);
  const files = Object.entries(BOT);
  let done = 0, changed = 0;
  const bar = () => $("#instprog"), txt = () => $("#insttext");
  try {
    for (const [path, content] of files) {
      if (txt()) txt().textContent = "Uploading " + path + "…";
      const cur = await readFile(path);
      if (KEEP.has(path)) {
        if (cur.text == null) {
          let body = content;
          if (path === "config.json") { const j = JSON.parse(content); j.holdings_edit_url = appUrl() + "#log-{symbol}-{price}"; j.app_url = appUrl(); body = JSON.stringify(j, null, 2) + "\n"; }
          await writeFile(path, body, null, "Add " + path); changed++;
        }
      } else if (cur.text !== content) {
        await writeFile(path, content, cur.sha, (cur.sha ? "Update " : "Add ") + path); changed++;
      }
      done++; if (bar()) bar().style.width = (done / files.length * 100) + "%";
    }
    conf.installed = true; conf.botVersion = BOT_VERSION; store.set("conf", conf);
    if (txt()) txt().textContent = "Bot is up to date (" + changed + " file(s) changed).";
    if (!quiet || changed) toast(changed ? "Bot updated" : "Bot is up to date");
    render();
  } catch (e) { if (txt()) txt().textContent = e.message; toast(e.message, true); }
  finally { installing = false; }
}
async function checkSecrets(quiet) {
  try {
    const r = await gh(repoPath() + "/actions/secrets?per_page=100");
    secretsHave = (r.secrets || []).map(s => s.name); store.set("secretsHave", secretsHave);
    const missing = SECRETS_REQ.filter(s => !secretsHave.includes(s));
    conf.secrets = !missing.length; store.set("conf", conf);
    if (!quiet) toast(missing.length ? "Still missing: " + missing.join(", ") : "All required keys are in");
    render();
  } catch (e) { if (!quiet) toast(e.message, true); }
}

/* ---------- sheets: log a buy, sold, settings, notes, help ---------- */
function logSheet(sym, price) {
  const today = new Date().toISOString().slice(0, 10);
  openSheet('<h3>Add a stock by hand</h3><p class="hint">Only needed for stocks outside Robinhood. Linked Robinhood stocks show up by themselves.</p><form id="logform">' +
    '<label class="f"><span>Stock symbol</span><input name="sym" required autocapitalize="characters" autocorrect="off" spellcheck="false" value="' + esc(sym || "") + '" placeholder="NVDA"></label>' +
    '<label class="f"><span>Price you paid per share</span><input name="price" required inputmode="decimal" value="' + esc(price || "") + '" placeholder="182.50"></label>' +
    '<label class="f"><span>Shares (optional, for dollar amounts)</span><input name="shares" inputmode="decimal" placeholder="0.08"></label>' +
    '<p class="hint" id="stophint"></p><button class="btn primary wide">Save</button></form>');
  const f = $("#logform");
  const upd = () => { const p = parseFloat(f.price.value); $("#stophint").textContent = p > 0 ? "Your sell line will be " + money(p * 0.98) + " (−2%). Set a stop order there in your broker too." : ""; };
  f.price.addEventListener("input", upd); upd();
  f.addEventListener("submit", async ev => {
    ev.preventDefault();
    const s = f.sym.value.trim().toUpperCase(), p = parseFloat(f.price.value), sh = parseFloat(f.shares.value);
    if (!/^[A-Z.]{1,6}$/.test(s)) return toast("Use a stock symbol like NVDA", true);
    if (!(p > 0)) return toast("Enter the price you paid", true);
    const line = s + " " + p.toFixed(2) + " " + today + (sh > 0 ? " " + sh : "");
    f.querySelector("button").disabled = true;
    try {
      const cur = await readFile("holdings.txt");
      const text = (cur.text || "").replace(/\s*$/, "\n") + line + "\n";
      await writeFile("holdings.txt", text, cur.sha, "Add stock: " + line);
      holdings = { text }; closeSheet(); toast("Saved " + s); go("stocks"); load(true);
    } catch (e) { toast(e.message, true); f.querySelector("button").disabled = false; }
  });
}
function soldSheet(lineIdx) {
  const lines = (holdings.text || "").split("\n"), l = lines[lineIdx] || "";
  openSheet("<h3>Remove " + esc(l.trim().split(/\s+/)[0]) + "?</h3><p class='hint'>The bot stops watching it.</p>" +
    '<div style="display:grid;gap:10px;margin-top:14px"><button class="btn danger wide" id="confirmsold">Remove it</button><button class="btn wide" id="cancelsold">Keep it</button></div>');
  $("#cancelsold").onclick = closeSheet;
  $("#confirmsold").onclick = async () => {
    try {
      const cur = await readFile("holdings.txt"), arr = (cur.text || "").split("\n");
      const idx = arr.findIndex(x => x.trim() === l.trim());
      if (idx < 0) throw new Error("That line changed. Refresh and try again.");
      arr.splice(idx, 1);
      const text = arr.join("\n");
      await writeFile("holdings.txt", text, cur.sha, "Removed: " + l.trim());
      holdings = { text }; closeSheet(); toast("Removed"); render(); load(true);
    } catch (e) { toast(e.message, true); }
  };
}
async function settingsSheet() {
  openSheet("<h3>Loading…</h3>");
  try {
    const cur = await readFile("config.json"); const cfg = JSON.parse(cur.text || "{}");
    const v = (k, d) => esc(cfg[k] ?? d);
    $("#sheetbody").innerHTML = '<h3>Rules and risk</h3><form id="setform">' +
      '<label class="f"><span>Sell line: alert when down this % (your stop)</span><input name="stop" inputmode="decimal" value="' + v("stop_pct", 2) + '"></label>' +
      '<label class="f"><span>Sell offer: alert when up this %</span><input name="profit" inputmode="decimal" value="' + v("profit_pct", 2) + '"></label>' +
      '<label class="f"><span>Money you trade with ($)</span><input name="acct" inputmode="decimal" value="' + v("account_size", 30) + '"></label>' +
      '<label class="f"><span>Risk level</span><select name="risk">' + [["low", "Low: calm stocks only"], ["moderate", "Moderate"], ["any", "Any"]].map(([x, l]) => '<option value="' + x + '"' + ((cfg.risk_level || "moderate") === x ? " selected" : "") + ">" + l + "</option>").join("") + "</select></label>" +
      '<label class="f"><span>Make every alert an emergency (repeats until you tap)</span><select name="loud"><option value="no">No, only SELL NOW</option><option value="yes"' + (cfg.priority_buy === 2 ? " selected" : "") + ">Yes, all of them</option></select></label>" +
      '<button class="btn primary wide">Save</button></form>';
    $("#setform").addEventListener("submit", async ev => {
      ev.preventDefault(); const f = ev.target;
      const a = parseFloat(f.acct.value), st = parseFloat(f.stop.value), pr = parseFloat(f.profit.value);
      if (!(a > 0)) return toast("Enter a dollar amount", true);
      if (!(st >= 0.6 && st <= 20)) return toast("Sell line must be between 0.6% and 20%", true);
      if (!(pr >= 0.5 && pr <= 50)) return toast("Sell offer must be between 0.5% and 50%", true);
      Object.assign(cfg, { account_size: a, risk_level: f.risk.value, stop_pct: st, profit_pct: pr });
      const p = f.loud.value === "yes" ? 2 : 1;
      ["priority_buy", "priority_profit", "priority_warning", "priority_near_stop", "priority_news"].forEach(k => cfg[k] = p);
      try { await writeFile("config.json", JSON.stringify(cfg, null, 2) + "\n", cur.sha, "Update rules from app"); closeSheet(); toast("Saved. Used from the next scan."); }
      catch (e) { toast(e.message, true); }
    });
  } catch (e) { $("#sheetbody").innerHTML = "<h3>Couldn't load settings</h3><p class='hint'>" + esc(e.message) + "</p>"; }
}
function mdToHtml(md) {
  md = md.replace(/^---[\s\S]*?---\s*/, "");
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>")
    .replace(/\[\[(.+?)\]\]/g, (m, n) => '<a href="#" data-note="' + n + '">' + n + "</a>")
    .replace(/\[(.+?)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  let out = "", inList = false;
  md.split("\n").forEach(l => {
    const m = l.match(/^(#{1,3})\s+(.*)/), li = l.match(/^\s*[-*]\s+(.*)/);
    if (!li && inList) { out += "</ul>"; inList = false; }
    if (m) out += "<h" + m[1].length + ">" + inline(m[2]) + "</h" + m[1].length + ">";
    else if (li) { if (!inList) { out += "<ul>"; inList = true; } out += "<li>" + inline(li[1]) + "</li>"; }
    else if (l.trim()) out += "<p>" + inline(l) + "</p>";
  });
  return out + (inList ? "</ul>" : "");
}
async function openNote(path) {
  openSheet("<h3>Loading…</h3>");
  try { const f = await readFile(path); $("#sheetbody").innerHTML = f.text ? '<div class="md">' + mdToHtml(f.text) + "</div>" : "<h3>No note yet</h3><p class='hint'>The bot writes one after it alerts about this stock.</p>"; }
  catch (e) { $("#sheetbody").innerHTML = "<h3>Couldn't open it</h3><p class='hint'>" + esc(e.message) + "</p>"; }
}
async function notesSheet() {
  openSheet("<h3>Loading…</h3>");
  try {
    const [stocks, daily] = await Promise.all([gh(cpath("vault/Stocks")).catch(() => []), gh(cpath("vault/Daily")).catch(() => [])]);
    const s = (stocks || []).filter(f => f.name.endsWith(".md")), d = (daily || []).filter(f => f.name.endsWith(".md")).sort((a, b) => b.name.localeCompare(a.name)).slice(0, 10);
    const row = f => '<div class="li" data-path="' + esc(f.path) + '"><div class="main"><b>' + esc(f.name.replace(".md", "")) + "</b></div></div>";
    $("#sheetbody").innerHTML = "<h3>Bot notes</h3>" + '<div class="list"><div class="li" data-path="vault/Bot Memory.md"><div class="main"><b>Bot memory</b><small>Track record and paid credits</small></div></div></div>' +
      (s.length ? '<h2 class="sec">Stocks</h2><div class="list">' + s.map(row).join("") + "</div>" : "") +
      (d.length ? '<h2 class="sec">Days</h2><div class="list">' + d.map(row).join("") + "</div>" : "") +
      (!s.length && !d.length ? '<p class="hint">Notes appear after the bot\'s first alerts.</p>' : "");
  } catch (e) { $("#sheetbody").innerHTML = "<h3>Couldn't load notes</h3><p class='hint'>" + esc(e.message) + "</p>"; }
}
function helpSheet() {
  const ex = ["scan now", "check NVDA", "should I sell AMD", "watch TSLA", "stop watching TSLA", "set stop to 3%", "set target to 4%", "risk low", "I have $50", "max 2 buys a day", "pause alerts", "resume alerts"];
  openSheet("<h3>Things you can tell the bot</h3><p class='hint'>Tap one to send it. Replies come as a notification in about a minute.</p><div class='list'>" +
    ex.map(e => '<div class="li" data-q="ask:' + esc(e) + '"><div class="main"><b>' + esc(e) + "</b></div></div>").join("") + "</div>");
}

/* ---------- render + events ---------- */
function setStatus() {
  const on = !!(dash && dash.market_open);
  $("#mdot").className = "dot" + (on ? " on" : "");
  $("#mtext").textContent = !conf ? "not connected" : !dash ? "waiting" : on ? "Market open" : "Market closed";
  const fresh = ((dash && dash.alerts) || []).filter(a => a.t > store.get("lastSeen", "")).length;
  const b = $("#badge"); b.hidden = !fresh || tab === "home"; b.textContent = fresh;
}
function render() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
  setStatus();
  const v = $("#view");
  sparkN = 0;
  if ((!conf || !conf.installed) && tab !== "bot") tab = "bot";
  v.innerHTML = ({ home: viewHome, stocks: viewStocks, ideas: viewIdeas, bot: viewBot })[tab]();
  bindForms(); setStatus();
}
function bindForms() {
  const f = $("#connect");
  if (f) f.addEventListener("submit", async ev => {
    ev.preventDefault();
    const owner = f.owner.value.trim(), repo = f.repo.value.trim(), token = f.token.value.trim() || (conf && conf.token);
    if (!token) return toast("Paste your access key", true);
    const prev = conf; conf = Object.assign({}, conf || {}, { owner, repo, token });
    try {
      const r = await gh(repoPath());
      if (!r.private) toast("Heads up: this repo is public, so anyone can see your stocks.", true);
      conf.installed = (await readFile("scanner.py")).text != null;
      store.set("conf", conf) || toast("Couldn't save the key on this phone.", true);
      toast("Connected to " + owner + "/" + repo); render(); load(true);
    } catch (e) { conf = prev; toast(e.message, true); }
  });
  const a = $("#askform");
  if (a) a.addEventListener("submit", ev => {
    ev.preventDefault();
    const q = a.q.value.trim(); if (!q) return a.q.focus();
    a.q.blur(); startJob("ask", q, "Bot is on it: " + q.slice(0, 40));
  });
}
function go(t) { tab = t; if (location.hash !== "#" + t) history.replaceState(null, "", "#" + t); render(); window.scrollTo(0, 0); }

document.querySelector("nav.tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) go(b.dataset.tab); });
$("#refresh").addEventListener("click", () => conf ? load() : toast("Connect your bot first (Bot tab)", true));
document.addEventListener("click", e => {
  const t = e.target;
  const card = t.closest(".al");
  if (card && !t.closest("a,button")) { card.classList.toggle("open"); return; }
  const q = t.closest("[data-q]");
  if (q) {
    const k = q.dataset.q;
    if (k === "scan") return startJob("scan-now", "", "Scanning the market");
    if (k === "test") return startJob("test-alert", "", "Sending test alerts");
    if (k === "help") return helpSheet();
    if (k.startsWith("ask:")) { closeSheet(); if (tab !== "home") go("home"); return startJob("ask", k.slice(4), "Bot is on it: " + k.slice(4)); }
  }
  const fb = t.closest("[data-filter]"); if (fb) { alertFilter = fb.dataset.filter; render(); return; }
  const gt = t.closest("[data-go]"); if (gt) return go(gt.dataset.go);
  const sd = t.closest("[data-sold]"); if (sd) return soldSheet(+sd.dataset.sold);
  const nt = t.closest("[data-note]"); if (nt) { e.preventDefault(); return openNote("vault/Stocks/" + nt.dataset.note + ".md"); }
  const np = t.closest("[data-path]"); if (np) return openNote(np.dataset.path);
  const sg = t.closest(".seg button"); if (sg) { store.set(sg.parentElement.dataset.seg, sg.dataset.v); applyLook(); render(); return; }
  const act = t.closest("[data-act]"); if (!act) return;
  const a = act.dataset.act;
  if (a === "log") return logSheet();
  if (a === "install") return install();
  if (a === "checksecrets") return checkSecrets();
  if (a === "settings") return settingsSheet();
  if (a === "notes") return notesSheet();
  if (a === "disconnect") { store.del("conf"); store.del("cache"); conf = null; dash = null; toast("Disconnected"); return render(); }
});

function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const m = h.match(/^log-([A-Za-z.]+)-([\d.]+)$/);
  if (m) { tab = "stocks"; render(); setTimeout(() => logSheet(m[1].toUpperCase(), m[2]), 250); return; }
  if (h === "alerts") tab = "home";
  else if (["home", "stocks", "ideas", "bot"].includes(h)) tab = h;
  render();
}
window.addEventListener("hashchange", route);
// Refresh only when you come back to the app, plus every 3 minutes while it's on screen.
document.addEventListener("visibilitychange", () => { if (!document.hidden) { load(true); followJob(); } else clearTimeout(jobTimer); });
setInterval(() => { if (!document.hidden) load(true); }, 180000);

(function boot() {
  applyLook();
  const cache = store.get("cache", null);
  if (cache) { dash = cache.dash; holdings = { text: cache.holdingsText }; }
  route();
  if (conf) {
    load(true);
    if (job) followJob();
    // Keep the bot on GitHub up to date with this app, automatically
    if (conf.installed && conf.botVersion !== BOT_VERSION) setTimeout(() => install(true), 1500);
    if (conf.installed && !secretsHave) checkSecrets(true);
  }
})();
</script>
