<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neon Tape">
<meta name="theme-color" content="#0a0c1d">
<link rel="apple-touch-icon" href="icon.png">
<title>Neon Tape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Neon Tape v3: a pocket ticker. One loud thing (the tape + the big number), everything else quiet.
   Everything heavy runs on GitHub; this page only reads the bot's results. */
:root{
  --bg:#070914; --panel:#0f1226; --panel2:#171b36; --line:rgba(150,160,255,.09); --line2:rgba(150,160,255,.17);
  --ink:#f2f3ff; --dim:#9ca2cb; --faint:#636992;
  --cyan:#46e0ff; --violet:#8f7dff; --pink:#ff5fa8;
  --up:#27e39b; --down:#ff4f6e; --amber:#ffc04a; --blue:#5b8cff; --orange:#ff9152;
  --display:"Unbounded",-apple-system,system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
[data-theme="light"]{
  --bg:#f1f2f8; --panel:#ffffff; --panel2:#f0f1f8; --line:rgba(20,24,60,.08); --line2:rgba(20,24,60,.15);
  --ink:#10122a; --dim:#4a5079; --faint:#8a8fb0;
  --cyan:#0079a8; --violet:#5f3fd0; --pink:#c4166c;
  --up:#07885a; --down:#d0243f; --amber:#9c6500; --blue:#2453d6; --orange:#c25510;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);touch-action:pan-x pan-y;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,textarea,.why,.reply,.answer{-webkit-user-select:text;user-select:text}
body{margin:0;min-height:100dvh;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;overflow-x:hidden;
  background:radial-gradient(70% 280px at 50% -60px,color-mix(in srgb,var(--cyan) 13%,transparent),transparent) var(--bg) no-repeat}
button,input,select{font:inherit;color:inherit}
a{color:var(--cyan)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
[hidden]{display:none !important}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}

/* ---------- top bar ---------- */
header.top{padding:calc(var(--top) + 14px) 20px 8px;display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto}
.word{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.16em}
.word i{font-style:normal;color:var(--cyan)}
.pill{margin-left:auto;display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:17px;border:0;font-size:13.5px;font-weight:600;color:var(--dim);background:var(--panel2);cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.on{background:var(--up);box-shadow:0 0 10px var(--up)}
.pill.busy .dot{animation:pulse .8s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{padding:4px 16px calc(var(--bot) + 112px);max-width:560px;margin:0 auto}
h1.view{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.01em;margin:8px 4px 2px}
.sub{color:var(--dim);margin:0 4px 16px;font-size:15px}
h2.sec{font-size:16px;font-weight:700;color:var(--ink);margin:20px 4px 8px}
h2.sec small{font-weight:500;color:var(--faint);font-size:13px;margin-left:6px}

/* ---------- the tape (the signature: a strip of tickers) ---------- */
.tape{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;margin:2px -16px 10px;padding:9px 20px;font-size:13.5px;white-space:nowrap;
  border-block:1px solid var(--line);-webkit-mask:linear-gradient(90deg,transparent,#000 20px,#000 calc(100% - 20px),transparent)}
.tape::-webkit-scrollbar{display:none}
.tape span{cursor:pointer;font-variant-numeric:tabular-nums;color:var(--dim)}
.tape b{color:var(--ink);font-weight:700;margin-right:6px}

/* ---------- hero ---------- */
.hero{border-radius:26px;padding:18px 18px 16px;margin:8px 0 6px;border:1px solid var(--line2);
  background:linear-gradient(165deg,color-mix(in srgb,var(--cyan) 9%,var(--panel)),var(--panel) 55%)}
.hero .lbl{font-size:14px;color:var(--dim);font-weight:600}
.hero .bignum{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.05;letter-spacing:-.025em;margin:8px 0 6px}
.hero .meta{font-size:14px;color:var(--dim)}
.hero .meta b{color:var(--ink);font-weight:600}
.up{color:var(--up)} .down{color:var(--down)}

/* ---------- ask the bot ---------- */
.ask{display:flex;gap:8px;margin-top:18px}
.ask input{flex:1;min-width:0;height:52px;border-radius:26px;border:1px solid var(--line2);background:var(--bg);padding:0 20px;font-size:16px}
.ask input:focus{outline:none;border-color:var(--cyan)}
.ask button{width:52px;height:52px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;flex:none;background:var(--cyan);color:#04121a}
.ask button svg{width:20px;height:20px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.hero .chips{flex-wrap:wrap}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 16px;border-radius:19px;border:0;background:var(--panel2);cursor:pointer;font-weight:600;font-size:14px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--cyan);color:#04121a}
.working{margin-top:14px;font-size:14px;color:var(--dim);display:flex;align-items:center;gap:10px}
.bar{flex:1;height:3px;border-radius:2px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;width:35%;background:var(--cyan);animation:slide 1.3s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(290%)}}
.reply{margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--panel2);font-size:14px;color:var(--dim)}
.reply b{color:var(--ink)}

/* ---------- alerts ---------- */
.feed{display:grid;gap:8px}
.al{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;cursor:pointer;display:grid;grid-template-columns:38px 1fr auto;gap:0 12px;align-items:start}
.al .ic{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:17px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.al .t{font-weight:700;font-size:15.5px;line-height:1.3}
.al .s{color:var(--dim);font-size:14.5px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.al.open .s{display:block}
.al .when{font-size:12.5px;color:var(--faint);white-space:nowrap;padding-top:2px}
.al .why{display:none;grid-column:2/-1;white-space:pre-wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:14px;color:var(--dim)}
.al.open .why{display:block}
.al .acts{display:none;grid-column:2/-1;margin-top:10px;gap:8px;flex-wrap:wrap}
.al.open .acts{display:flex}
.al.new{border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.al.new .when{color:var(--c);font-weight:700}
.more{display:block;margin:10px auto 0;border:0;background:none;color:var(--cyan);font-weight:700;font-size:15px;cursor:pointer;padding:10px}

/* ---------- stocks ---------- */
.stock{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:18px;margin:10px 0;cursor:pointer}
.stock .row{display:flex;align-items:flex-start;gap:10px}
.sym{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.01em;line-height:1.1}
.stock .nm{display:block;font-size:13px;color:var(--faint);margin-top:3px}
.src{font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--panel2);color:var(--dim);margin-top:3px}
.src.rh{color:var(--up);background:color-mix(in srgb,var(--up) 12%,transparent)}
.chg{margin-left:auto;font-family:var(--display);font-weight:700;font-size:21px;text-align:right;line-height:1.1}
.chg small{display:block;font-family:var(--body);font-size:13px;font-weight:600;margin-top:3px}
.spark{display:block;width:100%;height:60px;margin:14px 0 10px}
.kv{display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.kv div{flex:1}
.kv div+div{text-align:center}
.kv div:last-child{text-align:right}
.kv small{display:block;color:var(--faint);font-size:12px}
.kv b{font-size:15.5px;font-variant-numeric:tabular-nums}
.verdict{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-weight:700;font-size:14.5px}
.verdict::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.reasons{margin:8px 0 0;padding:0 0 0 16px;font-size:14px;color:var(--dim)}
.reasons li{padding:2px 0}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.textbtn{border:0;background:none;color:var(--cyan);font-weight:700;cursor:pointer;padding:12px 4px;font-size:15px}

.list{background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;min-height:62px;padding:10px 16px;border-top:1px solid var(--line);cursor:pointer}
.li:first-child{border-top:0}
.li .n{color:var(--faint);width:22px;font-size:13px;font-variant-numeric:tabular-nums;text-align:center}
.li .main{flex:1;min-width:0}
.li .main b{font-weight:700;font-size:16px}
.li .main small{display:block;color:var(--faint);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .mini{width:64px;height:26px;flex:none}
.li .r{text-align:right;font-size:14.5px;font-variant-numeric:tabular-nums;min-width:70px;font-weight:600}
.li .r small{display:block;font-size:12.5px}
.tag{font-size:11px;font-weight:700;color:var(--dim);background:var(--panel2);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:1px}
details.fold{margin-top:10px}
details.fold summary{list-style:none;cursor:pointer;color:var(--cyan);font-weight:700;padding:10px 4px}
details.fold summary::-webkit-details-marker{display:none}

.btn{min-height:46px;padding:0 18px;border-radius:15px;border:0;background:var(--panel2);cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);font-size:15px}
.btn.primary{background:var(--cyan);color:#04121a}
.btn.danger{color:var(--down);background:color-mix(in srgb,var(--down) 10%,transparent)}
.btn.small{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45}

.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;margin:10px 0}
.card h3{margin:0 0 6px;font-size:17px}
.card p{margin:4px 0;color:var(--dim);font-size:14.5px}
.empty{text-align:center;color:var(--dim);padding:36px 18px;background:var(--panel);border-radius:22px}
.empty p{margin:0 0 14px}
.meter{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--cyan)}
.meter.out i{background:var(--down)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--panel2);border-radius:14px;padding:10px}
.stats b{display:block;font-family:var(--display);font-size:18px}
.stats small{display:block;color:var(--faint);font-size:12px;line-height:1.3;margin-top:2px}

/* ---------- welcome ---------- */
.welcome{min-height:calc(100dvh - 160px);display:flex;flex-direction:column;justify-content:center;padding:20px 6px}
.welcome h1{font-family:var(--display);font-size:34px;line-height:1.1;letter-spacing:-.02em;margin:0 0 14px}
.welcome p{color:var(--dim);font-size:16.5px;margin:0 0 28px}
.welcome .btn{margin-top:10px;min-height:54px;font-size:16px}
.welcome small{display:block;text-align:center;color:var(--faint);margin-top:18px;font-size:13px}
.sharebox{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line2);border-radius:14px;padding:6px 6px 6px 12px;margin:8px 0}
.sharebox code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.howto{margin:8px 0;padding-left:20px;font-size:14.5px}
.howto li{margin:6px 0}


/* ---------- portfolio switch (mine = green, paper = violet) ---------- */
.pseg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:18px;background:var(--panel);border:1px solid var(--line);margin:10px 0 12px}
.pseg button{height:44px;border:0;border-radius:14px;background:none;font-weight:700;font-size:15px;color:var(--dim);cursor:pointer}
.pseg button.mine[aria-pressed="true"]{background:var(--up);color:#03140d}
.pseg button.paper[aria-pressed="true"]{background:var(--violet);color:#fff}
.pseg.small{margin:12px 0 8px}.pseg.small button{height:38px;font-size:14px}
.pseg.small button[aria-pressed="true"]{background:var(--panel2);color:var(--ink)}
.psum{border-radius:22px;padding:14px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border:1px solid var(--line2)}
.psum.mine{background:linear-gradient(160deg,color-mix(in srgb,var(--up) 12%,var(--panel)),var(--panel) 60%)}
.psum.paper{background:linear-gradient(160deg,color-mix(in srgb,var(--violet) 16%,var(--panel)),var(--panel) 60%);grid-template-columns:1fr}
.psum small{display:block;color:var(--dim);font-size:12.5px;font-weight:600}
.psum b{font-size:19px;font-weight:700}
.psum .big b{display:block;font-family:var(--display);font-size:34px;line-height:1.1;margin:2px 0}
.psum .big span{font-size:14px;font-weight:600}
.psum .trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.psum .trio b{font-size:16px}
.plist{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-top:10px}
.prow{display:flex;align-items:center;gap:10px;min-height:58px;padding:8px 14px;border-top:1px solid var(--line);cursor:pointer}
.prow:first-child{border-top:0}
.prow:active{background:var(--panel2)}
.prow .main{flex:1;min-width:0}
.prow .main b{font-size:16px;font-weight:800}
.prow .main small{display:block;color:var(--faint);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .mini{width:58px;height:26px;flex:none}
.prow .r{text-align:right;min-width:72px}
.prow .r b{display:block;font-size:15.5px}
.prow .r small{display:block;font-size:12.5px;color:var(--dim)}
.vt{font-size:11px;font-weight:800;padding:2px 7px;border-radius:7px;margin-left:7px;vertical-align:2px;text-transform:uppercase;letter-spacing:.02em}
.vt.up{color:var(--up);background:color-mix(in srgb,var(--up) 14%,transparent)}
.vt.warn{color:var(--orange);background:color-mix(in srgb,var(--orange) 14%,transparent)}
.vt.down,.vt.sell{color:var(--down);background:color-mix(in srgb,var(--down) 14%,transparent)}
.vt.buy{color:var(--violet);background:color-mix(in srgb,var(--violet) 18%,transparent)}
button:active{transform:scale(.98)}

/* ---------- paper, Robinhood-style ---------- */
.rh{padding:6px 4px 4px}
.rh-bal{font-family:var(--display);font-weight:700;font-size:40px;letter-spacing:-.02em;line-height:1.1}
.rh-line{font-size:15px;font-weight:700;margin-top:4px}
.rh-line span{color:var(--dim);font-weight:500;margin-left:4px}
.rh-line b{font-weight:700}.rh-line b.up{color:var(--up)}.rh-line b.down{color:var(--down)}
.rh-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.rh-meta small{display:block;color:var(--faint);font-size:12px}
.rh-meta b{font-size:14.5px}
.kvlist{margin-top:8px;border-top:1px solid var(--line)}
/* Robinhood-style chart: drag a finger across it to read the price at any point */
.scrub{position:relative;height:230px;margin:10px -4px 6px;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;cursor:crosshair}
.scrub svg{display:block;width:100%;height:100%}
.scrub .sx{position:absolute;top:0;bottom:0;width:1px;will-change:left;background:var(--dim);opacity:0;pointer-events:none}
.scrub .sd{position:absolute;will-change:left,top;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--bg);opacity:0;pointer-events:none}
.scrub.on .sx,.scrub.on .sd{opacity:1}
.scrub .st{position:absolute;top:-2px;transform:translateX(-50%);font-size:12px;color:var(--dim);white-space:nowrap;opacity:0;pointer-events:none}
.scrub.on .st{opacity:1}
.rng{display:flex;justify-content:space-between;gap:2px;margin:4px 0 2px;border-bottom:1px solid var(--line);padding-bottom:10px}
.rng button{flex:1;background:none;border:0;color:var(--c);font:700 13.5px var(--body);padding:7px 0;border-radius:8px}
.rng button[aria-pressed="true"]{background:var(--c);color:var(--bg)}
.rh-hd small{display:block;color:var(--dim);font-size:13px;font-weight:600}
.bp{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);font-size:15.5px}
.bp b{font-weight:700}
.rhsec{font:800 20px var(--display);margin:18px 4px 4px}
.rhrow{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.rhrow:active{background:var(--panel2)}
.rhrow .main{flex:1;min-width:0}
.rhrow .main b{display:block;font-size:16px;font-weight:800}
.rhrow .main small{display:block;color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rhrow .mini{width:50px;height:28px;flex:none;align-self:center}
.rhrow .main small{font-variant-numeric:tabular-nums}
.rhrow.hold .main b{font-size:17px}
.pill{min-width:84px;text-align:center;padding:7px 10px;border-radius:8px;font:700 14.5px var(--body);color:#fff;background:var(--up)}
.pill.down{background:var(--down)}
.rhrow.hold .main,.putrow .main{display:flex;justify-content:flex-start}
.stack{display:flex;flex-direction:column;align-items:flex-start;text-align:left;max-width:100%;min-width:0}
.rhrow .main .stack,.rhrow .main .stack b,.rhrow .main .stack small{text-align:left!important;align-items:flex-start!important;align-self:flex-start}
.rhrow.hold .main,.putrow .main{text-align:left!important;justify-content:flex-start!important;align-items:flex-start}
.stack b{font-size:17px}
.ink{color:var(--ink);font-weight:700}
.lpc{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.nowp small.lpc.up{color:var(--up)}.nowp small.lpc.down{color:var(--down)}
.tick-up{animation:tku .7s ease-out}.tick-dn{animation:tkd .7s ease-out}
@keyframes tku{0%{color:#eaffef;text-shadow:0 0 8px #fff}100%{color:inherit}}
@keyframes tkd{0%{color:#ffe1e1;text-shadow:0 0 8px #fff}100%{color:inherit}}
@media (prefers-reduced-motion:reduce){.tick-up,.tick-dn{animation:none}}
.livetag{margin:6px 0 0;font-size:12.5px;color:var(--dim)}
.livetag a{color:var(--ink)}
.lv{color:var(--dim)}.lv.on{color:var(--up);font-weight:700}.lv.bad{color:var(--down)}
.llist{border-top:1px solid var(--line)}
.lrow{display:flex;justify-content:space-between;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:14px}
.lrow span{color:var(--dim)}.lrow b{text-align:right;font-weight:700}
.inp{display:block;width:100%;box-sizing:border-box;margin:6px 0;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:15px var(--body)}
.msp{flex:none;display:block;line-height:0}
.inp.masked{-webkit-text-security:disc}
.tog{flex:none;width:52px;height:30px;border-radius:16px;border:0;background:var(--line);position:relative;padding:0}
.tog i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}

/* ---------- pull to refresh ---------- */
.ptr{position:fixed;top:calc(var(--top) + 10px);left:50%;z-index:60;width:40px;height:40px;border-radius:50%;
  background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;transform:translate(-50%,-70px);transition:transform .2s;pointer-events:none}

/* ---------- tab bar ---------- */
nav.tabs{position:fixed;left:14px;right:14px;bottom:calc(var(--bot) + 10px);z-index:30;max-width:460px;margin:0 auto;

details.setup{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 16px}

<script type="application/json" id="botfiles">{"scanner.py": "#!/usr/bin/env python3\n\"\"\"\nStock Alerts: scans strong US stocks and sends loud alerts to your iPhone.\n\nWhat it does every 15 minutes while the market is open:\n  1. Ranks a list of liquid stocks by MOMENTUM (the factor leading in 2026):\n     12-month and 6-month gains, closeness to the 52-week high, trend strength.\n  2. Sends a BUY SETUP alert when a top-ranked stock is in an uptrend, is not\n     overextended, and the whole market is healthy (SPY above its 200-day).\n  3. Watches the stocks YOU bought (holdings.txt) and alerts using your rules:\n       - SELL NOW       price is 2%+ below your buy price      (emergency alert)\n       - NEAR STOP      price is about to hit that -2% line\n       - SELL WARNING   a gain is fading back toward your buy price\n       - SELL OFFER     price is 2%+ above your buy price, with HOLD/SELL advice\n  4. Reads the news (Benzinga feed via Alpaca) for your stocks and the market,\n     rates each story (keyword rules, or Claude if you add an API key), alerts\n     you on big stories about stocks you own, and blocks buys after bad news.\n  5. Suggests a position size for your account and shows what a move means in dollars.\n  6. Sends a summary near the close.\n\nCommands:\n  python scanner.py scan         one full run (what GitHub runs every 15 min)\n  python scanner.py report       print the rankings and your holdings (no alerts)\n  python scanner.py test-alert   send sample alerts to your phone\n  python scanner.py backtest     test the buy setup + your 2%/2% rules on past data\n  python scanner.py ask \"...\"    do what a plain-English request says (\"watch TSLA\", \"scan now\")\n\nStandard library only (Python 3.9+). Not financial advice.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport html\nimport json\nimport math\nimport os\nimport re\nimport sys\nimport urllib.error\nimport urllib.parse\nimport urllib.request\nfrom dataclasses import dataclass, field\nfrom datetime import date, datetime, timedelta, timezone\nfrom pathlib import Path\n\nHERE = Path(__file__).resolve().parent\nTRADING_URL = \"https://paper-api.alpaca.markets\"   # only used for the market clock\nDATA_URL = \"https://data.alpaca.markets\"\nPUSHOVER_URL = \"https://api.pushover.net/1/messages.json\"\nCLAUDE_URL = \"https://api.anthropic.com/v1/messages\"\nOPENAI_URL = \"https://api.openai.com/v1/chat/completions\"\nOPENAI_RESPONSES_URL = \"https://api.openai.com/v1/responses\"   # newer API: built-in web search + our tools\nAV_URL = \"https://www.alphavantage.co/query\"\nLUNAR_URL = \"https://lunarcrush.com/api4\"\nFD_URL = \"https://api.financialdatasets.ai\"\nGNEWS_URL = \"https://news.google.com/rss/search\"\nAPEWISDOM_URL = \"https://apewisdom.io/api/v1.0/filter/all-stocks/page/1\"     # Reddit mention counts (free, no key)\nSTOCKTWITS_URL = \"https://api.stocktwits.com/api/2/streams/symbol/{sym}.json\"  # trader posts tagged bullish/bearish\nYAHOO_RSS_URL = \"https://feeds.finance.yahoo.com/rss/2.0/headline\"\nSNAP_URL = \"https://api.snaptrade.com\"     # SnapTrade: free read-only link to your Robinhood\n\nDEFAULT_CONFIG = {\n    # Your sell rules (percent)\n    \"stop_pct\": 2.0,             # SELL NOW when this far below your buy price\n    \"near_stop_gap_pct\": 0.5,    # NEAR STOP fires this close to the stop line (-1.5%)\n    \"warn_band_pct\": 0.5,        # SELL WARNING when a gain fades to +0.5% or less...\n    \"warn_arm_pct\": 1.5,         # ...but only after the stock was up at least +1.5%\n    \"profit_pct\": 2.0,           # SELL OFFER at +2%\n    \"profit_step_pct\": 2.0,      # and again at +4%, +6%... if you keep holding\n\n    # Buy setup filters\n    \"top_n\": 15,                 # only the 15 highest-ranked stocks can trigger a buy\n    \"rsi_min\": 45, \"rsi_max\": 72,\n    \"max_from_high_pct\": 10.0,   # within 10% of the 52-week high\n    \"max_above_sma20_pct\": 6.0,  # not more than 6% above the 20-day average (no chasing)\n    \"max_atr_pct\": 3.0,          # skip stocks that swing more than 3% on a normal day\n    \"max_buy_alerts_per_day\": 3,\n    \"require_green_day\": True,   # price above yesterday's close when the alert fires\n\n    # Phone alerts. Pushover priority: 0 normal, 1 high, 2 emergency (repeats until you tap)\n    \"priority_buy\": 1, \"priority_profit\": 1, \"priority_warning\": 1,\n    \"priority_near_stop\": 1, \"priority_stop\": 2, \"priority_summary\": 0,\n    \"emergency_retry_sec\": 60, \"emergency_expire_sec\": 900,\n    \"sound_buy\": \"cashregister\", \"sound_sell\": \"siren\",\n    \"chart_url\": \"https://finance.yahoo.com/quote/{symbol}\",\n    \"holdings_edit_url\": \"\",     # e.g. https://github.com/YOU/stock-alerts/edit/main/holdings.txt\n    \"summary_minutes_before_close\": 25,\n    \"app_url\": \"\",               # Neon Tape link; alerts open it (filled in from holdings_edit_url if blank)\n    \"chart_images\": True,        # attach a neon price chart to stock alerts\n\n    # Robinhood sync (through SnapTrade Personal, free, read-only). Needs SNAPTRADE_CLIENT_ID\n    # and SNAPTRADE_CONSUMER_KEY. Your Robinhood stocks are then watched with no typing.\n    \"broker_name\": \"Robinhood\",  # only accounts whose name contains this (\"\" = every linked account)\n    \"broker_refresh_minutes\": 30,  # ask SnapTrade to re-read Robinhood this often (0 = once a day only)\n    \"priority_broker\": 0,\n\n    # Your money and risk\n    \"account_size\": 30.0,        # dollars you trade with\n    \"risk_per_trade_pct\": 1.0,   # most you want to lose on one trade if the stop hits (% of account)\n    \"max_position_pct\": 50.0,    # never put more than this % of the account in one stock\n    \"risk_level\": \"moderate\",    # \"low\", \"moderate\" (medium), \"high\" or \"speculative\"\n\n    # News\n    \"news\": True,\n    # AI: ChatGPT (OPENAI_API_KEY) is asked first; Claude (ANTHROPIC_API_KEY) only for extra help\n    \"openai_model\": \"gpt-5.6-luna\",        # the model free ChatGPT uses by default\n    \"news_ai_model\": \"claude-opus-5-5\",    # Claude: Opus 5.5 only\n    \"claude_effort\": \"low\",                # ...on low effort\n    \"news_alert_min_strength\": 2,          # 1 small, 2 medium, 3 large\n    \"news_alert_min_confidence\": 0.5,\n    \"news_block_buy_score\": -0.4,          # skip buys when recent news is this negative\n    \"horizon_ai\": True,                    # ask Claude (web search: news + forums) how long to hold\n    \"horizon_ai_model\": \"claude-opus-5-5\",\n    \"web_search_tool\": \"web_search_20250305\",\n    \"web_search_max_uses\": 2,              # each search costs about 1 cent\n    \"priority_news\": 1, \"priority_market_news\": 0,\n    \"max_market_news_alerts_per_day\": 2,\n    \"paper_trading\": True,                 # copy buy alerts into an Alpaca PAPER account (fake money) if keys are set\n    \"paper_start\": 10000,                  # what the paper account started with, for \"up/down since start\"\n    \"paper_position_pct\": 10,              # starting size per buy; the bot sizes each trade by how good its odds are\n    \"paper_max_positions\": 0,              # 0 = no limit: keep buying while there's cash\n    \"paper_min_odds\": 0.55,                # paper buys when the prediction gives at least these odds of +profit first\n    \"paper_min_score\": 0.3,                # ...and a positive predicted payoff (in % per trade)\n    \"paper_high_risk_max\": 200,            # most the bot puts into one high-risk trade (jumpy stock, or any put)\n    \"paper_puts\": True,                    # also buy PUTS (bets a stock falls) when the prediction says it's likely to drop\n    \"paper_put_min_odds\": 0.58,            # odds of -stop% before +profit% needed for a put\n    \"paper_puts_max_pct\": 10,              # all puts together stay under this % of the $10k (moderate)\n    \"paper_market_put\": True,              # market falling (QQQ/SPY red, under their 20- or 200-day): hedge with an inverse fund\n    \"paper_hedge_pct\": 5,                  # ...worth this % of the $10k (PSQ rises when QQQ falls, SH when SPY falls)\n    \"bear_watch\": [\"CRWV\", \"ORCL\", \"SOUN\", \"NBIS\"],   # AI names with weak finances: always checked for puts\n    \"paper_buy_list\": [\"META\", \"AMZN\"],    # you asked for these: bought once (5-10% of the $10k), then normal sell rules\n    \"paper_quality\": [\"AAPL\", \"MSFT\", \"NVDA\", \"AMZN\", \"META\", \"GOOGL\", \"AVGO\", \"TSM\", \"NFLX\", \"COST\", \"V\", \"MA\", \"JPM\", \"LLY\", \"AMD\"],\n    \"paper_open_wait_min\": 30,             # no new paper buys in the first 30 min after the open (the open is the jumpiest, most often red, part of the day)\n    \"paper_weak_extra_odds\": 0.05,         # market under its 200-day: buys need this much better odds, and no \"one buy a day\" filler\n    \"paper_dip_pct\": 8,                    # big-name dip buy: this far under its 3-month high, long-term trend still intact\n    \"paper_24h\": True,                     # paper also trades stocks pre-market / after-hours / overnight (24/5) and crypto (24/7)\n    \"paper_crypto\": [\"BTC/USD\", \"ETH/USD\", \"SOL/USD\"],\n    \"paper_crypto_stop_pct\": 5, \"paper_crypto_profit_pct\": 5,   # crypto swings more, so wider lines\n    \"catalyst_alerts\": True,               # ⚡ big news on any stock the bot follows, even ones you don't own\n    \"max_catalyst_alerts_per_day\": 3,\n\n    # Research order: free sources first, paid only when needed\n    \"research_min_articles\": 15,           # read at least this many articles...\n    \"research_min_sites\": 10,              # ...from at least this many different sites before paying\n    \"research_cache_hours\": 4,\n    \"earnings_blackout_days\": 2,           # no buy alerts this close to an earnings report\n    \"budget_alphavantage\": 20,             # calls per day (free key = 25/day; leaves some for you in Claude)\n    \"budget_lunarcrush\": 500,              # calls per month (you have about 1,000; leaves half for you)\n    \"budget_financialdatasets\": 100,       # calls per month\n    \"budget_openai\": 30,                   # ChatGPT calls per day (asked first)\n    \"budget_claude\": 6,                    # Claude calls per day: only for extra help\n    \"priority_budget\": 0, \"priority_ideas\": 0,\n    \"ideas_watch_days\": 5, \"max_extra_watch\": 8,\n\n    \"data_feed\": \"iex\",          # free Alpaca data\n    \"universe\": [],\n    \"discover_movers\": True,     # each day, pull the market's top movers + most traded stocks into the scan\n    \"discover_count\": 8,         # how many of each\n    \"discover_forums\": True,     # also check Reddit/StockTwits buzz (free sites; skipped if they're down)\n    \"discover_min_price\": 5.0,   # skip penny stocks (speculative risk allows $2+)\n    \"daily_brief\": True,         # short intelligence brief on the first scan after the open\n    \"watch_extra\": [],           # stocks you asked the bot to watch (\"watch TSLA\")\n    \"ignore\": [],                # stocks you told it to skip (\"stop watching TSLA\")\n    \"paused\": False,             # \"pause alerts\": only SELL NOW alerts still come through\n}\n\n# Risk settings (change any time; used from the next scan). Safeguards (stop line, size caps,\n# market filter, bad-news block) apply at every level.\nRISK_PROFILES = {\n    #               max daily swing, extra RSI room, room below high, top-N stretch, min confidence\n    \"low\":         {\"atr\": 1.5, \"rsi\": -4, \"high\": 0.7, \"top\": 0.7, \"conf\": 70, \"label\": \"LOW\"},\n    \"moderate\":    {\"atr\": 2.5, \"rsi\": 0,  \"high\": 1.0, \"top\": 1.0, \"conf\": 60, \"label\": \"MEDIUM\"},\n    \"high\":        {\"atr\": 4.0, \"rsi\": 6,  \"high\": 1.5, \"top\": 1.5, \"conf\": 55, \"label\": \"HIGH\"},\n    \"speculative\": {\"atr\": 8.0, \"rsi\": 10, \"high\": 2.5, \"top\": 2.5, \"conf\": 45, \"label\": \"SPECULATIVE\"},\n}\nRISK_ALIASES = {\"medium\": \"moderate\", \"med\": \"moderate\", \"any\": \"speculative\", \"spec\": \"speculative\",\n                \"aggressive\": \"high\"}\nRISK_LEVEL_ATR = {k: v[\"atr\"] for k, v in RISK_PROFILES.items()}\n\nDEFAULT_UNIVERSE = [\n    # Tech / semis\n    \"AAPL\", \"MSFT\", \"NVDA\", \"AMZN\", \"GOOGL\", \"META\", \"AVGO\", \"TSLA\", \"AMD\", \"NFLX\",\n    \"ORCL\", \"CRM\", \"ADBE\", \"QCOM\", \"MU\", \"TXN\", \"AMAT\", \"LRCX\", \"KLAC\", \"ANET\",\n    \"PANW\", \"CRWD\", \"NOW\", \"SHOP\", \"UBER\", \"PLTR\", \"INTU\", \"IBM\", \"CSCO\", \"DELL\",\n    # Financials\n    \"JPM\", \"BAC\", \"WFC\", \"GS\", \"MS\", \"V\", \"MA\", \"AXP\", \"SCHW\", \"BLK\",\n    # Health\n    \"LLY\", \"UNH\", \"JNJ\", \"ABBV\", \"MRK\", \"TMO\", \"ISRG\", \"AMGN\", \"VRTX\", \"BSX\",\n    # Consumer\n    \"COST\", \"WMT\", \"HD\", \"MCD\", \"NKE\", \"KO\", \"PEP\", \"PG\", \"DIS\", \"SBUX\",\n    # Industrial / energy / other\n    \"CAT\", \"DE\", \"GE\", \"HON\", \"RTX\", \"LMT\", \"UNP\", \"XOM\", \"CVX\", \"NEE\",\n    # Broad funds\n    \"QQQ\", \"SPY\",\n]\nMARKET = \"SPY\"\n\n\n# =============================================================================\n# Files, config, keys\n# =============================================================================\n\ndef load_config(path: Path | None = None) -> dict:\n    path = path or HERE / \"config.json\"\n    cfg = json.loads(json.dumps(DEFAULT_CONFIG))\n    if path.exists():\n        user = json.loads(path.read_text(encoding=\"utf-8\"))\n        for k, v in user.items():\n            if k.startswith(\"_\"):\n                continue\n            if k not in DEFAULT_CONFIG:\n                print(f\"Warning: unknown config key '{k}' ignored\")\n                continue\n            cfg[k] = v\n    if not cfg[\"universe\"]:\n        cfg[\"universe\"] = list(DEFAULT_UNIVERSE)\n    cfg[\"universe\"] = [s.strip().upper() for s in cfg[\"universe\"] if s.strip()]\n    # Claude is only ever Opus 5.5 on low effort (older configs may still name another model)\n    cfg[\"news_ai_model\"] = cfg[\"horizon_ai_model\"] = \"claude-opus-5-5\"\n    cfg[\"claude_effort\"] = \"low\"\n    ign = {x.upper() for x in cfg[\"ignore\"]}\n    cfg[\"universe\"] = [x for x in dict.fromkeys(cfg[\"universe\"] + [w.upper() for w in cfg[\"watch_extra\"]])\n                       if x not in ign or x == MARKET]\n    for k in (\"stop_pct\", \"profit_pct\", \"profit_step_pct\"):\n        if not 0 < float(cfg[k]) <= 50:\n            sys.exit(f\"Config problem: {k} must be between 0 and 50\")\n    cfg[\"risk_level\"] = RISK_ALIASES.get(str(cfg[\"risk_level\"]).lower(), str(cfg[\"risk_level\"]).lower())\n    if cfg[\"risk_level\"] not in RISK_PROFILES:\n        sys.exit('Config problem: risk_level must be \"low\", \"moderate\", \"high\" or \"speculative\"')\n    if float(cfg[\"account_size\"]) <= 0:\n        sys.exit(\"Config problem: account_size must be more than 0\")\n    if cfg[\"near_stop_gap_pct\"] >= cfg[\"stop_pct\"]:\n        sys.exit(\"Config problem: near_stop_gap_pct must be smaller than stop_pct\")\n    for k in [k for k in cfg if k.startswith(\"priority_\")]:\n        if cfg[k] not in (-2, -1, 0, 1, 2):\n            sys.exit(f\"Config problem: {k} must be -2, -1, 0, 1 or 2\")\n    return cfg\n\n\ndef load_env(path: Path | None = None) -> None:\n    path = path or HERE / \".env\"\n    if not path.exists():\n        return\n    for line in path.read_text(encoding=\"utf-8\").splitlines():\n        line = line.strip()\n        if line and not line.startswith(\"#\") and \"=\" in line:\n            k, v = line.split(\"=\", 1)\n            os.environ.setdefault(k.strip(), v.strip().strip('\"').strip(\"'\"))\n\n\n@dataclass\nclass Holding:\n    symbol: str\n    buy_price: float\n    bought: str = \"\"\n    shares: float | None = None\n    source: str = \"manual\"       # \"manual\" (holdings.txt / app) or \"robinhood\"\n\n    @property\n    def key(self) -> str:\n        return f\"{self.symbol}|{self.buy_price:g}|{self.bought}\"\n\n\ndef parse_holdings(text: str) -> tuple[list[Holding], list[str]]:\n    \"\"\"\n    One stock per line:   SYMBOL  BUY_PRICE  [YYYY-MM-DD]  [SHARES]\n    Examples:             NVDA 182.50\n                          AMD 155.60 2026-11-18 0.19\n    Lines starting with # are ignored. '$' and commas are allowed in numbers.\n    \"\"\"\n    holdings, errors = [], []\n    for n, raw in enumerate(text.splitlines(), 1):\n        line = raw.split(\"#\", 1)[0].strip()\n        if not line:\n            continue\n        parts = line.replace(\",\", \"\").split()\n        try:\n            sym = parts[0].upper()\n            if not sym.replace(\".\", \"\").isalpha() or len(sym) > 6:\n                raise ValueError(\"bad symbol\")\n            price = float(parts[1].replace(\"$\", \"\"))\n            if price <= 0:\n                raise ValueError(\"price must be > 0\")\n            bought, shares = \"\", None\n            for extra in parts[2:]:\n                if len(extra) == 10 and extra[4] == \"-\" and extra[7] == \"-\":\n                    date.fromisoformat(extra)\n                    bought = extra\n                else:\n                    shares = float(extra.replace(\"$\", \"\"))\n            holdings.append(Holding(sym, price, bought, shares))\n        except IndexError:\n            errors.append(f\"line {n} '{raw.strip()}': write it as SYMBOL PRICE, like NVDA 182.50\")\n        except ValueError as e:\n            why = \"price isn't a number\" if \"float\" in str(e) else str(e)\n            errors.append(f\"line {n} '{raw.strip()}': {why}\")\n    return holdings, errors\n\n\ndef load_holdings(path: Path | None = None) -> tuple[list[Holding], list[str]]:\n    path = path or HERE / \"holdings.txt\"\n    if not path.exists():\n        return [], []\n    return parse_holdings(path.read_text(encoding=\"utf-8\"))\n\n\ndef load_state(path: Path | None = None) -> dict:\n    path = path or HERE / \"state.json\"\n    try:\n        return json.loads(path.read_text(encoding=\"utf-8\"))\n    except (FileNotFoundError, ValueError):\n        return {}\n\n\ndef save_state(state: dict, path: Path | None = None) -> None:\n    path = path or HERE / \"state.json\"\n    path.write_text(json.dumps(state, indent=1, sort_keys=True) + \"\\n\", encoding=\"utf-8\")\n\n\n# =============================================================================\n# Alpaca market data (free account; used for prices only, never trades)\n# =============================================================================\n\nclass ApiError(Exception):\n    pass\n\n\ndef http_json(method: str, url: str, headers: dict | None = None,\n              params: dict | None = None, form: dict | None = None, timeout: int = 30,\n              body: dict | None = None):\n    if params:\n        url += \"?\" + urllib.parse.urlencode(params)\n    data = urllib.parse.urlencode(form).encode() if form is not None else None\n    hdrs = {\"User-Agent\": \"stock-alerts/1.0\", **(headers or {})}\n    if body is not None:\n        data = json.dumps(body).encode()\n        hdrs[\"Content-Type\"] = \"application/json\"\n    req = urllib.request.Request(url, data=data, method=method, headers=hdrs)\n    try:\n        with urllib.request.urlopen(req, timeout=timeout) as r:\n            raw = r.read()\n            return json.loads(raw) if raw else None\n    except urllib.error.HTTPError as e:\n        body = e.read().decode(errors=\"replace\")\n        try:  # keep just the readable part of a JSON error ({\"error\": {\"message\": ...}})\n            j = json.loads(body); er = j.get(\"error\", j) if isinstance(j, dict) else j\n            if isinstance(er, dict):\n                body = \" \".join(str(er.get(k)) for k in (\"code\", \"type\", \"param\", \"message\") if er.get(k))\n            elif isinstance(er, str):\n                body = er\n        except ValueError:\n            pass\n        body = \" \".join(body.split())[:400]\n        raise ApiError(f\"HTTP {e.code} from {urllib.parse.urlparse(url).netloc}: {body}\") from None\n    except urllib.error.URLError as e:\n        raise ApiError(f\"could not reach {urllib.parse.urlparse(url).netloc}: {e.reason}\") from None\n\n\nclass Alpaca:\n    def __init__(self, key: str, secret: str, feed: str = \"iex\"):\n        self.h = {\"APCA-API-KEY-ID\": key, \"APCA-API-SECRET-KEY\": secret, \"Accept\": \"application/json\"}\n        self.feed = feed\n\n    @classmethod\n    def from_env(cls, feed: str) -> \"Alpaca\":\n        load_env()\n        k, s = os.environ.get(\"APCA_API_KEY_ID\", \"\"), os.environ.get(\"APCA_API_SECRET_KEY\", \"\")\n        if not k or not s:\n            sys.exit(\"Missing APCA_API_KEY_ID / APCA_API_SECRET_KEY (GitHub secrets or .env).\")\n        return cls(k, s, feed)\n\n    def clock(self) -> dict:\n        return http_json(\"GET\", f\"{TRADING_URL}/v2/clock\", self.h)\n\n    def news_for(self, symbols: list[str], start_iso: str, limit: int = 10) -> list[dict]:\n        params = {\"symbols\": \",\".join(symbols), \"start\": start_iso, \"limit\": limit, \"sort\": \"desc\",\n                  \"include_content\": \"false\"}\n        return (http_json(\"GET\", f\"{DATA_URL}/v1beta1/news\", self.h, params) or {}).get(\"news\") or []\n\n    def movers(self, top: int = 10) -> dict:\n        return http_json(\"GET\", f\"{DATA_URL}/v1beta1/screener/stocks/movers\", self.h, {\"top\": top}) or {}\n\n    def most_actives(self, top: int = 10) -> list[dict]:\n        r = http_json(\"GET\", f\"{DATA_URL}/v1beta1/screener/stocks/most-actives\", self.h,\n                      {\"by\": \"volume\", \"top\": top}) or {}\n        return r.get(\"most_actives\") or []\n\n    def assets(self) -> list[dict]:\n        return http_json(\"GET\", f\"{TRADING_URL}/v2/assets\", self.h,\n                         {\"status\": \"active\", \"asset_class\": \"us_equity\"}) or []\n\n    def daily_bars(self, symbols: list[str], start: date) -> dict[str, list[dict]]:\n        out: dict[str, list[dict]] = {}\n        for i in range(0, len(symbols), 50):\n            chunk = symbols[i:i + 50]\n            params = {\"symbols\": \",\".join(chunk), \"timeframe\": \"1Day\", \"start\": start.isoformat(),\n                      \"adjustment\": \"all\", \"feed\": self.feed, \"limit\": 10000, \"sort\": \"asc\"}\n            while True:\n                page = http_json(\"GET\", f\"{DATA_URL}/v2/stocks/bars\", self.h, params) or {}\n                for sym, bars in (page.get(\"bars\") or {}).items():\n                    out.setdefault(sym, []).extend(bars)\n                token = page.get(\"next_page_token\")\n                if not token:\n                    break\n                params[\"page_token\"] = token\n        return out\n\n    def news(self, start_iso: str, max_pages: int = 6) -> list[dict]:\n        \"\"\"Benzinga headlines since start_iso, newest first (all tickers).\"\"\"\n        params = {\"start\": start_iso, \"limit\": 50, \"sort\": \"desc\", \"include_content\": \"false\"}\n        items: list[dict] = []\n        for _ in range(max_pages):\n            page = http_json(\"GET\", f\"{DATA_URL}/v1beta1/news\", self.h, params) or {}\n            items.extend(page.get(\"news\") or [])\n            token = page.get(\"next_page_token\")\n            if not token:\n                break\n            params[\"page_token\"] = token\n        return items\n\n    def live_prices(self, symbols: list[str]) -> dict[str, float]:\n        prices = {}\n        for i in range(0, len(symbols), 100):\n            chunk = symbols[i:i + 100]\n            data = http_json(\"GET\", f\"{DATA_URL}/v2/stocks/snapshots\", self.h,\n                             {\"symbols\": \",\".join(chunk), \"feed\": self.feed}) or {}\n            data = data.get(\"snapshots\", data)\n            for sym, snap in data.items():\n                if not snap:\n                    continue\n                p = ((snap.get(\"latestTrade\") or {}).get(\"p\")\n                     or (snap.get(\"minuteBar\") or {}).get(\"c\")\n                     or (snap.get(\"dailyBar\") or {}).get(\"c\"))\n                if p:\n                    prices[sym] = float(p)\n        return prices\n\n\n# =============================================================================\n# Indicators (computed once per symbol as full series; reused by the backtest)\n# =============================================================================\n\ndef sma_series(x: list[float], n: int) -> list[float | None]:\n    out, s = [None] * len(x), 0.0\n    for i, v in enumerate(x):\n        s += v\n        if i >= n:\n            s -= x[i - n]\n        if i >= n - 1:\n            out[i] = s / n\n    return out\n\n\ndef rsi_series(c: list[float], n: int = 14) -> list[float | None]:\n    out = [None] * len(c)\n    if len(c) <= n:\n        return out\n    gains = [max(c[i] - c[i - 1], 0) for i in range(1, len(c))]\n    losses = [max(c[i - 1] - c[i], 0) for i in range(1, len(c))]\n    ag, al = sum(gains[:n]) / n, sum(losses[:n]) / n\n    def val(g, l):\n        return 100.0 if l == 0 else 100 - 100 / (1 + g / l)\n    out[n] = val(ag, al)\n    for i in range(n + 1, len(c)):\n        ag = (ag * (n - 1) + gains[i - 1]) / n\n        al = (al * (n - 1) + losses[i - 1]) / n\n        out[i] = val(ag, al)\n    return out\n\n\ndef atr_series(h, l, c, n: int = 14) -> list[float | None]:\n    out = [None] * len(c)\n    if len(c) <= n:\n        return out\n    tr = [h[0] - l[0]] + [max(h[i] - l[i], abs(h[i] - c[i - 1]), abs(l[i] - c[i - 1]))\n                          for i in range(1, len(c))]\n    a = sum(tr[1:n + 1]) / n\n    out[n] = a\n    for i in range(n + 1, len(c)):\n        a = (a * (n - 1) + tr[i]) / n\n        out[i] = a\n    return out\n\n\ndef rolling_max(x: list[float], n: int) -> list[float]:\n    from collections import deque\n    out, dq = [], deque()\n    for i, v in enumerate(x):\n        while dq and x[dq[-1]] <= v:\n            dq.pop()\n        dq.append(i)\n        if dq[0] <= i - n:\n            dq.popleft()\n        out.append(x[dq[0]])\n    return out\n\n\n@dataclass\nclass Series:\n    dates: list[str]\n    o: list[float]; h: list[float]; l: list[float]; c: list[float]\n    sma20: list; sma50: list; sma200: list; rsi: list; atr: list; high252: list\n    v: list = field(default_factory=list)   # daily volume (shares)\n\n    @classmethod\n    def from_bars(cls, bars: list[dict]) -> \"Series\":\n        d = [b[\"t\"][:10] for b in bars]\n        o, h, l, c = ([float(b[k]) for b in bars] for k in (\"o\", \"h\", \"l\", \"c\"))\n        v = [float(b.get(\"v\") or 0) for b in bars]\n        return cls(d, o, h, l, c, sma_series(c, 20), sma_series(c, 50), sma_series(c, 200),\n                   rsi_series(c), atr_series(h, l, c), rolling_max(h, 252), v)\n\n    def __len__(self):\n        return len(self.c)\n\n\nMIN_HISTORY = 253  # 12-month momentum needs about a year of trading days\n\n\n@dataclass\nclass Metrics:\n    symbol: str\n    price: float\n    prev_close: float\n    sma20: float; sma50: float; sma200: float; sma200_prev: float\n    rsi: float\n    atr_pct: float\n    ret_12_1: float      # % gain from 12 months ago to 1 month ago (classic momentum)\n    ret_6_1: float       # % gain from 6 months ago to 1 month ago\n    high_52w: float\n    score: float = 0.0\n    rank: int = 0\n    of: int = 0\n    big_move_pct: float = 0.0   # its real \"big day\": 95th percentile of daily moves over the last year\n    vol_ratio: float = 0.0      # last full day's volume vs its 50-day average (1.0 = normal; 0 = unknown)\n    dist_days: int = 0          # heavy-selling days in the last 25 sessions (down ≥0.2% on higher volume than the day before)\n    run_10d_pct: float = 0.0    # % change over the last 10 sessions\n    closes: list = field(default_factory=list, repr=False)  # recent closes, for the alert chart\n\n    @property\n    def day_chg_pct(self) -> float:\n        return (self.price / self.prev_close - 1) * 100\n\n    @property\n    def from_high_pct(self) -> float:\n        return (1 - self.price / self.high_52w) * 100 if self.high_52w else 0.0\n\n    @property\n    def above_sma20_pct(self) -> float:\n        return (self.price / self.sma20 - 1) * 100\n\n\ndef metrics_at(sym: str, s: Series, i: int, price: float | None = None) -> Metrics | None:\n    \"\"\"Metrics using finished day i. `price` overrides the latest price (live intraday).\"\"\"\n    if i < MIN_HISTORY or s.sma200[i] is None or s.sma200[i - 20] is None or s.rsi[i] is None:\n        return None\n    p = price if price is not None else s.c[i]\n    prev = s.c[i] if price is not None else s.c[i - 1]\n    return Metrics(\n        symbol=sym, price=p, prev_close=prev,\n        sma20=s.sma20[i], sma50=s.sma50[i], sma200=s.sma200[i], sma200_prev=s.sma200[i - 20],\n        rsi=s.rsi[i], atr_pct=s.atr[i] / s.c[i] * 100,\n        ret_12_1=(s.c[i - 21] / s.c[i - 252] - 1) * 100,\n        ret_6_1=(s.c[i - 21] / s.c[i - 126] - 1) * 100,\n        high_52w=max(s.high252[i], p),\n        big_move_pct=_big_move(s.c, i),\n        vol_ratio=_vol_ratio(s.v, i),\n        dist_days=_dist_days(s.c, s.v, i),\n        run_10d_pct=round((p / s.c[i - 10] - 1) * 100, 2) if i >= 10 and s.c[i - 10] else 0.0,\n    )\n\n\ndef _dist_days(c: list, v: list, i: int, n: int = 25) -> int:\n    \"\"\"Days the big holders were selling: price down 0.2%+ on more volume than the day before (playbook: watch\n    for warnings, not breaks).\"\"\"\n    if not v or i < n + 1 or i >= len(v):\n        return 0\n    return sum(1 for k in range(i - n + 1, i + 1)\n               if c[k - 1] and (c[k] / c[k - 1] - 1) <= -0.002 and v[k] > v[k - 1] > 0)\n\n\ndef _vol_ratio(v: list, i: int) -> float:\n    \"\"\"Volume on day i vs the 50 days before it. Heavy volume confirms a move (playbook rule 2).\"\"\"\n    if not v or i < 51 or i >= len(v):\n        return 0.0\n    base = [x for x in v[i - 50:i] if x > 0]\n    return round(v[i] / (sum(base) / len(base)), 2) if base and v[i] > 0 else 0.0\n\n\ndef _big_move(c: list[float], i: int) -> float:\n    moves = sorted(abs(c[j] / c[j - 1] - 1) * 100 for j in range(max(1, i - 251), i + 1))\n    return round(moves[int(len(moves) * 0.95) - 1], 2) if len(moves) >= 20 else 0.0\n\n\ndef pct_ranks(values: list[float]) -> list[float]:\n    \"\"\"0-100 percentile of each value within the list (ties share the average rank).\"\"\"\n    n = len(values)\n    if n == 1:\n        return [100.0]\n    order = sorted(range(n), key=lambda k: values[k])\n    ranks = [0.0] * n\n    i = 0\n    while i < n:\n        j = i\n        while j + 1 < n and values[order[j + 1]] == values[order[i]]:\n            j += 1\n        avg = (i + j) / 2\n        for k in range(i, j + 1):\n            ranks[order[k]] = avg / (n - 1) * 100\n        i = j + 1\n    return ranks\n\n\ndef score_all(ms: list[Metrics]) -> list[Metrics]:\n    \"\"\"Momentum score 0-100: 40% 12-1m return, 30% 6-1m, 20% near 52w high, 10% above 200d.\"\"\"\n    if not ms:\n        return ms\n    r12 = pct_ranks([m.ret_12_1 for m in ms])\n    r6 = pct_ranks([m.ret_6_1 for m in ms])\n    hi = pct_ranks([-m.from_high_pct for m in ms])\n    tr = pct_ranks([m.price / m.sma200 for m in ms])\n    for k, m in enumerate(ms):\n        m.score = 0.4 * r12[k] + 0.3 * r6[k] + 0.2 * hi[k] + 0.1 * tr[k]\n    ms.sort(key=lambda m: m.score, reverse=True)\n    for k, m in enumerate(ms, 1):\n        m.rank, m.of = k, len(ms)\n    return ms\n\n\n# =============================================================================\n# News: Benzinga headlines (via Alpaca), rated by keyword rules or by Claude\n# =============================================================================\n\nMACRO_TICKERS = {\"SPY\", \"QQQ\", \"DIA\", \"IWM\", \"VOO\", \"VTI\"}\nINVERSE = {\"PSQ\", \"SH\"}   # inverse funds the paper account uses as a market hedge\nMARKET_KEY = \"_MARKET\"\nNEWS_KEEP_HOURS = 72\nNEWS_HALF_LIFE_HOURS = 24\n\n# (category, direction, strength 1-3, pattern). Several can match; they add up.\nNEWS_RULES = [\n    (\"bankruptcy\", -1, 3, r\"\\b(bankrupt\\w*|chapter 11|going.concern|delist\\w*)\"),\n    (\"scandal\", -1, 3, r\"\\b(scandal|misconduct|affairs?|spy|spying|brib\\w*|embezzl\\w*|fraud\\w*|accounting irregular\\w*)\\b\"),\n    (\"leadership exit\", -1, 2, r\"\\b(ceo|cfo|chief executive|founder|chairman)\\b.{0,60}\\b(resign\\w*|steps? down|stepping down|ousted|fired|departs?|departure|exits?|leaves|oust\\w*)\"),\n    (\"leadership return\", 1, 3, r\"\\b(reinstat\\w*|returns? as|comeback as|back as|rehir\\w*)\\b.{0,40}\\b(ceo|chief executive|president)\\b|\\b(ceo|chief executive|founder)\\b.{0,40}\\b(reinstat\\w*|returns?|is back)\\b\"),\n    (\"record / blowout\", 1, 2, r\"\\b(record (revenue|sales|quarter|profit)|blowout (quarter|results?|earnings))\\b|\\bsoars?\\b|\\bskyrockets?\\b\"),\n    (\"crash / plunge\", -1, 2, r\"\\b(plunges?|plummets?|craters?|tanks?|collapses?)\\b\"),\n    (\"earnings beat\", 1, 2, r\"\\b(beats?|tops?|surpass\\w*|exceeds?|crush\\w*)\\b.{0,40}\\b(estimates?|expectations?|consensus|views?)\"),\n    (\"raised guidance\", 1, 2, r\"\\b(raises?|boosts?|lifts?|hikes?|strong)\\b.{0,30}\\b(guidance|outlook|forecast)\"),\n    (\"earnings miss\", -1, 2, r\"\\b(miss(es|ed)?|falls? short)\\b.{0,40}\\b(estimates?|expectations?|consensus)\"),\n    (\"cut guidance\", -1, 2, r\"\\b(cuts?|lowers?|slashes?|reduces?|withdraws?|weak)\\b.{0,30}\\b(guidance|outlook|forecast)|\\b(profit|revenue|sales) warning\\b\"),\n    (\"analyst upgrade\", 1, 1, r\"\\bupgrad\\w*|\\b(raises?|boosts?|lifts?)\\b.{0,25}\\bprice target|\\bprice target\\b.{0,15}\\braised\"),\n    (\"analyst downgrade\", -1, 1, r\"\\bdowngrad\\w*|\\b(cuts?|lowers?|slashes?|halves?)\\b.{0,25}\\bprice target\"),\n    (\"legal / probe\", -1, 2, r\"\\b(sec|doj|ftc|justice department|regulators?|congress\\w*|house committees?)\\b.{0,40}\\b(probe\\w*|investigat\\w*|charges?|sues?|subpoena\\w*|summon\\w*|testify)|\\bclass action\\b|\\bindict\\w*|\\bantitrust\\b|\\bsued\\b\"),\n    (\"FDA approval\", 1, 3, r\"\\bfda\\b.{0,30}\\bapprov\\w*\"),\n    (\"FDA setback\", -1, 3, r\"\\bfda\\b.{0,30}\\b(reject\\w*|declin\\w*)|complete response letter|clinical hold|trial fail\\w*\"),\n    (\"takeover target\", 1, 3, r\"\\b(to be acquired|agrees? to be (bought|acquired)|buyout offer|takeover (bid|offer)|acquired by)\\b\"),\n    (\"share offering\", -1, 2, r\"\\b(public|secondary|stock|share|equity) offering\\b|\\bshare sale\\b|\\bdilut\\w*\"),\n    (\"buyback / dividend\", 1, 1, r\"\\bbuyback\\b|\\brepurchase\\b|\\b(raises?|hikes?|increases?)\\b.{0,15}\\bdividend\"),\n    (\"big contract / deal\", 1, 1, r\"\\b(wins?|awarded|secures?|lands?)\\b.{0,30}\\b(contract|order|deal)\\b\"),\n    (\"product / security problem\", -1, 2, r\"\\brecall\\w*|\\boutage\\b|\\bdata breach\\b|\\bhacked\\b|\\bcyberattack\\b|\\bhalts? production\"),\n    (\"trade / export risk\", -1, 2, r\"\\bexport (bans?|restrictions?|curbs?|controls?)\\b|\\btariffs?\\b|\\bsanction\\w*\"),\n    (\"rate cut / cooling inflation\", 1, 2, r\"\\b(rate cuts?|cuts? (interest )?rates)\\b|\\binflation (cools|cooled|eases|eased|slows|slowed)\"),\n    (\"rate hike / hot inflation\", -1, 2, r\"\\b(rate hikes?|raises? (interest )?rates)\\b|\\binflation (heats|accelerat\\w*|jumps|hotter|surges)|\\brecession\\b|\\bgovernment shutdown\\b\"),\n]\nNEWS_RULES = [(c, d, st, re.compile(p, re.I)) for c, d, st, p in NEWS_RULES]\nMACRO_WORDS = re.compile(r\"\\b(fed|federal reserve|fomc|powell|inflation|cpi|pce|jobs report|payrolls|\"\n                         r\"unemployment|gdp|tariffs?|recession|treasury yields?|rate (cut|hike)s?|shutdown)\\b\", re.I)\nHEDGE_WORDS = re.compile(r\"\\b(reportedly|rumou?rs?|rumou?red|considering|weighs|could|may|might|denies|\"\n                         r\"explor\\w*|in talks|sources say|speculat\\w*)\\b\", re.I)\nOPINION_HEADLINE = re.compile(r\"^(why|what|how|should|is|are|will|\\d+ (stocks?|reasons?)|top \\d+|here'?s|these)\\b\"\n                              r\"|\\?\\s*$|\\bstocks? to (buy|watch|avoid)\\b|\\b(movers|mid-day|premarket|after-hours) (gainers|losers|movers)\\b\",\n                              re.I)\nSTRENGTH_WORD = {1: \"small\", 2: \"medium\", 3: \"large\"}\n\n\n@dataclass\nclass NewsEvent:\n    id: str\n    symbol: str          # a ticker, or MARKET_KEY for market-wide news\n    headline: str\n    url: str\n    created_at: str\n    category: str\n    direction: int       # -1 bad, 0 mixed/neutral, +1 good\n    strength: int        # 1 small, 2 medium, 3 large\n    confidence: float    # 0-1\n    why: str = \"\"\n    rater: str = \"keywords\"\n\n    @property\n    def impact(self) -> float:\n        return self.direction * self.strength * self.confidence\n\n\ndef rate_headline(headline: str, summary: str = \"\") -> tuple[int, int, float, str] | None:\n    \"\"\"Keyword rating -> (direction, strength, confidence, category) or None if nothing matched.\"\"\"\n    text = f\"{headline} . {summary[:300]}\"\n    hits = [(c, d, st) for c, d, st, rx in NEWS_RULES if rx.search(text)]\n    if not hits:\n        return None\n    net = sum(d * st for _, d, st in hits)\n    cats = \" + \".join(dict.fromkeys(c for c, _, _ in hits))\n    direction = (net > 0) - (net < 0)\n    strength = max(1, min(3, abs(net))) if direction else 1\n    conf = 0.7\n    if HEDGE_WORDS.search(headline):\n        conf = 0.4\n    if OPINION_HEADLINE.search(headline.strip()):\n        conf = 0.25\n    return direction, strength, conf, (cats if direction else f\"mixed: {cats}\")\n\n\nCLAUDE_SYSTEM = (\n    \"You are a cautious stock news analyst. For each news item, rate the likely price impact on \"\n    \"each listed ticker over the next 1-5 trading days. Use ONLY the headline and summary given; \"\n    \"never add outside facts. Rumors, opinion pieces, lists of 'stocks to buy', and recaps of moves \"\n    \"that already happened get confidence 0.3 or less. No news is ever certain: never give \"\n    \"confidence above 0.85. Reply with ONLY a JSON array, one object per (id, symbol): \"\n    '{\"id\": \"...\", \"symbol\": \"...\", \"category\": \"earnings|guidance|analyst|leadership|scandal|legal|'\n    'regulatory|fda|merger|offering|buyback|product|macro|other\", \"direction\": -1|0|1, '\n    '\"strength\": 1|2|3, \"confidence\": 0.0-0.85, \"why\": \"max 12 words\"}. '\n    'Use symbol \"_MARKET\" for market-wide items.'\n)\n\n\ndef claude_body(cfg: dict, model: str, system: str, user: str, max_tokens: int, **extra) -> dict:\n    \"\"\"Claude Opus 5.5 at low effort (adaptive thinking is always on, so leave room for it).\"\"\"\n    return {\"model\": model, \"max_tokens\": max(max_tokens, 3000), \"system\": system,\n            \"output_config\": {\"effort\": cfg.get(\"claude_effort\", \"low\")},\n            \"messages\": [{\"role\": \"user\", \"content\": user}], **extra}\n\n\ndef ask_openai(system: str, user: str, cfg: dict, max_tokens: int = 1500) -> str | None:\n    key = os.environ.get(\"OPENAI_API_KEY\", \"\")\n    if not key:\n        return None\n    try:\n        r = http_json(\"POST\", OPENAI_URL, {\"Authorization\": f\"Bearer {key}\"},\n                      body={\"model\": cfg.get(\"openai_model\", \"gpt-5.6-luna\"), \"max_completion_tokens\": max_tokens,\n                            \"messages\": [{\"role\": \"system\", \"content\": system}, {\"role\": \"user\", \"content\": user}]},\n                      timeout=60)\n        return (((r or {}).get(\"choices\") or [{}])[0].get(\"message\") or {}).get(\"content\") or None\n    except (ApiError, KeyError, TypeError, IndexError) as e:\n        print(f\"ChatGPT failed ({e}); trying Claude.\")\n        return None\n\n\ndef ask_claude(system: str, user: str, cfg: dict, max_tokens: int = 1500) -> str | None:\n    key = os.environ.get(\"ANTHROPIC_API_KEY\", \"\")\n    if not key:\n        return None\n    try:\n        r = http_json(\"POST\", CLAUDE_URL, {\"x-api-key\": key, \"anthropic-version\": \"2023-06-01\"},\n                      body=claude_body(cfg, cfg[\"news_ai_model\"], system, user, max_tokens), timeout=90)\n        return \"\".join(b.get(\"text\", \"\") for b in (r or {}).get(\"content\", []) if b.get(\"type\", \"text\") == \"text\") or None\n    except (ApiError, KeyError, TypeError) as e:\n        print(f\"Claude failed ({e}).\")\n        return None\n\n\ndef ask_ai(system: str, user: str, cfg: dict, budgets: \"Budgets | None\" = None, max_tokens: int = 1500,\n           check=None) -> tuple[str | None, str]:\n    \"\"\"ChatGPT first; Claude only if ChatGPT isn't set up, fails, or gives an answer `check` rejects.\"\"\"\n    for name, fn in ((\"openai\", ask_openai), (\"claude\", ask_claude)):\n        env = PROVIDERS[name][0]\n        if not os.environ.get(env) or (budgets and not budgets.can(name)):\n            continue\n        if budgets:\n            budgets.use(name)\n        out = fn(system, user, cfg, max_tokens)\n        if out and (check is None or check(out)):\n            return out, PROVIDERS[name][2]\n    return None, \"\"\n\n\ndef _json_array(text: str) -> list:\n    try:\n        return json.loads(text[text.index(\"[\"): text.rindex(\"]\") + 1])\n    except (ValueError, AttributeError):\n        return []\n\n\ndef rate_with_claude(items: list[dict], cfg: dict, budgets: \"Budgets | None\" = None) -> dict[tuple[str, str], dict] | None:\n    \"\"\"items: [{id, symbols, headline, summary}]. Returns {(id, symbol): rating} or None on failure.\"\"\"\n    if not items:\n        return None\n    payload = [{\"id\": i[\"id\"], \"symbols\": i[\"symbols\"], \"headline\": i[\"headline\"][:300],\n                \"summary\": i[\"summary\"][:300]} for i in items[:40]]\n    text, by = ask_ai(CLAUDE_SYSTEM, json.dumps(payload), cfg, budgets, 3000, check=lambda t: bool(_json_array(t)))\n    arr = _json_array(text or \"\")\n    if not arr:\n        print(\"AI news rating unavailable; using keyword rules instead.\")\n        return None\n    out = {}\n    for x in arr:\n        try:\n            out[(str(x[\"id\"]), str(x[\"symbol\"]).upper() if x[\"symbol\"] != MARKET_KEY else MARKET_KEY)] = {\n                \"direction\": max(-1, min(1, int(x[\"direction\"]))),\n                \"strength\": max(1, min(3, int(x[\"strength\"]))),\n                \"confidence\": max(0.0, min(0.85, float(x[\"confidence\"]))),\n                \"category\": str(x.get(\"category\", \"other\"))[:30],\n                \"why\": str(x.get(\"why\", \"\"))[:100], \"by\": by}\n        except (KeyError, TypeError, ValueError):\n            continue\n    return out\n\n\ndef process_news(alp: \"Alpaca\", cfg: dict, state: dict, interest: set[str], now_iso: str,\n                 budgets: \"Budgets | None\" = None, knowledge: dict | None = None,\n                 held: set[str] | frozenset = frozenset()) -> list[NewsEvent]:\n    \"\"\"Fetches new headlines, rates the ones that matter to you, stores them. Returns new events.\n    Keyword rules rate everything for free. Claude is asked only about stocks you OWN when the\n    rules can't tell (no match, mixed, or low confidence), and only within its daily budget.\"\"\"\n    ns = state.setdefault(\"news\", {})\n    seen = set(ns.get(\"seen\", []))\n    now = parse_ts(now_iso)\n    start = ns.get(\"last\") or (now - timedelta(hours=24)).strftime(\"%Y-%m-%dT%H:%M:%SZ\")\n    raw = alp.news(start)\n\n    candidates = []\n    for it in raw:\n        nid = str(it.get(\"id\"))\n        ns[\"last\"] = max(ns.get(\"last\", \"\"), it.get(\"created_at\") or \"\")\n        if nid in seen:\n            continue\n        seen.add(nid)\n        tickers = [t.upper() for t in it.get(\"symbols\") or []]\n        syms = sorted(set(tickers) & interest - MACRO_TICKERS)\n        headline, summary = it.get(\"headline\") or \"\", it.get(\"summary\") or \"\"\n        is_macro = (not syms) and (not tickers or set(tickers) & MACRO_TICKERS) and MACRO_WORDS.search(headline)\n        if not syms and not is_macro:\n            continue\n        candidates.append({\"id\": nid, \"symbols\": syms or [MARKET_KEY], \"headline\": headline,\n                           \"summary\": summary, \"url\": it.get(\"url\") or \"\",\n                           \"created_at\": it.get(\"created_at\") or now_iso})\n\n    if knowledge is not None:\n        note_trending(knowledge, raw, interest, now_iso)\n    unsure = []\n    for c in candidates:\n        if not set(c[\"symbols\"]) & set(held):\n            continue\n        kw = rate_headline(c[\"headline\"], c[\"summary\"])\n        if kw is None or kw[0] == 0 or kw[2] < 0.5:\n            unsure.append(c)\n    ai = None\n    if unsure and budgets is not None:\n        ai = rate_with_claude(unsure[:15], cfg, budgets)   # ChatGPT first, Claude if that fails\n    events = []\n    for c in candidates:\n        kw = rate_headline(c[\"headline\"], c[\"summary\"])\n        for sym in c[\"symbols\"]:\n            r = ai.get((c[\"id\"], sym)) if ai else None\n            if r:\n                ev = NewsEvent(c[\"id\"], sym, c[\"headline\"], c[\"url\"], c[\"created_at\"], r[\"category\"],\n                               r[\"direction\"], r[\"strength\"], r[\"confidence\"], r[\"why\"], r.get(\"by\") or \"AI\")\n            elif kw:\n                d, st, conf, cat = kw\n                ev = NewsEvent(c[\"id\"], sym, c[\"headline\"], c[\"url\"], c[\"created_at\"], cat, d, st, conf)\n            else:\n                continue\n            if ev.direction == 0 and ev.strength < 2:\n                continue\n            events.append(ev)\n\n    # Store compactly and forget anything older than 3 days\n    store = ns.setdefault(\"events\", {})\n    for ev in events:\n        store.setdefault(ev.symbol, []).append(\n            [ev.created_at, round(ev.impact, 2), ev.category[:40], ev.headline[:100]])\n    cutoff = now - timedelta(hours=NEWS_KEEP_HOURS)\n    for sym in list(store):\n        store[sym] = [e for e in store[sym] if _safe_ts(e[0]) >= cutoff][-20:]\n        if not store[sym]:\n            del store[sym]\n    ns[\"seen\"] = sorted(seen, key=lambda x: (len(x), x))[-600:]\n    print(f\"News: {len(raw)} new headlines, {len(candidates)} about your stocks/market, \"\n          f\"{len(events)} rated (keyword rules{' + Claude for ' + str(len(unsure)) + ' unclear' if ai else ''}).\")\n    return events\n\n\ndef _safe_ts(ts: str) -> datetime:\n    try:\n        return parse_ts(ts)\n    except (ValueError, TypeError):\n        return datetime.fromisoformat(\"2000-01-01T00:00:00+00:00\")\n\n\n@dataclass\nclass NewsView:\n    score: float = 0.0     # decayed sum of impacts: about -3 (very bad) .. +3 (very good)\n    label: str = \"\"        # strongest recent story's category\n    headline: str = \"\"\n\n\ndef news_view(state: dict, symbol: str, now_iso: str) -> NewsView:\n    evs = state.get(\"news\", {}).get(\"events\", {}).get(symbol, [])\n    if not evs:\n        return NewsView()\n    now = parse_ts(now_iso)\n    score, best = 0.0, None\n    for ts, impact, cat, head in evs:\n        age_h = max(0.0, (now - _safe_ts(ts)).total_seconds() / 3600)\n        w = impact * 0.5 ** (age_h / NEWS_HALF_LIFE_HOURS)\n        score += w\n        if best is None or abs(w) > abs(best[0]):\n            best = (w, cat, head)\n    return NewsView(round(score, 2), best[1], best[2])\n\n\n# =============================================================================\n# Position size and dollar scenarios\n# =============================================================================\n\ndef risk_label(atr_pct: float) -> str:\n    return \"LOW\" if atr_pct <= 1.5 else \"MODERATE\" if atr_pct <= 2.5 else \"HIGHER\"\n\n\ndef position_size(price: float, cfg: dict) -> tuple[float, float]:\n    \"\"\"Dollars and shares so that hitting your stop loses about risk_per_trade_pct of the account,\n    capped at max_position_pct. Good news never raises the cap: no trade is a sure thing.\"\"\"\n    acct = float(cfg[\"account_size\"])\n    by_risk = acct * cfg[\"risk_per_trade_pct\"] / 100 / (cfg[\"stop_pct\"] / 100)\n    dollars = math.floor(min(by_risk, acct * cfg[\"max_position_pct\"] / 100) * 100) / 100\n    return dollars, (dollars / price if price > 0 else 0.0)\n\n\ndef dollar_scenarios(price: float, shares: float, atr_pct: float, big_pct: float = 0.0) -> str:\n    \"\"\"Both numbers come from the stock's own last year of prices: nothing estimated.\"\"\"\n    s = f\"Typical day for {shares:.4g} sh: ±{atr_pct:.1f}% = ±{money(price * shares * atr_pct / 100)}\"\n    if big_pct:\n        s += (f\" • its big days (1 in 20 over the last year) moved ±{big_pct:.1f}% = \"\n              f\"±{money(price * shares * big_pct / 100)}\")\n    return s\n\n\n# =============================================================================\n# Decisions\n# =============================================================================\n\ndef market_ok(spy: Metrics | None) -> tuple[bool, str]:\n    if spy is None:\n        return False, \"no SPY data\"\n    gap = (spy.price / spy.sma200 - 1) * 100\n    if spy.price > spy.sma200:\n        warn = (f\", but under pressure: {spy.dist_days} heavy-selling days in 5 weeks\" if spy.dist_days >= 5 else \"\")\n        return True, f\"market healthy: SPY {gap:+.1f}% vs its 200-day\" + warn\n    return False, f\"market weak: SPY {gap:+.1f}% vs its 200-day, so buy alerts are paused\"\n\n\ndef buy_check(m: Metrics, cfg: dict, regime: bool, nv: \"NewsView | None\" = None) -> tuple[bool, list[str]]:\n    \"\"\"Returns (passes, list of failed checks).\"\"\"\n    fails = []\n    rp = RISK_PROFILES[cfg[\"risk_level\"]]\n    spec = cfg[\"risk_level\"] == \"speculative\"\n    max_atr = rp[\"atr\"] if cfg[\"risk_level\"] in (\"high\", \"speculative\") else min(cfg[\"max_atr_pct\"], rp[\"atr\"])\n    top_n = max(1, math.ceil(cfg[\"top_n\"] * rp[\"top\"]))\n    rsi_max = cfg[\"rsi_max\"] + rp[\"rsi\"]\n    if not regime:\n        fails.append(\"the whole market is weak right now\")\n    if m.rank > top_n:\n        fails.append(f\"not a top-{top_n} mover (ranked #{m.rank})\")\n    if not (m.price > m.sma50 > m.sma200 or (spec and m.price > m.sma50)):\n        fails.append(\"not in a steady uptrend\")\n    if m.sma200 <= m.sma200_prev and not spec:\n        fails.append(\"its long-term trend isn't rising\")\n    if m.from_high_pct > cfg[\"max_from_high_pct\"] * rp[\"high\"]:\n        fails.append(f\"{m.from_high_pct:.0f}% below its yearly high\")\n    if not (cfg[\"rsi_min\"] <= m.rsi <= rsi_max):\n        fails.append(\"overheated after a fast run-up\" if m.rsi > rsi_max else \"losing steam\")\n    if m.price < m.sma20:\n        fails.append(\"dipped below its recent average\")\n    if m.above_sma20_pct > cfg[\"max_above_sma20_pct\"]:\n        fails.append(f\"ran up too fast ({m.above_sma20_pct:.1f}% above its recent average)\")\n    if m.atr_pct > max_atr:\n        fails.append(f\"price swings too big for {rp['label'].lower()} risk (±{m.atr_pct:.1f}% a day)\")\n    if cfg[\"require_green_day\"] and m.price <= m.prev_close:\n        fails.append(\"down today; waiting for a green day\")\n    if nv and nv.score <= cfg[\"news_block_buy_score\"]:\n        fails.append(f\"bad news: {nv.label}\")\n    return (not fails), fails\n\n\ndef hold_advice(m: Metrics, regime: bool, nv: \"NewsView | None\" = None,\n                mkt: \"NewsView | None\" = None) -> tuple[str, int, list[str]]:\n    \"\"\"Reads news, trend, momentum and market. Returns (verdict, points, reasons).\"\"\"\n    pts, why = 0, []\n    # News first, so it shows at the top of the reasons\n    if nv and nv.score <= -1.0:\n        pts -= 2; why.append(f\"✗ bad news: {nv.label}\")\n    elif nv and nv.score <= -0.4:\n        pts -= 1; why.append(f\"✗ negative news: {nv.label}\")\n    elif nv and nv.score >= 0.8:\n        pts += 1; why.append(f\"✓ good news: {nv.label}\")\n    if mkt and mkt.score <= -1.0:\n        pts -= 1; why.append(f\"✗ market news: {mkt.label}\")\n\n    def add(cond, good, bad, wgood=1, wbad=-1):\n        nonlocal pts\n        pts += wgood if cond else wbad\n        why.append((\"✓ \" + good) if cond else (\"✗ \" + bad))\n    add(m.price > m.sma20, \"above 20-day\", \"below 20-day\")\n    add(m.price > m.sma50, \"above 50-day\", \"below 50-day (trend damaged)\", 1, -2)\n    add(m.sma50 > m.sma200, \"50-day above 200-day\", \"50-day below 200-day\")\n    if m.rsi > 78:\n        pts -= 1; why.append(f\"✗ RSI {m.rsi:.0f} overbought (pullback risk)\")\n    elif m.rsi < 40:\n        pts -= 1; why.append(f\"✗ RSI {m.rsi:.0f} weak\")\n    else:\n        pts += 1; why.append(f\"✓ RSI {m.rsi:.0f} healthy\")\n    if m.of:\n        if m.rank <= max(1, m.of // 4):\n            pts += 1; why.append(f\"✓ momentum rank #{m.rank}/{m.of}\")\n        elif m.rank > m.of // 2:\n            pts -= 1; why.append(f\"✗ momentum rank #{m.rank}/{m.of}\")\n    add(regime, \"market healthy\", \"market weak\")\n    if pts >= 4:\n        verdict = \"HOLD: strong trend\"\n    elif pts >= 1:\n        verdict = \"HOLD, but watch it\"\n    elif pts >= -1:\n        verdict = \"LEAN SELL: momentum fading\"\n    else:\n        verdict = \"SELL: trend is breaking\"\n    return verdict, pts, why\n\n\nSTATUSES = (\"STRONG BUY\", \"BUY\", \"WATCH\", \"HOLD\", \"REDUCE\", \"SELL\", \"PASS\")\n\n\ndef assess(m: Metrics, cfg: dict, regime: bool, nv: \"NewsView | None\" = None,\n           mkt: \"NewsView | None\" = None, owned: bool = False) -> dict:\n    \"\"\"One status per stock (STRONG BUY / BUY / WATCH / HOLD / REDUCE / SELL / PASS), a 5-95\n    confidence score, and what kind of setup it is. Built only from the real scan data.\"\"\"\n    ok, fails = buy_check(m, cfg, regime, nv)\n    verdict, pts, why = hold_advice(m, regime, nv, mkt)\n    rp = RISK_PROFILES[cfg[\"risk_level\"]]\n    conf = 50 + pts * 5\n    if m.of:\n        conf += 10 if m.rank <= max(1, m.of // 10) else 5 if m.rank <= m.of // 4 else -5 if m.rank > m.of // 2 else 0\n    conf += round(max(-1.5, min(1.5, nv.score if nv else 0)) * 6)\n    conf -= 4 * len(fails)\n    uptrend = m.price > m.sma50 > m.sma200\n    pullback = uptrend and -1.5 <= m.above_sma20_pct <= 2.0 and 38 <= m.rsi <= 58 and m.from_high_pct <= 15\n    breakout = m.from_high_pct <= 2.0 and m.vol_ratio >= 1.5 and m.price > m.prev_close\n    if pullback:\n        conf += 5      # playbook: buy a pause in a strong trend, not a stock that is falling\n    if breakout:\n        conf += 5      # playbook: a new high on heavy volume is the market confirming the move\n    if m.from_high_pct <= 2.0 and 0 < m.vol_ratio < 0.7:\n        conf -= 3      # a new high on thin volume is less trustworthy\n    if m.dist_days >= 6:\n        conf -= 4      # big holders have been selling into it (playbook: warnings come before the break)\n        why = why + [f\"✗ heavy selling: {m.dist_days} down days on rising volume in 5 weeks\"]\n    climax = m.run_10d_pct >= 25 and m.vol_ratio >= 2.0\n    if climax and not owned:\n        conf -= 5      # the crowd piles in at the top (playbook: the public buys tops)\n    conf = int(max(5, min(95, conf)))\n    weak_only = (not regime) and fails == [\"the whole market is weak right now\"]\n    if owned:\n        status = (\"HOLD\" if verdict.startswith(\"HOLD\") else \"REDUCE\" if verdict.startswith(\"LEAN\") else \"SELL\")\n        if climax and status == \"HOLD\":\n            status = \"REDUCE\"   # sell some into a climax run instead of waiting for the top\n            why = why + [f\"⚠ climax run: +{m.run_10d_pct:.0f}% in 2 weeks on {m.vol_ratio:.1f}× volume; think about taking some profit\"]\n    elif ok and conf >= rp[\"conf\"]:\n        status = \"STRONG BUY\" if (conf >= 80 and m.rank <= max(3, m.of // 10) and (not nv or nv.score >= 0)) else \"BUY\"\n    elif ok:\n        status, fails = \"WATCH\", [f\"needs more confidence for {rp['label'].lower()} risk ({conf} < {rp['conf']})\"]\n    elif weak_only or (len(fails) <= (3 if not regime else 2) + (1 if cfg[\"risk_level\"] == \"speculative\" else 0)\n                       and m.price > m.sma50 and m.rank <= max(5, (m.of or 40) // 2)):\n        status = \"WATCH\"   # a strong stock that's missing a few things: say what to wait for, don't just pass\n    else:\n        status = \"PASS\"\n    # What kind of opportunity it is\n    fl = \" \".join(fails)\n    if status in (\"STRONG BUY\", \"BUY\"):\n        setup = (\"Speculative opportunity\" if m.atr_pct > RISK_PROFILES[\"high\"][\"atr\"] or cfg[\"risk_level\"] == \"speculative\"\n                 else \"Immediate opportunity\")\n    elif status == \"WATCH\":\n        setup = (\"Wait for the market to recover\" if \"market is weak\" in fl and len(fails) == 1 else\n                 \"Wait for a better entry\" if (\"too fast\" in fl or \"overheated\" in fl) else\n                 \"Pullback in an uptrend\" if pullback else\n                 \"Breakout confirmation needed\" if (m.from_high_pct <= 3 or \"green day\" in fl) else \"Watch\")\n    else:\n        setup = \"\"\n    if status in (\"STRONG BUY\", \"BUY\") and breakout:\n        setup = \"Breakout on heavy volume\"\n    elif status in (\"STRONG BUY\", \"BUY\") and pullback and setup == \"Immediate opportunity\":\n        setup = \"Pullback entry in an uptrend\"\n    return {\"status\": status, \"conf\": conf, \"ok\": ok, \"fails\": fails, \"verdict\": verdict, \"pts\": pts,\n            \"why\": why, \"setup\": setup, \"trigger\": \"\" if owned or ok else buy_trigger(m, fails)}\n\n\ndef buy_trigger(m: Metrics, fails: list[str]) -> str:\n    \"\"\"What has to happen before this becomes a buy, in plain words with real price levels.\"\"\"\n    out = []\n    for f in fails:\n        if \"market is weak\" in f:\n            out.append(\"the S&P 500 gets back above its 200-day average\")\n        elif \"overheated\" in f or \"too fast\" in f:\n            out.append(f\"it cools off toward ${m.sma20:,.2f} (its 20-day average)\")\n        elif \"below its recent average\" in f:\n            out.append(f\"it closes back above ${m.sma20:,.2f}\")\n        elif \"steady uptrend\" in f:\n
