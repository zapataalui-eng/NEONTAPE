/* ---------- utf-8 base64 ---------- */
function enc(str) { const b = new TextEncoder().encode(str); let s = ""; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
function dec(b64) { const bin = atob(b64.replace(/\s/g, "")); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }

/* ---------- GitHub ---------- */
function friendly(status, msg) {
  if (status === 401) return "GitHub rejected your access key. Make a new one in Bot → Setup.";
  if (status === 403) return "Your access key is missing a permission (" + msg + ").";
  if (status === 404) return "GitHub couldn't find that. Check the username, repo name and key.";
  if (status === 409) return "Your repo is empty. Install the bot in Bot → Setup.";
  if (status === 422) return msg || "GitHub didn't accept that.";
  return msg || ("GitHub error " + status);
}
async function gh(path, { method = "GET", body, raw = false } = {}) {
  let r;
  try {
    r = await fetch("https://api.github.com" + path, {
      method, cache: "no-store",
      headers: Object.assign({ "Authorization": "Bearer " + conf.token,
        "Accept": raw ? "application/vnd.github.raw+json" : "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28" }, body ? { "Content-Type": "application/json" } : {}),
      body: body ? JSON.stringify(body) : undefined });
  } catch (e) { const er = new Error("No connection to GitHub. Check your internet."); er.status = 0; throw er; }
  if (r.status === 204) return null;
  const text = await r.text();
  if (!r.ok) { let m = text; try { m = JSON.parse(text).message; } catch (e) {} const er = new Error(friendly(r.status, m)); er.status = r.status; throw er; }
  if (raw) return text;
  return text ? JSON.parse(text) : null;
}
const repoPath = () => "/repos/" + encodeURIComponent(conf.owner) + "/" + encodeURIComponent(conf.repo);
const cpath = p => repoPath() + "/contents/" + p.split("/").map(encodeURIComponent).join("/");
async function readFile(p) {
  try { const j = await gh(cpath(p)); return { text: dec(j.content || ""), sha: j.sha }; }
  catch (e) { if (e.status === 404 || e.status === 409) return { text: null, sha: null }; throw e; }
}
async function writeFile(p, text, sha, msg) {
  return gh(cpath(p), { method: "PUT", body: Object.assign({ message: msg, content: enc(text) }, sha ? { sha } : {}) });
}
async function dispatch(command, request, rid) {
  const repo = await gh(repoPath());
  const inputs = { command };
  if (request) inputs.request = request;
  if (rid) inputs.rid = rid;
  await gh(repoPath() + "/actions/workflows/scan.yml/dispatches", { method: "POST", body: { ref: repo.default_branch || "main", inputs } });
}

/* ---------- run a bot job and follow it (polls only while it runs and the app is open) ---------- */
let jobTimer = null;
async function lastRunId() {
  try { const r = await gh(repoPath() + "/actions/runs?per_page=1"); return ((r.workflow_runs || [])[0] || {}).id || 0; }
  catch (e) { return 0; }
}
async function startJob(command, request, label, rid) {
  if (!conf || !conf.installed) { toast("Set up the bot first (Settings)", true); return false; }
  if (job) { toast("The bot is still on your last request", true); return false; }
  try {
    const before = await lastRunId();
    await dispatch(command, request, rid);
    job = { label, since: new Date().toISOString(), after: before, kind: command, rid }; store.set("job", job);
    render(); followJob(1500); return true;
  } catch (e) {
    if (e.status === 422 && /request|rid|command|input/i.test(e.message) && !startJob.retried) {
      startJob.retried = true; toast("Updating your bot first…"); await install(true); startJob.retried = false;
      return startJob(command, request, label, rid);
    }
    toast(e.message, true); return false;
  }
}
async function stopJob() {
  const j = job; job = null; store.del("job"); clearTimeout(jobTimer); render();
  if (!j) return;
  try {
    let id = j.runId;
    if (!id) { const r = await gh(repoPath() + "/actions/runs?event=workflow_dispatch&per_page=5"); const run = (r.workflow_runs || []).filter(x => x.id > (j.after || 0)).pop(); id = run && run.id; }
    if (id) await gh(repoPath() + "/actions/runs/" + id + "/cancel", { method: "POST" });
    toast("Stopped");
  } catch (e) { toast(e.status === 409 ? "It already finished" : e.message, e.status !== 409); }
}
function followJob(wait) {
  clearTimeout(jobTimer);
  if (!job || document.hidden) return;
  jobTimer = setTimeout(async () => {
    try {
      const r = await gh(repoPath() + "/actions/runs?event=workflow_dispatch&per_page=5");
      // the first run newer than the one before we asked (no clock comparisons: phone clocks drift)
      const run = (r.workflow_runs || []).filter(x => x.id > (job.after || 0)).pop();
      const age = (Date.now() - Date.parse(job.since)) / 1000;
      if (run && !job.runId) { job.runId = run.id; store.set("job", job); }
      if (run && job.kind === "ai" && run.status !== "completed") {
        // real progress: the workflow's own steps (Fresh scan → Ask AI)
        try {
          const js = await gh(repoPath() + "/actions/runs/" + run.id + "/jobs");
          const steps = ((js.jobs || [])[0] || {}).steps || [];
          const cur = steps.find(x => x.status === "in_progress");
          const p = cur ? cur.name : run.status === "queued" ? "Starting" : "Starting";
          if (job.progress !== p) { job.progress = p; store.set("job", job); if (aiOpen()) aiSheet(); }
        } catch (e) {}
        if (aiOpen()) aiTick();
      }
      if (run && run.status !== "completed" && job.stage !== run.status) { job.stage = run.status; store.set("job", job); render(); }
      if (run && run.status === "completed") {
        const ok = run.conclusion === "success";
        if (run.conclusion === "cancelled") { job = null; store.del("job"); toast("Stopped"); if (aiOpen()) aiSheet(); return render(); }
        if (job.kind === "ai") return finishAI(job, ok);
        toast(ok ? job.label + ": done. Check your notifications." : job.label + " failed. Open Bot → Bot runs.", !ok);
        job = null; store.del("job"); store.del("localReply"); await load(true); return;
      }
      if (age > (job.kind === "ai" ? 240 : 300)) { if (job.kind === "ai") { aiThread.push({ role: "assistant", error: true, content: "The AI took too long (over 4 minutes). Try again, or check Settings → GitHub → Bot runs." }); } job = null; store.del("job"); toast("No answer from GitHub yet. Check Bot → Bot runs.", true); render(); return; }
    } catch (e) { /* try again next tick */ }
    followJob();
  }, wait || 2500);
}

/* ---------- "tell the bot": settings happen instantly here; only checks and scans need GitHub ---------- */
const LIMITS = { stop_pct: [0.6, 20], profit_pct: [0.5, 50], account_size: [1, 1e6], max_buy_alerts_per_day: [0, 10] };
const SKIP = new Set(["I", "THE", "A", "AN", "STOCK", "STOCKS", "MY", "IT", "ON", "AND", "FOR", "ME", "PLEASE", "NOW", "TO", "OF"]);
function tickers(text) {
  const words = (text.match(/\$?[A-Za-z]{1,5}(?:\.[A-Za-z])?\b/g) || []).filter(w => !SKIP.has(w.replace("$", "").toUpperCase()));
  const marked = words.filter(w => w.startsWith("$") || w === w.toUpperCase());
  return [...new Set((marked.length ? marked : words.slice(0, 1)).map(w => w.replace("$", "").toUpperCase()))];
}
function parseAsk(text) {
  const t = text.trim().replace(/\s+/g, " "), low = t.toLowerCase(), acts = [];
  const num = re => { const m = low.match(re); return m ? m[1] : null; };
  if (/\b(pause|mute|stop) (all )?(alerts|notifications)\b/.test(low)) acts.push({ set: "paused", value: true });
  if (/\b(resume|unpause|unmute|start) (all )?(alerts|notifications)\b/.test(low)) acts.push({ set: "paused", value: false });
  let v;
  if ((v = num(/\bstop(?:[- ]loss)?\s*(?:to|at|=|is)?\s*(\d+(?:\.\d+)?)\s*%/))) acts.push({ set: "stop_pct", value: +v });
  if ((v = num(/\b(?:target|take[- ]profit|profit|sell offer)\s*(?:to|at|=|is)?\s*\+?(\d+(?:\.\d+)?)\s*%/))) acts.push({ set: "profit_pct", value: +v });
  if ((v = num(/\brisk\s*(?:to|level)?\s*(?:to\s*)?(low|moderate|medium|high|speculative|spec|any|aggressive)\b/))) acts.push({ set: "risk_level", value: { medium: "moderate", any: "speculative", spec: "speculative", aggressive: "high" }[v] || v });
  if ((v = num(/\b(?:account(?: size)?|i have|budget|balance)\s*(?:is|to|of|=)?\s*\$?(\d+(?:\.\d+)?)/))) acts.push({ set: "account_size", value: +v });
  if ((v = num(/\b(?:max|at most|only)\s*(\d+)\s*buy/))) acts.push({ set: "max_buy_alerts_per_day", value: +v });
  let m = t.match(/\b(?:stop watching|unwatch|ignore|remove|skip)\s+(.+)/i);
  if (m) tickers(m[1]).forEach(x => acts.push({ unwatch: x }));
  else if ((m = t.match(/\b(?:watch|add|track|follow)\s+(.+)/i)) && !/\b(alerts|notifications)\b/i.test(m[1])) tickers(m[1]).forEach(x => acts.push({ watch: x }));
  if ((m = t.match(/\b(?:check|look at|analy[sz]e|how(?:'s| is)|what about|should i (?:buy|sell|hold))\s+(.+)/i))) tickers(m[1]).slice(0, 3).forEach(x => acts.push({ check: x }));
  if (/\b(scan|rescan|run)\b/.test(low) && !acts.some(a => a.check)) acts.push({ scan: true });
  return acts;
}
async function applyLocal(acts) {
  const cur = await readFile("config.json"); const cfg = JSON.parse(cur.text || "{}"), done = [];
  for (const a of acts) {
    if (a.set) {
      const k = a.set; let v = a.value;
      if (LIMITS[k]) { const [lo, hi] = LIMITS[k]; if (!(v >= lo && v <= hi)) { done.push("✗ " + k.replace(/_/g, " ") + " must be " + lo + "–" + hi); continue; } }
      if (k === "risk_level" && !["low", "moderate", "high", "speculative"].includes(v)) { done.push("✗ risk must be low, medium, high or speculative"); continue; }
      cfg[k] = v;
      done.push("✓ " + ({ stop_pct: "Sell line −" + v + "%", profit_pct: "Sell offer +" + v + "%", account_size: "Account " + money(v), max_buy_alerts_per_day: "Max " + v + " buy alerts a day", risk_level: "Risk " + v, paused: v ? "Alerts paused (SELL NOW still comes)" : "Alerts on" })[k]);
    } else if (a.watch || a.unwatch) {
      const sym = a.watch || a.unwatch;
      cfg.watch_extra = (cfg.watch_extra || []).filter(x => x !== sym); cfg.ignore = (cfg.ignore || []).filter(x => x !== sym);
      if (a.watch) { cfg.watch_extra.push(sym); done.push("✓ Watching " + sym); } else { cfg.ignore.push(sym); done.push("✓ Stopped watching " + sym); }
    }
  }
  if (done.some(d => d[0] === "✓")) await writeFile("config.json", JSON.stringify(cfg, null, 2) + "\n", cur.sha, "Tell the bot: " + done.join(", "));
  return done;
}
/* ---------- company names: type "nvidia" or "coca cola" ---------- */
let NAMES = null;
async function loadNames() {
  if (NAMES) return NAMES;
  const c = store.get("names", null);
  if (c && c.day === new Date().toISOString().slice(0, 7)) return (NAMES = c.rows);
  try { const rows = JSON.parse(await gh(cpath("app/names.json"), { raw: true })); store.set("names", { day: new Date().toISOString().slice(0, 7), rows }); return (NAMES = rows); }
  catch (e) { return (NAMES = []); }
}
const norm = t => t.toLowerCase().replace(/[^a-z0-9& ]+/g, " ").replace(/\s+/g, " ").trim();
async function findStock(q) {
  const raw = q.trim().replace(/^\$/, "").replace(/\b(stock|stocks|shares?|inc|corp)\b/gi, "").trim();
  const up = raw.toUpperCase(), n = norm(raw);
  if (!n) return null;
  const known = new Set(Object.keys((dash && dash.all) || {}).concat(myStocks().map(s => s.symbol)));
  const isTick = /^[A-Za-z]{1,5}(\.[A-Za-z])?$/.test(raw);
  // Typed in CAPS or with $ ("AMD", "$amd"), or a stock the bot already knows: treat as a ticker
  if (isTick && (raw === up || q.trim().startsWith("$") || known.has(up))) return up;
  const rows = await loadNames();
  // Otherwise it's probably a company name: "ford", "apple", "coca cola"
  const exact = rows.filter(r => norm(r[1]) === n);
  const pref = exact.length ? exact : rows.filter(r => (norm(r[1]) + " ").startsWith(n + " "));
  const loose = pref.length ? pref : n.length >= 4 ? rows.filter(r => norm(r[1]).startsWith(n)) : [];
  if (loose.length) {
    loose.sort((a, b) => (known.has(b[0]) - known.has(a[0])) || a[1].length - b[1].length || a[0].length - b[0].length);
    return loose[0][0];
  }
  if (isTick && rows.some(r => r[0] === up)) return up;
  return null;
}

async function tellBot(text) {
  if (!conf || !conf.installed) return toast("Set up the bot first (Bot tab)", true);
  const acts = parseAsk(text);
  const settings = acts.filter(a => a.set || a.watch || a.unwatch), checks = acts.filter(a => a.check), scan = acts.some(a => a.scan);
  if (settings.length) {
    try { const done = await applyLocal(settings); store.set("localReply", { text, did: done }); toast(done.join(" · ")); if (dash) dash.paused = settings.some(a => a.set === "paused") ? settings.find(a => a.set === "paused").value : dash.paused; render(); }
    catch (e) { toast(e.message, true); }
  }
  if (checks.length) {
    // "check nvidia" works too: resolve names, not just tickers
    const m = text.match(/\b(?:check|look at|analy[sz]e|how(?:'s| is)|what about|should i (?:buy|sell|hold))\s+(.+)/i);
    const sym = (m && await findStock(m[1].replace(/\b(stock|shares?|doing|today|now|please)\b/gi, "").trim())) || checks[0].check;
    return quickCheck(sym);
  }
  if (scan) return startJob("scan-now", "", "Scanning the market");
  if (settings.length) return;
  // Just a ticker or a company name ("nvidia", "coca cola", "AMD")
  const words = text.trim().split(/\s+/);
  const questiony = /[?]|\b(what|which|why|how|should|could|would|can|is|are|do|does|my|me|i|you|buy|sell|best|good|any|tell|explain|help)\b/i.test(text);
  if (words.length <= 3 && !questiony) {
    const sym = await findStock(text);
    if (sym) return quickCheck(sym);
  }
  return askAI(text);   // anything else is a question for the AI
}

/* Instant answer from the last scan. A live check on GitHub only runs if you tap it. */
function quickCheck(sym) {
  const a = (dash && dash.all && dash.all[sym]) || null;
  const own = FRIEND() ? null : myStocks().find(x => x.symbol === sym);
  const w = ((dash && dash.watch) || []).find(x => x.symbol === sym);
  let h = "<h3>" + esc(sym) + "</h3>";
  const names = NAMES && NAMES.find(r => r[0] === sym);
  if (names) h += '<p class="hint" style="margin-top:-8px">' + esc(names[1]) + "</p>";
  if (!a && !own && FRIEND()) return openSheet(h + '<p class="hint">' + esc(sym) + " isn't one of the stocks the bot follows.</p>");
  if (!a && !own) {
    h += '<p class="hint">' + esc(sym) + " wasn't in the last scan, so there's nothing to show yet.</p>" +
      '<button class="btn primary wide" data-live="' + esc(sym) + '">Run a live check (about 20 seconds)</button>' +
      '<button class="btn wide" style="margin-top:10px" data-ai="Should I buy ' + esc(sym) + '?">Ask AI about ' + esc(sym) + "</button>";
    return openSheet(h);
  }
  const hist = (w && w.hist) || (own && own.hist);
  if (hist) h += chartBlock(hist, own ? [{ v: own.buy, c: "var(--dim)", l: "Bought" }] : []);
  const st = a && a.st;
  const say = own ? (st === "SELL" || (a && /^SELL/.test(a.v)) ? "You should sell" : st === "REDUCE" || (a && /^LEAN/.test(a.v)) ? "You should think about selling" : "You should hold")
    : st === "STRONG BUY" ? "You should buy (strong)" : a && a.ok ? "You should buy" : st === "WATCH" ? "You should wait: " + ((a.setup || "watch").toLowerCase()) : "You should not buy";
  const why = own ? (a ? a.v.split(": ").pop() : own.advice || "") : a && a.ok ? "it passes every buy check" : a ? a.f.map(plainFail).join("; ") : "";
  h += '<div class="verdict" style="--c:' + (/sell/.test(say) ? "var(--down)" : /not|wait/.test(say) ? "var(--amber)" : "var(--up)") + '">' + esc(say) + (a && a.conf != null ? ' <span class="conf">' + a.conf + "/100 sure</span>" : "") + "</div>" + (why ? '<p class="hint" style="margin-top:4px">Why: ' + esc(why) + "</p>" : "");
  h += '<div class="kv"><div><small>Price</small><b>' + (a ? money(a.p) : own && own.price ? money(own.price) : "—") + "</b></div><div><small>Today</small><b class=\"" + (a && a.d < 0 ? "down" : "up") + '">' + (a ? pct(a.d) : "—") + "</b></div><div><small>Risk</small><b>" + (a ? esc(a.risk.toLowerCase()) : "—") + "</b></div></div>";
  if (!own && a && a.trig) h += '<p class="pb" style="--v:var(--amber)"><b>Buy if:</b> ' + esc(a.trig) + "</p>";
  if (own) h += '<p class="hint">You own it: bought ' + money(own.buy) + (own.gain != null ? ", now " + pct(own.gain) : "") + ".</p>";
  if (a) h += '<ul class="reasons"><li>Momentum rank #' + a.r + " of " + a.of + ": 12-mo " + (a.r12 >= 0 ? "+" : "") + a.r12 + "%, 6-mo " + (a.r6 >= 0 ? "+" : "") + a.r6 + "%</li><li>" + a.hi + "% below its 52-week high · RSI " + a.rsi + " · moves ±" + a.atr + "%/day</li>" + (a.news ? "<li>News: " + esc(a.news) + "</li>" : "") + "</ul>";
  h += '<p class="hint">From the scan ' + esc(ago(dash.updated_at || dash.updated)) + ".</p>" + (FRIEND() ? "" : '<div class="btns"><button class="btn small" data-live="' + esc(sym) + '">Live check</button><button class="btn small" data-ai="Should I buy ' + esc(sym) + '? Explain.">Ask AI</button></div>');
  openSheet(h);
}

/* ---------- expandable chart ---------- */
const RANGES = [["1 month", 21], ["3 months", 63], ["6 months", 126], ["1 year", 252]];
function chartBlock(hist, lines, range) {
  const avail = RANGES.filter(r => hist.length >= r[1] * 0.9);
  if (!avail.length) avail.push(["", hist.length]);
  range = range || store.get("range", 63);
  if (!avail.some(r => r[1] === range)) range = avail[avail.length - 1][1];
  const vals = hist.slice(-range), first = vals[0], last = vals[vals.length - 1], chg = (last / first - 1) * 100;
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const label = (avail.find(r => r[1] === range) || [""])[0] || "last " + vals.length + " trading days";
  return '<div class="bigchart" data-hist="' + esc(JSON.stringify(hist)) + '" data-lines="' + esc(JSON.stringify(lines || [])) + '">' +
    '<div class="row" style="align-items:baseline"><b class="num" style="font-family:var(--display);font-size:24px">' + money(last) + '</b><span class="num ' + (chg >= 0 ? "up" : "down") + '" style="margin-left:8px;font-weight:700">' + pct(chg) + "</span></div>" +
    '<small class="hint">Change over the ' + esc(label.replace(/^1 /, "last ").replace(/^(\d) /, "last $1 ")) + " · high " + money(hi) + ", low " + money(lo) + "</small>" +
    spark(vals, { h: 180, cls: "spark tall", color: chg >= 0 ? "var(--up)" : "var(--down)", lines: (lines || []).map(l => ({ v: l.v, c: l.c })) }) +
    ((lines || []).length ? '<p class="hint" style="margin:2px 0 6px">Dashed lines: grey = what you paid, red = your sell line.</p>' : "") +
    (avail.length > 1 ? '<div class="seg" role="group" aria-label="Time range" style="margin-top:8px">' + avail.map(([l, n]) => '<button type="button" data-range="' + n + '" aria-pressed="' + (n === range) + '">' + l + "</button>").join("") + "</div>"
      : '<p class="hint">Longer history (up to 1 year) shows up after the bot\'s next scan.</p>') + "</div>";
}
function openChart(sym) {
  const own = FRIEND() ? null : myStocks().find(x => x.symbol === sym), w = ((dash && dash.watch) || []).find(x => x.symbol === sym);
  const src = own || w;
  if (!src || !(src.hist || src.spark)) return quickCheck(sym);
  openSheet("<h3>" + esc(sym) + "</h3>" + chartBlock(src.hist || src.spark, own ? [{ v: own.buy, c: "var(--dim)" }, { v: own.stop || own.buy * 0.98, c: "var(--down)" }] : []) +
    '<div class="btns"><button class="btn small" data-check="' + esc(sym) + '">What the bot thinks</button>' + (own && !FRIEND() ? '<button class="btn small" data-note="' + esc(sym) + '">Notes</button>' : "") +
    (own && own.src === "manual" && own.line != null ? '<button class="btn small danger" data-sold="' + own.line + '">I sold it</button>' : "") + "</div>");
}

/* ---------- AI: ChatGPT first, Claude Opus 5.5 (low effort) only for extra help ---------- */
let aiThread = [];
const r2 = x => Math.round(x * 100) / 100;
/* Pull the JSON answer out (tolerates code fences or extra words); null if it isn't JSON */
function parseAnswer(text) {
  const t = (text || "").replace(/```(?:json)?/g, "");
  const i = t.indexOf("{"), k = t.lastIndexOf("}");
  if (i < 0 || k <= i) return null;
  try {
    const o = JSON.parse(t.slice(i, k + 1));
    if (!o || typeof o !== "object" || !o.headline) return null;
    o.picks = (Array.isArray(o.picks) ? o.picks : []).filter(p => p && p.symbol).slice(0, 3);
    o.reasons = (Array.isArray(o.reasons) ? o.reasons : []).filter(Boolean).slice(0, 3);
    return o;
  } catch (e) { return null; }
}
/* Dollar size from the user's own rules (same math as the bot), never from the AI */
function sizeFor(price) {
  const st = (dash && dash.settings) || {}, acct = +(dash && dash.account_size) || 0;
  if (!(price > 0) || !(acct > 0)) return null;
  const stop = +st.stop_pct || 2, risk = +st.risk_per_trade_pct || 1, cap = +st.max_position_pct || 50;
  const dollars = Math.floor(Math.min(acct * risk / 100 / (stop / 100), acct * cap / 100) * 100) / 100;

/* Is the US market open right now (New York time, weekdays 9:30-4:00; holidays aren't known here)? */
function nyNow() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", weekday: "short", hour: "numeric", minute: "numeric", hourCycle: "h23" })
    .formatToParts(new Date()).map(x => [x.type, x.value]));
  const mins = +p.hour * 60 + +p.minute;
  return { open: !/Sat|Sun/.test(p.weekday) && mins >= 570 && mins < 960, mins };
}

/* ---------- install / update the bot ---------- */
let installing = false;
async function install(quiet) {
  if (installing) return; installing = true;
  const BOT = JSON.parse(document.getElementById("botfiles").textContent);
  const files = Object.entries(BOT);
  let done = 0, changed = 0;
  const bar = () => $("#instprog"), txt = () => $("#insttext");
  try {
    const mark = await readFile("app/botbuild.json");
    let remote = 0; try { remote = JSON.parse(mark.text || "{}").build || 0; } catch (e) {}
    if (remote > BOT_BUILD) {   // a newer Neon Tape already installed the bot: update this app instead of downgrading the bot
      if (txt()) txt().textContent = "Your bot is newer than this copy of the app. Updating the app…";
      conf.installed = true; conf.botVersion = BOT_VERSION; store.set("conf", conf);
      lastUpdateCheck = 0; checkAppUpdate(); return;
    }
    for (const [path, content] of files) {
      if (txt()) txt().textContent = "Uploading " + path + "…";
      const cur = await readFile(path);
      if (KEEP.has(path)) {
        if (cur.text == null) {
          let body = content;
          if (path === "config.json") { const j = JSON.parse(content); j.holdings_edit_url = appUrl() + "#log-{symbol}-{price}"; j.app_url = appUrl(); body = JSON.stringify(j, null, 2) + "\n"; }
          await writeFile(path, body, null, "Add " + path); changed++;
        }
      } else if (cur.text !== content) {
        await writeFile(path, content, cur.sha, (cur.sha ? "Update " : "Add ") + path); changed++;
      }
      done++; if (bar()) bar().style.width = (done / files.length * 100) + "%";
    }
    if (remote !== BOT_BUILD) await writeFile("app/botbuild.json", JSON.stringify({ build: BOT_BUILD, version: BOT_VERSION }) + "\n", mark.sha, "Bot build " + BOT_VERSION);
    conf.installed = true; conf.botVersion = BOT_VERSION; store.set("conf", conf);
    if (txt()) txt().textContent = "Bot is up to date (" + changed + " file(s) changed).";
    if (!quiet || changed) toast(changed ? "Bot updated" : "Bot is up to date");
    render();
  } catch (e) { if (txt()) txt().textContent = e.message; toast(e.message, true); }
  finally { installing = false; }
}
async function checkSecrets(quiet) {
  try {
    const r = await gh(repoPath() + "/actions/secrets?per_page=100");
    secretsHave = (r.secrets || []).map(s => s.name); store.set("secretsHave", secretsHave);
    const missing = SECRETS_REQ.filter(s => !secretsHave.includes(s));
    conf.secrets = !missing.length; store.set("conf", conf);
    if (!quiet) toast(missing.length ? "Still missing: " + missing.join(", ") : "All required keys are in");
    render();
  } catch (e) { if (!quiet) toast(e.message, true); }
}

function mdToHtml(md) {
  md = md.replace(/^---[\s\S]*?---\s*/, "");
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>")
    .replace(/\[\[(.+?)\]\]/g, (m, n) => '<a href="#" data-note="' + n + '">' + n + "</a>")
    .replace(/\[(.+?)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  let out = "", inList = false;
  md.split("\n").forEach(l => {
    const m = l.match(/^(#{1,3})\s+(.*)/), li = l.match(/^\s*[-*]\s+(.*)/);
    if (!li && inList) { out += "</ul>"; inList = false; }
    if (m) out += "<h" + m[1].length + ">" + inline(m[2]) + "</h" + m[1].length + ">";
    else if (li) { if (!inList) { out += "<ul>"; inList = true; } out += "<li>" + inline(li[1]) + "</li>"; }
    else if (l.trim()) out += "<p>" + inline(l) + "</p>";
  });
  return out + (inList ? "</ul>" : "");
}

function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const m = h.match(/^log-([A-Za-z.]+)-([\d.]+)$/);
  if (m) { tab = "stocks"; render(); setTimeout(() => logSheet(m[1].toUpperCase(), m[2]), 250); return; }
  if (h === "alerts" || h === "picks") tab = "home";
  else if (["home", "stocks", "ideas", "bot"].includes(h)) tab = h;
  render();
}
window.addEventListener("hashchange", route);

  if (!document.hidden) { headSha = null; poll(); if (conf) followJob(); checkAppUpdate(); }
  else { clearTimeout(jobTimer); clearTimeout(pollT); }
});

/* ---------- keep the bot on GitHub matching this app (and repair it if anything changed it) ---------- */
async function botHealth() {
  try {
    // 1. If the website has a newer app, update the app first. Never push old bot files.
    const t = await (await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" })).text();
    const m = t.match(/const BOT_VERSION = "(\w+)"/);
    if (m && m[1] !== BOT_VERSION) return;   // the normal update check reloads the app
  } catch (e) { return; }   // offline: do nothing
  try {
    // 2. Cheap check: does GitHub's scanner.py match the one this app ships?
    const list = await gh(repoPath() + "/contents/");
    const f = (list || []).find(x => x.path === "scanner.py");
    if (conf.botVersion !== BOT_VERSION || !f || f.sha !== SCANNER_SHA) install(true);
  } catch (e) {}
}

/* ---------- the app updates itself: compares its build with the live site ---------- */
let lastUpdateCheck = 0;
async function checkAppUpdate(manual) {
  if (!manual && Date.now() - lastUpdateCheck < 10 * 60000) return;
  lastUpdateCheck = Date.now();
  try {
    const t = await (await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" })).text();
    const m = t.match(/const BOT_VERSION = "(\w+)"/);
    if (!m || m[1] === BOT_VERSION) { if (manual) toast("You're on the newest version"); return; }
    if (!manual && store.get("updateTried") === m[1]) return;   // don't loop if the phone keeps an old copy
    store.set("updateTried", m[1]);
    toast("Updating Neon Tape…");
    setTimeout(() => location.replace(location.pathname + "?v=" + m[1] + location.hash), 700);
  } catch (e) { if (manual) toast("Couldn't check for updates. Are you online?", true); }
}

/* Feel like a real app: no pinch-zoom, no double-tap zoom */
["gesturestart", "gesturechange", "gestureend"].forEach(n => document.addEventListener(n, e => e.preventDefault(), { passive: false }));
document.addEventListener("touchmove", e => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
let lastTouch = 0;
document.addEventListener("touchend", e => { const n = Date.now(); if (n - lastTouch < 300 && !e.target.closest("input,textarea")) e.preventDefault(); lastTouch = n; }, { passive: false });
/* Pull down from the top of any page to refresh */
(function pullToRefresh() {
  const ind = document.createElement("div");
  ind.className = "ptr"; ind.innerHTML = "<i></i>"; document.body.appendChild(ind);
  let y0 = null, dy = 0, busy = false;
  addEventListener("touchstart", e => {
    y0 = !busy && window.scrollY <= 0 && e.touches.length === 1 && !$("#sheet").classList.contains("on") && !e.target.closest(".scrub") ? e.touches[0].clientY : null; dy = 0;
  }, { passive: true });
  addEventListener("touchmove", e => {
    if (y0 == null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    ind.style.transition = "none";
    ind.style.transform = "translate(-50%," + (Math.min(dy, 120) * 0.7 - 70) + "px)";
    ind.classList.toggle("ready", dy > 80);
  }, { passive: true });
  addEventListener("touchend", async () => {
    if (y0 == null) return;
    const go = dy > 80; y0 = null; ind.style.transition = "";
    if (!go || (!conf && !FRIEND())) { ind.style.transform = ""; ind.classList.remove("ready"); return; }
    busy = true; ind.classList.add("spin"); ind.style.transform = "translate(-50%,0)";
    try { headSha = null; if (FRIEND()) await load(); else { await poll(); await load(true); } }
    catch (e) { toast("Couldn't refresh. Check your internet.", true); }
    busy = false; ind.classList.remove("spin", "ready"); ind.style.transform = "";
  });
})();
(function boot() {
  applyLook();
  const cache = store.get("cache", null);
  if (cache) { dash = cache.dash; holdings = { text: cache.holdingsText }; }
  if (!conf && (/(^|[?&])picks\b/.test(location.search) || location.hash === "#picks")) { store.set("mode", "friend"); history.replaceState(null, "", location.pathname + "#home"); }
  route();
  if (conf || FRIEND()) poll();
  if (conf) {
    if (job) followJob();
    // Keep the bot on GitHub up to date with this app, automatically
    if (conf.installed) setTimeout(botHealth, 1500);
    if (conf.installed && !secretsHave) checkSecrets(true);
  }
  setTimeout(checkAppUpdate, 2500);
})();
