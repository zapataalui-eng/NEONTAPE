     base = dict(symbol=\"AAA\", price=100.0, prev_close=99.0, sma20=99.0, sma50=95.0, sma200=85.0, sma200_prev=84.0,\n                    rsi=52.0, atr_pct=2.0, ret_12_1=40.0, ret_6_1=20.0, high_52w=103.0, rank=2, of=40)\n        base.update(kw)\n        return S.Metrics(**base)\n\n    def cfg(self):\n        c = S.load_config(Path(\"/nonexistent.json\")) if False else json.loads(json.dumps(S.DEFAULT_CONFIG))\n        c[\"risk_level\"] = \"moderate\"\n        return c\n\n    def test_weak_market_is_watch_not_pass(self):\n        a = S.assess(self.m(), self.cfg(), regime=False)\n        self.assertEqual(a[\"status\"], \"WATCH\")\n        self.assertEqual(a[\"setup\"], \"Wait for the market to recover\")\n        self.assertIn(\"S&P 500\", a[\"trigger\"])\n\n    def test_pullback_and_trigger_prices(self):\n        a = S.assess(self.m(rsi=50, price=99.5), self.cfg(), regime=True)\n        self.assertIn(a[\"status\"], (\"BUY\", \"STRONG BUY\", \"WATCH\"))\n        hot = S.assess(self.m(price=112.0, rsi=82, high_52w=112.0), self.cfg(), regime=True)\n        self.assertEqual(hot[\"status\"], \"WATCH\")\n        self.assertIn(\"$99.00\", hot[\"trigger\"])        # wait for the 20-day average\n\n    def test_volume_ratio(self):\n        v = [100.0] * 60 + [250.0]\n        self.assertEqual(S._vol_ratio(v, 60), 2.5)\n        self.assertEqual(S._vol_ratio([], 60), 0.0)\n\n    def test_forum_buzz_parses_reddit_and_stocktwits(self):\n        orig = S._soft_json\n        def fake(url, timeout=12):\n            if \"apewisdom\" in url:\n                return {\"results\": [{\"ticker\": \"AAA\", \"name\": \"Aaa Inc\", \"rank\": \"3\", \"mentions\": \"300\",\n                                     \"mentions_24h_ago\": \"80\", \"rank_24h_ago\": \"20\", \"upvotes\": \"900\"}]}\n            return {\"messages\": [{\"entities\": {\"sentiment\": {\"basic\": \"Bullish\"}}, \"created_at\": \"2026-11-19T15:00:00Z\"},\n                                 {\"entities\": {\"sentiment\": {\"basic\": \"Bullish\"}}, \"created_at\": \"2026-11-19T14:00:00Z\"},\n                                 {\"entities\": {\"sentiment\": {\"basic\": \"Bearish\"}}, \"created_at\": \"2026-11-19T13:00:00Z\"},\n                                 {\"entities\": {\"sentiment\": None}, \"created_at\": \"2026-11-19T12:00:00Z\"}]}\n        S._soft_json = fake\n        try:\n            k = {}\n            fb = S.forum_buzz(\"aaa\", k, \"2026-11-19T16:00:00Z\")\n            self.assertTrue(fb[\"hype\"])\n            self.assertEqual(fb[\"stocktwits\"][\"bull_pct\"], 67)\n            self.assertIn(\"Reddit #3\", fb[\"line\"])\n            self.assertIn(\"crowd hype\", fb[\"line\"])\n            self.assertEqual(S.reddit_risers(k, \"2026-11-19T16:00:00Z\")[0][\"symbol\"], \"AAA\")\n        finally:\n            S._soft_json = orig\n\n    def test_big_news_on_a_stock_you_dont_own(self):\n        ev = S.NewsEvent(\"1\", \"AAA\", \"NVIDIA Board Reinstates Jensen Huang as President, CEO\", \"\", \"2026-11-23T13:00:00Z\",\n                         \"leadership return\", 1, 3, 0.7)\n        cfg = self.cfg()\n        before = S.catalyst_alerts([ev], {}, cfg, set(), True, set(), {}, \"2026-11-23T13:05:00Z\", False)\n        self.assertEqual(len(before), 1)\n        self.assertIn(\"⚡ Big news: AAA\", before[0].title)\n        quiet = S.catalyst_alerts([ev], {\"AAA\": self.m(prev_close=99.5)}, cfg, set(), True, set(), {},\n                                  \"2026-11-23T15:00:00Z\", True)\n        self.assertEqual(quiet, [])          # price hasn't confirmed (+0.5%)\n        jump = self.m(prev_close=94.0, price=100.0)\n        got = S.catalyst_alerts([ev], {\"AAA\": jump}, cfg, set(), False, set(), {}, \"2026-11-23T15:00:00Z\", True)\n        self.assertEqual(len(got), 1)\n        self.assertIn(\"Not a buy by your rules\", got[0].message)     # weak market: honest\n        self.assertEqual(S.catalyst_alerts([ev], {\"AAA\": jump}, cfg, set(), True, {\"AAA\"}, {}, \"2026-11-23T15:00:00Z\", True), [])\n\n    def test_heavy_selling_days(self):\n        c = [100.0] * 30\n        v = [1000.0] * 30\n        for k in (24, 26, 28):\n            c[k] = c[k - 1] * 0.99; v[k] = v[k - 1] * 1.5\n            c[k + 1] = c[k]; v[k + 1] = 1000.0\n        self.assertEqual(S._dist_days(c, v, 29), 3)\n\n    def test_climax_run_says_take_some_profit(self):\n        m = self.m(run_10d_pct=31.0, vol_ratio=2.6, price=130.0, sma20=110.0, rsi=84, high_52w=130.0)\n        a = S.assess(m, self.cfg(), regime=True, owned=True)\n        self.assertEqual(a[\"status\"], \"REDUCE\")\n        self.assertTrue(any(\"climax\" in w for w in a[\"why\"]))\n\n    def test_market_under_pressure_text(self):\n        spy = self.m(symbol=\"SPY\", price=500.0, sma200=450.0, dist_days=6)\n        ok, txt = S.market_ok(spy)\n        self.assertTrue(ok)\n        self.assertIn(\"6 heavy-selling days\", txt)\n\n    def test_playbook_reaches_the_ai(self):\n        t = S.playbook_rules()\n        self.assertIn(\"Cut losses\", t)\n        self.assertIn(\"pump-and-dump\", t)\n        self.assertIn(\"PLAYBOOK\", S.agent_system())\n\n\nFAKE_BOOK = \"\"\"The Project Gutenberg eBook of Test\n\n*** START OF THE PROJECT GUTENBERG EBOOK TEST ***\n\nCHAPTER I\n\n\"\"\" + \"\\n\\n\".join(\n    [\"It never was my thinking that made the big money for me. It always was my sitting. Men who can both be right \"\n     \"and sit tight are uncommon. The trader must learn to wait for the market to prove him right.\" + \" filler\" * 20,\n     \"Never average losses. A man who buys more of a falling stock to lower his average is throwing good money \"\n     \"after bad, and the first loss is the smallest.\" + \" filler\" * 20]) + \"\"\"\n\nCHAPTER II\n\n\"\"\" + \"\\n\\n\".join([\"Tips are dangerous. The man who acts on a tip depends on the tipster to tell him when to sell, \"\n                     \"and the tipster rarely does.\" + \" filler\" * 20] * 30) + \"\"\"\n\n*** END OF THE PROJECT GUTENBERG EBOOK TEST ***\nlicense text here\"\"\"\n\n\nclass Library(unittest.TestCase):\n    def setUp(self):\n        self.tmp = tempfile.mkdtemp()\n        self.orig = (S.LIBRARY_DIR, S.LIBRARY)\n        S.LIBRARY_DIR = Path(self.tmp) / \"library\"\n        S.LIBRARY = [{\"id\": 1, \"slug\": \"test\", \"title\": \"Test Book\", \"author\": \"A. Writer\", \"year\": 1923}]\n        S._LIB_CACHE.clear()\n\n    def tearDown(self):\n        S.LIBRARY_DIR, S.LIBRARY = self.orig\n        S._LIB_CACHE.clear()\n\n    def test_split_strips_license_and_tags_chapters(self):\n        ps = S.split_book(FAKE_BOOK)\n        self.assertTrue(all(\"license\" not in p[\"text\"] for p in ps))\n        self.assertEqual(ps[0][\"ch\"], \"Ch. I\")\n        self.assertEqual(ps[-1][\"ch\"], \"Ch. II\")\n\n    def test_download_once_then_search(self):\n        calls = []\n        def fetch(i):\n            calls.append(i); return FAKE_BOOK\n        S.ensure_library(fetch=fetch)\n        S.ensure_library(fetch=fetch)          # already saved: no second download\n        self.assertEqual(calls, [1])\n        hits = S.search_library(\"should I average down on a losing stock?\")\n        self.assertIn(\"average\", hits[0][\"passage\"].lower())\n        self.assertEqual(hits[0][\"book\"], \"Test Book\")\n        self.assertEqual(hits[0][\"chapter\"], \"Ch. I\")\n        self.assertIn(\"tip\", S.search_library(\"tips from a friend\")[0][\"passage\"].lower())\n        self.assertEqual(S.library_status()[\"books\"][0][\"title\"], \"Test Book\")\n        ag = S.Agent.__new__(S.Agent); ag.used = []\n        res = ag.run_tool(\"search_books\", {\"query\": \"averaging down\", \"book\": \"writer\"})\n        self.assertEqual(res[\"passages\"][0][\"chapter\"], \"Ch. I\")\n        self.assertEqual(ag.used, [\"search_books\"])\n\n    def test_failed_download_is_skipped(self):\n        def boom(i):\n            raise S.ApiError(\"offline\")\n        self.assertEqual(S.ensure_library(fetch=boom), [])\n        self.assertEqual(S.search_library(\"tips\"), [])\n\n\nclass FriendsFeed(unittest.TestCase):\n    def test_public_feed_hides_money_and_holdings(self):\n        msg = (\"Why: trend. Buy about $15.00 (~0.1 sh). Medium hold: 2 weeks.\\nSuggested size: $15.00 = 0.1 sh of your $500.00\\n\"\n               \"If it hits your stop $98.00: -$0.30\\nTypical day for 0.1 sh: ±2.0% = ±$0.30\\nSell line $98.00\")\n        data = {\"alerts\": [{\"t\": \"1\", \"kind\": \"buy\", \"sym\": \"AMD\", \"title\": \"BUY AMD\", \"message\": msg},\n                           {\"t\": \"1\", \"kind\": \"stop\", \"sym\": \"NVDA\", \"title\": \"SELL NVDA\", \"message\": \"x\"},\n                           {\"t\": \"1\", \"kind\": \"news\", \"sym\": \"NVDA\", \"title\": \"NVDA news\", \"message\": \"x\"},\n                           {\"t\": \"1\", \"kind\": \"summary\", \"sym\": \"\", \"title\": \"Day\", \"message\": \"P/L +$4\"}],\n                \"holdings\": [{\"symbol\": \"NVDA\"}], \"broker\": {\"synced\": \"x\"}, \"account_size\": 500, \"settings\": {\"stop_pct\": 2}}\n        p = S.public_feed(data, {\"NVDA\"}, [], {})\n        out = json.dumps(p)\n        self.assertEqual([a[\"sym\"] for a in p[\"alerts\"]], [\"AMD\"])\n        for bad in (\"500\", \"0.1 sh\", \"$0.30\", \"holdings\", \"broker\", \"account_size\", \"settings\"):\n            self.assertNotIn(bad, out)\n        self.assertIn(\"Medium hold\", p[\"alerts\"][0][\"message\"])\n        self.assertTrue(p[\"public\"])\n\n\nclass PaperTrading(unittest.TestCase):\n    class FakePaper:\n        def __init__(self, pos):\n            self.pos, self.bought, self.closed = pos, [], []\n        def account(self):\n            return {\"equity\": \"100000\", \"cash\": \"99707.5\", \"last_equity\": \"99950\"}\n        def positions(self):\n            return [p for p in self.pos if p[\"symbol\"] not in self.closed]\n        def orders(self, limit=100):\n            return []\n        def buy(self, sym, dollars, coid):\n            self.bought.append((sym, dollars)); return {\"id\": \"o1\"}\n        def close(self, sym):\n            self.closed.append(sym); return {}\n\n    def test_buys_alerts_and_sells_at_line(self):\n        cfg = S.load_config()\n        fp = self.FakePaper([{\"symbol\": \"XYZ\", \"qty\": \"3\", \"avg_entry_price\": \"100\", \"current_price\": \"97.5\",\n                              \"unrealized_plpc\": \"-0.025\", \"unrealized_pl\": \"-7.5\", \"market_value\": \"292.5\"}])\n        state = {}\n        buy = S.Alert(\"b\", \"buy\", \"🟢 BUY AMD · 84/100\", \"x\", 1, \"AMD\")\n        out = S.paper_trade(fp, [buy], {}, cfg, True, state, \"2026-11-27T15:00:00Z\", True)\n        self.assertEqual(fp.closed, [\"XYZ\"])\n        self.assertEqual(fp.bought[0][0], \"AMD\")\n        self.assertAlmostEqual(fp.bought[0][1], 1000.0)   # 10% of the $10k slice, not of Alpaca's $100k\n        self.assertAlmostEqual(state[\"paper\"][\"start\"], 10000)\n        self.assertAlmostEqual(state[\"paper\"][\"day_pl\"], 50.0)\n        self.assertLess(state[\"paper\"][\"equity\"], 10001)\n        self.assertIn(\"Paper balance\", out[0].message)\n        self.assertEqual({a.kind for a in out}, {\"paper\"})\n        self.assertEqual([t[\"side\"] for t in state[\"paper\"][\"trades\"]], [\"sell\", \"buy\"])\n        self.assertTrue(state[\"paper\"][\"on\"])\n\n    def test_daily_recap_near_close(self):\n        fp = self.FakePaper([])\n        out = S.paper_trade(fp, [], {}, S.load_config(), True, {}, \"2026-11-27T20:50:00Z\", True, None, True)\n        self.assertEqual([a.key for a in out], [\"paper:day:2026-11-27\"])\n        self.assertIn(\"since $10,000\", out[0].message)\n\n    def test_closed_market_only_reads(self):\n        fp = self.FakePaper([])\n        out = S.paper_trade(fp, [S.Alert(\"b\", \"buy\", \"BUY AMD\", \"x\", 1, \"AMD\")], {}, S.load_config(), True, {}, \"2026-11-27T02:00:00Z\", False)\n        self.assertEqual(out, []); self.assertEqual(fp.bought, [])\n\n    def test_no_keys_means_off(self):\n        st = {}\n        self.assertEqual(S.paper_trade(None, [], {}, S.load_config(), True, st, \"2026-11-27T15:00:00Z\", True), [])\n        self.assertFalse(st[\"paper\"][\"on\"])\n\nif __name__ == \"__main__\":\n    unittest.main()\n\n\nclass Predictions(unittest.TestCase):\n    def test_steady_uptrend_predicts_wins(self):\n        c = [100 * (1.004 ** i) for i in range(253)]   # +0.4% a day\n        p = S.predict_move(c, 2, 2)\n        self.assertGreater(p[\"p\"], 0.9)\n        self.assertGreater(p[\"avg\"], 2)\n\n    def test_steady_downtrend_predicts_losses(self):\n        c = [100 * (0.996 ** i) for i in range(253)]\n        self.assertLess(S.predict_move(c, 2, 2)[\"p\"], 0.1)\n\n    def test_short_history_gives_no_prediction(self):\n        self.assertIsNone(S.predict_move([100] * 30, 2, 2)[\"p\"])\n\n\nclass PaperPuts(unittest.TestCase):\n    class FakePaper(PaperTrading.FakePaper):\n        def __init__(self):\n            super().__init__([]); self.opts = []\n        def put_contracts(self, u, start, end, lo, hi):\n            return [{\"symbol\": \"XYZ270115P00021000\", \"strike_price\": \"21\", \"expiration_date\": \"2027-01-15\"},\n                    {\"symbol\": \"XYZ270115P00018000\", \"strike_price\": \"18\", \"expiration_date\": \"2027-01-15\"}]\n        def option_ask(self, occ):\n            return 0.85\n        def buy_option(self, occ, qty, limit, coid):\n            self.opts.append((occ, qty)); return {\"id\": \"p1\"}\n\n    def test_buys_small_put_on_falling_stock(self):\n        from types import SimpleNamespace\n        c = [60 * (0.996 ** i) for i in range(253)]\n        m = SimpleNamespace(symbol=\"XYZ\", price=c[-1], sma50=c[-30], closes=c, atr_pct=3.5, rank=40)\n        fp = self.FakePaper()\n        state = {}\n        out = S.paper_trade(fp, [], {\"XYZ\": m}, S.load_config(), False, state, \"2026-11-27T15:00:00Z\", True)\n        self.assertEqual(fp.opts, [(\"XYZ270115P00021000\", 2)])        # ~5% below the price; 2 x $85 fits the $200 cap\n        self.assertTrue(any(a.title.startswith(\"📝 Paper PUT XYZ put $21\") for a in out))\n        self.assertEqual(fp.bought, [])                                # no stock buy on a falling stock\n\n    def test_occ_label(self):\n        self.assertEqual(S.occ_label(\"CRWV260116P00045000\"), \"CRWV put $45 01/16\")\n\n\nclass OffHoursFocus(unittest.TestCase):\n    def test_focus_lowers_the_bar_overnight(self):\n        ev = S.NewsEvent(\"e1\", \"AMD\", \"AMD wins huge contract\", \"\", \"2026-11-26T03:00:00Z\", \"deal\", 1, 2, 0.8)\n        state = {\"paper\": {\"positions\": [{\"sym\": \"AMD\"}], \"outlook\": [{\"sym\": \"NVDA\"}]}}\n        self.assertEqual(S.paper_focus(state), {\"AMD\", \"NVDA\"})\n        cfg = S.load_config()\n        none = S.catalyst_alerts([ev], {}, cfg, set(), False, set(), {}, \"2026-11-26T03:10:00Z\", False)\n        some = S.catalyst_alerts([ev], {}, cfg, set(), False, set(), {}, \"2026-11-26T03:10:00Z\", False, None, {\"AMD\"})\n        self.assertEqual(len(none), 0)\n        self.assertEqual(len(some), 1)\n\n\nclass RoundTheClock(unittest.TestCase):\n    def test_sessions(self):\n        f = S.et_session\n        self.assertEqual(f(\"2026-11-25T14:00:00Z\"), \"pre\")         # Wed 9:00 ET\n        self.assertEqual(f(\"2026-11-25T16:00:00Z\"), \"regular\")     # Wed 11:00 ET\n        self.assertEqual(f(\"2026-11-25T22:00:00Z\"), \"post\")        # Wed 17:00 ET\n        self.assertEqual(f(\"2026-11-26T03:00:00Z\"), \"overnight\")   # Wed 22:00 ET\n        self.assertEqual(f(\"2026-11-29T03:00:00Z\"), \"closed\")      # Sat 22:00 ET\n        self.assertEqual(f(\"2026-11-30T02:00:00Z\"), \"overnight\")   # Sun 21:00 ET\n        self.assertEqual(f(\"2026-11-28T02:00:00Z\"), \"closed\")      # Fri 21:00 ET\n\n    def test_crypto_buys_capped_and_sells_at_line(self):\n        class FP(PaperTrading.FakePaper):\n            def __init__(self):\n                super().__init__([{\"symbol\": \"ETHUSD\", \"asset_class\": \"crypto\", \"qty\": \"0.1\", \"avg_entry_price\": \"3000\",\n                                   \"current_price\": \"2840\", \"unrealized_plpc\": \"-0.0533\", \"unrealized_pl\": \"-16\", \"market_value\": \"284\"}])\n                self.c = []\n            def buy_crypto(self, pair, dollars, coid):\n                self.c.append((pair, dollars)); return {\"id\": \"c1\"}\n        fp = FP()\n        closes = [30000 * (1.008 ** i) for i in range(300)]\n        from unittest import mock\n        with mock.patch.object(S, \"crypto_bars\", return_value={\"BTC/USD\": closes}):\n            out = S.paper_crypto(fp, None, S.load_config(), {}, \"2026-11-28T03:00:00Z\")\n        self.assertEqual(fp.closed, [\"ETHUSD\"])\n        self.assertEqual(fp.c[0][0], \"BTC/USD\")\n        self.assertLessEqual(fp.c[0][1], 200)                      # crypto = high risk = $200 cap\n        self.assertEqual({a.kind for a in out}, {\"paper\"})\n\n\nclass PaperCharts(unittest.TestCase):\n    def test_history_shifted_to_slice_and_intraday(self):\n        calls = []\n        def fake(method, url, headers=None, params=None, **kw):\n            calls.append((url, params))\n            if \"portfolio/history\" in url:\n                return {\"timestamp\": [1795400000, 1795500000, 1795617000, 1795620600], \"equity\": [100000.0, 0, 100050.0, 99980.0]}\n            if \"/v2/stocks/bars\" in url and params[\"timeframe\"] == \"1Day\":\n                return {\"bars\": {\"AMD\": [{\"t\": \"2025-11-25T05:00:00Z\", \"c\": 150.0}, {\"t\": \"2026-11-24T05:00:00Z\", \"c\": 209.0}]}}\n            if \"/v2/stocks/bars\" in url:\n                return {\"bars\": {\"AMD\": [{\"t\": \"2026-11-25T14:30:00Z\", \"c\": 210.5}, {\"t\": \"2026-11-25T14:35:00Z\", \"c\": 211.0}]}}\n            return {}\n        class A: h = {}; feed = \"iex\"\n        class P: h = {}\n        state = {\"paper\": {\"base\": 100000.0, \"start\": 10000, \"trades\": [{\"t\": \"2026-11-25T14:30\"}],\n                           \"positions\": [{\"sym\": \"AMD\"}, {\"sym\": \"BTCUSD/x\"}, {\"sym\": \"CRWV 12/19 $80 put\"}]}}\n        from unittest import mock\n        with mock.patch.object(S, \"http_json\", side_effect=fake):\n            S.paper_charts(P(), A(), state, \"2026-11-25T16:00:00Z\")\n        ps = state[\"paper\"]\n        self.assertEqual(ps[\"chart\"][\"1D\"], [[1795617000, 10050.0], [1795620600, 9980.0]])   # zero dropped, shifted to $10k\n        self.assertEqual(ps[\"intraday\"][\"AMD\"][-1][1], 211.0)\n        self.assertEqual(ps[\"daily\"][\"AMD\"][0][1], 150.0)                                    # a year back\n        bar_call = [p for u, p in calls if \"bars\" in u][0]\n        self.assertEqual(bar_call[\"timeframe\"], \"1Min\")\n        self.assertEqual(bar_call[\"symbols\"], \"AMD,CRWV\")                                     # put -> its stock; crypto skipped\n        self.assertTrue(bar_call[\"start\"].startswith(\"2026-11-25T04:00\"))\n\n    def test_no_paper_no_calls(self):\n        from unittest import mock\n        with mock.patch.object(S, \"http_json\") as h:\n            S.paper_charts(None, None, {\"paper\": {\"base\": 1}}, \"2026-11-25T16:00:00Z\")\n            S.paper_charts(object(), None, {}, \"2026-11-25T16:00:00Z\")\n        h.assert_not_called()\n\n\nclass SmartBuysAndHedge(unittest.TestCase):\n    def _m(self, sym, closes, prev=None, sma20=None):\n        from types import SimpleNamespace\n        p = closes[-1]\n        return SimpleNamespace(symbol=sym, price=p, prev_close=prev or closes[-2], sma20=sma20 or p, sma50=sum(closes[-50:]) / 50,\n                               sma200=sum(closes[-200:]) / 200, closes=closes, atr_pct=1.5, rank=5, high_52w=max(closes),\n                               day_chg_pct=(p / (prev or closes[-2]) - 1) * 100)\n\n    def test_market_put_when_qqq_falls(self):\n        c = [400 + i * 0.5 for i in range(252)]\n        qqq = self._m(\"QQQ\", c[:-1] + [c[-2] * 0.99], prev=c[-2], sma20=c[-2])\n        fp = PaperPuts.FakePaper()\n        out = S.paper_trade(fp, [], {\"QQQ\": qqq}, S.load_config(), True, {}, \"2026-11-25T15:00:00Z\", True)\n        self.assertEqual(fp.opts, [])                                          # index puts are over the $200 cap\n        self.assertEqual(fp.bought[0][0], \"PSQ\")                               # inverse fund instead\n        self.assertAlmostEqual(fp.bought[0][1], 500, delta=1)                  # 5% of $10k: moderate\n        self.assertTrue(any(\"market hedge: QQQ\" in a.message for a in out))\n\n    def test_no_trend_sell_on_buy_day(self):\n        pos = [{\"symbol\": \"AMZN\", \"asset_class\": \"us_equity\", \"qty\": \"1\", \"avg_entry_price\": \"238\", \"current_price\": \"238.2\",\n                \"unrealized_plpc\": \"0.001\", \"unrealized_pl\": \"0.2\", \"market_value\": \"238.2\"}]\n        state = {\"paper\": {\"trades\": [{\"t\": \"2026-11-25T14:47\", \"side\": \"buy\", \"sym\": \"AMZN\", \"day\": \"2026-11-25\"}]}}\n        fp = PaperTrading.FakePaper(pos)\n        from unittest import mock\n        with mock.patch.object(S, \"assess\", return_value={\"status\": \"SELL\"}):\n            S.paper_trade(fp, [], {\"AMZN\": self._m(\"AMZN\", [238.0] * 252)}, S.load_config(), False, state, \"2026-11-25T15:05:00Z\", True)\n            self.assertEqual(fp.closed, [])                                    # bought today: no trend dump\n            S.paper_trade(fp, [], {\"AMZN\": self._m(\"AMZN\", [238.0] * 252)}, S.load_config(), False, state, \"2026-11-26T15:05:00Z\", True)\n            self.assertEqual(fp.closed, [\"AMZN\"])                              # next day it can\n\n    def test_hedge_sold_when_market_recovers(self):\n        pos = [{\"symbol\": \"PSQ\", \"asset_class\": \"us_equity\", \"qty\": \"10\", \"avg_entry_price\": \"30\", \"current_price\": \"30.1\",\n                \"unrealized_plpc\": \"0.003\", \"unrealized_pl\": \"1\", \"market_value\": \"301\"}]\n        c = [400 + i * 0.5 for i in range(252)]\n        qqq = self._m(\"QQQ\", c, prev=c[-2], sma20=c[-5])                        # up, above its averages\n        fp = PaperTrading.FakePaper(pos)\n        S.paper_trade(fp, [], {\"QQQ\": qqq}, S.load_config(), True, {\"paper\": {\"trades\": []}}, \"2026-11-26T15:05:00Z\", True)\n        self.assertEqual(fp.closed, [\"PSQ\"])\n\n    def test_dip_and_asked_buys(self):\n        up = [300 + i for i in range(230)]\n        dip = up + [up[-1] * (1 - 0.006 * k) for k in range(1, 23)]            # ~12% off its high, still above 200-day\n        cfg = S.load_config(); cfg[\"paper_buy_list\"] = [\"AMZN\"]\n        allm = {\"META\": self._m(\"META\", dip), \"AMZN\": self._m(\"AMZN\", [200.0 + (i % 3) for i in range(252)])}\n        fp = PaperTrading.FakePaper([])\n        S.paper_trade(fp, [], allm, cfg, True, {}, \"2026-11-25T15:00:00Z\", True)\n        syms = [b[0] for b in fp.bought]\n        self.assertIn(\"META\", syms); self.assertIn(\"AMZN\", syms)\n        for sym, dollars, *_ in fp.bought:\n            self.assertLessEqual(dollars, 1000.01)                             # 5-10% of the $10k: moderate\n\n\nclass OpenWait(unittest.TestCase):\n    def test_no_buys_first_30_min(self):\n        t = SmartBuysAndHedge()\n        up = [300 + i for i in range(230)]\n        dip = up + [up[-1] * (1 - 0.006 * k) for k in range(1, 23)]\n        fp = PaperTrading.FakePaper([])\n        S.paper_trade(fp, [], {\"META\": t._m(\"META\", dip)}, S.load_config(), True, {}, \"2026-11-25T14:40:00Z\", True)  # 9:40 ET\n        self.assertEqual(fp.bought, [])\n        S.paper_trade(fp, [], {\"META\": t._m(\"META\", dip)}, S.load_config(), True, {}, \"2026-11-25T15:05:00Z\", True)  # 10:05 ET\n        self.assertEqual([b[0] for b in fp.bought], [\"META\"])\n\n\nclass Learning(unittest.TestCase):\n    def test_swing_profile_reads_the_rhythm(self):\n        import math\n        closes = [100 * (1 + 0.05 * math.sin(i / 3)) for i in range(120)]   # ~10% swings, ~9-day up-swings\n        cyc = S.swing_profile(closes)\n        self.assertIsNotNone(cyc)\n        self.assertGreater(cyc[\"up\"], 6); self.assertLess(cyc[\"up\"], 12)\n        self.assertGreaterEqual(cyc[\"days\"], 6); self.assertLessEqual(cyc[\"days\"], 12)\n        self.assertIsNone(S.swing_profile([100.0] * 20))                       # too little history\n\n    def test_learns_per_stock_setup_and_time(self):\n        tr = [{\"t\": \"2026-11-24T09:40\", \"side\": \"buy\", \"sym\": \"AMD\", \"dollars\": 500, \"why\": \"prediction: 60% odds of ...\"},\n              {\"t\": \"2026-11-24T11:00\", \"side\": \"sell\", \"sym\": \"AMD\", \"price\": 98, \"entry\": 100, \"pl\": -10, \"day\": \"2026-11-24\"},\n              {\"t\": \"2026-11-25T11:00\", \"side\": \"buy\", \"sym\": \"AMD\", \"dollars\": 500, \"why\": \"prediction: 58% odds of ...\"},\n              {\"t\": \"2026-11-25T13:00\", \"side\": \"sell\", \"sym\": \"AMD\", \"price\": 97, \"entry\": 99, \"pl\": -10, \"day\": \"2026-11-25\"},\n              {\"t\": \"2026-11-25T10:40\", \"side\": \"buy\", \"sym\": \"META\", \"dollars\": 500, \"why\": \"big-name dip: 9% under ...\"},\n              {\"t\": \"2026-11-25T15:10\", \"side\": \"sell\", \"sym\": \"META\", \"price\": 104, \"entry\": 100, \"pl\": 20, \"day\": \"2026-11-25\"}]\n        L = S.paper_learn(tr)\n        self.assertEqual((L[\"n\"], L[\"w\"]), (3, 1))\n        self.assertEqual(L[\"syms\"][\"AMD\"][\"w\"], 0)\n        self.assertEqual(L[\"setups\"][\"dip\"][\"w\"], 1)\n        self.assertEqual(L[\"times\"][\"first hour\"][\"n\"], 1)\n        adj, note = S.learned_nudge(\"AMD\", \"prediction\", L)\n        self.assertLess(adj, 0); self.assertIn(\"0 of 2 won\", note)\n        adj, _ = S.learned_nudge(\"META\", \"dip\", L)\n        self.assertEqual(adj, 0)                                               # one trade isn't enough to learn from\n\n    def test_sits_out_a_stock_after_two_losses(self):\n        t = SmartBuysAndHedge()\n        up = [300 + i for i in range(230)]\n        dip = up + [up[-1] * (1 - 0.006 * k) for k in range(1, 23)]\n        state = {\"paper\": {\"trades\": [\n            {\"t\": \"2026-11-23T11:00\", \"side\": \"buy\", \"sym\": \"META\", \"dollars\": 500, \"why\": \"prediction\", \"day\": \"2026-11-23\"},\n            {\"t\": \"2026-11-23T12:00\", \"side\": \"sell\", \"sym\": \"META\", \"price\": 98, \"entry\": 100, \"pl\": -10, \"day\": \"2026-11-23\"},\n            {\"t\": \"2026-11-24T11:00\", \"side\": \"buy\", \"sym\": \"META\", \"dollars\": 500, \"why\": \"prediction\", \"day\": \"2026-11-24\"},\n            {\"t\": \"2026-11-24T12:00\", \"side\": \"sell\", \"sym\": \"META\", \"price\": 98, \"entry\": 100, \"pl\": -10, \"day\": \"2026-11-24\"}]}}\n        fp = PaperTrading.FakePaper([])\n        cfg = S.load_config(); cfg[\"paper_buy_list\"] = []\n        S.paper_trade(fp, [], {\"META\": t._m(\"META\", dip)}, cfg, True, state, \"2026-11-25T15:05:00Z\", True)\n        self.assertEqual(fp.bought, [])\n        self.assertIn(\"learn\", state[\"paper\"])\n", "README.md": "# Stock Alerts: momentum + news scanner with iPhone alerts\n\nEvery 15 minutes on weekdays (7 AM – 4 PM Central), this bot:\n\n1. **Reads the news.** It pulls the Benzinga headline feed (free through your Alpaca account) and rates every story about your stocks or the whole market as good or bad, with its size and how confident the rating is. Before the market opens, it still checks news, so overnight stories reach you early.\n2. **Ranks ~70 big, liquid stocks by momentum.** Momentum has been the strongest factor in 2026.\n3. **Alerts you to a BUY** when a top-ranked stock is in a clean uptrend, isn't overextended, has no recent bad news, fits your risk level, and the overall market is healthy. Each buy alert also tells you **how much to buy** and **whether it looks like a short-term or long-term hold, and roughly for how long**.\n4. **Watches the stocks you bought** and alerts you using your rules, plus any big news about them.\n\n## The alerts\n\nOn the lock screen you see **one simple line**. Open the alert to see the full **WHY**, with the first line colored inside the Pushover app.\n\n| Alert | When | Loudness |\n|---|---|---|\n| 🛒 **BUY** | Passes every buy check. Shows suggested $ amount, hold time, and why | High |\n| 🟡 **SELL OFFER** | **+2%** from your buy price (then +4%, +6%) | High |\n| 🔵 **SOLID SELL** | **+8%** or more: a solid gain worth locking in | High |\n| 🟢 **BIG WIN** | **+20%** or more: strongly consider selling, at least part | High |\n| 📰 **News ▲/▼** | Medium or large story about a stock you own, with HOLD/SELL advice | High |\n| 📰 **Market news** | Big market-wide story (Fed, inflation, tariffs…), max 2 a day | Normal |\n| 🟠 **SELL WARNING** | Was up 1.5%+, now fading back to +0.5% | High |\n| 🟠 **NEAR STOP** | Down 1.5%, close to your -2% line | High |\n| 🔴 **SELL NOW** | Down **2%+**. Your rule says sell | **Emergency**: repeats every minute until you tap Acknowledge |\n| 📊 Close summary | About 25 min before the close: your profit/loss, advice, news | Normal |\n\nEvery sell alert includes a **HOLD or SELL read** that scores news, trend (20/50/200-day averages), RSI, momentum rank and the market's health.\n\n> **About colors on iPhone:** iOS doesn't let apps color the notification banner itself. The emoji shows the color on your lock screen, and the text is colored inside the Pushover app.\n>\n> **About \"covering the screen\":** no iPhone app can take over the full screen. The closest you can get is Pushover's **Critical Alerts**, which play sound even on silent or in Focus mode. The 🔴 alert also repeats until you acknowledge it. To make *every* alert an emergency, set all `priority_...` values in `config.json` to `2`.\n\n---\n\n## What the news can and can't do (read this once)\n\n**It can:** spot big stories within about 15 minutes, warn you about stocks you own, block buys right after bad news, push a SELL lean when bad news hits, and explain everything in plain words.\n\n**It can't:** get ahead of professional traders. Big news usually hits the price within **seconds**. When Nvidia's CEO resigned in November 2026, the stock fell as much as 14% at that morning's open, before most people had read the headline. Even \"obviously good\" news isn't guaranteed: Nvidia beat its earnings and guidance a few days later, popped about 4% before the next open, then turned *down* about 3% that day.\n\nSo the bot uses news as a **risk signal**, not a prediction machine. It will never say \"buy a lot because it's guaranteed.\" Position size is capped no matter how good the news looks. Your -2% rule, plus a real stop order in your broker, is what protects you.\n\n---\n\n## How much to buy (sizing)\n\nSet your account in `config.json`:\n```json\n\"account_size\": 30.0,\n\"risk_per_trade_pct\": 1.0,\n\"max_position_pct\": 50.0,\n\"risk_level\": \"moderate\"\n```\nThe bot sizes each buy so that if your -2% stop hits, you lose about **1% of your account**. It never puts more than **50%** in one stock. With $30 that means about **$15 per buy**, and if the stop hits you lose about $0.30. Each buy alert also shows what +2%, +8%, a typical day and the stock's real big days (its 1-in-20 moves over the last year) mean in dollars for that position.\n\n**Risk level:** `low` = only calm stocks (normal daily swing up to 1.5%), `moderate` = up to 2.5%, `any` = up to 3%.\n\nFill in shares in `holdings.txt` (e.g. `NVDA 182.50 2026-11-18 0.08`) and every alert shows your real dollar gain or loss.\n\n---\n\n## How long to hold (on every buy alert)\n\n- **With a Claude API key (recommended):** for each buy alert, Claude searches the web for the last week of news and investor-forum chatter (Reddit, StockTwits, X). It then answers **SHORT-TERM** (days to 2 weeks), **MEDIUM** (2–8 weeks) or **LONG-TERM** (3+ months), with how long, why, the forum mood, and the main risk. Heavy hype is treated as a short-term sign.\n- **Without a key:** built-in rules decide:\n  - Fresh news, stretched or jumpy → **short-term, 3–10 trading days**\n  - Steady 12-month uptrend, calm, top-ranked → **long-term, 3–12 months**. Strong 12-month winners have historically tended to keep outperforming for 3–12 months. A long hold needs a wider stop than 2%, such as below the 50-day average.\n  - Otherwise → **medium, 2–6 weeks**\n\n---\n\n## Costs\n\n| Thing | Cost |\n|---|---|\n| Pushover (iPhone alerts) | Free 30 days, then **$4.99 one time** |\n| Alpaca (prices + Benzinga news) | Free |\n| GitHub (runs the bot) | Free (private repo: about 800–1,000 of your 2,000 free minutes a month) |\n| Claude API (optional: smarter news ratings + forum check) | Pay as you go. Haiku 5.5 is $0.10 / $0.50 per million tokens, and web search is $10 per 1,000 searches. **Expect roughly $1–5/month.** Set a monthly spend limit in the Console to be safe. |\n\n---\n\n## Setup (about 30 minutes, easiest on your PC)\n\n### 1. Pushover: your alert app\n1. On iPhone, install **Pushover Notifications** and create an account.\n2. In the app's **Settings**, turn on **Critical Alerts** (high and emergency priority). Allow it when iOS asks.\n3. At **pushover.net**, copy your **User Key**.\n4. Click **Create an Application/API Token**, name it `Stock Alerts`, and copy the **API Token**.\n\n### 2. Alpaca: free prices and news\n1. Sign up at **alpaca.markets**. A paper account is fine.\n2. On the Paper account, go to **API Keys → Generate** and copy both keys. They're only used to read data; nothing is ever traded.\n\n### 3. Claude API key (optional, recommended)\n1. Go to **platform.claude.com**, sign in, add a few dollars of credit, and set a **monthly spend limit**.\n2. Under **API Keys**, create a key.\n3. If the Console has a setting to allow **web search**, turn it on. The hold-time check needs it; without it, the bot quietly falls back to its rules.\n\n### 4. GitHub: runs it with your PC off\n1. Make a free account at **github.com**. Click **+ → New repository**, name it `stock-alerts`, choose **Private**, and create it empty.\n2. Click **uploading an existing file**, drag in **everything in this folder** (including the `.github` folder), then **Commit changes**.\n3. Check that `.github/workflows/scan.yml` shows up in the repo.\n\n### 5. Add your keys as secrets\nIn the repo: **Settings → Secrets and variables → Actions → New repository secret**\n\n| Name | Value |\n|---|---|\n| `APCA_API_KEY_ID` | Alpaca key ID |\n| `APCA_API_SECRET_KEY` | Alpaca secret |\n| `PUSHOVER_TOKEN` | Pushover API token |\n| `PUSHOVER_USER` | Pushover user key |\n| `OPENAI_API_KEY` | ChatGPT API key (optional). Asked first for AI news reading and unclear requests. Model: GPT-5.6 Luna |\n| `ANTHROPIC_API_KEY` | Claude API key (optional). Only for extra help: Opus 5.5 on low effort |\n\n### 6. Test it\nIn **Actions → Stock scanner → Run workflow**:\n- **`test-alert`**: 6 sample alerts (🛒 🟡 🔵 🟢 📰 🔴). The last one repeats until you tap Acknowledge.\n- **`report`**: today's rankings, a News column, your holdings with advice, and the biggest stories of the last 24 hours.\n- **`backtest`**: how the buy setup and your ±2% rules did on 5 years of real prices.\n\n### 7. Make \"Log your buy\" work\nIn `config.json`, set:\n```json\n\"holdings_edit_url\": \"https://github.com/YOUR-USERNAME/stock-alerts/edit/main/holdings.txt\",\n```\n\n### 8. Link Robinhood (optional, recommended): no more typing buys\nRobinhood has no official API, so the bot reads your account through **SnapTrade Personal**\n(free for personal use, read-only for this bot: it never places trades).\n1. Make an account at https://snaptrade.com/personal and turn on two-factor login.\n2. In the SnapTrade dashboard, connect Robinhood.\n3. On the **API Key** page, create a Personal key. Copy the client ID and consumer key.\n4. Add GitHub secrets `SNAPTRADE_CLIENT_ID` and `SNAPTRADE_CONSUMER_KEY`.\n\nEvery scan then reads your Robinhood stocks (average cost and shares) and alerts with your rules.\nYou get a 🧾 note when a new buy shows up and ✅ when a stock is sold. SnapTrade re-reads Robinhood\nwhen the bot asks (every 30 minutes, `broker_refresh_minutes`), so a fresh buy can take a scan or two to appear.\n`holdings.txt` still works for stocks outside Robinhood.\n\n---\n\n## Daily use (from your phone)\n\n- **Scan now** (app, or Run workflow → `scan-now`): a full scan on demand, also after the close (it uses the\n  latest prices and labels buys \"BUY AT NEXT OPEN\"). Always ends with a 📡 summary.\n- **Tell the bot** (app box, or Run workflow → `ask` with your request): `check NVDA`, `watch TSLA`,\n  `stop watching TSLA`, `set stop to 3%`, `set target to 4%`, `risk low`, `I have $50`, `max 2 buys a day`,\n  `pause alerts` (only SELL NOW still comes), `resume alerts`, `scan now`. Simple rules read it first; Claude only if\n  they can't and you added a key. Replies arrive as a 🤖 notification.\n- Stock alerts come with a chart of the real last 90 days of prices, with your buy, stop and target lines.\n\n- **Buy alert →** buy in Robinhood. If it's linked, you're done. Otherwise tap **Log your buy** and paste the line the alert gives you (e.g. `NVDA 182.50 2026-11-18 0.08`), then **Commit changes**.\n- **Also place a real -2% stop order in your broker.** Alerts can be 15–30 minutes late (the 15-minute checks plus GitHub delays), and prices can jump overnight. A real stop order is the only thing that enforces your rule instantly.\n- **Sold? →** delete the line and commit.\n- A typo in `holdings.txt` gets you a ⚠️ alert naming the line.\n\n---\n\n## How a BUY is chosen\n\n**Momentum score (0–100) compared with the list:** 40% the 12-month gain (skipping the last month), 30% the 6-month gain, 20% closeness to the 52-week high, 10% distance above the 200-day average.\n\n**Every check must pass:**\n- Market healthy (SPY above its 200-day)\n- Top 15 rank\n- Price > 50-day > 200-day, and the 200-day rising\n- Within 10% of the 52-week high\n- RSI 45–72\n- 0–6% above the 20-day average\n- Fits your risk level\n- Up on the day\n- No bad news in the last ~2 days\n\nAt most 3 buy alerts a day.\n\n## How news is rated\n\n- **Keyword rules (always on, free):** about 20 categories, including earnings beats and misses, guidance raised or cut, upgrades and downgrades, CEO exits, scandals, probes and lawsuits, FDA decisions, takeovers, share offerings, buybacks, recalls and hacks, tariffs and export bans, and Fed rates and inflation. Rumors (\"reportedly\", \"in talks\") get lower confidence. Opinion and list headlines (\"3 stocks to buy\", headlines ending in \"?\") get very low confidence.\n- **Claude (if you add a key):** reads each new headline and summary and rates direction, size and confidence. It's told never to add outside facts and never to be more than 85% confident. If the call fails, the keyword rules take over automatically.\n- News fades over time (half its weight every 24 hours) and is forgotten after 3 days.\n\n---\n\n## Why these rules (2026 evidence)\n\n- **Momentum led in 2026:** Morningstar named it the best-performing factor globally in Q2 2026 ([Morningstar](https://indexes.morningstar.com/insights/markets-review/blt49b23cb4e87c0d8d/morningstar-factor-monitor-q2-2026)).\n- **It can crash fast:** it dropped sharply at the early-June 2026 turning point ([Morningstar](https://indexes.morningstar.com/insights/perspective/blt863fcc07f2931f5f/momentum-investors-are-winning-but-not-by-betting-on-quality)). That's why buys pause when SPY is below its 200-day.\n- **Tight stops get shaken out by noise:** a January 2026 CFA Institute article found tight stops often cut trades on normal price swings ([CFA Institute](https://rpc.cfainstitute.org/blogs/enterprising-investor/2026/why-tight-stop-losses-often-hurt-investors-and-what-robust-capital-growth-really-requires)). So the bot filters out jumpy stocks and warns you when a stock's normal swing is bigger than 2%. **Run the backtest.** It compares your ±2% exits with wider, volatility-based exits.\n\n### Reading the backtest\n- **Per trade** above 0 means the rules made money after costs. **PF** (profit factor) above 1.2 is decent; below 1.0 loses money.\n- With ±2% exits you must win **more than about 53%** of trades just to break even.\n- The \"Any day in uptrend\" row is a no-skill baseline. The buy setup should beat it.\n- The backtest doesn't include news, because the free historical news feed isn't used in it.\n\n---\n\n## Settings (`config.json`)\n\n| Setting | Default | Meaning |\n|---|---|---|\n| `stop_pct` | 2.0 | 🔴 SELL NOW at this % below your buy |\n| `profit_pct` / `profit_step_pct` | 2 / 2 | 🟡 at +2%, then every +2% |\n| (fixed tiers) | 8 / 20 | 🔵 at +8%, 🟢 at +20% |\n| `account_size` | 30 | Your trading money |\n| `risk_per_trade_pct` / `max_position_pct` | 1 / 50 | Sizing caps |\n| `risk_level` | moderate | low / moderate / any |\n| `news` | true | Turn news on or off |\n| `news_alert_min_strength` | 2 | 1 = alert on small stories too |\n| `horizon_ai` | true | Ask Claude about hold time (needs a key) |\n| `priority_*` | 1 (stop = 2) | 0 normal, 1 loud, 2 emergency/repeating |\n| `universe` | built-in ~70 | Your own list, e.g. `[\"NVDA\",\"AAPL\"]` |\n\n---\n\n## Good to know\n- **Pattern day trading:** in a *margin* account under $25k, buying and selling the same stock on the same day 4+ times in 5 business days gets you flagged. In a *cash* account, money from a sale settles in 1 business day before you can reuse it.\n- **Taxes:** profitable sales are taxable. Short-term gains are taxed like regular income.\n- **Schedules pause** after 60 days with no repo activity. The bot's own saves keep it awake.\n- **If scheduled runs never appear** but manual runs work, push any small edit and wait a day, or make the repo public. (Public means anyone could see your holdings file.)\n- **Run on your PC:** put the keys in `.env` (see `.env.example`), then run `py scanner.py report` or `py scanner.py scan --dry-run`.\n- **Tests:** `python -m unittest test_scanner` (74 tests, all offline).\n- Not financial advice. The bot gives rule-based alerts, not guarantees.\n\n## How the bot decides (v3)\n\n- **Every stock gets a status:** STRONG BUY, BUY, WATCH, HOLD, REDUCE, SELL or PASS, plus a 5–95 confidence\n  score built from trend, momentum, how stretched the price is, news, and the market.\n- **Risk setting** (`risk_level`, change any time): `low`, `moderate` (medium, default), `high`, `speculative`.\n  Higher levels accept bigger daily swings and earlier trends but need less confidence. Your sell line, size caps,\n  the weak-market pause and the bad-news block apply at every level.\n- **Whole-market discovery:** each trading day the market's top gainers and most-traded stocks (Alpaca screener,\n  $5+ unless speculative) join the scan for 5 days. They still have to pass every check.\n- **Buy alerts** include company, status, confidence, entry range, targets (+2% / +8%), downside, catalyst,\n  what would cancel it, setup type (immediate / wait for entry / breakout confirmation / speculative) and hold time.\n- **Follow-ups:** stocks it alerted are watched for 4 weeks; you get a 📉 note if the call breaks, 🎯 if the target hits.\n- **Daily brief** on the first scan after the open: market, best ideas, close-to-entry, your stocks, what to avoid.\n- **Ask AI** (app, or Run workflow → `ai` with a question): runs a fresh scan, then ChatGPT answers using tools\n  (top opportunities, any stock's facts, news, market movers, your portfolio, paid fundamentals/social data\n  within budgets). Claude (Opus 5.5, low effort) only if ChatGPT can't. Answers land in the app and as a notification.\n  The bot never trades.\n\n## Smarter bot (v4)\n\n- **Playbook:** `playbook.md` holds 14 rules the bot studied from four public-domain market books (Lefèvre's\n  *Reminiscences of a Stock Operator*, Butler's *Successful Stock Speculation*, Harper's *The Psychology of\n  Speculation*, Gibson's *The Cycles of Speculation*) and the SEC's investor guides. The AI reads them before every answer,\n  and the scanner uses them (trend, confirmation by volume, pullback entries, cut losses, crowd-hype warnings).\n- **Always one idea:** every scan names a \"best idea right now\" with its status and the exact trigger to buy\n  (for example \"Buy when it cools off toward $331.40\"). Strong stocks in a weak market are WATCH, not PASS.\n- **Web and forums:** the AI uses OpenAI's web search plus Reddit (ApeWisdom) and StockTwits buzz. Reddit's\n  fastest-rising stocks join discovery, but forum posts are treated as mood, never as a reason to buy on their own.\n- **Fallbacks:** if OpenAI rejects a request type, the bot retries without web search, then with the older API, then\n  without tools. If the AI fails completely you still get the bot's own best idea and the exact reason it failed.\n\n## Full playbook and library (v5)\n\n- `playbook.md` now has 60 rules in 10 parts (market, picking, buying, selling, risk, news, forums, psychology, orders,\n  keeping score), each tied to a book chapter and to what the bot does. ChatGPT gets all of it before every answer.\n- `library/` holds the full text of seven public-domain market books (Lefèvre, Butler, Harper, Selden, Gibson, Crump,\n  Mackay), downloaded once from Project Gutenberg the first time you ask the AI (or run `python3 scanner.py library`).\n  The AI has a `search_books` tool and adds a \"📚 From the books\" lesson to its answers.\n- New chart rules: heavy-selling days (down days on rising volume) for every stock and the market, and \"climax run\"\n  warnings that turn a held stock to REDUCE after +25% in two weeks on 2× volume.\n\n", "config.json": "{\n  \"_read_me\": \"Percentages are plain numbers (2.0 = 2%). Leave universe empty to use the built-in list of ~70 big, liquid stocks.\",\n\n  \"stop_pct\": 2.0,\n  \"near_stop_gap_pct\": 0.5,\n  \"warn_band_pct\": 0.5,\n  \"warn_arm_pct\": 1.5,\n  \"profit_pct\": 2.0,\n  \"profit_step_pct\": 2.0,\n\n  \"top_n\": 15,\n  \"rsi_min\": 45,\n  \"rsi_max\": 72,\n  \"max_from_high_pct\": 10.0,\n  \"max_above_sma20_pct\": 6.0,\n  \"max_atr_pct\": 3.0,\n  \"max_buy_alerts_per_day\": 3,\n  \"require_green_day\": true,\n\n  \"priority_buy\": 1,\n  \"priority_profit\": 1,\n  \"priority_warning\": 1,\n  \"priority_near_stop\": 1,\n  \"priority_stop\": 2,\n  \"priority_summary\": 0,\n  \"emergency_retry_sec\": 60,\n  \"emergency_expire_sec\": 900,\n  \"sound_buy\": \"cashregister\",\n  \"sound_sell\": \"siren\",\n\n  \"chart_url\": \"https://finance.yahoo.com/quote/{symbol}\",\n  \"holdings_edit_url\": \"\",\n  \"summary_minutes_before_close\": 25,\n\n  \"account_size\": 30.0,\n  \"risk_per_trade_pct\": 1.0,\n  \"max_position_pct\": 50.0,\n  \"risk_level\": \"moderate\",\n\n  \"news\": true,\n  \"news_ai_model\": \"claude-opus-5-5\",\n  \"news_alert_min_strength\": 2,\n  \"news_alert_min_confidence\": 0.5,\n  \"news_block_buy_score\": -0.4,\n  \"horizon_ai\": true,\n  \"horizon_ai_model\": \"claude-opus-5-5\",\n  \"web_search_tool\": \"web_search_20250305\",\n  \"web_search_max_uses\": 2,\n  \"priority_news\": 1,\n  \"priority_market_news\": 0,\n  \"max_market_news_alerts_per_day\": 2,\n\n  \"research_min_articles\": 15,\n  \"research_min_sites\": 10,\n  \"research_cache_hours\": 4,\n  \"earnings_blackout_days\": 2,\n  \"budget_alphavantage\": 20,\n  \"budget_lunarcrush\": 500,\n  \"budget_financialdatasets\": 100,\n  \"budget_claude\": 6,\n  \"priority_budget\": 0,\n  \"priority_ideas\": 0,\n  \"ideas_watch_days\": 5,\n  \"max_extra_watch\": 8,\n\n  \"data_feed\": \"iex\",\n  \"universe\": []\n}\n", "holdings.txt": "# YOUR STOCKS. After you buy, add one line:  SYMBOL  BUY_PRICE\n# Optional extras on the same line: date bought, number of shares.\n#\n#   NVDA 182.50\n#   AMD 155.60 2026-11-18 0.19\n#\n# After you sell, DELETE the line. Lines starting with # are ignored.\n", ".github/workflows/scan.yml": "name: Stock scanner\n\non:\n  schedule:\n    # Every 15 min, Mon-Fri, 13:00-21:59 UTC. That covers market hours in both\n    # winter and summer time. The script exits right away when the market is closed.\n    # Odd minutes (07/22/37/52) because GitHub delays jobs scheduled on the hour.\n    - cron: \"7,22,37,52 13-21 * * 1-5\"\n    # Overnight + weekends (news on your stocks, paper bets and top-upside names): hourly, still inside the free minutes.\n    - cron: \"5 0-12,22,23 * * 1-5\"\n    - cron: \"5 * * * 0,6\"\n  workflow_dispatch:\n    inputs:\n      command:\n        description: \"What to run\"\n        type: choice\n        options: [scan, scan-now, ask, ai, report, test-alert, backtest, library]\n        default: scan\n      request:\n        description: \"For ask: what you want the bot to do (e.g. watch TSLA, set stop to 3%)\"\n        type: string\n        default: \"\"\n      rid:\n        description: \"For ai: an id the app uses to find the answer\"\n        type: string\n        default: \"\"\n\npermissions:\n  contents: write   # lets the bot save its alert memory (state.json)\n\nconcurrency:\n  group: scanner\n  cancel-in-progress: false\n\njobs:\n  run:\n    runs-on: ubuntu-latest\n    timeout-minutes: 10\n    steps:\n      # Always start from the newest saved memory (runs wait in line, so the last run's save is already in main)\n      - uses: actions/checkout@v5\n        with:\n          ref: main\n\n      - name: Run\n        if: ${{ inputs.command != 'ai' }}\n        env:\n          CMD: ${{ inputs.command || 'scan' }}\n          BOT_REQUEST: ${{ inputs.request }}\n          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}\n          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}\n          APCA_PAPER_KEY_ID: ${{ secrets.APCA_PAPER_KEY_ID }}               # optional: paper trading (fake money)\n          APCA_PAPER_SECRET_KEY: ${{ secrets.APCA_PAPER_SECRET_KEY }}\n          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}\n          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}\n          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}                           # optional: ChatGPT, asked first\n          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}                     # optional: Claude, extra help only\n          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}               # optional\n          LUNARCRUSH_API_KEY: ${{ secrets.LUNARCRUSH_API_KEY }}                   # optional\n          FINANCIAL_DATASETS_API_KEY: ${{ secrets.FINANCIAL_DATASETS_API_KEY }}   # optional\n          SNAPTRADE_CLIENT_ID: ${{ secrets.SNAPTRADE_CLIENT_ID }}                 # optional: Robinhood sync\n          SNAPTRADE_CONSUMER_KEY: ${{ secrets.SNAPTRADE_CONSUMER_KEY }}           # optional: Robinhood sync\n          NEONTAPE_TOKEN: ${{ secrets.NEONTAPE_TOKEN }}                           # optional: share picks with friends\n        run: |\n          case \"$CMD\" in\n            scan|report|backtest) python3 scanner.py \"$CMD\" ;;\n            scan-now) python3 scanner.py scan --force ;;\n            ask) python3 scanner.py ask ;;\n            test-alert) python3 scanner.py test-alert --all ;;\n            library) python3 scanner.py library --refresh ;;\n            *) echo \"unknown command\"; exit 1 ;;\n          esac\n\n      - name: Fresh scan\n        if: ${{ inputs.command == 'ai' }}\n        env:\n          CMD: ${{ inputs.command || 'scan' }}\n          BOT_REQUEST: ${{ inputs.request }}\n          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}\n          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}\n          APCA_PAPER_KEY_ID: ${{ secrets.APCA_PAPER_KEY_ID }}               # optional: paper trading (fake money)\n          APCA_PAPER_SECRET_KEY: ${{ secrets.APCA_PAPER_SECRET_KEY }}\n          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}\n          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}\n          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}                           # optional: ChatGPT, asked first\n          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}                     # optional: Claude, extra help only\n          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}               # optional\n          LUNARCRUSH_API_KEY: ${{ secrets.LUNARCRUSH_API_KEY }}                   # optional\n          FINANCIAL_DATASETS_API_KEY: ${{ secrets.FINANCIAL_DATASETS_API_KEY }}   # optional\n          SNAPTRADE_CLIENT_ID: ${{ secrets.SNAPTRADE_CLIENT_ID }}                 # optional: Robinhood sync\n          SNAPTRADE_CONSUMER_KEY: ${{ secrets.SNAPTRADE_CONSUMER_KEY }}           # optional: Robinhood sync\n          NEONTAPE_TOKEN: ${{ secrets.NEONTAPE_TOKEN }}                           # optional: share picks with friends\n        run: python3 scanner.py scan --force --quiet --cache \"$RUNNER_TEMP/scan.json\"\n\n      - name: Ask AI\n        if: ${{ inputs.command == 'ai' }}\n        env:\n          BOT_RID: ${{ inputs.rid }}\n          BOT_REQUEST: ${{ inputs.request }}\n          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}\n          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}\n          APCA_PAPER_KEY_ID: ${{ secrets.APCA_PAPER_KEY_ID }}               # optional: paper trading (fake money)\n          APCA_PAPER_SECRET_KEY: ${{ secrets.APCA_PAPER_SECRET_KEY }}\n          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}\n          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}\n          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}                           # optional: ChatGPT, asked first\n          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}                     # optional: Claude, extra help only\n          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}               # optional\n          LUNARCRUSH_API_KEY: ${{ secrets.LUNARCRUSH_API_KEY }}                   # optional\n          FINANCIAL_DATASETS_API_KEY: ${{ secrets.FINANCIAL_DATASETS_API_KEY }}   # optional\n          SNAPTRADE_CLIENT_ID: ${{ secrets.SNAPTRADE_CLIENT_ID }}                 # optional: Robinhood sync\n          SNAPTRADE_CONSUMER_KEY: ${{ secrets.SNAPTRADE_CONSUMER_KEY }}           # optional: Robinhood sync\n        run: python3 scanner.py ai --cache \"$RUNNER_TEMP/scan.json\"\n\n      - name: Save memory (alerts, knowledge, Obsidian vault, app data)\n        if: ${{ always() && contains(fromJSON('[\"scan\",\"scan-now\",\"ask\",\"ai\",\"library\"]'), inputs.command || 'scan') }}\n        run: |\n          git config user.name \"stock-scanner\"\n          git config user.email \"stock-scanner@users.noreply.github.com\"\n          for f in state.json knowledge.json config.json vault app library; do if [ -e \"$f\" ]; then git add \"$f\"; fi; done\n          if git diff --cached --quiet; then echo \"no changes\"; exit 0; fi\n          git commit -m \"scanner: update alert memory [skip ci]\"\n          MINE=$(git rev-parse HEAD)\n          # The bot's own files: if someone else saved at the same time, this run's fresh copy wins.\n          OWN=\"state.json knowledge.json app/dashboard.json app/names.json app/answers vault library\"\n          if [ \"${{ inputs.command }}\" = \"ask\" ]; then OWN=\"$OWN config.json\"; fi\n          for i in 1 2 3 4; do\n            git fetch -q origin main\n            if git rebase -q origin/main; then\n              git push -q origin HEAD:main && echo \"saved\" && exit 0\n            else\n              git rebase --abort || true\n              git reset -q --hard origin/main\n              for p in $OWN; do git checkout \"$MINE\" -- \"$p\" 2>/dev/null || true; done\n              git add -A $OWN 2>/dev/null || true\n              for p in $OWN; do if [ -e \"$p\" ]; then git add \"$p\"; fi; done\n              if git diff --cached --quiet; then echo \"nothing new to save\"; exit 0; fi\n              git commit -q -m \"scanner: update alert memory [skip ci]\"\n              MINE=$(git rev-parse HEAD)\n              git push -q origin HEAD:main && echo \"saved (kept this run's memory)\" && exit 0\n            fi\n            sleep $((i * 3))\n          done\n          echo \"could not save state\"; exit 1\n", ".gitignore": ".env\n__pycache__/\n", ".env.example": "# Only needed to run the scanner on your own PC. On GitHub, use repo Secrets instead.\n# Copy this file to \".env\" and fill in. Never upload .env anywhere.\nAPCA_API_KEY_ID=your_alpaca_key_id\nAPCA_API_SECRET_KEY=your_alpaca_secret\nPUSHOVER_TOKEN=your_pushover_api_token\nPUSHOVER_USER=your_pushover_user_key\n# Optional: lets Claude rate the news and check forums for hold time (pay-as-you-go API key)\nANTHROPIC_API_KEY=\nALPHAVANTAGE_API_KEY=\nLUNARCRUSH_API_KEY=\nFINANCIAL_DATASETS_API_KEY=\nSNAPTRADE_CLIENT_ID=\nSNAPTRADE_CONSUMER_KEY=\nOPENAI_API_KEY=\n", "state.json": "{}\n", "knowledge.json": "{}\n", "app/dashboard.json": "{\"updated\": \"\", \"holdings\": [], \"alerts\": [], \"watch\": [], \"ideas\": [], \"budgets\": [], \"track\": {}}\n", "vault/Welcome.md": "---\ntags: [stock-bot]\n---\n# Stock Bot Vault\n\nThe bot writes here after every scan:\n- **Bot Memory**: track record and how many paid credits are used\n- **Stocks/**: one note per stock (stats, research, news, alerts)\n- **Daily/**: every alert, by day\n\nOpen this `vault` folder in Obsidian to read it, search it and see links between stocks and days.\n", "vault/Stocks/.keep": "", "vault/Daily/.keep": "", "playbook.md": "# Neon Tape Playbook\n\nThe rules the bot follows, learned from seven classic market books and the SEC's investor guides, written in plain\nwords for someone buying small amounts of stock on Robinhood. Every rule says where it comes from and exactly how the\nbot uses it.\n\nThe full text of every book is also stored with the bot (the `library/` folder). When you ask the AI a question, it\nreads this whole playbook first and can search the books for passages about your exact situation.\n\n## The library\n\n| Book | Author | Year | What it teaches | Free at |\n|---|---|---|---|---|\n| Reminiscences of a Stock Operator | Edwin Lefèvre (Jesse Livermore's story) | 1923 | Trends, timing, cutting losses, sitting tight, tips | gutenberg.org/ebooks/60979 |\n| Successful Stock Speculation | J. J. Butler | 1922 | What to buy and when; big moves vs small ones | gutenberg.org/ebooks/26841 |\n| The Psychology of Speculation | Henry Howard Harper | 1926 | Greed, fear, overtrading, margin, getting even | gutenberg.org/ebooks/73647 |\n| Psychology of the Stock Market | G. C. Selden | 1912 | Crowd behavior, discounting news, panics and booms | gutenberg.org/ebooks/75570 |\n| The Cycles of Speculation | Thomas Gibson | 1907 | Market cycles, money and credit, safety | gutenberg.org/ebooks/75687 |\n| The Theory of Stock Exchange Speculation | Arthur Crump | 1887 | The character a speculator needs | gutenberg.org/ebooks/59518 |\n| Extraordinary Popular Delusions, Vol. 1 | Charles Mackay | 1841 | Bubbles: tulips, the South Sea and Mississippi schemes | gutenberg.org/ebooks/636 |\n| Investor bulletins and alerts | U.S. SEC (investor.gov) | current | Order types, social-media scams, pump-and-dumps, diversification | investor.gov |\n\nAll seven books are public domain in the USA. The SEC guides are U.S. government publications.\n\n<!-- rules -->\n## Part 1. The market comes first\n\n**1. Trade with the trend.** Prices tend to keep moving the way they're already moving, along \"the line of least\nresistance\". Buy stocks that are rising, in a market that's rising. *(Lefèvre ch. X)*\nBot: a buy needs price above the 50-day average, the 50-day above the 200-day, and the 200-day turning up\n(speculative risk relaxes the last two).\n\n**2. Most stocks follow the whole market.** Be a buyer in a bull market and careful in a bear market; one strong-looking\nstock shouldn't override the general direction. *(Lefèvre ch. VIII, IX)*\nBot: when the S&P 500 is below its 200-day average, buy alerts pause and strong stocks become WATCH.\n\n**3. Watch for warnings, not breaks.** Trouble shows up before the big drop: leaders stop rising, rallies fail, and\nheavy selling appears on down days. *(Lefèvre ch. XV, XVII)*\nBot: counts \"heavy-selling days\" (down days on rising volume) for every stock and for the market; 5+ in five weeks\nputs the market \"under pressure\", 6+ lowers a stock's confidence.\n\n**4. When the leaders stop leading, change tactics.** If last month's leaders slip and fail to recover while the rest of\nthe market still rises, the move is getting old. *(Lefèvre ch. XV)*\nBot: momentum rank is recalculated every scan; a holding in the bottom half of the ranking counts against \"hold\".\n\n**5. Money and credit drive the big cycles.** Booms end when borrowing gets expensive and credit is stretched; rising\ninterest rates and tight money pressure stocks. *(Gibson ch. IV, Indications of Crises; Selden ch. VI)*\nBot: market-wide news mood is part of every decision; the AI is told to check rates and Fed news with web search.\n\n**6. Know where we are in the cycle.** Markets move through quiet buying at the bottom, a broad public rally, a top where\ninsiders sell to the crowd, then a slide where weak holders are forced out. *(Gibson, The Ordinary Swing of Prices;\nSelden ch. I)*\nBot: the daily brief describes the market's state; the AI uses this cycle to explain where a stock may be.\n\n## Part 2. Picking stocks\n\n**7. Buy strength, not \"cheap\".** A falling stock that looks cheap is usually falling for a reason. The public buys\nlaggards and bargains; professionals buy what's already proving itself. *(Lefèvre ch. VII, XVII; Gibson, Selection of\nSecurities)*\nBot: it never suggests a stock just because it dropped; it ranks by 12-month and 6-month momentum.\n\n**8. Prefer the leaders of a move.** The stocks that move first and strongest tend to keep leading; a stock lagging its\ngroup is a warning, not a bargain. *(Lefèvre ch. XVII)*\nBot: only the highest-ranked stocks can be buys (the top 15 at medium risk; fewer at low, more at high).\n\n**9. Near the high is healthy.** Stocks making new highs, or crossing big round numbers, often keep going because there's\nno one left above them waiting to \"get even\". *(Lefèvre ch. XIV)*\nBot: a buy needs the stock within 10% of its yearly high at medium risk (7% at low, up to 25% at speculative).\n\n**10. Unusually high promised returns are a red flag.** Things can't reliably pay more than they earn; yields or\nreturns that look too good usually hide risk. *(Gibson, Selection of Securities and The Factor of Safety)*\nBot: the AI is told to question any \"guaranteed\" or unusually high return.\n\n**11. Avoid hyped cheap shares.** Low-priced stocks sold on exciting stories of a big discovery are a classic way to\nlose money. *(Harper, The Lure of the Copper Boom; SEC pump-and-dump alerts)*\nBot: market discovery ignores stocks under $5 (under $2 at speculative risk); forum-driven picks still face every check.\n\n**12. Good companies can still be bad timing.** A sound idea can lose money if bought at the wrong moment or hit by\noutside events. *(Lefèvre ch. XV)*\nBot: every buy alert carries a \"cancelled if\" line and a sell line.\n\n## Part 3. When to buy\n\n**13. Wait for the market to confirm you.** Don't buy because you expect a move; buy when the price starts proving it.\nWaiting a few days for confirmation beats being early. *(Lefèvre ch. II, VIII, XIV)*\nBot: \"breakout confirmation needed\" setups wait for an up day and a push toward the high.\n\n**14. Volume tells you if the move is real.** A new high on heavy trading means real buyers; a new high on thin trading\nis weaker. Price and volume are the best tip. *(Lefèvre ch. XVII)*\nBot: +5 confidence for a breakout on 1.5× normal volume; −3 for a new high on under 0.7× volume.\n\n**15. Buy pauses, not collapses.** In a strong uptrend, a calm dip back to the 20-day average is a better entry than\nchasing a stock that just ran up. *(Gibson, Conclusion: buy after reactions, under favorable conditions)*\nBot: the \"pullback in an uptrend\" setup (+5 confidence); \"overheated\" stocks wait for a price the bot names.\n\n**16. Don't chase the first or last part of a move.** Trying to catch the exact bottom or top is how traders get hurt;\naim for the main part of the swing. *(Lefèvre ch. V, XV)*\nBot: overheated and ran-up-too-fast checks block chasing; the bot never claims to call bottoms.\n\n**17. Start small, add only to winners.** Test your idea with a small first position; add more only after it shows a\nprofit. If the first part loses, that's information. *(Lefèvre ch. IV, VII)*\nBot: sizes start at your risk-per-trade amount; the AI is told to add only to a stock that's above your buy price\nand still passing its checks.\n\n**18. Only act when there's a precedent.** Trade when the setup looks like ones that have worked, not out of\nimpatience or boredom. *(Lefèvre ch. II; Harper, Retired Business Men in the Stock Market)*\nBot: buys come only from the same tested checks; the backtest command measures how they've done.\n\n## Part 4. When to sell\n\n**19. Cut losses fast; the first loss is the smallest.** When a trade goes against you, get out at your line instead of\nhoping. Every big loss started as a small one. *(Lefèvre ch. IX, XV, XVII; Harper, Whims and Fallacies)*\nBot: your sell line (−2% by default) triggers a \"you should sell\" alert.\n\n**20. Never average down.** Buying more of a falling stock to \"lower your average\" throws good money after bad.\n*(Lefèvre ch. VII, X, XII)*\nBot: it never suggests adding to a stock that's below your buy price.\n\n**21. Don't try to get even.** Wanting to win back a loss in the same stock is an emotional trap; judge the stock on what\nit's doing now. *(Harper, Whims and Fallacies; Selden ch. V)*\nBot: hold/sell advice is based on the stock's trend and news, never on what you paid.\n\n**22. Sit tight while the trend holds.** The big money comes from staying in a correct position through the main move,\nnot jumping in and out. *(Lefèvre ch. V, XVI)*\nBot: HOLD while trend, momentum and news stay healthy, even after a gain.\n\n**23. Don't wait for the exact top.** Sell after the stock reacts and fails to rally back, or sell some into a climax run.\n*(Lefèvre ch. XV; Harper, The Perils of Over-Acquisitiveness)*\nBot: a holding up 25%+ in two weeks on 2× volume becomes REDUCE (\"climax run: think about taking some profit\").\n\n**24. Good news at high prices can be a sell signal.** Insiders often sell into great news near the top, and very bullish\ncrowds show up near peaks. *(Selden ch. II; Lefèvre ch. IX; Gibson, The Ordinary Swing of Prices)*\nBot: very good news on an already-stretched stock doesn't override \"overheated\"; the AI is told to watch for it.\n\n**25. Take profits in steps.** Selling part at a target locks in gains while letting the rest ride the trend.\n*(Harper, The Perils of Over-Acquisitiveness: chasing one more point gives gains back)*\nBot: profit alerts at +2%, +8% and +20%.\n\n**26. Exit on what the market does, not on your own profit or loss.** Your position biases you; use the stock's behavior\nto decide. *(Selden ch. V)*\nBot: sell reasons are trend breaks, momentum loss, heavy selling or bad news.\n\n**27. When you must get out, get out.** In a fast drop a limit order can leave you stuck; a market order exits.\n*(Lefèvre ch. IX; SEC stop-order bulletin)*\nBot: sell alerts tell you to act now rather than wait for a better price.\n\n## Part 5. Risk and position size\n\n**28. Size every trade for survival.** Only risk money you can afford to lose; decide your maximum loss before you buy.\n*(Harper, The Disconcerting Effect of Sudden Losses and Gains; Lefèvre ch. XIII)*\nBot: each buy alert sizes the position so hitting the sell line costs about 1% of your account.\n\n**29. Don't put too much in one stock.** Spreading money out protects you when one idea fails. *(SEC beginners' guide to\nasset allocation and diversification)*\nBot: a max-position cap, and the daily brief warns when one stock is most of your money.\n\n**30. No borrowed money.** Margin magnifies losses as much as gains; only buy what you can pay for in full. *(Harper,\nRetired Business Men in the Stock Market; Gibson, Introduction: avoid pyramiding)*\nBot: never suggests margin, options or short selling.\n\n**31. Big wins are dangerous too.** A run of wins breeds overconfidence and bigger, sloppier bets. *(Harper, The\nDisconcerting Effect of Sudden Losses and Gains)*\nBot: position size follows the same rule after wins as after losses.\n\n**32. Cash is a position.** Staying out until a good setup appears is a legitimate choice. *(Harper, There Is But One\nWay to Beat the Stock Market; Selden ch. VI)*\nBot: no forced buys; daily caps on buy alerts.\n\n**33. Short-term flipping is the weakest game.** Constant small trades multiply costs and mistakes; a well-reasoned\nposition held for the main move usually does better. *(Gibson, Scalping; Lefèvre ch. III)*\nBot: buy alerts target swings of days to months, not minutes.\n\n## Part 6. News and information\n\n**34. The market discounts the future.** Known good news is usually already in the price; prices often move before the\nnews comes out. *(Selden ch. IV; Lefèvre ch. I)*\nBot: news adjusts confidence but can't make a buy by itself; the chart must agree.\n\n**35. Uncertainty hurts more than bad news.** Once bad news is out, the worst may be priced in; not knowing is what keeps\nbuyers away. *(Selden ch. IV)*\nBot: the AI is told to separate known risks from open questions.\n\n**36. Ask \"what happens next?\"** Don't assume today's conditions will last; think one step ahead. *(Selden ch. IV)*\nBot: every answer includes what would cancel the idea.\n\n**37. Trust price over stories.** The tape shows what is happening, not why; act on the price, and treat explanations\nfor a drop (like \"it's just a raid\") with suspicion. *(Lefèvre ch. I, XVI)*\nBot: the chart checks have the final say over headlines and forum posts.\n\n**38. Rumors fade.** Takeover gossip and \"inside\" stories lift prices briefly, then the move usually reverses.\n*(Harper, Even the Stock Market Has Its Farcical Side)*\nBot: rumor-driven spikes trip the overheated check.\n\n**39. Read the filings.** Company reports are public; check the facts before you invest. *(Harper, The Stock Exchange Is\na Monument of Business Integrity)*\nBot: the AI can pull company fundamentals when your data budget allows.\n\n## Part 7. Tips, forums and hype\n\n**40. Ignore tips.** A tip doesn't tell you when to sell, and the person giving it rarely will. *(Lefèvre ch. III, VI,\nXVI)*\nBot: nothing from a forum or a person can trigger a buy on its own.\n\n**41. Never decide from social media alone.** Rumors, paid promoters and fake \"regular people\" spread there. *(SEC\nsocial media and investment fraud alert)*\nBot: Reddit and StockTwits are used only to measure attention and mood, labeled as such.\n\n**42. Sudden crowd hype is a warning.** Promoters pump a stock with hype, sell into the frenzy, and the price collapses.\n*(SEC pump-and-dump alert)*\nBot: \"⚠️ Sudden crowd hype\" when Reddit mentions jump 2.5× in a day; keep any position small.\n\n**43. Bubbles repeat.** Tulips, the South Sea and Mississippi schemes all followed the same path: a story, easy money,\neveryone joining in, then collapse. *(Mackay; Gibson, Indications of Crises)*\nBot: climax runs and crowd hype both lower confidence.\n\n**44. Expert forecasts are often wrong.** Market letters and predictions miss turning points; treat them as opinions.\n*(Harper, Some Signs Are Comprehendible)*\nBot: analyst views are \"outside view\" in AI answers, never the reason for a call.\n\n**45. Don't let anyone talk you out of sound analysis.** Persuasive people and plausible figures cost money when they\noverride your own read. *(Lefèvre ch. VI, X, XIV)*\nBot: the same checks run for every stock, no matter who's excited about it.\n\n## Part 8. Psychology\n\n**46. Hope and fear are the enemies.** Hope keeps you in losers; fear pushes you out of winners too early. *(Lefèvre ch.\nVIII, IX; Harper, Speculators Are Slaves of Sentiment)*\nBot: rules decide exits, so neither feeling has to.\n\n**47. Watching every tick distorts judgment.** Constant price-checking makes you react to noise; scheduled checks give a\nclearer view. *(Harper, The Pernicious Influence of the Stock Ticker)*\nBot: it watches for you every 15 minutes and only pings you when something matters.\n\n**48. Don't trade out of boredom.** Many losses come from wanting action. *(Harper; Lefèvre ch. II)*\nBot: no setup, no alert.\n\n**49. Look for opinions that disagree with you.** People notice only what supports their view. *(Harper, None Are So Blind)*\nBot: every AI answer must include a caution and what would cancel the idea.\n\n**50. Stay calm and step away when needed.** Anger, excitement and fear cloud judgment; a few days away can reset your\nthinking. *(Selden ch. VIII; Lefèvre ch. II)*\nBot: \"pause\" stops buy alerts any time you want a break.\n\n**51. Persistence isn't stubbornness.** Hold a position for good reasons, but don't cling to one idea when the market\nsays it's wrong. *(Selden ch. VIII; Lefèvre ch. XXI: when a stock doesn't act right, quit)*\nBot: a holding that breaks its trend turns to SELL even if the story still sounds good.\n\n**52. Decide your rules in advance.** Set your stop conditions and limits before emotions are involved, and treat them as\nbinding. *(Harper, They All Resolve, But They All Go Back)*\nBot: your sell line, risk level and caps are set once in Settings and applied automatically.\n\n**53. Character matters.** Patience, discipline and the ability to admit mistakes separate successful speculators from\nthe rest. *(Crump, preface; Harper)*\nBot: the track record shows every call honestly, wins and losses.\n\n## Part 9. Orders and execution\n\n**54. Know your order types.** A stop order becomes a market order when triggered and can fill below your stop in a fast\ndrop; a stop-limit protects the price but may not fill. *(SEC investor bulletins)*\nBot: your sell line is a trigger, not a guaranteed price.\n\n**55. Use limit orders to buy.** A limit near the alert price stops you overpaying in a fast market. *(SEC investor\nbulletins)*\nBot: buy alerts give an entry range.\n\n**56. Costs and execution eat edges.** Fees, spreads and slow fills can turn a winning method into a losing one.\n*(Lefèvre ch. I, II; Gibson, Scalping)*\nBot: it skips penny stocks in discovery and judges moves against each stock's normal daily swing.\n\n## Part 10. Keep score\n\n**57. Write predictions down and check them.** Recording calls and comparing them with what happened shows whether a\nmethod works. *(Lefèvre ch. I)*\nBot: every buy alert is followed for 4 weeks and graded in the track record.\n\n**58. Learn from your own mistakes.** Books teach, but reviewing your own trades teaches more. Start small while you\nlearn. *(Harper, Books Teach Wisdom; Lefèvre ch. VIII)*\nBot: the Obsidian notes keep a record of every alert and outcome.\n\n**59. Judge moves in percentages.** A $5 move means very different things for a $20 stock and a $500 stock. *(Gibson,\nConclusion)*\nBot: every check uses percentages and the stock's own normal daily swing.\n\n**60. Big moves take time.** Major advances play out over months or years, and simple mechanical systems tend to fail\nat reversals. *(Gibson, The Cycles of Stock Speculation)*\nBot: no single signal decides; the bot combines trend, momentum, volume, news and the market.\n<!-- /rules -->\n\n## How the AI uses this\n\nWhen you ask a question, ChatGPT gets this entire playbook first, then a fresh scan, then tools: the bot's rankings,\nany stock's numbers, news, market movers, your portfolio, Reddit and StockTwits buzz, web search, and a search of the\nfull books. It must:\n\n- always name at least one stock (the best candidate) with its status and the exact trigger to buy;\n- back every number with a tool result, and never invent prices or headlines;\n- treat forum posts as mood, never as facts;\n- quote the lesson from the books that fits, with book and chapter;\n- say what would cancel the idea.\n\nNot financial advice. The bot never places trades.\n"}</script>
