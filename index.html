 sm.message\n        alerts.append(sm)\n    alerts += budgets.notices\n    if cfg.get(\"paper_trading\", True):\n        ml = minutes_until(now_iso, clock.get(\"next_close\", \"\"))\n        alerts += [a for a in paper_trade(Paper.from_env(), alerts, allm, cfg, regime, state, now_iso,\n                                          bool(clock[\"is_open\"]), mkt,\n                                          ml is not None and 0 < ml <= cfg[\"summary_minutes_before_close\"])\n                   if a.key not in sent]\n        if clock[\"is_open\"]:\n            alerts += [a for a in paper_round_the_clock(alp, cfg, state, now_iso, True) if a.key not in sent]\n        try:\n            paper_charts(Paper.from_env(), alp, state, now_iso)\n        except Exception as e:  # noqa: BLE001 - charts are a nice-to-have\n            print(f\"Paper charts skipped: {e}\")\n    if cfg[\"paused\"]:\n        alerts = [a for a in alerts if a.kind in (\"stop\", \"reply\", \"paper\") or a.key.startswith(\"scan-now\")]\n    send_all(alerts, notifier, sent, state)\n    log_alerts(knowledge, alerts, now_iso)\n    if write_files and is_open and not os.environ.get(\"NEONTAPE_OFFLINE\") and len(library_status()[\"books\"]) < len(LIBRARY):\n        ensure_library()\n    if write_files and cfg.get(\"discover_forums\", True):\n        bi = best_idea(ranked, cfg, regime, state, now_iso, held, mkt)\n        if bi:\n            forum_buzz(bi[0].symbol, knowledge, now_iso)   # cached 2h, so this is ~1 request per 2 hours\n    if write_files:\n        write_vault(knowledge, state, holdings, allm, alerts, budgets, now_iso)\n        write_dashboard(knowledge, state, cfg, holdings, allm, ranked, regime_txt, budgets, now_iso, clock[\"is_open\"])\n    if out is not None:\n        out.update(allm=allm, ranked=ranked, regime=regime, regime_txt=regime_txt, mkt=mkt, now_iso=now_iso,\n                   is_open=clock[\"is_open\"], holdings=holdings)\n    if not alerts:\n        print(\"No alerts this run.\")\n    return alerts\n\n\ndef evaluate_buy(m: Metrics, nv: NewsView, cfg: dict, state: dict, knowledge: dict, budgets: Budgets,\n                 alp: Alpaca, today: str, now_iso: str, asm: dict | None = None) -> Alert | None:\n    \"\"\"Deep check of a stock that passed the chart checks. Free first, paid only when needed.\"\"\"\n    rs = get_research(m.symbol, state, knowledge, cfg, now_iso)\n    print(f\"  {m.symbol}: {rs.line()}\")\n    if rs.score <= cfg[\"news_block_buy_score\"]:\n        print(f\"  {m.symbol}: skipped, web news is negative\")\n        return None\n    extra = [rs.line()] + [f\"  • {x[1]} ({x[2]})\" for x in rs.top[:2]]\n    social = None\n    if research_uncertain(rs):  # free sources couldn't settle it: ask social data\n        social = lunar_social(budgets, m.symbol)\n        if social and social.get(\"sentiment\") is not None:\n            extra.append(f\"Social (LunarCrush): {social['sentiment']}% positive, \"\n                         f\"{social.get('posts') or '?'} posts, trend {social.get('trend') or '?'}.\")\n            if social[\"sentiment\"] < 40:\n                print(f\"  {m.symbol}: skipped, social mood is negative\")\n                return None\n    nxt = earnings_soon(budgets, knowledge, m.symbol, today)\n    if nxt:\n        days = trading_days_until(today, nxt)\n        if days <= cfg[\"earnings_blackout_days\"]:\n            print(f\"  {m.symbol}: skipped, earnings in {days} trading day(s)\")\n            return None\n        extra.append(f\"Next earnings: {nxt} (in {days} trading days). Prices can jump either way that day.\")\n    fb = forum_buzz(m.symbol, knowledge, now_iso)\n    if fb.get(\"line\"):\n        extra.append(fb[\"line\"])\n    st = long_stats(alp, knowledge, m.symbol, today)\n    if st:\n        extra.append(stats_line(st))\n    hz = rule_horizon(m, nv if abs(nv.score) >= abs(rs.score) else NewsView(rs.score, \"web news\", \"\"), cfg, st)\n    if hz[\"horizon\"] == \"LONG-TERM\":  # long holds deserve a look at the business (cached a week)\n        fu = av_fundamentals(budgets, knowledge, m.symbol, today) or None\n        fm = fd_metrics(budgets, m.symbol) if not fu else None\n        if fu:\n            up = (fu[\"target\"] / m.price - 1) * 100 if fu.get(\"target\") else None\n            extra.append(f\"Business: P/E {fu.get('pe') or '?'}\"\n                         + (f\", analysts' target {up:+.0f}% away\" if up is not None else \"\")\n                         + (f\", beat earnings {round(fu['beat_rate'] * 100)}% of the last {fu['quarters']} quarters\"\n                            if fu.get(\"beat_rate\") is not None else \"\") + \".\")\n        elif fm:\n            extra.append(\"Business: \" + \", \".join(f\"{k.replace('_', ' ')} {v:.2f}\" for k, v in fm.items()) + \".\")\n    elif hz[\"horizon\"] == \"MEDIUM\" and research_uncertain(rs):\n        ai = ai_horizon(m, nv, cfg, budgets)  # only when everything else is still unclear\n        if ai:\n            hz = ai\n    extra.append(track_line(knowledge))\n    return buy_alert(m, cfg, nv, hz, extra, asm)\n\n\ndef ideas_alert(ranked: list, regime: bool, cfg: dict, state: dict, knowledge: dict, now_iso: str,\n                today: str) -> Alert | None:\n    near = []\n    for m in ranked:\n        if m.symbol in MACRO_TICKERS:\n            continue\n        ok, fails = buy_check(m, cfg, regime, news_view(state, m.symbol, now_iso))\n        if not ok and len(fails) <= 2 and m.rank <= cfg[\"top_n\"]:\n            near.append((m, fails))\n        if len(near) >= 3:\n            break\n    trend = trending_ideas(knowledge, 3)\n    add_dynamic(knowledge, [t[\"symbol\"] for t in trend], today, cfg[\"ideas_watch_days\"], cfg[\"max_extra_watch\"])\n    if not near and not trend:\n        return None\n    lines = []\n    if near:\n        lines.append(\"Almost buy setups (watch these):\")\n        lines += [f\"• {m.symbol} #{m.rank} {money(m.price)}: waiting on {', '.join(f)}\" for m, f in near]\n    if trend:\n        lines.append(\"Trending in the news (positive):\")\n        lines += [f\"• {t['symbol']}: {t['mentions']} stories, e.g. \\\"{t['headline'][:80]}\\\"\" for t in trend]\n        lines.append(f\"The bot will also watch these for {cfg['ideas_watch_days']} days.\")\n    names = \", \".join([m.symbol for m, _ in near] + [t[\"symbol\"] for t in trend])\n    return Alert(\"ideas\", \"ideas\", \"💡 Stocks to look into\", compose(names, lines),\n                 cfg[\"priority_ideas\"], color=COLORS[\"buy\"])\n\n\ndef parse_ts(ts: str) -> datetime:\n    \"\"\"Parses Alpaca timestamps, which can carry 9-digit fractions: 2026-11-18T10:00:00.123456789-05:00\"\"\"\n    ts = ts.replace(\"Z\", \"+00:00\")\n    ts = re.sub(r\"(\\.\\d{6})\\d+\", r\"\\1\", ts)\n    return datetime.fromisoformat(ts)\n\n\ndef minutes_until(now_iso: str, then_iso: str) -> float | None:\n    try:\n        return (parse_ts(then_iso) - parse_ts(now_iso)).total_seconds() / 60\n    except (ValueError, TypeError):\n        return None\n\n\ndef summary_alert(holdings, allm, ranked, regime, regime_txt, cfg, state=None, now_iso=\"\", knowledge=None) -> Alert:\n    state = state or {}\n    lines, total = [], 0.0\n    mkt = news_view(state, MARKET_KEY, now_iso) if now_iso else None\n    for h in holdings:\n        m = allm.get(h.symbol)\n        if m:\n            g = (m.price / h.buy_price - 1) * 100\n            nv = news_view(state, h.symbol, now_iso) if now_iso else None\n            pl = \"\"\n            if h.shares:\n                d = (m.price - h.buy_price) * h.shares\n                total += d\n                pl = f\" ({signed_money(d)})\"\n            lines.append(f\"{h.symbol} {g:+.1f}%{pl} • {hold_advice(m, regime, nv, mkt)[0]}\"\n                         + (f\" • 📰 {nv.label}\" if nv and abs(nv.score) >= 0.4 else \"\"))\n    if not lines:\n        lines.append(\"No holdings logged.\")\n    watch = [m for m in ranked if m.symbol not in MACRO_TICKERS][:5]\n    bi = best_idea(ranked, cfg, regime, state, now_iso, {h.symbol for h in holdings}, mkt) if now_iso else None\n    if bi:\n        lines.insert(0, \"💡 Best idea now: \" + idea_line(*bi))\n    lines.append(\"Top momentum: \" + \", \".join(m.symbol for m in watch))\n    lines.append(regime_txt[:1].upper() + regime_txt[1:])\n    if mkt and abs(mkt.score) >= 0.4:\n        lines.append(f\"Market news: {mkt.label}\")\n    if knowledge is not None:\n        lines.append(track_line(knowledge))\n    simple = (f\"Open profit/loss: {signed_money(total)} on your stocks.\" if any(h.shares for h in holdings)\n              else f\"{len(holdings)} stock(s) tracked.\")\n    return Alert(\"summary\", \"summary\", \"📊 Close summary\", compose(simple, lines),\n                 cfg[\"priority_summary\"], color=COLORS[\"info\"])\n\n\n# =============================================================================\n# Backtest: buy setup + your fixed exits, on real history\n# =============================================================================\n\n@dataclass\nclass TradeStats:\n    label: str\n    trades: list[float] = field(default_factory=list)\n    days: list[int] = field(default_factory=list)\n\n    def line(self) -> str:\n        t = self.trades\n        if not t:\n            return f\"{self.label:28} no trades\"\n        wins = [x for x in t if x > 0]\n        losses = [x for x in t if x <= 0]\n        gw, gl = sum(wins), -sum(losses)\n        pf = gw / gl if gl else float(\"inf\")\n        return (f\"{self.label:28}{len(t):>7}{len(wins) / len(t) * 100:>8.1f}%\"\n                f\"{(sum(wins) / len(wins) if wins else 0):>+9.2f}%\"\n                f\"{(sum(losses) / len(losses) if losses else 0):>+9.2f}%\"\n                f\"{sum(t) / len(t):>+10.3f}%{pf:>8.2f}{sum(self.days) / len(self.days):>7.1f}\")\n\n\ndef simulate_exit(s: Series, entry_i: int, entry: float, stop_pct: float, tgt_pct: float,\n                  max_days: int, cost_pct: float) -> tuple[float, int]:\n    \"\"\"Bought at the open of entry_i. Returns (% result after costs, days held).\n    If the stop and target are both touched on the same day, assumes the stop hit first.\"\"\"\n    stop, tgt = entry * (1 - stop_pct / 100), entry * (1 + tgt_pct / 100)\n    last = min(len(s) - 1, entry_i + max_days - 1)\n    for j in range(entry_i, last + 1):\n        o = s.o[j] if j > entry_i else entry\n        if o <= stop:\n            return (o / entry - 1) * 100 - cost_pct, j - entry_i + 1   # gapped through the stop\n        if s.l[j] <= stop:\n            return -stop_pct - cost_pct, j - entry_i + 1\n        if o >= tgt:\n            return (o / entry - 1) * 100 - cost_pct, j - entry_i + 1\n        if s.h[j] >= tgt:\n            return tgt_pct - cost_pct, j - entry_i + 1\n    return (s.c[last] / entry - 1) * 100 - cost_pct, last - entry_i + 1\n\n\ndef run_backtest(cfg: dict, data: dict[str, list[dict]], max_days: int = 20,\n                 cost_pct: float = 0.1) -> list[TradeStats]:\n    series = {s: Series.from_bars(b) for s, b in data.items() if len(b) > MIN_HISTORY + 5}\n    if MARKET not in series:\n        raise ValueError(\"backtest needs SPY data\")\n    all_dates = sorted({d for s in series.values() for d in s.dates})\n    idx = {s: {d: i for i, d in enumerate(ser.dates)} for s, ser in series.items()}\n    universe = [s for s in cfg[\"universe\"] if s in series]\n    setup = TradeStats(\"Buy setup, your ±2% exits\")\n    setup_atr = TradeStats(\"Buy setup, 2×ATR/3×ATR exits\")\n    base = TradeStats(\"Any day in uptrend, ±2%\")\n    busy_until: dict[str, int] = {}\n    stop, tgt = cfg[\"stop_pct\"], cfg[\"profit_pct\"]\n    for d in all_dates:\n        ms = []\n        for sym in universe:\n            i = idx[sym].get(d)\n            if i is None or i + 1 >= len(series[sym]):\n                continue\n            m = metrics_at(sym, series[sym], i)\n            if m:\n                ms.append(m)\n        if not ms:\n            continue\n        score_all(ms)\n        si = idx[MARKET].get(d)\n        spy = metrics_at(MARKET, series[MARKET], si) if si is not None else None\n        regime, _ = market_ok(spy)\n        for m in ms:\n            if m.symbol in (MARKET, \"QQQ\"):\n                continue\n            s, i = series[m.symbol], idx[m.symbol][d]\n            entry = s.o[i + 1]\n            if m.price > m.sma50 > m.sma200 and regime and i % 5 == 0:\n                r, n = simulate_exit(s, i + 1, entry, stop, tgt, max_days, cost_pct)\n                base.trades.append(r); base.days.append(n)\n            if busy_until.get(m.symbol, -1) >= i:\n                continue\n            ok, _ = buy_check(m, cfg, regime)\n            if not ok:\n                continue\n            r, n = simulate_exit(s, i + 1, entry, stop, tgt, max_days, cost_pct)\n            setup.trades.append(r); setup.days.append(n)\n            a = m.atr_pct\n            r2, n2 = simulate_exit(s, i + 1, entry, 2 * a, 3 * a, max_days, cost_pct)\n            setup_atr.trades.append(r2); setup_atr.days.append(n2)\n            busy_until[m.symbol] = i + n\n    return [setup, setup_atr, base]\n\n\ndef print_backtest(stats: list[TradeStats], first: str, last: str, max_days: int) -> None:\n    print(f\"\\nBacktest {first} to {last} (max hold {max_days} days, 0.1% cost per trade)\")\n    print(f\"{'':28}{'Trades':>7}{'Win %':>9}{'Avg win':>9}{'Avg loss':>9}\"\n          f\"{'Per trade':>10}{'PF':>8}{'Days':>7}\")\n    for s in stats:\n        print(s.line())\n    print(\"\\nPer trade = average result per trade after costs. Above 0 means the rules made money.\")\n    print(\"PF (profit factor) = total won / total lost. Above 1.2 is decent, below 1.0 loses.\")\n    print(\"With ±2% exits you need to win more than ~53% of trades just to break even after costs.\")\n    print(\"Past results don't predict future results.\")\n\n\n# =============================================================================\n# Commands\n# =============================================================================\n\ndef cmd_scan(cfg, args):\n    alp = Alpaca.from_env(cfg[\"data_feed\"])\n    po = Pushover.from_env(cfg)\n    notifier = po if (po and not args.dry_run) else PrintNotifier()\n    if not po:\n        print(\"(No Pushover keys: alerts will only print here.)\")\n    holdings, errs = load_holdings()\n    state, knowledge = load_state(), load_knowledge()\n    clock = alp.clock()\n    if not args.dry_run:\n        write_names(alp, state, clock[\"timestamp\"][:10])\n    broker, notices = sync_broker(SnapTrade.from_env(), cfg, state, clock[\"timestamp\"])\n    holdings = merge_holdings(holdings, broker)\n    out: dict = {}\n    run_scan(cfg, alp, notifier, holdings, state, now_override=clock, force=args.force, knowledge=knowledge,\n             write_files=not args.dry_run, extra_alerts=notices, announce=not getattr(args, \"quiet\", False), out=out)\n    if getattr(args, \"cache\", None) and out.get(\"allm\") is not None:\n        save_scan_cache(Path(args.cache), out)\n    if errs:\n        import zlib\n        msg = \"holdings.txt has problems (those lines are ignored):\\n\" + \"\\n\".join(errs)\n        print(msg)\n        key = f\"holdings-error:{zlib.crc32(msg.encode())}\"\n        if key not in state.get(\"sent_today\", []):\n            if notifier.send(Alert(key, \"error\", \"⚠️ Check holdings.txt\", msg[:1000], 1)):\n                state.setdefault(\"sent_today\", []).append(key)\n    if not args.dry_run:\n        save_state(state)\n        save_knowledge(knowledge)\n\n\ndef cmd_report(cfg, args):\n    import copy\n    alp = Alpaca.from_env(cfg[\"data_feed\"])\n    clock = alp.clock()\n    now_iso = clock[\"timestamp\"]\n    today = now_iso[:10]\n    holdings, errs = load_holdings()\n    for e in errs:\n        print(\"holdings.txt:\", e)\n    broker, _ = sync_broker(SnapTrade.from_env(), cfg, copy.deepcopy(load_state()), now_iso)\n    holdings = merge_holdings(holdings, broker)\n    # Read the news without marking anything as seen (a report never changes the alert memory)\n    state = copy.deepcopy(load_state())\n    state.setdefault(\"news\", {})[\"last\"] = \"\"\n    state[\"news\"][\"seen\"] = []\n    events = []\n    if cfg[\"news\"]:\n        try:\n            events = process_news(alp, cfg, state, set(cfg[\"universe\"]) | {h.symbol for h in holdings}, now_iso)\n        except ApiError as e:\n            print(f\"News check failed: {e}\")\n    symbols = sorted(set(cfg[\"universe\"]) | {h.symbol for h in holdings} | {MARKET})\n    allm = build_metrics(alp, symbols, today, clock[\"is_open\"])\n    ranked = score_all([m for s, m in allm.items() if s in cfg[\"universe\"]])\n    regime, txt = market_ok(allm.get(MARKET))\n    mkt = news_view(state, MARKET_KEY, now_iso)\n    print(f\"\\n{today} • market {'OPEN' if clock['is_open'] else 'closed'} • {txt}\"\n          + (f\" • market news {mkt.score:+.1f} ({mkt.label})\" if mkt.label else \"\") + \"\\n\")\n    print(f\"{'#':>3} {'Sym':6}{'Price':>10}{'Score':>7}{'12-1m':>8}{'6-1m':>7}{'Off hi':>8}\"\n          f\"{'RSI':>5}{'ATR%':>6}{'News':>6}  Buy setup?\")\n    for m in ranked[: args.top]:\n        nv = news_view(state, m.symbol, now_iso)\n        ok, fails = buy_check(m, cfg, regime, nv)\n        extra = f\"  [{rule_horizon(m, nv, cfg)['horizon'].lower()}]\" if ok else \"\"\n        print(f\"{m.rank:>3} {m.symbol:6}{m.price:>10.2f}{m.score:>7.0f}{m.ret_12_1:>+7.0f}%\"\n              f\"{m.ret_6_1:>+6.0f}%{m.from_high_pct:>7.1f}%{m.rsi:>5.0f}{m.atr_pct:>6.1f}{nv.score:>+6.1f}  \"\n              + (\"YES\" + extra if ok else \"no: \" + \"; \".join(fails[:2])))\n    if holdings:\n        print(\"\\nYour holdings:\")\n        for h in holdings:\n            m = allm.get(h.symbol)\n            if not m:\n                print(f\"  {h.symbol}: no data\"); continue\n            g = (m.price / h.buy_price - 1) * 100\n            v, pts, why = hold_advice(m, regime, news_view(state, h.symbol, now_iso), mkt)\n            print(f\"  {h.symbol:6} bought {h.buy_price:.2f} now {m.price:.2f} ({g:+.2f}%)  {v} ({pts:+d})\")\n            print(\"         \" + \" | \".join(why))\n    if events:\n        print(\"\\nBiggest stories (last 24h) for your stocks and the market:\")\n        for ev in sorted(events, key=lambda x: -abs(x.impact))[:12]:\n            arrow = \"▲\" if ev.direction > 0 else \"▼\" if ev.direction < 0 else \"•\"\n            print(f\"  {arrow} {ev.symbol:8}{ev.impact:+5.1f}  {ev.category[:28]:28}  {ev.headline[:90]}\")\n\n\ndef cmd_test_alert(cfg, args):\n    po = Pushover.from_env(cfg)\n    if not po:\n        sys.exit(\"Set PUSHOVER_TOKEN and PUSHOVER_USER first (GitHub secrets or .env).\")\n    t = lambda simple, why: compose(simple, why)\n    # Real SPY prices for the sample charts (no made-up data); skipped if Alpaca keys are missing\n    closes = []\n    load_env()\n    if os.environ.get(\"APCA_API_KEY_ID\") and os.environ.get(\"APCA_API_SECRET_KEY\"):\n        try:\n            bars = Alpaca.from_env(cfg[\"data_feed\"]).daily_bars([MARKET], date.today() - timedelta(days=150))\n            closes = [float(b[\"c\"]) for b in bars.get(MARKET, [])][-90:]\n        except ApiError as e:\n            print(f\"(no chart: {e})\")\n    last = closes[-1] if closes else 0\n\n    def pic(gain_pct):\n        if not closes:\n            return None\n        buy = last / (1 + gain_pct / 100)\n        return {\"closes\": closes, \"label\": \"TEST: REAL SPY CHART\",\n                \"lines\": [(buy, \"#e5e7eb\", \"BUY\"), (buy * (1 - cfg[\"stop_pct\"] / 100), \"#ff3b5c\", \"STOP\")]}\n    app = app_link(cfg, \"alerts\")\n    samples = [\n        Alert(\"t1\", \"buy\", \"🛒 TEST BUY: SPY • MODERATE risk\",\n              t(\"Buy about $15.00. Medium hold: about 2–6 weeks.\",\n                [\"This is a test. Real buy alerts explain the rank, trend, news and hold time here.\"]),\n              cfg[\"priority_buy\"], \"SPY\", cfg[\"sound_buy\"], app, \"Open Neon Tape\", COLORS[\"buy\"], pic(0)),\n        Alert(\"t2\", \"profit\", \"🟡 TEST SELL OFFER: SPY +2.1%\", t(\"You hit your +2% target.\", [\"Test.\"]),\n              cfg[\"priority_profit\"], \"SPY\", cfg[\"sound_buy\"], app, \"Open Neon Tape\", COLORS[\"yellow\"], pic(2.1)),\n        Alert(\"t3\", \"profit8\", \"🔵 TEST SOLID SELL: SPY +8.3%\", t(\"Solid gain. Selling locks it in.\", [\"Test.\"]),\n              cfg[\"priority_profit\"], \"SPY\", cfg[\"sound_buy\"], app, \"Open Neon Tape\", COLORS[\"blue\"], pic(8.3)),\n        Alert(\"t4\", \"profit20\", \"🟢 TEST BIG WIN: SPY +21.0%\", t(\"Huge gain. Strongly consider selling.\", [\"Test.\"]),\n              cfg[\"priority_profit\"], \"SPY\", cfg[\"sound_buy\"], app, \"Open Neon Tape\", COLORS[\"green\"], pic(21.0)),\n        Alert(\"t5\", \"news\", \"📰 TEST SPY ▼ bad news\", t(\"Leadership exit. Advice: LEAN SELL.\", [\"Test.\"]),\n              cfg[\"priority_news\"], \"SPY\", cfg[\"sound_sell\"], app, \"Open Neon Tape\", COLORS[\"news_bad\"], pic(0.5)),\n        Alert(\"t6\", \"stop\", \"🔴 TEST SELL NOW: SPY -2.1%\",\n              t(\"This is the emergency alert.\", [\"It repeats every minute until you tap Acknowledge.\"]),\n              cfg[\"priority_stop\"], \"SPY\", cfg[\"sound_sell\"], app, \"Open Neon Tape\", COLORS[\"red\"], pic(-2.1)),\n    ]\n    for a in (samples if args.all else samples[:5]):\n        po.send(a)\n    if not args.all:\n        print(\"Add --all to also send the emergency (repeating) alert.\")\n\n\n# =============================================================================\n# \"Tell the bot\": plain-English requests from the app\n# =============================================================================\n\nREQUEST_HELP = (\"Try: scan now • check NVDA • watch TSLA • stop watching TSLA • set stop to 3% • \"\n                \"set target to 4% • risk low • account $50 • max 2 buys a day • pause alerts • resume alerts\")\n_SKIP_WORDS = {\"I\", \"THE\", \"A\", \"AN\", \"STOCK\", \"STOCKS\", \"MY\", \"IT\", \"ON\", \"AND\", \"FOR\", \"ME\", \"PLEASE\", \"NOW\", \"TO\", \"OF\"}\n\n# Allowed settings and their safe ranges (anything else is refused)\nREQUEST_LIMITS = {\"stop_pct\": (0.5, 20.0), \"profit_pct\": (0.5, 50.0), \"account_size\": (1.0, 1_000_000.0),\n                  \"max_buy_alerts_per_day\": (0, 10)}\n\n\ndef _tickers(text: str) -> list[str]:\n    \"\"\"Symbols written in CAPS or with a $ win; otherwise only the first word counts (\"check amd doing\").\"\"\"\n    words = re.findall(r\"\\$?[A-Za-z]{1,5}(?:\\.[A-Za-z])?\\b\", text)\n    words = [w for w in words if w.lstrip(\"$\").upper() not in _SKIP_WORDS]\n    marked = [w for w in words if w.startswith(\"$\") or (w.isupper() and len(w.lstrip(\"$\")) >= 1)]\n    pick = marked or words[:1]\n    out = []\n    for w in pick:\n        t = w.lstrip(\"$\").upper()\n        if t not in out:\n            out.append(t)\n    return out\n\n\ndef parse_request(text: str) -> list[dict]:\n    \"\"\"Turns a short request into actions. Returns [] if it isn't understood.\"\"\"\n    t = \" \".join(text.strip().split())\n    low = t.lower()\n    acts: list[dict] = []\n    num = lambda pat: (m.group(1) if (m := re.search(pat, low)) else None)\n    if re.search(r\"\\b(pause|mute|stop) (all )?(alerts|notifications)\\b\", low):\n        acts.append({\"set\": \"paused\", \"value\": True})\n    if re.search(r\"\\b(resume|unpause|unmute|start) (all )?(alerts|notifications)\\b\", low):\n        acts.append({\"set\": \"paused\", \"value\": False})\n    if (v := num(r\"\\bstop(?:[- ]loss)?\\s*(?:to|at|=|is)?\\s*(\\d+(?:\\.\\d+)?)\\s*%\")):\n        acts.append({\"set\": \"stop_pct\", \"value\": float(v)})\n    if (v := num(r\"\\b(?:target|take[- ]profit|profit|sell offer)\\s*(?:to|at|=|is)?\\s*\\+?(\\d+(?:\\.\\d+)?)\\s*%\")):\n        acts.append({\"set\": \"profit_pct\", \"value\": float(v)})\n    if (v := num(r\"\\brisk\\s*(?:to|level)?\\s*(?:to\\s*)?(low|moderate|medium|high|speculative|spec|any|aggressive)\\b\")):\n        acts.append({\"set\": \"risk_level\", \"value\": RISK_ALIASES.get(v, v)})\n    if (v := num(r\"\\b(?:account(?: size)?|i have|budget|balance)\\s*(?:is|to|of|=)?\\s*\\$?(\\d+(?:\\.\\d+)?)\")):\n        acts.append({\"set\": \"account_size\", \"value\": float(v)})\n    if (v := num(r\"\\b(?:max|at most|only)\\s*(\\d+)\\s*buy\")):\n        acts.append({\"set\": \"max_buy_alerts_per_day\", \"value\": int(v)})\n    m = re.search(r\"\\b(?:stop watching|unwatch|ignore|remove|skip)\\s+(.+)\", t, re.I)\n    if m:\n        for sym in _tickers(m.group(1)):\n            acts.append({\"unwatch\": sym})\n    else:\n        m = re.search(r\"\\b(?:watch|add|track|follow)\\s+(.+)\", t, re.I)\n        if m and not re.search(r\"\\b(alerts|notifications)\\b\", m.group(1), re.I):\n            for sym in _tickers(m.group(1)):\n                acts.append({\"watch\": sym})\n    m = re.search(r\"\\b(?:check|look at|analy[sz]e|how(?:'s| is)|what about|should i (?:buy|sell|hold))\\s+(.+)\", t, re.I)\n    if m:\n        for sym in _tickers(m.group(1))[:3]:\n            acts.append({\"check\": sym})\n    if re.search(r\"\\b(scan|rescan|run)\\b\", low) and not any(\"check\" in a for a in acts):\n        acts.append({\"scan\": True})\n    return acts\n\n\ndef ai_parse_request(text: str, cfg: dict, budgets: \"Budgets | None\") -> list[dict]:\n    \"\"\"Claude turns an unclear request into the same actions. Used only if the rules didn't understand.\"\"\"\n    system = (\"Convert the user's request to a stock-alert bot into a JSON array of actions. Allowed actions: \"\n              '{\"scan\":true} {\"check\":\"TICKER\"} {\"watch\":\"TICKER\"} {\"unwatch\":\"TICKER\"} '\n              '{\"set\":\"stop_pct\"|\"profit_pct\"|\"account_size\"|\"max_buy_alerts_per_day\",\"value\":number} '\n              '{\"set\":\"risk_level\",\"value\":\"low\"|\"moderate\"|\"high\"|\"speculative\"} {\"set\":\"paused\",\"value\":true|false}. '\n              \"Use real US tickers only. If nothing fits, return []. Reply with JSON only.\")\n    out, _ = ask_ai(system, text[:500], cfg, budgets, 400, check=lambda t: \"[\" in t)\n    return [a for a in _json_array(out or \"\") if isinstance(a, dict)][:6]\n\n\ndef apply_settings(acts: list[dict], cfg_path: Path) -> list[str]:\n    \"\"\"Writes allowed changes to config.json. Returns what changed, in plain words.\"\"\"\n    raw = json.loads(cfg_path.read_text(encoding=\"utf-8\")) if cfg_path.exists() else {}\n    done = []\n    for a in acts:\n        if \"set\" in a:\n            k, v = a[\"set\"], a.get(\"value\")\n            if k == \"risk_level\":\n                v = RISK_ALIASES.get(str(v).lower(), str(v).lower())\n                if v not in RISK_PROFILES:\n                    done.append(\"✗ risk must be low, medium, high or speculative\"); continue\n            elif k == \"paused\":\n                v = bool(v)\n            elif k in REQUEST_LIMITS:\n                lo, hi = REQUEST_LIMITS[k]\n                try:\n                    v = float(v)\n                except (TypeError, ValueError):\n                    continue\n                if not lo <= v <= hi:\n                    done.append(f\"✗ {k.replace('_', ' ')} must be between {lo:g} and {hi:g}\"); continue\n                if k == \"max_buy_alerts_per_day\":\n                    v = int(v)\n                if k == \"stop_pct\" and v <= float(raw.get(\"near_stop_gap_pct\", DEFAULT_CONFIG[\"near_stop_gap_pct\"])):\n                    done.append(\"✗ stop is too small\"); continue\n            else:\n                continue\n            raw[k] = v\n            label = {\"stop_pct\": \"Sell line (stop)\", \"profit_pct\": \"Sell offer at\", \"account_size\": \"Account size\",\n                     \"max_buy_alerts_per_day\": \"Max buy alerts a day\", \"risk_level\": \"Risk level\",\n                     \"paused\": \"Alerts\"}[k]\n            shown = (f\"-{v:g}%\" if k == \"stop_pct\" else f\"+{v:g}%\" if k == \"profit_pct\" else money(v)\n                     if k == \"account_size\" else (\"paused (SELL NOW still comes)\" if v else \"on\")\n                     if k == \"paused\" else str(v))\n            done.append(f\"✓ {label}: {shown}\")\n        elif \"watch\" in a or \"unwatch\" in a:\n            sym = str(a.get(\"watch\") or a.get(\"unwatch\")).upper()\n            if not re.fullmatch(r\"[A-Z]{1,5}(\\.[A-Z])?\", sym):\n                continue\n            w = [x for x in raw.get(\"watch_extra\", []) if x != sym]\n            ig = [x for x in raw.get(\"ignore\", []) if x != sym]\n            if \"watch\" in a:\n                w.append(sym); done.append(f\"✓ Watching {sym}\")\n            else:\n                ig.append(sym); done.append(f\"✓ Stopped watching {sym}\")\n            raw[\"watch_extra\"], raw[\"ignore\"] = w, ig\n    if done:\n        cfg_path.write_text(json.dumps(raw, indent=2) + \"\\n\", encoding=\"utf-8\")\n    return done\n\n\ndef check_alert(sym: str, allm: dict, ranked: list, regime: bool, cfg: dict, state: dict, now_iso: str,\n                holdings: list[Holding]) -> Alert:\n    m = allm.get(sym)\n    if not m:\n        return Alert(f\"reply:{sym}:{now_iso}\", \"reply\", f\"🤖 {sym}: no data\",\n                     compose(f\"I couldn't get a year of prices for {sym}. Check the symbol.\", []), 0, sym,\n                     color=COLORS[\"info\"])\n    nv = news_view(state, sym, now_iso)\n    verdict, pts, why = hold_advice(m, regime, nv, news_view(state, MARKET_KEY, now_iso))\n    ok, fails = buy_check(m, cfg, regime, nv)\n    h = next((x for x in holdings if x.symbol == sym), None)\n    lines = [f\"Price {money(m.price)} ({m.day_chg_pct:+.1f}% today) • {risk_label(m.atr_pct)} risk \"\n             f\"(moves ±{m.atr_pct:.1f}%/day)\",\n             f\"Momentum rank #{m.rank} of {m.of}: 12-mo {m.ret_12_1:+.0f}%, 6-mo {m.ret_6_1:+.0f}%, \"\n             f\"{m.from_high_pct:.1f}% below its 52-week high\",\n             \"Buy setup: YES, passes every check\" if ok else \"Buy setup: not yet. \" + \"; \".join(fails[:3]),\n             f\"Chart + news score {pts:+d}:\", *why]\n    lines.append(f\"📰 {nv.label}: {nv.headline}\" if nv.headline else \"📰 No major news in the last 3 days.\")\n    if h:\n        g = (m.price / h.buy_price - 1) * 100\n        lines.insert(0, f\"You own it: bought {money(h.buy_price)}, now {g:+.1f}%\")\n    if h:\n        act = \"sell\" if verdict.startswith((\"SELL\", \"LEAN SELL\")) else \"hold\"\n        simple = f\"Why: {verdict.split(': ', 1)[-1].lower()}.\"\n    else:\n        act = \"buy\" if ok else \"not buy\"\n        simple = f\"Why: {buy_reason(m, nv)}.\" if ok else f\"Why: {'; '.join(fails[:2]) or verdict}.\"\n    return Alert(f\"reply:{sym}:{now_iso}\", \"reply\", f\"🤖 You should {act} {sym} ({money(m.price)})\",\n                 compose(simple, lines), 0, sym, \"\", app_link(cfg, \"stocks\"), \"Open Neon Tape\",\n                 COLORS[\"green\" if ok else \"info\"],\n                 chart_of(m, [(m.price * (1 - cfg[\"stop_pct\"] / 100), \"#ff3b5c\", \"STOP\")] if not h else\n                          [(h.buy_price, \"#e5e7eb\", \"BUY\"), (h.buy_price * (1 - cfg[\"stop_pct\"] / 100), \"#ff3b5c\", \"STOP\")]))\n\n\ndef cmd_ask(cfg, args):\n    text = (args.text or os.environ.get(\"BOT_REQUEST\", \"\")).strip()[:500]\n    po = Pushover.from_env(cfg)\n    notifier = po or PrintNotifier()\n    knowledge = load_knowledge()\n    alp = Alpaca.from_env(cfg[\"data_feed\"])\n    clock = alp.clock()\n    now_iso = clock[\"timestamp\"]\n    budgets = Budgets(knowledge, cfg, now_iso)\n    acts = parse_request(text) if text else []\n    source = \"rules\"\n    if text and not acts:\n        acts, source = ai_parse_request(text, cfg, budgets), \"Claude\"\n    cfg_path = args.config or HERE / \"config.json\"\n    changes = apply_settings(acts, cfg_path)\n    if changes:\n        cfg = load_config(cfg_path)\n    replies: list[Alert] = []\n    if not acts:\n        replies.append(Alert(f\"reply:{now_iso}\", \"reply\", \"🤖 I didn't get that\",\n                             compose(f\"\\\"{text}\\\"\" if text else \"Empty request.\", [REQUEST_HELP]), 0,\n                             color=COLORS[\"info\"]))\n    elif changes:\n        replies.append(Alert(f\"reply:{now_iso}\", \"reply\", \"🤖 Done\",\n                             compose(\" • \".join(changes), [f\"Your request: \\\"{text}\\\"\",\n                                                           f\"Understood by: {source}\"]), 0, color=COLORS[\"green\"]))\n    checks = [a[\"check\"].upper() for a in acts if isinstance(a.get(\"check\"), str)][:3]\n    if checks:\n        state = load_state()\n        holdings, _ = load_holdings()\n        broker, _ = sync_broker(SnapTrade.from_env(), cfg, json.loads(json.dumps(state)), now_iso)\n        holdings = merge_holdings(holdings, broker)\n        syms = sorted(set(cfg[\"universe\"]) | set(checks) | {MARKET})\n        allm = build_metrics(alp, syms, now_iso[:10], clock[\"is_open\"])\n        ranked = score_all([m for s, m in allm.items() if s in set(cfg[\"universe\"]) | set(checks)])\n        regime, _ = market_ok(allm.get(MARKET))\n        for sym in checks:\n            replies.append(check_alert(sym, allm, ranked, regime, cfg, state, now_iso, holdings))\n    for a in replies:\n        notifier.send(a)\n    log = knowledge.setdefault(\"requests\", [])\n    log.append({\"t\": now_iso[:16], \"text\": text, \"did\": changes + [f\"checked {c}\" for c in checks]\n                + ([\"scan\"] if any(a.get(\"scan\") for a in acts) else []) or [\"not understood\"]})\n    knowledge[\"requests\"] = log[-40:]\n    save_knowledge(knowledge)\n    if any(a.get(\"scan\") for a in acts):\n        args.force, args.dry_run = True, False\n        cmd_scan(cfg, args)\n\n\n# =============================================================================\n# AI agent: answers your questions with a fresh scan + tools (ChatGPT first, Claude for extra help)\n# =============================================================================\n\ndef save_scan_cache(path: Path, out: dict) -> None:\n    from dataclasses import asdict\n    data = {\"now_iso\": out[\"now_iso\"], \"is_open\": out[\"is_open\"], \"regime\": out[\"regime\"],\n            \"regime_txt\": out[\"regime_txt\"], \"ranked\": [m.symbol for m in out[\"ranked\"]],\n            \"metrics\": {k: asdict(m) for k, m in out[\"allm\"].items()},\n            \"holdings\": [asdict(h) for h in out[\"holdings\"]]}\n    path.write_text(json.dumps(data), encoding=\"utf-8\")\n\n\ndef load_scan_cache(path: Path) -> dict | None:\n    try:\n        d = json.loads(path.read_text(encoding=\"utf-8\"))\n    except (OSError, ValueError):\n        return None\n    allm = {k: Metrics(**v) for k, v in d[\"metrics\"].items()}\n    return {\"allm\": allm, \"ranked\": [allm[s] for s in d[\"ranked\"] if s in allm], \"regime\": d[\"regime\"],\n            \"regime_txt\": d[\"regime_txt\"], \"now_iso\": d[\"now_iso\"], \"is_open\": d[\"is_open\"],\n            \"holdings\": [Holding(**h) for h in d[\"holdings\"]]}\n\n\n# ---------- The library: full public-domain market books, searchable by the AI ----------\n\nLIBRARY_DIR = HERE / \"library\"\nLIBRARY = [  # Project Gutenberg ebook ids (all public domain in the USA)\n    {\"id\": 60979, \"slug\": \"lefevre\", \"title\": \"Reminiscences of a Stock Operator\", \"author\": \"Edwin Lefèvre\", \"year\": 1923},\n    {\"id\": 26841, \"slug\": \"butler\", \"title\": \"Successful Stock Speculation\", \"author\": \"J. J. Butler\", \"year\": 1922},\n    {\"id\": 73647, \"slug\": \"harper\", \"title\": \"The Psychology of Speculation\", \"author\": \"Henry Howard Harper\", \"year\": 1926},\n    {\"id\": 75570, \"slug\": \"selden\", \"title\": \"Psychology of the Stock Market\", \"author\": \"G. C. Selden\", \"year\": 1912},\n    {\"id\": 75687, \"slug\": \"gibson\", \"title\": \"The Cycles of Speculation\", \"author\": \"Thomas Gibson\", \"year\": 1907},\n    {\"id\": 59518, \"slug\": \"crump\", \"title\": \"The Theory of Stock Exchange Speculation\", \"author\": \"Arthur Crump\", \"year\": 1887},\n    {\"id\": 636, \"slug\": \"mackay\", \"title\": \"Extraordinary Popular Delusions, Vol. 1 (bubbles and manias)\", \"author\": \"Charles Mackay\", \"year\": 1841},\n]\n_CHAPTER = re.compile(r\"^\\s*(CHAPTER\\s+[IVXLC\\d]+\\.?|[IVXLC]{1,6}\\.?)\\s*$|^\\s*CHAPTER\\s+[IVXLC\\d]+\\b.*$\")\n_STOP = set(\"\"\"a an and are as at be been but by can could did do does for from had has have he her his i if in into is it\nits me more most my no not of on or our she so than that the their them then there these they this to was we were what\nwhen which who will with would you your should about just very also only any some such than one all how why\"\"\".split())\n\n\ndef gutenberg_text(book_id: int) -> str:\n    \"\"\"Download a book's plain text from Project Gutenberg (runs on GitHub, which can reach it).\"\"\"\n    last = None\n    for url in (f\"https://www.gutenberg.org/cache/epub/{book_id}/pg{book_id}.txt\",\n                f\"https://www.gutenberg.org/ebooks/{book_id}.txt.utf-8\"):\n        try:\n            req = urllib.request.Request(url, headers={\"User-Agent\": \"NeonTape-bot/1.0 (personal research; one copy per book)\"})\n            with urllib.request.urlopen(req, timeout=40) as r:\n                return r.read().decode(\"utf-8\", errors=\"replace\")\n        except (urllib.error.URLError, OSError, ValueError) as e:\n            last = e\n    raise ApiError(f\"Couldn't download Gutenberg book {book_id}: {last}\")\n\n\ndef split_book(raw: str, max_len: int = 1100) -> list[dict]:\n    \"\"\"Strip the Gutenberg license, then cut the book into readable passages tagged with their chapter.\"\"\"\n    t = raw.replace(\"\\r\\n\", \"\\n\")\n    a = re.search(r\"\\*\\*\\* ?START OF (THE|THIS) PROJECT GUTENBERG EBOOK[^\\n]*\\n\", t)\n    b = re.search(r\"\\*\\*\\* ?END OF (THE|THIS) PROJECT GUTENBERG EBOOK\", t)\n    t = t[a.end() if a else 0: b.start() if b else len(t)]\n    out, chap, buf = [], \"\", []\n    def flush():\n        txt = re.sub(r\"\\s+\", \" \", \" \".join(buf)).strip()\n        txt = re.sub(r\"_([^_]+)_\", r\"\\1\", txt)\n        if len(txt) >= 160:\n            out.append({\"ch\": chap, \"text\": txt})\n        buf.clear()\n    for para in re.split(r\"\\n\\s*\\n\", t):\n        line = para.strip()\n        if not line:\n            continue\n        if _CHAPTER.match(line) and len(line) < 60:\n            flush()\n            chap = re.sub(r\"\\s+\", \" \", line).strip(\". \").replace(\"CHAPTER \", \"Ch. \")\n            continue\n        if sum(len(x) for x in buf) + len(line) > max_len and buf:\n            flush()\n        buf.append(line)\n    flush()\n    return out\n\n\ndef ensure_library(force: bool = False, fetch=None) -> list[dict]:\n    \"\"\"Download and index any missing books. Each book is fetched once and kept in the repo (library/).\"\"\"\n    fetch = fetch or gutenberg_text\n    LIBRARY_DIR.mkdir(exist_ok=True)\n    have = []\n    for b in LIBRARY:\n        f = LIBRARY_DIR / f\"{b['slug']}.json\"\n        if f.exists() and not force:\n            have.append(b[\"slug\"]); continue\n        try:\n            passages = split_book(fetch(b[\"id\"]))\n        except ApiError as e:\n            print(f\"  library: {e}\")\n            continue\n        if len(passages) < 8:\n            print(f\"  library: {b['title']} looked empty, skipped\")\n            continue\n        f.write_text(json.dumps(dict(b, passages=passages), ensure_ascii=False), encoding=\"utf-8\")\n        have.append(b[\"slug\"])\n        print(f\"  library: saved {b['title']} ({len(passages)} passages)\")\n    return [b for b in LIBRARY if b[\"slug\"] in have]\n\n\n_LIB_CACHE: dict = {}\n\n\ndef _load_library() -> list[dict]:\n    if \"docs\" not in _LIB_CACHE:\n        docs = []\n        for b in LIBRARY:\n            f = LIBRARY_DIR / f\"{b['slug']}.json\"\n            if f.exists():\n                try:\n                    j = json.loads(f.read_text(encoding=\"utf-8\"))\n                except ValueError:\n                    continue\n                for i, p in enumerate(j.get(\"passages\", [])):\n                    words = [w for w in re.findall(r\"[a-z]+\", p[\"text\"].lower()) if w not in _STOP and len(w) > 2]\n                    docs.append({\"book\": b, \"ch\": p.get(\"ch\", \"\"), \"i\": i, \"text\": p[\"text\"], \"words\": words})\n        _LIB_CACHE[\"docs\"] = docs\n    return _LIB_CACHE[\"docs\"]\n\n\ndef _stem(w: str) -> str:\n    for suf in (\"ings\", \"ing\", \"ers\", \"ies\", \"ied\", \"ed\", \"es\", \"er\", \"ly\", \"s\"):\n        if w.endswith(suf) and len(w) - len(suf) >= 4:\n            w = w[: -len(suf)]\n            break\n    return w[:-1] if w.endswith(\"e\") and len(w) > 4 else w\n\n\ndef search_library(query: str, n: int = 4, book: str = \"\") -> list[dict]:\n    \"\"\"BM25 keyword search over every passage of every book. Returns the best passages with book and chapter.\"\"\"\n    docs = _load_library()\n    if book:\n        docs = [d for d in docs if book.lower() in (d[\"book\"][\"slug\"] + \" \" + d[\"book\"][\"title\"] + \" \" + d[\"book\"][\"author\"]).lower()]\n    q = {_stem(w) for w in re.findall(r\"[a-z]+\", query.lower()) if w not in _STOP and len(w) > 2}\n    if not docs or not q:\n        return []\n    if \"stems\" not in _LIB_CACHE or _LIB_CACHE.get(\"n\") != len(_LIB_CACHE[\"docs\"]):\n        for d in _LIB_CACHE[\"docs\"]:\n            d[\"stems\"] = [_stem(w) for w in d[\"words\"]]\n        df: dict = {}\n        for d in _LIB_CACHE[\"docs\"]:\n            for w in set(d[\"stems\"]):\n                df[w] = df.get(w, 0) + 1\n        _LIB_CACHE.update(stems=True, df=df, n=len(_LIB_CACHE[\"docs\"]),\n                          avg=sum(len(d[\"stems\"]) for d in _LIB_CACHE[\"docs\"]) / max(1, len(_LIB_CACHE[\"docs\"])))\n    N, df, avg = _LIB_CACHE[\"n\"], _LIB_CACHE[\"df\"], _LIB_CACHE[\"avg\"]\n    scored = []\n    for d in docs:\n        tf: dict = {}\n        for w in d[\"stems\"]:\n            if w in q:\n                tf[w] = tf.get(w, 0) + 1\n        if not tf:\n            continue\n        sc = 0.0\n        for w, f in tf.items():\n            idf = math.log(1 + (N - df.get(w, 0) + 0.5) / (df.get(w, 0) + 0.5))\n            sc += idf * f * 2.2 / (f + 1.2 * (0.25 + 0.75 * len(d[\"stems\"]) / avg))\n        scored.append((sc * (1 + 0.15 * (len(tf) - 1)), d))\n    scored.sort(key=lambda x: -x[0])\n    out, seen = [], set()\n    for sc, d in scored:\n        key = (d[\"book\"][\"slug\"], d[\"i\"] // 2)\n        if key in seen:\n            continue\n        seen.add(key)\n        out.append({\"book\": d[\"book\"][\"title\"], \"author\": d[\"book\"][\"author\"], \"year\": d[\"book\"][\"year\"],\n                    \"chapter\": d[\"ch\"], \"passage\": d[\"text\"][:1100]})\n        if len(out) >= n:\n            break\n    return out\n\n\ndef library_status() -> dict:\n    docs = _load_library()\n    books = {}\n    for d in docs:\n        books[d[\"book\"][\"slug\"]] = books.get(d[\"book\"][\"slug\"], 0) + 1\n    return {\"books\": [dict(title=b[\"title\"], author=b[\"author\"], year=b[\"year\"], passages=books.get(b[\"slug\"], 0))\n                      for b in LIBRARY if books.get(b[\"slug\"])], \"passages\": len(docs)}\n\n\ndef playbook_rules(path: Path | None = None, limit: int = 60000) -> str:\n    \"\"\"The bot's study notes from the market books (playbook.md), squeezed for the AI's instructions.\"\"\"\n    try:\n        t = (path or HERE / \"playbook.md\").read_text(encoding=\"utf-8\")\n    except OSError:\n        return \"\"\n    if \"<!-- rules -->\" in t:\n        t = t.split(\"<!-- rules -->\", 1)[1].split(\"<!-- /rules -->\", 1)[0]\n    t = re.sub(r\"\\*\\*|\\*|#+ |Bot: \", lambda m: \"→ bot: \" if m.group(0) == \"Bot: \" else \"\", t)\n    return re.sub(r\"[ \\t]+\", \" \", re.sub(r\"\\n{2,}\", \"\\n\", t)).strip()[:limit]\n\n\nAGENT_SYSTEM_BASE = \"\"\"You are the AI analyst inside Neon Tape, a stock alert bot for one person who buys small amounts\n(fractional shares) on Robinhood. The bot just ran a fresh scan of the market. Work like a careful analyst who uses the bot:\n\nHOW TO WORK (use your tools; never guess)\n1. Start with best_idea and top_opportunities: the bot's own ranking, status and confidence for every stock it scanned.\n2. Check the leading 2-3 candidates with get_stock (any US ticker works, even ones the bot didn't scan).\n3. For your lead pick, look outside the bot: get_news, forum_buzz (Reddit + StockTwits), and web search (if you have it)\n   for anything recent: earnings, analyst moves, why it moved today, risks. Search forums/Reddit too when useful.\n4. If the person asks about their own stocks, use my_portfolio. For the big picture use market_overview/market_movers.\n5. Call search_books at least once with the situation in plain words (e.g. \"buying after a fast run-up\",\n   \"holding a loser hoping it comes back\", \"everyone on Reddit is buying\") and use what the books say.\n6. Decide, applying the PLAYBOOK below. Prefer the best risk-adjusted idea, not the biggest mover. If the playbook\n   and a tool disagree, explain which rule wins and why.\n\nRULES FOR THE ANSWER\n- ALWAYS name at least one stock in picks: the single best idea right now, even if it's only WATCH. Give its real price\n  and the exact trigger to buy (a price level or condition from the tools). \"Nothing is a buy\" alone is never an answer.\n- Be honest about status: only call BUY/STRONG BUY when the evidence supports it (ideally the bot's status agrees).\n  If the market is weak, say so, and still name what to watch and what has to change.\n- Every number must come from a tool. Never invent a symbol, price, headline or company fact.\n- Forums and social posts are mood, not facts (SEC: rumors and pump-and-dumps spread there). Verify with news/data.\n- Say what could go wrong and what would cancel the idea. You can't trade; never claim a trade happened.\n- Plain words for a beginner: 'overheated' not RSI, 'sell line' not stop-loss, 'price swings' not volatility.\n\nPLAYBOOK (60 rules the bot follows, from Lefèvre, Butler, Harper, Selden, Gibson, Crump, Mackay and the SEC guides;\ncite rule numbers when they decide your answer):\n{playbook}\n\nReply with ONLY one JSON object, no markdown:\n{{\"verdict\":\"STRONG BUY|BUY|WATCH|HOLD|REDUCE|SELL|PASS|INFO\",\"headline\":\"one plain sentence (max 24 words) that answers\ndirectly, starting with 'You should…' or 'You shouldn't…' for decisions\",\"picks\":[{{\"symbol\":\"...\",\"verdict\":\"STRONG BUY|BUY|\nWATCH|HOLD|REDUCE|SELL|PASS\",\"why\":\"max 16 words\",\"buy_if\":\"exact trigger with a price, or '' if it's a buy now\"}}],\n\"reasons\":[\"2-4 bullets, max 18 words each, with real numbers from tools\"],\"outside_view\":\"what news/web/forums say, max 30\nwords, or ''\",\"next_step\":\"one concrete action, max 18 words\",\"caution\":\"one honest risk, or ''\",\"invalidation\":\"what would\ncancel this call, or ''\",\"confidence\":0-100,\"book_lesson\":\"the one lesson from the books/playbook that fits best, max 30\nwords, ending with the source like (Lefèvre ch. VII) or (Playbook rule 20)\",\"sources\":[{{\"title\":\"...\",\"url\":\"https://...\"}}]}}\npicks: 1-3 stocks (always at least 1, except pure how-to questions: verdict INFO). sources: 0-4 web pages you actually used.\"\"\"\n\n\ndef agent_system() -> str:\n    return AGENT_SYSTEM_BASE.format(playbook=playbook_rules() or \"(playbook.md missing: use common sense trend rules)\")\n\n\nAGENT_SYSTEM = agent_system()\n\n\ndef _tool_specs() -> list[dict]:\n    def fn(name, desc, props=None, req=None):\n        return {\"type\": \"function\", \"function\": {\"name\": name, \"description\": desc, \"parameters\": {\n            \"type\": \"object\", \"properties\": props or {}, \"required\": req or []}}}\n    sym = {\"symbol\": {\"type\": \"string\", \"description\": \"US stock ticker, e.g. NVDA\"}}\n    return [\n        fn(\"top_opportunities\", \"The bot's best-ranked stocks right now with status, confidence and what's missing.\",\n           {\"limit\": {\"type\": \"integer\"}}),\n        fn(\"get_stock\", \"Full fresh facts for one stock (any US ticker): price, trend, momentum, swings, the bot's \"\n                        \"status/confidence, buy checks, news mood, long-term stats.\", sym, [\"symbol\"]),\n        fn(\"get_news\", \"Latest headlines for one stock from Benzinga and Google News, with dates and sources.\",\n           sym, [\"symbol\"]),\n        fn(\"market_movers\", \"Today's top gainers, losers and most-traded US stocks (live).\"),\n        fn(\"my_portfolio\", \"The person's stocks (from Robinhood/holdings): buy price, shares, profit, bot status.\"),\n        fn(\"fundamentals\", \"Business numbers for one stock (P/E, analyst target, earnings beats) and social mood. \"\n                           \"Uses limited paid credits: call only when it matters.\", sym, [\"symbol\"]),\n        fn(\"market_overview\", \"Market health (S&P 500 vs its 200-day), market news, the person's rules and risk.\"),\n        fn(\"best_idea\", \"The bot's single best stock to buy or watch right now, with status, confidence, what it's \"\n                        \"missing and the exact trigger to buy.\"),\n        fn(\"forum_buzz\", \"What investing forums say about one stock: Reddit mention rank and 24h change, StockTwits \"\n                         \"bullish/bearish share, and a crowd-hype warning. Mood only, not facts.\", sym, [\"symbol\"]),\n        fn(\"reddit_trending\", \"The most-discussed stocks on Reddit's investing forums right now and which are rising \"\n                              \"fastest. Attention only: every idea still needs get_stock.\"),\n        fn(\"search_books\", \"Search the full text of the bot's library of classic market books (Lefèvre, Butler, Harper, \"\n                           \"Selden, Gibson, Crump, Mackay) for passages about a situation, e.g. 'averaging down a losing \"\n                           \"stock', 'selling at the top', 'tips', 'panic', 'news already discounted'.\",\n           {\"query\": {\"type\": \"string\", \"description\": \"what to look up, in plain words\"},\n            \"book\": {\"type\": \"string\", \"description\": \"optional: author or title to search only that book\"}}, [\"query\"]),\n    ]\n\n\nclass Agent:\n    def __init__(self, cfg, alp, state, knowledge, scan, budgets):\n        self.cfg, self.alp, self.state, self.k, self.scan, self.b = cfg, alp, state, knowledge, scan, budgets\n        self.used: list[str] = []\n        self.mkt = news_view(state, MARKET_KEY, scan[\"now_iso\"])\n\n    def _metrics(self, sym: str) -> Metrics | None:\n        sym = sym.upper().strip().lstrip(\"$\")\n        if sym in self.scan[\"allm\"]:\n            return self.scan[\"allm\"][sym]\n        try:\n            got = build_metrics(self.alp, [sym], self.scan[\"now_iso\"][:10], self.scan[\"is_open\"])\n        except ApiError:\n            return None\n        m = got.get(sym)\n        if m:\n            score_all(list(self.scan[\"ranked\"]) + [m])   # rank it against everything the bot scanned\n            self.scan[\"allm\"][sym] = m\n        return m\n\n    def _asm(self, m: Metrics) -> dict:\n        owned = m.symbol in {h.symbol for h in self.scan[\"holdings\"]}\n        return assess(m, self.cfg, self.scan[\"regime\"], news_view(self.state, m.symbol, self.scan[\"now_iso\"]),\n                      self.mkt, owned)\n\n    def top_opportunities(self, limit: int = 8):\n        rows = []\n        for m in self.scan[\"ranked\"]:\n            a = self._asm(m)\n            rows.append({\"symbol\": m.symbol, \"name\": company_name(m.symbol), \"status\": a[\"status\"],\n                         \"confidence\": a[\"conf\"], \"setup\": a[\"setup\"], \"price\": round(m.price, 2),\n                         \"today_pct\": round(m.day_chg_pct, 2), \"year_pct\": round(m.ret_12_1),\n                         \"missing\": a[\"fails\"][:3], \"daily_swing_pct\": round(m.atr_pct, 1)})\n        order = {s: i for i, s in enumerate(STATUSES)}\n        rows.sort(key=lambda r: (order.get(r[\"status\"], 9), -r[\"confidence\"]))\n        return {\"scan_time\": self.scan[\"now_iso\"][:16], \"market\": self.scan[\"regime_txt\"],\n                \"risk_setting\": self.cfg[\"risk_level\"], \"stocks\": rows[: max(1, min(int(limit or 8), 15))],\n                \"discovered_today\": knowledge_discovered(self.k)}\n\n    def get_stock(self, symbol: str):\n        m = self._metrics(symbol)\n        if not m:\n            return {\"error\": f\"No price history for {symbol}. It may not be a US-listed stock.\"}\n        a = self._asm(m)\n        nv = news_view(self.state, m.symbol, self.scan[\"now_iso\"])\n        st = long_stats(self.alp, self.k, m.symbol, self.scan[\"now_iso\"][:10])\n        return {\"symbol\": m.symbol, \"name\": company_name(m.symbol), \"price\": round(m.price, 2),\n                \"today_pct\": round(m.day_chg_pct, 2), \"year_pct\": round(m.ret_12_1), \"six_month_pct\": round(m.ret_6_1),\n                \"below_year_high_pct\": round(m.from_high_pct, 1),\n                \"trend\": (\"uptrend\" if m.price > m.sma50 > m.sma200 else \"mixed\" if m.price > m.sma200 else \"downtrend\"),\n                \"vs_20_day_avg_pct\": round(m.above_sma20_pct, 1), \"rsi\": round(m.rsi),\n                \"overheated\": m.rsi > self.cfg[\"rsi_max\"], \"daily_swing_pct\": round(m.atr_pct, 1),\n                \"big_bad_day_pct\": round(m.big_move_pct, 1), \"momentum_rank\": f\"{m.rank} of {m.of}\",\n                \"bot_status\": a[\"status\"], \"confidence\": a[\"conf\"], \"setup\": a[\"setup\"],\n                \"missing_for_buy\": a[\"fails\"], \"chart_view\": a[\"verdict\"],\n                \"news_mood\": nv.label or \"no major news\", \"news_headline\": nv.headline or \"\",\n                \"sell_line_if_bought_now\": round(m.price * (1 - self.cfg[\"stop_pct\"] / 100), 2),\n                \"long_term\": stats_line(st) if st else \"\"}\n\n    def get_news(self, symbol: str):\n        sym = symbol.upper().strip().lstrip(\"$\")\n        out = []\n        try:\n            start = (parse_ts(self.scan[\"now_iso\"]) - timedelta(days=5)).strftime(\"%Y-%m-%dT%H:%M:%SZ\")\n            for it in self.alp.news_for([sym], start, 8):\n                k = rate_headline(it.get(\"headline\") or \"\", it.get(\"summary\") or \"\")\n                out.append({\"date\": (it.get(\"created_at\") or \"\")[:10], \"source\": it.get(\"source\") or \"Benzinga\",\n                            \"headline\": (it.get(\"headline\") or \"\")[:160],\n                            \"mood\": \"good\" if k and k[0] > 0 else \"bad\" if k and k[0] < 0 else \"neutral\"})\n        except ApiError as e:\n            out.append({\"error\": f\"Benzinga news unavailable: {e}\"})\n        rs = get_research(sym, self.state, self.k, self.cfg, self.scan[\"now_iso\"])\n        for _, title, site in rs.top[:4]:\n            out.append({\"source\": site, \"headline\": title[:160]})\n        return {\"symbol\": sym, \"web_summary\": rs.line(), \"items\": out[:10]}\n\n    def market_movers(self):\n        try:\n            mv = self.alp.movers(10)\n            act = self.alp.most_actives(10)\n        except ApiError as e:\n            return {\"error\": f\"Screener unavailable: {e}\"}\n        f = lambda xs: [{\"symbol\": x.get(\"symbol\"), \"change_pct\": round(x.get(\"percent_change\") or 0, 1),\n                         \"price\": x.get(\"price\")} for x in (xs or [])[:8]]\n        return {\"gainers\": f(mv.get(\"gainers\")), \"losers\": f(mv.get(\"losers\")),\n                \"most_traded\": [x.get(\"symbol\") for x in act[:10]],\n                \"note\": \"Movers can be penny stocks or one-day spikes; check get_stock before suggesting any.\"}\n\n    def my_portfolio(self):\n        rows, total = [], 0.0\n        for h in self.scan[\"holdings\"]:\n            m = self._metrics(h.symbol)\n            if not m:\n                rows.append({\"symbol\": h.symbol, \"bought\": h.buy_price, \"note\": \"no price data\"}); continue\n            a = assess(m, self.cfg, self.scan[\"regime\"], news_view(self.state, h.symbol, self.scan[\"now_iso\"]),\n                       self.mkt, owned=True)\n            val = m.price * (h.shares or 0)\n            total += val\n            rows.append({\"symbol\": h.symbol, \"name\": company_name(h.symbol), \"bought\": h.buy_price, \"shares\": h.shares,\n                         \"price\": round(m.price, 2), \"gain_pct\": round((m.price / h.buy_price - 1) * 100, 2),\n                         \"profit_usd\": round((m.price - h.buy_price) * (h.shares or 0), 2), \"value_usd\": round(val, 2),\n                         \"bot_status\": a[\"status\"], \"chart_view\": a[\"verdict\"], \"source\": h.source})\n        for r in rows:\n            if total and r.get(\"value_usd\"):\n                r[\"share_of_portfolio_pct\"] = round(r[\"value_usd\"] / total * 100)\n        return {\"stocks\": rows, \"account_size_usd\": self.cfg[\"account_size\"],\n                \"note\": \"Only these are owned. Never assume they own anything else.\"}\n\n    def fundamentals(self, symbol: str):\n        sym = symbol.upper().strip().lstrip(\"$\")\n        today = self.scan[\"now_iso\"][:10]\n        out: dict = {\"symbol\": sym}\n        fu = av_fundamentals(self.b, self.k, sym, today)\n        if fu:\n            out[\"alpha_vantage\"] = fu\n        else:\n            fm = fd_metrics(self.b, sym)\n            if fm:\n                out[\"financial_datasets\"] = fm\n        soc = lunar_social(self.b, sym)\n        if soc:\n            out[\"social_mood\"] = soc\n        if len(out) == 1:\n            out[\"note\"] = \"No paid data connected or credits used up; rely on price, trend and news.\"\n        return out\n\n    def market_overview(self):\n        return {\"market\": self.scan[\"regime_txt\"], \"market_open\": self.scan[\"is_open\"],\n                \"market_news\": f\"{self.mkt.label}: {self.mkt.headline}\" if self.mkt.headline else \"no big market news\",\n                \"rules\": {k: self.cfg[k] for k in (\"stop_pct\", \"profit_pct\", \"risk_level\", \"account_size\",\n                                                     \"risk_per_trade_pct\", \"max_position_pct\")},\n                \"bot_track_record\": track_summary(self.k)}\n\n    def best_idea(self):\n        held = {h.symbol for h in self.scan[\"holdings\"]}\n        bi = best_idea(self.scan[\"ranked\"], self.cfg, self.scan[\"regime\"], self.state, self.scan[\"now_iso\"], held, self.mkt)\n        if not bi:\n            return {\"note\": \"The scan had no stocks to rank.\"}\n        m, a = bi\n        return {\"symbol\": m.symbol, \"name\": company_name(m.symbol), \"price\": round(m.price, 2), \"status\": a[\"status\"],\n                \"confidence\": a[\"conf\"], \"setup\": a[\"setup\"], \"buy_trigger\": a.get(\"trigger\", \"\"),\n                \"missing_for_buy\": a[\"fails\"][:4], \"strengths\": [w[2:] for w in a[\"why\"] if w.startswith(\"✓\")][:4],\n                \"momentum_rank\": f\"{m.rank} of {m.of}\", \"volume_vs_normal\": m.vol_ratio or None,\n                \"market\": self.scan[\"regime_txt\"]}\n\n    def forum_buzz(self, symbol: str):\n        fb = forum_buzz(symbol, self.k, self.scan[\"now_iso\"])\n        if not fb.get(\"reddit\") and not fb.get(\"stocktwits\"):\n            return {\"symbol\": symbol.upper(), \"note\": \"Forums had no data for this stock (or the sites were unreachable).\"}\n        return {k: v for k, v in fb.items() if k != \"when\"} | {\n            \"warning\": \"Forum posts are opinions. The SEC warns hype on forums can be a pump-and-dump.\"}\n\n    def reddit_trending(self):\n        rows = reddit_trending(self.k, self.scan[\"now_iso\"])\n        if not rows:\n            return {\"note\": \"Reddit data unavailable right now.\"}\n        return {\"most_discussed\": rows[:15], \"rising_fastest\": reddit_risers(self.k, self.scan[\"now_iso\"], 5),\n                \"warning\": \"Attention isn't a buy signal; check get_stock before suggesting any.\"}\n\n    def search_books(self, query: str, book: str = \"\"):\n        hits = search_library(query, 4, book)\n        if not hits:\n            st = library_status()\n            return {\"note\": \"No matching passages.\" if st[\"passages\"] else \"The library hasn't been downloaded yet.\"}\n        return {\"passages\": hits, \"how_to_use\": \"Apply the lesson to this situation and name the book and chapter.\"}\n\n    def run_tool(self, name: str, args: dict):\n        self.used.append(name + (f\"({args.get('symbol')})\" if args.get(\"symbol\") else \"\"))\n        try:\n            fn = getattr(self, name)\n            return fn(**{k: v for k, v in (args or {}).items() if k in (\"symbol\", \"limit\", \"query\", \"book\")})\n        except Exception as e:  # a broken tool must not sink the answer\n            return {\"error\": f\"{name} failed: {e}\"}\n\n\ndef knowledge_discovered(k: dict) -> list:\n    return [d[\"symbol\"] + \": \" + d[\"why\"] for d in (k.get(\"discovered\") or [])][:6]\n\n\ndef openai_problem(err: str) -> str:\n    \"\"\"Turn an OpenAI error into one plain sentence telling you what to fix.\"\"\"\n    e = err.lower()\n    if \"insufficient_quota\" in e or \"billing\" in e or \"exceeded your current quota\" in e:\n        return \"Your OpenAI account has no credit. Add a few dollars at platform.openai.com → Billing (ChatGPT Plus doesn't count).\"\n    if \"http 401\" in e or \"invalid_api_key\" in e or \"incorrect api key\" in e:\n        return \"OpenAI rejected the key. Make a new one at platform.openai.com/api-keys and replace the OPENAI_API_KEY GitHub secret.\"\n    if \"model\" in e and (\"not found\" in e or \"does not exist\" in e or \"model_not_found\" in e or \"access\" in e):\n        return \"This OpenAI account can't use the bot's ChatGPT model yet. Add credit, or change openai_model in config.json.\"\n    if \"http 429\" in e:\n        return \"OpenAI is rate-limiting this key right now. Try again in a minute.\"\n    if \"http 403\" in e:\n        return \"OpenAI blocked this key (project or region permissions). Check the key's project at platform.openai.com.\"\n    return \"ChatGPT failed: \" + err[:160]\n\n\nNO_TOOLS_NOTE = \"\\n\\nYou have no tools in this call: use the DATA in the message (fresh scan, best idea, forums).\"\n_FATAL = (\"HTTP 401\", \"HTTP 403\", \"insufficient_quota\", \"HTTP 429\")\n\n\ndef _ctx_for(agent: \"Agent\", question: str) -> dict:\n    ctx = {\"best_idea\": agent.best_idea(), \"top\": agent.top_opportunities(8), \"portfolio\": agent.my_portfolio(),\n           \"market\": agent.market_overview()}\n    for sym in _tickers(question)[:2]:\n        ctx[\"asked_\" + sym] = agent.get_stock(sym)\n    b = (ctx[\"best_idea\"] or {}).get(\"symbol\")\n    if b:\n        ctx[\"forums_\" + b] = agent.forum_buzz(b)\n    return ctx\n\n\ndef agent_openai(agent: Agent, question: str, cfg: dict, rounds: int = 6) -> str | None:\n    \"\"\"ChatGPT as the analyst. Tries, in order: Responses API with web search + the bot's tools, the same without\n    web search, Chat Completions with tools, then a no-tools answer from the scan data. Stops early on key/credit errors.\"\"\"\n    key = os.environ.get(\"OPENAI_API_KEY\", \"\").strip()\n    if not key:\n        agent.problem = \"The bot can't see an OPENAI_API_KEY secret. Add it under Stock-Alerts → Settings → Secrets → Actions (exact name).\"\n        return None\n    agent.sources = getattr(agent, \"sources\", [])\n    for attempt in (lambda: agent_openai_responses(agent, question, cfg, key, rounds, web=True),\n                    lambda: agent_openai_responses(agent, question, cfg, key, rounds, web=False),\n                    lambda: agent_openai_chat(agent, question, cfg, key, rounds),\n                    lambda: agent_openai_plain(agent, question, cfg)):\n        try:\n            text = attempt()\n        except ApiError as e:\n            print(f\"ChatGPT attempt failed: {e}\")\n            agent.problem = openai_problem(str(e))\n            if any(f in str(e) for f in _FATAL):\n                return None\n            continue\n        if text:\n            agent.problem = \"\"\n            return text\n    return None\n\n\ndef _resp_parse(r: dict, agent: \"Agent\") -> tuple[str, list[dict]]:\n    text, calls = [], []\n    for it in (r or {}).get(\"output\") or []:\n        t = it.get(\"type\")\n        if t == \"message\":\n            for c in it.get(\"content\") or []:\n                if c.get(\"type\") in (\"output_text\", \"text\"):\n                    text.append(c.get(\"text\") or \"\")\n                    for an in c.get(\"annotations\") or []:\n                        if an.get(\"type\") == \"url_citation\" and an.get(\"url\"):\n                            agent.sources.append({\"title\": (an.get(\"title\") or \"\")[:90], \"url\": an[\"url\"]})\n        elif t == \"function_call\":\n            calls.append(it)\n        elif t == \"web_search_call\":\n            q = ((it.get(\"action\") or {}).get(\"query\") or \"\")[:40]\n            agent.used.append(\"web search\" + (f\": {q}\" if q else \"\"))\n    return \"\".join(text).strip(), calls\n\n\ndef agent_openai_responses(agent: Agent, question: str, cfg: dict, key: str, rounds: int, web: bool) -> str | None:\n    tools = [{\"type\": \"function\", \"name\": t[\"function\"][\"name\"], \"description\": t[\"function\"][\"description\"],\n              \"parameters\": t[\"function\"][\"parameters\"]} for t in _tool_specs()]\n    if web:\n        tools.insert(0, {\"type\": \"web_search\"})\n    model, instructions = cfg.get(\"openai_model\", \"gpt-5.6-luna\"), agent_system()\n    inp: object = question[:700]\n    prev = None\n    for i in range(rounds):\n        body = {\"model\": model, \"instructions\": instructions, \"input\": inp, \"tools\": tools, \"max_output_tokens\": 6000}\n        if prev:\n            body[\"previous_response_id\"] = prev\n        if i == rounds - 1:\n            body[\"tool_choice\"] = \"none\"\n        r = http_json(\"POST\", OPENAI_RESPONSES_URL, {\"Authorization\": f\"Bearer {key}\"}, body=body, timeout=150)\n        text, calls = _resp_parse(r, agent)\n        if not calls:\n            return text or None\n        prev, outs = r.get(\"id\"), []\n        for n, c in enumerate(calls):\n            try:\n                args = json.loads(c.get(\"arguments\") or \"{}\")\n            except ValueError:\n                args = {}\n            res = agent.run_tool(c.get(\"name\", \"\"), args) if n < 8 else {\"error\": \"too many calls at once\"}\n            outs.append({\"type\": \"function_call_output\", \"call_id\": c.get(\"call_id\"), \"output\": json.dumps(res)[:8000]})\n        inp = outs\n    return None\n\n\ndef agent_openai_chat(agent: Agent, question: str, cfg: dict, key: str, rounds: int) -> str | None:\n    msgs = [{\"role\": \"system\", \"content\": agent_system()}, {\"role\": \"user\", \"content\": question[:700]}]\n    tools = _tool_specs()\n    for i in range(rounds):\n        body = {\"model\": cfg.get(\"openai_model\", \"gpt-5.6-luna\"), \"max_completion_tokens\": 5000, \"messages\": msgs,\n                \"tools\": tools}\n        if i == rounds - 1:\n            body[\"tool_choice\"] = \"none\"\n        r = http_json(\"POST\", OPENAI_URL, {\"Authorization\": f\"Bearer {key}\"}, body=body, timeout=120)\n        msg = ((r or {}).get(\"choices\") or [{}])[0].get(\"message\") or {}\n        calls = msg.get(\"tool_calls\") or []\n        if not calls:\n            return msg.get(\"content\") or None\n        msgs.append({\"role\": \"assistant\", \"content\": msg.get(\"content\") or \"\", \"tool_calls\": calls})\n        for c in calls:\n            try:\n                args = json.loads((c.get(\"function\") or {}).get(\"arguments\") or \"{}\")\n            except ValueError:\n                args = {}\n            res = agent.run_tool((c.get(\"function\") or {}).get(\"name\", \"\"), args)\n            msgs.append({\"role\": \"tool\", \"tool_call_id\": c.get(\"id\"), \"content\": json.dumps(res)[:8000]})\n    return None\n\n\ndef agent_openai_plain(agent: Agent, question: str, cfg: dict) -> str | None:\n    \"\"\"Backup: ChatGPT with no tools, given the fresh scan's facts up front. Tries a second model if needed.\"\"\"\n    key = os.environ.get(\"OPENAI_API_KEY\", \"\").strip()\n    ctx = _ctx_for(agent, question)\n    agent.used.append(\"scan data\")\n    err = None\n    for model in dict.fromkeys([cfg.get(\"openai_model\", \"gpt-5.6-luna\"), \"gpt-5.6-terra\"]):\n        try:\n            r = http_json(\"POST\", OPENAI_URL, {\"Authorization\": f\"Bearer {key}\"}, timeout=120,\n                          body={\"model\": model, \"max_completion_tokens\": 5000,\n                                \"messages\": [{\"role\": \"system\", \"content\": agent_system() + NO_TOOLS_NOTE},\n                                             {\"role\": \"user\", \"content\": question[:700] + \"\\n\\nDATA:\\n\" + json.dumps(ctx)[:16000]}]})\n            text = (((r or {}).get(\"choices\") or [{}])[0].get(\"message\") or {}).get(\"content\")\n            if text:\n                return text\n        except ApiError as e:\n            print(f\"ChatGPT ({model}, no tools) failed: {e}\")\n            err = e\n            if any(f in str(e) for f in _FATAL):\n                break\n    if err:\n        raise err\n    return None\n\n\ndef agent_claude(agent: Agent, question: str, cfg: dict) -> str | None:\n    \"\"\"Extra help only: Opus 5.5, low effort, given the same tool results up front.\"\"\"\n    if not os.environ.get(\"ANTHROPIC_API_KEY\"):\n        return None\n    ctx = _ctx_for(agent, question)\n    agent.used.append(\"context\")\n    return ask_claude(agent_system() + NO_TOOLS_NOTE, question[:700] + \"\\n\\nDATA:\\n\" + json.dumps(ctx)[:14000], cfg, 2500)\n\n\ndef parse_ai_json(text: str | None) -> dict | None:\n    if not text:\n        return None\n    t = text.replace(\"```json\", \"\").replace(\"```\", \"\")\n    try:\n        o = json.loads(t[t.index(\"{\"): t.rindex(\"}\") + 1])\n        return o if isinstance(o, dict) and o.get(\"headline\") else None\n    except ValueError:\n        return None\n\n\ndef cmd_ai(cfg, args):\n    question = (args.text or os.environ.get(\"BOT_REQUEST\", \"\")).strip()[:900]\n    rid = re.sub(r\"[^A-Za-z0-9_-]\", \"\", os.environ.get(\"BOT_RID\", \"\")) or datetime.now(timezone.utc).strftime(\"%H%M%S\")\n    alp = Alpaca.from_env(cfg[\"data_feed\"])\n    state, knowledge = load_state(), load_knowledge()\n    scan = load_scan_cache(Path(args.cache)) if args.cache else None\n    if not scan:  # no scan step before this: run one now (quietly)\n        out: dict = {}\n        holdings, _ = load_holdings()\n        clock = alp.clock()\n        broker, notices = sync_broker(SnapTrade.from_env(), cfg, state, clock[\"timestamp\"])\n        run_scan(cfg, alp, PrintNotifier(), merge_holdings(holdings, broker), state, now_override=clock, force=True,\n                 knowledge=knowledge, write_files=False, announce=False, out=out)\n        scan = out\n    budgets = Budgets(knowledge, cfg, scan[\"now_iso\"])\n    if not os.environ.get(\"NEONTAPE_OFFLINE\"):\n        ensure_library()   # first time only: download the books (a few seconds), then they live in the repo\n    agent = Agent(cfg, alp, state, knowledge, scan, budgets)\n    agent.problem = \"\"\n    by, text = \"ChatGPT\", None\n    ask = question\n    if question:\n        text = agent_openai(agent, ask, cfg)\n        if not parse_ai_json(text):\n            text2 = agent_claude(agent, ask, cfg)\n            if text2:\n                by, text = \"Claude\", text2\n    data = parse_ai_json(text)\n    bi = agent.best_idea() if question else {}\n    bpick = ({\"symbol\": bi[\"symbol\"], \"verdict\": bi[\"status\"], \"why\": \"the bot's top-ranked idea in this scan\",\n              \"buy_if\": bi.get(\"buy_trigger\", \"\")} if bi.get(\"symbol\") else None)\n    pickish = re.search(r\"\\b(buy|stock|pick|invest|which|what should|recommend|best|idea|trade|money)\\b\", question, re.I)\n    if not question:\n        data = {\"verdict\": \"INFO\", \"headline\": \"No question was sent.\", \"picks\": [], \"reasons\": []}\n    elif not data:\n        # The AI failed: still answer with the bot's own best idea, and say plainly what went wrong.\n        data = {\"verdict\": bi.get(\"status\", \"INFO\") if bpick else \"INFO\", \"picks\": [bpick] if bpick else [],\n                \"headline\": (f\"ChatGPT couldn't answer, so here's the bot's own pick: {bi['symbol']}, \"\n                             f\"{bi['status'].title()} {bi['confidence']}/100.\" if bpick else\n                             \"ChatGPT couldn't answer: \" + (agent.problem or \"no reply came back. Try again.\")),\n                \"reasons\": [x for x in (bi.get(\"strengths\") or [])[:3]] if bpick else [],\n                \"next_step\": (bi.get(\"buy_trigger\") or \"Wait for a clean setup.\") if bpick else \"Fix that, then ask again.\",\n                \"caution\": \"AI problem: \" + (agent.problem or \"no reply came back.\") if bpick else \"\",\n                \"confidence\": bi.get(\"confidence\") if bpick else None}\n        by = \"Neon Tape\"\n    elif bpick and not data.get(\"picks\") and (pickish or data.get(\"verdict\") != \"INFO\"):\n        data[\"picks\"] = [bpick]   # always at least one stock to consider\n    if data and question:\n        seen, srcs = set(), []\n        for x in list(data.get(\"sources\") or []) + list(getattr(agent, \"sources\", [])):\n            u = (x or {}).get(\"url\", \"\") if isinstance(x, dict) else \"\"\n            if u.startswith(\"http\") and u not in seen:\n                seen.add(u); srcs.append({\"title\": (x.get(\"title\") or u)[:90], \"url\": u})\n        data[\"sources\"] = srcs[:4]\n    answer = {\"rid\": rid, \"q\": question, \"t\": scan[\"now_iso\"][:16], \"by\": by, \"tools\": agent.used[:20],\n              \"data\": data, \"text\": None if data else (text or \"\")[:3000], \"market\": scan[\"regime_txt\"]}\n    d = HERE / \"app\" / \"answers\"\n    d.mkdir(parents=True, exist_ok=True)\n    (d / f\"{rid}.json\").write_text(json.dumps(answer), encoding=\"utf-8\")\n    for f in sorted(d.glob(\"*.json\"), key=lambda p: p.stat().st_mtime)[:-12]:\n        f.unlink()\n    log = knowledge.setdefault(\"requests\", [])\n    log.append({\"t\": scan[\"now_iso\"][:16], \"text\": question, \"did\": [f\"AI ({by}): \" + ((data or {}).get(\"headline\") or \"\")[:120]]})\n    knowledge[\"requests\"] = log[-40:]\n    save_knowledge(knowledge)\n    save_state(state)\n    po = Pushover.from_env(cfg)\n    if po and question:\n        hd = (data or {}).get(\"headline\") or (text or \"\")[:120]\n        lines = [f\"{p.get('symbol')}: {p.get('verdict')} ({p.get('why', '')})\" + (f\" Buy if {p['buy_if']}\" if p.get(\"buy_if\") else \"\")\n                 for p in (data or {}).get(\"picks\", [])[:3]]\n        lines += [f\"• {r}\" for r in (data or {}).get(\"reasons\", [])[:3]]\n        if (data or {}).get(\"next_step\"):\n            lines.append(\"Next: \" + data[\"next_step\"])\n        if (data or {}).get(\"invalidation\"):\n            lines.append(\"Cancelled if: \" + data[\"invalidation\"])\n        if (data or {}).get(\"book_lesson\"):\n            lines.append(\"📚 \" + data[\"book_lesson\"])\n        lines.append(f\"Fresh scan {scan['now_iso'][11:16]} ET • answered by {by} • not financial advice\")\n        po.send(Alert(f\"ai:{rid}\", \"reply\", \"🤖 \" + hd[:100], compose(f\"You asked: {question[:120]}\", lines)[:1020], 0,\n                      color=COLORS[\"info\"], url=app_link(cfg, \"home\"), url_title=\"Open Neon Tape\"))\n    print(json.dumps(answer, indent=1)[:2000])\n\n\ndef cmd_backtest(cfg, args):\n    alp = Alpaca.from_env(cfg[\"data_feed\"])\n    symbols = sorted(set(cfg[\"universe\"]) | {MARKET})\n    start = date.today() - timedelta(days=int(365.25 * args.years) + 420)\n    print(f\"Downloading {len(symbols)} stocks, {args.years:g} years...\")\n    data = alp.daily_bars(symbols, start)\n    stats = run_backtest(cfg, data, args.max_days)\n    spy = data.get(MARKET, [])\n    print_backtest(stats, spy[MIN_HISTORY][\"t\"][:10] if len(spy) > MIN_HISTORY else \"?\",\n                   spy[-1][\"t\"][:10] if spy else \"?\", args.max_days)\n\n\ndef cmd_library(cfg, args):\n    if args.refresh or not args.query:\n        got = ensure_library(force=args.refresh)\n        print(f\"Library: {len(got)} of {len(LIBRARY)} books, {library_status()['passages']} passages.\")\n    if args.query:\n        for h in search_library(args.query, 4):\n            print(f\"\\n{h['book']} ({h['author']}, {h['year']}) {h['chapter']}\\n  {h['passage'][:500]}…\")\n\n\ndef main(argv=None):\n    p = argparse.ArgumentParser(description=\"Stock Alerts scanner\")\n    p.add_argument(\"--config\", type=Path)\n    sub = p.add_subparsers(dest=\"cmd\", required=True)\n    s = sub.add_parser(\"scan\"); s.add_argument(\"--dry-run\", action=\"store_true\")\n    s.add_argument(\"--force\", action=\"store_true\", help=\"run even if the market is closed\")\n    s.add_argument(\"--quiet\", action=\"store_true\", help=\"no '📡 Scan done' summary\")\n    s.add_argument(\"--cache\", help=\"save this scan's numbers for the AI step\")\n    ai = sub.add_parser(\"ai\", help=\"answer a question (BOT_REQUEST) with a fresh scan + ChatGPT tools\")\n    ai.add_argument(\"text\", nargs=\"?\", default=\"\")\n    ai.add_argument(\"--cache\", help=\"numbers from the scan step\")\n    r = sub.add_parser(\"report\"); r.add_argument(\"--top\", type=int, default=25)\n    t = sub.add_parser(\"test-alert\"); t.add_argument(\"--all\", action=\"store_true\")\n    a = sub.add_parser(\"ask\", help=\"do what a plain-English request says (text or BOT_REQUEST env)\")\n    a.add_argument(\"text\", nargs=\"?\", default=\"\")\n    lb = sub.add_parser(\"library\", help=\"download/refresh the book library, or search it\")\n    lb.add_argument(\"query\", nargs=\"?\", default=\"\")\n    lb.add_argument(\"--refresh\", action=\"store_true\")\n    b = sub.add_parser(\"backtest\"); b.add_argument(\"--years\", type=float, default=5)\n    b.add_argument(\"--max-days\", type=int, default=20)\n    args = p.parse_args(argv)\n    cfg = load_config(args.config)\n    try:\n        {\"scan\": cmd_scan, \"report\": cmd_report, \"test-alert\": cmd_test_alert,\n         \"backtest\": cmd_backtest, \"ask\": cmd_ask, \"ai\": cmd_ai, \"library\": cmd_library}[args.cmd](cfg, args)\n    except ApiError as e:\n        sys.exit(f\"Error: {e}\")\n\n\nif __name__ == \"__main__\":\n    main()\n", "test_scanner.py": "\"\"\"Offline tests. Run: python -m unittest test_scanner -v\"\"\"\nimport os; os.environ.setdefault(\"NEONTAPE_OFFLINE\", \"1\")  # tests never call real forum sites\nimport json\nimport math\nimport os\nimport random\nimport tempfile\nimport threading\nimport unittest\nfrom datetime import date, timedelta\nfrom http.server import BaseHTTPRequestHandler, HTTPServer\nfrom pathlib import Path\nfrom urllib.parse import parse_qs, urlparse\n\nimport scanner as S\n\n\ndef make_bars(closes, start=date(2023, 1, 2), wiggle=0.005, seed=1):\n    rng = random.Random(seed)\n    out, d, prev = [], start, closes[0]\n    for c in closes:\n        while d.weekday() >= 5:\n            d += timedelta(days=1)\n        o = prev\n        hi = max(o, c) * (1 + abs(rng.gauss(0, wiggle)))\n        lo = min(o, c) * (1 - abs(rng.gauss(0, wiggle)))\n        out.append({\"t\": f\"{d.isoformat()}T05:00:00Z\", \"o\": o, \"h\": hi, \"l\": lo, \"c\": c, \"v\": 1000})\n        prev, d = c, d + timedelta(days=1)\n    return out\n\n\ndef trend(n, start=100.0, daily=0.001, noise=0.0, seed=0):\n    rng = random.Random(seed)\n    p, out = start, []\n    for _ in range(n):\n        p *= math.exp(daily + rng.gauss(0, noise)); out.append(p)\n    return out\n\n\nCFG = S.load_config(Path(S.__file__).parent / \"config.json\")\
