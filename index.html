      const r = await gh(repoPath() + "/actions/runs?event=workflow_dispatch&per_page=5");
      // the first run newer than the one before we asked (no clock comparisons: phone clocks drift)
      const run = (r.workflow_runs || []).filter(x => x.id > (job.after || 0)).pop();
      const age = (Date.now() - Date.parse(job.since)) / 1000;
      if (run && !job.runId) { job.runId = run.id; store.set("job", job); }
      if (run && job.kind === "ai" && run.status !== "completed") {
        // real progress: the workflow's own steps (Fresh scan → Ask AI)
        try {
          const js = await gh(repoPath() + "/actions/runs/" + run.id + "/jobs");
          const steps = ((js.jobs || [])[0] || {}).steps || [];
          const cur = steps.find(x => x.status === "in_progress");

const LIMITS = { stop_pct: [0.6, 20], profit_pct: [0.5, 50], account_size: [1, 1e6], max_buy_alerts_per_day: [0, 10] };

function parseAsk(text) {

  if (/\b(resume|unpause|unmute|start) (all )?(alerts|notifications)\b/.test(low)) acts.push({ set: "paused", value: false });

  if ((v = num(/\b(?:target|take[- ]profit|profit|sell offer)\s*(?:to|at|=|is)?\s*\+?(\d+(?:\.\d+)?)\s*%/))) acts.push({ set: "profit_pct", value: +v });
  if ((v = num(/\brisk\s*(?:to|level)?\s*(?:to\s*)?(low|moderate|medium|high|speculative|spec|any|aggressive)\b/))) acts.push({ set: "risk_level", value: { medium: "moderate", any: "speculative", spec: "speculative", aggressive: "high" }[v] || v });

const norm = t => t.toLowerCase().replace(/[^a-z0-9& ]+/g, " ").replace(/\s+/g, " ").trim();

  const rows = await loadNames();

  const exact = rows.filter(r => norm(r[1]) === n);

  const loose = pref.length ? pref : n.length >= 4 ? rows.filter(r => norm(r[1]).startsWith(n)) : [];
  if (loose.length) {

/* Ask the bot's AI on GitHub: fresh scan → ChatGPT with tools → answer saved + notification */
async function askAI(text, followUp) {
  if (!followUp) aiThread = [];
  if (job) { aiSheet(); return toast("Still working on your last request", true); }
  aiThread.push({ role: "user", content: text });
  if (secretsHave && !secretsHave.includes("OPENAI_API_KEY") && !secretsHave.includes("ANTHROPIC_API_KEY")) {
    aiThread.push({ role: "assistant", error: true, fix: "setup", content: "No AI is connected to your bot yet. Add OPENAI_API_KEY as a GitHub secret (Settings → ChatGPT shows how)." });
    return aiSheet();
  }
  // follow-ups carry a short memory of the conversation
  const prev = aiThread.slice(0, -1).filter(m => !m.error).slice(-4).map(m => m.role === "user" ? "Q: " + m.content : "A: " + ((m.data && m.data.headline) || m.content || "").slice(0, 160)).join("\n");
  const request = (prev ? "Earlier in this chat:\n" + prev + "\n\nNow: " : "") + text;
  const rid = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  aiSheet();
  const ok = await startJob("ai", request.slice(0, 900), "AI: " + text.slice(0, 30), rid);
  if (!ok) { aiThread.push({ role: "assistant", error: true, content: "Couldn't start the AI on GitHub. Check your connection, or Settings → GitHub." }); }
  aiSheet();
}
async function finishAI(j, ok) {
  job = null; store.del("job");
  let ans = null;
  for (let i = 0; i < 4 && !ans; i++) {   // the answer file is committed right after the run
    try { ans = JSON.parse(await gh(cpath("app/answers/" + j.rid + ".json"), { raw: true })); }
    catch (e) { await new Promise(r => setTimeout(r, 2000)); }
  }
  if (ans) {
    aiThread.push({ role: "assistant", by: ans.by, data: ans.data, content: ans.text || (ans.data && ans.data.headline) || "", tools: ans.tools, t: ans.t });
    if (ans.data) store.set("lastAI", { q: ans.q.split("Now: ").pop(), a: ans.data.headline, v: ans.data.verdict });
  } else {
    aiThread.push({ role: "assistant", error: true, content: ok ? "The AI finished but its answer didn't load. Pull to refresh in a moment; it was also sent as a notification." : "The AI run failed on GitHub. Open Settings → GitHub → Bot runs to see why." });
  }
  await load(true);
  if (aiOpen() || ans) aiSheet();
}

function parseHoldings(text) {
  const out = [];
  (text || "").split("\n").forEach((raw, i) => {
    const line = raw.split("#")[0].trim(); if (!line) return;
    const p = line.replace(/,/g, "").split(/\s+/);
    const price = parseFloat((p[1] || "").replace("$", ""));
    if (!p[0] || !(price > 0)) return;
    let bought = "", shares = null;
    p.slice(2).forEach(x => { if (/^\d{4}-\d\d-\d\d$/.test(x)) bought = x; else if (+x > 0) shares = +x; });
    out.push({ symbol: p[0].toUpperCase(), buy: price, bought, shares, line: i, src: "manual" });
  });
  return out;
}

let sparkN = 0;
function spark(vals, opts = {}) {
  vals = (vals || []).filter(v => v > 0);

  const w = opts.w || 300, h = opts.h || 64, pad = 3;
  const lines = (opts.lines || []).filter(l => l && l.v > 0);

  const X = i => pad + i * (w - 2 * pad) / (vals.length - 1), Y = v => pad + (hi - v) * (h - 2 * pad) / (hi - lo);
  const pts = vals.map((v, i) => X(i).toFixed(1) + "," + Y(v).toFixed(1));
  const up = vals[vals.length - 1] >= vals[0];
  const col = opts.color || (up ? "var(--up)" : "var(--down)");

    lines.map(l => '<line x1="0" x2="' + w + '" y1="' + Y(l.v).toFixed(1) + '" y2="' + Y(l.v).toFixed(1) + '" stroke="' + l.c + '" stroke-width="1" stroke-dasharray="4 4" vector-effect="non-scaling-stroke" opacity=".8"/>').join("") +

/* ---------- install / update the bot ---------- */
let installing = false;
async function install(quiet) {
  if (installing) return; installing = true;
  const BOT = JSON.parse(document.getElementById("botfiles").textContent);
  const files = Object.entries(BOT);
  let done = 0, changed = 0;
  const bar = () => $("#instprog"), txt = () => $("#insttext");
  try {
    const mark = await readFile("app/botbuild.json");
    let remote = 0; try { remote = JSON.parse(mark.text || "{}").build || 0; } catch (e) {}
    if (remote > BOT_BUILD) {   // a newer Neon Tape already installed the bot: update this app instead of downgrading the bot
      if (txt()) txt().textContent = "Your bot is newer than this copy of the app. Updating the app…";
      conf.installed = true; conf.botVersion = BOT_VERSION; store.set("conf", conf);
      lastUpdateCheck = 0; checkAppUpdate(); return;
    }
    for (const [path, content] of files) {
      if (txt()) txt().textContent = "Uploading " + path + "…";
      const cur = await readFile(path);
      if (KEEP.has(path)) {
        if (cur.text == null) {
          let body = content;
          if (path === "config.json") { const j = JSON.parse(content); j.holdings_edit_url = appUrl() + "#log-{symbol}-{price}"; j.app_url = appUrl(); body = JSON.stringify(j, null, 2) + "\n"; }
          await writeFile(path, body, null, "Add " + path); changed++;
        }
      } else if (cur.text !== content) {
        await writeFile(path, content, cur.sha, (cur.sha ? "Update " : "Add ") + path); changed++;
      }
      done++; if (bar()) bar().style.width = (done / files.length * 100) + "%";
    }
    if (remote !== BOT_BUILD) await writeFile("app/botbuild.json", JSON.stringify({ build: BOT_BUILD, version: BOT_VERSION }) + "\n", mark.sha, "Bot build " + BOT_VERSION);
    conf.installed = true; conf.botVersion = BOT_VERSION; store.set("conf", conf);
    if (txt()) txt().textContent = "Bot is up to date (" + changed + " file(s) changed).";
    if (!quiet || changed) toast(changed ? "Bot updated" : "Bot is up to date");
    render();
  } catch (e) { if (txt()) txt().textContent = e.message; toast(e.message, true); }
  finally { installing = false; }
}
async function checkSecrets(quiet) {
  try {
    const r = await gh(repoPath() + "/actions/secrets?per_page=100");
    secretsHave = (r.secrets || []).map(s => s.name); store.set("secretsHave", secretsHave);
    const missing = SECRETS_REQ.filter(s => !secretsHave.includes(s));
    conf.secrets = !missing.length; store.set("conf", conf);
    if (!quiet) toast(missing.length ? "Still missing: " + missing.join(", ") : "All required keys are in");
    render();
  } catch (e) { if (!quiet) toast(e.message, true); }
}

function mdToHtml(md) {
  md = md.replace(/^---[\s\S]*?---\s*/, "");
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>")
    .replace(/\[\[(.+?)\]\]/g, (m, n) => '<a href="#" data-note="' + n + '">' + n + "</a>")
    .replace(/\[(.+?)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  let out = "", inList = false;
  md.split("\n").forEach(l => {
    const m = l.match(/^(#{1,3})\s+(.*)/), li = l.match(/^\s*[-*]\s+(.*)/);
    if (!li && inList) { out += "</ul>"; inList = false; }
    if (m) out += "<h" + m[1].length + ">" + inline(m[2]) + "</h" + m[1].length + ">";
    else if (li) { if (!inList) { out += "<ul>"; inList = true; } out += "<li>" + inline(li[1]) + "</li>"; }
    else if (l.trim()) out += "<p>" + inline(l) + "</p>";
  });
  return out + (inList ? "</ul>" : "");
}

      store.set("conf", conf) || toast("Couldn't save the key on this phone.", true);
      toast("Connected to " + owner + "/" + repo); render(); load(true);
    } catch (e) {
      conf = prev;
      const msg = e.status === 404 ? "This key can't see " + owner + "/" + repo + ". On GitHub, open the token → Repository access → make sure it's set to Only select repositories → " + repo + "."
        : e.status === 401 ? "GitHub rejected this key. Make sure you copied the whole token (it starts with github_pat_)." : e.message;
      let el = $("#connecterr"); if (!el) { el = document.createElement("p"); el.id = "connecterr"; el.className = "ferr"; f.appendChild(el); }
      el.textContent = msg; toast(e.status === 404 ? "This key can't see the repo" : e.message, true);
    }
  });
  const a = $("#askform");
  if (a) a.addEventListener("submit", ev => {
    ev.preventDefault();
    const q = a.q.value.trim(); if (!q) return a.q.focus();
    a.q.blur(); a.q.value = ""; tellBot(q);
  });
}
function go(t) { tab = t; if (location.hash !== "#" + t) history.replaceState(null, "", "#" + t); render(); window.scrollTo(0, 0); }

document.querySelector("nav.tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) go(b.dataset.tab); });
$("#refresh").addEventListener("click", () => conf ? load() : toast("Connect your bot first (Bot tab)", true));
document.addEventListener("click", e => {
  const t = e.target;
  const card = t.closest(".al");
  if (card && !t.closest("a,button")) { card.classList.toggle("open"); return; }
  const q = t.closest("[data-q]");
  if (q) {
    const k = q.dataset.q;
    if (k === "scan") return startJob("scan-now", "", "Scanning the market");
    if (k === "test") return startJob("test-alert", "", "Sending test alerts");
    if (k === "help") return helpSheet();
    if (k.startsWith("fill:")) { closeSheet(); if (tab !== "home") go("home"); const i = $("#askform input"); if (i) { i.value = k.slice(5); i.focus(); } return; }
    if (k.startsWith("ask:")) { closeSheet(); return tellBot(k.slice(4)); }
  }
  if (t.closest("[data-stopjob]")) return stopJob();
  if (t.closest("[data-closesheet]")) return closeSheet();
  if (t.closest("[data-reopen]")) return aiSheet();
  const fu = t.closest("[data-followup]"); if (fu) return askAI(fu.dataset.followup, true);
  if (t.closest("[data-go-ai]")) { closeSheet(); openRows.add("chatgpt"); go("bot"); return; }
  const rg = t.closest("[data-range]");
  if (rg) { const box = rg.closest(".bigchart"); store.set("range", +rg.dataset.range); box.outerHTML = chartBlock(JSON.parse(box.dataset.hist), JSON.parse(box.dataset.lines), +rg.dataset.range); return; }
  const ch = t.closest("[data-chart]"); if (ch) return openChart(ch.dataset.chart);
  const ck = t.closest("[data-check]"); if (ck) return quickCheck(ck.dataset.check);
  const lv = t.closest("[data-live]"); if (lv) { closeSheet(); return startJob("ask", "check " + lv.dataset.live, "Live check: " + lv.dataset.live); }
  const ai = t.closest("[data-ai]"); if (ai) return askAI(ai.dataset.ai);
  const fb = t.closest("[data-filter]"); if (fb) { alertFilter = fb.dataset.filter; render(); return; }
  const gt = t.closest("[data-go]"); if (gt) return go(gt.dataset.go);
  const sd = t.closest("[data-sold]"); if (sd) return soldSheet(+sd.dataset.sold);
  const nt = t.closest("[data-note]"); if (nt) { e.preventDefault(); return openNote("vault/Stocks/" + nt.dataset.note + ".md"); }
  const np = t.closest("[data-path]"); if (np) return openNote(np.dataset.path);
  const sg = t.closest(".seg button"); if (sg) { store.set(sg.parentElement.dataset.seg, sg.dataset.v); applyLook(); render(); return; }
  const act = t.closest("[data-act]"); if (!act) return;
  const a = act.dataset.act;
  if (a === "log") return logSheet();
  if (a === "install") return install();
  if (a === "checksecrets") return checkSecrets();
  if (a === "settings") return settingsSheet();
  if (a === "notes") return notesSheet();
  if (a === "update") { e.preventDefault(); return checkAppUpdate(true); }
  if (a === "disconnect") { store.del("conf"); store.del("cache"); conf = null; dash = null; toast("Disconnected"); return render(); }
});

function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const m = h.match(/^log-([A-Za-z.]+)-([\d.]+)$/);
  if (m) { tab = "stocks"; render(); setTimeout(() => logSheet(m[1].toUpperCase(), m[2]), 250); return; }
  if (h === "alerts") tab = "home";
  else if (["home", "stocks", "ideas", "bot"].includes(h)) tab = h;
  render();
}
window.addEventListener("hashchange", route);
// Refresh only when you come back to the app, plus every 3 minutes while it's on screen.
document.addEventListener("visibilitychange", () => { if (!document.hidden) { load(true); followJob(); checkAppUpdate(); } else clearTimeout(jobTimer); });
setInterval(() => { if (!document.hidden) load(true); }, 180000);

/* ---------- keep the bot on GitHub matching this app (and repair it if anything changed it) ---------- */
async function botHealth() {
  try {
    // 1. If the website has a newer app, update the app first. Never push old bot files.
    const t = await (await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" })).text();
    const m = t.match(/const BOT_VERSION = "(\w+)"/);
    if (m && m[1] !== BOT_VERSION) return;   // the normal update check reloads the app
  } catch (e) { return; }   // offline: do nothing
  try {
    // 2. Cheap check: does GitHub's scanner.py match the one this app ships?
    const list = await gh(repoPath() + "/contents/");
    const f = (list || []).find(x => x.path === "scanner.py");
    if (conf.botVersion !== BOT_VERSION || !f || f.sha !== SCANNER_SHA) install(true);
  } catch (e) {}
}

/* ---------- the app updates itself: compares its build with the live site ---------- */
let lastUpdateCheck = 0;
async function checkAppUpdate(manual) {
  if (!manual && Date.now() - lastUpdateCheck < 10 * 60000) return;
  lastUpdateCheck = Date.now();
  try {
    const t = await (await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" })).text();
    const m = t.match(/const BOT_VERSION = "(\w+)"/);
    if (!m || m[1] === BOT_VERSION) { if (manual) toast("You're on the newest version"); return; }
    if (!manual && store.get("updateTried") === m[1]) return;   // don't loop if the phone keeps an old copy
    store.set("updateTried", m[1]);
    toast("Updating Neon Tape…");
    setTimeout(() => location.replace(location.pathname + "?v=" + m[1] + location.hash), 700);
  } catch (e) { if (manual) toast("Couldn't check for updates. Are you online?", true); }
}

(function boot() {
  applyLook();
  const cache = store.get("cache", null);
  if (cache) { dash = cache.dash; holdings = { text: cache.holdingsText }; }
  route();
  if (conf) {
    load(true);
    if (job) followJob();
    // Keep the bot on GitHub up to date with this app, automatically
    if (conf.installed) setTimeout(botHealth, 1500);
    if (conf.installed && !secretsHave) checkSecrets(true);
  }
  setTimeout(checkAppUpdate, 2500);
})();
</script>
