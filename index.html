on\"}\n        self.assertIsNone(S.rate_with_claude([{\"id\": \"1\", \"symbols\": [\"X\"], \"headline\": \"h\", \"summary\": \"\"}], CFG))\n\n    def test_no_key_no_call(self):\n        os.environ.pop(\"ANTHROPIC_API_KEY\")\n        self.assertIsNone(S.rate_with_claude([{\"id\": \"1\", \"symbols\": [\"X\"], \"headline\": \"h\", \"summary\": \"\"}], CFG))\n        self.assertIsNone(S.ai_horizon(mk(), None, CFG))\n        self.assertEqual(Fake.claude_calls, [])\n\n    def test_ai_horizon(self):\n        Fake.world = {\"claude_reply\": 'Forums are hyped. {\"horizon\":\"short-term\",\"hold_for\":\"about 1 week\",'\n                                      '\"why\":\"hype-driven pop\",\"forum_mood\":\"bullish\",\"risks\":\"fades fast\"}'}\n        hz = S.ai_horizon(mk(), None, CFG)\n        self.assertEqual(hz[\"horizon\"], \"SHORT-TERM\")\n        self.assertEqual(hz[\"forum_mood\"], \"bullish\")\n        body = Fake.claude_calls[0]\n        self.assertEqual(body[\"tools\"][0][\"type\"], CFG[\"web_search_tool\"])\n        self.assertEqual(body[\"tools\"][0][\"max_uses\"], 2)\n        a = S.buy_alert(mk(), CFG, None, hz)\n        self.assertIn(\"Short-term hold: about 1 week\", a.message.split(\"\\n\")[0])\n        self.assertIn(\"Forum mood: bullish\", a.message)\n\n    def test_ai_horizon_bad_answer(self):\n        Fake.world = {\"claude_reply\": '{\"horizon\":\"forever\"}'}\n        self.assertIsNone(S.ai_horizon(mk(), None, CFG))\n\n\ndef news_item(i, sym, headline, ts=\"2030-01-15T13:00:00Z\"):\n    return {\"id\": i, \"headline\": headline, \"summary\": \"\", \"symbols\": sym, \"created_at\": ts,\n            \"url\": f\"https://news.example/{i}\", \"source\": \"benzinga\"}\n\n\nclass NewsEndToEnd(EndToEnd):\n    # These two parent tests assume no news; they're covered by EndToEnd itself.\n    test_full_scan = None\n    test_market_closed_does_nothing = None\n\n    def setUp(self):\n        super().setUp()\n        Fake.world[\"news\"] = [\n            news_item(1, [\"HELD\"], \"HELD CEO resigns amid misconduct probe\"),\n            news_item(2, [\"LEAD\"], \"LEAD beats estimates and raises guidance\"),\n            news_item(3, [], \"Fed cuts rates by half a point in surprise move\"),\n            news_item(4, [\"ZZZZ\"], \"ZZZZ recalls widgets\"),                     # not a stock you track\n            news_item(5, [], \"Celebrity opens restaurant\"),                     # irrelevant\n            news_item(6, [\"S1\"], \"S1 announces share offering\"),\n        ]\n        Fake.world[\"live\"][\"HELD\"] = 100.5   # not at the stop, so the news alert stands out\n\n    def test_news_flow_open_market(self):\n        state = {}\n        holdings = [S.Holding(\"HELD\", 100.0, \"\", 2)]\n        alerts = self.scan(state, holdings)\n        kinds = [a.kind for a in alerts]\n        self.assertIn(\"news\", kinds)\n        self.assertIn(\"mnews\", kinds)\n        news = next(a for a in alerts if a.kind == \"news\")\n        self.assertEqual(news.symbol, \"HELD\")\n        self.assertIn(\"▼ bad\", news.title)\n        self.assertEqual(news.url, \"https://news.example/1\")\n        self.assertIn(\"Advice:\", news.message.split(\"\\n\")[0])\n        ev = state[\"news\"][\"events\"]\n        self.assertIn(\"HELD\", ev); self.assertIn(\"LEAD\", ev); self.assertIn(\"_MARKET\", ev); self.assertIn(\"S1\", ev)\n        self.assertNotIn(\"ZZZZ\", ev)\n        self.assertEqual(sorted(state[\"news\"][\"seen\"]), [\"1\", \"2\", \"3\", \"4\", \"5\", \"6\"])\n        buy = next(a for a in alerts if a.kind == \"buy\")\n        self.assertIn(\"earnings beat\", buy.message)             # good news shown on the buy\n        self.assertIn(\"Short-term\", buy.message.split(\"\\n\")[0])  # fresh catalyst -> short-term\n        # Same headlines next run: nothing new\n        Fake.pushes = []\n        self.assertEqual(self.scan(state, holdings), [])\n\n    def test_closed_market_sends_news_only(self):\n        Fake.world[\"clock\"][\"is_open\"] = False\n        alerts = self.scan({}, [S.Holding(\"HELD\", 100.0, \"\", 2)])\n        self.assertEqual(sorted(a.kind for a in alerts), [\"mnews\", \"news\"])\n        news = next(a for a in alerts if a.kind == \"news\")\n        self.assertIn(\"expect a move at the open\", news.message)\n\n    def test_bad_news_blocks_the_buy(self):\n        Fake.world[\"news\"] = [news_item(9, [\"LEAD\"], \"LEAD CEO ousted after fraud probe\")]\n        alerts = self.scan({}, [])\n        self.assertNotIn(\"LEAD\", [a.symbol for a in alerts if a.kind == \"buy\"])\n\n    def test_news_endpoint_down_is_harmless(self):\n        del Fake.world[\"news\"]\n        alerts = self.scan({}, [S.Holding(\"HELD\", 100.0, \"\", 2)])\n        self.assertIn(\"buy\", [a.kind for a in alerts])\n\n    def test_claude_rates_news_end_to_end(self):\n        os.environ[\"ANTHROPIC_API_KEY\"] = \"sk-test\"\n        def reply(body):\n            if \"tools\" in body:   # hold-time check\n                return '{\"horizon\":\"MEDIUM\",\"hold_for\":\"about 3 weeks\",\"why\":\"steady trend\",\"forum_mood\":\"mixed\"}'\n            items = json.loads(body[\"messages\"][0][\"content\"])\n            return json.dumps([{\"id\": it[\"id\"], \"symbol\": s, \"category\": \"other\", \"direction\": -1,\n                                \"strength\": 2, \"confidence\": 0.6, \"why\": \"test\"}\n                               for it in items for s in it[\"symbols\"]])\n        Fake.world[\"claude_reply\"] = reply\n        Fake.world[\"news\"] = [news_item(1, [\"HELD\"], \"HELD board meets with major shareholders\"),   # unclear\n                              news_item(2, [\"HELD\"], \"HELD CEO resigns amid misconduct probe\"),     # clear\n                              news_item(3, [\"S1\"], \"S1 holds investor day\")]                          # not owned\n        try:\n            alerts = self.scan({}, [S.Holding(\"HELD\", 100.0, \"\", 2)])\n        finally:\n            os.environ.pop(\"ANTHROPIC_API_KEY\", None)\n        rated = [c for c in Fake.claude_calls if \"tools\" not in c]\n        self.assertEqual(len(rated), 1)                                   # one call...\n        sent_items = json.loads(rated[0][\"messages\"][0][\"content\"])\n        self.assertEqual([i[\"id\"] for i in sent_items], [\"1\"])            # ...only for the unclear owned-stock headline\n        news = [a for a in alerts if a.kind == \"news\"]\n        self.assertTrue(any(\"rated by Claude\" in a.message for a in news))\n\n    def test_messages_fit(self):\n        alerts = self.scan({}, [S.Holding(\"HELD\", 100.0, \"\", 2)])\n        po = S.Pushover(\"t\", \"u\", self.cfg)\n        for a in alerts:\n            f = po.payload(a)\n            self.assertLessEqual(len(f[\"message\"]), 1024, a.title)\n            self.assertNotIn(\"WHY\", f[\"message\"].split(\"\\n\")[0])\n\n\nclass NewsCursor(NewsEndToEnd):\n    test_news_flow_open_market = test_closed_market_sends_news_only = None\n    test_bad_news_blocks_the_buy = test_news_endpoint_down_is_harmless = None\n    test_claude_rates_news_end_to_end = test_messages_fit = None\n\n    def test_cursor_moves_even_when_nothing_matters(self):\n        Fake.world[\"news\"] = [news_item(7, [\"ZZZZ\"], \"ZZZZ does a thing\", ts=\"2030-01-15T14:00:00Z\")]\n        state = {}\n        self.scan(state, [])\n        self.assertEqual(state[\"news\"][\"last\"], \"2030-01-15T14:00:00Z\")\n        self.assertEqual(state[\"news\"].get(\"events\", {}), {})\n\n    def test_old_events_are_pruned(self):\n        state = {\"news\": {\"events\": {\"X\": [[\"2029-12-01T00:00:00Z\", -2, \"old\", \"old\"]]}}}\n        Fake.world[\"news\"] = []\n        self.scan(state, [])\n        self.assertNotIn(\"X\", state[\"news\"][\"events\"])\n\n\n# ---------------------------------------------------------------------------\n# Research-first, budgets, memory, stats, ideas\n# ---------------------------------------------------------------------------\n\ndef gnews_xml(n, sites, word=\"beats estimates\"):\n    items = \"\".join(\n        f'<item><title>Story {i} {word} - Site{i % sites}<\/title><link>https://news.google.com/x{i}<\/link>'\n        f'<pubDate>Wed, 18 Nov 2026 10:00:00 GMT<\/pubDate><description>d<\/description>'\n        f'<source url=\"https://www.site{i % sites}.com\">Site{i % sites}<\/source><\/item>' for i in range(n))\n    return f\"<rss><channel>{items}<\/channel><\/rss>\"\n\n\ndef yahoo_xml(n, word=\"raises guidance\"):\n    items = \"\".join(f\"<item><title>Yahoo {i} {word}<\/title><link>https://finance.yahoo.com/n{i}<\/link>\"\n                    f\"<description>&lt;p&gt;x&lt;/p&gt;<\/description><\/item>\" for i in range(n))\n    return f\"<rss><channel>{items}<\/channel><\/rss>\"\n\n\nclass Research(unittest.TestCase):\n    @classmethod\n    def setUpClass(cls):\n        EndToEnd.setUpClass.__func__(cls)\n\n    @classmethod\n    def tearDownClass(cls):\n        EndToEnd.tearDownClass.__func__(cls)\n\n    def setUp(self):\n        Fake.calls = []\n        Fake.world = {}\n\n    def test_parse_and_count(self):\n        Fake.world = {\"gnews\": gnews_xml(12, 9), \"yahoo\": yahoo_xml(6)}\n        r = S.free_research(\"NVDA\", {}, CFG, \"2026-11-18T15:00:00Z\")\n        self.assertEqual(r.articles, 18)\n        self.assertEqual(r.sites, 10)                 # 9 Google sources + Yahoo\n        self.assertTrue(r.complete)\n        self.assertGreater(r.score, 0)\n        self.assertEqual(r.bad, 0)\n        self.assertFalse(r.top[0][1].endswith(\"Site0\"))   # \" - Source\" suffix stripped\n        self.assertEqual(r.sources, [\"Google News\", \"Yahoo Finance\"])\n\n    def test_too_few_sites_is_incomplete(self):\n        Fake.world = {\"gnews\": gnews_xml(20, 3)}\n        r = S.free_research(\"X\", {}, CFG, \"2026-11-18T15:00:00Z\")\n        self.assertFalse(r.complete)\n        self.assertTrue(S.research_uncertain(r))\n\n    def test_dedupe_and_failures(self):\n        Fake.world = {\"gnews\": gnews_xml(5, 5) + \"\", \"yahoo\": \"not xml at all\"}\n        r = S.free_research(\"X\", {\"news\": {\"events\": {\"X\": [[\"t\", -2, \"c\", \"Story 0 beats estimates\"]]}}},\n                            CFG, \"2026-11-18T15:00:00Z\")\n        self.assertEqual(r.articles, 5)               # Benzinga copy of story 0 is a duplicate\n        self.assertIn(\"Benzinga\", r.sources)\n\n    def test_cache(self):\n        Fake.world = {\"gnews\": gnews_xml(3, 3)}\n        k = {}\n        S.get_research(\"X\", {}, k, CFG, \"2026-11-18T15:00:00Z\")\n        S.get_research(\"X\", {}, k, CFG, \"2026-11-18T16:00:00Z\")\n        self.assertEqual(Fake.calls.count(\"gnews\"), 1)\n        S.get_research(\"X\", {}, k, CFG, \"2026-11-18T20:30:00Z\")   # past 4 hours\n        self.assertEqual(Fake.calls.count(\"gnews\"), 2)\n\n\nclass BudgetTests(unittest.TestCase):\n    @classmethod\n    def setUpClass(cls):\n        EndToEnd.setUpClass.__func__(cls)\n\n    @classmethod\n    def tearDownClass(cls):\n        EndToEnd.tearDownClass.__func__(cls)\n\n    def setUp(self):\n        Fake.calls = []\n        os.environ[\"ALPHAVANTAGE_API_KEY\"] = \"av\"\n        os.environ[\"LUNARCRUSH_API_KEY\"] = \"lc\"\n        os.environ[\"FINANCIAL_DATASETS_API_KEY\"] = \"fd\"\n\n    def tearDown(self):\n        for k in (\"ALPHAVANTAGE_API_KEY\", \"LUNARCRUSH_API_KEY\", \"FINANCIAL_DATASETS_API_KEY\"):\n            os.environ.pop(k, None)\n\n    def test_no_key_never_called(self):\n        os.environ.pop(\"LUNARCRUSH_API_KEY\")\n        b = S.Budgets({}, CFG, \"2026-11-18T10:00:00Z\")\n        self.assertIsNone(S.lunar_social(b, \"NVDA\"))\n        self.assertEqual(Fake.calls, [])\n\n    def test_limit_then_one_notice(self):\n        k = {}\n        b = S.Budgets(k, dict(CFG, budget_lunarcrush=2), \"2026-11-18T10:00:00Z\")\n        Fake.world = {\"lunar\": {\"data\": {\"types_sentiment\": {\"x\": 80, \"reddit\": 60}, \"num_posts\": 12,\n                                         \"interactions_24h\": 999, \"trend\": \"up\"}}}\n        self.assertEqual(S.lunar_social(b, \"NVDA\")[\"sentiment\"], 70)\n        S.lunar_social(b, \"NVDA\")\n        self.assertIsNone(S.lunar_social(b, \"NVDA\"))   # 3rd call blocked\n        self.assertIsNone(S.lunar_social(b, \"NVDA\"))\n        self.assertEqual(Fake.calls.count(\"lunar\"), 2)\n        self.assertEqual(len(b.notices), 1)\n        self.assertIn(\"LunarCrush credits used up\", b.notices[0].title)\n        # Same month, new run: still out, no second notice\n        b2 = S.Budgets(k, dict(CFG, budget_lunarcrush=2), \"2026-11-20T10:00:00Z\")\n        self.assertFalse(b2.can(\"lunarcrush\")); self.assertEqual(b2.notices, [])\n        # Next month: fresh\n        b3 = S.Budgets(k, dict(CFG, budget_lunarcrush=2), \"2026-12-01T10:00:00Z\")\n        self.assertTrue(b3.can(\"lunarcrush\"))\n\n    def test_provider_says_out(self):\n        b = S.Budgets({}, CFG, \"2026-11-18T10:00:00Z\")\n        Fake.world = {\"av\": {\"COMPANY_OVERVIEW\": {\"Information\": \"This is a premium endpoint...\"}}, \"fd\": None}\n        self.assertIsNone(S.alpha_vantage(b, {\"function\": \"COMPANY_OVERVIEW\", \"symbol\": \"X\"}))\n        self.assertFalse(b.can(\"alphavantage\"))\n        self.assertIsNone(S.fd_metrics(b, \"X\"))       # 402 Payment Required\n        self.assertFalse(b.can(\"financialdatasets\"))\n        self.assertEqual(sorted(n.title for n in b.notices),\n                         [\"⚠️ Alpha Vantage credits used up\", \"⚠️ Financial Datasets credits used up\"])\n\n    def test_earnings_calendar_once_a_day(self):\n        Fake.world = {\"av\": {\"EARNINGS_CALENDAR\": \"symbol,name,reportDate,fiscalDateEnding,estimate,currency\\n\"\n                                                  \"NVDA,NVIDIA,2026-11-20,2026-10-31,1.2,USD\\n\"}}\n        k = {}\n        b = S.Budgets(k, CFG, \"2026-11-18T10:00:00Z\")\n        self.assertEqual(S.earnings_soon(b, k, \"NVDA\", \"2026-11-18\"), \"2026-11-20\")\n        self.assertIsNone(S.earnings_soon(b, k, \"AAPL\", \"2026-11-18\"))\n        self.assertEqual(Fake.calls.count(\"av:EARNINGS_CALENDAR\"), 1)\n        self.assertEqual(S.trading_days_until(\"2026-11-18\", \"2026-11-20\"), 2)\n        self.assertEqual(S.trading_days_until(\"2026-11-20\", \"2026-11-23\"), 1)   # over a weekend\n\n    def test_fundamentals_cached(self):\n        Fake.world = {\"av\": {\"COMPANY_OVERVIEW\": {\"Name\": \"Acme\", \"PERatio\": \"30\", \"AnalystTargetPrice\": \"120\"},\n                             \"EARNINGS\": {\"quarterlyEarnings\": [{\"surprisePercentage\": \"5\"},\n                                                                {\"surprisePercentage\": \"-1\"}]}}}\n        k = {}\n        b = S.Budgets(k, CFG, \"2026-11-18T10:00:00Z\")\n        f = S.av_fundamentals(b, k, \"ACME\", \"2026-11-18\")\n        self.assertEqual((f[\"pe\"], f[\"target\"], f[\"beat_rate\"]), (30.0, 120.0, 0.5))\n        S.av_fundamentals(b, k, \"ACME\", \"2026-11-20\")\n        self.assertEqual(Fake.calls.count(\"av:COMPANY_OVERVIEW\"), 1)\n\n\nclass LongStats(unittest.TestCase):\n    def test_math(self):\n        closes = [100 * 1.10 ** (i / 252) for i in range(252 * 3)]\n        closes[300] = closes[299] * 0.9      # a crash day\n        dates = [(date(2020, 1, 1) + timedelta(days=int(i * 365 / 252))).isoformat() for i in range(len(closes))]\n        st = S.long_stats_from_closes(dates, closes)\n        self.assertAlmostEqual(st[\"cagr\"], 10.0, delta=0.3)\n        self.assertLess(st[\"max_drawdown\"], -9)\n        self.assertEqual(st[\"drops_4pct\"], 1)\n        self.assertIn(\"%/yr\", S.stats_line(st))\n        self.assertIsNone(S.long_stats_from_closes(dates[:100], closes[:100]))\n\n    def test_long_term_needs_steady_history(self):\n        m = mk(price=103, sma20=101)\n        self.assertEqual(S.rule_horizon(m, None, CFG, {\"cagr\": 15, \"max_drawdown\": -40})[\"horizon\"], \"LONG-TERM\")\n        self.assertEqual(S.rule_horizon(m, None, CFG, {\"cagr\": 2, \"max_drawdown\": -40})[\"horizon\"], \"MEDIUM\")\n\n\nclass TrackAndIdeas(unittest.TestCase):\n    def test_track(self):\n        k = {}\n        S.record_buy(k, \"A\", 100, \"2026-11-01\")\n        S.record_buy(k, \"B\", 100, \"2026-11-01\")\n        S.record_buy(k, \"C\", 100, \"2026-10-01\")\n        S.update_track(k, {\"A\": mk(price=102.5), \"B\": mk(price=97.5), \"C\": mk(price=100.5)}, CFG, \"2026-11-18\")\n        self.assertEqual([t[\"status\"] for t in k[\"track\"]], [\"win\", \"loss\", \"expired\"])\n        self.assertEqual(S.track_summary(k)[\"win_rate\"], 50)\n        self.assertIn(\"1 of 2\", S.track_line(k))\n\n    def test_trending_and_extra_watch(self):\n        k = {}\n        raw = [{\"symbols\": [\"NEWCO\"], \"headline\": \"NewCo beats estimates\", \"created_at\": \"2026-11-18T10:00:00Z\"},\n               {\"symbols\": [\"NEWCO\"], \"headline\": \"Analyst upgrades NewCo\", \"created_at\": \"2026-11-18T11:00:00Z\"},\n               {\"symbols\": [\"BADCO\"], \"headline\": \"BadCo misses estimates\", \"created_at\": \"2026-11-18T11:00:00Z\"},\n               {\"symbols\": [\"NVDA\"], \"headline\": \"Nvidia beats estimates\", \"created_at\": \"2026-11-18T11:00:00Z\"}]\n        S.note_trending(k, raw, {\"NVDA\"}, \"2026-11-18T12:00:00Z\")\n        ideas = S.trending_ideas(k)\n        self.assertEqual([i[\"symbol\"] for i in ideas], [\"NEWCO\"])\n        S.add_dynamic(k, [\"NEWCO\"], \"2026-11-18\", 5, 8)\n        self.assertEqual(S.dynamic_universe(k, \"2026-11-20\"), [\"NEWCO\"])\n        self.assertEqual(S.dynamic_universe(k, \"2026-11-24\"), [])\n        S.note_trending(k, [], set(), \"2026-11-21T12:00:00Z\")   # 48h later: forgotten\n        self.assertEqual(S.trending_ideas(k), [])\n\n\nclass FullFlow(EndToEnd):\n    \"\"\"The whole research-first flow, with fakes for every outside service.\"\"\"\n    test_full_scan = test_summary_near_close = test_market_closed_does_nothing = None\n    test_weak_market_blocks_buys = test_sold_holding_memory_is_cleared = test_todays_partial_bar_is_dropped = None\n\n    def test_clear_free_research_means_no_paid_calls(self):\n        os.environ.update(LUNARCRUSH_API_KEY=\"lc\", ANTHROPIC_API_KEY=\"sk\", FINANCIAL_DATASETS_API_KEY=\"fd\")\n        Fake.world.update(gnews=gnews_xml(14, 10), yahoo=yahoo_xml(4), lunar={\"data\": {}})\n        alerts = self.scan({}, [])\n        buy = next(a for a in alerts if a.kind == \"buy\")\n        self.assertIn(\"articles from\", buy.message)\n        self.assertNotIn(\"lunar\", Fake.calls)\n        self.assertEqual([c for c in Fake.claude_calls], [])\n\n    def test_unclear_free_research_asks_lunarcrush(self):\n        os.environ[\"LUNARCRUSH_API_KEY\"] = \"lc\"\n        Fake.world.update(gnews=gnews_xml(4, 2), lunar={\"data\": {\"types_sentiment\": {\"x\": 75}, \"num_posts\": 40}})\n        alerts = self.scan({}, [])\n        self.assertIn(\"lunar\", Fake.calls)\n        buy = next(a for a in alerts if a.kind == \"buy\")\n        self.assertIn(\"Social (LunarCrush): 75% positive\", buy.message)\n\n    def test_bad_social_blocks(self):\n        os.environ[\"LUNARCRUSH_API_KEY\"] = \"lc\"\n        Fake.world.update(lunar={\"data\": {\"types_sentiment\": {\"x\": 20}}})\n        self.assertNotIn(\"buy\", [a.kind for a in self.scan({}, [])])\n\n    def test_negative_web_news_blocks(self):\n        Fake.world.update(gnews=gnews_xml(15, 10, word=\"misses estimates and cuts guidance\"))\n        self.assertNotIn(\"buy\", [a.kind for a in self.scan({}, [])])\n\n    def test_earnings_blackout(self):\n        os.environ[\"ALPHAVANTAGE_API_KEY\"] = \"av\"\n        Fake.world.update(gnews=gnews_xml(15, 10), av={\"EARNINGS_CALENDAR\":\n                          \"symbol,name,reportDate\\nLEAD,Lead,2030-01-16\\n\"})\n        self.assertNotIn(\"buy\", [a.kind for a in self.scan({}, [])])\n\n    def test_budget_notice_and_memory_files(self):\n        import pathlib, tempfile\n        os.environ[\"ALPHAVANTAGE_API_KEY\"] = \"av\"\n        Fake.world.update(gnews=gnews_xml(15, 10), av={})   # every AV call says \"premium\"\n        d = pathlib.Path(tempfile.mkdtemp())\n        old = S.HERE\n        S.HERE = d\n        try:\n            k, state = {}, {}\n            alerts = self.scan_k(state, [S.Holding(\"HELD\", 100.0, \"\", 2)], k)\n        finally:\n            S.HERE = old\n        self.assertIn(\"budget\", [a.kind for a in alerts])\n        self.assertTrue((d / \"vault\" / \"Bot Memory.md\").exists())\n        self.assertTrue((d / \"vault\" / \"Stocks\" / \"HELD.md\").exists())\n        self.assertTrue((d / \"vault\" / \"Daily\" / \"2030-01-15.md\").exists())\n        dash = json.loads((d / \"app\" / \"dashboard.json\").read_text())\n        self.assertEqual(dash[\"holdings\"][0][\"symbol\"], \"HELD\")\n        self.assertTrue(any(b[\"name\"] == \"Alpha Vantage\" and b[\"out\"] for b in dash[\"budgets\"]))\n        self.assertTrue(k[\"alerts_log\"])\n        self.assertIn(\"LEAD\", [t[\"sym\"] for t in k[\"track\"]])\n\n    def test_ideas_once_a_day(self):\n        Fake.world[\"news\"] = [news_item(i, [\"NEWCO\"], f\"NewCo beats estimates {i}\") for i in range(3)]\n        k, state = {}, {}\n        a1 = self.scan_k(state, [], k)\n        self.assertIn(\"ideas\", [a.kind for a in a1])\n        idea = next(a for a in a1 if a.kind == \"ideas\")\n        self.assertIn(\"NEWCO\", idea.message)\n        self.assertIn(\"NEWCO\", k[\"dynamic\"])\n        a2 = self.scan_k(state, [], k)\n        self.assertNotIn(\"ideas\", [a.kind for a in a2])\n\n    def scan_k(self, state, holdings, k):\n        import pathlib, tempfile\n        old = S.HERE\n        if old == pathlib.Path(S.__file__).resolve().parent:\n            S.HERE = pathlib.Path(tempfile.mkdtemp())   # never write test files into the real repo\n        try:\n            return S.run_scan(self.cfg, S.Alpaca(\"K\", \"SECRET\"), S.Pushover(\"tok\", \"usr\", self.cfg), holdings,\n                              state, knowledge=k, write_files=True)\n        finally:\n            S.HERE = old\n\n\nclass RealNumbersOnly(unittest.TestCase):\n    def test_big_move_is_from_history(self):\n        closes = [100.0]\n        for k in range(300):\n            closes.append(closes[-1] * (1.05 if k % 10 == 0 else 1.001))   # one 5% day in every 10\n        s = S.Series.from_bars(make_bars(closes))\n        m = S.metrics_at(\"X\", s, len(s) - 1)\n        self.assertAlmostEqual(m.big_move_pct, 5.0, delta=0.01)\n        txt = S.dollar_scenarios(100, 2, 1.5, m.big_move_pct)\n        self.assertIn(\"±1.5% = ±$3.00\", txt)\n        self.assertIn(\"±5.0% = ±$10.00\", txt)\n        self.assertNotIn(\"2×\", txt)\n", "README.md": "# Stock Alerts: momentum + news scanner with iPhone alerts\n\nEvery 15 minutes on weekdays (7 AM – 4 PM Central), this bot:\n\n1. **Reads the news.** It pulls the Benzinga headline feed (free through your Alpaca account) and rates every story about your stocks or the whole market as good or bad, with its size and how confident the rating is. Before the market opens, it still checks news, so overnight stories reach you early.\n2. **Ranks ~70 big, liquid stocks by momentum.** Momentum has been the strongest factor in 2026.\n3. **Alerts you to a BUY** when a top-ranked stock is in a clean uptrend, isn't overextended, has no recent bad news, fits your risk level, and the overall market is healthy. Each buy alert also tells you **how much to buy** and **whether it looks like a short-term or long-term hold, and roughly for how long**.\n4. **Watches the stocks you bought** and alerts you using your rules, plus any big news about them.\n\n## The alerts\n\nOn the lock screen you see **one simple line**. Open the alert to see the full **WHY**, with the first line colored inside the Pushover app.\n\n| Alert | When | Loudness |\n|---|---|---|\n| 🛒 **BUY** | Passes every buy check. Shows suggested $ amount, hold time, and why | High |\n| 🟡 **SELL OFFER** | **+2%** from your buy price (then +4%, +6%) | High |\n| 🔵 **SOLID SELL** | **+8%** or more: a solid gain worth locking in | High |\n| 🟢 **BIG WIN** | **+20%** or more: strongly consider selling, at least part | High |\n| 📰 **News ▲/▼** | Medium or large story about a stock you own, with HOLD/SELL advice | High |\n| 📰 **Market news** | Big market-wide story (Fed, inflation, tariffs…), max 2 a day | Normal |\n| 🟠 **SELL WARNING** | Was up 1.5%+, now fading back to +0.5% | High |\n| 🟠 **NEAR STOP** | Down 1.5%, close to your -2% line | High |\n| 🔴 **SELL NOW** | Down **2%+**. Your rule says sell | **Emergency**: repeats every minute until you tap Acknowledge |\n| 📊 Close summary | About 25 min before the close: your profit/loss, advice, news | Normal |\n\nEvery sell alert includes a **HOLD or SELL read** that scores news, trend (20/50/200-day averages), RSI, momentum rank and the market's health.\n\n> **About colors on iPhone:** iOS doesn't let apps color the notification banner itself. The emoji shows the color on your lock screen, and the text is colored inside the Pushover app.\n>\n> **About \"covering the screen\":** no iPhone app can take over the full screen. The closest you can get is Pushover's **Critical Alerts**, which play sound even on silent or in Focus mode. The 🔴 alert also repeats until you acknowledge it. To make *every* alert an emergency, set all `priority_...` values in `config.json` to `2`.\n\n---\n\n## What the news can and can't do (read this once)\n\n**It can:** spot big stories within about 15 minutes, warn you about stocks you own, block buys right after bad news, push a SELL lean when bad news hits, and explain everything in plain words.\n\n**It can't:** get ahead of professional traders. Big news usually hits the price within **seconds**. When Nvidia's CEO resigned in November 2026, the stock fell as much as 14% at that morning's open, before most people had read the headline. Even \"obviously good\" news isn't guaranteed: Nvidia beat its earnings and guidance a few days later, popped about 4% before the next open, then turned *down* about 3% that day.\n\nSo the bot uses news as a **risk signal**, not a prediction machine. It will never say \"buy a lot because it's guaranteed.\" Position size is capped no matter how good the news looks. Your -2% rule, plus a real stop order in your broker, is what protects you.\n\n---\n\n## How much to buy (sizing)\n\nSet your account in `config.json`:\n```json\n\"account_size\": 30.0,\n\"risk_per_trade_pct\": 1.0,\n\"max_position_pct\": 50.0,\n\"risk_level\": \"moderate\"\n```\nThe bot sizes each buy so that if your -2% stop hits, you lose about **1% of your account**. It never puts more than **50%** in one stock. With $30 that means about **$15 per buy**, and if the stop hits you lose about $0.30. Each buy alert also shows what +2%, +8%, a typical day and the stock's real big days (its 1-in-20 moves over the last year) mean in dollars for that position.\n\n**Risk level:** `low` = only calm stocks (normal daily swing up to 1.5%), `moderate` = up to 2.5%, `any` = up to 3%.\n\nFill in shares in `holdings.txt` (e.g. `NVDA 182.50 2026-11-18 0.08`) and every alert shows your real dollar gain or loss.\n\n---\n\n## How long to hold (on every buy alert)\n\n- **With a Claude API key (recommended):** for each buy alert, Claude searches the web for the last week of news and investor-forum chatter (Reddit, StockTwits, X). It then answers **SHORT-TERM** (days to 2 weeks), **MEDIUM** (2–8 weeks) or **LONG-TERM** (3+ months), with how long, why, the forum mood, and the main risk. Heavy hype is treated as a short-term sign.\n- **Without a key:** built-in rules decide:\n  - Fresh news, stretched or jumpy → **short-term, 3–10 trading days**\n  - Steady 12-month uptrend, calm, top-ranked → **long-term, 3–12 months**. Strong 12-month winners have historically tended to keep outperforming for 3–12 months. A long hold needs a wider stop than 2%, such as below the 50-day average.\n  - Otherwise → **medium, 2–6 weeks**\n\n---\n\n## Costs\n\n| Thing | Cost |\n|---|---|\n| Pushover (iPhone alerts) | Free 30 days, then **$4.99 one time** |\n| Alpaca (prices + Benzinga news) | Free |\n| GitHub (runs the bot) | Free (private repo: about 800–1,000 of your 2,000 free minutes a month) |\n| Claude API (optional: smarter news ratings + forum check) | Pay as you go. Haiku 5.5 is $0.10 / $0.50 per million tokens, and web search is $10 per 1,000 searches. **Expect roughly $1–5/month.** Set a monthly spend limit in the Console to be safe. |\n\n---\n\n## Setup (about 30 minutes, easiest on your PC)\n\n### 1. Pushover: your alert app\n1. On iPhone, install **Pushover Notifications** and create an account.\n2. In the app's **Settings**, turn on **Critical Alerts** (high and emergency priority). Allow it when iOS asks.\n3. At **pushover.net**, copy your **User Key**.\n4. Click **Create an Application/API Token**, name it `Stock Alerts`, and copy the **API Token**.\n\n### 2. Alpaca: free prices and news\n1. Sign up at **alpaca.markets**. A paper account is fine.\n2. On the Paper account, go to **API Keys → Generate** and copy both keys. They're only used to read data; nothing is ever traded.\n\n### 3. Claude API key (optional, recommended)\n1. Go to **platform.claude.com**, sign in, add a few dollars of credit, and set a **monthly spend limit**.\n2. Under **API Keys**, create a key.\n3. If the Console has a setting to allow **web search**, turn it on. The hold-time check needs it; without it, the bot quietly falls back to its rules.\n\n### 4. GitHub: runs it with your PC off\n1. Make a free account at **github.com**. Click **+ → New repository**, name it `stock-alerts`, choose **Private**, and create it empty.\n2. Click **uploading an existing file**, drag in **everything in this folder** (including the `.github` folder), then **Commit changes**.\n3. Check that `.github/workflows/scan.yml` shows up in the repo.\n\n### 5. Add your keys as secrets\nIn the repo: **Settings → Secrets and variables → Actions → New repository secret**\n\n| Name | Value |\n|---|---|\n| `APCA_API_KEY_ID` | Alpaca key ID |\n| `APCA_API_SECRET_KEY` | Alpaca secret |\n| `PUSHOVER_TOKEN` | Pushover API token |\n| `PUSHOVER_USER` | Pushover user key |\n| `ANTHROPIC_API_KEY` | Claude API key (optional) |\n\n### 6. Test it\nIn **Actions → Stock scanner → Run workflow**:\n- **`test-alert`**: 6 sample alerts (🛒 🟡 🔵 🟢 📰 🔴). The last one repeats until you tap Acknowledge.\n- **`report`**: today's rankings, a News column, your holdings with advice, and the biggest stories of the last 24 hours.\n- **`backtest`**: how the buy setup and your ±2% rules did on 5 years of real prices.\n\n### 7. Make \"Log your buy\" work\nIn `config.json`, set:\n```json\n\"holdings_edit_url\": \"https://github.com/YOUR-USERNAME/stock-alerts/edit/main/holdings.txt\",\n```\n\n---\n\n## Daily use (from your phone)\n\n- **Buy alert →** buy in your broker app, then tap **Log your buy** and paste the line the alert gives you (e.g. `NVDA 182.50 2026-11-18 0.08`), then **Commit changes**.\n- **Also place a real -2% stop order in your broker.** Alerts can be 15–30 minutes late (the 15-minute checks plus GitHub delays), and prices can jump overnight. A real stop order is the only thing that enforces your rule instantly.\n- **Sold? →** delete the line and commit.\n- A typo in `holdings.txt` gets you a ⚠️ alert naming the line.\n\n---\n\n## How a BUY is chosen\n\n**Momentum score (0–100) compared with the list:** 40% the 12-month gain (skipping the last month), 30% the 6-month gain, 20% closeness to the 52-week high, 10% distance above the 200-day average.\n\n**Every check must pass:**\n- Market healthy (SPY above its 200-day)\n- Top 15 rank\n- Price > 50-day > 200-day, and the 200-day rising\n- Within 10% of the 52-week high\n- RSI 45–72\n- 0–6% above the 20-day average\n- Fits your risk level\n- Up on the day\n- No bad news in the last ~2 days\n\nAt most 3 buy alerts a day.\n\n## How news is rated\n\n- **Keyword rules (always on, free):** about 20 categories, including earnings beats and misses, guidance raised or cut, upgrades and downgrades, CEO exits, scandals, probes and lawsuits, FDA decisions, takeovers, share offerings, buybacks, recalls and hacks, tariffs and export bans, and Fed rates and inflation. Rumors (\"reportedly\", \"in talks\") get lower confidence. Opinion and list headlines (\"3 stocks to buy\", headlines ending in \"?\") get very low confidence.\n- **Claude (if you add a key):** reads each new headline and summary and rates direction, size and confidence. It's told never to add outside facts and never to be more than 85% confident. If the call fails, the keyword rules take over automatically.\n- News fades over time (half its weight every 24 hours) and is forgotten after 3 days.\n\n---\n\n## Why these rules (2026 evidence)\n\n- **Momentum led in 2026:** Morningstar named it the best-performing factor globally in Q2 2026 ([Morningstar](https://indexes.morningstar.com/insights/markets-review/blt49b23cb4e87c0d8d/morningstar-factor-monitor-q2-2026)).\n- **It can crash fast:** it dropped sharply at the early-June 2026 turning point ([Morningstar](https://indexes.morningstar.com/insights/perspective/blt863fcc07f2931f5f/momentum-investors-are-winning-but-not-by-betting-on-quality)). That's why buys pause when SPY is below its 200-day.\n- **Tight stops get shaken out by noise:** a January 2026 CFA Institute article found tight stops often cut trades on normal price swings ([CFA Institute](https://rpc.cfainstitute.org/blogs/enterprising-investor/2026/why-tight-stop-losses-often-hurt-investors-and-what-robust-capital-growth-really-requires)). So the bot filters out jumpy stocks and warns you when a stock's normal swing is bigger than 2%. **Run the backtest.** It compares your ±2% exits with wider, volatility-based exits.\n\n### Reading the backtest\n- **Per trade** above 0 means the rules made money after costs. **PF** (profit factor) above 1.2 is decent; below 1.0 loses money.\n- With ±2% exits you must win **more than about 53%** of trades just to break even.\n- The \"Any day in uptrend\" row is a no-skill baseline. The buy setup should beat it.\n- The backtest doesn't include news, because the free historical news feed isn't used in it.\n\n---\n\n## Settings (`config.json`)\n\n| Setting | Default | Meaning |\n|---|---|---|\n| `stop_pct` | 2.0 | 🔴 SELL NOW at this % below your buy |\n| `profit_pct` / `profit_step_pct` | 2 / 2 | 🟡 at +2%, then every +2% |\n| (fixed tiers) | 8 / 20 | 🔵 at +8%, 🟢 at +20% |\n| `account_size` | 30 | Your trading money |\n| `risk_per_trade_pct` / `max_position_pct` | 1 / 50 | Sizing caps |\n| `risk_level` | moderate | low / moderate / any |\n| `news` | true | Turn news on or off |\n| `news_alert_min_strength` | 2 | 1 = alert on small stories too |\n| `horizon_ai` | true | Ask Claude about hold time (needs a key) |\n| `priority_*` | 1 (stop = 2) | 0 normal, 1 loud, 2 emergency/repeating |\n| `universe` | built-in ~70 | Your own list, e.g. `[\"NVDA\",\"AAPL\"]` |\n\n---\n\n## Good to know\n- **Pattern day trading:** in a *margin* account under $25k, buying and selling the same stock on the same day 4+ times in 5 business days gets you flagged. In a *cash* account, money from a sale settles in 1 business day before you can reuse it.\n- **Taxes:** profitable sales are taxable. Short-term gains are taxed like regular income.\n- **Schedules pause** after 60 days with no repo activity. The bot's own saves keep it awake.\n- **If scheduled runs never appear** but manual runs work, push any small edit and wait a day, or make the repo public. (Public means anyone could see your holdings file.)\n- **Run on your PC:** put the keys in `.env` (see `.env.example`), then run `py scanner.py report` or `py scanner.py scan --dry-run`.\n- **Tests:** `python -m unittest test_scanner` (74 tests, all offline).\n- Not financial advice. The bot gives rule-based alerts, not guarantees.\n", "config.json": "{\n  \"_read_me\": \"Percentages are plain numbers (2.0 = 2%). Leave universe empty to use the built-in list of ~70 big, liquid stocks.\",\n\n  \"stop_pct\": 2.0,\n  \"near_stop_gap_pct\": 0.5,\n  \"warn_band_pct\": 0.5,\n  \"warn_arm_pct\": 1.5,\n  \"profit_pct\": 2.0,\n  \"profit_step_pct\": 2.0,\n\n  \"top_n\": 15,\n  \"rsi_min\": 45,\n  \"rsi_max\": 72,\n  \"max_from_high_pct\": 10.0,\n  \"max_above_sma20_pct\": 6.0,\n  \"max_atr_pct\": 3.0,\n  \"max_buy_alerts_per_day\": 3,\n  \"require_green_day\": true,\n\n  \"priority_buy\": 1,\n  \"priority_profit\": 1,\n  \"priority_warning\": 1,\n  \"priority_near_stop\": 1,\n  \"priority_stop\": 2,\n  \"priority_summary\": 0,\n  \"emergency_retry_sec\": 60,\n  \"emergency_expire_sec\": 900,\n  \"sound_buy\": \"cashregister\",\n  \"sound_sell\": \"siren\",\n\n  \"chart_url\": \"https://finance.yahoo.com/quote/{symbol}\",\n  \"holdings_edit_url\": \"\",\n  \"summary_minutes_before_close\": 25,\n\n  \"account_size\": 30.0,\n  \"risk_per_trade_pct\": 1.0,\n  \"max_position_pct\": 50.0,\n  \"risk_level\": \"moderate\",\n\n  \"news\": true,\n  \"news_ai_model\": \"claude-haiku-5-5\",\n  \"news_alert_min_strength\": 2,\n  \"news_alert_min_confidence\": 0.5,\n  \"news_block_buy_score\": -0.4,\n  \"horizon_ai\": true,\n  \"horizon_ai_model\": \"claude-haiku-5-5\",\n  \"web_search_tool\": \"web_search_20250305\",\n  \"web_search_max_uses\": 2,\n  \"priority_news\": 1,\n  \"priority_market_news\": 0,\n  \"max_market_news_alerts_per_day\": 2,\n\n  \"research_min_articles\": 15,\n  \"research_min_sites\": 10,\n  \"research_cache_hours\": 4,\n  \"earnings_blackout_days\": 2,\n  \"budget_alphavantage\": 20,\n  \"budget_lunarcrush\": 500,\n  \"budget_financialdatasets\": 100,\n  \"budget_claude\": 6,\n  \"priority_budget\": 0,\n  \"priority_ideas\": 0,\n  \"ideas_watch_days\": 5,\n  \"max_extra_watch\": 8,\n\n  \"data_feed\": \"iex\",\n  \"universe\": []\n}\n", "holdings.txt": "# YOUR STOCKS. After you buy, add one line:  SYMBOL  BUY_PRICE\n# Optional extras on the same line: date bought, number of shares.\n#\n#   NVDA 182.50\n#   AMD 155.60 2026-11-18 0.19\n#\n# After you sell, DELETE the line. Lines starting with # are ignored.\n", ".github/workflows/scan.yml": "name: Stock scanner\n\non:\n  schedule:\n    # Every 15 min, Mon-Fri, 13:00-21:59 UTC. That covers market hours in both\n    # winter and summer time. The script exits right away when the market is closed.\n    # Odd minutes (07/22/37/52) because GitHub delays jobs scheduled on the hour.\n    - cron: \"7,22,37,52 13-21 * * 1-5\"\n  workflow_dispatch:\n    inputs:\n      command:\n        description: \"What to run\"\n        type: choice\n        options: [scan, report, test-alert, backtest]\n        default: scan\n\npermissions:\n  contents: write   # lets the bot save its alert memory (state.json)\n\nconcurrency:\n  group: scanner\n  cancel-in-progress: false\n\njobs:\n  run:\n    runs-on: ubuntu-latest\n    timeout-minutes: 10\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Run\n        env:\n          CMD: ${{ inputs.command || 'scan' }}\n          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}\n          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}\n          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}\n          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}\n          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}                     # optional, used only when needed\n          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}               # optional\n          LUNARCRUSH_API_KEY: ${{ secrets.LUNARCRUSH_API_KEY }}                   # optional\n          FINANCIAL_DATASETS_API_KEY: ${{ secrets.FINANCIAL_DATASETS_API_KEY }}   # optional\n        run: |\n          case \"$CMD\" in\n            scan|report|backtest) python3 scanner.py \"$CMD\" ;;\n            test-alert) python3 scanner.py test-alert --all ;;\n            *) echo \"unknown command\"; exit 1 ;;\n          esac\n\n      - name: Save memory (alerts, knowledge, Obsidian vault, app data)\n        if: ${{ (inputs.command || 'scan') == 'scan' }}\n        run: |\n          git config user.name \"stock-scanner\"\n          git config user.email \"stock-scanner@users.noreply.github.com\"\n          git add state.json knowledge.json vault app/dashboard.json 2>/dev/null || git add state.json\n          if git diff --cached --quiet; then echo \"no changes\"; exit 0; fi\n          git commit -m \"scanner: update alert memory [skip ci]\"\n          for i in 1 2 3; do\n            git pull --rebase --autostash && git push && exit 0\n            sleep 5\n          done\n          echo \"could not save state\"; exit 1\n", ".gitignore": ".env\n__pycache__/\n", ".env.example": "# Only needed to run the scanner on your own PC. On GitHub, use repo Secrets instead.\n# Copy this file to \".env\" and fill in. Never upload .env anywhere.\nAPCA_API_KEY_ID=your_alpaca_key_id\nAPCA_API_SECRET_KEY=your_alpaca_secret\nPUSHOVER_TOKEN=your_pushover_api_token\nPUSHOVER_USER=your_pushover_user_key\n# Optional: lets Claude rate the news and check forums for hold time (pay-as-you-go API key)\nANTHROPIC_API_KEY=\nALPHAVANTAGE_API_KEY=\nLUNARCRUSH_API_KEY=\nFINANCIAL_DATASETS_API_KEY=\n", "state.json": "{}\n", "knowledge.json": "{}\n", "app/dashboard.json": "{\"updated\": \"\", \"holdings\": [], \"alerts\": [], \"watch\": [], \"ideas\": [], \"budgets\": [], \"track\": {}}\n", "vault/Welcome.md": "---\ntags: [stock-bot]\n---\n# Stock Bot Vault\n\nThe bot writes here after every scan:\n- **Bot Memory**: track record and how many paid credits are used\n- **Stocks/**: one note per stock (stats, research, news, alerts)\n- **Daily/**: every alert, by day\n\nOpen this `vault` folder in Obsidian to read it, search it and see links between stocks and days.\n", "vault/Stocks/.keep": "", "vault/Daily/.keep": ""}</script>
<script>
"use strict";
const APP_VERSION = "2026.11.18";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("nt:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("nt:" + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem("nt:" + k); } catch (e) {} }
};
const BOT = JSON.parse(document.getElementById("botfiles").textContent);
const KEEP = new Set(["config.json", "holdings.txt", "state.json", "knowledge.json", "app/dashboard.json",
  "vault/Welcome.md", "vault/Stocks/.keep", "vault/Daily/.keep"]);
const SECRETS_REQ = ["APCA_API_KEY_ID", "APCA_API_SECRET_KEY", "PUSHOVER_TOKEN", "PUSHOVER_USER"];
const SECRETS_OPT = ["ANTHROPIC_API_KEY", "ALPHAVANTAGE_API_KEY", "LUNARCRUSH_API_KEY", "FINANCIAL_DATASETS_API_KEY"];

let conf = store.get("conf", null);
let dash = null, holdings = { text: null, sha: null }, tab = "alerts", alertFilter = "all", loading = false;
const appUrl = () => location.origin + location.pathname;

/* ---------- theme + effects ---------- */
const mqDark = matchMedia("(prefers-color-scheme: dark)"), mqCalm = matchMedia("(prefers-reduced-motion: reduce)");
function applyLook() {
  const t = store.get("theme", "dark");
  document.documentElement.dataset.theme = t === "auto" ? (mqDark.matches ? "dark" : "light") : t;
  const fx = mqCalm.matches ? "calm" : store.get("fx", "full");
  document.body.dataset.fx = fx;
  const meta = document.querySelector('meta[name="theme-color"]');
  meta.content = getComputedStyle(document.documentElement).getPropertyValue("--void").trim() || "#080a1c";
}
mqDark.addEventListener?.("change", applyLook); mqCalm.addEventListener?.("change", applyLook);

/* ---------- utf-8 base64 ---------- */
function enc(str) { const b = new TextEncoder().encode(str); let s = ""; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
function dec(b64) { const bin = atob(b64.replace(/\s/g, "")); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }

/* ---------- GitHub ---------- */
function friendly(status, msg) {
  if (status === 401) return "GitHub rejected your access key. Make a new one in Bot → Setup.";
  if (status === 403) return "Your access key is missing a permission (" + msg + "). Check step 2 in Bot → Setup.";
  if (status === 404) return "GitHub couldn't find that. Check the username and repo name, and that the key can see this repo.";
  if (status === 409) return "Your repo is empty. Run “Install the bot” in Bot → Setup.";
  if (status === 422) return msg || "GitHub didn't accept that.";
  return msg || ("GitHub error " + status);
}
async function gh(path, { method = "GET", body, raw = false } = {}) {
  let r;
  try {
    r = await fetch("https://api.github.com" + path, {
      method, cache: "no-store",
      headers: Object.assign({ "Authorization": "Bearer " + conf.token,
        "Accept": raw ? "application/vnd.github.raw+json" : "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28" }, body ? { "Content-Type": "application/json" } : {}),
      body: body ? JSON.stringify(body) : undefined });
  } catch (e) { const er = new Error("No connection to GitHub. Check your internet."); er.status = 0; throw er; }
  if (r.status === 204) return null;
  const text = await r.text();
  if (!r.ok) { let m = text; try { m = JSON.parse(text).message; } catch (e) {} const er = new Error(friendly(r.status, m)); er.status = r.status; throw er; }
  if (raw) return text;
  return text ? JSON.parse(text) : null;
}
const cpath = p => "/repos/" + encodeURIComponent(conf.owner) + "/" + encodeURIComponent(conf.repo) + "/contents/" + p.split("/").map(encodeURIComponent).join("/");
async function readFile(p) {
  try { const j = await gh(cpath(p)); return { text: dec(j.content || ""), sha: j.sha }; }
  catch (e) { if (e.status === 404 || e.status === 409) return { text: null, sha: null }; throw e; }
}
async function writeFile(p, text, sha, msg) {
  return gh(cpath(p), { method: "PUT", body: Object.assign({ message: msg, content: enc(text) }, sha ? { sha } : {}) });
}
async function dispatch(command) {
  const repo = await gh("/repos/" + conf.owner + "/" + conf.repo);
  await gh("/repos/" + conf.owner + "/" + conf.repo + "/actions/workflows/scan.yml/dispatches",
    { method: "POST", body: { ref: repo.default_branch || "main", inputs: { command } } });
}

/* ---------- toast + sheet ---------- */
let toastT;
function toast(msg, err) { const t = $("#toast"); t.textContent = msg; t.className = "on" + (err ? " err" : ""); clearTimeout(toastT); toastT = setTimeout(() => t.className = "", err ? 5200 : 2600); }
function openSheet(html) { $("#sheetbody").innerHTML = html; $("#sheet").classList.add("on"); $("#sheetback").classList.add("on"); }
function closeSheet() { $("#sheet").classList.remove("on"); $("#sheetback").classList.remove("on"); }
$("#sheetback").addEventListener("click", closeSheet);
$("#sheetclose").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

/* ---------- data ---------- */
async function load(quiet) {
  if (!conf || loading) return;
  loading = true; $("#refresh").classList.add("spin");
  try {
    const [d, h] = await Promise.all([
      gh(cpath("app/dashboard.json"), { raw: true }).then(t => JSON.parse(t)).catch(e => { if (e.status === 404 || e.status === 409) return null; throw e; }),
      readFile("holdings.txt")]);
    dash = d; holdings = h;
    store.set("cache", { dash, holdingsText: h.text });
  } catch (e) { if (!quiet) toast(e.message, true); }
  finally { loading = false; $("#refresh").classList.remove("spin"); render(); }
}
function parseHoldings(text) {
  const out = [];
  (text || "").split("\n").forEach((raw, i) => {
    const line = raw.split("#")[0].trim(); if (!line) return;
    const p = line.replace(/,/g, "").split(/\s+/);
    const price = parseFloat((p[1] || "").replace("$", ""));
    if (!p[0] || !(price > 0)) return;
    let bought = "", shares = null;
    p.slice(2).forEach(x => { if (/^\d{4}-\d\d-\d\d$/.test(x)) bought = x; else if (+x > 0) shares = +x; });
    out.push({ symbol: p[0].toUpperCase(), buy: price, bought, shares, line: i });
  });
  return out;
}

/* ---------- colors by alert kind ---------- */
const KIND = { buy: "--violet", profit: "--amber", profit8: "--blue", profit20: "--green", stop: "--red", near: "--orange",
  warn: "--orange", summary: "--faint", ideas: "--violet", budget: "--orange", error: "--orange", mnews: "--cyan" };
function alertColor(a) {
  if (a.kind === "news") return (a.title || "").includes("▲") ? "var(--green)" : "var(--red)";
  if (a.kind === "mnews") return (a.title || "").includes("▲") ? "var(--green)" : "var(--red)";
  return "var(" + (KIND[a.kind] || "--line") + ")";
}
const money = x => (x < 0 ? "-$" : "$") + Math.abs(x).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = x => (x >= 0 ? "+" : "") + x.toFixed(2) + "%";

/* ---------- views ---------- */
function header(title, sub) { return '<h1 class="view">' + esc(title) + "</h1>" + (sub ? '<p class="sub">' + sub + "</p>" : ""); }
function emptyState(glyph, text, actionHtml) { return '<div class="empty"><div class="glyph">' + glyph + "</div><p>" + text + "</p>" + (actionHtml || "") + "</div>"; }

function viewAlerts() {
  const all = (dash && dash.alerts) || [];
  const groups = { all: () => true, buys: a => a.kind === "buy" || a.kind === "ideas",
    sells: a => ["stop", "near", "warn", "profit", "profit8", "profit20"].includes(a.kind),
    news: a => a.kind === "news" || a.kind === "mnews" };
  const list = all.filter(groups[alertFilter]);
  const lastSeen = store.get("lastSeen", "");
  let h = header("Alerts", dash ? "Everything the bot told you, newest first." : "");
  h += '<div class="chips" role="group" aria-label="Filter">' + [["all", "All"], ["buys", "Buys"], ["sells", "Sells"], ["news", "News"]]
    .map(([k, l]) => '<button class="chip" data-filter="' + k + '" aria-pressed="' + (alertFilter === k) + '">' + l + "</button>").join("") + "</div>";
  if (!dash) return h + emptyState("// no signal", "The bot hasn't sent data yet. It runs every 15 minutes on weekdays.", '<button class="btn primary" data-act="scan">Run a scan now</button>');
  if (!list.length) return h + emptyState("// quiet", "No alerts here yet.");
  h += list.map((a, i) => {
    const [simple, ...rest] = (a.message || "").split("\n");
    const why = rest.join("\n").replace(/^\s*WHY\s*\n/, "").trim();
    const fresh = a.t > lastSeen ? " fresh" : "";
    return '<div class="card alert' + fresh + '" style="--c:' + alertColor(a) + '" data-i="' + i + '">' +
      '<div class="t">' + esc(a.title) + '</div><div class="s">' + esc(simple) + "</div>" +
      '<div class="meta">' + esc(a.t.replace("T", " ")) + " ET · tap for details</div>" +
      '<div class="why">' + esc(why) + "</div>" +
      '<div class="acts">' + (a.url ? '<a class="btn small" href="' + esc(a.url) + '" target="_blank" rel="noopener">Open link</a>' : "") +
      (a.kind === "buy" && a.sym ? '<button class="btn small primary" data-log="' + esc(a.sym) + '">Log this buy</button>' : "") + "</div></div>";
  }).join("");
  if (all[0]) store.set("lastSeen", all[0].t);
  return h;
}

function viewStocks() {
  const mine = parseHoldings(holdings.text);
  const byDash = {}; ((dash && dash.holdings) || []).forEach(x => byDash[x.symbol] = x);
  let h = header("Your stocks", mine.length ? "Live from the bot's last scan." : "");
  if (!mine.length) h += emptyState("// empty", "You haven't logged any stocks. When you buy one, tap Log a buy so the bot can watch it.", '<button class="btn primary" data-act="log">Log a buy</button>');
  mine.forEach(s => {
    const d = byDash[s.symbol] && byDash[s.symbol].buy === s.buy ? byDash[s.symbol] : null;
    const gain = d && d.gain != null ? d.gain : null;
    const col = gain == null ? "var(--line)" : gain >= 0 ? "var(--green)" : "var(--red)";
    const adv = d && d.advice ? d.advice : "Waiting for the next scan";
    const advCol = /^SELL/.test(adv) ? "var(--red)" : /^LEAN/.test(adv) ? "var(--orange)" : /^HOLD: strong/.test(adv) ? "var(--green)" : "var(--amber)";
    h += '<div class="card stock" style="--c:' + col + '"><div class="row"><span class="sym">' + esc(s.symbol) + "</span>" +
      (gain != null ? '<span class="big ' + (gain >= 0 ? "up" : "down") + '">' + pct(gain) + "</span>" : "") + "</div>" +
      '<div class="kv"><div><small>Bought</small><b>' + money(s.buy) + "</b></div><div><small>Now</small><b>" + (d && d.price ? money(d.price) : "—") +
      "</b></div><div><small>" + (s.shares ? "Profit" : "Sell line") + "</small><b>" +
      (s.shares && d && d.pl != null ? '<span class="' + (d.pl >= 0 ? "up" : "down") + '">' + money(d.pl) + "</span>" : money(s.buy * 0.98)) + "</b></div></div>" +
      '<span class="advice" style="--c:' + advCol + '">' + esc(adv) + "</span>" +
      (d && d.why ? '<ul class="reasons">' + d.why.map(w => "<li>" + esc(w) + "</li>").join("") + "</ul>" : "") +
      '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><a class="btn small" target="_blank" rel="noopener" href="https://finance.yahoo.com/quote/' + encodeURIComponent(s.symbol) + '">Chart</a>' +
      '<button class="btn small" data-note="' + esc(s.symbol) + '">Notes</button>' +
      '<button class="btn small danger" data-sold="' + s.line + '">I sold it</button></div></div>';
  });
  const w = (dash && dash.watch) || [];
  if (w.length) {
    h += '<h2 class="sec">Momentum ranking</h2><div class="list">' + w.map(x =>
      '<div class="li" data-note="' + esc(x.symbol) + '"><span class="n">' + x.rank + '</span><div class="main"><b>' + esc(x.symbol) + "</b><small>" +
      (x.setup ? "Buy setup ready" : esc((x.fails || []).join("; "))) + '</small></div><div class="r">' + money(x.price) +
      '<br><span class="tag" style="--c:' + (x.risk === "LOW" ? "var(--green)" : x.risk === "MODERATE" ? "var(--amber)" : "var(--red)") + '">' + esc(x.risk.toLowerCase()) + " risk</span></div></div>").join("") + "</div>";
  }
  return h;
}

function viewIdeas() {
  let h = header("Ideas", "Stocks worth a look. Ideas, not orders: the bot only says buy when every check passes.");
  if (!dash) return h + emptyState("// no signal", "Ideas show up after the bot's first scan.");
  const ready = (dash.watch || []).filter(x => x.setup);
  const near = (dash.watch || []).filter(x => !x.setup && (x.fails || []).length <= 2).slice(0, 5);
  const trend = dash.ideas || [];
  const block = (title, items, fn) => items.length ? '<h2 class="sec">' + title + '</h2><div class="list">' + items.map(fn).join("") + "</div>" : "";
  h += block("Ready to buy", ready, x => '<div class="li" data-note="' + esc(x.symbol) + '"><span class="n">' + x.rank + '</span><div class="main"><b>' + esc(x.symbol) + "</b><small>Passes every check · " + esc(x.risk.toLowerCase()) + ' risk</small></div><div class="r">' + money(x.price) + "</div></div>");
  h += block("Almost there", near, x => '<div class="li" data-note="' + esc(x.symbol) + '"><span class="n">' + x.rank + '</span><div class="main"><b>' + esc(x.symbol) + "</b><small>Waiting on " + esc((x.fails || []).join(", ")) + '</small></div><div class="r">' + money(x.price) + "</div></div>");
  h += block("Trending in the news", trend, x => '<div class="li"><span class="n">↗</span><div class="main"><b>' + esc(x.symbol) + "</b><small>" + esc(x.headline) + '</small></div><div class="r">' + x.mentions + " stories</div></div>");
  if (!ready.length && !near.length && !trend.length) h += emptyState("// scanning", "Nothing stands out right now. That's normal; strong setups are rare.");
  return h;
}

function mdToHtml(md) {
  md = md.replace(/^---[\s\S]*?---\s*/, "");
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>")
    .replace(/\[\[(.+?)\]\]/g, (m, n) => '<a href="#" data-note="' + n + '">' + n + "</a>")
    .replace(/\[(.+?)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  let out = "", inList = false;
  md.split("\n").forEach(l => {
    const m = l.match(/^(#{1,3})\s+(.*)/), li = l.match(/^\s*[-*]\s+(.*)/);
    if (!li && inList) { out += "</ul>"; inList = false; }
    if (m) out += "<h" + m[1].length + ">" + inline(m[2]) + "</h" + m[1].length + ">";
    else if (li) { if (!inList) { out += "<ul>"; inList = true; } out += "<li>" + inline(li[1]) + "</li>"; }
    else if (l.trim()) out += "<p>" + inline(l) + "</p>";
  });
  return out + (inList ? "</ul>" : "");
}
async function openNote(path) {
  openSheet('<h3>Loading…</h3>');
  try { const f = await readFile(path); $("#sheetbody").innerHTML = f.text ? '<div class="md">' + mdToHtml(f.text) + "</div>" : "<h3>No note yet</h3><p class='hint'>The bot writes this after it alerts about this stock.</p>"; }
  catch (e) { $("#sheetbody").innerHTML = "<h3>Couldn't open it</h3><p class='hint'>" + esc(e.message) + "</p>"; }
}

  const step = (n, state, title, body) => '<div class="step ' + state + '"><div class="num">' + n + '</div><div class="body"><h4>' + title + "</h4>" + body + "</div></div>";
  let h = "";
  h += step(1, c.owner ? "done" : "now", "Make an empty private repo",
    "<p>On GitHub, make a new repository named <b>stock-alerts</b>, set it to <b>Private</b>, and leave everything else empty.</p>" +
    '<a class="btn small" href="https://github.com/new" target="_blank" rel="noopener">Open GitHub</a>');
  h += step(2, c.token ? "done" : c.owner ? "now" : "", "Make an access key",
    "<p>Create a fine-grained token. Under Repository access pick <b>Only select repositories</b> → stock-alerts. Then set these permissions:</p>" +
    '<ul class="perm"><li>Contents: Read and write</li><li>Actions: Read and write</li><li>Workflows: Read and write</li><li>Secrets: Read-only</li></ul>' +
    '<a class="btn small" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Open token page</a>' +
    '<form id="connect"><label class="f"><span>Your GitHub username</span><input name="owner" autocapitalize="off" autocorrect="off" spellcheck="false" value="' + esc(c.owner || "") + '" required></label>' +
    '<label class="f"><span>Repo name</span><input name="repo" autocapitalize="off" autocorrect="off" spellcheck="false" value="' + esc(c.repo || "stock-alerts") + '" required></label>' +
    '<label class="f"><span>Access key</span><input name="token" type="password" autocomplete="off" placeholder="' + (c.token ? "Saved. Paste to replace" : "github_pat_…") + '"' + (c.token ? "" : " required") + "></label>" +
    '<button class="btn primary wide">Connect</button><p class="hint">The key stays on this phone only. Links you open from alerts open in Safari, which keeps separate storage, so connect there once too.</p></form>');
  h += step(3, c.installed ? "done" : c.token ? "now" : "", "Install the bot",
    "<p>Copies the bot, its settings and its memory folders into your repo. Run it again any time to update the bot; your stocks and settings are kept.</p>" +
    '<div class="prog"><i id="instprog"></i></div><p class="hint" id="insttext"></p><button class="btn' + (c.token && !c.installed ? " primary" : "") + ' wide" data-act="install"' + (c.token ? "" : " disabled") + ">" + (c.installed ? "Update the bot" : "Install the bot") + "</button>");
  h += step(4, c.secrets ? "done" : c.installed ? "now" : "", "Add your keys",
    "<p>Add each one under <b>New repository secret</b>. Paste the exact name, then the key.</p>" +
    '<div id="secretlist">' + SECRETS_REQ.concat(SECRETS_OPT).map(s => '<div class="secret"><span class="no" data-sec="' + s + '">○</span><code>' + s + "</code>" + (SECRETS_OPT.includes(s) ? '<span class="hint">optional</span>' : "") + "</div>").join("") + "</div>" +

    '<button class="btn small" data-act="checksecrets"' + (c.installed ? "" : " disabled") + ">Check my keys</button></div>");

    '<button class="btn wide" data-act="test"' + (c.installed ? "" : " disabled") + ">Send test alerts</button>");
  if (c.token) h += '<button class="btn danger wide" style="margin-top:14px" data-act="disconnect">Disconnect this phone</button>';
  return h;
}
function viewSetup() {
  return header("Welcome", "Five steps and your bot runs by itself, even with your phone in your pocket.") + setupHtml(false);
}

async function install() {
  const files = Object.entries(BOT), bar = $("#instprog"), txt = $("#insttext");
  let done = 0;
  try {
    for (const [path, content] of files) {
      txt.textContent = "Uploading " + path + "…";
      const cur = await readFile(path);
      if (KEEP.has(path)) {
        if (cur.text == null) {
          let body = content;
          if (path === "config.json") { const j = JSON.parse(content); j.holdings_edit_url = appUrl() + "#log-{symbol}-{price}"; body = JSON.stringify(j, null, 2) + "\n"; }
          await writeFile(path, body, null, "Add " + path);
        }
      } else if (cur.text !== content) {
        await writeFile(path, content, cur.sha, (cur.sha ? "Update " : "Add ") + path);
      }
      done++; if (bar) bar.style.width = (done / files.length * 100) + "%";
    }
    conf.installed = true; store.set("conf", conf);
    txt.textContent = "Installed " + files.length + " files.";
    toast("Bot installed"); render();
  } catch (e) { if (txt) txt.textContent = e.message; toast(e.message, true); }
}
async function checkSecrets() {
  try {
    const r = await gh("/repos/" + conf.owner + "/" + conf.repo + "/actions/secrets?per_page=100");
    const have = new Set((r.secrets || []).map(s => s.name));
    document.querySelectorAll("[data-sec]").forEach(el => { const ok = have.has(el.dataset.sec); el.textContent = ok ? "●" : "○"; el.className = ok ? "ok" : "no"; });
    const missing = SECRETS_REQ.filter(s => !have.has(s));
    conf.secrets = !missing.length; store.set("conf", conf);
    toast(missing.length ? "Still missing: " + missing.join(", ") : "All required keys are in", !!missing.length);
  } catch (e) { toast(e.message, true); }
}

/* ---------- log a buy / sold ---------- */
function logSheet(sym, price) {
  const today = new Date().toISOString().slice(0, 10);
  openSheet('<h3>Log a buy</h3><form id="logform">' +
    '<label class="f"><span>Stock symbol</span><input name="sym" required autocapitalize="characters" autocorrect="off" spellcheck="false" value="' + esc(sym || "") + '" placeholder="NVDA"></label>' +
    '<label class="f"><span>Price you paid per share</span><input name="price" required inputmode="decimal" value="' + esc(price || "") + '" placeholder="182.50"></label>' +
    '<label class="f"><span>Shares (optional, for dollar amounts)</span><input name="shares" inputmode="decimal" placeholder="0.08"></label>' +
    '<p class="hint" id="stophint">Tip: also set a stop order in your broker at −2%.</p>' +
    '<button class="btn primary wide">Save buy</button></form>');
  const f = $("#logform");
  const upd = () => { const p = parseFloat(f.price.value); $("#stophint").textContent = p > 0 ? "Also set a stop order in your broker at " + money(p * 0.98) + " (−2%)." : "Tip: also set a stop order in your broker at −2%."; };
  f.price.addEventListener("input", upd); upd();
  f.addEventListener("submit", async ev => {
    ev.preventDefault();
    const s = f.sym.value.trim().toUpperCase(), p = parseFloat(f.price.value), sh = parseFloat(f.shares.value);
    if (!/^[A-Z.]{1,6}$/.test(s)) return toast("Use a stock symbol like NVDA", true);
    if (!(p > 0)) return toast("Enter the price you paid", true);
    const line = s + " " + p.toFixed(2) + " " + today + (sh > 0 ? " " + sh : "");
    f.querySelector("button").disabled = true;
    try {
      const cur = await readFile("holdings.txt");
      const text = (cur.text || "").replace(/\s*$/, "\n") + line + "\n";
      await writeFile("holdings.txt", text, cur.sha, "Log buy: " + line);
      holdings = { text, sha: null }; closeSheet(); toast("Buy logged: " + s); go("stocks"); load(true);
    } catch (e) { toast(e.message, true); f.querySelector("button").disabled = false; }
  });
}
function soldSheet(lineIdx) {
  const lines = (holdings.text || "").split("\n"), l = lines[lineIdx] || "";
  openSheet("<h3>Remove " + esc(l.trim().split(/\s+/)[0]) + "?</h3><p class='hint'>The bot stops watching it. Do this after you've sold in your broker.</p>" +
    '<div style="display:grid;gap:10px;margin-top:14px"><button class="btn danger wide" id="confirmsold">Remove it</button><button class="btn wide" id="cancelsold">Keep it</button></div>');
  $("#cancelsold").onclick = closeSheet;
  $("#confirmsold").onclick = async () => {
    try {
      const cur = await readFile("holdings.txt"), arr = (cur.text || "").split("\n");
      const idx = arr.findIndex(x => x.trim() === l.trim());
      if (idx < 0) throw new Error("That line changed. Pull to refresh and try again.");
      arr.splice(idx, 1);
      const text = arr.join("\n");
      await writeFile("holdings.txt", text, cur.sha, "Sold: " + l.trim());
      holdings = { text, sha: null }; closeSheet(); toast("Removed"); render(); load(true);
    } catch (e) { toast(e.message, true); }
  };
}
async function settingsSheet() {
  openSheet("<h3>Loading…</h3>");
  try {
    const cur = await readFile("config.json"); const cfg = JSON.parse(cur.text || "{}");
    $("#sheetbody").innerHTML = '<h3>Trading settings</h3><form id="setform">' +
      '<label class="f"><span>Money you trade with ($)</span><input name="acct" inputmode="decimal" value="' + esc(cfg.account_size ?? 30) + '"></label>' +
      '<label class="f"><span>Risk level</span><select name="risk">' + [["low", "Low: calm stocks only"], ["moderate", "Moderate"], ["any", "Any"]].map(([v, l]) => '<option value="' + v + '"' + (cfg.risk_level === v ? " selected" : "") + ">" + l + "</option>").join("") + "</select></label>" +
      '<label class="f"><span>Make every alert an emergency (repeats until you tap)</span><select name="loud"><option value="no">No, only SELL NOW</option><option value="yes"' + (cfg.priority_buy === 2 ? " selected" : "") + ">Yes, all of them</option></select></label>" +
      '<button class="btn primary wide">Save settings</button></form>';
    $("#setform").addEventListener("submit", async ev => {
      ev.preventDefault(); const f = ev.target;
      const a = parseFloat(f.acct.value); if (!(a > 0)) return toast("Enter a dollar amount", true);
      cfg.account_size = a; cfg.risk_level = f.risk.value;
      const p = f.loud.value === "yes" ? 2 : 1;
      ["priority_buy", "priority_profit", "priority_warning", "priority_near_stop", "priority_news"].forEach(k => cfg[k] = p);
      try { await writeFile("config.json", JSON.stringify(cfg, null, 2) + "\n", cur.sha, "Update settings from app"); closeSheet(); toast("Settings saved"); }
      catch (e) { toast(e.message, true); }
    });
  } catch (e) { $("#sheetbody").innerHTML = "<h3>Couldn't load settings</h3><p class='hint'>" + esc(e.message) + "</p>"; }
}

/* ---------- render + events ---------- */
function setStatus() {
  const on = !!(dash && dash.market_open);
  $("#mdot").className = "dot" + (on ? " on" : "");
  $("#mtext").textContent = !conf ? "not connected" : !dash ? "waiting for bot" : on ? "market open" : "market closed";
  const fresh = ((dash && dash.alerts) || []).filter(a => a.t > store.get("lastSeen", "")).length;
  const b = $("#badge"); b.hidden = !fresh || tab === "alerts"; b.textContent = fresh;
}
async function render() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
  $("#fab").hidden = !(conf && conf.installed) || !["alerts", "stocks", "ideas"].includes(tab);
  setStatus();
  const v = $("#view");
  if (!conf || !conf.installed) { if (tab !== "bot") { v.innerHTML = viewSetup(); bindForms(); return; } }
  if (tab === "notes") { v.innerHTML = header("Notes", "") + '<p class="hint">Loading…</p>'; v.innerHTML = await viewNotesAsync(); return; }
  v.innerHTML = ({ alerts: viewAlerts, stocks: viewStocks, ideas: viewIdeas, bot: viewBot })[tab]();
  bindForms(); setStatus();
}
function bindForms() {
  const f = $("#connect");
  if (f) f.addEventListener("submit", async ev => {
    ev.preventDefault();
    const owner = f.owner.value.trim(), repo = f.repo.value.trim(), token = f.token.value.trim() || (conf && conf.token);
    if (!token) return toast("Paste your access key", true);
    const prev = conf; conf = Object.assign({}, conf || {}, { owner, repo, token });
    try {
      const r = await gh("/repos/" + owner + "/" + repo);
      if (!r.private) toast("Heads up: this repo is public, so anyone can see your stocks.", true);
      const cfgFile = await readFile("scanner.py");
      conf.installed = cfgFile.text != null;
      store.set("conf", conf) || toast("Couldn't save the key on this phone; you'll need to paste it again next time.", true);
      toast("Connected to " + owner + "/" + repo); render(); load(true);
    } catch (e) { conf = prev; toast(e.message, true); }
  });
}
function go(t) { tab = t; if (location.hash !== "#" + t) history.replaceState(null, "", "#" + t); render(); window.scrollTo({ top: 0, behavior: "smooth" }); }

document.querySelector("nav.tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) go(b.dataset.tab); });
$("#refresh").addEventListener("click", () => { notesCache = null; conf ? load() : toast("Connect your bot first (Bot → Setup)", true); });
$("#fab").addEventListener("click", () => logSheet());
document.addEventListener("click", async e => {
  const t = e.target;
  const card = t.closest(".alert");
  if (card && !t.closest("a,button")) { card.classList.toggle("open"); return; }
  const fb = t.closest("[data-filter]"); if (fb) { alertFilter = fb.dataset.filter; render(); return; }
  const lg = t.closest("[data-log]"); if (lg) { logSheet(lg.dataset.log); return; }
  const sd = t.closest("[data-sold]"); if (sd) { soldSheet(+sd.dataset.sold); return; }
  const nt = t.closest("[data-note]"); if (nt) { e.preventDefault(); openNote("vault/Stocks/" + nt.dataset.note + ".md"); return; }
  const np = t.closest("[data-path]"); if (np) { openNote(np.dataset.path); return; }
  const sg = t.closest(".seg button"); if (sg) { store.set(sg.parentElement.dataset.seg, sg.dataset.v); applyLook(); render(); return; }
  const act = t.closest("[data-act]"); if (!act) return;
  const a = act.dataset.act;
  if (a === "log") return logSheet();
  if (a === "install") return install();
  if (a === "checksecrets") return checkSecrets();
  if (a === "settings") return settingsSheet();
  if (a === "disconnect") { store.del("conf"); store.del("cache"); conf = null; dash = null; toast("Disconnected"); return render(); }
  if (a === "scan" || a === "test") {
    if (!conf || !conf.installed) return toast("Install the bot first (Bot → Setup)", true);
    act.disabled = true;
    try { await dispatch(a === "scan" ? "scan" : "test-alert"); toast(a === "scan" ? "Scan started. Results in about 1–2 minutes." : "Test alerts on the way. Check your phone in about a minute."); }
    catch (e) { toast(e.message, true); }
    finally { act.disabled = false; }
  }
});

function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const m = h.match(/^log-([A-Za-z.]+)-([\d.]+)$/);
  if (m) { tab = "stocks"; render(); setTimeout(() => logSheet(m[1].toUpperCase(), m[2]), 300); return; }
  if (["alerts", "stocks", "ideas", "notes", "bot"].includes(h)) tab = h;
  render();
}
window.addEventListener("hashchange", route);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(true); });
setInterval(() => { if (!document.hidden) load(true); }, 120000);

/* ---------- boot ---------- */
(function boot() {
  applyLook();
  const cache = store.get("cache", null);
  if (cache) { dash = cache.dash; holdings = { text: cache.holdingsText, sha: null }; }
  let seen = false; try { seen = sessionStorage.getItem("nt:booted"); sessionStorage.setItem("nt:booted", "1"); } catch (e) {}
  const bootEl = $("#boot"), lines = $("#bootlines");
  const finish = () => bootEl.classList.add("gone");
  if (seen || document.body.dataset.fx === "calm") finish();
  else {
    ["linking to market feed", conf ? "loading " + conf.owner + "/" + conf.repo : "no bot linked yet", "v" + APP_VERSION + " ready"]
      .forEach((l, i) => setTimeout(() => { const d = document.createElement("div"); d.textContent = "> " + l; d.style.animationDelay = "0s"; lines.appendChild(d); }, 180 + i * 260));
    setTimeout(finish, 1250);
    bootEl.addEventListener("click", finish);
  }
  route();
  if (conf) load(true);
})();
</script>
</body>
</html>
