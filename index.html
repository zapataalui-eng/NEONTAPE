<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neon Tape">
<meta name="theme-color" content="#080a1c">
<link rel="apple-touch-icon" href="icon.png">
<title>Neon Tape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#080a1c; --void2:#0d1030; --panel:#11143a; --panel2:#171b4a; --line:#2a3070;
  --ink:#eef0ff; --dim:#9aa1d6; --faint:#5f6699;
  --cyan:#3cf0ff; --magenta:#ff3ea5; --violet:#b07cff;
  --amber:#ffc23c; --blue:#5b8cff; --green:#2ef2a0; --red:#ff4d5e; --orange:#ff8a3d;
  --glow:0 0 18px rgba(60,240,255,.35);
  --display:"Chakra Petch",system-ui,sans-serif; --body:"Manrope",system-ui,sans-serif;
  --r-sm:8px; --r-md:14px; --r-lg:22px;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
[data-theme="light"]{
  --void:#e9ecf7; --void2:#dfe3f3; --panel:#ffffff; --panel2:#f3f5fd; --line:#c9cfe8;
  --ink:#12142b; --dim:#4c5480; --faint:#8a91b6;
  --cyan:#0089b8; --magenta:#c8166f; --violet:#6d3bd1;
  --amber:#a86c00; --blue:#2453d6; --green:#0b8f5c; --red:#c8253a; --orange:#c25510;
  --glow:0 0 0 rgba(0,0,0,0);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--void);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body{min-height:100dvh;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
a{color:var(--cyan)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* ---------- the city at night: grid horizon + scanlines ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:radial-gradient(120% 70% at 50% 0%, var(--void2) 0%, var(--void) 60%)}
.bg::before{content:"";position:absolute;left:-50%;right:-50%;bottom:-10%;height:55%;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;transform:perspective(420px) rotateX(62deg);transform-origin:bottom;opacity:.45;
  mask-image:linear-gradient(to top,#000 10%,transparent 85%);-webkit-mask-image:linear-gradient(to top,#000 10%,transparent 85%);
  animation:drive 6s linear infinite}
@keyframes drive{to{background-position:0 44px,0 0}}
.bg::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
[data-theme="light"] .bg::after{opacity:.4}

/* ---------- glitch type ---------- */
.glitch{position:relative;display:inline-block}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;inset:0;pointer-events:none;opacity:0}
.glitch::before{color:var(--cyan);transform:translateX(-2px)}
.glitch::after{color:var(--magenta);transform:translateX(2px)}
[data-fx="full"] .glitch::before{animation:sliceA 6s steps(1,end) infinite}
[data-fx="full"] .glitch::after{animation:sliceB 6s steps(1,end) infinite}
@keyframes sliceA{0%,88%,100%{opacity:0;clip-path:inset(0 0 100% 0)}
  89%{opacity:.9;clip-path:inset(12% 0 60% 0);transform:translateX(-4px)}
  91%{opacity:.9;clip-path:inset(55% 0 18% 0);transform:translateX(3px)}
  93%{opacity:.9;clip-path:inset(30% 0 45% 0);transform:translateX(-2px)}
  95%{opacity:0}}
@keyframes sliceB{0%,89%,100%{opacity:0;clip-path:inset(0 0 100% 0)}
  90%{opacity:.85;clip-path:inset(62% 0 8% 0);transform:translateX(4px)}
  92%{opacity:.85;clip-path:inset(5% 0 75% 0);transform:translateX(-3px)}
  94%{opacity:.85;clip-path:inset(40% 0 35% 0);transform:translateX(2px)}
  96%{opacity:0}}

/* ---------- boot sequence (the one orchestrated moment) ---------- */
#boot{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--void);transition:opacity .35s ease}
#boot.gone{opacity:0;pointer-events:none}
#boot .logo{font-family:var(--display);font-weight:700;font-size:44px;letter-spacing:.04em}
#boot .logo span{display:inline-block}
#boot .lines{font-family:var(--display);font-size:13px;color:var(--dim);margin-top:14px;min-height:60px}
#boot .lines div{opacity:0;animation:line .25s ease forwards}
@keyframes line{to{opacity:1}}
[data-fx="full"] #boot .logo{animation:jolt .9s steps(1,end) 1}
@keyframes jolt{0%{transform:translate(0)}10%{transform:translate(-3px,1px) skewX(-8deg);text-shadow:3px 0 var(--magenta),-3px 0 var(--cyan)}
  20%{transform:translate(2px,-1px);text-shadow:-2px 0 var(--magenta),2px 0 var(--cyan)}30%{transform:none;text-shadow:none}
  55%{transform:translate(1px,0) skewX(6deg);text-shadow:2px 0 var(--cyan)}60%{transform:none;text-shadow:none}}

/* ---------- layout ---------- */
header.top{position:sticky;top:0;z-index:20;padding:calc(var(--top) + 10px) 18px 10px;
  display:flex;align-items:center;gap:12px;
  background:linear-gradient(to bottom,var(--void) 60%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.word{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.03em;line-height:1}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--faint)}
.dot.on{background:var(--green);box-shadow:0 0 10px var(--green)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
.iconbtn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{padding:4px 16px calc(var(--bot) + 150px);max-width:640px;margin:0 auto}
h1.view{font-family:var(--display);font-weight:600;font-size:30px;margin:6px 2px 4px}
.sub{color:var(--dim);margin:0 2px 16px;font-size:15px}
h2.sec{font-family:var(--display);font-weight:600;font-size:19px;margin:26px 2px 10px;color:var(--ink)}

/* tab bar in the thumb zone */
nav.tabs{position:fixed;left:10px;right:10px;bottom:calc(var(--bot) + 10px);z-index:30;max-width:620px;margin:0 auto;
  display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px;border-radius:24px;
  background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(0,0,0,.45)}
nav.tabs button{min-height:54px;border:0;background:none;border-radius:18px;cursor:pointer;color:var(--dim);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;position:relative}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button[aria-current="page"]{color:var(--ink);background:var(--panel2)}
nav.tabs button[aria-current="page"] svg{color:var(--cyan);filter:drop-shadow(0 0 6px var(--cyan))}
nav.tabs .badge{position:absolute;top:6px;right:calc(50% - 20px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--magenta);color:#fff;font-size:11px;line-height:18px}

.fab{position:fixed;right:18px;bottom:calc(var(--bot) + 96px);z-index:29;height:52px;padding:0 20px 0 16px;border-radius:26px;
  border:1px solid var(--cyan);background:var(--panel);color:var(--ink);font-weight:700;display:flex;align-items:center;gap:8px;
  box-shadow:var(--glow);cursor:pointer}
.fab svg{width:20px;height:20px;color:var(--cyan)}
.fab[hidden],[hidden]{display:none !important}

/* ---------- cards ---------- */
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 14px 14px 18px;margin:10px 0;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,var(--line));box-shadow:0 0 14px var(--c,transparent)}
.alert{cursor:pointer}
.alert .t{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.25}
.alert .s{margin-top:4px;color:var(--ink);opacity:.9}
.alert .meta{margin-top:6px;font-size:12.5px;color:var(--faint)}
.alert .why{display:none;white-space:pre-wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:14.5px;color:var(--dim)}
.alert.open .why{display:block}
.alert .acts{display:none;margin-top:10px;gap:8px;flex-wrap:wrap}
.alert.open .acts{display:flex}
[data-fx="full"] .fresh{animation:glitchin .55s steps(1,end) 1}
@keyframes glitchin{0%{opacity:0;transform:translateX(-8px);filter:hue-rotate(90deg)}
  15%{opacity:1;transform:translateX(6px) skewX(-6deg);clip-path:inset(20% 0 40% 0)}
  30%{transform:translateX(-3px);clip-path:inset(60% 0 5% 0)}
  45%{transform:none;clip-path:inset(0);filter:none}100%{opacity:1}}
.fresh .t::after{content:"new";margin-left:8px;font-family:var(--body);font-size:11px;font-weight:700;padding:2px 7px;border-radius:9px;background:var(--magenta);color:#fff;vertical-align:3px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chip{flex:none;min-height:40px;padding:0 15px;border-radius:20px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;font-size:14px;color:var(--dim)}
.chip[aria-pressed="true"]{border-color:var(--cyan);color:var(--ink);box-shadow:var(--glow)}

.btn{min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn.primary{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#060716;border:0}
[data-theme="light"] .btn.primary{color:#fff}
.btn.danger{border-color:var(--red);color:var(--red);background:transparent}
.btn.small{min-height:40px;padding:0 14px;font-size:14px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5}

/* stock cards */
.stock .row{display:flex;align-items:baseline;gap:10px}
.sym{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em}
.big{font-family:var(--display);font-weight:700;font-size:26px;margin-left:auto;font-variant-numeric:tabular-nums}
.up{color:var(--green)} .down{color:var(--red)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kv div{background:var(--panel2);border-radius:var(--r-sm);padding:8px 10px}
.kv b{display:block;font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums}
.kv small{color:var(--faint);font-size:12px}
.advice{display:inline-block;margin-top:10px;padding:6px 12px;border-radius:12px;font-weight:700;font-size:14px;background:var(--panel2);border:1px solid var(--c,var(--line));color:var(--ink)}
.reasons{margin:10px 0 0;padding:0;list-style:none;font-size:14px;color:var(--dim)}
.reasons li{padding:3px 0}

.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.li:first-child{border-top:0}
.li .n{font-family:var(--display);color:var(--faint);width:26px;font-variant-numeric:tabular-nums}
.li .main{flex:1;min-width:0}
.li .main b{font-family:var(--display);font-size:17px}
.li .main small{display:block;color:var(--faint);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .r{text-align:right;font-family:var(--display);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:9px;border:1px solid var(--c);color:var(--c)}

.empty{text-align:center;color:var(--dim);padding:40px 10px}
.empty .glyph{font-family:var(--display);font-size:40px;color:var(--faint)}

/* meters */
.meter{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--magenta))}
.meter.out i{background:var(--red)}

/* forms + sheet */
.sheet-back{position:fixed;inset:0;z-index:40;background:rgba(3,4,14,.6);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-back.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88dvh;overflow:auto;background:var(--panel);border-top:1px solid var(--cyan);
  border-radius:24px 24px 0 0;padding:10px 18px calc(var(--bot) + 22px);transform:translateY(105%);visibility:hidden;
  transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s linear .32s;box-shadow:0 -10px 40px rgba(0,0,0,.5);max-width:640px;margin:0 auto}
.sheet.on{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s}
.sheet .close{position:sticky;top:0;float:right;margin:-2px -6px 0 0;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
  background:var(--panel2);cursor:pointer;display:grid;place-items:center;z-index:2}
.sheet .close svg{width:18px;height:18px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h3{font-family:var(--display);font-size:22px;margin:4px 0 12px}
label.f{display:block;margin:12px 0}
label.f span{display:block;font-size:14px;color:var(--dim);margin-bottom:6px;font-weight:600}
label.f input,label.f select{width:100%;min-height:50px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--void);font-size:17px}
label.f input:focus,label.f select:focus{border-color:var(--cyan);outline:none;box-shadow:var(--glow)}
.hint{font-size:13.5px;color:var(--faint);margin:4px 2px}
.md{font-size:15px}
.md h1,.md h2{font-family:var(--display)} .md h1{font-size:24px} .md h2{font-size:18px;margin-top:20px}
.md li{margin:4px 0}

/* setup steps: a real sequence, so numbered */
.step{display:flex;gap:14px;margin:14px 0}
.step .num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;border:1px solid var(--line);color:var(--dim)}
.step.done .num{border-color:var(--green);color:var(--green)}
.step.now .num{border-color:var(--cyan);color:var(--cyan);box-shadow:var(--glow)}
.step .body{flex:1}
.step h4{margin:4px 0 6px;font-family:var(--display);font-size:18px}
.step p{margin:4px 0;color:var(--dim);font-size:14.5px}
.perm{font-size:14px;color:var(--dim);margin:6px 0;padding-left:18px}
.prog{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--magenta));transition:width .2s}
.secret{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14.5px}
.secret code{font-family:var(--display);font-size:14px}
.ok{color:var(--green)} .no{color:var(--faint)}

#toast{position:fixed;left:50%;top:calc(var(--top) + 70px);z-index:60;transform:translate(-50%,-14px);opacity:0;
  background:var(--panel2);border:1px solid var(--cyan);padding:12px 18px;border-radius:14px;font-weight:600;transition:all .25s;max-width:90vw;box-shadow:var(--glow)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.err{border-color:var(--red)}

.seg{display:flex;background:var(--void);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border:0;border-radius:10px;background:none;cursor:pointer;font-weight:700;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--cyan)}

@media (prefers-reduced-motion: reduce){
  .bg::before{animation:none}
  .glitch::before,.glitch::after{display:none}
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body data-fx="full">
<div class="bg" aria-hidden="true"></div>

<div id="boot" aria-hidden="true">
  <div style="text-align:center">
    <div class="logo"><span class="glitch" data-text="NEON TAPE">NEON TAPE</span></div>
    <div class="lines" id="bootlines"></div>
  </div>
</div>

<header class="top">
  <div class="word glitch" data-text="NEON TAPE">NEON TAPE</div>
  <div class="status"><span class="dot" id="mdot"></span><span id="mtext">offline</span></div>
  <button class="iconbtn" id="refresh" aria-label="Refresh">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
  </button>
</header>

<main id="view"></main>

<button class="fab" id="fab" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  Log a buy
</button>

<nav class="tabs" aria-label="Sections">
  <button data-tab="alerts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>Alerts<span class="badge" id="badge" hidden></span></button>
  <button data-tab="stocks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Stocks</button>
  <button data-tab="ideas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>Ideas</button>
  <button data-tab="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h12l4 4v12H4z"/><path d="M8 12h8M8 16h5"/></svg>Notes</button>
  <button data-tab="bot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 3v4M9 12h.01M15 12h.01M9 16h6"/></svg>Bot</button>
</nav>

<div class="sheet-back" id="sheetback"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><button class="close" id="sheetclose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="grab"></div><div id="sheetbody"></div></div>

<script type="application/json" id="botfiles">{"scanner.py": "#!/usr/bin/env python3\n\"\"\"\nStock Alerts: scans strong US stocks and sends loud alerts to your iPhone.\n\nWhat it does every 15 minutes while the market is open:\n  1. Ranks a list of liquid stocks by MOMENTUM (the factor leading in 2026):\n     12-month and 6-month gains, closeness to the 52-week high, trend strength.\n  2. Sends a BUY SETUP alert when a top-ranked stock is in an uptrend, is not\n     overextended, and the whole market is healthy (SPY above its 200-day).\n  3. Watches the stocks YOU bought (holdings.txt) and alerts using your rules:\n       - SELL NOW       price is 2%+ below your buy price      (emergency alert)\n       - NEAR STOP      price is about to hit that -2% line\n       - SELL WARNING   a gain is fading back toward your buy price\n       - SELL OFFER     price is 2%+ above your buy price, with HOLD/SELL advice\n  4. Reads the news (Benzinga feed via Alpaca) for your stocks and the market,\n     rates each story (keyword rules, or Claude if you add an API key), alerts\n     you on big stories about stocks you own, and blocks buys after bad news.\n  5. Suggests a position size for your account and shows what a move means in dollars.\n  6. Sends a summary near the close.\n\nCommands:\n  python scanner.py scan         one full run (what GitHub runs every 15 min)\n  python scanner.py report       print the rankings and your holdings (no alerts)\n  python scanner.py test-alert   send sample alerts to your phone\n  python scanner.py backtest     test the buy setup + your 2%/2% rules on past data\n\nStandard library only (Python 3.9+). Not financial advice.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport json\nimport math\nimport os\nimport re\nimport sys\nimport urllib.error\nimport urllib.parse\nimport urllib.request\nfrom dataclasses import dataclass, field\nfrom datetime import date, datetime, timedelta\nfrom pathlib import Path\n\nHERE = Path(__file__).resolve().parent\nTRADING_URL = \"https://paper-api.alpaca.markets\"   # only used for the market clock\nDATA_URL = \"https://data.alpaca.markets\"\nPUSHOVER_URL = \"https://api.pushover.net/1/messages.json\"\nCLAUDE_URL = \"https://api.anthropic.com/v1/messages\"\nAV_URL = \"https://www.alphavantage.co/query\"\nLUNAR_URL = \"https://lunarcrush.com/api4\"\nFD_URL = \"https://api.financialdatasets.ai\"\nGNEWS_URL = \"https://news.google.com/rss/search\"\nYAHOO_RSS_URL = \"https://feeds.finance.yahoo.com/rss/2.0/headline\"\n\nDEFAULT_CONFIG = {\n    # Your sell rules (percent)\n    \"stop_pct\": 2.0,             # SELL NOW when this far below your buy price\n    \"near_stop_gap_pct\": 0.5,    # NEAR STOP fires this close to the stop line (-1.5%)\n    \"warn_band_pct\": 0.5,        # SELL WARNING when a gain fades to +0.5% or less...\n    \"warn_arm_pct\": 1.5,         # ...but only after the stock was up at least +1.5%\n    \"profit_pct\": 2.0,           # SELL OFFER at +2%\n    \"profit_step_pct\": 2.0,      # and again at +4%, +6%... if you keep holding\n\n    # Buy setup filters\n    \"top_n\": 15,                 # only the 15 highest-ranked stocks can trigger a buy\n    \"rsi_min\": 45, \"rsi_max\": 72,\n    \"max_from_high_pct\": 10.0,   # within 10% of the 52-week high\n    \"max_above_sma20_pct\": 6.0,  # not more than 6% above the 20-day average (no chasing)\n    \"max_atr_pct\": 3.0,          # skip stocks that swing more than 3% on a normal day\n    \"max_buy_alerts_per_day\": 3,\n    \"require_green_day\": True,   # price above yesterday's close when the alert fires\n\n    # Phone alerts. Pushover priority: 0 normal, 1 high, 2 emergency (repeats until you tap)\n    \"priority_buy\": 1, \"priority_profit\": 1, \"priority_warning\": 1,\n    \"priority_near_stop\": 1, \"priority_stop\": 2, \"priority_summary\": 0,\n    \"emergency_retry_sec\": 60, \"emergency_expire_sec\": 900,\n    \"sound_buy\": \"cashregister\", \"sound_sell\": \"siren\",\n    \"chart_url\": \"https://finance.yahoo.com/quote/{symbol}\",\n    \"holdings_edit_url\": \"\",     # e.g. https://github.com/YOU/stock-alerts/edit/main/holdings.txt\n    \"summary_minutes_before_close\": 25,\n\n    # Your money and risk\n    \"account_size\": 30.0,        # dollars you trade with\n    \"risk_per_trade_pct\": 1.0,   # most you want to lose on one trade if the stop hits (% of account)\n    \"max_position_pct\": 50.0,    # never put more than this % of the account in one stock\n    \"risk_level\": \"moderate\",    # \"low\" (calm stocks only), \"moderate\", or \"any\"\n\n    # News\n    \"news\": True,\n    \"news_ai_model\": \"claude-haiku-5-5\",   # used only if ANTHROPIC_API_KEY is set\n    \"news_alert_min_strength\": 2,          # 1 small, 2 medium, 3 large\n    \"news_alert_min_confidence\": 0.5,\n    \"news_block_buy_score\": -0.4,          # skip buys when recent news is this negative\n    \"horizon_ai\": True,                    # ask Claude (web search: news + forums) how long to hold\n    \"horizon_ai_model\": \"claude-haiku-5-5\",\n    \"web_search_tool\": \"web_search_20250305\",\n    \"web_search_max_uses\": 2,              # each search costs about 1 cent\n    \"priority_news\": 1, \"priority_market_news\": 0,\n    \"max_market_news_alerts_per_day\": 2,\n\n    # Research order: free sources first, paid only when needed\n    \"research_min_articles\": 15,           # read at least this many articles...\n    \"research_min_sites\": 10,              # ...from at least this many different sites before paying\n    \"research_cache_hours\": 4,\n    \"earnings_blackout_days\": 2,           # no buy alerts this close to an earnings report\n    \"budget_alphavantage\": 20,             # calls per day (free key = 25/day; leaves some for you in Claude)\n    \"budget_lunarcrush\": 500,              # calls per month (you have about 1,000; leaves half for you)\n    \"budget_financialdatasets\": 100,       # calls per month\n    \"budget_claude\": 6,                    # calls per day: only when really needed\n    \"priority_budget\": 0, \"priority_ideas\": 0,\n    \"ideas_watch_days\": 5, \"max_extra_watch\": 8,\n\n    \"data_feed\": \"iex\",          # free Alpaca data\n    \"universe\": [],\n}\n\nRISK_LEVEL_ATR = {\"low\": 1.5, \"moderate\": 2.5, \"any\": 100.0}\n\nDEFAULT_UNIVERSE = [\n    # Tech / semis\n    \"AAPL\", \"MSFT\", \"NVDA\", \"AMZN\", \"GOOGL\", \"META\", \"AVGO\", \"TSLA\", \"AMD\", \"NFLX\",\n    \"ORCL\", \"CRM\", \"ADBE\", \"QCOM\", \"MU\", \"TXN\", \"AMAT\", \"LRCX\", \"KLAC\", \"ANET\",\n    \"PANW\", \"CRWD\", \"NOW\", \"SHOP\", \"UBER\", \"PLTR\", \"INTU\", \"IBM\", \"CSCO\", \"DELL\",\n    # Financials\n    \"JPM\", \"BAC\", \"WFC\", \"GS\", \"MS\", \"V\", \"MA\", \"AXP\", \"SCHW\", \"BLK\",\n    # Health\n    \"LLY\", \"UNH\", \"JNJ\", \"ABBV\", \"MRK\", \"TMO\", \"ISRG\", \"AMGN\", \"VRTX\", \"BSX\",\n    # Consumer\n    \"COST\", \"WMT\", \"HD\", \"MCD\", \"NKE\", \"KO\", \"PEP\", \"PG\", \"DIS\", \"SBUX\",\n    # Industrial / energy / other\n    \"CAT\", \"DE\", \"GE\", \"HON\", \"RTX\", \"LMT\", \"UNP\", \"XOM\", \"CVX\", \"NEE\",\n    # Broad funds\n    \"QQQ\", \"SPY\",\n]\nMARKET = \"SPY\"\n\n\n# =============================================================================\n# Files, config, keys\n# =============================================================================\n\ndef load_config(path: Path | None = None) -> dict:\n    path = path or HERE / \"config.json\"\n    cfg = json.loads(json.dumps(DEFAULT_CONFIG))\n    if path.exists():\n        user = json.loads(path.read_text(encoding=\"utf-8\"))\n        for k, v in user.items():\n            if k.startswith(\"_\"):\n                continue\n            if k not in DEFAULT_CONFIG:\n                print(f\"Warning: unknown config key '{k}' ignored\")\n                continue\n            cfg[k] = v\n    if not cfg[\"universe\"]:\n        cfg[\"universe\"] = list(DEFAULT_UNIVERSE)\n    cfg[\"universe\"] = [s.strip().upper() for s in cfg[\"universe\"] if s.strip()]\n    for k in (\"stop_pct\", \"profit_pct\", \"profit_step_pct\"):\n        if not 0 < float(cfg[k]) <= 50:\n            sys.exit(f\"Config problem: {k} must be between 0 and 50\")\n    if cfg[\"risk_level\"] not in RISK_LEVEL_ATR:\n        sys.exit('Config problem: risk_level must be \"low\", \"moderate\" or \"any\"')\n    if float(cfg[\"account_size\"]) <= 0:\n        sys.exit(\"Config problem: account_size must be more than 0\")\n    if cfg[\"near_stop_gap_pct\"] >= cfg[\"stop_pct\"]:\n        sys.exit(\"Config problem: near_stop_gap_pct must be smaller than stop_pct\")\n    for k in [k for k in cfg if k.startswith(\"priority_\")]:\n        if cfg[k] not in (-2, -1, 0, 1, 2):\n            sys.exit(f\"Config problem: {k} must be -2, -1, 0, 1 or 2\")\n    return cfg\n\n\ndef load_env(path: Path | None = None) -> None:\n    path = path or HERE / \".env\"\n    if not path.exists():\n        return\n    for line in path.read_text(encoding=\"utf-8\").splitlines():\n        line = line.strip()\n        if line and not line.startswith(\"#\") and \"=\" in line:\n            k, v = line.split(\"=\", 1)\n            os.environ.setdefault(k.strip(), v.strip().strip('\"').strip(\"'\"))\n\n\n@dataclass\nclass Holding:\n    symbol: str\n    buy_price: float\n    bought: str = \"\"\n    shares: float | None = None\n\n    @property\n    def key(self) -> str:\n        return f\"{self.symbol}|{self.buy_price:g}|{self.bought}\"\n\n\ndef parse_holdings(text: str) -> tuple[list[Holding], list[str]]:\n    \"\"\"\n    One stock per line:   SYMBOL  BUY_PRICE  [YYYY-MM-DD]  [SHARES]\n    Examples:             NVDA 182.50\n                          AMD 155.60 2026-11-18 0.19\n    Lines starting with # are ignored. '$' and commas are allowed in numbers.\n    \"\"\"\n    holdings, errors = [], []\n    for n, raw in enumerate(text.splitlines(), 1):\n        line = raw.split(\"#\", 1)[0].strip()\n        if not line:\n            continue\n        parts = line.replace(\",\", \"\").split()\n        try:\n            sym = parts[0].upper()\n            if not sym.replace(\".\", \"\").isalpha() or len(sym) > 6:\n                raise ValueError(\"bad symbol\")\n            price = float(parts[1].replace(\"$\", \"\"))\n            if price <= 0:\n                raise ValueError(\"price must be > 0\")\n            bought, shares = \"\", None\n            for extra in parts[2:]:\n                if len(extra) == 10 and extra[4] == \"-\" and extra[7] == \"-\":\n                    date.fromisoformat(extra)\n                    bought = extra\n                else:\n                    shares = float(extra.replace(\"$\", \"\"))\n            holdings.append(Holding(sym, price, bought, shares))\n        except IndexError:\n            errors.append(f\"line {n} '{raw.strip()}': write it as SYMBOL PRICE, like NVDA 182.50\")\n        except ValueError as e:\n            why = \"price isn't a number\" if \"float\" in str(e) else str(e)\n            errors.append(f\"line {n} '{raw.strip()}': {why}\")\n    return holdings, errors\n\n\ndef load_holdings(path: Path | None = None) -> tuple[list[Holding], list[str]]:\n    path = path or HERE / \"holdings.txt\"\n    if not path.exists():\n        return [], []\n    return parse_holdings(path.read_text(encoding=\"utf-8\"))\n\n\ndef load_state(path: Path | None = None) -> dict:\n    path = path or HERE / \"state.json\"\n    try:\n        return json.loads(path.read_text(encoding=\"utf-8\"))\n    except (FileNotFoundError, ValueError):\n        return {}\n\n\ndef save_state(state: dict, path: Path | None = None) -> None:\n    path = path or HERE / \"state.json\"\n    path.write_text(json.dumps(state, indent=1, sort_keys=True) + \"\\n\", encoding=\"utf-8\")\n\n\n# =============================================================================\n# Alpaca market data (free account; used for prices only, never trades)\n# =============================================================================\n\nclass ApiError(Exception):\n    pass\n\n\ndef http_json(method: str, url: str, headers: dict | None = None,\n              params: dict | None = None, form: dict | None = None, timeout: int = 30,\n              body: dict | None = None):\n    if params:\n        url += \"?\" + urllib.parse.urlencode(params)\n    data = urllib.parse.urlencode(form).encode() if form is not None else None\n    hdrs = {\"User-Agent\": \"stock-alerts/1.0\", **(headers or {})}\n    if body is not None:\n        data = json.dumps(body).encode()\n        hdrs[\"Content-Type\"] = \"application/json\"\n    req = urllib.request.Request(url, data=data, method=method, headers=hdrs)\n    try:\n        with urllib.request.urlopen(req, timeout=timeout) as r:\n            raw = r.read()\n            return json.loads(raw) if raw else None\n    except urllib.error.HTTPError as e:\n        body = e.read().decode(errors=\"replace\")[:300]\n        raise ApiError(f\"HTTP {e.code} from {urllib.parse.urlparse(url).netloc}: {body}\") from None\n    except urllib.error.URLError as e:\n        raise ApiError(f\"could not reach {urllib.parse.urlparse(url).netloc}: {e.reason}\") from None\n\n\nclass Alpaca:\n    def __init__(self, key: str, secret: str, feed: str = \"iex\"):\n        self.h = {\"APCA-API-KEY-ID\": key, \"APCA-API-SECRET-KEY\": secret, \"Accept\": \"application/json\"}\n        self.feed = feed\n\n    @classmethod\n    def from_env(cls, feed: str) -> \"Alpaca\":\n        load_env()\n        k, s = os.environ.get(\"APCA_API_KEY_ID\", \"\"), os.environ.get(\"APCA_API_SECRET_KEY\", \"\")\n        if not k or not s:\n            sys.exit(\"Missing APCA_API_KEY_ID / APCA_API_SECRET_KEY (GitHub secrets or .env).\")\n        return cls(k, s, feed)\n\n    def clock(self) -> dict:\n        return http_json(\"GET\", f\"{TRADING_URL}/v2/clock\", self.h)\n\n    def daily_bars(self, symbols: list[str], start: date) -> dict[str, list[dict]]:\n        out: dict[str, list[dict]] = {}\n        for i in range(0, len(symbols), 50):\n            chunk = symbols[i:i + 50]\n            params = {\"symbols\": \",\".join(chunk), \"timeframe\": \"1Day\", \"start\": start.isoformat(),\n                      \"adjustment\": \"all\", \"feed\": self.feed, \"limit\": 10000, \"sort\": \"asc\"}\n            while True:\n                page = http_json(\"GET\", f\"{DATA_URL}/v2/stocks/bars\", self.h, params) or {}\n                for sym, bars in (page.get(\"bars\") or {}).items():\n                    out.setdefault(sym, []).extend(bars)\n                token = page.get(\"next_page_token\")\n                if not token:\n                    break\n                params[\"page_token\"] = token\n        return out\n\n    def news(self, start_iso: str, max_pages: int = 6) -> list[dict]:\n        \"\"\"Benzinga headlines since start_iso, newest first (all tickers).\"\"\"\n        params = {\"start\": start_iso, \"limit\": 50, \"sort\": \"desc\", \"include_content\": \"false\"}\n        items: list[dict] = []\n        for _ in range(max_pages):\n            page = http_json(\"GET\", f\"{DATA_URL}/v1beta1/news\", self.h, params) or {}\n            items.extend(page.get(\"news\") or [])\n            token = page.get(\"next_page_token\")\n            if not token:\n                break\n            params[\"page_token\"] = token\n        return items\n\n    def live_prices(self, symbols: list[str]) -> dict[str, float]:\n        prices = {}\n        for i in range(0, len(symbols), 100):\n            chunk = symbols[i:i + 100]\n            data = http_json(\"GET\", f\"{DATA_URL}/v2/stocks/snapshots\", self.h,\n                             {\"symbols\": \",\".join(chunk), \"feed\": self.feed}) or {}\n            data = data.get(\"snapshots\", data)\n            for sym, snap in data.items():\n                if not snap:\n                    continue\n                p = ((snap.get(\"latestTrade\") or {}).get(\"p\")\n                     or (snap.get(\"minuteBar\") or {}).get(\"c\")\n                     or (snap.get(\"dailyBar\") or {}).get(\"c\"))\n                if p:\n                    prices[sym] = float(p)\n        return prices\n\n\n# =============================================================================\n# Indicators (computed once per symbol as full series; reused by the backtest)\n# =============================================================================\n\ndef sma_series(x: list[float], n: int) -> list[float | None]:\n    out, s = [None] * len(x), 0.0\n    for i, v in enumerate(x):\n        s += v\n        if i >= n:\n            s -= x[i - n]\n        if i >= n - 1:\n            out[i] = s / n\n    return out\n\n\ndef rsi_series(c: list[float], n: int = 14) -> list[float | None]:\n    out = [None] * len(c)\n    if len(c) <= n:\n        return out\n    gains = [max(c[i] - c[i - 1], 0) for i in range(1, len(c))]\n    losses = [max(c[i - 1] - c[i], 0) for i in range(1, len(c))]\n    ag, al = sum(gains[:n]) / n, sum(losses[:n]) / n\n    def val(g, l):\n        return 100.0 if l == 0 else 100 - 100 / (1 + g / l)\n    out[n] = val(ag, al)\n    for i in range(n + 1, len(c)):\n        ag = (ag * (n - 1) + gains[i - 1]) / n\n        al = (al * (n - 1) + losses[i - 1]) / n\n        out[i] = val(ag, al)\n    return out\n\n\ndef atr_series(h, l, c, n: int = 14) -> list[float | None]:\n    out = [None] * len(c)\n    if len(c) <= n:\n        return out\n    tr = [h[0] - l[0]] + [max(h[i] - l[i], abs(h[i] - c[i - 1]), abs(l[i] - c[i - 1]))\n                          for i in range(1, len(c))]\n    a = sum(tr[1:n + 1]) / n\n    out[n] = a\n    for i in range(n + 1, len(c)):\n        a = (a * (n - 1) + tr[i]) / n\n        out[i] = a\n    return out\n\n\ndef rolling_max(x: list[float], n: int) -> list[float]:\n    from collections import deque\n    out, dq = [], deque()\n    for i, v in enumerate(x):\n        while dq and x[dq[-1]] <= v:\n            dq.pop()\n        dq.append(i)\n        if dq[0] <= i - n:\n            dq.popleft()\n        out.append(x[dq[0]])\n    return out\n\n\n@dataclass\nclass Series:\n    dates: list[str]\n    o: list[float]; h: list[float]; l: list[float]; c: list[float]\n    sma20: list; sma50: list; sma200: list; rsi: list; atr: list; high252: list\n\n    @classmethod\n    def from_bars(cls, bars: list[dict]) -> \"Series\":\n        d = [b[\"t\"][:10] for b in bars]\n        o, h, l, c = ([float(b[k]) for b in bars] for k in (\"o\", \"h\", \"l\", \"c\"))\n        return cls(d, o, h, l, c, sma_series(c, 20), sma_series(c, 50), sma_series(c, 200),\n                   rsi_series(c), atr_series(h, l, c), rolling_max(h, 252))\n\n    def __len__(self):\n        return len(self.c)\n\n\nMIN_HISTORY = 253  # 12-month momentum needs about a year of trading days\n\n\n@dataclass\nclass Metrics:\n    symbol: str\n    price: float\n    prev_close: float\n    sma20: float; sma50: float; sma200: float; sma200_prev: float\n    rsi: float\n    atr_pct: float\n    ret_12_1: float      # % gain from 12 months ago to 1 month ago (classic momentum)\n    ret_6_1: float       # % gain from 6 months ago to 1 month ago\n    high_52w: float\n    score: float = 0.0\n    rank: int = 0\n    of: int = 0\n    big_move_pct: float = 0.0   # its real \"big day\": 95th percentile of daily moves over the last year\n\n    @property\n    def day_chg_pct(self) -> float:\n        return (self.price / self.prev_close - 1) * 100\n\n    @property\n    def from_high_pct(self) -> float:\n        return (1 - self.price / self.high_52w) * 100 if self.high_52w else 0.0\n\n    @property\n    def above_sma20_pct(self) -> float:\n        return (self.price / self.sma20 - 1) * 100\n\n\ndef metrics_at(sym: str, s: Series, i: int, price: float | None = None) -> Metrics | None:\n    \"\"\"Metrics using finished day i. `price` overrides the latest price (live intraday).\"\"\"\n    if i < MIN_HISTORY or s.sma200[i] is None or s.sma200[i - 20] is None or s.rsi[i] is None:\n        return None\n    p = price if price is not None else s.c[i]\n    prev = s.c[i] if price is not None else s.c[i - 1]\n    return Metrics(\n        symbol=sym, price=p, prev_close=prev,\n        sma20=s.sma20[i], sma50=s.sma50[i], sma200=s.sma200[i], sma200_prev=s.sma200[i - 20],\n        rsi=s.rsi[i], atr_pct=s.atr[i] / s.c[i] * 100,\n        ret_12_1=(s.c[i - 21] / s.c[i - 252] - 1) * 100,\n        ret_6_1=(s.c[i - 21] / s.c[i - 126] - 1) * 100,\n        high_52w=max(s.high252[i], p),\n        big_move_pct=_big_move(s.c, i),\n    )\n\n\ndef _big_move(c: list[float], i: int) -> float:\n    moves = sorted(abs(c[j] / c[j - 1] - 1) * 100 for j in range(max(1, i - 251), i + 1))\n    return round(moves[int(len(moves) * 0.95) - 1], 2) if len(moves) >= 20 else 0.0\n\n\ndef pct_ranks(values: list[float]) -> list[float]:\n    \"\"\"0-100 percentile of each value within the list (ties share the average rank).\"\"\"\n    n = len(values)\n    if n == 1:\n        return [100.0]\n    order = sorted(range(n), key=lambda k: values[k])\n    ranks = [0.0] * n\n    i = 0\n    while i < n:\n        j = i\n        while j + 1 < n and values[order[j + 1]] == values[order[i]]:\n            j += 1\n        avg = (i + j) / 2\n        for k in range(i, j + 1):\n            ranks[order[k]] = avg / (n - 1) * 100\n        i = j + 1\n    return ranks\n\n\ndef score_all(ms: list[Metrics]) -> list[Metrics]:\n    \"\"\"Momentum score 0-100: 40% 12-1m return, 30% 6-1m, 20% near 52w high, 10% above 200d.\"\"\"\n    if not ms:\n        return ms\n    r12 = pct_ranks([m.ret_12_1 for m in ms])\n    r6 = pct_ranks([m.ret_6_1 for m in ms])\n    hi = pct_ranks([-m.from_high_pct for m in ms])\n    tr = pct_ranks([m.price / m.sma200 for m in ms])\n    for k, m in enumerate(ms):\n        m.score = 0.4 * r12[k] + 0.3 * r6[k] + 0.2 * hi[k] + 0.1 * tr[k]\n    ms.sort(key=lambda m: m.score, reverse=True)\n    for k, m in enumerate(ms, 1):\n        m.rank, m.of = k, len(ms)\n    return ms\n\n\n# =============================================================================\n# News: Benzinga headlines (via Alpaca), rated by keyword rules or by Claude\n# =============================================================================\n\nMACRO_TICKERS = {\"SPY\", \"QQQ\", \"DIA\", \"IWM\", \"VOO\", \"VTI\"}\nMARKET_KEY = \"_MARKET\"\nNEWS_KEEP_HOURS = 72\nNEWS_HALF_LIFE_HOURS = 24\n\n# (category, direction, strength 1-3, pattern). Several can match; they add up.\nNEWS_RULES = [\n    (\"bankruptcy\", -1, 3, r\"\\b(bankrupt\\w*|chapter 11|going.concern|delist\\w*)\"),\n    (\"scandal\", -1, 3, r\"\\b(scandal|misconduct|affairs?|spy|spying|brib\\w*|embezzl\\w*|fraud\\w*|accounting irregular\\w*)\\b\"),\n    (\"leadership exit\", -1, 2, r\"\\b(ceo|cfo|chief executive|founder|chairman)\\b.{0,60}\\b(resign\\w*|steps? down|stepping down|ousted|fired|departs?|departure|exits?|leaves|oust\\w*)\"),\n    (\"earnings beat\", 1, 2, r\"\\b(beats?|tops?|surpass\\w*|exceeds?|crush\\w*)\\b.{0,40}\\b(estimates?|expectations?|consensus|views?)\"),\n    (\"raised guidance\", 1, 2, r\"\\b(raises?|boosts?|lifts?|hikes?|strong)\\b.{0,30}\\b(guidance|outlook|forecast)\"),\n    (\"earnings miss\", -1, 2, r\"\\b(miss(es|ed)?|falls? short)\\b.{0,40}\\b(estimates?|expectations?|consensus)\"),\n    (\"cut guidance\", -1, 2, r\"\\b(cuts?|lowers?|slashes?|reduces?|withdraws?|weak)\\b.{0,30}\\b(guidance|outlook|forecast)|\\b(profit|revenue|sales) warning\\b\"),\n    (\"analyst upgrade\", 1, 1, r\"\\bupgrad\\w*|\\b(raises?|boosts?|lifts?)\\b.{0,25}\\bprice target|\\bprice target\\b.{0,15}\\braised\"),\n    (\"analyst downgrade\", -1, 1, r\"\\bdowngrad\\w*|\\b(cuts?|lowers?|slashes?|halves?)\\b.{0,25}\\bprice target\"),\n    (\"legal / probe\", -1, 2, r\"\\b(sec|doj|ftc|justice department|regulators?|congress\\w*|house committees?)\\b.{0,40}\\b(probe\\w*|investigat\\w*|charges?|sues?|subpoena\\w*|summon\\w*|testify)|\\bclass action\\b|\\bindict\\w*|\\bantitrust\\b|\\bsued\\b\"),\n    (\"FDA approval\", 1, 3, r\"\\bfda\\b.{0,30}\\bapprov\\w*\"),\n    (\"FDA setback\", -1, 3, r\"\\bfda\\b.{0,30}\\b(reject\\w*|declin\\w*)|complete response letter|clinical hold|trial fail\\w*\"),\n    (\"takeover target\", 1, 3, r\"\\b(to be acquired|agrees? to be (bought|acquired)|buyout offer|takeover (bid|offer)|acquired by)\\b\"),\n    (\"share offering\", -1, 2, r\"\\b(public|secondary|stock|share|equity) offering\\b|\\bshare sale\\b|\\bdilut\\w*\"),\n    (\"buyback / dividend\", 1, 1, r\"\\bbuyback\\b|\\brepurchase\\b|\\b(raises?|hikes?|increases?)\\b.{0,15}\\bdividend\"),\n    (\"big contract / deal\", 1, 1, r\"\\b(wins?|awarded|secures?|lands?)\\b.{0,30}\\b(contract|order|deal)\\b\"),\n    (\"product / security problem\", -1, 2, r\"\\brecall\\w*|\\boutage\\b|\\bdata breach\\b|\\bhacked\\b|\\bcyberattack\\b|\\bhalts? production\"),\n    (\"trade / export risk\", -1, 2, r\"\\bexport (bans?|restrictions?|curbs?|controls?)\\b|\\btariffs?\\b|\\bsanction\\w*\"),\n    (\"rate cut / cooling inflation\", 1, 2, r\"\\b(rate cuts?|cuts? (interest )?rates)\\b|\\binflation (cools|cooled|eases|eased|slows|slowed)\"),\n    (\"rate hike / hot inflation\", -1, 2, r\"\\b(rate hikes?|raises? (interest )?rates)\\b|\\binflation (heats|accelerat\\w*|jumps|hotter|surges)|\\brecession\\b|\\bgovernment shutdown\\b\"),\n]\nNEWS_RULES = [(c, d, st, re.compile(p, re.I)) for c, d, st, p in NEWS_RULES]\nMACRO_WORDS = re.compile(r\"\\b(fed|federal reserve|fomc|powell|inflation|cpi|pce|jobs report|payrolls|\"\n                         r\"unemployment|gdp|tariffs?|recession|treasury yields?|rate (cut|hike)s?|shutdown)\\b\", re.I)\nHEDGE_WORDS = re.compile(r\"\\b(reportedly|rumou?rs?|rumou?red|considering|weighs|could|may|might|denies|\"\n                         r\"explor\\w*|in talks|sources say|speculat\\w*)\\b\", re.I)\nOPINION_HEADLINE = re.compile(r\"^(why|what|how|should|is|are|will|\\d+ (stocks?|reasons?)|top \\d+|here'?s|these)\\b\"\n                              r\"|\\?\\s*$|\\bstocks? to (buy|watch|avoid)\\b|\\b(movers|mid-day|premarket|after-hours) (gainers|losers|movers)\\b\",\n                              re.I)\nSTRENGTH_WORD = {1: \"small\", 2: \"medium\", 3: \"large\"}\n\n\n@dataclass\nclass NewsEvent:\n    id: str\n    symbol: str          # a ticker, or MARKET_KEY for market-wide news\n    headline: str\n    url: str\n    created_at: str\n    category: str\n    direction: int       # -1 bad, 0 mixed/neutral, +1 good\n    strength: int        # 1 small, 2 medium, 3 large\n    confidence: float    # 0-1\n    why: str = \"\"\n    rater: str = \"keywords\"\n\n    @property\n    def impact(self) -> float:\n        return self.direction * self.strength * self.confidence\n\n\ndef rate_headline(headline: str, summary: str = \"\") -> tuple[int, int, float, str] | None:\n    \"\"\"Keyword rating -> (direction, strength, confidence, category) or None if nothing matched.\"\"\"\n    text = f\"{headline} . {summary[:300]}\"\n    hits = [(c, d, st) for c, d, st, rx in NEWS_RULES if rx.search(text)]\n    if not hits:\n        return None\n    net = sum(d * st for _, d, st in hits)\n    cats = \" + \".join(dict.fromkeys(c for c, _, _ in hits))\n    direction = (net > 0) - (net < 0)\n    strength = max(1, min(3, abs(net))) if direction else 1\n    conf = 0.7\n    if HEDGE_WORDS.search(headline):\n        conf = 0.4\n    if OPINION_HEADLINE.search(headline.strip()):\n        conf = 0.25\n    return direction, strength, conf, (cats if direction else f\"mixed: {cats}\")\n\n\nCLAUDE_SYSTEM = (\n    \"You are a cautious stock news analyst. For each news item, rate the likely price impact on \"\n    \"each listed ticker over the next 1-5 trading days. Use ONLY the headline and summary given; \"\n    \"never add outside facts. Rumors, opinion pieces, lists of 'stocks to buy', and recaps of moves \"\n    \"that already happened get confidence 0.3 or less. No news is ever certain: never give \"\n    \"confidence above 0.85. Reply with ONLY a JSON array, one object per (id, symbol): \"\n    '{\"id\": \"...\", \"symbol\": \"...\", \"category\": \"earnings|guidance|analyst|leadership|scandal|legal|'\n    'regulatory|fda|merger|offering|buyback|product|macro|other\", \"direction\": -1|0|1, '\n    '\"strength\": 1|2|3, \"confidence\": 0.0-0.85, \"why\": \"max 12 words\"}. '\n    'Use symbol \"_MARKET\" for market-wide items.'\n)\n\n\ndef rate_with_claude(items: list[dict], cfg: dict) -> dict[tuple[str, str], dict] | None:\n    \"\"\"items: [{id, symbols, headline, summary}]. Returns {(id, symbol): rating} or None on failure.\"\"\"\n    key = os.environ.get(\"ANTHROPIC_API_KEY\", \"\")\n    if not key or not items:\n        return None\n    payload = [{\"id\": i[\"id\"], \"symbols\": i[\"symbols\"], \"headline\": i[\"headline\"][:300],\n                \"summary\": i[\"summary\"][:300]} for i in items[:40]]\n    try:\n        r = http_json(\"POST\", CLAUDE_URL, {\"x-api-key\": key, \"anthropic-version\": \"2023-06-01\"},\n                      body={\"model\": cfg[\"news_ai_model\"], \"max_tokens\": 3000, \"system\": CLAUDE_SYSTEM,\n                            \"messages\": [{\"role\": \"user\", \"content\": json.dumps(payload)}]},\n                      timeout=60)\n        text = \"\".join(b.get(\"text\", \"\") for b in (r or {}).get(\"content\", []))\n        arr = json.loads(text[text.index(\"[\"): text.rindex(\"]\") + 1])\n    except (ApiError, ValueError, KeyError, TypeError) as e:\n        print(f\"Claude news rating failed ({e}); using keyword rules instead.\")\n        return None\n    out = {}\n    for x in arr:\n        try:\n            out[(str(x[\"id\"]), str(x[\"symbol\"]).upper() if x[\"symbol\"] != MARKET_KEY else MARKET_KEY)] = {\n                \"direction\": max(-1, min(1, int(x[\"direction\"]))),\n                \"strength\": max(1, min(3, int(x[\"strength\"]))),\n                \"confidence\": max(0.0, min(0.85, float(x[\"confidence\"]))),\n                \"category\": str(x.get(\"category\", \"other\"))[:30],\n                \"why\": str(x.get(\"why\", \"\"))[:100]}\n        except (KeyError, TypeError, ValueError):\n            continue\n    return out\n\n\ndef process_news(alp: \"Alpaca\", cfg: dict, state: dict, interest: set[str], now_iso: str,\n                 budgets: \"Budgets | None\" = None, knowledge: dict | None = None,\n                 held: set[str] | frozenset = frozenset()) -> list[NewsEvent]:\n    \"\"\"Fetches new headlines, rates the ones that matter to you, stores them. Returns new events.\n    Keyword rules rate everything for free. Claude is asked only about stocks you OWN when the\n    rules can't tell (no match, mixed, or low confidence), and only within its daily budget.\"\"\"\n    ns = state.setdefault(\"news\", {})\n    seen = set(ns.get(\"seen\", []))\n    now = parse_ts(now_iso)\n    start = ns.get(\"last\") or (now - timedelta(hours=24)).strftime(\"%Y-%m-%dT%H:%M:%SZ\")\n    raw = alp.news(start)\n\n    candidates = []\n    for it in raw:\n        nid = str(it.get(\"id\"))\n        ns[\"last\"] = max(ns.get(\"last\", \"\"), it.get(\"created_at\") or \"\")\n        if nid in seen:\n            continue\n        seen.add(nid)\n        tickers = [t.upper() for t in it.get(\"symbols\") or []]\n        syms = sorted(set(tickers) & interest - MACRO_TICKERS)\n        headline, summary = it.get(\"headline\") or \"\", it.get(\"summary\") or \"\"\n        is_macro = (not syms) and (not tickers or set(tickers) & MACRO_TICKERS) and MACRO_WORDS.search(headline)\n        if not syms and not is_macro:\n            continue\n        candidates.append({\"id\": nid, \"symbols\": syms or [MARKET_KEY], \"headline\": headline,\n                           \"summary\": summary, \"url\": it.get(\"url\") or \"\",\n                           \"created_at\": it.get(\"created_at\") or now_iso})\n\n    if knowledge is not None:\n        note_trending(knowledge, raw, interest, now_iso)\n    unsure = []\n    for c in candidates:\n        if not set(c[\"symbols\"]) & set(held):\n            continue\n        kw = rate_headline(c[\"headline\"], c[\"summary\"])\n        if kw is None or kw[0] == 0 or kw[2] < 0.5:\n            unsure.append(c)\n    ai = None\n    if unsure and budgets is not None and budgets.can(\"claude\"):\n        budgets.use(\"claude\")\n        ai = rate_with_claude(unsure[:15], cfg)\n    events = []\n    for c in candidates:\n        kw = rate_headline(c[\"headline\"], c[\"summary\"])\n        for sym in c[\"symbols\"]:\n            r = ai.get((c[\"id\"], sym)) if ai else None\n            if r:\n                ev = NewsEvent(c[\"id\"], sym, c[\"headline\"], c[\"url\"], c[\"created_at\"], r[\"category\"],\n                               r[\"direction\"], r[\"strength\"], r[\"confidence\"], r[\"why\"], \"Claude\")\n            elif kw:\n                d, st, conf, cat = kw\n                ev = NewsEvent(c[\"id\"], sym, c[\"headline\"], c[\"url\"], c[\"created_at\"], cat, d, st, conf)\n            else:\n                continue\n            if ev.direction == 0 and ev.strength < 2:\n                continue\n            events.append(ev)\n\n    # Store compactly and forget anything older than 3 days\n    store = ns.setdefault(\"events\", {})\n    for ev in events:\n        store.setdefault(ev.symbol, []).append(\n            [ev.created_at, round(ev.impact, 2), ev.category[:40], ev.headline[:100]])\n    cutoff = now - timedelta(hours=NEWS_KEEP_HOURS)\n    for sym in list(store):\n        store[sym] = [e for e in store[sym] if _safe_ts(e[0]) >= cutoff][-20:]\n        if not store[sym]:\n            del store[sym]\n    ns[\"seen\"] = sorted(seen, key=lambda x: (len(x), x))[-600:]\n    print(f\"News: {len(raw)} new headlines, {len(candidates)} about your stocks/market, \"\n          f\"{len(events)} rated (keyword rules{' + Claude for ' + str(len(unsure)) + ' unclear' if ai else ''}).\")\n    return events\n\n\ndef _safe_ts(ts: str) -> datetime:\n    try:\n        return parse_ts(ts)\n    except (ValueError, TypeError):\n        return datetime.fromisoformat(\"2000-01-01T00:00:00+00:00\")\n\n\n@dataclass\nclass NewsView:\n    score: float = 0.0     # decayed sum of impacts: about -3 (very bad) .. +3 (very good)\n    label: str = \"\"        # strongest recent story's category\n    headline: str = \"\"\n\n\ndef news_view(state: dict, symbol: str, now_iso: str) -> NewsView:\n    evs = state.get(\"news\", {}).get(\"events\", {}).get(symbol, [])\n    if not evs:\n        return NewsView()\n    now = parse_ts(now_iso)\n    score, best = 0.0, None\n    for ts, impact, cat, head in evs:\n        age_h = max(0.0, (now - _safe_ts(ts)).total_seconds() / 3600)\n        w = impact * 0.5 ** (age_h / NEWS_HALF_LIFE_HOURS)\n        score += w\n        if best is None or abs(w) > abs(best[0]):\n            best = (w, cat, head)\n    return NewsView(round(score, 2), best[1], best[2])\n\n\n# =============================================================================\n# Position size and dollar scenarios\n# =============================================================================\n\ndef risk_label(atr_pct: float) -> str:\n    return \"LOW\" if atr_pct <= 1.5 else \"MODERATE\" if atr_pct <= 2.5 else \"HIGHER\"\n\n\ndef position_size(price: float, cfg: dict) -> tuple[float, float]:\n    \"\"\"Dollars and shares so that hitting your stop loses about risk_per_trade_pct of the account,\n    capped at max_position_pct. Good news never raises the cap: no trade is a sure thing.\"\"\"\n    acct = float(cfg[\"account_size\"])\n    by_risk = acct * cfg[\"risk_per_trade_pct\"] / 100 / (cfg[\"stop_pct\"] / 100)\n    dollars = math.floor(min(by_risk, acct * cfg[\"max_position_pct\"] / 100) * 100) / 100\n    return dollars, (dollars / price if price > 0 else 0.0)\n\n\ndef dollar_scenarios(price: float, shares: float, atr_pct: float, big_pct: float = 0.0) -> str:\n    \"\"\"Both numbers come from the stock's own last year of prices: nothing estimated.\"\"\"\n    s = f\"Typical day for {shares:.4g} sh: ±{atr_pct:.1f}% = ±{money(price * shares * atr_pct / 100)}\"\n    if big_pct:\n        s += (f\" • its big days (1 in 20 over the last year) moved ±{big_pct:.1f}% = \"\n              f\"±{money(price * shares * big_pct / 100)}\")\n    return s\n\n\n# =============================================================================\n# Decisions\n# =============================================================================\n\ndef market_ok(spy: Metrics | None) -> tuple[bool, str]:\n    if spy is None:\n        return False, \"no SPY data\"\n    gap = (spy.price / spy.sma200 - 1) * 100\n    if spy.price > spy.sma200:\n        return True, f\"market healthy: SPY {gap:+.1f}% vs its 200-day\"\n    return False, f\"market weak: SPY {gap:+.1f}% vs its 200-day, so buy alerts are paused\"\n\n\ndef buy_check(m: Metrics, cfg: dict, regime: bool, nv: \"NewsView | None\" = None) -> tuple[bool, list[str]]:\n    \"\"\"Returns (passes, list of failed checks).\"\"\"\n    fails = []\n    max_atr = min(cfg[\"max_atr_pct\"], RISK_LEVEL_ATR[cfg[\"risk_level\"]])\n    if not regime:\n        fails.append(\"market below 200-day\")\n    if m.rank > cfg[\"top_n\"]:\n        fails.append(f\"rank #{m.rank} (needs top {cfg['top_n']})\")\n    if not (m.price > m.sma50 > m.sma200):\n        fails.append(\"not in uptrend (price > 50d > 200d)\")\n    if m.sma200 <= m.sma200_prev:\n        fails.append(\"200-day not rising\")\n    if m.from_high_pct > cfg[\"max_from_high_pct\"]:\n        fails.append(f\"{m.from_high_pct:.0f}% below 52w high\")\n    if not (cfg[\"rsi_min\"] <= m.rsi <= cfg[\"rsi_max\"]):\n        fails.append(f\"RSI {m.rsi:.0f} outside {cfg['rsi_min']}-{cfg['rsi_max']}\")\n    if m.price < m.sma20:\n        fails.append(\"below 20-day\")\n    if m.above_sma20_pct > cfg[\"max_above_sma20_pct\"]:\n        fails.append(f\"extended {m.above_sma20_pct:.1f}% above 20-day\")\n    if m.atr_pct > max_atr:\n        fails.append(f\"too jumpy for {cfg['risk_level']} risk ({m.atr_pct:.1f}%/day)\")\n    if cfg[\"require_green_day\"] and m.price <= m.prev_close:\n        fails.append(\"red today\")\n    if nv and nv.score <= cfg[\"news_block_buy_score\"]:\n        fails.append(f\"bad news: {nv.label}\")\n    return (not fails), fails\n\n\ndef hold_advice(m: Metrics, regime: bool, nv: \"NewsView | None\" = None,\n                mkt: \"NewsView | None\" = None) -> tuple[str, int, list[str]]:\n    \"\"\"Reads news, trend, momentum and market. Returns (verdict, points, reasons).\"\"\"\n    pts, why = 0, []\n    # News first, so it shows at the top of the reasons\n    if nv and nv.score <= -1.0:\n        pts -= 2; why.append(f\"✗ bad news: {nv.label}\")\n    elif nv and nv.score <= -0.4:\n        pts -= 1; why.append(f\"✗ negative news: {nv.label}\")\n    elif nv and nv.score >= 0.8:\n        pts += 1; why.append(f\"✓ good news: {nv.label}\")\n    if mkt and mkt.score <= -1.0:\n        pts -= 1; why.append(f\"✗ market news: {mkt.label}\")\n\n    def add(cond, good, bad, wgood=1, wbad=-1):\n        nonlocal pts\n        pts += wgood if cond else wbad\n        why.append((\"✓ \" + good) if cond else (\"✗ \" + bad))\n    add(m.price > m.sma20, \"above 20-day\", \"below 20-day\")\n    add(m.price > m.sma50, \"above 50-day\", \"below 50-day (trend damaged)\", 1, -2)\n    add(m.sma50 > m.sma200, \"50-day above 200-day\", \"50-day below 200-day\")\n    if m.rsi > 78:\n        pts -= 1; why.append(f\"✗ RSI {m.rsi:.0f} overbought (pullback risk)\")\n    elif m.rsi < 40:\n        pts -= 1; why.append(f\"✗ RSI {m.rsi:.0f} weak\")\n    else:\n        pts += 1; why.append(f\"✓ RSI {m.rsi:.0f} healthy\")\n    if m.of:\n        if m.rank <= max(1, m.of // 4):\n            pts += 1; why.append(f\"✓ momentum rank #{m.rank}/{m.of}\")\n        elif m.rank > m.of // 2:\n            pts -= 1; why.append(f\"✗ momentum rank #{m.rank}/{m.of}\")\n    add(regime, \"market healthy\", \"market weak\")\n    if pts >= 4:\n        verdict = \"HOLD: strong trend\"\n    elif pts >= 1:\n        verdict = \"HOLD, but watch it\"\n    elif pts >= -1:\n        verdict = \"LEAN SELL: momentum fading\"\n    else:\n        verdict = \"SELL: trend is breaking\"\n    return verdict, pts, why\n\n\n# Colors for the in-app text (Pushover HTML). The emoji shows the color on the lock screen.\nCOLORS = {\"buy\": \"#7c3aed\", \"yellow\": \"#ca8a04\", \"blue\": \"#2563eb\", \"green\": \"#16a34a\",\n          \"orange\": \"#ea580c\", \"red\": \"#dc2626\", \"news_bad\": \"#dc2626\", \"news_good\": \"#16a34a\",\n          \"info\": \"#475569\"}\n\n\n@dataclass\nclass Alert:\n    key: str\n    kind: str\n    title: str\n    message: str          # first line = the simple version; the rest = the \"why\"\n    priority: int\n    symbol: str = \"\"\n    sound: str = \"\"\n    url: str = \"\"\n    url_title: str = \"\"\n    color: str = \"\"\n\n\ndef money(x: float) -> str:\n    return f\"${x:,.2f}\" if abs(x) >= 0.01 or x == 0 else f\"${x:.4f}\"\n\n\ndef signed_money(x: float) -> str:\n    return (\"+\" if x >= 0 else \"-\") + money(abs(x))\n\n\ndef compose(simple: str, why_lines: list[str]) -> str:\n    \"\"\"Lock-screen line first, then the details you see when you open the alert.\"\"\"\n    return simple + \"\\n\\nWHY\\n\" + \"\\n\".join(l for l in why_lines if l)\n\n\nPROFIT_TIERS = [  # (min gain %, kind, emoji, name, color, advice)\n    (20.0, \"profit20\", \"🟢\", \"BIG WIN\", \"green\", \"Huge gain. Strongly consider selling, at least part.\"),\n    (8.0, \"profit8\", \"🔵\", \"SOLID SELL\", \"blue\", \"Solid gain. Selling locks it in.\"),\n    (0.0, \"profit\", \"🟡\", \"SELL OFFER\", \"yellow\", \"You hit your +2% target.\"),\n]\n\n\ndef holding_alerts(h: Holding, m: Metrics, regime: bool, cfg: dict, hstate: dict,\n                   sent_today: set, nv: \"NewsView | None\" = None,\n                   mkt: \"NewsView | None\" = None) -> list[Alert]:\n    \"\"\"Applies your rules to one stock you own. Mutates hstate (alert memory).\"\"\"\n    p, e = m.price, h.buy_price\n    gain = (p / e - 1) * 100\n    stop_px = e * (1 - cfg[\"stop_pct\"] / 100)\n    verdict, pts, why = hold_advice(m, regime, nv, mkt)\n    dollars = signed_money((p - e) * h.shares) if h.shares else \"\"\n    on_you = f\"{dollars} on your {h.shares:g} sh\" if h.shares else f\"{gain:+.1f}%\"\n    scen = dollar_scenarios(p, h.shares, m.atr_pct, m.big_move_pct) if h.shares else \"\"\n    chart = cfg[\"chart_url\"].format(symbol=h.symbol)\n    hstate[\"peak_gain\"] = round(max(hstate.get(\"peak_gain\", gain), gain), 1)\n    news_line = f\"📰 {nv.headline}\" if nv and nv.headline and abs(nv.score) >= 0.4 else \"\"\n    alerts = []\n\n    def A(kind, title, simple, details, prio, sound, color):\n        alerts.append(Alert(f\"{kind}:{h.key}\", kind, title, compose(simple, details), prio,\n                            h.symbol, sound, chart, f\"{h.symbol} chart\", COLORS[color]))\n\n    # 1. Stop: your hard rule\n    if gain <= -cfg[\"stop_pct\"]:\n        if f\"stop:{h.key}\" not in sent_today:\n            A(\"stop\", f\"🔴 SELL NOW: {h.symbol} {gain:+.1f}%\",\n              f\"Down past your {cfg['stop_pct']:g}% limit ({on_you}). Your rule says sell.\",\n              [f\"Bought {money(e)}, now {money(p)}, stop was {money(stop_px)}.\",\n               f\"Chart check: {verdict}\", *why[:4], news_line, scen],\n              cfg[\"priority_stop\"], cfg[\"sound_sell\"], \"red\")\n        return alerts\n\n    # 2. Close to the stop\n    if gain <= -(cfg[\"stop_pct\"] - cfg[\"near_stop_gap_pct\"]):\n        if f\"near:{h.key}\" not in sent_today:\n            A(\"near\", f\"🟠 NEAR STOP: {h.symbol} {gain:+.1f}%\",\n              f\"{(p / stop_px - 1) * 100:.1f}% above your sell line {money(stop_px)}. Get ready.\",\n              [f\"Bought {money(e)}, now {money(p)} ({on_you}).\",\n               f\"Chart check: {verdict}\", *why[:4], news_line, scen],\n              cfg[\"priority_near_stop\"], cfg[\"sound_sell\"], \"orange\")\n\n    # 3. A gain fading back to the buy price\n    if gain >= cfg[\"warn_arm_pct\"]:\n        hstate[\"warn_armed\"] = True\n    if hstate.get(\"warn_armed\") and -cfg[\"stop_pct\"] < gain <= cfg[\"warn_band_pct\"]:\n        hstate[\"warn_armed\"] = False\n        if not any(a.kind == \"near\" for a in alerts):\n            A(\"warn\", f\"🟠 SELL WARNING: {h.symbol} back to {gain:+.1f}%\",\n              f\"Was up {hstate['peak_gain']:+.1f}%, gains almost gone. Sell to break even, or hold.\",\n              [f\"Bought {money(e)}, now {money(p)} ({on_you}). Stop still at {money(stop_px)}.\",\n               f\"Chart check: {verdict}\", *why[:4], news_line, scen],\n              cfg[\"priority_warning\"], cfg[\"sound_sell\"], \"orange\")\n\n    # 4. Profit tiers: yellow +2%, blue +8%, green +20%; repeats every +2% step\n    if gain >= cfg[\"profit_pct\"]:\n        level = 1 + int((gain - cfg[\"profit_pct\"]) // cfg[\"profit_step_pct\"])\n        if level > hstate.get(\"profit_level\", 0):\n            hstate[\"profit_level\"] = level\n            _, kind, emoji, name, color, tier_advice = next(t for t in PROFIT_TIERS if gain >= t[0])\n            nxt = cfg[\"profit_pct\"] + level * cfg[\"profit_step_pct\"]\n            A(kind, f\"{emoji} {name}: {h.symbol} {gain:+.1f}%\",\n              f\"{tier_advice} {on_you}. Advice: {verdict}.\",\n              [f\"Bought {money(e)}, now {money(p)}.\", f\"Chart + news score {pts:+d}:\", *why, news_line,\n               scen, f\"If you hold: next alert at +{nxt:g}%; warning if it falls back to \"\n                     f\"+{cfg['warn_band_pct']:g}%.\"],\n              cfg[\"priority_profit\"], cfg[\"sound_buy\"], color)\n    return alerts\n\n\n# ---------- How long to hold (rules, or Claude reading news + forums) ----------\n\ndef rule_horizon(m: Metrics, nv: \"NewsView | None\", cfg: dict, stats: dict | None = None) -> dict:\n    if (nv and nv.score >= 0.8) or m.rsi > 68 or m.atr_pct > 2.5 or m.above_sma20_pct > 4:\n        why = (\"fresh news is driving it; catalyst pops often fade\" if nv and nv.score >= 0.8 else\n               \"it's stretched or jumpy, so treat it as a quick trade\")\n        return {\"horizon\": \"SHORT-TERM\", \"hold_for\": \"about 3–10 trading days\", \"why\": why,\n                \"forum_mood\": \"not checked\", \"source\": \"rules\"}\n    steady_history = stats is None or (stats[\"cagr\"] >= 8 and stats[\"max_drawdown\"] >= -65)\n    if (m.ret_12_1 >= 20 and m.sma200 > m.sma200_prev and m.atr_pct <= 2.0 and m.rank <= max(3, m.of // 4)\n            and steady_history):\n        return {\"horizon\": \"LONG-TERM\", \"hold_for\": \"about 3–12 months, recheck monthly\",\n                \"why\": \"steady 12-month uptrend. Strong 12-month winners have historically tended to keep \"\n                       \"outperforming for 3–12 months. A long hold needs a wider stop than 2% \"\n                       \"(e.g. below the 50-day average).\",\n                \"forum_mood\": \"not checked\", \"source\": \"rules\"}\n    return {\"horizon\": \"MEDIUM\", \"hold_for\": \"about 2–6 weeks\",\n            \"why\": \"healthy trend, not stretched; give it a few weeks while it stays above the 50-day\",\n            \"forum_mood\": \"not checked\", \"source\": \"rules\"}\n\n\nHORIZON_PROMPT = \"\"\"Stock: {sym} at ${price:.2f}. Data from my scanner:\n12-month momentum {r12:+.0f}%, 6-month {r6:+.0f}%, RSI {rsi:.0f}, normal daily swing {atr:.1f}%,\n{off:.1f}% below its 52-week high, momentum rank #{rank} of {of}. Recent news: {news}.\n\nSearch the web for the last 7 days of news AND investor forum chatter (Reddit r/stocks,\nr/investing, r/wallstreetbets, StockTwits, X) about {sym}. Then judge whether this is better as a\nSHORT-TERM swing (days to 2 weeks), MEDIUM (2-8 weeks) or LONG-TERM hold (3+ months) for a small\naccount that wants moderate-to-low risk. Heavy hype usually means short-term. Be cautious: nothing\nis guaranteed, and forum posts are opinions, not facts.\nEnd your reply with ONE JSON object only, no other text after it:\n{{\"horizon\": \"SHORT-TERM|MEDIUM|LONG-TERM\", \"hold_for\": \"e.g. about 1-2 weeks\",\n\"why\": \"max 30 words\", \"forum_mood\": \"bullish|mixed|bearish|quiet\", \"risks\": \"max 15 words\"}}\"\"\"\n\n\ndef ai_horizon(m: Metrics, nv: \"NewsView | None\", cfg: dict, budgets: \"Budgets | None\" = None) -> dict | None:\n    key = os.environ.get(\"ANTHROPIC_API_KEY\", \"\")\n    if not key or not cfg[\"horizon_ai\"]:\n        return None\n    if budgets is not None:\n        if not budgets.can(\"claude\"):\n            return None\n        budgets.use(\"claude\")\n    prompt = HORIZON_PROMPT.format(sym=m.symbol, price=m.price, r12=m.ret_12_1, r6=m.ret_6_1,\n                                   rsi=m.rsi, atr=m.atr_pct, off=m.from_high_pct, rank=m.rank, of=m.of,\n                                   news=(nv.headline if nv and nv.headline else \"none flagged\"))\n    try:\n        r = http_json(\"POST\", CLAUDE_URL, {\"x-api-key\": key, \"anthropic-version\": \"2023-06-01\"},\n                      body={\"model\": cfg[\"horizon_ai_model\"], \"max_tokens\": 1500,\n                            \"tools\": [{\"type\": cfg[\"web_search_tool\"], \"name\": \"web_search\",\n                                       \"max_uses\": int(cfg[\"web_search_max_uses\"])}],\n                            \"messages\": [{\"role\": \"user\", \"content\": prompt}]}, timeout=120)\n        text = \"\".join(b.get(\"text\", \"\") for b in (r or {}).get(\"content\", []) if b.get(\"type\") == \"text\")\n        obj = json.loads(text[text.rindex(\"{\"): text.rindex(\"}\") + 1])\n        hz = str(obj.get(\"horizon\", \"\")).upper()\n        if hz not in (\"SHORT-TERM\", \"MEDIUM\", \"LONG-TERM\"):\n            raise ValueError(f\"unexpected horizon {hz!r}\")\n        return {\"horizon\": hz, \"hold_for\": str(obj.get(\"hold_for\", \"\"))[:40],\n                \"why\": str(obj.get(\"why\", \"\"))[:220], \"forum_mood\": str(obj.get(\"forum_mood\", \"?\"))[:12],\n                \"risks\": str(obj.get(\"risks\", \"\"))[:120], \"source\": \"Claude (news + forums)\"}\n    except (ApiError, ValueError, KeyError, TypeError) as e:\n        print(f\"Claude hold-time check failed for {m.symbol} ({e}); using rules.\")\n        return None\n\n\ndef buy_alert(m: Metrics, cfg: dict, nv: \"NewsView | None\" = None, horizon: dict | None = None,\n              extra: list[str] | None = None) -> Alert:\n    stop = m.price * (1 - cfg[\"stop_pct\"] / 100)\n    target = m.price * (1 + cfg[\"profit_pct\"] / 100)\n    dollars, shares = position_size(m.price, cfg)\n    hz = horizon or rule_horizon(m, nv, cfg)\n    risk = risk_label(m.atr_pct)\n    noise = (f\"⚠️ It normally moves ±{m.atr_pct:.1f}%/day, more than your {cfg['stop_pct']:g}% stop, \"\n             f\"so it can stop out on noise.\" if m.atr_pct > cfg[\"stop_pct\"] else\n             f\"Normal daily swing ±{m.atr_pct:.1f}%: fits your {cfg['stop_pct']:g}% rule.\")\n    if dollars >= 1:\n        size_simple = f\"Buy about {money(dollars)} (~{shares:.4g} sh).\"\n        size_lines = [f\"Suggested size: {money(dollars)} = {shares:.4g} sh of your {money(cfg['account_size'])} \"\n                      f\"(caps: lose ≤{cfg['risk_per_trade_pct']:g}% of account at the stop, \"\n                      f\"≤{cfg['max_position_pct']:g}% in one stock).\",\n                      f\"If it hits your stop {money(stop)}: {signed_money(-dollars * cfg['stop_pct'] / 100)} • \"\n                      f\"+{cfg['profit_pct']:g}% offer at {money(target)}: {signed_money(dollars * cfg['profit_pct'] / 100)} • \"\n                      f\"+8%: {signed_money(dollars * 0.08)}\",\n                      dollar_scenarios(m.price, shares, m.atr_pct, m.big_move_pct)]\n    else:\n        size_simple = \"Your account is too small for a $1 order here.\"\n        size_lines = []\n    news_line = (f\"📰 News: {nv.label}: \\\"{nv.headline}\\\"\" if nv and nv.headline and nv.score >= 0.4\n                 else \"📰 No major news in the last 3 days.\")\n    url = (cfg[\"holdings_edit_url\"].replace(\"{symbol}\", m.symbol).replace(\"{price}\", f\"{m.price:.2f}\")\n           if cfg[\"holdings_edit_url\"] else cfg[\"chart_url\"].format(symbol=m.symbol))\n    return Alert(\n        f\"buy:{m.symbol}\", \"buy\", f\"🛒 BUY: {m.symbol} {money(m.price)} • {risk} risk\",\n        compose(f\"{size_simple} {hz['horizon'].capitalize()} hold: {hz['hold_for']}.\", [\n            f\"Hold time ({hz['source']}): {hz['why']}\"\n            + (f\" Forum mood: {hz['forum_mood']}.\" if hz.get(\"forum_mood\") not in (None, \"not checked\") else \"\")\n            + (f\" Risks: {hz['risks']}\" if hz.get(\"risks\") else \"\"),\n            f\"Momentum rank #{m.rank} of {m.of} (score {m.score:.0f}): 12-mo {m.ret_12_1:+.0f}%, \"\n            f\"6-mo {m.ret_6_1:+.0f}%, {m.from_high_pct:.1f}% from 52w high.\",\n            f\"Uptrend ✓ RSI {m.rsi:.0f} • {m.above_sma20_pct:+.1f}% vs 20-day • today {m.day_chg_pct:+.1f}%\",\n            news_line, *(extra or []), *size_lines, noise,\n            \"Size is capped no matter how good it looks: no trade is guaranteed.\",\n            f\"After buying, add to holdings.txt:  {m.symbol} {m.price:.2f}\"\n            + (f\" {date.today().isoformat()} {shares:.4f}\" if dollars >= 1 else \"\")]),\n        cfg[\"priority_buy\"], m.symbol, cfg[\"sound_buy\"], url,\n        \"Log your buy\" if cfg[\"holdings_edit_url\"] else f\"{m.symbol} chart\", COLORS[\"buy\"])\n\n\ndef news_alerts(events: list[NewsEvent], holdings: list[Holding], allm: dict, cfg: dict,\n                sent: set, regime: bool | None, state: dict, now_iso: str, market_open: bool) -> list[Alert]:\n    \"\"\"Big stories about stocks you own, plus big market-wide stories.\"\"\"\n    alerts: list[Alert] = []\n    held = {h.symbol: h for h in holdings}\n    mkt_sent = sum(1 for k in sent if k.startswith(\"mnews:\"))\n    for ev in sorted(events, key=lambda x: -abs(x.impact)):\n        if ev.strength < cfg[\"news_alert_min_strength\"] or ev.confidence < cfg[\"news_alert_min_confidence\"]:\n            continue\n        if ev.direction == 0:\n            continue\n        good = ev.direction > 0\n        arrow = \"▲ good\" if good else \"▼ bad\"\n        rated = f\"{STRENGTH_WORD[ev.strength]} impact, {ev.confidence:.0%} confidence, rated by {ev.rater}\"\n        if ev.symbol == MARKET_KEY:\n            key = f\"mnews:{ev.id}\"\n            if key in sent or mkt_sent >= cfg[\"max_market_news_alerts_per_day\"]:\n                continue\n            mkt_sent += 1\n            alerts.append(Alert(key, \"mnews\", f\"📰 MARKET NEWS {arrow}: {ev.category[:40]}\",\n                                compose(ev.headline[:160], [rated, ev.why,\n                                        \"Market-wide news can move everything you own.\"]),\n                                cfg[\"priority_market_news\"], \"\", \"\", ev.url, \"Read article\",\n                                COLORS[\"news_good\" if good else \"news_bad\"]))\n            continue\n        h = held.get(ev.symbol)\n        key = f\"news:{ev.id}:{ev.symbol}\"\n        if not h or key in sent:\n            continue\n        m = allm.get(ev.symbol)\n        lines = [f\"\\\"{ev.headline}\\\"\", rated + (f\": {ev.why}\" if ev.why else \"\")]\n        if m and market_open:\n            gain = (m.price / h.buy_price - 1) * 100\n            verdict, _, why = hold_advice(m, bool(regime), news_view(state, ev.symbol, now_iso))\n            stop_px = h.buy_price * (1 - cfg[\"stop_pct\"] / 100)\n            simple = (f\"{ev.category[:40]}. You're {gain:+.1f}%. \"\n                      + (\"Advice: \" + verdict + \".\" if not good else f\"Advice: {verdict}.\"))\n            lines += [f\"Bought {money(h.buy_price)}, now {money(m.price)}. Your sell line: {money(stop_px)}.\",\n                      *why[:4]]\n            if h.shares:\n                lines.append(dollar_scenarios(m.price, h.shares, m.atr_pct, m.big_move_pct))\n        else:\n            stop_px = h.buy_price * (1 - cfg[\"stop_pct\"] / 100)\n            simple = (f\"{ev.category[:40]}. Market's closed: expect a move at the open. \"\n                      f\"Your sell line: {money(stop_px)}.\")\n            lines.append(\"Big stories often move the price before most people can react, so \"\n                         \"check it at the open rather than chasing the headline.\")\n        if not good:\n            lines.append(\"Bad news can keep weighing on a stock for days, but sometimes it bounces. \"\n                         \"Your -2% rule protects you either way.\")\n        alerts.append(Alert(key, \"news\", f\"📰 {ev.symbol} {arrow} news\", compose(simple, lines),\n                            cfg[\"priority_news\"], ev.symbol, cfg[\"sound_sell\"] if not good else cfg[\"sound_buy\"],\n                            ev.url, \"Read article\", COLORS[\"news_good\" if good else \"news_bad\"]))\n    return alerts\n\n\n# =============================================================================\n# Notifications\n# =============================================================================\n\nclass Notifier:\n    def send(self, a: Alert) -> bool:\n        raise NotImplementedError\n\n\nclass PrintNotifier(Notifier):\n    def __init__(self):\n        self.sent: list[Alert] = []\n\n    def send(self, a: Alert) -> bool:\n        self.sent.append(a)\n        print(f\"\\n[ALERT p{a.priority}] {a.title}\\n{a.message}\")\n        return True\n\n\ndef to_html(a: Alert) -> str:\n    \"\"\"First line bold + colored; the rest escaped. Pushover shows this inside the app.\"\"\"\n    import html as _h\n    first, _, rest = a.message.partition(\"\\n\")\n    head = f\"<b>{_h.escape(first, quote=False)}<\/b>\"\n    if a.color:\n        head = f'<font color=\"{a.color}\">{head}<\/font>'\n    rest = _h.escape(rest, quote=False).replace(\"WHY\\n\", \"<b>WHY<\/b>\\n\", 1)\n    return head + (\"\\n\" + rest if rest else \"\")\n\n\nclass Pushover(Notifier):\n    def __init__(self, token: str, user: str, cfg: dict):\n        self.token, self.user, self.cfg = token, user, cfg\n\n    @classmethod\n    def from_env(cls, cfg: dict) -> \"Pushover | None\":\n        load_env()\n        t, u = os.environ.get(\"PUSHOVER_TOKEN\", \"\"), os.environ.get(\"PUSHOVER_USER\", \"\")\n        return cls(t, u, cfg) if t and u else None\n\n    def payload(self, a: Alert) -> dict:\n        body = to_html(a)\n        if len(body) > 1024:  # trim the details, never the first line\n            body = body[:1020].rsplit(\"\\n\", 1)[0] + \"\\n…\"\n        f = {\"token\": self.token, \"user\": self.user, \"title\": a.title[:250], \"message\": body,\n             \"html\": \"1\", \"priority\": str(a.priority)}\n        if a.sound:\n            f[\"sound\"] = a.sound\n        if a.url:\n            f[\"url\"], f[\"url_title\"] = a.url[:512], a.url_title[:100]\n        if a.priority == 2:\n            f[\"retry\"] = str(max(30, int(self.cfg[\"emergency_retry_sec\"])))\n            f[\"expire\"] = str(min(10800, int(self.cfg[\"emergency_expire_sec\"])))\n        return f\n\n    def send(self, a: Alert) -> bool:\n        try:\n            r = http_json(\"POST\", PUSHOVER_URL, form=self.payload(a))\n            ok = bool(r and r.get(\"status\") == 1)\n        except ApiError as e:\n            print(f\"Pushover error: {e}\")\n            ok = False\n        print(f\"{'Sent' if ok else 'FAILED'}: {a.title}\")\n        return ok\n\n\n# =============================================================================\n# Memory: knowledge.json (the bot's long-term memory) + an Obsidian vault\n# =============================================================================\n\ndef load_knowledge(path: Path | None = None) -> dict:\n    path = path or HERE / \"knowledge.json\"\n    try:\n        return json.loads(path.read_text(encoding=\"utf-8\"))\n    except (FileNotFoundError, ValueError):\n        return {}\n\n\ndef save_knowledge(k: dict, path: Path | None = None) -> None:\n    path = path or HERE / \"knowledge.json\"\n    path.write_text(json.dumps(k, indent=1, sort_keys=True) + \"\\n\", encodi
