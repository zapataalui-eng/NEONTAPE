wned=owned)\n        return {\"p\": round(m.price, 2), \"d\": round(m.day_chg_pct, 2), \"r\": m.rank, \"of\": m.of,\n                \"ok\": a[\"status\"] in (\"STRONG BUY\", \"BUY\"), \"f\": a[\"fails\"][:3], \"rsi\": round(m.rsi),\n                \"atr\": round(m.atr_pct, 1), \"r12\": round(m.ret_12_1), \"r6\": round(m.ret_6_1),\n                \"hi\": round(m.from_high_pct, 1), \"v\": a[\"verdict\"], \"news\": nv.label or \"\",\n                \"risk\": risk_label(m.atr_pct), \"st\": a[\"status\"], \"conf\": a[\"conf\"], \"setup\": a[\"setup\"],\n                \"name\": company_name(m.symbol), \"trig\": a.get(\"trigger\", \"\"), \"vol\": m.vol_ratio}\n\n    watch = [watch_row(m, m.symbol in held) for m in ranked[:15]]\n    every = {m.symbol: every_row(m, m.symbol in held) for m in ranked}\n    bi = best_idea(ranked, cfg, regime, state, now_iso, {h.symbol for h in holdings}, mkt)\n    best = None\n    if bi:\n        bm, ba = bi\n        fb = (knowledge.get(\"forum\") or {}).get(bm.symbol) or {}\n        best = {\"symbol\": bm.symbol, \"name\": company_name(bm.symbol), \"price\": round(bm.price, 2), \"st\": ba[\"status\"],\n                \"conf\": ba[\"conf\"], \"setup\": ba[\"setup\"], \"trigger\": ba.get(\"trigger\", \"\"),\n                \"why\": [w for w in ba[\"why\"] if w.startswith(\"✓\")][:3], \"missing\": ba[\"fails\"][:3],\n                \"day\": round(bm.day_chg_pct, 2), \"hist\": [round(c, 2) for c in bm.closes[-252:]],\n                \"forum\": fb.get(\"line\", \"\")}\n    lib = library_status()\n    data = {\"updated\": now_iso[:16], \"updated_at\": re.sub(r\"\\.\\d+\", \"\", now_iso), \"market_open\": market_open, \"regime\": regime_txt, \"all\": every, \"best\": best,\n            \"library\": {\"books\": [{\"title\": b[\"title\"], \"author\": b[\"author\"], \"year\": b[\"year\"], \"passages\": b[\"passages\"]}\n                                  for b in lib[\"books\"]], \"passages\": lib[\"passages\"]},\n            \"reddit\": (knowledge.get(\"reddit_trending\") or {}).get(\"rows\", [])[:8],\n            \"market_news\": mkt.label, \"holdings\": hold, \"watch\": watch,\n            \"ideas\": trending_ideas(knowledge, 5), \"alerts\": list(reversed(knowledge.get(\"alerts_log\", [])[-60:])),\n            \"budgets\": budgets.table(), \"track\": track_summary(knowledge),\n            \"account_size\": cfg[\"account_size\"], \"paused\": cfg[\"paused\"],\n            \"settings\": {k: cfg[k] for k in (\"stop_pct\", \"profit_pct\", \"risk_level\", \"max_buy_alerts_per_day\",\n                                             \"watch_extra\", \"ignore\", \"risk_per_trade_pct\", \"max_position_pct\")},\n            \"replies\": list(reversed(knowledge.get(\"requests\", [])[-15:])),\n            \"discovered\": (knowledge.get(\"discovered\") or [])[:8],\n            \"broker\": {k: (state.get(\"broker\") or {}).get(k) for k in (\"synced\", \"error\", \"accounts\")}\n            | {\"name\": cfg[\"broker_name\"], \"count\": len((state.get(\"broker\") or {}).get(\"positions\") or {})}\n            if state.get(\"broker\") else None}\n    pp = state.get(\"paper\") or {}\n    data[\"paper\"] = {k: pp.get(k) for k in (\"on\", \"updated\", \"equity\", \"cash\", \"start\", \"day_pl\", \"wins\", \"losses\",\n                                             \"positions\", \"error\", \"outlook\", \"chart\", \"intraday\", \"daily\", \"learn\")} | {\"trades\": (pp.get(\"trades\") or [])[-60:][::-1]}\n    path.write_text(json.dumps(data, indent=1), encoding=\"utf-8\")\n    # Friends' copy: the bot's picks and alerts only. No holdings, money, account or settings.\n    pub = public_feed(data, held,\n                      [watch_row(m, False) if m.symbol in held else w for m, w in zip(ranked[:15], watch)],\n                      {m.symbol: every_row(m, False) if m.symbol in held else every[m.symbol] for m in ranked})\n    (path.parent / \"public.json\").write_text(json.dumps(pub, indent=1), encoding=\"utf-8\")\n    if path == HERE / \"app\" / \"dashboard.json\":\n        publish_public(pub)\n\n\nPUBLIC_ALERT_KINDS = {\"buy\", \"ideas\", \"news\", \"mnews\"}\n_PRIVATE_LINE = re.compile(r\"of your \\$|your \\$[\\d,]|\\baccount\\b|\\byou own\\b|\\bbought (it )?at\\b|suggested size|\"\n                           r\"\\byour (position|shares|stock|holding)s?\\b|\\bP/?L\\b|[+\\-−±]\\$\\d|\\d sh\\b|hits your stop\", re.I)\n\n\ndef public_feed(data: dict, held: set, watch: list, every: dict) -> dict:\n    \"\"\"What friends see: ideas, rankings and market/news alerts. Anything about your money is left out.\"\"\"\n    def clean(msg: str) -> str:\n        msg = re.sub(r\"Buy about \\$[\\d,.]+ \\(~[\\d.]+ sh\\)\\.\\s*\", \"\", msg or \"\")\n        msg = msg.replace(\"by your rules\", \"by the bot's rules\").replace(\"your buy rules\", \"the bot's buy rules\")\n        return \"\\n\".join(l for l in msg.splitlines() if not _PRIVATE_LINE.search(l)).strip()\n    alerts = []\n    for a in data.get(\"alerts\") or []:\n        if a.get(\"kind\") not in PUBLIC_ALERT_KINDS or (a.get(\"sym\") and a[\"sym\"] in held):\n            continue\n        if _PRIVATE_LINE.search(a.get(\"title\") or \"\"):\n            continue\n        alerts.append({k: a.get(k) for k in (\"t\", \"kind\", \"sym\", \"title\", \"color\", \"url\")} | {\"message\": clean(a.get(\"message\"))})\n    keep = (\"updated\", \"updated_at\", \"market_open\", \"regime\", \"best\", \"reddit\", \"market_news\", \"ideas\",\n            \"discovered\", \"track\", \"library\")\n    return {k: data.get(k) for k in keep} | {\"watch\": watch, \"all\": every, \"alerts\": alerts[:40], \"public\": True}\n\n\ndef publish_public(feed: dict) -> None:\n    \"\"\"Copy the friends' feed to the public app repo (picks.json), if a NEONTAPE_TOKEN secret is set.\"\"\"\n    tok = os.environ.get(\"NEONTAPE_TOKEN\", \"\").strip()\n    if not tok or os.environ.get(\"NEONTAPE_OFFLINE\"):\n        return\n    repo = os.environ.get(\"PUBLIC_REPO\", \"\").strip() or (os.environ.get(\"GITHUB_REPOSITORY_OWNER\", \"\") + \"/NEONTAPE\")\n    url = f\"https://api.github.com/repos/{repo}/contents/picks.json\"\n    hdr = {\"Authorization\": f\"Bearer {tok}\", \"Accept\": \"application/vnd.github+json\", \"X-GitHub-Api-Version\": \"2022-11-28\"}\n    import base64\n    body = {\"message\": \"Friends' picks update\", \"content\": base64.b64encode(json.dumps(feed).encode()).decode()}\n    for attempt in range(2):\n        try:\n            try:\n                body[\"sha\"] = (http_json(\"GET\", url, hdr, timeout=15) or {}).get(\"sha\")\n            except ApiError as e:\n                if \"HTTP 404\" not in str(e):\n                    raise\n                body.pop(\"sha\", None)\n            http_json(\"PUT\", url, hdr, body=body, timeout=20)\n            print(f\"Friends' picks published to {repo}.\")\n            return\n        except ApiError as e:\n            if attempt or \"HTTP 409\" not in str(e):\n                print(f\"Couldn't publish friends' picks: {e}\")\n                return\n\n\n# =============================================================================\n# Robinhood sync through SnapTrade Personal (free, read-only for this bot)\n# =============================================================================\n\ndef snap_signature(path: str, query: str, consumer_key: str, body=None) -> str:\n    \"\"\"SnapTrade request signature: HMAC-SHA256 of canonical JSON {content, path, query}, base64.\"\"\"\n    import base64\n    import hashlib\n    import hmac\n    sig = json.dumps({\"content\": None if not body else body, \"path\": path, \"query\": query},\n                     separators=(\",\", \":\"), sort_keys=True)\n    return base64.b64encode(hmac.new(consumer_key.encode(), sig.encode(), hashlib.sha256).digest()).decode()\n\n\nclass SnapTrade:\n    def __init__(self, client_id: str, consumer_key: str, base: str = SNAP_URL):\n        self.cid, self.ckey, self.base = client_id, consumer_key, base\n\n    @classmethod\n    def from_env(cls) -> \"SnapTrade | None\":\n        load_env()\n        c, k = os.environ.get(\"SNAPTRADE_CLIENT_ID\", \"\"), os.environ.get(\"SNAPTRADE_CONSUMER_KEY\", \"\")\n        return cls(c.strip(), k.strip()) if c.strip() and k.strip() else None\n\n    def call(self, method: str, path: str, body: dict | None = None):\n        import time\n        query = urllib.parse.urlencode({\"clientId\": self.cid, \"timestamp\": int(time.time())})\n        hdrs = {\"Signature\": snap_signature(path, query, self.ckey, body), \"Accept\": \"application/json\"}\n        return http_json(method, f\"{self.base}{path}?{query}\", hdrs, body=body)\n\n    def accounts(self, name_filter: str = \"\") -> list[dict]:\n        accts = self.call(\"GET\", \"/accounts\") or []\n        if isinstance(accts, dict):\n            accts = _first_list(accts)\n        f = name_filter.lower().strip()\n        return [a for a in accts if isinstance(a, dict) and a.get(\"id\") and\n                (not f or f in json.dumps([a.get(\"institution_name\"), a.get(\"name\")]).lower())]\n\n    def positions(self, account_id: str) -> list[dict]:\n        try:\n            raw = self.call(\"GET\", f\"/accounts/{account_id}/positions\")\n        except ApiError as e:\n            if not re.search(r\"HTTP (404|410)\", str(e)):\n                raise\n            raw = self.call(\"GET\", f\"/accounts/{account_id}/positions/all\")\n        return raw if isinstance(raw, list) else _first_list(raw)\n\n    def refresh(self, authorization_id: str) -> None:\n        self.call(\"POST\", f\"/authorizations/{authorization_id}/refresh\")\n\n\ndef _first_list(d) -> list:\n    if isinstance(d, list):\n        return d\n    if isinstance(d, dict):\n        for k in (\"positions\", \"results\", \"data\", \"items\", \"accounts\"):\n            if isinstance(d.get(k), list):\n                return d[k]\n    return []\n\n\ndef _dig(d, *keys):\n    for k in keys:\n        d = d.get(k) if isinstance(d, dict) else None\n    return d\n\n\ndef parse_snap_position(p: dict) -> tuple[str, float, float, float] | None:\n    \"\"\"(ticker, shares, average cost per share, last price) or None for cash/options/odd rows.\"\"\"\n    if not isinstance(p, dict) or p.get(\"cash_equivalent\"):\n        return None\n    tick = None\n    for path in ((\"symbol\", \"symbol\", \"raw_symbol\"), (\"symbol\", \"symbol\", \"symbol\"), (\"instrument\", \"symbol\"),\n                 (\"symbol\", \"raw_symbol\"), (\"symbol\", \"symbol\"), (\"symbol\", \"ticker\"), (\"ticker\",), (\"symbol\",)):\n        v = _dig(p, *path)\n        if isinstance(v, str) and v.strip():\n            tick = v.strip().upper()\n            break\n    try:\n        units = float(p.get(\"units\") if p.get(\"units\") is not None else p.get(\"quantity\") or 0)\n        cost = float(p.get(\"average_purchase_price\") if p.get(\"average_purchase_price\") is not None\n                     else p.get(\"cost_basis\") or 0)\n        price = float(p.get(\"price\") or 0)\n    except (TypeError, ValueError):\n        return None\n    if not tick or not re.fullmatch(r\"[A-Z]{1,5}(\\.[A-Z])?\", tick) or units <= 0 or cost <= 0:\n        return None\n    return tick, units, cost, price\n\n\ndef broker_positions(snap: SnapTrade, cfg: dict) -> tuple[dict[str, dict], list[str]]:\n    \"\"\"All stock positions across matching accounts, merged by ticker. Returns (positions, auth ids).\"\"\"\n    accts = snap.accounts(cfg[\"broker_name\"])\n    if not accts:\n        raise ApiError(f\"no {cfg['broker_name'] or 'brokerage'} account is linked in SnapTrade yet\")\n    out: dict[str, dict] = {}\n    auths = []\n    for a in accts:\n        auth = a.get(\"brokerage_authorization\")\n        auth = auth.get(\"id\") if isinstance(auth, dict) else auth\n        if isinstance(auth, str) and auth not in auths:\n            auths.append(auth)\n        for p in snap.positions(a[\"id\"]):\n            got = parse_snap_position(p)\n            if not got:\n                continue\n            sym, units, cost, price = got\n            o = out.setdefault(sym, {\"units\": 0.0, \"spent\": 0.0, \"price\": price})\n            o[\"units\"] += units\n            o[\"spent\"] += units * cost\n            o[\"price\"] = price or o[\"price\"]\n    return {s: {\"units\": round(v[\"units\"], 6), \"cost\": round(v[\"spent\"] / v[\"units\"], 4), \"price\": v[\"price\"]}\n            for s, v in out.items()}, auths\n\n\ndef sync_broker(snap: \"SnapTrade | None\", cfg: dict, state: dict, now_iso: str) -> tuple[list[Holding], list[Alert]]:\n    \"\"\"Reads your Robinhood stocks. Falls back to the last good read if SnapTrade is down.\"\"\"\n    if not snap:\n        return [], []\n    today = now_iso[:10]\n    bs = state.setdefault(\"broker\", {})\n    name = cfg[\"broker_name\"] or \"Broker\"\n    notices: list[Alert] = []\n    prio = cfg[\"priority_broker\"]\n    try:\n        live, auths = broker_positions(snap, cfg)\n    except ApiError as e:\n        bs[\"error\"] = str(e)[:240]\n        print(f\"{name} sync failed: {e}\")\n        if bs.get(\"error_day\") != today:\n            bs[\"error_day\"] = today\n            notices.append(Alert(f\"broker-error:{today}\", \"info\", f\"⚠️ {name} sync failed\",\n                                 compose(f\"Using your last known {name} stocks for now.\",\n                                         [str(e)[:300], \"If this keeps happening, open the SnapTrade \"\n                                          \"dashboard and reconnect Robinhood.\"]), prio, color=COLORS[\"info\"]))\n    else:\n        old = bs.get(\"positions\") or {}\n        first_sync = not bs.get(\"synced\")\n        new = {}\n        for sym, p in sorted(live.items()):\n            o = old.get(sym) or {}\n            new[sym] = {\"units\": p[\"units\"], \"cost\": p[\"cost\"], \"since\": o.get(\"since\") or today}\n            if first_sync:\n                continue\n            stop = p[\"cost\"] * (1 - cfg[\"stop_pct\"] / 100)\n            if not o:\n                notices.append(Alert(f\"broker-buy:{sym}:{p['cost']}\", \"info\", f\"🧾 {name}: you bought {sym}\",\n                                     compose(f\"{p['units']:g} sh at {money(p['cost'])}. Watching it now; sell line \"\n                                             f\"{money(stop)}.\", [\"Read from your Robinhood account, no typing needed.\",\n                                                                 f\"Tip: set a stop order in Robinhood at {money(stop)}.\"]),\n                                     prio, sym, color=COLORS[\"buy\"]))\n            elif abs(o.get(\"cost\", 0) - p[\"cost\"]) > 0.005 or abs(o.get(\"units\", 0) - p[\"units\"]) > 1e-6:\n                notices.append(Alert(f\"broker-chg:{sym}:{p['cost']}:{p['units']}\", \"info\",\n                                     f\"🧾 {name}: {sym} position changed\",\n                                     compose(f\"Now {p['units']:g} sh, average cost {money(p['cost'])}. Sell line \"\n                                             f\"{money(stop)}.\", [\"Your alerts now use the new average cost.\"]),\n                                     prio, sym, color=COLORS[\"info\"]))\n        if not first_sync:\n            for sym in sorted(set(old) - set(new)):\n                notices.append(Alert(f\"broker-sold:{sym}:{today}\", \"info\", f\"✅ {name}: {sym} sold\",\n                                     compose(f\"{sym} is no longer in your account. Stopped watching it.\", []),\n                                     prio, sym, color=COLORS[\"green\"]))\n        else:\n            notices.append(Alert(f\"broker-linked:{today}\", \"info\", f\"🔗 {name} linked\",\n                                 compose(f\"Watching {len(new)} stock(s) from your account: \"\n                                         f\"{', '.join(new) or 'none yet'}.\",\n                                         [\"Buys and sells now show up by themselves. \"\n                                          \"Robinhood data can lag a little behind the app.\"]),\n                                 prio, color=COLORS[\"green\"]))\n        bs.update(positions=new, synced=now_iso[:16], error=\"\", accounts=len(auths))\n        mins = cfg[\"broker_refresh_minutes\"]\n        last = bs.get(\"refreshed\", \"\")\n        if mins and auths and (not last or (minutes_until(last, now_iso) or 0) >= mins):\n            for a in auths:\n                try:\n                    snap.refresh(a)\n                except ApiError as e:\n                    print(f\"{name} refresh skipped: {e}\")\n            bs[\"refreshed\"] = now_iso\n    holds = [Holding(sym, d[\"cost\"], d.get(\"since\", \"\"), d[\"units\"], cfg[\"broker_name\"].lower() or \"broker\")\n             for sym, d in sorted((bs.get(\"positions\") or {}).items())]\n    return holds, notices\n\n\n_NAME_JUNK = re.compile(r\"\\b(common stock|class [a-z] common stock|ordinary shares|american depositary shares?|\"\n                        r\"each representing.*|depositary shares?|inc\\.?|incorporated|corp\\.?|corporation|\"\n                        r\"co\\.?|company|holdings?|ltd\\.?|limited|plc|n\\.v\\.|s\\.a\\.|ag|se|the|group|class [a-z])\\b\",\n                        re.I)\n\n\ndef clean_name(name: str) -> str:\n    n = _NAME_JUNK.sub(\" \", name or \"\")\n    return re.sub(r\"[^\\w&' .-]+\", \" \", re.sub(r\"\\s+\", \" \", n)).strip(\" .,-\")\n\n\ndef write_names(alp: \"Alpaca\", state: dict, today: str, path: Path | None = None) -> bool:\n    \"\"\"Weekly: company names for every tradable US stock, so you can type \"nvidia\" or \"coca cola\".\"\"\"\n    if state.get(\"names_day\") and (date.fromisoformat(today) - date.fromisoformat(state[\"names_day\"])).days < 7:\n        return False\n    try:\n        assets = alp.assets()\n    except ApiError as e:\n        print(f\"Couldn't refresh company names: {e}\")\n        return False\n    rows = sorted([a[\"symbol\"], clean_name(a.get(\"name\", \"\"))] for a in assets\n                  if a.get(\"tradable\") and a.get(\"exchange\") in (\"NYSE\", \"NASDAQ\", \"ARCA\", \"AMEX\", \"BATS\")\n                  and re.fullmatch(r\"[A-Z]{1,5}(\\.[A-Z])?\", a.get(\"symbol\", \"\")))\n    path = path or HERE / \"app\" / \"names.json\"\n    path.parent.mkdir(parents=True, exist_ok=True)\n    path.write_text(json.dumps(rows, separators=(\",\", \":\")), encoding=\"utf-8\")\n    state[\"names_day\"] = today\n    print(f\"Saved {len(rows)} company names.\")\n    return True\n\n\ndef merge_holdings(manual: list[Holding], broker: list[Holding]) -> list[Holding]:\n    \"\"\"Broker positions win; manual lines are kept for stocks the broker doesn't show.\"\"\"\n    have = {h.symbol for h in broker}\n    return broker + [h for h in manual if h.symbol not in have]\n\n\n# =============================================================================\n# One scan\n# =============================================================================\n\ndef build_metrics(alp: Alpaca, symbols: list[str], today_et: str, market_open: bool,\n                  live: bool = True) -> dict[str, Metrics]:\n    start = date.fromisoformat(today_et) - timedelta(days=420)\n    bars = alp.daily_bars(symbols, start)\n    prices = alp.live_prices(symbols) if live else {}\n    out = {}\n    for sym in symbols:\n        b = bars.get(sym) or []\n        if b and market_open and b[-1][\"t\"][:10] == today_et:\n            b = b[:-1]  # drop today's unfinished bar\n        if len(b) <= MIN_HISTORY:\n            continue\n        s = Series.from_bars(b)\n        m = metrics_at(sym, s, len(s) - 1, prices.get(sym))\n        if m:\n            m.closes = s.c[-251:] + [m.price]\n            out[sym] = m\n    return out\n\n\n# =============================================================================\n# Paper trading (Alpaca paper account only: fake money, real prices)\n# =============================================================================\nPAPER_URL = \"https://paper-api.alpaca.markets\"   # never the live URL: this bot does not trade real money\n\n\nclass Paper:\n    \"\"\"Trades the bot's own buy alerts in an Alpaca PAPER account so you can see if the rules make money.\"\"\"\n    def __init__(self, key: str, secret: str):\n        assert PAPER_URL.startswith(\"https://paper-api.\"), \"paper trading only\"\n        self.h = {\"APCA-API-KEY-ID\": key, \"APCA-API-SECRET-KEY\": secret, \"Accept\": \"application/json\"}\n\n    @classmethod\n    def from_env(cls) -> \"Paper | None\":\n        k, s = os.environ.get(\"APCA_PAPER_KEY_ID\", \"\").strip(), os.environ.get(\"APCA_PAPER_SECRET_KEY\", \"\").strip()\n        if not k or not s or os.environ.get(\"NEONTAPE_OFFLINE\"):\n            return None\n        return cls(k, s)\n\n    def account(self) -> dict:\n        return http_json(\"GET\", f\"{PAPER_URL}/v2/account\", self.h) or {}\n\n    def positions(self) -> list[dict]:\n        return http_json(\"GET\", f\"{PAPER_URL}/v2/positions\", self.h) or []\n\n    def orders(self, limit: int = 100) -> list[dict]:\n        return http_json(\"GET\", f\"{PAPER_URL}/v2/orders\", self.h, {\"status\": \"all\", \"limit\": limit, \"direction\": \"desc\"}) or []\n\n    def buy(self, sym: str, dollars: float, coid: str) -> dict:\n        return http_json(\"POST\", f\"{PAPER_URL}/v2/orders\", self.h, body={\n            \"symbol\": sym, \"notional\": f\"{dollars:.2f}\", \"side\": \"buy\", \"type\": \"market\",\n            \"time_in_force\": \"day\", \"client_order_id\": coid})\n\n    def close(self, sym: str) -> dict:\n        return http_json(\"DELETE\", f\"{PAPER_URL}/v2/positions/{urllib.parse.quote(sym)}\", self.h) or {}\n\n    def put_contracts(self, underlying: str, start: str, end: str, lo: float, hi: float) -> list[dict]:\n        r = http_json(\"GET\", f\"{PAPER_URL}/v2/options/contracts\", self.h, {\n            \"underlying_symbols\": underlying, \"type\": \"put\", \"status\": \"active\", \"expiration_date_gte\": start,\n            \"expiration_date_lte\": end, \"strike_price_gte\": f\"{lo:.2f}\", \"strike_price_lte\": f\"{hi:.2f}\", \"limit\": 200}) or {}\n        return r.get(\"option_contracts\") or []\n\n    def option_ask(self, occ: str) -> float:\n        r = http_json(\"GET\", f\"{DATA_URL}/v1beta1/options/quotes/latest\", self.h, {\"symbols\": occ, \"feed\": \"indicative\"}) or {}\n        q = (r.get(\"quotes\") or {}).get(occ) or {}\n        return _f(q.get(\"ap\")) or _f(q.get(\"bp\"))\n\n    def buy_limit(self, sym: str, qty: float, limit: float, coid: str) -> dict:\n        \"\"\"Extended-hours / overnight buy: Alpaca only accepts limit orders outside the day session.\"\"\"\n        return http_json(\"POST\", f\"{PAPER_URL}/v2/orders\", self.h, body={\n            \"symbol\": sym, \"qty\": f\"{qty:g}\", \"side\": \"buy\", \"type\": \"limit\", \"limit_price\": f\"{limit:.2f}\",\n            \"time_in_force\": \"day\", \"extended_hours\": True, \"client_order_id\": coid})\n\n    def sell_limit(self, sym: str, qty: float, limit: float, coid: str) -> dict:\n        return http_json(\"POST\", f\"{PAPER_URL}/v2/orders\", self.h, body={\n            \"symbol\": sym, \"qty\": f\"{qty:g}\", \"side\": \"sell\", \"type\": \"limit\", \"limit_price\": f\"{limit:.2f}\",\n            \"time_in_force\": \"day\", \"extended_hours\": True, \"client_order_id\": coid})\n\n    def buy_crypto(self, pair: str, dollars: float, coid: str) -> dict:\n        return http_json(\"POST\", f\"{PAPER_URL}/v2/orders\", self.h, body={\n            \"symbol\": pair, \"notional\": f\"{dollars:.2f}\", \"side\": \"buy\", \"type\": \"market\", \"time_in_force\": \"gtc\",\n            \"client_order_id\": coid})\n\n    def buy_option(self, occ: str, qty: int, limit: float, coid: str) -> dict:\n        return http_json(\"POST\", f\"{PAPER_URL}/v2/orders\", self.h, body={\n            \"symbol\": occ, \"qty\": str(qty), \"side\": \"buy\", \"type\": \"limit\", \"limit_price\": f\"{limit:.2f}\",\n            \"time_in_force\": \"day\", \"client_order_id\": coid})\n\n\ndef _f(x, d=0.0) -> float:\n    try:\n        return float(x)\n    except (TypeError, ValueError):\n        return d\n\n\ndef predict_move(closes: list, up: float, down: float, horizon: int = 10) -> dict:\n    \"\"\"A prediction from the stock's own past year: on days that looked like today (same side of the\n    20-day average, same 5-day direction, similar distance from it), how often did the price hit +up%\n    before -down% within `horizon` days, and what did it return on average over that window?\"\"\"\n    c = [x for x in closes if x]\n    if len(c) < 80:\n        return {\"p\": None, \"n\": 0, \"avg\": 0.0}\n\n    def feats(i: int) -> tuple:\n        a20 = sum(c[i - 19:i + 1]) / 20\n        dist = (c[i] / a20 - 1) * 100\n        return (c[i] > a20, c[i] > c[i - 5], 0 if dist < -4 else 1 if dist < 4 else 2)\n\n    now = feats(len(c) - 1)\n    wins = losses = 0\n    rets = []\n    for i in range(25, len(c) - horizon):\n        if feats(i) != now:\n            continue\n        base, hit = c[i], 0\n        for j in range(i + 1, i + horizon + 1):\n            r = (c[j] / base - 1) * 100\n            if r >= up:\n                hit = 1\n                break\n            if r <= -down:\n                hit = -1\n                break\n        wins += hit == 1\n        losses += hit == -1\n        rets.append((c[i + horizon] / base - 1) * 100)\n    n = wins + losses\n    return {\"p\": round(wins / n, 3) if n >= 8 else None, \"q\": round(losses / n, 3) if n >= 8 else None,\n            \"n\": len(rets), \"avg\": round(sum(rets) / len(rets), 2) if rets else 0.0}\n\n\ndef swing_profile(closes: list[float], th: float = 3.0) -> dict | None:\n    \"\"\"Each stock's own rhythm from its past year: a zigzag of swings of at least th %.\n    up/down = typical (median) swing size in %, days = typical length of an up-swing,\n    trend = which way the current swing is going, pos = how far the current up-swing has run vs a typical one.\"\"\"\n    if not closes or len(closes) < 40:\n        return None\n    piv: list[tuple[int, str]] = []\n    trend, ext = 0, 0\n    for i in range(1, len(closes)):\n        c, e = closes[i], closes[ext]\n        if trend == 0:\n            if c >= closes[0] * (1 + th / 100):\n                piv.append((0, \"L\")); trend, ext = 1, i\n            elif c <= closes[0] * (1 - th / 100):\n                piv.append((0, \"H\")); trend, ext = -1, i\n        elif trend == 1:\n            if c > e:\n                ext = i\n            elif c <= e * (1 - th / 100):\n                piv.append((ext, \"H\")); trend, ext = -1, i\n        else:\n            if c < e:\n                ext = i\n            elif c >= e * (1 + th / 100):\n                piv.append((ext, \"L\")); trend, ext = 1, i\n    ups, downs, days = [], [], []\n    for (i0, k0), (i1, k1) in zip(piv, piv[1:]):\n        chg = (closes[i1] / closes[i0] - 1) * 100\n        (ups if k0 == \"L\" else downs).append(abs(chg))\n        if k0 == \"L\":\n            days.append(i1 - i0)\n    if len(ups) < 3:\n        return None\n    med = lambda v: sorted(v)[len(v) // 2]\n    up = med(ups)\n    last = piv[-1] if piv else (0, \"L\")\n    run = (closes[-1] / closes[last[0]] - 1) * 100\n    return {\"up\": round(up, 1), \"down\": round(med(downs), 1) if downs else None, \"days\": med(days), \"n\": len(ups),\n            \"trend\": trend, \"pos\": round(run / up, 2) if trend == 1 and up else None}\n\n\ndef paper_learn(trades: list[dict]) -> dict:\n    \"\"\"What the bot has learned from its own finished paper trades: win rate and average result per stock,\n    per kind of setup, and per time of day. Used to lean into what works and back off what doesn't.\"\"\"\n    def setup(why: str) -> str:\n        w = (why or \"\").lower()\n        return (\"hedge\" if w.startswith(\"market hedge\") else \"dip\" if w.startswith(\"big-name dip\") else\n                \"asked\" if w.startswith(\"you asked\") else \"filler\" if w.startswith(\"best prediction\") else\n                \"put\" if \"odds it falls\" in w else \"prediction\" if \"prediction\" in w or \"odds of\" in w else \"other\")\n    def when(t: str) -> str:\n        hm = (t or \"\")[11:16]\n        return \"first hour\" if hm < \"10:30\" else \"midday\" if hm < \"15:00\" else \"last hour\"\n    open_buys: dict = {}\n    done = []\n    for t in trades:\n        if t.get(\"side\") == \"buy\":\n            open_buys[t.get(\"sym\")] = t\n        elif t.get(\"side\") == \"sell\" and t.get(\"sym\") in open_buys:\n            b = open_buys.pop(t[\"sym\"])\n            pct = ((t[\"price\"] / t[\"entry\"] - 1) * 100 if t.get(\"price\") and t.get(\"entry\")\n                   else (t[\"pl\"] / b[\"dollars\"] * 100 if t.get(\"pl\") is not None and b.get(\"dollars\") else None))\n            if pct is None:\n                continue\n            done.append({\"sym\": t[\"sym\"], \"setup\": setup(b.get(\"why\", \"\")), \"when\": when(b.get(\"t\", \"\")),\n                         \"pct\": pct, \"day\": t.get(\"day\") or (t.get(\"t\") or \"\")[:10]})\n    def group(key: str) -> dict:\n        g: dict = {}\n        for d in done:\n            x = g.setdefault(d[key], {\"n\": 0, \"w\": 0, \"sum\": 0.0, \"last\": []})\n            x[\"n\"] += 1; x[\"w\"] += d[\"pct\"] > 0; x[\"sum\"] += d[\"pct\"]; x[\"last\"] = (x[\"last\"] + [round(d[\"pct\"], 2)])[-3:]\n            x[\"day\"] = d[\"day\"]\n        return {k: {\"n\": v[\"n\"], \"w\": v[\"w\"], \"avg\": round(v[\"sum\"] / v[\"n\"], 2), \"last\": v[\"last\"], \"day\": v.get(\"day\")}\n                for k, v in g.items()}\n    return {\"n\": len(done), \"w\": sum(d[\"pct\"] > 0 for d in done),\n            \"avg\": round(sum(d[\"pct\"] for d in done) / len(done), 2) if done else 0.0,\n            \"syms\": group(\"sym\"), \"setups\": group(\"setup\"),\n            \"times\": group(\"when\")}\n\n\ndef learned_nudge(sym: str, setup: str, learn: dict | None) -> tuple[float, str]:\n    \"\"\"Odds nudge from the bot's own record: stocks and setups that keep winning get a little more trust.\"\"\"\n    if not learn:\n        return 0.0, \"\"\n    adj, notes = 0.0, []\n    s_ = (learn.get(\"syms\") or {}).get(sym)\n    if s_ and s_[\"n\"] >= 2:\n        adj += max(-0.06, min(0.06, (s_[\"w\"] / s_[\"n\"] - 0.5) * 0.12))\n        notes.append(f\"its past trades on {sym}: {s_['w']} of {s_['n']} won, avg {s_['avg']:+.1f}%\")\n    st = (learn.get(\"setups\") or {}).get(setup)\n    if st and st[\"n\"] >= 5:\n        adj += max(-0.05, min(0.05, (st[\"w\"] / st[\"n\"] - 0.5) * 0.1))\n        notes.append(f\"this kind of buy has won {st['w']} of {st['n']}\")\n    return adj, \"; \".join(notes)\n\n\ndef paper_outlook(m: \"Metrics\", cfg: dict, regime: bool, nv: \"NewsView | None\", catalyst: bool,\n                  learn: dict | None = None, setup: str = \"prediction\") -> dict:\n    \"\"\"Predicted payoff for a paper buy, in % per trade: the history-based odds of +profit before -stop,\n    the average 2-week return in similar setups, then nudged by news, a fresh catalyst and market health.\"\"\"\n    up, down = cfg[\"profit_pct\"], cfg[\"stop_pct\"]\n    pr = predict_move(m.closes, up, down)\n    if pr[\"p\"] is None:\n        return {\"score\": -9.0, \"p\": None, \"why\": \"not enough history\"}\n    p = pr[\"p\"]\n    p += max(-0.08, min(0.08, (nv.score if nv else 0) * 0.03))      # good/bad news shifts the odds a little\n    p += 0.05 if catalyst else 0.0\n    p -= 0.0 if regime else 0.05                                    # weak market: fewer clean wins\n    extra = []\n    cyc = swing_profile(m.closes)                                   # this stock's own swing rhythm\n    if cyc:\n        if cyc[\"trend\"] == 1 and cyc[\"pos\"] is not None and cyc[\"pos\"] < 0.35 and cyc[\"up\"] >= up * 1.5:\n            p += 0.04\n            extra.append(f\"early in an up-swing (its swings usually run +{cyc['up']:g}% over ~{cyc['days']} days)\")\n        elif cyc[\"trend\"] == 1 and cyc[\"pos\"] is not None and cyc[\"pos\"] > 0.9:\n            p -= 0.04\n            extra.append(f\"late in its up-swing (already near its usual +{cyc['up']:g}%)\")\n        elif cyc[\"trend\"] == -1:\n            p -= 0.02\n            extra.append(\"still in a down-swing\")\n    adj, note = learned_nudge(m.symbol, setup, learn)\n    p += adj\n    if note:\n        extra.append(\"learned: \" + note)\n    p = max(0.0, min(1.0, p))\n    ev = p * up - (1 - p) * down                                    # expected % per trade with your exits\n    score = 0.7 * ev + 0.3 * max(-3.0, min(3.0, pr[\"avg\"]))\n    return {\"score\": round(score, 2), \"p\": round(p, 2), \"ev\": round(ev, 2), \"avg\": pr[\"avg\"], \"n\": pr[\"n\"], \"cycle\": cyc,\n            \"why\": f\"{round(p * 100)}% odds of +{up:g}% before -{down:g}% (from {pr['n']} similar days in the past year), \"\n                   f\"avg 2-week move {pr['avg']:+.1f}%\" + (\"; \" + \"; \".join(extra) if extra else \"\")}\n\n\nOCC_RE = re.compile(r\"^([A-Z.]+?)(\\d{6})([CP])(\\d{8})$\")\n\n\ndef occ_parts(occ: str) -> tuple[str, str, float] | None:\n    \"\"\"'CRWV260116P00045000' -> ('CRWV', '2026-01-16', 45.0).\"\"\"\n    mm = OCC_RE.match(occ or \"\")\n    if not mm:\n        return None\n    d = mm.group(2)\n    return mm.group(1), f\"20{d[:2]}-{d[2:4]}-{d[4:]}\", int(mm.group(4)) / 1000\n\n\ndef occ_label(occ: str) -> str:\n    pt = occ_parts(occ)\n    return f\"{pt[0]} put ${pt[2]:g} {pt[1][5:].replace('-', '/')}\" if pt else occ\n\n\ndef paper_trade(paper: \"Paper | None\", alerts: list[Alert], allm: dict, cfg: dict, regime: bool,\n                state: dict, now_iso: str, market_open: bool, mkt: \"NewsView | None\" = None,\n                close_soon: bool = False) -> list[Alert]:\n    \"\"\"Each scan: follow the bot's buy alerts with fake money, sell by your rules, and keep a log for the app.\n    Sells: your sell line (-stop %), a trailing line once it's up by the profit %, or the bot saying SELL.\"\"\"\n    ps = state.setdefault(\"paper\", {})\n    if not paper:\n        ps[\"on\"] = False\n        return []\n    out: list[Alert] = []\n    trades = ps.setdefault(\"trades\", [])\n    peaks = ps.setdefault(\"peaks\", {})\n    today = now_iso[:10]\n    try:\n        acct, pos = paper.account(), paper.positions()\n    except ApiError as e:\n        ps.update(on=True, error=str(e)[:160])\n        print(f\"Paper account: {e}\")\n        return []\n    ps[\"error\"] = \"\"\n    budget = float(cfg.get(\"paper_start\", 10000))\n    real_eq = _f(acct.get(\"equity\"))\n    # Alpaca paper accounts start at $100k: the bot only ever uses a $10k slice of it and shows that slice.\n    if \"base\" not in ps or (not pos and abs(real_eq - ps[\"base\"]) > budget):\n        ps[\"base\"] = round(real_eq, 2)   # first look, or the account was reset in Alpaca\n    def slice_eq(eq: float) -> float:\n        return budget + (eq - ps[\"base\"])\n    equity = slice_eq(real_eq)\n    held = {p[\"symbol\"]: p for p in pos}\n\n    learn = ps[\"learn\"] = paper_learn(trades)          # the bot's own record, re-read every scan\n    if market_open:\n        stop, prof = cfg[\"stop_pct\"], cfg[\"profit_pct\"]\n        idx = [allm[t] for t in (\"QQQ\", \"SPY\") if t in allm and allm[t].prev_close]\n        falling = [m for m in idx if m.day_chg_pct <= -0.6 or (m.price < m.sma20 and m.day_chg_pct < 0)\n                   or (m.sma200 and m.price < m.sma200)]           # downtrend: under its 200-day average\n        bought_on = {t[\"sym\"]: t.get(\"day\") for t in trades if t[\"side\"] == \"buy\"}\n        # 1. Sells\n        for sym, p in list(held.items()):\n            plpc = _f(p.get(\"unrealized_plpc\")) * 100\n            if p.get(\"asset_class\") == \"us_option\":\n                pt = occ_parts(sym)\n                um = allm.get(pt[0]) if pt else None\n                days = (date.fromisoformat(pt[1]) - date.fromisoformat(today)).days if pt else 99\n                why = (\"took profit (+50% or more)\" if plpc >= 50 else \"cut the loss (-40%)\" if plpc <= -40 else\n                       f\"expires in {days} days\" if days <= 14 else\n                       \"the stock recovered above its 50-day average, so the bet is off\" if um and um.price > um.sma50 else \"\")\n                if not why:\n                    continue\n                try:\n                    paper.close(sym)\n                except ApiError as e:\n                    print(f\"Paper put sell {sym} failed: {e}\")\n                    continue\n                pl = _f(p.get(\"unrealized_pl\"))\n                trades.append({\"t\": now_iso[:16], \"side\": \"sell\", \"sym\": occ_label(sym), \"qty\": _f(p.get(\"qty\")),\n                               \"price\": round(_f(p.get(\"current_price\")), 2), \"entry\": round(_f(p.get(\"avg_entry_price\")), 2),\n                               \"pl\": round(pl, 2), \"plpc\": round(plpc, 2), \"why\": why, \"day\": today, \"put\": True})\n                held.pop(sym)\n                out.append(Alert(f\"paper:sell:{today}:{sym}\", \"paper\", f\"📝 Paper SELL {occ_label(sym)} {plpc:+.0f}% ({signed_money(pl)})\",\n                                 compose(f\"Closed the paper put: {why}.\", [\"Fake money, real option prices.\"]),\n                                 -1, pt[0] if pt else \"\", color=COLORS[\"green\" if pl >= 0 else \"red\"]))\n                continue\n            peak = max(peaks.get(sym, plpc), plpc)\n            peaks[sym] = round(peak, 2)\n            line = -stop if peak < prof else max(0.0, peak - stop)   # once up +profit %, never let it turn into a loss\n            m = allm.get(sym)\n            st = assess(m, cfg, regime, news_view(state, sym, now_iso), mkt, owned=True)[\"status\"] if m else \"\"\n            fresh = bought_on.get(sym) == today       # bought today: only the sell line, no trend sells (stops buy-then-dump churn)\n            why = (f\"hit the sell line ({line:+.1f}%)\" if plpc <= line else\n                   \"the market stopped falling, so the hedge is off\" if sym in INVERSE and idx and not falling and not fresh else\n                   \"the bot says SELL: the trend is breaking\" if st == \"SELL\" and not fresh and sym not in INVERSE else \"\")\n            if not why:\n                continue\n            try:\n                paper.close(sym)\n            except ApiError as e:\n                print(f\"Paper sell {sym} failed: {e}\")\n                continue\n            pl = _f(p.get(\"unrealized_pl\"))\n            trades.append({\"t\": now_iso[:16], \"side\": \"sell\", \"sym\": sym, \"qty\": round(_f(p.get(\"qty\")), 4),\n                           \"price\": round(_f(p.get(\"current_price\")), 2), \"entry\": round(_f(p.get(\"avg_entry_price\")), 2),\n                           \"pl\": round(pl, 2), \"plpc\": round(plpc, 2), \"why\": why, \"day\": today})\n            peaks.pop(sym, None)\n            held.pop(sym)\n            out.append(Alert(f\"paper:sell:{today}:{sym}\", \"paper\", f\"📝 Paper SELL {sym} {plpc:+.1f}% ({signed_money(pl)})\",\n                             compose(f\"Sold the paper position: {why}.\", [f\"Bought at {money(_f(p.get('avg_entry_price')))}, \"\n                                     f\"sold near {money(_f(p.get('current_price')))}. Fake money, real prices.\"]),\n                             -1, sym, color=COLORS[\"green\" if pl >= 0 else \"red\"]))\n        # 2. Buys: every real buy alert, plus (paper only, to put the money to work) any stock the bot rates\n        #    BUY / STRONG BUY and its single best idea when confidence is decent. Sized from the $10k slice.\n        sold_today = {t[\"sym\"] for t in trades if t.get(\"day\") == today and t[\"side\"] == \"sell\"}\n        cash = equity - sum(_f(p.get(\"market_value\")) for p in pos)   # cash left in the $10k slice\n        # Real buy alerts first, then every stock the prediction likes, best predicted payoff first.\n        picks = [(a.symbol, a.title.split(\"·\")[0].strip()[:80]) for a in alerts if a.kind == \"buy\" and a.symbol]\n        cats = {e[0] for e in ((state.get(\"news\") or {}).get(\"events\") or {}).items()\n                if any(abs((r + [0, 0])[1]) >= 2 and str((r + [\"\"])[0])[:10] == today for r in e[1])}\n        every_o, outlooks = {}, []\n        for m in allm.values():\n            if m.symbol in MACRO_TICKERS or m.symbol in held:\n                continue\n            o = paper_outlook(m, cfg, regime, news_view(state, m.symbol, now_iso), m.symbol in cats, learn)\n            if o[\"p\"] is None:\n                continue\n            every_o[m.symbol] = o\n            if (o[\"p\"] >= cfg.get(\"paper_min_odds\", 0.55) + (0 if regime else cfg.get(\"paper_weak_extra_odds\", 0.05))\n                    and o[\"score\"] >= cfg.get(\"paper_min_score\", 0.3)):\n                outlooks.append((o[\"score\"], m.symbol, o))\n        outlooks.sort(reverse=True)\n        ps[\"outlook\"] = [{\"sym\": s_, \"score\": o[\"score\"], \"p\": o[\"p\"], \"avg\": o[\"avg\"]} for _, s_, o in outlooks[:10]]\n        ever = {t[\"sym\"] for t in trades if t[\"side\"] == \"buy\"}\n        asked = [s_ for s_ in cfg.get(\"paper_buy_list\") or [] if s_ not in held and s_ not in ever and s_ in allm]\n        recent = {t[\"sym\"] for t in trades if t[\"side\"] == \"buy\" and t.get(\"day\", \"\") >= (date.fromisoformat(today) - timedelta(days=7)).isoformat()}\n        dips = []\n        for s_ in cfg.get(\"paper_quality\") or []:\n            m = allm.get(s_)\n            if not m or s_ in held or s_ in recent or s_ in sold_today or len(m.closes) < 63 or not m.prev_close:\n                continue\n            off = (1 - m.price / max(m.closes[-63:])) * 100\n            nv = news_view(state, s_, now_iso)\n            if (off >= cfg.get(\"paper_dip_pct\", 8) and m.sma200 and m.price > m.sma200 * 0.9\n                    and m.day_chg_pct > -2.5 and nv.score > -0.5):\n                dips.append((off, s_, nv))\n        dips.sort(reverse=True)\n        dips = dips[:2]\n        asked += [s_ for _, s_, _ in dips if s_ not in asked]\n        picks = ([(s_, \"you asked for it\" + (\"; prediction: \" + every_o[s_][\"why\"] if s_ in every_o else \"\")) for s_ in asked if s_ not in {d[1] for d in dips}]\n                 + [(s_, f\"big-name dip: {off:.0f}% under its 3-month high, long-term trend intact\"\n                     + (f\"; news: {nv.headline[:70]}\" if nv.headline else \"\")) for off, s_, nv in dips] + picks)\n        picks += [(s_, \"prediction: \" + o[\"why\"]) for _, s_, o in outlooks]\n        # At least one buy a day: if nothing qualified, take the single best prediction available (smaller size).\n        bought_today = any(t[\"side\"] == \"buy\" and t.get(\"day\") == today for t in trades)\n        if not picks and not bought_today and every_o and regime:\n            s_, o = max(every_o.items(), key=lambda kv: kv[1][\"score\"])\n            if o[\"p\"] >= 0.45:\n                picks.append((s_, \"best prediction available today: \" + o[\"why\"]))\n\n        def size_pct(sym: str) -> float:\n            \"\"\"How much of the $10k to put in: more when the odds are better (half-Kelly), 3%-25%.\"\"\"\n            o = every_o.get(sym)\n            if not o:\n                return float(cfg.get(\"paper_position_pct\", 10))\n            up, down = cfg[\"profit_pct\"], cfg[\"stop_pct\"]\n            kelly = (o[\"p\"] * up - (1 - o[\"p\"]) * down) / max(up, 0.1)\n            return round(max(3.0, min(25.0, kelly * 50)), 1)\n        cap = int(cfg.get(\"paper_max_positions\", 0) or 0)\n        seen = set()\n        from zoneinfo import ZoneInfo\n        _ny = parse_ts(now_iso).astimezone(ZoneInfo(\"America/New_York\"))\n        if _ny.hour * 60 + _ny.minute < 9 * 60 + 30 + int(cfg.get(\"paper_open_wait_min\", 30)):\n            picks = []                 # let the opening swings settle before buying\n        for sym, reason in picks:\n            if sym in seen or sym in held or sym in sold_today:\n                continue\n            sl = learn[\"syms\"].get(sym)\n            if (sl and len(sl[\"last\"]) >= 2 and all(x < 0 for x in sl[\"last\"][-2:]) and sl.get(\"day\")\n                    and sl[\"day\"] >= (date.fromisoformat(today) - timedelta(days=5)).isoformat()):\n                continue                   # lost on it the last 2 times: sit it out for 5 days\n            seen.add(sym)\n            if cap and len(held) >= cap:\n                break\n            m0 = allm.get(sym)\n            try:\n                if m0 and assess(m0, cfg, regime, news_view(state, sym, now_iso), mkt, owned=True)[\"status\"] == \"SELL\":\n                    continue               # its own check already says SELL: buying it would just be sold next scan\n            except (AttributeError, TypeError, ValueError):\n                pass\n            pct_ = max(5.0, min(10.0, size_pct(sym))) if sym in asked else size_pct(sym)\n            dollars = min(equity * pct_ / 100, cash * 0.98)\n            mm_ = allm.get(sym)\n            if mm_ and risk_label(mm_.atr_pct) == \"HIGHER\":\n                dollars = min(dollars, float(cfg.get(\"paper_high_risk_max\", 200)))   # jumpy stock: small bet\n            if dollars < 25:\n                break\n            coid = f\"nt-{today}-{sym}-{now_iso[11:16].replace(':', '')}\"\n            try:\n                o = paper.buy(sym, dollars, coid)\n            except ApiError as e:\n                print(f\"Paper buy {sym} failed: {e}\")\n                continue\n            m = allm.get(sym)\n            price = m.price if m else 0.0\n            cash -= dollars\n            held[sym] = {\"symbol\": sym}\n            trades.append({\"t\": now_iso[:16], \"side\": \"buy\", \"sym\": sym, \"dollars\": round(dollars, 2),\n                           \"qty\": round(dollars / price, 4) if price else None, \"price\": round(price, 2),\n                           \"why\": reason, \"day\": today, \"id\": o.get(\"id\", \"\")})\n            out.append(Alert(f\"paper:buy:{today}:{sym}\", \"paper\", f\"📝 Paper BUY {sym}: {money(dollars)} at ~{money(price)}\",\n                             compose(f\"The bot bought {sym} with fake money: {reason}.\",\n                                     [f\"Sell line {-stop:.0f}%; once it's up {prof:.0f}% the line moves up so it can't turn into a loss.\"]),\n                             -1, sym, color=COLORS[\"buy\"]))\n        # 3. Puts: bet on a drop when the prediction says a stock is likely to fall (always a small, capped bet)\n        if cfg.get(\"paper_puts\", True):\n            put_val = sum(_f(p.get(\"market_value\")) for p in pos if p.get(\"asset_class\") == \"us_option\")\n            room = equity * cfg.get(\"paper_puts_max_pct\", 15) / 100 - put_val\n            have = {(occ_parts(s_) or (\"\",))[0] for s_ in held}\n            watch = set(cfg.get(\"bear_watch\") or [])\n            bears = []\n            # Market hedge: index puts cost $1,000+ a contract (over the $200 cap), so use an inverse fund instead\n            hedged = any(s_ in held for s_ in INVERSE)\n            if cfg.get(\"paper_market_put\", True) and falling and not hedged and not any(\n                    t[\"sym\"] in INVERSE and t[\"side\"] == \"buy\" and t.get(\"day\") == today for t in trades):\n                m = min(falling, key=lambda x: x.day_chg_pct)\n                inv = {\"QQQ\": \"PSQ\", \"SPY\": \"SH\"}[m.symbol]\n                dollars = min(equity * float(cfg.get(\"paper_hedge_pct\", 5)) / 100, room, cash * 0.98)\n                if dollars >= 25:\n                    why = (f\"market hedge: {m.symbol} {m.day_chg_pct:+.1f}% today\"\n                           + (f\", {(1 - m.price / m.sma200) * 100:.1f}% under its 200-day average\" if m.sma200 and m.price < m.sma200\n                              else \", under its 20-day average\" if m.price < m.sma20 else \"\")\n                           + f\"; {inv} rises about 1% for every 1% {m.symbol} falls\")\n                    try:\n                        o = paper.buy(inv, dollars, f\"nt-hedge-{today}-{inv}\")\n                        cash -= dollars\n                        room -= dollars\n                        held[inv] = {\"symbol\": inv}\n                        trades.append({\"t\": now_iso[:16], \"side\": \"buy\", \"sym\": inv, \"dollars\": round(dollars, 2), \"qty\": None,\n                                       \"price\": 0.0, \"why\": why, \"day\": today, \"id\": o.get(\"id\", \"\"), \"put\": True})\n                        out.append(Alert(f\"paper:hedge:{today}\", \"paper\", f\"📝 Paper HEDGE {inv}: {money(dollars)} (bet the market falls)\",\n                                         compose(f\"The market is weak, so the bot bet on it falling: {why}.\",\n                                                 [\"Sold at the same -2% line, or once the market stops falling.\",\n                                                  \"This works like a put but can't expire worthless.\"]), -1, inv, color=COLORS[\"red\"]))\n                    except ApiError as e:\n                        ps[\"error\"] = f\"hedge: {e}\"[:160]\n            for m in allm.values():\n                if m.symbol in MACRO_TICKERS or m.symbol in have or not m.sma50 or m.price >= m.sma50:\n                    continue          # only stocks already in a downtrend (below their 50-day average)\n                pr = predict_move(m.closes, cfg[\"profit_pct\"], cfg[\"stop_pct\"])\n                if pr[\"q\"] is None or pr[\"avg\"] >= 0:\n                    continue\n                q = pr[\"q\"] + (0.04 if m.symbol in watch else 0) - (0.03 if regime and not falling else 0) + (0.02 if falling else 0)\n                if q >= cfg.get(\"paper_put_min_odds\", 0.58):\n                    bears.append((q, m, pr))\n            bears.sort(key=lambda x: (-x[0], x[2][\"avg\"]))\n            for q, m, pr in bears[:2]:\n                cap = min(float(cfg.get(\"paper_high_risk_max\", 200)), room, cash * 0.98)\n                if cap < 30:\n                    break\n                d0 = date.fromisoformat(today)\n                try:\n                    cons = paper.put_contracts(m.symbol, (d0 + timedelta(days=40)).isoformat(), (d0 + timedelta(days=100)).isoformat(),\n                                               m.price * (0.9 if pr.get(\"market\") else 0.85), m.price)\n                except ApiError as e:\n                    ps[\"error\"] = f\"puts: {e}\"[:160]\n                    break\n                if not cons:\n                    continue\n                aim = 0.97 if pr.get(\"market\") else 0.95\n                c = min(cons, key=lambda x: (abs(_f(x.get(\"strike_price\")) - m.price * aim), x.get(\"expiration_date\", \"\")))\n                occ = c.get(\"symbol\", \"\")\n                try:\n                    ask = paper.option_ask(occ)\n                except ApiError:\n                    ask = 0.0\n                qty = int(cap // (ask * 100)) if ask > 0 else 0\n                if qty < 1:\n                    print(f\"  put {occ}: {money(ask * 100)} a contract, over the {money(cap)} cap\" if ask > 0 else f\"  put {occ}: no price\")\n                    continue\n                try:\n                    o = paper.buy_option(occ, qty, round(ask, 2), f\"nt-put-{today}-{m.symbol}\")\n                except ApiError as e:\n                    ps[\"error\"] = f\"puts: {e}\"[:160]\n                    print(f\"Paper put {occ} failed: {e}\")\n                    continue\n                cost = qty * ask * 100\n                cash -= cost\n                room -= cost\n                held[occ] = {\"symbol\": occ}\n                why = (f\"market hedge: {m.symbol} {m.day_chg_pct:+.1f}% today\"\n                       + (f\", {(1 - m.price / m.sma200) * 100:.1f}% under its 200-day average\" if m.sma200 and m.price < m.sma200\n                          else \", under its 20-day average\" if m.price < m.sma20 else \"\") + \"; pays off if the whole market keeps falling\"\n                       if pr.get(\"market\") else\n                       f\"{round(q * 100)}% odds it falls {cfg['stop_pct']:g}% before rising {cfg['profit_pct']:g}% \"\n                       f\"(from {pr['n']} similar days), avg 2-week move {pr['avg']:+.1f}%, below its 50-day average\"\n                       + (\"; weak finances (debt-heavy AI name)\" if m.symbol in watch else \"\"))\n                trades.append({\"t\": now_iso[:16], \"side\": \"buy\", \"sym\": occ_label(occ), \"dollars\": round(cost, 2), \"qty\": qty,\n                               \"price\": round(ask, 2), \"why\": \"put: \" + why, \"day\": today, \"id\": o.get(\"id\", \"\"), \"put\": True})\n                out.append(Alert(f\"paper:put:{today}:{m.symbol}\", \"paper\", f\"📝 Paper PUT {occ_label(occ)}: {money(cost)}\",\n                                 compose(f\"Bet that {m.symbol} falls: {qty} put contract(s) at {money(ask)} each share.\",\n                                         [\"Why: \" + why + \".\", \"Sells at +50%, at -40%, 2 weeks before expiry, or if the stock recovers.\",\n                                          \"Puts can lose everything paid. Capped at $200 because it's high risk.\"]),\n                                 -1, m.symbol, color=COLORS[\"red\"]))\n        if out:\n            try:\n                acct, pos = paper.account(), paper.positions()\n                real_eq = _f(acct.get(\"equity\"))\n                equity = slice_eq(real_eq)\n            except ApiError:\n                pass\n    # 3. Fill in real fill prices for recent buys\n    if any(t[\"side\"] == \"buy\" and t.get(\"id\") and not t.get(\"filled\") for t in trades[-20:]):\n        try:\n            fills = {o[\"id\"]: o for o in paper.orders(50)}\n            for t in trades[-20:]:\n                o = fills.get(t.get(\"id\") or \"\")\n                if o and o.get(\"filled_avg_price\"):\n                    t.update(price=round(_f(o[\"filled_avg_price\"]), 2), qty=round(_f(o.get(\"filled_qty\")), 4), filled=True)\n        except ApiError:\n            pass\n    sells = [t for t in trades if t[\"side\"] == \"sell\"]\n    total = equity - budget\n    bal = (f\"Paper balance {money(equity)}: {signed_money(total)} ({total / budget * 100:+.2f}%) since {money(budget)}\"\n           f\" · today {signed_money(real_eq - _f(acct.get('last_equity'), real_eq))}\")\n    for a in out:\n        a.message += \"\\n\" + bal\n    if market_open and close_soon and f\"paper:day:{today}\" not in set(state.get(\"sent_today\", [])):\n        lines = [f\"{p['symbol']}: {_f(p.get('unrealized_plpc')) * 100:+.1f}% ({signed_money(_f(p.get('unrealized_pl')))})\" for p in pos]\n        done = [t for t in sells if t.get(\"day\") == today]\n        lines += [f\"Sold {t['sym']} today: {t['plpc']:+.1f}% ({signed_money(t['pl'])})\" for t in done]\n        out.append(Alert(f\"paper:day:{today}\", \"paper\",\n                         f\"📝 Paper account {money(equity)} ({total / budget * 100:+.2f}%)\",\n                         compose(bal + \".\", lines or [\"No open paper trades.\"]), -1, color=COLORS[\"green\" if total >= 0 else \"red\"]))\n    ps.update(on=True, updated=now_iso[:16], equity=round(equity, 2),\n              cash=round(equity - sum(_f(p.get(\"market_value\")) for p in pos), 2), start=budget,\n              day_pl=round(real_eq - _f(acct.get(\"last_equity\"), real_eq), 2),\n              wins=sum(t[\"pl\"] > 0 for t in sells), losses=sum(t[\"pl\"] <= 0 for t in sells),\n              positions=[{\"sym\": occ_label(p[\"symbol\"]) if p.get(\"asset_class\") == \"us_option\" else p[\"symbol\"],\n                          \"qty\": round(_f(p.get(\"qty\")), 4), \"entry\": round(_f(p.get(\"avg_entry_price\")), 2),\n                          \"price\": round(_f(p.get(\"current_price\")), 2), \"value\": round(_f(p.get(\"market_value\")), 2),\n                          \"pl\": round(_f(p.get(\"unrealized_pl\")), 2), \"plpc\": round(_f(p.get(\"unrealized_plpc\")) * 100, 2),\n                          \"day\": round(_f(p.get(\"change_today\")) * 100, 2),\n                          \"line\": round(-cfg[\"stop_pct\"] if peaks.get(p[\"symbol\"], 0) < cfg[\"profit_pct\"]\n                                        else max(0.0, peaks[p[\"symbol\"]] - cfg[\"stop_pct\"]), 1)} for p in pos])\n    del trades[:-200]\n    return out\n\n\ndef paper_charts(paper: \"Paper | None\", alp: \"Alpaca\", state: dict, now_iso: str) -> None:\n    \"\"\"Chart data for the app: the paper account's value over time (shifted to the $10k slice) and\n    today's 1-minute prices and a year of daily closes for each stock it owns. Never breaks the scan.\"\"\"\n    ps = state.get(\"paper\") or {}\n    if not paper or \"base\" not in ps:\n        return\n    budget, base = float(ps.get(\"start\") or 10000), float(ps[\"base\"])\n    first = min((t[\"t\"] for t in ps.get(\"trades\") or [] if t.get(\"t\")), default=now_iso[:16])\n    since = parse_ts(first + (\"\" if len(first) > 16 else \":00\") + (\"\" if first.endswith(\"Z\") else \"Z\")).timestamp() - 86400\n    chart = {}\n    for key, period, tf in ((\"1D\", \"1D\", \"1Min\"), (\"1W\", \"1W\", \"15Min\"), (\"ALL\", \"1A\", \"1D\")):\n        try:\n            h = http_json(\"GET\", f\"{PAPER_URL}/v2/account/portfolio/history\", paper.h,\n                          {\"period\": period, \"timeframe\": tf, \"intraday_reporting\": \"extended_hours\"}) or {}\n        except ApiError as e:\n            print(f\"Paper chart {key} skipped: {e}\")\n            continue\n        pts = [[int(t), round(budget + (float(v) - base), 2)] for t, v in zip(h.get(\"timestamp\") or [], h.get(\"equity\") or [])\n               if v and float(v) > 0 and int(t) >= since]\n        if len(pts) >= 2:\n            chart[key] = pts\n    if chart:\n        ps[\"chart\"] = chart\n    syms = sorted({t for t in (str(p.get(\"sym\") or \"\").split(\" \")[0] for p in ps.get(\"positions\") or [])\n                   if t and \"/\" not in t and not t.endswith(\"USD\")})   # stocks, and the stocks under its puts (not crypto)\n    if not syms:\n        ps[\"intraday\"], ps[\"daily\"] = {}, {}\n        return\n    from zoneinfo import ZoneInfo\n    ny = parse_ts(now_iso).astimezone(ZoneInfo(\"America/New_York\"))\n    start = ny.replace(hour=4, minute=0, second=0, microsecond=0)\n    if ny < start:                           # before 4 AM: show the last session\n        start -= timedelta(days=1)\n    while start.weekday() >= 5:              # weekend: show Friday\n        start -= timedelta(days=1)\n    def bars_for(tf: str, since_: str, pages: int) -> dict:\n        params = {\"symbols\": \",\".join(syms[:30]), \"timeframe\": tf, \"start\": since_,\n                  \"feed\": alp.feed, \"limit\": 10000, \"sort\": \"asc\", \"adjustment\": \"all\"}\n        got: dict = {}\n        for _ in range(pages):                # many stocks x many bars spans several pages\n            r = http_json(\"GET\", f\"{DATA_URL}/v2/stocks/bars\", alp.h, params) or {}\n            for s_, v in (r.get(\"bars\") or {}).items():\n                got.setdefault(s_, []).extend(v)\n            if not r.get(\"next_page_token\"):\n                break\n            params[\"page_token\"] = r[\"next_page_token\"]\n        return got\n    pts = lambda v: [[int(_safe_ts(b[\"t\"]).timestamp()), round(float(b[\"c\"]), 2)] for b in v]\n    try:\n        ps[\"intraday\"] = {s: pts(v)[-960:] for s, v in bars_for(\"1Min\", start.isoformat(), 4).items() if v}   # every minute it traded (free feed: 8 AM-5 PM ET)\n    except ApiError as e:\n        print(f\"Paper intraday skipped: {e}\")\n    try:                                      # a year of daily closes for each stock it owns\n        yr = (ny - timedelta(days=372)).date().isoformat()\n        ps[\"daily\"] = {s: pts(v)[-260:] for s, v in bars_for(\"1Day\", yr, 2).items() if v}\n    except ApiError as e:\n        print(f\"Paper daily history skipped: {e}\")\n\n\n# ---- 24-hour trading for the paper account: stocks 24/5 (pre-market, after-hours, overnight) + crypto 24/7 ----\ndef et_session(now_iso: str) -> str:\n    \"\"\"'regular', 'pre' (4:00-9:30 ET), 'post' (16:00-20:00), 'overnight' (20:00-4:00, Sun night to Fri morning) or 'closed'.\"\"\"\n    from zoneinfo import ZoneInfo\n    t = parse_ts(now_iso).astimezone(ZoneInfo(\"America/New_York\"))\n    wd, mins = t.weekday(), t.hour * 60 + t.minute\n    if wd == 5 or (wd == 6 and mins < 20 * 60) or (wd == 4 and mins >= 20 * 60):\n        return \"closed\"\n    if wd == 6 or mins >= 20 * 60 or mins < 4 * 60:\n        return \"overnight\"\n    if mins < 9 * 60 + 30:\n        return \"pre\"\n    return \"regular\" if mins < 16 * 60 else \"post\"\n\n\ndef fresh_prices(alp: \"Alpaca\", symbols: list[str], now_iso: str, max_age_min: int = 20) -> dict[str, float]:\n    \"\"\"Latest trade prices that are actually recent (overnight/extended-hours feeds first, then IEX).\"\"\"\n    out: dict[str, float] = {}\n    now = parse_ts(now_iso)\n    for feed in (\"overnight\", \"boats\", \"iex\"):\n        need = [s for s in symbols if s not in out]\n        if not need:\n            break\n        try:\n            data = http_json(\"GET\", f\"{DATA_URL}/v2/stocks/snapshots\", alp.h, {\"symbols\": \",\".join(need), \"feed\": feed}) or {}\n        except ApiError:\n            continue\n        for sym, snap in (data.get(\"snapshots\", data) or {}).items():\n            tr = (snap or {}).get(\"latestTrade\") or {}\n            if tr.get(\"p\") and tr.get(\"t\") and (now - _safe_ts(tr[\"t\"])).total_seconds() <= max_age_min * 60:\n                out[sym] = float(tr[\"p\"])\n    return out\n\n\ndef _paper_size(o: dict | None, equity: float, cash: float, cfg: dict, risky: bool, up: float, down: float) -> float:\n    pct = float(cfg.get(\"paper_position_pct\", 10))\n    if o and o.get(\"p\") is not None:\n        pct = max(3.0, min(25.0, (o[\"p\"] * up - (1 - o[\"p\"]) * down) / max(up, 0.1) * 50))\n    d = min(equity * pct / 100, cash * 0.98)\n    return min(d, float(cfg.get(\"paper_high_risk_max\", 200))) if risky else d\n\n\ndef paper_extended(paper: \"Paper\", alp: \"Alpaca\", cfg: dict, state: dict, now_iso: str, session: str) -> list[Alert]:\n    \"\"\"Stocks outside regular hours: limit orders only (Alpaca's rule), priced a little past the last trade so they fill.\n    Sells by the same rules as the day session; buys the bot's top predictions while their price is live.\"\"\"\n    ps = state.setdefault(\"paper\", {})\n    trades, peaks, today = ps.setdefault(\"trades\", []), ps.setdefault(\"peaks\", {}), now_iso[:10]\n    acct, pos = paper.account(), paper.positions()\n    stocks = {p[\"symbol\"]: p for p in pos if p.get(\"asset_class\") == \"us_equity\"}\n    want = [o[\"sym\"] for o in (ps.get(\"outlook\") or [])[:8] if o.get(\"sym\") and o[\"sym\"] not in stocks]\n    px = fresh_prices(alp, sorted(set(stocks) | set(want)), now_iso)\n    budget = float(cfg.get(\"paper_start\", 10000))\n    equity = budget + (_f(acct.get(\"equity\")) - ps.get(\"base\", _f(acct.get(\"equity\"))))\n    cash = equity - sum(_f(p.get(\"market_value\")) for p in pos)\n    stop, prof, out = cfg[\"stop_pct\"], cfg[\"profit_pct\"], []\n    label = {\"pre\": \"pre-market\", \"post\": \"after-hours\", \"overnight\": \"overnight\"}.get(session, session)\n    for sym, p in stocks.items():\n        if sym not in px:\n            continue\n        entry = _f(p.get(\"avg_entry_price\"))\n        plpc = (px[sym] / entry - 1) * 100 if entry else 0\n        peak = max(peaks.get(sym, plpc), plpc)\n        peaks[sym] = round(peak, 2)\n        line = -stop if peak < prof else max(0.0, peak - stop)\n        if plpc > line:\n            continue\n        qty = abs(_f(p.get(\"qty\")))\n        try:\n            paper.sell_limit(sym, qty, round(px[sym] * 0.995, 2), f\"nt-xs-{today}-{sym}-{now_iso[11:16].replace(':', '')}\")\n        except ApiError as e:\n            print(f\"Paper {label} sell {sym} failed: {e}\")\n            continue\n        pl = (px[sym] - entry) * qty\n        trades.append({\"t\": now_iso[:16], \"side\": \"sell\", \"sym\": sym, \"qty\": round(qty, 4), \"price\": round(px[sym], 2),\n                       \"entry\": round(entry, 2), \"pl\": round(pl, 2), \"plpc\": round(plpc, 2), \"day\": today,\n                       \"why\": f\"hit the sell line ({line:+.1f}%) {label}\"})\n        peaks.pop(sym, None)\n        out.append(Alert(f\"paper:xsell:{today}:{sym}\", \"paper\", f\"📝 Paper SELL {sym} {plpc:+.1f}% ({label})\",\n                         compose(f\"Sold {label} at about {money(px[sym])}: it hit the sell line.\", [\"Fake money, real prices.\"]),\n                         -1, sym, color=COLORS[\"green\" if pl >= 0 else \"red\"]))\n    if want:\n        mets = build_metrics(alp, want, today, False, live=False)\n        bought = {t[\"sym\"] for t in trades if t.get(\"day\") == today}\n        for sym in want:\n            m = mets.get(sym)\n            if not m or sym not in px or sym in bought or cash < 30:\n                continue\n            if px[sym] > m.price * 1.04:\n                continue                       # already jumped >4% since the close: don't chase it overnight\n            m.price = px[sym]\n            m.closes = (m.closes or [])[:-1] + [px[sym]]\n            o = paper_outlook(m, cfg, True, news_view(state, sym, now_iso), False, (state.get(\"paper\") or {}).get(\"learn\"))\n            if o[\"p\"] is None or o[\"p\"] < cfg.get(\"paper_min_odds\", 0.55) or o[\"score\"] < cfg.get(\"paper_min_score\", 0.3):\n                continue\n            dollars = _paper_size(o, equity, cash, cfg, risk_label(m.atr_pct) == \"HIGHER\", prof, stop)\n            limit = round(px[sym] * 1.003, 2)          # pay a hair above the last trade so it fills\n            qty = round(dollars / limit, 4)\n            if dollars < 25 or qty <= 0:\n                continue\n            try:\n                o_ = paper.buy_limit(sym, qty, limit, f\"nt-xb-{today}-{sym}-{now_iso[11:16].replace(':', '')}\")\n            except ApiError as e:\n                print(f\"Paper {label} buy {sym} failed: {e}\")\n                continue\n            cash -= dollars\n            trades.append({\"t\": now_iso[:16], \"side\": \"buy\", \"sym\": sym, \"dollars\": round(dollars, 2), \"qty\": qty,\n                           \"price\": limit, \"why\": f\"{label} prediction: \" + o[\"why\"], \"day\": today, \"id\": o_.get(\"id\", \"\")})\n            out.append(Alert(f\"paper:xbuy:{today}:{sym}\", \"paper\", f\"📝 Paper BUY {sym} {label}: {money(dollars)} at ~{money(limit)}\",\n                             compose(f\"Bought {label}: {o['why']}.\", [\"Limit order a hair above the last trade so it fills.\",\n                                     \"Extended-hours prices can jump more than in the day session.\"]),\n                             -1, sym, color=COLORS[\"buy\"]))\n    return out\n\n\ndef crypto_bars(alp: \"Alpaca\", pairs: list[str], days: int = 400) -> dict[str, list[float]]:\n    start = (datetime.now(timezone.utc) - timedelta(days=days)).strftime(\"%Y-%m-%dT00:00:00Z\")\n    r = http_json(\"GET\", f\"{DATA_URL}/v1beta3/crypto/us/bars\", alp.h,\n                  {\"symbols\": \",\".join(pairs), \"timeframe\": \"1Day\", \"start\": start, \"limit\": 10000}) or {}\n    last = http_json(\"GET\", f\"{DATA_URL}/v1beta3/crypto/us/latest/trades\", alp.h, {\"symbols\": \",\".join(pairs)}) or {}\n    out = {}\n    for pr in pairs:\n        closes = [float(b[\"c\"]) for b in (r.get(\"bars\") or {}).get(pr) or [] if b.get(\"c\")]\n        lp = ((last.get(\"trades\") or {}).get(pr) or {}).get(\"p\")\n        if closes and lp:\n            closes[-1] = float(lp)\n        if closes:\n            out[pr] = closes\n    return out\n\n\ndef paper_crypto(paper: \"Paper\", alp: \"Alpaca\", cfg: dict, state: dict, now_iso: str) -> list[Alert]:\n    \"\"\"Crypto trades 24/7. Wider exits (crypto swings more), always counted as high risk ($200 cap).\"\"\"\n    pairs = cfg.get(\"paper_crypto\") or []\n    if not pairs:\n        return []\n    ps = state.setdefault(\"paper\", {})\n    trades, peaks, today = ps.setdefault(\"trades\", []), ps.setdefault(\"peaks\", {}), now_iso[:10]\n    acct, pos = paper.account(), paper.positions()\n    held = {p[\"symbol\"]: p for p in pos if p.get(\"asset_class\") == \"crypto\"}\n    budget = float(cfg.get(\"paper_start\", 10000))\n    equity = budget + (_f(acct.get(\"equity\")) - ps.get(\"base\", _f(acct.get(\"equity\"))))\n    cash = equity - sum(_f(p.get(\"market_value\")) for p in pos)\n    up, down = float(cfg.get(\"paper_crypto_profit_pct\", 5)), float(cfg.get(\"paper_crypto_stop_pct\", 5))\n    out = []\n    for sym, p in held.items():\n        plpc = _f(p.get(\"unrealized_plpc\")) * 100\n        peak = max(peaks.get(sym, plpc), plpc)\n        peaks[sym] = round(peak, 2)\n        line = -down if peak < up else max(0.0, peak - down)\n        if plpc > line:\n            continue\n        try:\n            paper.close(sym)\n        except ApiError as e:\n            print(f\"Paper crypto sell {sym} failed: {e}\")\n            continue\n        pl = _f(p.get(\"unrealized_pl\"))\n        trades.append({\"t\": now_iso[:16], \"side\": \"sell\", \"sym\": sym, \"qty\": _f(p.get(\"qty\")), \"price\": round(_f(p.get(\"current_price\")), 2),\n                       \"entry\": round(_f(p.get(\"avg_entry_price\")), 2), \"pl\": round(pl, 2), \"plpc\": round(plpc, 2),\n                       \"why\": f\"hit the sell line ({line:+.1f}%)\", \"day\": today})\n        peaks.pop(sym, None)\n        out.append(Alert(f\"paper:csell:{today}:{sym}\", \"paper\", f\"📝 Paper SELL {sym} {plpc:+.1f}% ({signed_money(pl)})\",\n                         compose(\"Sold the crypto position: it hit the sell line.\", [\"Fake money, real prices.\"]),\n                         -1, sym, color=COLORS[\"green\" if pl >= 0 else \"red\"]))\n    have = {s.replace(\"/\", \"\") for s in held}\n    for pr, closes in crypto_bars(alp, pairs).items():\n        sym = pr.replace(\"/\", \"\")\n        if sym in have or any(t[\"sym\"] == sym and t.get(\"day\") == today for t in trades) or cash < 30:\n            continue\n        r = predict_move(closes, up, down)\n        if r[\"p\"] is None or r[\"p\"] < cfg.get(\"paper_min_odds\", 0.55) or r[\"avg\"] <= 0:\n            continue\n        o = {\"p\": r[\"p\"]}\n        dollars = _paper_size(o, equity, cash, cfg, True, up, down)\n        if dollars < 25:\n            continue\n        try:\n            o_ = paper.buy_crypto(pr, dollars, f\"nt-c-{today}-{sym}-{now_iso[11:16].replace(':', '')}\")\n        except ApiError as e:\n            print(f\"Paper crypto buy {pr} failed: {e}\")\n            continue\n        cash -= dollars\n        why = f\"{round(r['p'] * 100)}% odds of +{up:g}% before -{down:g}% (from {r['n']} similar days), avg 2-week move {r['avg']:+.1f}%\"\n        trades.append({\"t\": now_iso[:16], \"side\": \"buy\", \"sym\": sym, \"dollars\": round(dollars, 2), \"price\": round(closes[-1], 2),\n                       \"qty\": round(dollars / closes[-1], 6), \"why\": \"crypto prediction: \" + why, \"day\": today, \"id\": o_.get(\"id\", \"\")})\n        out.append(Alert(f\"paper:cbuy:{today}:{sym}\", \"paper\", f\"📝 Paper BUY {pr}: {money(dollars)} at ~{money(closes[-1])}\",\n                         compose(f\"Crypto, 24/7: {why}.\", [f\"Sells at -{down:g}%; once up {up:g}% the line rises so it can't turn into a loss.\",\n                                                          \"Crypto is high risk, so it's capped at $200.\"]),\n                         -1, sym, color=COLORS[\"buy\"]))\n    return out\n\n\ndef paper_round_the_clock(alp: \"Alpaca\", cfg: dict, state: dict, now_iso: str, regular_open: bool) -> list[Alert]:\n    \"\"\"Runs every scan: crypto any time; stocks in pre-market, after-hours and overnight. Never breaks the scan.\"\"\"\n    if not cfg.get(\"paper_trading\", True) or not cfg.get(\"paper_24h\", True):\n        return []\n    paper = Paper.from_env()\n    if not paper:\n        return []\n    out = []\n    try:\n        out += paper_crypto(paper, alp, cfg, state, now_iso)\n    except Exception as e:     # noqa: BLE001 - a crypto hiccup must never stop stock alerts\n        print(f\"Paper crypto skipped: {e}\")\n    session = et_session(now_iso)\n    if not regular_open and session in (\"pre\", \"post\", \"overnight\"):\n        try:\n            out += paper_extended(paper, alp, cfg, state, now_iso, session)\n        except Exception as e:  # noqa: BLE001\n            print(f\"Paper {session} trading skipped: {e}\")\n    return out\n\n\ndef send_all(alerts: list[Alert], notifier: Notifier, sent: set, state: dict) -> None:\n    for a in alerts:\n        if notifier.send(a):\n            sent.add(a.key)\n            if a.kind == \"buy\":\n                state[\"buys_today\"] = state.get(\"buys_today\", 0) + 1\n    state[\"sent_today\"] = sorted(sent)\n\n\ndef run_scan(cfg: dict, alp: Alpaca, notifier: Notifier, holdings: list[Holding],\n             state: dict, now_override: dict | None = None, force: bool = False,\n             knowledge: dict | None = None, write_files: bool = False,\n             extra_alerts: list[Alert] | None = None, announce: bool = True,\n             out: dict | None = None) -> list[Alert]:\n    knowledge = knowledge if knowledge is not None else {}\n    clock = now_override or alp.clock()\n    now_iso = clock[\"timestamp\"]\n    today = now_iso[:10]\n    is_open = clock[\"is_open\"] or force\n    budgets = Budgets(knowledge, cfg, now_iso)\n\n    if state.get(\"day\") != today:\n        state[\"day\"], state[\"sent_today\"], state[\"buys_today\"] = today, [], 0\n    sent = set(state.get(\"sent_today\", []))\n    hstates = state.setdefault(\"holdings\", {})\n    for k in list(hstates):\n        if k not in {h.key for h in holdings}:\n            del hstates[k]  # you sold it (removed the line): forget its memory\n    held = {h.symbol for h in holdings}\n    if is_open and clock[\"is_open\"]:\n        discover_market(alp, knowledge, cfg, today)\n    universe = sorted(set(cfg[\"universe\"]) | set(dynamic_universe(knowledge, today)) | set(cfg.get(\"bear_watch\") or []) | set(cfg.get(\"paper_buy_list\") or [])\n                      | set(cfg.get(\"paper_quality\") or []))\n\n    # 1. News runs on every pass, even before the open, so overnight stories reach you early\n    events: list[NewsEvent] = []\n    if cfg[\"news\"]:\n        try:\n            events = process_news(alp, cfg, state, set(universe) | held, now_iso, budgets, knowledge, held)\n        except ApiError as e:\n            print(f\"News check failed: {e}\")\n\n    if not is_open:\n        alerts = (list(extra_alerts or []) + news_alerts(events, holdings, {}, cfg, sent, None, state, now_iso, False)\n                  + (catalyst_alerts(events, {}, cfg, sent, False, held, state, now_iso, False, None, paper_focus(state))\n                     if cfg.get(\"catalyst_alerts\", True) else [])\n                  + budgets.notices)\n        if not force:\n            alerts += paper_round_the_clock(alp, cfg, state, now_iso, False)\n            try:\n                paper_trade(Paper.from_env(), [], {}, cfg, True, state, now_iso, False)   # refresh balance for the app\n                paper_charts(Paper.from_env(), alp, state, now_iso)\n                if write_files:\n                    refresh_paper_card(state)\n            except Exception as e:  # noqa: BLE001\n                print(f\"Paper refresh skipped: {e}\")\n        alerts = [a for a in alerts if a.key not in sent]\n        send_all(alerts, notifier, sent, state)\n        log_alerts(knowledge, alerts, now_iso)\n        print(f\"Market closed (next open {clock['next_open'][:16]}). {len(alerts)} alert(s) sent.\")\n        return alerts\n\n    # 2. Prices and rankings\n    symbols = sorted(set(universe) | held | {MARKET})\n    allm = build_metrics(alp, symbols, today, clock[\"is_open\"])\n    ranked = score_all([m for s, m in allm.items() if s in universe])\n    regime, regime_txt = market_ok(allm.get(MARKET))\n    mkt = news_view(state, MARKET_KEY, now_iso)\n    print(f\"{today}: scanned {len(allm)} stocks; {regime_txt}\")\n    update_track(knowledge, allm, cfg, today)\n\n    # 3. News about what you own (plus Robinhood buy/sell confirmations)\n    alerts = [a for a in (extra_alerts or []) if a.key not in sent]\n    alerts += news_alerts(events, holdings, allm, cfg, sent, regime, state, now_iso, True)\n    if cfg.get(\"catalyst_alerts\", True):\n        alerts += catalyst_alerts(events + recent_events(state, now_iso), allm, cfg, sent, regime, held, state,\n                                  now_iso, True, mkt)\n\n    # 4. Your sell rules (free research on what you own feeds the advice)\n    for h in holdings:\n        m = allm.get(h.symbol)\n        if not m:\n            print(f\"  no data for {h.symbol}, skipped\")\n            continue\n        nv = news_view(state, h.symbol, now_iso)\n        rs = get_research(h.symbol, state, knowledge, cfg, now_iso)\n        if abs(rs.score) > abs(nv.score):\n            nv = NewsView(rs.score, \"web news \" + (\"positive\" if rs.score > 0 else \"negative\"),\n                          rs.top[0][1] if rs.top else \"\")\n        alerts += holding_alerts(h, m, regime, cfg, hstates.setdefault(h.key, {}), sent, nv, mkt)\n\n    # 5. Buy setups: chart checks -> free research (15+ articles, 10+ sites) -> paid sources only if needed\n    for m in ranked:\n        if state.get(\"buys_today\", 0) + sum(a.kind == \"buy\" for a in alerts) >= cfg[\"max_buy_alerts_per_day\"]:\n            break\n        if m.symbol in held or m.symbol in MACRO_TICKERS or f\"buy:{m.symbol}\" in sent:\n            continue\n        nv = news_view(state, m.symbol, now_iso)\n        asm = assess(m, cfg, regime, nv, mkt)\n        if asm[\"status\"] not in (\"STRONG BUY\", \"BUY\"):\n            continue\n        a = evaluate_buy(m, nv, cfg, state, knowledge, budgets, alp, today, now_iso, asm)\n        if a:\n            alerts.append(a)\n            record_buy(knowledge, m.symbol, m.price, today)\n\n    # 5b. Follow up on past buy alerts (call changed? target hit?)\n    alerts += [a for a in rec_updates(knowledge, allm, cfg, regime, state, now_iso, held, mkt) if a.key not in sent]\n\n    # 5c. Daily intelligence brief on the first scan after the open\n    if cfg[\"daily_brief\"] and clock[\"is_open\"] and f\"brief:{today}\" not in sent:\n        alerts.append(brief_alert(holdings, allm, ranked, regime, regime_txt, cfg, state, knowledge, now_iso, mkt))\n\n    # 6. Ideas: once a day, stocks worth looking into (near-setups + trending in the news)\n    if \"ideas\" not in sent and clock[\"is_open\"]:\n        idea = ideas_alert(ranked, regime, cfg, state, knowledge, now_iso, today)\n        if idea:\n            alerts.append(idea)\n\n    # 7. Close summary\n    mins_left = minutes_until(now_iso, clock.get(\"next_close\", \"\"))\n    if \"summary\" not in sent and mins_left is not None and 0 < mins_left <= cfg[\"summary_minutes_before_close\"]:\n        alerts.append(summary_alert(holdings, allm, ranked, regime, regime_txt, cfg, state, now_iso, knowledge))\n\n    if force and not clock[\"is_open\"]:\n        for a in alerts:\n            if a.kind == \"buy\":\n                a.title = a.title.replace(\"You should buy\", \"You should buy at the next open:\")\n    if force and announce:\n        sm = summary_alert(holdings, allm, ranked, regime, regime_txt, cfg, state, now_iso, knowledge)\n        sm.key = f\"scan-now:{now_iso}\"\n        sm.title = \"📡 Scan done\" + (\"\" if clock[\"is_open\"] else \" (market closed, last prices)\")\n        found = sum(a.kind == \"buy\" for a in alerts)\n        bi = best_idea(ranked, cfg, regime, state, now_iso, held, mkt)\n        lead = (f\"{found} buy setup(s) found. \" if found else\n                f\"No full buy yet. Best idea: {bi[0].symbol} ({bi[1]['status'].title()} {bi[1]['conf']}/100). \" if bi\n                else \"No buy setups right now. \")\n        sm.message = lead +
