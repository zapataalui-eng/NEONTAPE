            out.append(f\"it holds above ${m.sma50:,.2f} (its 50-day average)\")\n        elif \"below its yearly high\" in f:\n            out.append(f\"it climbs back near its high of ${m.high_52w:,.2f}\")\n        elif \"green day\" in f:\n            out.append(\"it has an up day\")\n        elif \"top-\" in f:\n            out.append(\"its momentum ranks near the top\")\n        elif \"swings too big\" in f:\n            out.append(\"you raise your risk setting (it swings a lot)\")\n        elif \"bad news\" in f:\n            out.append(\"the bad news fades\")\n        elif \"losing steam\" in f:\n            out.append(\"it starts rising again\")\n        elif \"long-term trend\" in f:\n            out.append(\"its 200-day average turns up\")\n        if len(out) == 2:\n            break\n    return (\"Buy when \" + \" and \".join(out)) if out else \"\"\n\n\ndef best_idea(ranked: list, cfg: dict, regime: bool, state: dict, now_iso: str, held: set,\n              mkt: \"NewsView | None\" = None) -> \"tuple[Metrics, dict] | None\":\n    \"\"\"The single best stock to act on or watch right now. Never empty when the scan has stocks:\n    the bot always names one idea and says exactly what it's waiting for.\"\"\"\n    order = {s: i for i, s in enumerate(STATUSES)}\n    best = None\n    for m in ranked:\n        if m.symbol in held or m.symbol in MACRO_TICKERS:\n            continue\n        a = assess(m, cfg, regime, news_view(state, m.symbol, now_iso), mkt)\n        key = (order.get(a[\"status\"], 9), -a[\"conf\"], m.rank)\n        if best is None or key < best[0]:\n            best = (key, m, a)\n    return (best[1], best[2]) if best else None\n\n\ndef idea_line(m: \"Metrics\", a: dict) -> str:\n    name = company_name(m.symbol)\n    head = f\"{m.symbol}\" + (f\" ({name[:28]})\" if name else \"\") + f\" {money(m.price)}: {a['status'].title()} {a['conf']}/100\"\n    return head + (f\". {a['trigger']}.\" if a.get(\"trigger\") else f\". {a['setup']}.\" if a.get(\"setup\") else \".\")\n\n\n# Colors for the in-app text (Pushover HTML). The emoji shows the color on the lock screen.\nCOLORS = {\"buy\": \"#7c3aed\", \"yellow\": \"#ca8a04\", \"blue\": \"#2563eb\", \"green\": \"#16a34a\",\n          \"orange\": \"#ea580c\", \"red\": \"#dc2626\", \"news_bad\": \"#dc2626\", \"news_good\": \"#16a34a\",\n          \"info\": \"#475569\"}\n\n\n@dataclass\nclass Alert:\n    key: str\n    kind: str\n    title: str\n    message: str          # first line = the simple version; the rest = the \"why\"\n    priority: int\n    symbol: str = \"\"\n    sound: str = \"\"\n    url: str = \"\"\n    url_title: str = \"\"\n    color: str = \"\"\n    chart: dict | None = None   # {\"closes\": [...], \"lines\": [(price, hex, label)], \"label\": str}\n\n\ndef money(x: float) -> str:\n    return f\"${x:,.2f}\" if abs(x) >= 0.01 or x == 0 else f\"${x:.4f}\"\n\n\ndef signed_money(x: float) -> str:\n    return (\"+\" if x >= 0 else \"-\") + money(abs(x))\n\n\ndef compose(simple: str, why_lines: list[str]) -> str:\n    \"\"\"Lock-screen line first, then the details you see when you open the alert.\"\"\"\n    return simple + \"\\n\\nWHY\\n\" + \"\\n\".join(l for l in why_lines if l)\n\n\nPROFIT_TIERS = [  # (min gain %, kind, emoji, name, color, advice)\n    (20.0, \"profit20\", \"🟢\", \"BIG WIN\", \"green\", \"Huge gain. Strongly consider selling, at least part.\"),\n    (8.0, \"profit8\", \"🔵\", \"SOLID SELL\", \"blue\", \"Solid gain. Selling locks it in.\"),\n    (0.0, \"profit\", \"🟡\", \"SELL OFFER\", \"yellow\", \"You hit your +2% target.\"),\n]\n\n\ndef app_link(cfg: dict, frag: str = \"\") -> str:\n    \"\"\"Link to the Neon Tape app (taken from holdings_edit_url, which the app fills in).\"\"\"\n    base = (cfg.get(\"app_url\") or (cfg.get(\"holdings_edit_url\") or \"\").split(\"#\")[0]).strip()\n    return (base + (\"#\" + frag if frag else \"\")) if base.startswith(\"https://\") else \"\"\n\n\ndef chart_of(m: \"Metrics | None\", lines: list, label: str = \"\") -> dict | None:\n    if not m or len(getattr(m, \"closes\", None) or []) < 5:\n        return None\n    return {\"closes\": [round(x, 4) for x in m.closes[-90:]], \"lines\": lines, \"label\": label}\n\n\ndef holding_alerts(h: Holding, m: Metrics, regime: bool, cfg: dict, hstate: dict,\n                   sent_today: set, nv: \"NewsView | None\" = None,\n                   mkt: \"NewsView | None\" = None) -> list[Alert]:\n    \"\"\"Applies your rules to one stock you own. Mutates hstate (alert memory).\"\"\"\n    p, e = m.price, h.buy_price\n    gain = (p / e - 1) * 100\n    stop_px = e * (1 - cfg[\"stop_pct\"] / 100)\n    verdict, pts, why = hold_advice(m, regime, nv, mkt)\n    dollars = signed_money((p - e) * h.shares) if h.shares else \"\"\n    on_you = f\"{dollars} on your {h.shares:g} sh\" if h.shares else f\"{gain:+.1f}%\"\n    scen = dollar_scenarios(p, h.shares, m.atr_pct, m.big_move_pct) if h.shares else \"\"\n    chart = cfg[\"chart_url\"].format(symbol=h.symbol)\n    hstate[\"peak_gain\"] = round(max(hstate.get(\"peak_gain\", gain), gain), 1)\n    news_line = f\"📰 {nv.headline}\" if nv and nv.headline and abs(nv.score) >= 0.4 else \"\"\n    alerts = []\n\n    app = app_link(cfg, \"stocks\")\n    pic = chart_of(m, [(e, \"#e5e7eb\", \"BUY\"), (stop_px, \"#ff3b5c\", \"STOP\"),\n                       (e * (1 + cfg[\"profit_pct\"] / 100), \"#ffd23f\", f\"+{cfg['profit_pct']:g}%\")])\n\n    def A(kind, title, simple, details, prio, sound, color):\n        alerts.append(Alert(f\"{kind}:{h.key}\", kind, title, compose(simple, details), prio,\n                            h.symbol, sound, app or chart, \"Open Neon Tape\" if app else f\"{h.symbol} chart\",\n                            COLORS[color], pic))\n\n    # 1. Stop: your hard rule\n    if gain <= -cfg[\"stop_pct\"]:\n        if f\"stop:{h.key}\" not in sent_today:\n            A(\"stop\", f\"🔴 You should sell {h.symbol} now ({gain:+.1f}%)\",\n              f\"Why: it fell past your {cfg['stop_pct']:g}% sell line ({on_you}). Selling keeps the loss small.\",\n              [f\"Bought {money(e)}, now {money(p)}, stop was {money(stop_px)}.\",\n               f\"Chart check: {verdict}\", *why[:4], news_line, scen],\n              cfg[\"priority_stop\"], cfg[\"sound_sell\"], \"red\")\n        return alerts\n\n    # 2. Close to the stop\n    if gain <= -(cfg[\"stop_pct\"] - cfg[\"near_stop_gap_pct\"]):\n        if f\"near:{h.key}\" not in sent_today:\n            A(\"near\", f\"🟠 You should get ready to sell {h.symbol} ({gain:+.1f}%)\",\n              f\"Why: it's only {(p / stop_px - 1) * 100:.1f}% above your sell line {money(stop_px)}.\",\n              [f\"Bought {money(e)}, now {money(p)} ({on_you}).\",\n               f\"Chart check: {verdict}\", *why[:4], news_line, scen],\n              cfg[\"priority_near_stop\"], cfg[\"sound_sell\"], \"orange\")\n\n    # 3. A gain fading back to the buy price\n    if gain >= cfg[\"warn_arm_pct\"]:\n        hstate[\"warn_armed\"] = True\n    if hstate.get(\"warn_armed\") and -cfg[\"stop_pct\"] < gain <= cfg[\"warn_band_pct\"]:\n        hstate[\"warn_armed\"] = False\n        if not any(a.kind == \"near\" for a in alerts):\n            A(\"warn\", f\"🟠 You should think about selling {h.symbol} ({gain:+.1f}%)\",\n              f\"Why: it was up {hstate['peak_gain']:+.1f}% and almost all of that gain is gone. \"\n              f\"Selling now about breaks even.\",\n              [f\"Bought {money(e)}, now {money(p)} ({on_you}). Stop still at {money(stop_px)}.\",\n               f\"Chart check: {verdict}\", *why[:4], news_line, scen],\n              cfg[\"priority_warning\"], cfg[\"sound_sell\"], \"orange\")\n\n    # 4. Profit tiers: yellow +2%, blue +8%, green +20%; repeats every +2% step\n    if gain >= cfg[\"profit_pct\"]:\n        level = 1 + int((gain - cfg[\"profit_pct\"]) // cfg[\"profit_step_pct\"])\n        if level > hstate.get(\"profit_level\", 0):\n            hstate[\"profit_level\"] = level\n            _, kind, emoji, name, color, tier_advice = next(t for t in PROFIT_TIERS if gain >= t[0])\n            nxt = cfg[\"profit_pct\"] + level * cfg[\"profit_step_pct\"]\n            sell = kind != \"profit\" or verdict.startswith((\"SELL\", \"LEAN SELL\"))\n            reason = (f\"{tier_advice} {on_you}.\" if sell else\n                      f\"you hit +{cfg['profit_pct']:g}% ({on_you}) and the trend is still strong. \"\n                      f\"Selling now is fine too.\")\n            A(kind, f\"{emoji} You should {'sell' if sell else 'hold'} {h.symbol} ({gain:+.1f}%)\",\n              f\"Why: {reason[0].lower() + reason[1:]}\",\n              [f\"{name}. Bought {money(e)}, now {money(p)}. Chart check: {verdict}.\", f\"Chart + news score {pts:+d}:\", *why, news_line,\n               scen, f\"If you hold: next alert at +{nxt:g}%; warning if it falls back to \"\n                     f\"+{cfg['warn_band_pct']:g}%.\"],\n              cfg[\"priority_profit\"], cfg[\"sound_buy\"], color)\n    return alerts\n\n\n# ---------- How long to hold (rules, or Claude reading news + forums) ----------\n\ndef rule_horizon(m: Metrics, nv: \"NewsView | None\", cfg: dict, stats: dict | None = None) -> dict:\n    if (nv and nv.score >= 0.8) or m.rsi > 68 or m.atr_pct > 2.5 or m.above_sma20_pct > 4:\n        why = (\"fresh news is driving it; catalyst pops often fade\" if nv and nv.score >= 0.8 else\n               \"it's stretched or jumpy, so treat it as a quick trade\")\n        return {\"horizon\": \"SHORT-TERM\", \"hold_for\": \"about 3–10 trading days\", \"why\": why,\n                \"forum_mood\": \"not checked\", \"source\": \"rules\"}\n    steady_history = stats is None or (stats[\"cagr\"] >= 8 and stats[\"max_drawdown\"] >= -65)\n    if (m.ret_12_1 >= 20 and m.sma200 > m.sma200_prev and m.atr_pct <= 2.0 and m.rank <= max(3, m.of // 4)\n            and steady_history):\n        return {\"horizon\": \"LONG-TERM\", \"hold_for\": \"about 3–12 months, recheck monthly\",\n                \"why\": \"steady 12-month uptrend. Strong 12-month winners have historically tended to keep \"\n                       \"outperforming for 3–12 months. A long hold needs a wider stop than 2% \"\n                       \"(e.g. below the 50-day average).\",\n                \"forum_mood\": \"not checked\", \"source\": \"rules\"}\n    return {\"horizon\": \"MEDIUM\", \"hold_for\": \"about 2–6 weeks\",\n            \"why\": \"healthy trend, not stretched; give it a few weeks while it stays above the 50-day\",\n            \"forum_mood\": \"not checked\", \"source\": \"rules\"}\n\n\nHORIZON_PROMPT = \"\"\"Stock: {sym} at ${price:.2f}. Data from my scanner:\n12-month momentum {r12:+.0f}%, 6-month {r6:+.0f}%, RSI {rsi:.0f}, normal daily swing {atr:.1f}%,\n{off:.1f}% below its 52-week high, momentum rank #{rank} of {of}. Recent news: {news}.\n\nSearch the web for the last 7 days of news AND investor forum chatter (Reddit r/stocks,\nr/investing, r/wallstreetbets, StockTwits, X) about {sym}. Then judge whether this is better as a\nSHORT-TERM swing (days to 2 weeks), MEDIUM (2-8 weeks) or LONG-TERM hold (3+ months) for a small\naccount that wants moderate-to-low risk. Heavy hype usually means short-term. Be cautious: nothing\nis guaranteed, and forum posts are opinions, not facts.\nEnd your reply with ONE JSON object only, no other text after it:\n{{\"horizon\": \"SHORT-TERM|MEDIUM|LONG-TERM\", \"hold_for\": \"e.g. about 1-2 weeks\",\n\"why\": \"max 30 words\", \"forum_mood\": \"bullish|mixed|bearish|quiet\", \"risks\": \"max 15 words\"}}\"\"\"\n\n\ndef ai_horizon(m: Metrics, nv: \"NewsView | None\", cfg: dict, budgets: \"Budgets | None\" = None) -> dict | None:\n    key = os.environ.get(\"ANTHROPIC_API_KEY\", \"\")\n    if not key or not cfg[\"horizon_ai\"]:\n        return None\n    if budgets is not None:\n        if not budgets.can(\"claude\"):\n            return None\n        budgets.use(\"claude\")\n    prompt = HORIZON_PROMPT.format(sym=m.symbol, price=m.price, r12=m.ret_12_1, r6=m.ret_6_1,\n                                   rsi=m.rsi, atr=m.atr_pct, off=m.from_high_pct, rank=m.rank, of=m.of,\n                                   news=(nv.headline if nv and nv.headline else \"none flagged\"))\n    try:\n        r = http_json(\"POST\", CLAUDE_URL, {\"x-api-key\": key, \"anthropic-version\": \"2023-06-01\"},\n                      body={\"model\": cfg[\"horizon_ai_model\"], \"max_tokens\": 3000,\n                            \"output_config\": {\"effort\": cfg.get(\"claude_effort\", \"low\")},\n                            \"tools\": [{\"type\": cfg[\"web_search_tool\"], \"name\": \"web_search\",\n                                       \"max_uses\": int(cfg[\"web_search_max_uses\"])}],\n                            \"messages\": [{\"role\": \"user\", \"content\": prompt}]}, timeout=120)\n        text = \"\".join(b.get(\"text\", \"\") for b in (r or {}).get(\"content\", []) if b.get(\"type\") == \"text\")\n        obj = json.loads(text[text.rindex(\"{\"): text.rindex(\"}\") + 1])\n        hz = str(obj.get(\"horizon\", \"\")).upper()\n        if hz not in (\"SHORT-TERM\", \"MEDIUM\", \"LONG-TERM\"):\n            raise ValueError(f\"unexpected horizon {hz!r}\")\n        return {\"horizon\": hz, \"hold_for\": str(obj.get(\"hold_for\", \"\"))[:40],\n                \"why\": str(obj.get(\"why\", \"\"))[:220], \"forum_mood\": str(obj.get(\"forum_mood\", \"?\"))[:12],\n                \"risks\": str(obj.get(\"risks\", \"\"))[:120], \"source\": \"Claude (news + forums)\"}\n    except (ApiError, ValueError, KeyError, TypeError) as e:\n        print(f\"Claude hold-time check failed for {m.symbol} ({e}); using rules.\")\n        return None\n\n\n_NAMES: dict | None = None\n\n\ndef company_name(sym: str) -> str:\n    \"\"\"Company name from the weekly list (app/names.json); empty if unknown.\"\"\"\n    global _NAMES\n    if _NAMES is None:\n        try:\n            _NAMES = {r[0]: r[1] for r in json.loads((HERE / \"app\" / \"names.json\").read_text(encoding=\"utf-8\"))}\n        except (OSError, ValueError, IndexError, TypeError):\n            _NAMES = {}\n    return _NAMES.get(sym, \"\")\n\n\ndef buy_reason(m: \"Metrics\", nv: \"NewsView | None\" = None) -> str:\n    \"\"\"One plain sentence on why a stock passes every buy check.\"\"\"\n    bits = [f\"#{m.rank} of {m.of} for momentum\", f\"up {m.ret_12_1:.0f}% in a year\"]\n    bits.append(\"near its high\" if m.from_high_pct <= 5 else f\"{m.from_high_pct:.0f}% below its high\")\n    bits.append(\"calm price swings\" if m.atr_pct <= 1.5 else \"normal price swings\")\n    if nv and nv.headline and nv.score >= 0.4:\n        bits.append(\"good news\")\n    return \", \".join(bits)\n\n\ndef buy_alert(m: Metrics, cfg: dict, nv: \"NewsView | None\" = None, horizon: dict | None = None,\n              extra: list[str] | None = None, asm: dict | None = None) -> Alert:\n    stop = m.price * (1 - cfg[\"stop_pct\"] / 100)\n    target = m.price * (1 + cfg[\"profit_pct\"] / 100)\n    asm = asm or {\"status\": \"BUY\", \"conf\": None, \"setup\": \"Immediate opportunity\"}\n    entry_hi = m.price * (1 + min(max(0.5 * m.atr_pct, 0.3), 1.5) / 100)\n    solid = m.price * 1.08\n    name = company_name(m.symbol)\n    dollars, shares = position_size(m.price, cfg)\n    hz = horizon or rule_horizon(m, nv, cfg)\n    risk = risk_label(m.atr_pct)\n    noise = (f\"⚠️ It normally moves ±{m.atr_pct:.1f}%/day, more than your {cfg['stop_pct']:g}% stop, \"\n             f\"so it can stop out on noise.\" if m.atr_pct > cfg[\"stop_pct\"] else\n             f\"Normal daily swing ±{m.atr_pct:.1f}%: fits your {cfg['stop_pct']:g}% rule.\")\n    if dollars >= 1:\n        size_simple = f\"Buy about {money(dollars)} (~{shares:.4g} sh).\"\n        size_lines = [f\"Suggested size: {money(dollars)} = {shares:.4g} sh of your {money(cfg['account_size'])} \"\n                      f\"(caps: lose ≤{cfg['risk_per_trade_pct']:g}% of account at the stop, \"\n                      f\"≤{cfg['max_position_pct']:g}% in one stock).\",\n                      f\"If it hits your stop {money(stop)}: {signed_money(-dollars * cfg['stop_pct'] / 100)} • \"\n                      f\"+{cfg['profit_pct']:g}% offer at {money(target)}: {signed_money(dollars * cfg['profit_pct'] / 100)} • \"\n                      f\"+8%: {signed_money(dollars * 0.08)}\",\n                      dollar_scenarios(m.price, shares, m.atr_pct, m.big_move_pct)]\n    else:\n        size_simple = \"Your account is too small for a $1 order here.\"\n        size_lines = []\n    news_line = (f\"📰 News: {nv.label}: \\\"{nv.headline}\\\"\" if nv and nv.headline and nv.score >= 0.4\n                 else \"📰 No major news in the last 3 days.\")\n    url = (cfg[\"holdings_edit_url\"].replace(\"{symbol}\", m.symbol).replace(\"{price}\", f\"{m.price:.2f}\")\n           if cfg[\"holdings_edit_url\"] else cfg[\"chart_url\"].format(symbol=m.symbol))\n    catalyst = (f\"{nv.label}: \\\"{nv.headline[:90]}\\\"\" if nv and nv.headline and nv.score >= 0.4\n                else \"no single news catalyst; trend and momentum setup\")\n    loss = f\" = {signed_money(-dollars * cfg['stop_pct'] / 100)}\" if dollars >= 1 else \"\"\n    lines = [\n        f\"{(name[:40] + ' (' + m.symbol + ')') if name else m.symbol} • {asm['status']}\"\n        + (f\" • confidence {asm['conf']}/100\" if asm.get(\"conf\") is not None else \"\")\n        + f\" • {risk.lower()} risk • {asm.get('setup') or 'Immediate opportunity'}\",\n        f\"Entry: {money(m.price)}–{money(entry_hi)} (don't chase above)\",\n        f\"Targets: {money(target)} (+{cfg['profit_pct']:g}%\"\n        + (f\" = {signed_money(dollars * cfg['profit_pct'] / 100)}\" if dollars >= 1 else \"\") + f\") / {money(solid)} (+8%)\",\n        f\"Downside: sell line {money(stop)} (−{cfg['stop_pct']:g}%){loss}\"\n        + (f\"; its bad days hit −{m.big_move_pct:.1f}%\" if m.big_move_pct else \"\"),\n        f\"Catalyst: {catalyst}\",\n        f\"Cancelled if: closes under {money(stop)} or its 50-day avg {money(m.sma50)}, or the market turns weak\",\n        f\"Hold time ({hz['source']}): {hz['why'][:110]}\"\n        + (f\" Forum mood: {hz['forum_mood']}.\" if hz.get(\"forum_mood\") not in (None, \"not checked\") else \"\"),\n        f\"Momentum #{m.rank}/{m.of}: 12-mo {m.ret_12_1:+.0f}%, {m.from_high_pct:.1f}% under its high, today {m.day_chg_pct:+.1f}%\",\n    ]\n    if m.atr_pct > cfg[\"stop_pct\"]:\n        lines.append(f\"⚠️ Swings ±{m.atr_pct:.1f}%/day, more than your {cfg['stop_pct']:g}% line: it can stop out on noise.\")\n    lines += [x[:110] for x in (extra or []) if not x.startswith(\"  •\")][:3]\n    simple = f\"Why: {buy_reason(m, nv)}. {size_simple} {hz['horizon'].capitalize()} hold: {hz['hold_for']}.\"\n    body = compose(simple, lines)\n    while len(body) > 1000 and len(lines) > 6:   # Pushover's limit is 1024 characters\n        lines.pop()\n        body = compose(simple, lines)\n    return Alert(\n        f\"buy:{m.symbol}\", \"buy\",\n        f\"🛒 {asm['status']}: You should buy {m.symbol} ({money(m.price)}, {risk.lower()} risk)\",\n        body[:1020],\n        cfg[\"priority_buy\"], m.symbol, cfg[\"sound_buy\"], url,\n        \"Log your buy\" if cfg[\"holdings_edit_url\"] else f\"{m.symbol} chart\", COLORS[\"buy\"],\n        chart_of(m, [(m.price, \"#e5e7eb\", \"BUY\"), (stop, \"#ff3b5c\", \"STOP\"), (target, \"#ffd23f\", \"TARGET\")]))\n\n\ndef recent_events(state: dict, now_iso: str, hours: int = 18) -> list[NewsEvent]:\n    \"\"\"Big stories from earlier today (e.g. before the open), so a move at the open can still be confirmed.\"\"\"\n    out = []\n    cutoff = parse_ts(now_iso) - timedelta(hours=hours)\n    for sym, rows in (state.get(\"news\", {}).get(\"events\") or {}).items():\n        for r in rows:\n            ts, imp, cat, head = (r + [\"\", 0, \"\", \"\"])[:4]\n            if _safe_ts(ts) >= cutoff and abs(imp) >= 1.2:\n                d = 1 if imp > 0 else -1\n                out.append(NewsEvent(f\"stored:{sym}:{ts}\", sym, head, \"\", ts, cat, d,\n                                     3 if abs(imp) >= 2 else 2, min(0.9, abs(imp) / (3 if abs(imp) >= 2 else 2))))\n    return out\n\n\ndef catalyst_alerts(events: list[NewsEvent], allm: dict, cfg: dict, sent: set, regime: bool,\n                    held: set, state: dict, now_iso: str, market_open: bool, mkt: \"NewsView | None\" = None,\n                    focus: set | None = None) -> list[Alert]:\n    \"\"\"⚡ Big news on ANY stock the bot follows (not just ones you own): a CEO change, a deal, FDA news,\n    a blowout quarter. During market hours it waits for the price to confirm the story; before the open it\n    sends the biggest stories so you see them first. It tells you plainly whether it fits your buy rules.\"\"\"\n    out = []\n    used = sum(1 for k in sent if k.startswith(\"catalyst:\"))\n    cap = int(cfg.get(\"max_catalyst_alerts_per_day\", 3))\n    today = now_iso[:10]\n    for ev in sorted(events, key=lambda x: -abs(x.impact)):\n        if used >= cap:\n            break\n        if ev.symbol == MARKET_KEY or ev.symbol in held or ev.direction == 0 or ev.strength < 2 or ev.confidence < 0.6:\n            continue\n        key = f\"catalyst:{today}:{ev.symbol}\"\n        if key in sent:\n            continue\n        m = allm.get(ev.symbol)\n        move = m.day_chg_pct if m else 0.0\n        if market_open:\n            need = max(2.5, 0.8 * (m.big_move_pct if m and m.big_move_pct else 3.0))\n            if not m or move * ev.direction < need:\n                continue           # the price hasn't confirmed the story yet\n        elif ev.strength < (2 if ev.symbol in (focus or set()) else 3):\n            continue               # market closed: only the biggest stories, or solid ones on stocks you're betting on\n        name = company_name(ev.symbol)\n        up = ev.direction > 0\n        title = (f\"⚡ Big news: {ev.symbol} \" + (f\"{move:+.1f}% \" if market_open else \"\") +\n                 (\"(good)\" if up else \"(bad)\") + f\": {ev.category}\")\n        lines = [f\"\\\"{ev.headline[:150]}\\\"\"]\n        if m:\n            a = assess(m, cfg, regime, news_view(state, ev.symbol, now_iso), mkt)\n            if a[\"status\"] in (\"STRONG BUY\", \"BUY\") and up:\n                lines.insert(0, f\"Fits your buy rules: {a['status'].title()} {a['conf']}/100 at {money(m.price)}.\")\n            elif up:\n                lines.insert(0, f\"Not a buy by your rules yet ({a['status'].title()} {a['conf']}/100). Missing: \"\n                                + \"; \".join(a[\"fails\"][:2]) + \".\")\n                if a.get(\"trigger\"):\n                    lines.append(a[\"trigger\"] + \".\")\n                lines.append(\"News jumps often fade or keep going; buying one is a speculative bet. Keep it small.\")\n            else:\n                lines.insert(0, \"Bad news on a stock the bot follows. Nothing to do unless you own it.\")\n        if name:\n            title = title.replace(f\" {ev.symbol} \", f\" {ev.symbol} ({name[:22]}) \", 1)\n        used += 1\n        out.append(Alert(key, \"news\", title[:250], compose(lines[0], lines[1:]), 0, \"\", \"\", ev.url, \"Read article\",\n                         COLORS[\"news_good\" if up else \"news_bad\"]))\n    return out\n\n\ndef paper_focus(state: dict) -> set:\n    \"\"\"Stocks the bot is betting on with paper money (incl. puts) or rates as the best upside right now:\n    their news gets through even overnight and on weekends.\"\"\"\n    pp = state.get(\"paper\") or {}\n    syms = {str(p.get(\"sym\", \"\")).split()[0] for p in pp.get(\"positions\") or [] if p.get(\"sym\")}\n    return syms | {o.get(\"sym\") for o in (pp.get(\"outlook\") or [])[:8] if o.get(\"sym\")}\n\n\ndef refresh_paper_card(state: dict) -> None:\n    \"\"\"Off-hours: update only the paper section of the app's dashboard file.\"\"\"\n    path = HERE / \"app\" / \"dashboard.json\"\n    try:\n        data = json.loads(path.read_text(encoding=\"utf-8\"))\n    except (OSError, ValueError):\n        return\n    pp = state.get(\"paper\") or {}\n    data[\"paper\"] = {k: pp.get(k) for k in (\"on\", \"updated\", \"equity\", \"cash\", \"start\", \"day_pl\", \"wins\", \"losses\",\n                                             \"positions\", \"error\", \"outlook\", \"chart\", \"intraday\", \"daily\", \"learn\")} | {\"trades\": (pp.get(\"trades\") or [])[-60:][::-1]}\n    path.write_text(json.dumps(data, indent=1), encoding=\"utf-8\")\n\n\ndef news_alerts(events: list[NewsEvent], holdings: list[Holding], allm: dict, cfg: dict,\n                sent: set, regime: bool | None, state: dict, now_iso: str, market_open: bool) -> list[Alert]:\n    \"\"\"Big stories about stocks you own, plus big market-wide stories.\"\"\"\n    alerts: list[Alert] = []\n    held = {h.symbol: h for h in holdings}\n    mkt_sent = sum(1 for k in sent if k.startswith(\"mnews:\"))\n    for ev in sorted(events, key=lambda x: -abs(x.impact)):\n        if ev.strength < cfg[\"news_alert_min_strength\"] or ev.confidence < cfg[\"news_alert_min_confidence\"]:\n            continue\n        if ev.direction == 0:\n            continue\n        good = ev.direction > 0\n        arrow = \"▲ good\" if good else \"▼ bad\"\n        rated = f\"{STRENGTH_WORD[ev.strength]} impact, {ev.confidence:.0%} confidence, rated by {ev.rater}\"\n        if ev.symbol == MARKET_KEY:\n            key = f\"mnews:{ev.id}\"\n            if key in sent or mkt_sent >= cfg[\"max_market_news_alerts_per_day\"]:\n                continue\n            mkt_sent += 1\n            alerts.append(Alert(key, \"mnews\", f\"📰 MARKET NEWS {arrow}: {ev.category[:40]}\",\n                                compose(ev.headline[:160], [rated, ev.why,\n                                        \"Market-wide news can move everything you own.\"]),\n                                cfg[\"priority_market_news\"], \"\", \"\", ev.url, \"Read article\",\n                                COLORS[\"news_good\" if good else \"news_bad\"]))\n            continue\n        h = held.get(ev.symbol)\n        key = f\"news:{ev.id}:{ev.symbol}\"\n        if not h or key in sent:\n            continue\n        m = allm.get(ev.symbol)\n        lines = [f\"\\\"{ev.headline}\\\"\", rated + (f\": {ev.why}\" if ev.why else \"\")]\n        if m and market_open:\n            gain = (m.price / h.buy_price - 1) * 100\n            verdict, _, why = hold_advice(m, bool(regime), news_view(state, ev.symbol, now_iso))\n            stop_px = h.buy_price * (1 - cfg[\"stop_pct\"] / 100)\n            act = \"sell\" if verdict.startswith((\"SELL\", \"LEAN SELL\")) else \"hold\"\n            simple = f\"You should {act}. Why: {ev.category[:40].lower()}; you're {gain:+.1f}%; chart says {verdict}.\"\n            lines += [f\"Bought {money(h.buy_price)}, now {money(m.price)}. Your sell line: {money(stop_px)}.\",\n                      *why[:4]]\n            if h.shares:\n                lines.append(dollar_scenarios(m.price, h.shares, m.atr_pct, m.big_move_pct))\n        else:\n            stop_px = h.buy_price * (1 - cfg[\"stop_pct\"] / 100)\n            simple = (f\"{ev.category[:40]}. Market's closed: expect a move at the open. \"\n                      f\"Your sell line: {money(stop_px)}.\")\n            lines.append(\"Big stories often move the price before most people can react, so \"\n                         \"check it at the open rather than chasing the headline.\")\n        if not good:\n            lines.append(\"Bad news can keep weighing on a stock for days, but sometimes it bounces. \"\n                         \"Your -2% rule protects you either way.\")\n        alerts.append(Alert(key, \"news\", f\"📰 {ev.symbol} {arrow} news\", compose(simple, lines),\n                            cfg[\"priority_news\"], ev.symbol, cfg[\"sound_sell\"] if not good else cfg[\"sound_buy\"],\n                            ev.url, \"Read article\", COLORS[\"news_good\" if good else \"news_bad\"],\n                            chart_of(m, [(h.buy_price, \"#e5e7eb\", \"BUY\"),\n                                         (h.buy_price * (1 - cfg[\"stop_pct\"] / 100), \"#ff3b5c\", \"STOP\")])))\n    return alerts\n\n\n# =============================================================================\n# Notifications\n# =============================================================================\n\nclass Notifier:\n    def send(self, a: Alert) -> bool:\n        raise NotImplementedError\n\n\nclass PrintNotifier(Notifier):\n    def __init__(self):\n        self.sent: list[Alert] = []\n\n    def send(self, a: Alert) -> bool:\n        self.sent.append(a)\n        print(f\"\\n[ALERT p{a.priority}] {a.title}\\n{a.message}\")\n        return True\n\n\ndef to_html(a: Alert) -> str:\n    \"\"\"First line bold + colored; the rest escaped. Pushover shows this inside the app.\"\"\"\n    import html as _h\n    first, _, rest = a.message.partition(\"\\n\")\n    head = f\"<b>{_h.escape(first, quote=False)}<\/b>\"\n    if a.color:\n        head = f'<font color=\"{a.color}\">{head}<\/font>'\n    rest = _h.escape(rest, quote=False).replace(\"WHY\\n\", \"<b>WHY<\/b>\\n\", 1)\n    return head + (\"\\n\" + rest if rest else \"\")\n\n\n# =============================================================================\n# Alert chart: a small neon PNG drawn with the standard library only\n# =============================================================================\n\n_FONT = {  # 5x7 pixel font, one 5-bit row per line (top to bottom)\n    \"0\": [14, 17, 19, 21, 25, 17, 14], \"1\": [4, 12, 4, 4, 4, 4, 14], \"2\": [14, 17, 1, 2, 4, 8, 31],\n    \"3\": [31, 2, 4, 2, 1, 17, 14], \"4\": [2, 6, 10, 18, 31, 2, 2], \"5\": [31, 16, 30, 1, 1, 17, 14],\n    \"6\": [6, 8, 16, 30, 17, 17, 14], \"7\": [31, 1, 2, 4, 8, 8, 8], \"8\": [14, 17, 17, 14, 17, 17, 14],\n    \"9\": [14, 17, 17, 15, 1, 2, 12], \"A\": [14, 17, 17, 31, 17, 17, 17], \"B\": [30, 17, 17, 30, 17, 17, 30],\n    \"C\": [14, 17, 16, 16, 16, 17, 14], \"D\": [28, 18, 17, 17, 17, 18, 28], \"E\": [31, 16, 16, 30, 16, 16, 31],\n    \"F\": [31, 16, 16, 30, 16, 16, 16], \"G\": [14, 17, 16, 23, 17, 17, 15], \"H\": [17, 17, 17, 31, 17, 17, 17],\n    \"I\": [14, 4, 4, 4, 4, 4, 14], \"J\": [7, 2, 2, 2, 2, 18, 12], \"K\": [17, 18, 20, 24, 20, 18, 17],\n    \"L\": [16, 16, 16, 16, 16, 16, 31], \"M\": [17, 27, 21, 21, 17, 17, 17], \"N\": [17, 17, 25, 21, 19, 17, 17],\n    \"O\": [14, 17, 17, 17, 17, 17, 14], \"P\": [30, 17, 17, 30, 16, 16, 16], \"Q\": [14, 17, 17, 17, 21, 18, 13],\n    \"R\": [30, 17, 17, 30, 20, 18, 17], \"S\": [15, 16, 16, 14, 1, 1, 30], \"T\": [31, 4, 4, 4, 4, 4, 4],\n    \"U\": [17, 17, 17, 17, 17, 17, 14], \"V\": [17, 17, 17, 17, 17, 10, 4], \"W\": [17, 17, 17, 21, 21, 21, 10],\n    \"X\": [17, 17, 10, 4, 10, 17, 17], \"Y\": [17, 17, 10, 4, 4, 4, 4], \"Z\": [31, 1, 2, 4, 8, 16, 31],\n    \"$\": [4, 15, 20, 14, 5, 30, 4], \".\": [0, 0, 0, 0, 0, 12, 12], \",\": [0, 0, 0, 0, 12, 4, 8],\n    \"+\": [0, 4, 4, 31, 4, 4, 0], \"-\": [0, 0, 0, 31, 0, 0, 0], \"%\": [24, 25, 2, 4, 8, 19, 3],\n    \":\": [0, 12, 12, 0, 12, 12, 0], \"/\": [0, 1, 2, 4, 8, 16, 0], \" \": [0] * 7,\n    \"^\": [4, 10, 17, 0, 0, 0, 0], \"|\": [4, 4, 4, 4, 4, 4, 4], \"#\": [10, 10, 31, 10, 31, 10, 10],\n}\n\n\ndef _hex(c: str) -> tuple[int, int, int]:\n    c = c.lstrip(\"#\")\n    return int(c[0:2], 16), int(c[2:4], 16), int(c[4:6], 16)\n\n\nclass _Canvas:\n    def __init__(self, w: int, h: int):\n        self.w, self.h = w, h\n        self.px = bytearray(w * h * 3)\n\n    def blend(self, x: int, y: int, rgb, a: float) -> None:\n        if 0 <= x < self.w and 0 <= y < self.h and a > 0:\n            a = min(a, 1.0)\n            i = (y * self.w + x) * 3\n            p = self.px\n            p[i] = int(p[i] + (rgb[0] - p[i]) * a)\n            p[i + 1] = int(p[i + 1] + (rgb[1] - p[i + 1]) * a)\n            p[i + 2] = int(p[i + 2] + (rgb[2] - p[i + 2]) * a)\n\n    def add(self, x: int, y: int, rgb, a: float) -> None:\n        \"\"\"Additive light, for glows.\"\"\"\n        if 0 <= x < self.w and 0 <= y < self.h and a > 0:\n            i = (y * self.w + x) * 3\n            p = self.px\n            for k in range(3):\n                p[i + k] = min(255, int(p[i + k] + rgb[k] * a))\n\n    def text(self, x: int, y: int, s: str, rgb, scale: int = 2, a: float = 1.0) -> int:\n        for ch in s.upper():\n            g = _FONT.get(ch, _FONT[\" \"])\n            for r, bits in enumerate(g):\n                for c in range(5):\n                    if bits & (16 >> c):\n                        for dy in range(scale):\n                            for dx in range(scale):\n                                self.blend(x + c * scale + dx, y + r * scale + dy, rgb, a)\n            x += 6 * scale\n        return x\n\n    def png(self) -> bytes:\n        import struct\n        import zlib\n        raw = bytearray()\n        row = self.w * 3\n        for y in range(self.h):\n            raw.append(0)\n            raw += self.px[y * row:(y + 1) * row]\n\n        def chunk(tag: bytes, data: bytes) -> bytes:\n            return (struct.pack(\">I\", len(data)) + tag + data\n                    + struct.pack(\">I\", zlib.crc32(tag + data) & 0xFFFFFFFF))\n        return (b\"\\x89PNG\\r\\n\\x1a\\n\" + chunk(b\"IHDR\", struct.pack(\">IIBBBBB\", self.w, self.h, 8, 2, 0, 0, 0))\n                + chunk(b\"IDAT\", zlib.compress(bytes(raw), 9)) + chunk(b\"IEND\", b\"\"))\n\n\ndef chart_png(closes: list[float], lines: list, accent: str, symbol: str = \"\", subtitle: str = \"\",\n              w: int = 720, h: int = 400) -> bytes:\n    \"\"\"Dark neon line chart of real closing prices, with your buy/stop/target lines.\"\"\"\n    cv = _Canvas(w, h)\n    acc = _hex(accent or \"#22d3ee\")\n    # background: deep blue-black gradient with faint scanlines\n    for y in range(h):\n        t = y / h\n        base = (int(6 + 8 * t), int(6 + 4 * t), int(16 + 18 * t))\n        rgb = bytes(base) * w\n        cv.px[y * w * 3:(y + 1) * w * 3] = rgb\n    L, R, T, B = 18, w - 118, 96, h - 26\n    vals = [float(c) for c in closes if c and c > 0]\n    levels = [(float(p), c, lab) for p, c, lab in (lines or []) if p and p > 0]\n    lo = min(vals + [p for p, _, _ in levels])\n    hi = max(vals + [p for p, _, _ in levels])\n    pad = (hi - lo) * 0.08 or hi * 0.01\n    lo, hi = lo - pad, hi + pad\n    Y = lambda v: B - (v - lo) / (hi - lo) * (B - T)\n    grid = (34, 30, 64)\n    for k in range(5):  # grid\n        gy = int(T + (B - T) * k / 4)\n        for x in range(L, R, 2):\n            cv.blend(x, gy, grid, 0.9)\n    for k in range(7):\n        gx = int(L + (R - L) * k / 6)\n        for y in range(T, B, 2):\n            cv.blend(gx, y, grid, 0.6)\n    # level lines (dashed) with right-side tags\n    used = []\n    for p, c, lab in sorted(levels, key=lambda z: -z[0]):\n        rgb = _hex(c)\n        y = int(round(Y(p)))\n        for x in range(L, R):\n            if (x // 6) % 2 == 0:\n                cv.blend(x, y, rgb, 0.85)\n        ty = y - 7\n        while any(abs(ty - u) < 16 for u in used):\n            ty += 16\n        used.append(ty)\n        cv.text(R + 8, ty, lab[:7], rgb, 2)\n    # resample prices to one value per pixel column\n    n = len(vals)\n    ys = []\n    for x in range(L, R):\n        f = (x - L) / max(1, (R - L - 1)) * (n - 1)\n        i = int(f)\n        v = vals[i] if i >= n - 1 else vals[i] + (vals[i + 1] - vals[i]) * (f - i)\n        ys.append(Y(v))\n    # area fill under the line\n    for k, yv in enumerate(ys):\n        x = L + k\n        top = int(yv)\n        for y in range(max(T, top), B):\n            cv.blend(x, y, acc, 0.28 * (1 - (y - top) / max(1, B - top)) ** 1.6)\n    # glowing line: wide soft glow + bright core\n    prev = ys[0]\n    for k, yv in enumerate(ys):\n        x = L + k\n        a, b = min(prev, yv), max(prev, yv)\n        for y in range(int(a) - 8, int(b) + 9):\n            d = 0 if a <= y <= b else min(abs(y - a), abs(y - b))\n            if d <= 8:\n                cv.add(x, y, acc, 0.10 * (1 - d / 8.5))\n            if d <= 1.6:\n                cv.blend(x, y, acc, 1.0 if d <= 0.8 else 0.55)\n            if d <= 0.5:\n                cv.blend(x, y, (255, 255, 255), 0.35)\n        prev = yv\n    # last price: ring + dot\n    lx, ly = R - 1, int(ys[-1])\n    for dy in range(-9, 10):\n        for dx in range(-9, 10):\n            r = math.hypot(dx, dy)\n            if r <= 3.2:\n                cv.blend(lx + dx, ly + dy, (255, 255, 255), 1.0)\n            elif r <= 9:\n                cv.add(lx + dx, ly + dy, acc, 0.35 * (1 - r / 9))\n    # header\n    chg = (vals[-1] / vals[0] - 1) * 100 if vals[0] else 0\n    x = cv.text(L, 18, symbol[:8], acc, 5)\n    cv.text(x + 14, 22, money(vals[-1]), (240, 240, 250), 3)\n    cv.text(x + 14, 54, subtitle[:34] or f\"{n} DAYS {chg:+.1f}%\", (150, 150, 185), 2)\n    cv.text(w - 118, 18, \"NEON\", acc, 2, 0.8)\n    cv.text(w - 118, 36, \"TAPE\", (255, 59, 92), 2, 0.8)\n    cv.text(L, h - 20, f\"LAST {n} TRADING DAYS\", (90, 90, 130), 2)\n    return cv.png()\n\n\ndef alert_chart(a: \"Alert\") -> bytes | None:\n    c = a.chart\n    if not c or len(c.get(\"closes\") or []) < 5:\n        return None\n    try:\n        sub = c.get(\"label\") or \"\"\n        return chart_png(c[\"closes\"], c.get(\"lines\") or [], a.color or \"#22d3ee\", a.symbol or \"\", sub)\n    except Exception as e:  # a chart must never block an alert\n        print(f\"chart failed for {a.symbol}: {e}\")\n        return None\n\n\nclass Pushover(Notifier):\n    def __init__(self, token: str, user: str, cfg: dict):\n        self.token, self.user, self.cfg = token, user, cfg\n\n    @classmethod\n    def from_env(cls, cfg: dict) -> \"Pushover | None\":\n        load_env()\n        t, u = os.environ.get(\"PUSHOVER_TOKEN\", \"\"), os.environ.get(\"PUSHOVER_USER\", \"\")\n        return cls(t, u, cfg) if t and u else None\n\n    def payload(self, a: Alert) -> dict:\n        body = to_html(a)\n        if len(body) > 1024:  # trim the details, never the first line\n            body = body[:1020].rsplit(\"\\n\", 1)[0] + \"\\n…\"\n        f = {\"token\": self.token, \"user\": self.user, \"title\": a.title[:250], \"message\": body,\n             \"html\": \"1\", \"priority\": str(a.priority)}\n        if a.sound:\n            f[\"sound\"] = a.sound\n        if a.url:\n            f[\"url\"], f[\"url_title\"] = a.url[:512], a.url_title[:100]\n        if self.cfg.get(\"chart_images\", True):\n            img = alert_chart(a)\n            if img and len(img) < 2_500_000:\n                import base64\n                f[\"attachment_base64\"] = base64.b64encode(img).decode()\n                f[\"attachment_type\"] = \"image/png\"\n        if a.priority == 2:\n            f[\"retry\"] = str(max(30, int(self.cfg[\"emergency_retry_sec\"])))\n            f[\"expire\"] = str(min(10800, int(self.cfg[\"emergency_expire_sec\"])))\n        return f\n\n    def send(self, a: Alert) -> bool:\n        try:\n            r = http_json(\"POST\", PUSHOVER_URL, form=self.payload(a))\n            ok = bool(r and r.get(\"status\") == 1)\n        except ApiError as e:\n            print(f\"Pushover error: {e}\")\n            ok = False\n        print(f\"{'Sent' if ok else 'FAILED'}: {a.title}\")\n        return ok\n\n\n# =============================================================================\n# Memory: knowledge.json (the bot's long-term memory) + an Obsidian vault\n# =============================================================================\n\ndef load_knowledge(path: Path | None = None) -> dict:\n    path = path or HERE / \"knowledge.json\"\n    try:\n        return json.loads(path.read_text(encoding=\"utf-8\"))\n    except (FileNotFoundError, ValueError):\n        return {}\n\n\ndef save_knowledge(k: dict, path: Path | None = None) -> None:\n    path = path or HERE / \"knowledge.json\"\n    path.write_text(json.dumps(k, indent=1, sort_keys=True) + \"\\n\", encoding=\"utf-8\")\n\n\ndef http_text(url: str, params: dict | None = None, headers: dict | None = None, timeout: int = 20) -> str:\n    if params:\n        url += (\"&\" if \"?\" in url else \"?\") + urllib.parse.urlencode(params)\n    req = urllib.request.Request(url, headers={\"User-Agent\": \"Mozilla/5.0 (stock-alerts bot)\", **(headers or {})})\n    try:\n        with urllib.request.urlopen(req, timeout=timeout) as r:\n            return r.read().decode(\"utf-8\", errors=\"replace\")\n    except urllib.error.HTTPError as e:\n        raise ApiError(f\"HTTP {e.code} from {urllib.parse.urlparse(url).netloc}\") from None\n    except urllib.error.URLError as e:\n        raise ApiError(f\"could not reach {urllib.parse.urlparse(url).netloc}: {e.reason}\") from None\n\n\n# ---------- Paid sources: only used when needed, each with a budget ----------\n\nPROVIDERS = {  # name: (env var, budget period, label)\n    \"alphavantage\": (\"ALPHAVANTAGE_API_KEY\", \"day\", \"Alpha Vantage\"),\n    \"lunarcrush\": (\"LUNARCRUSH_API_KEY\", \"month\", \"LunarCrush\"),\n    \"financialdatasets\": (\"FINANCIAL_DATASETS_API_KEY\", \"month\", \"Financial Datasets\"),\n    \"openai\": (\"OPENAI_API_KEY\", \"day\", \"ChatGPT\"),\n    \"claude\": (\"ANTHROPIC_API_KEY\", \"day\", \"Claude\"),\n}\n\n\nclass Budgets:\n    \"\"\"Counts paid calls per day/month, stops at your limit, and tells you once when a source runs out.\"\"\"\n\n    def __init__(self, knowledge: dict, cfg: dict, now_iso: str):\n        self.k = knowledge.setdefault(\"budgets\", {})\n        self.cfg, self.day, self.month = cfg, now_iso[:10], now_iso[:7]\n        self.notices: list[Alert] = []\n\n    def _e(self, name: str) -> dict:\n        period = self.day if PROVIDERS[name][1] == \"day\" else self.month\n        e = self.k.setdefault(name, {})\n        if e.get(\"period\") != period:\n            e.clear()\n            e.update(period=period, used=0, out=False, alerted=False, why=\"\")\n        return e\n\n    def limit(self, name: str) -> int:\n        return int(self.cfg.get(f\"budget_{name}\", 0))\n\n    def has_key(self, name: str) -> bool:\n        return bool(os.environ.get(PROVIDERS[name][0], \"\").strip())\n\n    def can(self, name: str) -> bool:\n        if not self.has_key(name) or self.limit(name) <= 0:\n            return False\n        e = self._e(name)\n        if e[\"out\"]:\n            return False\n        if e[\"used\"] >= self.limit(name):\n            self.mark_out(name, \"your budget is reached\")\n            return False\n        return True\n\n    def use(self, name: str) -> None:\n        self._e(name)[\"used\"] += 1\n\n    def mark_out(self, name: str, why: str) -> None:\n        e = self._e(name)\n        e[\"out\"], e[\"why\"] = True, why[:120]\n        if e[\"alerted\"]:\n            return\n        e[\"alerted\"] = True\n        _, per, label = PROVIDERS[name]\n        resets = \"tomorrow\" if per == \"day\" else \"next month\"\n        self.notices.append(Alert(\n            f\"budget:{name}:{e['period']}\", \"budget\", f\"⚠️ {label} credits used up\",\n            compose(f\"{label} is out for this {per}. The bot keeps going with free sources and resets {resets}.\",\n                    [f\"Used {e['used']} of {self.limit(name)} this {per}.\", f\"Reason: {why}\"]),\n            self.cfg[\"priority_budget\"], color=COLORS[\"orange\"]))\n\n    def table(self) -> list[dict]:\n        out = []\n        for name, (_, per, label) in PROVIDERS.items():\n            e = self._e(name)\n            out.append({\"name\": label, \"per\": per, \"used\": e[\"used\"], \"limit\": self.limit(name),\n                        \"connected\": self.has_key(name), \"out\": e[\"out\"], \"why\": e[\"why\"]})\n        return out\n\n\ndef _paid_error(budgets: Budgets, name: str, err: str) -> None:\n    low = err.lower()\n    if any(w in low for w in (\"429\", \"402\", \"rate limit\", \"premium\", \"payment required\", \"quota\", \"25 requests\",\n                              \"credit\", \"exceeded\")):\n        budgets.mark_out(name, err)\n\n\ndef alpha_vantage(budgets: Budgets, params: dict, as_text: bool = False):\n    if not budgets.can(\"alphavantage\"):\n        return None\n    budgets.use(\"alphavantage\")\n    p = {**params, \"apikey\": os.environ[PROVIDERS[\"alphavantage\"][0]]}\n    try:\n        if as_text:\n            txt = http_text(AV_URL, p, timeout=30)\n            if txt.lstrip().startswith(\"{\"):\n                r = json.loads(txt)\n            else:\n                return txt\n        else:\n            r = http_json(\"GET\", AV_URL, params=p)\n    except (ApiError, ValueError) as e:\n        _paid_error(budgets, \"alphavantage\", str(e))\n        return None\n    if isinstance(r, dict):\n        msg = r.get(\"Note\") or r.get(\"Information\") or r.get(\"Error Message\")\n        if msg:\n            _paid_error(budgets, \"alphavantage\", msg)\n            return None\n    return r\n\n\ndef lunar_social(budgets: Budgets, sym: str) -> dict | None:\n    if not budgets.can(\"lunarcrush\"):\n        return None\n    budgets.use(\"lunarcrush\")\n    topic = urllib.parse.quote(f\"${sym.lower()}\")\n    try:\n        r = http_json(\"GET\", f\"{LUNAR_URL}/public/topic/{topic}/v1\",\n                      {\"Authorization\": f\"Bearer {os.environ[PROVIDERS['lunarcrush'][0]]}\"})\n    except ApiError as e:\n        _paid_error(budgets, \"lunarcrush\", str(e))\n        return None\n    d = (r or {}).get(\"data\", r) or {}\n    sent = d.get(\"types_sentiment\") or {}\n    vals = [float(v) for v in sent.values() if isinstance(v, (int, float))] if isinstance(sent, dict) else []\n    if not vals and not d.get(\"interactions_24h\"):\n        return None\n    return {\"sentiment\": round(sum(vals) / len(vals)) if vals else None,\n            \"interactions_24h\": d.get(\"interactions_24h\"), \"posts\": d.get(\"num_posts\"),\n            \"trend\": d.get(\"trend\")}\n\n\ndef fd_metrics(budgets: Budgets, sym: str) -> dict | None:\n    if not budgets.can(\"financialdatasets\"):\n        return None\n    budgets.use(\"financialdatasets\")\n    try:\n        r = http_json(\"GET\", f\"{FD_URL}/financial-metrics/snapshot\",\n                      {\"X-API-KEY\": os.environ[PROVIDERS[\"financialdatasets\"][0]]}, {\"ticker\": sym})\n    except ApiError as e:\n        _paid_error(budgets, \"financialdatasets\", str(e))\n        return None\n    s = (r or {}).get(\"snapshot\") or {}\n    keep = (\"price_to_earnings_ratio\", \"revenue_growth\", \"earnings_growth\", \"net_margin\", \"return_on_equity\",\n            \"debt_to_equity\")\n    out = {k: s.get(k) for k in keep if s.get(k) is not None}\n    return out or None\n\n\ndef earnings_soon(budgets: Budgets, knowledge: dict, sym: str, today: str) -> str | None:\n    \"\"\"Next earnings date if within 3 months (Alpha Vantage calendar, fetched at most once a day).\"\"\"\n    cal = knowledge.setdefault(\"earnings_calendar\", {})\n    if cal.get(\"day\") != today:\n        txt = alpha_vantage(budgets, {\"function\": \"EARNINGS_CALENDAR\", \"horizon\": \"3month\"}, as_text=True)\n        if isinstance(txt, str) and txt.startswith(\"symbol\"):\n            rows = {}\n            for line in txt.splitlines()[1:]:\n                parts = line.split(\",\")\n                if len(parts) >= 3 and parts[0] and parts[2]:\n                    rows.setdefault(parts[0].upper(), parts[2])\n            cal.clear()\n            cal.update(day=today, dates=rows)\n    return (cal.get(\"dates\") or {}).get(sym)\n\n\ndef trading_days_until(today: str, then: str) -> int:\n    d0, d1 = date.fromisoformat(today), date.fromisoformat(then)\n    n, d = 0, d0\n    while d < d1:\n        d += timedelta(days=1)\n        if d.weekday() < 5:\n            n += 1\n    return n\n\n\ndef av_fundamentals(budgets: Budgets, knowledge: dict, sym: str, today: str) -> dict | None:\n    \"\"\"Company overview + earnings beat history (cached a week).\"\"\"\n    cache = knowledge.setdefault(\"fundamentals\", {})\n    c = cache.get(sym)\n    if c and (date.fromisoformat(today) - date.fromisoformat(c[\"day\"])).days < 7:\n        return c\n    ov = alpha_vantage(budgets, {\"function\": \"COMPANY_OVERVIEW\", \"symbol\": sym})\n    if not ov:\n        return c\n    ea = alpha_vantage(budgets, {\"function\": \"EARNINGS\", \"symbol\": sym}) or {}\n    q = (ea.get(\"quarterlyEarnings\") or [])[:8]\n    beats = [x for x in q if _f(x.get(\"surprisePercentage\")) is not None]\n    out = {\"day\": today, \"name\": ov.get(\"Name\", sym), \"sector\": ov.get(\"Sector\", \"\"),\n           \"pe\": _f(ov.get(\"PERatio\")), \"target\": _f(ov.get(\"AnalystTargetPrice\")),\n           \"rev_growth\": _f(ov.get(\"QuarterlyRevenueGrowthYOY\")),\n           \"beat_rate\": (sum(1 for x in beats if _f(x[\"surprisePercentage\"]) > 0) / len(beats)) if beats else None,\n           \"quarters\": len(beats)}\n    cache[sym] = out\n    return out\n\n\ndef _f(x):\n    try:\n        v = float(x)\n        return v if math.isfinite(v) else None\n    except (TypeError, ValueError):\n        return None\n\n\n# ---------- Free research: Google News + Yahoo Finance + Benzinga ----------\n\n@dataclass\nclass Research:\n    symbol: str\n    articles: int = 0\n    sites: int = 0\n    score: float = 0.0        # about -3 (very bad) .. +3 (very good)\n    good: int = 0\n    bad: int = 0\n    top: list = field(default_factory=list)    # [impact, headline, site]\n    sources: list = field(default_factory=list)\n    complete: bool = False    # met your \"15 articles from 10 sites\" rule\n    when: str = \"\"\n\n    def line(self) -> str:\n        tone = \"positive\" if self.score >= 0.3 else \"negative\" if self.score <= -0.3 else \"mixed/neutral\"\n        return (f\"Free research: {self.articles} articles from {self.sites} sites \"\n                f\"({', '.join(self.sources)}): {tone} ({self.good} good, {self.bad} bad).\")\n\n\ndef parse_rss(xml_text: str) -> list[dict]:\n    import xml.etree.ElementTree as ET\n    try:\n        root = ET.fromstring(xml_text)\n    except ET.ParseError:\n        return []\n    out = []\n    for it in root.iter(\"item\"):\n        src = it.find(\"source\")\n        out.append({\"title\": (it.findtext(\"title\") or \"\").strip(),\n                    \"link\": (it.findtext(\"link\") or \"\").strip(),\n                    \"summary\": re.sub(r\"<[^>]+>\", \" \", it.findtext(\"description\") or \"\")[:300],\n                    \"published\": it.findtext(\"pubDate\") or \"\",\n                    \"site\": (src.get(\"url\") if src is not None and src.get(\"url\") else \"\") or \"\",\n                    \"site_name\": (src.text or \"\").strip() if src is not None else \"\"})\n    return out\n\n\ndef domain_of(url: str) -> str:\n    d = urllib.parse.urlparse(url).netloc.lower()\n    return d[4:] if d.startswith(\"www.\") else d\n\n\ndef free_research(sym: str, state: dict, cfg: dict, now_iso: str) -> Research:\n    arts, sources = [], []\n    q = f\"{sym} stock when:7d\"\n    try:\n        g = parse_rss(http_text(GNEWS_URL, {\"q\": q, \"hl\": \"en-US\", \"gl\": \"US\", \"ceid\": \"US:en\"}))\n        for a in g:\n            # Google titles end in \" - Source\"\n            if a[\"site_name\"] and a[\"title\"].endswith(\" - \" + a[\"site_name\"]):\n                a[\"title\"] = a[\"title\"][: -len(a[\"site_name\"]) - 3]\n            a[\"domain\"] = domain_of(a[\"site\"]) or a[\"site_name\"].lower() or \"news.google.com\"\n        arts += g\n        if g:\n            sources.append(\"Google News\")\n    except ApiError as e:\n        print(f\"  Google News failed for {sym}: {e}\")\n    try:\n        y = parse_rss(http_text(YAHOO_RSS_URL, {\"s\": sym, \"region\": \"US\", \"lang\": \"en-US\"}))\n        for a in y:\n            a[\"domain\"] = domain_of(a[\"link\"]) or \"finance.yahoo.com\"\n        arts += y\n        if y:\n            sources.append(\"Yahoo Finance\")\n    except ApiError as e:\n        print(f\"  Yahoo Finance failed for {sym}: {e}\")\n    for ts, impact, cat, head in state.get(\"news\", {}).get(\"events\", {}).get(sym, []):\n        arts.append({\"title\": head, \"summary\": \"\", \"domain\": \"benzinga.com\", \"link\": \"\"})\n    if state.get(\"news\", {}).get(\"events\", {}).get(sym):\n        sources.append(\"Benzinga\")\n\n    seen, uniq = set(), []\n    for a in arts:\n        key = re.sub(r\"\\W+\", \" \", a[\"title\"].lower()).strip()[:80]\n        if key and key not in seen:\n            seen.add(key)\n            uniq.append(a)\n    r = Research(sym, len(uniq), len({a[\"domain\"] for a in uniq}), sources=sources, when=now_iso)\n    impacts = []\n    for a in uniq:\n        k = rate_headline(a[\"title\"], a.get(\"summary\", \"\"))\n        if not k or k[0] == 0:\n            continue\n        imp = k[0] * k[1] * k[2]\n        impacts.append(imp)\n        r.good += k[0] > 0\n        r.bad += k[0] < 0\n        r.top.append([round(imp, 2), a[\"title\"][:120], a[\"domain\"]])\n    if impacts:\n        r.score = round(sum(impacts) / len(impacts) * min(1.0, len(impacts) / 5), 2)\n    r.top = sorted(r.top, key=lambda x: -abs(x[0]))[:5]\n    r.complete = r.articles >= cfg[\"research_min_articles\"] and r.sites >= cfg[\"research_min_sites\"]\n    return r\n\n\n# ---------- Forums: Reddit (via ApeWisdom) and StockTwits. Attention, not proof (playbook rules 6-7) ----------\n\ndef _soft_json(url: str, timeout: int = 12):\n    \"\"\"GET JSON from a free public site; None if it's down or blocks us. Forums are a bonus, never required.\"\"\"\n    if os.environ.get(\"NEONTAPE_OFFLINE\"):\n        return None\n    try:\n        return http_json(\"GET\", url, {\"Accept\": \"application/json\",\n                                      \"User-Agent\": \"Mozilla/5.0 (compatible; NeonTape/1.0)\"}, timeout=timeout)\n    except (ApiError, ValueError, OSError) as e:\n        print(f\"  forum source skipped: {e}\")\n        return None\n\n\ndef _int(x) -> int:\n    try:\n        return int(float(x or 0))\n    except (TypeError, ValueError):\n        return 0\n\n\ndef reddit_trending(knowledge: dict, now_iso: str, max_age_min: int = 60) -> list[dict]:\n    \"\"\"The 100 most-mentioned stocks across Reddit's investing forums in the last 24h, with yesterday's numbers.\"\"\"\n    c = knowledge.get(\"reddit_trending\") or {}\n    if c.get(\"when\") and (parse_ts(now_iso) - parse_ts(c[\"when\"])).total_seconds() < max_age_min * 60:\n        return c.get(\"rows\", [])\n    j = _soft_json(APEWISDOM_URL)\n    rows = []\n    for r in ((j or {}).get(\"results\") or [])[:100]:\n        t = str(r.get(\"ticker\") or \"\").upper()\n        if re.fullmatch(r\"[A-Z]{1,5}\", t):\n            rows.append({\"symbol\": t, \"name\": html.unescape(r.get(\"name\") or \"\")[:40], \"rank\": _int(r.get(\"rank\")),\n                         \"mentions\": _int(r.get(\"mentions\")), \"mentions_24h_ago\": _int(r.get(\"mentions_24h_ago\")),\n                         \"rank_24h_ago\": _int(r.get(\"rank_24h_ago\")), \"upvotes\": _int(r.get(\"upvotes\"))})\n    if rows or not c:\n        knowledge[\"reddit_trending\"] = {\"when\": now_iso, \"rows\": rows}\n    return rows or c.get(\"rows\", [])\n\n\ndef stocktwits_mood(sym: str) -> dict | None:\n    j = _soft_json(STOCKTWITS_URL.format(sym=urllib.parse.quote(sym)))\n    msgs = (j or {}).get(\"messages\") or []\n    if not msgs:\n        return None\n    bull = sum(1 for x in msgs if (((x.get(\"entities\") or {}).get(\"sentiment\") or {}).get(\"basic\") == \"Bullish\"))\n    bear = sum(1 for x in msgs if (((x.get(\"entities\") or {}).get(\"sentiment\") or {}).get(\"basic\") == \"Bearish\"))\n    tagged = bull + bear\n    newest, oldest = (msgs[0].get(\"created_at\") or \"\")[:16], (msgs[-1].get(\"created_at\") or \"\")[:16]\n    return {\"posts\": len(msgs), \"bullish\": bull, \"bearish\": bear,\n            \"bull_pct\": round(bull / tagged * 100) if tagged else None, \"from\": oldest, \"to\": newest}\n\n\ndef forum_buzz(sym: str, knowledge: dict, now_iso: str, max_age_min: int = 120) -> dict:\n    \"\"\"What the investing forums are saying about one stock: Reddit mention rank/trend and StockTwits mood.\n    'hype' marks a sudden crowd surge: the SEC warns that's when pump-and-dumps happen.\"\"\"\n    sym = sym.upper().strip().lstrip(\"$\")\n    cache = knowledge.setdefault(\"forum\", {})\n    c = cache.get(sym)\n    if c and (parse_ts(now_iso) - parse_ts(c[\"when\"])).total_seconds() < max_age_min * 60:\n        return c\n    rd = next((r for r in reddit_trending(knowledge, now_iso) if r[\"symbol\"] == sym), None)\n    st = stocktwits_mood(sym)\n    hype = bool(rd and rd[\"rank\"] <= 20 and rd[\"mentions\"] >= 50 and rd[\"mentions\"] >= 2.5 * max(1, rd[\"mentions_24h_ago\"]))\n    parts = []\n    if rd:\n        ch = (f\", up from {rd['mentions_24h_ago']}\" if rd[\"mentions\"] > rd[\"mentions_24h_ago\"] else\n              f\", down from {rd['mentions_24h_ago']}\" if rd[\"mentions\"] < rd[\"mentions_24h_ago\"] else \"\")\n        parts.append(f\"Reddit #{rd['rank']} ({rd['mentions']} mentions in 24h{ch})\")\n    if st and st[\"bull_pct\"] is not None:\n        parts.append(f\"StockTwits {st['bull_pct']}% bullish ({st['bullish'] + st['bearish']} tagged posts)\")\n    out = {\"when\": now_iso, \"reddit\": rd, \"stocktwits\": st, \"hype\": hype,\n           \"line\": (\"Forums: \" + \"; \".join(parts) + (\". ⚠️ Sudden crowd hype: keep it small, hype can reverse fast.\"\n                                                     if hype else \".\")) if parts else \"\"}\n    cache[sym] = out\n    for k in sorted(cache, key=lambda x: cache[x][\"when\"])[:-40]:\n        del cache[k]\n    return out\n\n\ndef reddit_risers(knowledge: dict, now_iso: str, n: int = 3) -> list[dict]:\n    \"\"\"Stocks whose Reddit attention jumped since yesterday (for discovery; they still face every check).\"\"\"\n    rows = [r for r in reddit_trending(knowledge, now_iso)\n            if r[\"mentions\"] >= 30 and (r[\"rank_24h_ago\"] - r[\"rank\"] >= 5 or r[\"mentions\"] >= 2 * max(1, r[\"mentions_24h_ago\"]))]\n    rows.sort(key=lambda r: (r[\"mentions\"] - r[\"mentions_24h_ago\"]), reverse=True)\n    return rows[:n]\n\n\ndef get_research(sym: str, state: dict, knowledge: dict, cfg: dict, now_iso: str) -> Research:\n    cache = knowledge.setdefault(\"research\", {})\n    c = cache.get(sym)\n    if c and (parse_ts(now_iso) - parse_ts(c[\"when\"])).total_seconds() < cfg[\"research_cache_hours\"] * 3600:\n        return Research(**c)\n    r = free_research(sym, state, cfg, now_iso)\n    cache[sym] = r.__dict__.copy()\n    # keep the cache small\n    for k in sorted(cache, key=lambda s: cache[s][\"when\"])[:-60]:\n        del cache[k]\n    return r\n\n\ndef research_uncertain(r: Research) -> bool:\n    \"\"\"True when free sources can't settle it: too little coverage, or good and bad news cancel out.\"\"\"\n    return (not r.complete) or (abs(r.score) < 0.3 and r.good > 0 and r.bad > 0)\n\n\n# ---------- Long-term statistics from years of free price history ----------\n\ndef long_stats_from_closes(dates: list[str], closes: list[float]) -> dict | None:\n    n = len(closes)\n    if n < 252:\n        return None\n    years = n / 252\n    cagr = ((closes[-1] / closes[0]) ** (1 / years) - 1) * 100\n    peak, mdd = closes[0], 0.0\n    for c in closes:\n        peak = max(peak, c)\n        mdd = min(mdd, (c / peak - 1) * 100)\n    rets = [(closes[i] / closes[i - 1] - 1) * 100 for i in range(1, n)]\n    drops = [i for i in range(1, n) if rets[i - 1] <= -4.0 and i + 10 < n]\n    after = [(closes[i + 10] / closes[i] - 1) * 100 for i in drops]\n    by_year: dict[str, list[float]] = {}\n    for d, c in zip(dates, closes):\n        by_year.setdefault(d[:4], []).append(c)\n    full = [v for y, v in sorted(by_year.items())[:-1] if len(v) > 200]\n    up_years = sum(1 for v in full if v[-1] > v[0])\n    return {\"years\": round(years, 1), \"cagr\": round(cagr, 1), \"max_drawdown\": round(mdd, 1),\n            \"best_day\": round(max(rets), 1), \"worst_day\": round(min(rets), 1),\n            \"pct_days_up\": round(sum(1 for r in rets if r > 0) / len(rets) * 100),\n            \"drops_4pct\": len(drops), \"after_drop_10d\": round(sum(after) / len(after), 1) if after else None,\n            \"up_years\": up_years, \"full_years\": len(full)}\n\n\ndef long_stats(alp: \"Alpaca\", knowledge: dict, sym: str, today: str) -> dict | None:\n    cache = knowledge.setdefault(\"long_stats\", {})\n    c = cache.get(sym)\n    if c and (date.fromisoformat(today) - date.fromisoformat(c[\"day\"])).days < 7:\n        return c\n    try:\n        bars = alp.daily_bars([sym], date.fromisoformat(today) - timedelta(days=int(365.25 * 6))).get(sym) or []\n    except ApiError as e:\n        print(f\"  history failed for {sym}: {e}\")\n        return c\n    st = long_stats_from_closes([b[\"t\"][:10] for b in bars], [float(b[\"c\"]) for b in bars])\n    if st:\n        st[\"day\"] = today\n        cache[sym] = st\n    return st\n\n\ndef stats_line(st: dict | None) -> str:\n    if not st:\n        return \"\"\n    s = (f\"History ({st['years']:g} yrs): {st['cagr']:+.0f}%/yr, worst drop {st['max_drawdown']:.0f}%, \"\n         f\"up {st['up_years']} of {st['full_years']} full years, worst day {st['worst_day']:.0f}%.\")\n    if st.get(\"after_drop_10d\") is not None and st[\"drops_4pct\"] >= 3:\n        s += f\" After its {st['drops_4pct']} drops of 4%+ in a day, it averaged {st['after_drop_10d']:+.1f}% over the next 10 days.\"\n    return s\n\n\n# ---------- Track record: how did past buy alerts do? ----------\n\ndef record_buy(knowledge: dict, sym: str, price: float, day: str) -> None:\n    knowledge.setdefault(\"track\", []).append({\"sym\": sym, \"day\": day, \"price\": round(price, 4), \"status\": \"open\",\n                                              \"result\": None})\n    knowledge[\"track\"] = knowledge[\"track\"][-300:]\n\n\ndef update_track(knowledge: dict, allm: dict, cfg: dict, today: str) -> None:\n    for t in knowledge.get(\"track\", []):\n        if t[\"status\"] != \"open\":\n            continue\n        m = allm.get(t[\"sym\"])\n        if not m:\n            continue\n        g = (m.price / t[\"price\"] - 1) * 100\n        if g >= cfg[\"profit_pct\"]:\n            t.update(status=\"win\", result=round(g, 2), closed=today)\n        elif g <= -cfg[\"stop_pct\"]:\n            t.update(status=\"loss\", result=round(g, 2), closed=today)\n        elif (date.fromisoformat(today) - date.fromisoformat(t[\"day\"])).days > 28:\n            t.update(status=\"expired\", result=round(g, 2), closed=today)\n\n\ndef track_summary(knowledge: dict) -> dict:\n    tr = knowledge.get(\"track\", [])\n    w = sum(t[\"status\"] == \"win\" for t in tr)\n    l = sum(t[\"status\"] == \"loss\" for t in tr)\n    e = sum(t[\"status\"] == \"expired\" for t in tr)\n    o = sum(t[\"status\"] == \"open\" for t in tr)\n    done = w + l\n    return {\"alerts\": len(tr), \"wins\": w, \"losses\": l, \"expired\": e, \"open\": o,\n            \"win_rate\": round(w / done * 100) if done else None}\n\n\ndef track_line(knowledge: dict) -> str:\n    s = track_summary(knowledge)\n    if not (s[\"wins\"] + s[\"losses\"]):\n        return \"Track record: no finished buy alerts yet.\"\n    return (f\"Track record: {s['wins']} of {s['wins'] + s['losses']} finished buy alerts hit +2% before -2% \"\n            f\"({s['win_rate']}%). It needs about 53%+ to beat costs.\")\n\n\n# ---------- Ideas: trending stocks from the news + near-setups ----------\n\ndef note_trending(knowledge: dict, raw_items: list[dict], interest: set[str], now_iso: str) -> None:\n    tr = knowledge.setdefault(\"trending\", {})\n    for it in raw_items:\n        tickers = [t.upper() for t in it.get(\"symbols\") or []]\n        if not (1 <= len(tickers) <= 3):\n            continue\n        k = rate_headline(it.get(\"headline\") or \"\", it.get(\"summary\") or \"\")\n        if not k or k[0] == 0:\n            continue\n        for t in tickers:\n            if t in interest or t in MACRO_TICKERS or not t.isalpha() or len(t) > 5:\n                continue\n            tr.setdefault(t, []).append([it.get(\"created_at\") or now_iso, round(k[0] * k[1] * k[2], 2),\n                                         (it.get(\"headline\") or \"\")[:100]])\n    cutoff = parse_ts(now_iso) - timedelta(hours=48)\n    for t in list(tr):\n        tr[t] = [x for x in tr[t] if _safe_ts(x[0]) >= cutoff][-10:]\n        if not tr[t]:\n            del tr[t]\n\n\ndef trending_ideas(knowledge: dict, n: int = 3) -> list[dict]:\n    out = []\n    for t, xs in knowledge.get(\"trending\", {}).items():\n        net = sum(x[1] for x in xs)\n        pos = sum(1 for x in xs if x[1] > 0)\n        if pos >= 2 and net > 0:\n            out.append({\"symbol\": t, \"mentions\": len(xs), \"net\": round(net, 2), \"headline\": xs[-1][2]})\n    return sorted(out, key=lambda d: (-d[\"net\"], -d[\"mentions\"]))[:n]\n\n\ndef dynamic_universe(knowledge: dict, today: str) -> list[str]:\n    dyn = knowledge.setdefault(\"dynamic\", {})\n    for s in list(dyn):\n        if dyn[s] < today:\n            del dyn[s]\n    return sorted(dyn)\n\n\ndef add_dynamic(knowledge: dict, syms: list[str], today: str, keep_days: int, cap: int) -> None:\n    dyn = knowledge.setdefault(\"dynamic\", {})\n    until = (date.fromisoformat(today) + timedelta(days=keep_days)).isoformat()\n    for s in syms:\n        if s not in dyn and len(dyn) < cap:\n            dyn[s] = until\n\n\n# ---------- Whole-market discovery ----------\n\ndef discover_market(alp: \"Alpaca\", knowledge: dict, cfg: dict, today: str) -> list[dict]:\n    \"\"\"Once a day: the market's top gainers and most-traded stocks join the scan for 5 days,\n    so the bot isn't limited to a fixed list. The normal checks still decide if any is a buy.\"\"\"\n    if not cfg[\"discover_movers\"] or knowledge.get(\"discovered_day\") == today:\n        return knowledge.get(\"discovered\", [])\n    n = int(cfg[\"discover_count\"])\n    floor = 2.0 if cfg[\"risk_level\"] == \"speculative\" else float(cfg[\"discover_min_price\"])\n    found: list[dict] = []\n    try:\n        mv = alp.movers(max(n * 2, 10))\n        for g in mv.get(\"gainers\") or []:\n            if (g.get(\"price\") or 0) >= floor and re.fullmatch(r\"[A-Z]{1,5}\", g.get(\"symbol\") or \"\"):\n                found.append({\"symbol\": g[\"symbol\"], \"why\": f\"top gainer today ({g.get('percent_change', 0):+.1f}%)\"})\n        for a in alp.most_actives(max(n * 2, 10)):\n            if re.fullmatch(r\"[A-Z]{1,5}\", a.get(\"symbol\") or \"\") and a[\"symbol\"] not in {f[\"symbol\"] for f in found}:\n                found.append({\"symbol\": a[\"symbol\"], \"why\": \"one of the most traded stocks today\"})\n    except ApiError as e:\n        print(f\"Market discovery skipped: {e}\")\n        return knowledge.get(\"discovered\", [])\n    if cfg.get(\"discover_forums\", True):\n        have = {f[\"symbol\"] for f in found}\n        for r in reddit_risers(knowledge, today + \"T13:00:00Z\"):\n            if r[\"symbol\"] not in have:\n                found.append({\"symbol\": r[\"symbol\"],\n                              \"why\": f\"rising on Reddit (#{r['rank']}, {r['mentions']} mentions vs {r['mentions_24h_ago']})\"})\n    base = set(cfg[\"universe\"])\n    found = [f for f in found if f[\"symbol\"] not in base and f[\"symbol\"] not in MACRO_TICKERS][: n * 2 + 3]\n    add_dynamic(knowledge, [f[\"symbol\"] for f in found], today, 5, int(cfg[\"max_extra_watch\"]) + n * 2)\n    knowledge[\"discovered\"], knowledge[\"discovered_day\"] = found, today\n    print(f\"Discovered {len(found)} new stocks to check: {', '.join(f['symbol'] for f in found)}\")\n    return found\n\n\n# ---------- Follow-up on past buy alerts ----------\n\ndef rec_updates(knowledge: dict, allm: dict, cfg: dict, regime: bool, state: dict, now_iso: str,\n                held: set[str], mkt: \"NewsView | None\") -> list[Alert]:\n    \"\"\"Keeps watching stocks it recommended. Tells you if the call changes; doesn't keep liking a stock\n    just because it liked it before.\"\"\"\n    out = []\n    for t in knowledge.get(\"track\", []):\n        if t[\"status\"] != \"open\" or t[\"sym\"] in held:\n            continue\n        m = allm.get(t[\"sym\"])\n        if not m:\n            continue\n        done = t.setdefault(\"notified\", [])\n        g = (m.price / t[\"price\"] - 1) * 100\n        a = assess(m, cfg, regime, news_view(state, t[\"sym\"], now_iso), mkt)\n        name = company_name(t[\"sym\"])\n        label = f\"{t['sym']}\" + (f\" ({name[:30]})\" if name else \"\")\n        if \"broke\" not in done and (a[\"status\"] == \"PASS\" and (m.price < m.sma50 or g <= -cfg[\"stop_pct\"] / 2)):\n            done.append(\"broke\")\n            out.append(Alert(f\"rec-broke:{t['sym']}:{t['day']}\", \"rec\", f\"📉 Update: {t['sym']} is no longer a buy\",\n                             compose(f\"You should not buy {label} now. Why: {'; '.join(a['fails'][:2]) or a['verdict']}.\",\n                                     [f\"Alerted {t['day']} at {money(t['price'])}; now {money(m.price)} ({g:+.1f}%).\",\n                                      \"If you bought it, the bot is watching it with your sell rules.\"]),\n                             cfg[\"priority_news\"], t[\"sym\"], cfg[\"sound_sell\"], color=COLORS[\"orange\"]))\n        elif \"target\" not in done and g >= cfg[\"profit_pct\"]:\n            done.append(\"target\")\n            out.append(Alert(f\"rec-target:{t['sym']}:{t['day']}\", \"rec\", f\"🎯 {t['sym']} hit +{g:.1f}% since the buy alert\",\n                             compose(f\"From {money(t['price'])} to {money(m.price)}. Now: {a['status']} ({a['conf']}/100).\",\n                                     [\"If you own it outside Robinhood, add it so the bot can send sell alerts.\"]),\n                             0, t[\"sym\"], color=COLORS[\"green\"]))\n    return out\n\n\n# ---------- Daily intelligence brief ----------\n\ndef brief_alert(holdings: list[Holding], allm: dict, ranked: list, regime: bool, regime_txt: str, cfg: dict,\n                state: dict, knowledge: dict, now_iso: str, mkt: \"NewsView | None\") -> Alert:\n    asm = {m.symbol: assess(m, cfg, regime, news_view(state, m.symbol, now_iso), mkt) for m in ranked}\n    buys = sorted([m for m in ranked if asm[m.symbol][\"status\"] in (\"STRONG BUY\", \"BUY\")],\n                  key=lambda m: -asm[m.symbol][\"conf\"])[:3]\n    near = [m for m in ranked if asm[m.symbol][\"status\"] == \"WATCH\"][:3]\n    lines = []\n    lines.append(\"Top buy candidates: \" + (\", \".join(f\"{m.symbol} {asm[m.symbol]['status']} {asm[m.symbol]['conf']}/100\"\n                                                      for m in buys) if buys else \"none pass every check today.\"))\n    if near:\n        lines.append(\"Close to an entry: \" + \"; \".join(f\"{m.symbol} ({(asm[m.symbol]['setup'] or 'watch').lower()})\"\n                                                      for m in near))\n    own = []\n    total = sum((allm[h.symbol].price * h.shares) for h in holdings if h.symbol in allm and h.shares) or 0\n    avoid = []\n    for h in holdings:\n        m = allm.get(h.symbol)\n        if not m:\n            continue\n        a = assess(m, cfg, regime, news_view(state, h.symbol, now_iso), mkt, owned=True)\n        own.append(f\"{h.symbol} {a['status']} {(m.price / h.buy_price - 1) * 100:+.1f}%\")\n        if a[\"status\"] in (\"SELL\", \"REDUCE\"):\n            avoid.append(h.symbol)\n        if total and h.shares and m.price * h.shares / total >= 0.6 and len(holdings) > 1:\n            own.append(f\"({h.symbol} is {m.price * h.shares / total * 100:.0f}% of your stocks: concentrated)\")\n    if own:\n        lines.append(\"Your stocks: \" + \", \".join(own))\n    broke = [t[\"sym\"] for t in knowledge.get(\"track\", []) if \"broke\" in (t.get(\"notified\") or []) and t[\"status\"] == \"open\"]\n    if avoid or broke:\n        lines.append(\"Avoid / reconsider: \" + \", \".join(dict.fromkeys(avoid + broke)))\n    disc = knowledge.get(\"discovered\") or []\n    if disc:\n        lines.append(\"New on the radar: \" + \", \".join(f\"{d['symbol']} ({d['why']})\" for d in disc[:3]))\n    if mkt and mkt.headline:\n        lines.append(f\"Market news: {mkt.label}: {mkt.headline[:90]}\")\n    lines.append(\"Watching next: \" + (\", \".join(m.symbol for m in near[:2]) + \" for a clean entry\" if near\n                                     else \"the top-ranked stocks for a pullback entry\"))\n    lines.append(track_line(knowledge))\n    head = \"healthy\" if regime else \"weak, buys on hold\"\n    bi = best_idea(ranked, cfg, regime, state, now_iso, {h.symbol for h in holdings}, mkt)\n    if bi and not buys:\n        lines.insert(1, \"💡 Best idea to watch: \" + idea_line(*bi))\n    simple = (f\"Market {head}. \" + (f\"Best idea: {buys[0].symbol} ({asm[buys[0].symbol]['status']}, \"\n                                    f\"{asm[buys[0].symbol]['conf']}/100).\" if buys else\n                                    f\"Best idea: {bi[0].symbol} ({bi[1]['status'].title()} {bi[1]['conf']}/100), not a full buy yet.\"\n                                    if bi else \"No stock passes every buy check yet.\"))\n    body = compose(simple, [x[:150] for x in lines])\n    while len(body) > 1000 and len(lines) > 3:\n        lines.pop(-2)\n        body = compose(simple, lines)\n    return Alert(f\"brief:{now_iso[:10]}\", \"brief\", f\"☀️ Daily brief: {len(buys)} buy idea{'s' if len(buys) != 1 else ''}\",\n                 body, cfg[\"priority_summary\"], color=COLORS[\"info\"])\n\n\n# ---------- Obsidian vault + app dashboard ----------\n\ndef log_alerts(knowledge: dict, alerts: list[Alert], now_iso: str) -> None:\n    log = knowledge.setdefault(\"alerts_log\", [])\n    for a in alerts:\n        log.append({\"t\": now_iso[:16], \"kind\": a.kind, \"sym\": a.symbol, \"title\": a.title,\n                    \"message\": a.message[:1500], \"color\": a.color, \"url\": a.url})\n    knowledge[\"alerts_log\"] = log[-300:]\n\n\ndef write_vault(knowledge: dict, state: dict, holdings: list, allm: dict, alerts: list[Alert],\n                budgets: Budgets, now_iso: str, root: Path | None = None) -> None:\n    root = root or HERE / \"vault\"\n    (root / \"Stocks\").mkdir(parents=True, exist_ok=True)\n    (root / \"Daily\").mkdir(parents=True, exist_ok=True)\n    today = now_iso[:10]\n    if alerts:\n        p = root / \"Daily\" / f\"{today}.md\"\n        head = \"\" if p.exists() else f\"---\\ntags: [daily, stock-bot]\\n---\\n# {today}\\n\\n\"\n        with open(p, \"a\", encoding=\"utf-8\") as f:\n            f.write(head)\n            for a in alerts:\n                link = f\"[[{a.symbol}]] \" if a.symbol else \"\"\n                f.write(f\"- {now_iso[11:16]} {link}**{a.title}**: {a.message.splitlines()[0]}\\n\")\n    syms = {h.symbol for h in holdings} | {a.symbol for a in alerts if a.symbol}\n    for sym in sorted(syms):\n        m = allm.get(sym)\n        lines = [f\"---\\ntags: [stock, stock-bot]\\nupdated: {now_iso[:16]}\\n---\", f\"# {sym}\", \"\"]\n        if m:\n            lines += [f\"**Price** {money(m.price)}\" + (f\" • momentum rank #{m.rank}\" if m.rank else \"\") + f\" • RSI {m.rsi:.0f} • \"\n                      f\"12-mo {m.ret_12_1:+.0f}% • normal daily swing ±{m.atr_pct:.1f}%\", \"\"]\n        st = knowledge.get(\"long_stats\", {}).get(sym)\n        if st:\n            lines += [\"## Long-term stats\", stats_line(st), \"\"]\n        fu = knowledge.get(\"fundamentals\", {}).get(sym)\n        if fu:\n            lines += [\"## Fundamentals (Alpha Vantage)\",\n                      f\"{fu.get('name')} • {fu.get('sector')} • P/E {fu.get('pe')} • analyst target {fu.get('target')} • \"\n                      f\"beat earnings in {round((fu.get('beat_rate') or 0) * 100)}% of last {fu.get('quarters')} quarters\", \"\"]\n        rs = knowledge.get(\"research\", {}).get(sym)\n        if rs:\n            r = Research(**rs)\n            lines += [\"## Latest research\", r.line()] + [f\"- ({x[0]:+.1f}) {x[1]} *({x[2]})*\" for x in r.top] + [\"\"]\n        ev = state.get(\"news\", {}).get(\"events\", {}).get(sym, [])\n        if ev:\n            lines += [\"## Recent news (rated)\"] + [f\"- {e[0][:16].replace('T', ' ')} ({e[1]:+.1f}) {e[2]}: {e[3]}\" for e in ev[-8:]] + [\"\"]\n        hist = [x for x in knowledge.get(\"alerts_log\", []) if x[\"sym\"] == sym][-10:]\n        if hist:\n            lines += [\"## Alerts\"] + [f\"- {x['t'].replace('T', ' ')} {x['title']}\" for x in hist] + [\"\"]\n        (root / \"Stocks\" / f\"{sym}.md\").write_text(\"\\n\".join(lines), encoding=\"utf-8\")\n    bt = budgets.table()\n    mem = [f\"---\\ntags: [stock-bot]\\nupdated: {now_iso[:16]}\\n---\", \"# Bot Memory\", \"\",\n           \"## Track record\", track_line(knowledge), \"\",\n           \"## Paid sources (used / limit)\"] + \\\n          [f\"- {b['name']}: {'not connected' if not b['connected'] else str(b['used']) + ' / ' + str(b['limit']) + ' per ' + b['per'] + (' (OUT)' if b['out'] else '')}\"\n           for b in bt] + [\"\", \"## Watching extra (from the news)\"] + \\\n          [f\"- [[{s}]] until {d}\" for s, d in sorted(knowledge.get(\"dynamic\", {}).items())] + [\"\"]\n    (root / \"Bot Memory.md\").write_text(\"\\n\".join(mem), encoding=\"utf-8\")\n\n\ndef write_dashboard(knowledge: dict, state: dict, cfg: dict, holdings: list, allm: dict, ranked: list,\n                    regime_txt: str, budgets: Budgets, now_iso: str, market_open: bool,\n                    path: Path | None = None) -> None:\n    path = path or HERE / \"app\" / \"dashboard.json\"\n    path.parent.mkdir(parents=True, exist_ok=True)\n    regime = regime_txt.startswith(\"market healthy\")\n    mkt = news_view(state, MARKET_KEY, now_iso)\n    hold = []\n    for h in holdings:\n        m = allm.get(h.symbol)\n        if not m:\n            hold.append({\"symbol\": h.symbol, \"buy\": h.buy_price, \"shares\": h.shares, \"src\": h.source,\n                         \"since\": h.bought}); continue\n        a = assess(m, cfg, regime, news_view(state, h.symbol, now_iso), mkt, owned=True)\n        v, why = a[\"verdict\"], a[\"why\"]\n        hold.append({\"symbol\": h.symbol, \"buy\": h.buy_price, \"shares\": h.shares, \"src\": h.source,\n                     \"st\": a[\"status\"], \"conf\": a[\"conf\"], \"name\": company_name(h.symbol),\n                     \"since\": h.bought, \"price\": round(m.price, 2), \"spark\": [round(c, 2) for c in m.closes[-40:]],\n                     \"hist\": [round(c, 2) for c in m.closes[-252:]],\n                     \"gain\": round((m.price / h.buy_price - 1) * 100, 2),\n                     \"pl\": round((m.price - h.buy_price) * h.shares, 2) if h.shares else None,\n                     \"stop\": round(h.buy_price * (1 - cfg[\"stop_pct\"] / 100), 2), \"advice\": v, \"why\": why})\n    held = {h.symbol for h in holdings}\n\n    def watch_row(m, owned):\n        nv = news_view(state, m.symbol, now_iso)\n        a = assess(m, cfg, regime, nv, mkt, owned=owned)\n        ok, fails = a[\"status\"] in (\"STRONG BUY\", \"BUY\"), a[\"fails\"]\n        return {\"symbol\": m.symbol, \"rank\": m.rank, \"price\": round(m.price, 2), \"score\": round(m.score),\n                \"r12\": round(m.ret_12_1), \"rsi\": round(m.rsi), \"atr\": round(m.atr_pct, 1),\n                \"st\": a[\"status\"], \"conf\": a[\"conf\"], \"setup_type\": a[\"setup\"], \"name\": company_name(m.symbol),\n                \"trigger\": a.get(\"trigger\", \"\"), \"vol\": m.vol_ratio, \"news\": nv.score, \"setup\": ok, \"fails\": fails[:3], \"risk\": risk_label(m.atr_pct),\n                \"day\": round(m.day_chg_pct, 2), \"spark\": [round(c, 2) for c in m.closes[-40:]],\n                \"hist\": [round(c, 2) for c in m.closes[-252:]]}\n\n    def every_row(m, owned):  # compact facts on every ranked stock, so the app can answer \"check X\" instantly\n        nv = news_view(state, m.symbol, now_iso)\n        a = assess(m, cfg, regime, nv, mkt, o
