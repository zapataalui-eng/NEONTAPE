 re.fullmatch(r\"[A-Z]{1,5}(\\.[A-Z])?\", sym):\n                continue\n            w = [x for x in raw.get(\"watch_extra\", []) if x != sym]\n            ig = [x for x in raw.get(\"ignore\", []) if x != sym]\n            if \"watch\" in a:\n                w.append(sym); done.append(f\"✓ Watching {sym}\")\n            else:\n                ig.append(sym); done.append(f\"✓ Stopped watching {sym}\")\n            raw[\"watch_extra\"], raw[\"ignore\"] = w, ig\n    if done:\n        cfg_path.write_text(json.dumps(raw, indent=2) + \"\\n\", encoding=\"utf-8\")\n    return done\n\n\ndef check_alert(sym: str, allm: dict, ranked: list, regime: bool, cfg: dict, state: dict, now_iso: str,\n                holdings: list[Holding]) -> Alert:\n    m = allm.get(sym)\n    if not m:\n        return Alert(f\"reply:{sym}:{now_iso}\", \"reply\", f\"🤖 {sym}: no data\",\n                     compose(f\"I couldn't get a year of prices for {sym}. Check the symbol.\", []), 0, sym,\n                     color=COLORS[\"info\"])\n    nv = news_view(state, sym, now_iso)\n    verdict, pts, why = hold_advice(m, regime, nv, news_view(state, MARKET_KEY, now_iso))\n    ok, fails = buy_check(m, cfg, regime, nv)\n    h = next((x for x in holdings if x.symbol == sym), None)\n    lines = [f\"Price {money(m.price)} ({m.day_chg_pct:+.1f}% today) • {risk_label(m.atr_pct)} risk \"\n             f\"(moves ±{m.atr_pct:.1f}%/day)\",\n             f\"Momentum rank #{m.rank} of {m.of}: 12-mo {m.ret_12_1:+.0f}%, 6-mo {m.ret_6_1:+.0f}%, \"\n             f\"{m.from_high_pct:.1f}% below its 52-week high\",\n             \"Buy setup: YES, passes every check\" if ok else \"Buy setup: not yet. \" + \"; \".join(fails[:3]),\n             f\"Chart + news score {pts:+d}:\", *why]\n    lines.append(f\"📰 {nv.label}: {nv.headline}\" if nv.headline else \"📰 No major news in the last 3 days.\")\n    if h:\n        g = (m.price / h.buy_price - 1) * 100\n        lines.insert(0, f\"You own it: bought {money(h.buy_price)}, now {g:+.1f}%\")\n    simple = (\"Buy setup is ready.\" if ok and not h else f\"Advice: {verdict}.\")\n    return Alert(f\"reply:{sym}:{now_iso}\", \"reply\", f\"🤖 {sym} {money(m.price)}: {verdict.split(':')[0]}\",\n                 compose(simple, lines), 0, sym, \"\", app_link(cfg, \"stocks\"), \"Open Neon Tape\",\n                 COLORS[\"green\" if ok else \"info\"],\n                 chart_of(m, [(m.price * (1 - cfg[\"stop_pct\"] / 100), \"#ff3b5c\", \"STOP\")] if not h else\n                          [(h.buy_price, \"#e5e7eb\", \"BUY\"), (h.buy_price * (1 - cfg[\"stop_pct\"] / 100), \"#ff3b5c\", \"STOP\")]))\n\n\ndef cmd_ask(cfg, args):\n    text = (args.text or os.environ.get(\"BOT_REQUEST\", \"\")).strip()[:500]\n    po = Pushover.from_env(cfg)\n    notifier = po or PrintNotifier()\n    knowledge = load_knowledge()\n    alp = Alpaca.from_env(cfg[\"data_feed\"])\n    clock = alp.clock()\n    now_iso = clock[\"timestamp\"]\n    budgets = Budgets(knowledge, cfg, now_iso)\n    acts = parse_request(text) if text else []\n    source = \"rules\"\n    if text and not acts:\n        acts, source = ai_parse_request(text, cfg, budgets), \"Claude\"\n    cfg_path = args.config or HERE / \"config.json\"\n    changes = apply_settings(acts, cfg_path)\n    if changes:\n        cfg = load_config(cfg_path)\n    replies: list[Alert] = []\n    if not acts:\n        replies.append(Alert(f\"reply:{now_iso}\", \"reply\", \"🤖 I didn't get that\",\n                             compose(f\"\\\"{text}\\\"\" if text else \"Empty request.\", [REQUEST_HELP]), 0,\n                             color=COLORS[\"info\"]))\n    elif changes:\n        replies.append(Alert(f\"reply:{now_iso}\", \"reply\", \"🤖 Done\",\n                             compose(\" • \".join(changes), [f\"Your request: \\\"{text}\\\"\",\n                                                           f\"Understood by: {source}\"]), 0, color=COLORS[\"green\"]))\n    checks = [a[\"check\"].upper() for a in acts if isinstance(a.get(\"check\"), str)][:3]\n    if checks:\n        state = load_state()\n        holdings, _ = load_holdings()\n        broker, _ = sync_broker(SnapTrade.from_env(), cfg, json.loads(json.dumps(state)), now_iso)\n        holdings = merge_holdings(holdings, broker)\n        syms = sorted(set(cfg[\"universe\"]) | set(checks) | {MARKET})\n        allm = build_metrics(alp, syms, now_iso[:10], clock[\"is_open\"])\n        ranked = score_all([m for s, m in allm.items() if s in set(cfg[\"universe\"]) | set(checks)])\n        regime, _ = market_ok(allm.get(MARKET))\n        for sym in checks:\n            replies.append(check_alert(sym, allm, ranked, regime, cfg, state, now_iso, holdings))\n    for a in replies:\n        notifier.send(a)\n    log = knowledge.setdefault(\"requests\", [])\n    log.append({\"t\": now_iso[:16], \"text\": text, \"did\": changes + [f\"checked {c}\" for c in checks]\n                + ([\"scan\"] if any(a.get(\"scan\") for a in acts) else []) or [\"not understood\"]})\n    knowledge[\"requests\"] = log[-40:]\n    save_knowledge(knowledge)\n    if any(a.get(\"scan\") for a in acts):\n        args.force, args.dry_run = True, False\n        cmd_scan(cfg, args)\n\n\ndef cmd_backtest(cfg, args):\n    alp = Alpaca.from_env(cfg[\"data_feed\"])\n    symbols = sorted(set(cfg[\"universe\"]) | {MARKET})\n    start = date.today() - timedelta(days=int(365.25 * args.years) + 420)\n    print(f\"Downloading {len(symbols)} stocks, {args.years:g} years...\")\n    data = alp.daily_bars(symbols, start)\n    stats = run_backtest(cfg, data, args.max_days)\n    spy = data.get(MARKET, [])\n    print_backtest(stats, spy[MIN_HISTORY][\"t\"][:10] if len(spy) > MIN_HISTORY else \"?\",\n                   spy[-1][\"t\"][:10] if spy else \"?\", args.max_days)\n\n\ndef main(argv=None):\n    p = argparse.ArgumentParser(description=\"Stock Alerts scanner\")\n    p.add_argument(\"--config\", type=Path)\n    sub = p.add_subparsers(dest=\"cmd\", required=True)\n    s = sub.add_parser(\"scan\"); s.add_argument(\"--dry-run\", action=\"store_true\")\n    s.add_argument(\"--force\", action=\"store_true\", help=\"run even if the market is closed\")\n    r = sub.add_parser(\"report\"); r.add_argument(\"--top\", type=int, default=25)\n    t = sub.add_parser(\"test-alert\"); t.add_argument(\"--all\", action=\"store_true\")\n    a = sub.add_parser(\"ask\", help=\"do what a plain-English request says (text or BOT_REQUEST env)\")\n    a.add_argument(\"text\", nargs=\"?\", default=\"\")\n    b = sub.add_parser(\"backtest\"); b.add_argument(\"--years\", type=float, default=5)\n    b.add_argument(\"--max-days\", type=int, default=20)\n    args = p.parse_args(argv)\n    cfg = load_config(args.config)\n    try:\n        {\"scan\": cmd_scan, \"report\": cmd_report, \"test-alert\": cmd_test_alert,\n         \"backtest\": cmd_backtest, \"ask\": cmd_ask}[args.cmd](cfg, args)\n    except ApiError as e:\n        sys.exit(f\"Error: {e}\")\n\n\nif __name__ == \"__main__\":\n    main()\n", "test_scanner.py": "\"\"\"Offline tests. Run: python -m unittest test_scanner -v\"\"\"\nimport json\nimport math\nimport os\nimport random\nimport tempfile\nimport threading\nimport unittest\nfrom datetime import date, timedelta\nfrom http.server import BaseHTTPRequestHandler, HTTPServer\nfrom pathlib import Path\nfrom urllib.parse import parse_qs, urlparse\n\nimport scanner as S\n\n\ndef make_bars(closes, start=date(2023, 1, 2), wiggle=0.005, seed=1):\n    rng = random.Random(seed)\n    out, d, prev = [], start, closes[0]\n    for c in closes:\n        while d.weekday() >= 5:\n            d += timedelta(days=1)\n        o = prev\n        hi = max(o, c) * (1 + abs(rng.gauss(0, wiggle)))\n        lo = min(o, c) * (1 - abs(rng.gauss(0, wiggle)))\n        out.append({\"t\": f\"{d.isoformat()}T05:00:00Z\", \"o\": o, \"h\": hi, \"l\": lo, \"c\": c, \"v\": 1000})\n        prev, d = c, d + timedelta(days=1)\n    return out\n\n\ndef trend(n, start=100.0, daily=0.001, noise=0.0, seed=0):\n    rng = random.Random(seed)\n    p, out = start, []\n    for _ in range(n):\n        p *= math.exp(daily + rng.gauss(0, noise)); out.append(p)\n    return out\n\n\nCFG = S.load_config(Path(S.__file__).parent / \"config.json\")\n\n\nclass Indicators(unittest.TestCase):\n    def test_sma(self):\n        self.assertEqual(S.sma_series([1, 2, 3, 4], 2), [None, 1.5, 2.5, 3.5])\n\n    def test_rsi_extremes(self):\n        self.assertEqual(S.rsi_series(list(range(1, 40)))[-1], 100.0)\n        self.assertLess(S.rsi_series(list(range(40, 1, -1)))[-1], 1.0)\n\n    def test_rsi_known_value(self):\n        # Classic Wilder example closes (first RSI ~70.53)\n        c = [44.34, 44.09, 44.15, 43.61, 44.33, 44.83, 45.10, 45.42, 45.84, 46.08, 45.89,\n             46.03, 45.61, 46.28, 46.28]\n        self.assertAlmostEqual(S.rsi_series(c)[14], 70.53, delta=0.1)\n\n    def test_atr_and_rolling_max(self):\n        h, l, c = [10] * 20, [9] * 20, [9.5] * 20\n        self.assertAlmostEqual(S.atr_series(h, l, c)[-1], 1.0)\n        self.assertEqual(S.rolling_max([1, 5, 2, 3, 1, 0], 3), [1, 5, 5, 5, 3, 3])\n\n    def test_pct_ranks(self):\n        self.assertEqual(S.pct_ranks([10, 30, 20]), [0.0, 100.0, 50.0])\n        self.assertEqual(S.pct_ranks([1, 1]), [50.0, 50.0])\n\n\nclass MetricsAndScoring(unittest.TestCase):\n    def test_needs_a_year(self):\n        s = S.Series.from_bars(make_bars(trend(200)))\n        self.assertIsNone(S.metrics_at(\"X\", s, len(s) - 1))\n\n    def test_momentum_math(self):\n        s = S.Series.from_bars(make_bars(trend(300, daily=0.001)))\n        m = S.metrics_at(\"X\", s, len(s) - 1)\n        self.assertAlmostEqual(m.ret_12_1, (math.exp(0.001 * 231) - 1) * 100, places=4)\n        self.assertGreater(m.sma50, m.sma200)\n\n    def test_live_price_override(self):\n        s = S.Series.from_bars(make_bars(trend(300)))\n        m = S.metrics_at(\"X\", s, len(s) - 1, price=999.0)\n        self.assertEqual(m.price, 999.0)\n        self.assertEqual(m.prev_close, s.c[-1])\n        self.assertEqual(m.high_52w, 999.0)\n\n    def test_ranking_prefers_stronger(self):\n        ms = []\n        for sym, d in ((\"FAST\", 0.002), (\"MID\", 0.001), (\"SLOW\", -0.0005)):\n            s = S.Series.from_bars(make_bars(trend(300, daily=d)))\n            ms.append(S.metrics_at(sym, s, len(s) - 1))\n        ranked = S.score_all(ms)\n        self.assertEqual([m.symbol for m in ranked], [\"FAST\", \"MID\", \"SLOW\"])\n        self.assertEqual(ranked[0].rank, 1)\n        self.assertEqual(ranked[0].of, 3)\n\n\ndef mk(**kw):\n    base = dict(symbol=\"X\", price=105, prev_close=104, sma20=102, sma50=100, sma200=90,\n                sma200_prev=88, rsi=60, atr_pct=1.5, ret_12_1=40, ret_6_1=20, high_52w=108,\n                score=90, rank=1, of=70)\n    base.update(kw)\n    return S.Metrics(**base)\n\n\nclass BuyRules(unittest.TestCase):\n    def test_clean_setup_passes(self):\n        ok, fails = S.buy_check(mk(), CFG, True)\n        self.assertTrue(ok, fails)\n\n    def test_each_filter(self):\n        cases = {\n            \"market\": (mk(), False),\n            \"rank\": (mk(rank=40), True),\n            \"uptrend\": (mk(sma50=110), True),\n            \"200-day\": (mk(sma200_prev=95), True),\n            \"52w\": (mk(high_52w=130), True),\n            \"RSI\": (mk(rsi=80), True),\n            \"below 20\": (mk(sma20=106), True),\n            \"extended\": (mk(sma20=95), True),\n            \"jumpy\": (mk(atr_pct=4.0), True),\n            \"red\": (mk(prev_close=106), True),\n        }\n        for name, (m, regime) in cases.items():\n            ok, fails = S.buy_check(m, CFG, regime)\n            self.assertFalse(ok, name)\n            self.assertEqual(len(fails), 1, f\"{name}: {fails}\")\n\n    def test_buy_alert_text(self):\n        a = S.buy_alert(mk(atr_pct=2.6), CFG)\n        self.assertIn(\"🛒 BUY: X\", a.title)\n        self.assertIn(\"HIGHER risk\", a.title)\n        self.assertIn(\"$102.90\", a.message)   # stop\n        self.assertIn(\"$107.10\", a.message)   # +2%\n        self.assertIn(\"stop out on noise\", a.message)\n        self.assertIn(\"X 105.00\", a.message)\n        self.assertLessEqual(len(a.message), 1024)\n\n    def test_market_regime(self):\n        self.assertTrue(S.market_ok(mk(price=110, sma200=100))[0])\n        self.assertFalse(S.market_ok(mk(price=95, sma200=100))[0])\n        self.assertFalse(S.market_ok(None)[0])\n\n\nclass HoldAdvice(unittest.TestCase):\n    def test_strong(self):\n        v, pts, _ = S.hold_advice(mk(), True)\n        self.assertTrue(v.startswith(\"HOLD: strong\"), (v, pts))\n\n    def test_breaking(self):\n        v, _, why = S.hold_advice(mk(price=95, sma20=100, sma50=99, sma200=101, rsi=35, rank=60), False)\n        self.assertTrue(v.startswith(\"SELL\"), v)\n        self.assertTrue(any(\"50-day\" in w for w in why))\n\n    def test_overbought_lowers_score(self):\n        _, a, _ = S.hold_advice(mk(rsi=60), True)\n        _, b, _ = S.hold_advice(mk(rsi=85), True)\n        self.assertLess(b, a)\n\n\nclass YourSellRules(unittest.TestCase):\n    \"\"\"Walks a price path through your rules and checks exactly which alerts fire.\"\"\"\n    def walk(self, prices, entry=100.0, days=None):\n        h = S.Holding(\"NVDA\", entry, \"2026-11-18\", 0.5)\n        hstate, sent, fired = {}, set(), []\n        for k, p in enumerate(prices):\n            if days and k in days:\n                sent = set()  # new trading day\n            for a in S.holding_alerts(h, mk(symbol=\"NVDA\", price=p), True, CFG, hstate, sent):\n                fired.append((p, a.kind, a.priority))\n                sent.add(a.key)\n        return fired\n\n    def test_stop_at_minus_2(self):\n        f = self.walk([100, 99.0, 98.4, 97.9, 97.5, 97.0])\n        kinds = [k for _, k, _ in f]\n        self.assertEqual(kinds, [\"near\", \"stop\"])\n        self.assertEqual(f[-1][2], 2)        # emergency priority\n        self.assertEqual(f[-1][0], 97.9)     # fired the first time it crossed -2%\n\n    def test_not_sold_between_0_and_minus_2(self):\n        f = self.walk([100, 99.5, 99.0, 98.6, 99.2, 100.1])\n        self.assertNotIn(\"stop\", [k for _, k, _ in f])\n\n    def test_profit_offer_and_steps(self):\n        f = self.walk([100, 101, 102.1, 102.5, 103, 104.2, 103, 106.5])\n        self.assertEqual([(p, k) for p, k, _ in f if k == \"profit\"],\n                         [(102.1, \"profit\"), (104.2, \"profit\"), (106.5, \"profit\")])\n\n    def test_warning_when_gain_fades(self):\n        f = self.walk([100, 101, 102.5, 101.5, 100.4, 100.2, 101.8, 100.3])\n        warns = [p for p, k, _ in f if k == \"warn\"]\n        self.assertEqual(warns, [100.4, 100.3])   # fires once, re-arms after +1.5%, fires again\n\n    def test_no_warning_if_never_up(self):\n        f = self.walk([100, 100.3, 100.1, 100.4])\n        self.assertEqual(f, [])\n\n    def test_stop_once_per_day_then_again_next_day(self):\n        f = self.walk([97.5, 97.0, 96.0, 97.2], days={2})\n        self.assertEqual([k for _, k, _ in f], [\"stop\", \"stop\"])\n\n    def test_fast_drop_from_profit_sends_one_alert(self):\n        f = self.walk([100, 102.5, 98.3])\n        self.assertEqual([k for _, k, _ in f], [\"profit\", \"near\"])\n\n    def test_messages_fit_pushover(self):\n        h = S.Holding(\"NVDA\", 100.0, \"\", 0.5)\n        for p in (97, 98.3, 103):\n            for a in S.holding_alerts(h, mk(price=p), True, CFG, {\"warn_armed\": True}, set()):\n                self.assertLessEqual(len(a.message), 1024)\n                self.assertLessEqual(len(a.title), 250)\n\n\nclass HoldingsFile(unittest.TestCase):\n    def test_formats(self):\n        hs, errs = S.parse_holdings(\"# x\\nnvda 182.5\\nAMD $1,155.60 2026-11-18 0.19\\n\\nBRK.B 500 # note\\n\")\n        self.assertEqual([(h.symbol, h.buy_price, h.bought, h.shares) for h in hs],\n                         [(\"NVDA\", 182.5, \"\", None), (\"AMD\", 1155.6, \"2026-11-18\", 0.19),\n                          (\"BRK.B\", 500.0, \"\", None)])\n        self.assertEqual(errs, [])\n\n    def test_errors_are_friendly(self):\n        hs, errs = S.parse_holdings(\"NVDA\\nAMD abc\\n123 5\\nTSLA -4\")\n        self.assertEqual(hs, [])\n        self.assertEqual(len(errs), 4)\n        self.assertIn(\"SYMBOL PRICE\", errs[0])\n        self.assertIn(\"isn't a number\", errs[1])\n\n    def test_shipped_template_is_empty(self):\n        hs, errs = S.load_holdings(Path(S.__file__).parent / \"holdings.txt\")\n        self.assertEqual((hs, errs), ([], []))\n\n\nclass Pushover(unittest.TestCase):\n    def test_payload(self):\n        p = S.Pushover(\"tok\", \"usr\", CFG)\n        f = p.payload(S.Alert(\"k\", \"stop\", \"T\", \"M\" * 2000, 2, \"X\", \"siren\", \"http://u\", \"chart\"))\n        self.assertEqual(f[\"priority\"], \"2\")\n        self.assertEqual(f[\"retry\"], \"60\")\n        self.assertEqual(f[\"expire\"], \"900\")\n        self.assertLessEqual(len(f[\"message\"]), 1024)\n        self.assertEqual(f[\"html\"], \"1\")\n        f1 = p.payload(S.Alert(\"k\", \"buy\", \"T\", \"M\", 1))\n        self.assertNotIn(\"retry\", f1)\n\n\nclass Backtest(unittest.TestCase):\n    def test_exit_simulation(self):\n        s = S.Series.from_bars([\n            {\"t\": \"2026-01-01T\", \"o\": 100, \"h\": 101, \"l\": 99, \"c\": 100},\n            {\"t\": \"2026-01-02T\", \"o\": 100, \"h\": 102.5, \"l\": 99.5, \"c\": 102},\n            {\"t\": \"2026-01-03T\", \"o\": 95, \"h\": 96, \"l\": 94, \"c\": 95},\n        ])\n        self.assertEqual(S.simulate_exit(s, 0, 100, 2, 2, 10, 0), (2.0, 2))          # target day 2\n        r, n = S.simulate_exit(s, 0, 100, 2, 5, 10, 0)                                  # gap below stop\n        self.assertAlmostEqual(r, -5.0); self.assertEqual(n, 3)\n        both = S.Series.from_bars([{\"t\": \"x\", \"o\": 100, \"h\": 103, \"l\": 97, \"c\": 100}])\n        self.assertEqual(S.simulate_exit(both, 0, 100, 2, 2, 10, 0), (-2.0, 1))      # stop first\n        self.assertEqual(S.simulate_exit(both, 0, 100, 2, 2, 10, 0.1), (-2.1, 1))    # costs\n\n    def test_runs_on_synthetic_market(self):\n        data = {\"SPY\": make_bars(trend(700, daily=0.0005, noise=0.008, seed=9))}\n        for k in range(12):\n            data[f\"S{k}\"] = make_bars(trend(700, daily=0.0002 * k, noise=0.012, seed=k), seed=k)\n        cfg = dict(CFG, universe=list(data))\n        stats = S.run_backtest(cfg, data)\n        self.assertEqual(len(stats), 3)\n        self.assertGreater(len(stats[2].trades), 0)\n        for st in stats:\n            for r in st.trades:\n                self.assertTrue(-60 < r < 60)\n\n\n# ---------------------------------------------------------------------------\n# End to end against fake Alpaca + fake Pushover servers\n# ---------------------------------------------------------------------------\n\nclass Fake(BaseHTTPRequestHandler):\n    world = {}\n    pushes = []\n    calls = []\n\n    def log_message(self, *a):\n        pass\n\n    def reply(self, obj, code=200):\n        b = json.dumps(obj).encode()\n        self.send_response(code); self.send_header(\"Content-Type\", \"application/json\")\n        self.end_headers(); self.wfile.write(b)\n\n    def do_GET(self):\n        u = urlparse(self.path); q = {k: v[0] for k, v in parse_qs(u.query).items()}\n        if u.path.startswith(\"/v2/\") and self.headers.get(\"APCA-API-KEY-ID\") != \"K\":\n            return self.reply({\"message\": \"forbidden\"}, 403)\n        if u.path == \"/v2/clock\":\n            return self.reply(self.world[\"clock\"])\n        syms = q.get(\"symbols\", \"\").split(\",\")\n        if u.path == \"/v2/stocks/bars\":\n            # two pages to exercise pagination\n            bars = {s: self.world[\"bars\"][s] for s in syms if s in self.world[\"bars\"]}\n            if \"page_token\" not in q:\n                first = {s: b[:200] for s, b in bars.items()}\n                return self.reply({\"bars\": first, \"next_page_token\": \"p2\"})\n            return self.reply({\"bars\": {s: b[200:] for s, b in bars.items()}, \"next_page_token\": None})\n        if u.path in (\"/rss/search\", \"/rss/2.0/headline\"):\n            key = \"gnews\" if u.path == \"/rss/search\" else \"yahoo\"\n            Fake.calls.append(key)\n            body = self.world.get(key, \"<rss><channel><\/channel><\/rss>\").encode()\n            self.send_response(200); self.send_header(\"Content-Type\", \"application/rss+xml\")\n            self.end_headers(); self.wfile.write(body); return\n        if u.path == \"/query\":\n            Fake.calls.append(\"av:\" + q.get(\"function\", \"\"))\n            r = self.world.get(\"av\", {}).get(q.get(\"function\"), {\"Information\": \"premium endpoint\"})\n            if isinstance(r, str):\n                self.send_response(200); self.end_headers(); self.wfile.write(r.encode()); return\n            return self.reply(r)\n        if u.path.startswith(\"/public/topic/\"):\n            Fake.calls.append(\"lunar\")\n            r = self.world.get(\"lunar\")\n            return self.reply(r) if r is not None else self.reply({\"error\": \"limit\"}, 429)\n        if u.path == \"/financial-metrics/snapshot\":\n            Fake.calls.append(\"fd\")\n            r = self.world.get(\"fd\")\n            return self.reply(r) if r is not None else self.reply({\"error\": \"Payment Required\"}, 402)\n        if u.path == \"/v1beta1/news\":\n            if \"news\" not in self.world:\n                return self.reply({\"message\": \"not found\"}, 404)\n            return self.reply({\"news\": self.world[\"news\"], \"next_page_token\": None})\n        if u.path == \"/v2/stocks/snapshots\":\n            return self.reply({s: {\"latestTrade\": {\"p\": self.world[\"live\"][s]}}\n                               for s in syms if s in self.world[\"live\"]})\n        self.reply({\"message\": \"nope\"}, 404)\n\n    claude_calls = []\n\n    def do_POST(self):\n        n = int(self.headers.get(\"Content-Length\") or 0)\n        raw = self.rfile.read(n).decode()\n        if self.path.startswith(\"/v1/messages\"):\n            body = json.loads(raw)\n            Fake.claude_calls.append(body)\n            reply = self.world.get(\"claude_reply\")\n            if callable(reply):\n                reply = reply(body)\n            if reply is None:\n                return self.reply({\"error\": \"overloaded\"}, 529)\n            return self.reply({\"content\": [{\"type\": \"text\", \"text\": reply}]})\n        form = {k: v[0] for k, v in parse_qs(raw).items()}\n        Fake.pushes.append(form)\n        self.reply({\"status\": 1, \"request\": \"abc\"})\n\n\nclass EndToEnd(unittest.TestCase):\n    @classmethod\n    def setUpClass(cls):\n        cls.srv = HTTPServer((\"127.0.0.1\", 0), Fake)\n        threading.Thread(target=cls.srv.serve_forever, daemon=True).start()\n        base = f\"http://127.0.0.1:{cls.srv.server_address[1]}\"\n        cls._orig = (S.TRADING_URL, S.DATA_URL, S.PUSHOVER_URL, S.CLAUDE_URL, S.AV_URL, S.LUNAR_URL,\n                     S.FD_URL, S.GNEWS_URL, S.YAHOO_RSS_URL)\n        S.TRADING_URL = S.DATA_URL = S.LUNAR_URL = S.FD_URL = base\n        S.PUSHOVER_URL = base + \"/1/messages.json\"\n        S.CLAUDE_URL = base + \"/v1/messages\"\n        S.AV_URL = base + \"/query\"\n        S.GNEWS_URL = base + \"/rss/search\"\n        S.YAHOO_RSS_URL = base + \"/rss/2.0/headline\"\n\n    @classmethod\n    def tearDownClass(cls):\n        (S.TRADING_URL, S.DATA_URL, S.PUSHOVER_URL, S.CLAUDE_URL, S.AV_URL, S.LUNAR_URL,\n         S.FD_URL, S.GNEWS_URL, S.YAHOO_RSS_URL) = cls._orig\n        cls.srv.shutdown()\n\n    def setUp(self):\n        Fake.pushes, Fake.claude_calls, Fake.calls = [], [], []\n        for k in (\"ANTHROPIC_API_KEY\", \"ALPHAVANTAGE_API_KEY\", \"LUNARCRUSH_API_KEY\", \"FINANCIAL_DATASETS_API_KEY\"):\n            os.environ.pop(k, None)\n        closes = {\"SPY\": trend(320, daily=0.0006)}\n        # A clean leader: steady uptrend, small pullback near the end, green today\n        lead = trend(300, daily=0.0025) + trend(20, start=1, daily=-0.0005)\n        lead = lead[:300] + [lead[299] * x for x in lead[300:]]\n        closes[\"LEAD\"] = lead\n        for k in range(10):\n            closes[f\"S{k}\"] = trend(320, daily=-0.0003 + 0.0001 * k, noise=0.01, seed=k)\n        closes[\"HELD\"] = trend(320, daily=0.001)\n        bars = {s: make_bars(c, wiggle=0.002) for s, c in closes.items()}\n        today = \"2030-01-15\"\n        live = {s: c[-1] for s, c in closes.items()}\n        live[\"LEAD\"] = closes[\"LEAD\"][-1] * 1.012      # bounces back above its 20-day today\n        live[\"HELD\"] = 100 * 0.979                     # holding is down 2.1% -> SELL NOW\n        Fake.world = {\n            \"clock\": {\"timestamp\": f\"{today}T14:40:00.123456789-05:00\", \"is_open\": True,\n                      \"next_open\": \"2030-01-16T09:30:00-05:00\", \"next_close\": f\"{today}T16:00:00-05:00\"},\n            \"bars\": bars, \"live\": live,\n        }\n        self.cfg = dict(CFG, universe=[\"SPY\", \"LEAD\"] + [f\"S{k}\" for k in range(10)], top_n=3,\n                        max_atr_pct=10)\n\n    def scan(self, state, holdings):\n        alp = S.Alpaca(\"K\", \"SECRET\")\n        po = S.Pushover(\"tok\", \"usr\", self.cfg)\n        return S.run_scan(self.cfg, alp, po, holdings, state)\n\n    def test_full_scan(self):\n        state = {}\n        holdings = [S.Holding(\"HELD\", 100.0, \"2030-01-10\", 1)]\n        alerts = self.scan(state, holdings)\n        kinds = sorted(a.kind for a in alerts)\n        self.assertIn(\"stop\", kinds)\n        self.assertIn(\"buy\", kinds)\n        stop = next(p for p in Fake.pushes if \"SELL NOW\" in p[\"title\"])\n        self.assertEqual(stop[\"priority\"], \"2\")\n        self.assertEqual(stop[\"retry\"], \"60\")\n        buy = next(p for p in Fake.pushes if \"🛒 BUY\" in p[\"title\"])\n        self.assertIn(\"LEAD\", buy[\"title\"])\n        self.assertEqual(state[\"day\"], \"2030-01-15\")\n\n        # Second run same day: no repeats\n        Fake.pushes = []\n        self.assertEqual(self.scan(state, holdings), [])\n        self.assertEqual(Fake.pushes, [])\n\n    def test_summary_near_close(self):\n        Fake.world[\"clock\"][\"timestamp\"] = \"2030-01-15T15:45:00-05:00\"\n        alerts = self.scan({}, [])\n        self.assertIn(\"summary\", [a.kind for a in alerts])\n\n    def test_market_closed_does_nothing(self):\n        Fake.world[\"clock\"][\"is_open\"] = False\n        self.assertEqual(self.scan({}, []), [])\n        self.assertEqual(Fake.pushes, [])\n\n    def test_scan_now_after_close(self):\n        if type(self) is not EndToEnd:\n            self.skipTest(\"base scenario only\")\n        Fake.world[\"clock\"][\"is_open\"] = False\n        alp = S.Alpaca(\"K\", \"SECRET\")\n        po = S.Pushover(\"tok\", \"usr\", self.cfg)\n        alerts = S.run_scan(self.cfg, alp, po, [], {}, force=True)\n        titles = [a.title for a in alerts]\n        self.assertTrue(any(t.startswith(\"🛒 BUY AT NEXT OPEN: LEAD\") for t in titles), titles)\n        done = next(a for a in alerts if a.title.startswith(\"📡 Scan done\"))\n        self.assertIn(\"market closed\", done.title)\n        self.assertTrue(done.message.startswith(\"1 buy setup(s) found.\"))\n        buy = next(p for p in Fake.pushes if \"BUY AT NEXT OPEN\" in p[\"title\"])\n        self.assertEqual(buy[\"attachment_type\"], \"image/png\")   # real-price chart attached\n\n    def test_paused_scan(self):\n        if type(self) is not EndToEnd:\n            self.skipTest(\"base scenario only\")\n        self.cfg[\"paused\"] = True\n        alerts = self.scan({}, [S.Holding(\"HELD\", 100.0, \"2030-01-10\", 1)])\n        self.assertEqual([a.kind for a in alerts], [\"stop\"])\n\n    def test_weak_market_blocks_buys(self):\n        spy = trend(300, daily=0.0005) + trend(20, start=1, daily=-0.012)\n        spy = spy[:300] + [spy[299] * x for x in spy[300:]]\n        Fake.world[\"bars\"][\"SPY\"] = make_bars(spy)\n        Fake.world[\"live\"][\"SPY\"] = spy[-1]\n        alerts = self.scan({}, [])\n        self.assertNotIn(\"buy\", [a.kind for a in alerts])\n\n    def test_sold_holding_memory_is_cleared(self):\n        state = {\"holdings\": {\"OLD|1|\": {\"profit_level\": 2}}}\n        self.scan(state, [])\n        self.assertNotIn(\"OLD|1|\", state[\"holdings\"])\n\n    def test_todays_partial_bar_is_dropped(self):\n        b = Fake.world[\"bars\"][\"LEAD\"]\n        b.append(dict(b[-1], t=\"2030-01-15T05:00:00Z\", c=1.0))   # bogus partial bar for today\n        alerts = self.scan({}, [])\n        self.assertIn(\"LEAD\", [a.symbol for a in alerts if a.kind == \"buy\"])\n\n\nclass Workflow(unittest.TestCase):\n    def test_workflow_file(self):\n        y = (Path(S.__file__).parent / \".github/workflows/scan.yml\").read_text()\n        self.assertIn('cron: \"7,22,37,52 13-21 * * 1-5\"', y)\n        self.assertIn(\"contents: write\", y)\n        for sec in (\"APCA_API_KEY_ID\", \"APCA_API_SECRET_KEY\", \"PUSHOVER_TOKEN\", \"PUSHOVER_USER\"):\n            self.assertIn(f\"secrets.{sec}\", y)\n        self.assertNotIn(\"${{ inputs.command }}\\n\", y.split(\"run: |\")[1])  # no inline injection\n\n\n# ---------------------------------------------------------------------------\n# News, sizing, colors, hold time\n# ---------------------------------------------------------------------------\n\nclass NewsRules(unittest.TestCase):\n    def r(self, h, summ=\"\"):\n        return S.rate_headline(h, summ)\n\n    def test_ceo_scandal_is_large_negative(self):\n        d, st, conf, cat = self.r(\"Nvidia CEO Jensen Huang resigns after reports of affair with alleged spy\")\n        self.assertEqual((d, st), (-1, 3))\n        self.assertIn(\"leadership exit\", cat)\n        self.assertIn(\"scandal\", cat)\n\n    def test_beat_and_raise_is_positive(self):\n        d, st, conf, _ = self.r(\"Nvidia beats estimates, raises guidance on AI demand\")\n        self.assertEqual((d, st), (1, 3))\n        self.assertAlmostEqual(conf, 0.7)\n\n    def test_beat_but_cut_guidance_is_mixed(self):\n        d, st, conf, cat = self.r(\"Retailer beats estimates but cuts guidance for holiday quarter\")\n        self.assertEqual(d, 0)\n        self.assertTrue(cat.startswith(\"mixed\"))\n\n    def test_rumors_and_opinion_get_low_confidence(self):\n        self.assertAlmostEqual(self.r(\"Apple reportedly in talks for takeover bid of studio\")[2], 0.4)\n        self.assertAlmostEqual(self.r(\"Why is Tesla stock down after the downgrade?\")[2], 0.25)\n\n    def test_macro_and_misc(self):\n        self.assertEqual(self.r(\"Fed cuts rates by a quarter point\")[0], 1)\n        self.assertEqual(self.r(\"Inflation heats up again in October CPI\")[0], -1)\n        self.assertEqual(self.r(\"FDA approves Lilly's new drug\")[:2], (1, 3))\n        self.assertEqual(self.r(\"Analyst downgrades Apple to neutral\")[:2], (-1, 1))\n        self.assertIsNone(self.r(\"Company to present at investor conference\"))\n\n    def test_word_boundaries(self):\n        self.assertIsNone(self.r(\"Spyglass Partners hosts webinar\"))   # 'spy' only as a whole word\n        self.assertIsNone(self.r(\"Quarterly webinar scheduled\"))\n\n\nclass NewsMemory(unittest.TestCase):\n    def test_decay(self):\n        state = {\"news\": {\"events\": {\"X\": [[\"2030-01-15T10:00:00Z\", -2.0, \"scandal\", \"h\"]]}}}\n        now = S.news_view(state, \"X\", \"2030-01-15T10:00:00Z\")\n        day = S.news_view(state, \"X\", \"2030-01-16T10:00:00Z\")\n        self.assertAlmostEqual(now.score, -2.0)\n        self.assertAlmostEqual(day.score, -1.0)\n        self.assertEqual(day.label, \"scandal\")\n        self.assertEqual(S.news_view(state, \"Y\", \"2030-01-15T10:00:00Z\").score, 0.0)\n\n\nclass Sizing(unittest.TestCase):\n    def test_small_account(self):\n        d, sh = S.position_size(100.0, CFG)            # $30 acct, 1% risk / 2% stop = $15, cap 50% = $15\n        self.assertEqual(d, 15.0)\n        self.assertAlmostEqual(sh, 0.15)\n\n    def test_cap_wins(self):\n        d, _ = S.position_size(50.0, dict(CFG, account_size=1000, risk_per_trade_pct=2))   # by risk $1000 -> cap $500\n        self.assertEqual(d, 500.0)\n\n    def test_risk_labels_and_level_filter(self):\n        self.assertEqual([S.risk_label(x) for x in (1.0, 2.0, 3.0)], [\"LOW\", \"MODERATE\", \"HIGHER\"])\n        ok, fails = S.buy_check(mk(atr_pct=2.0), dict(CFG, risk_level=\"low\"), True)\n        self.assertFalse(ok)\n        self.assertIn(\"low risk\", fails[0])\n        self.assertTrue(S.buy_check(mk(atr_pct=2.0), CFG, True)[0])\n\n    def test_buy_alert_first_line_is_simple(self):\n        a = S.buy_alert(mk(), CFG, S.NewsView(1.2, \"analyst upgrade\", \"Firm upgrades X\"))\n        first = a.message.split(\"\\n\")[0]\n        self.assertIn(\"Buy about $15.00\", first)\n        self.assertIn(\"hold:\", first)\n        self.assertIn(\"WHY\", a.message)\n        self.assertIn(\"analyst upgrade\", a.message)\n        self.assertIn(\"-$0.30\", a.message)        # loss at the -2% stop on $15\n        self.assertIn(\"+$0.30\", a.message)        # +2% on $15\n\n\nclass NewsInDecisions(unittest.TestCase):\n    def test_bad_news_blocks_buy(self):\n        ok, fails = S.buy_check(mk(), CFG, True, S.NewsView(-1.5, \"scandal\", \"h\"))\n        self.assertFalse(ok)\n        self.assertIn(\"bad news\", fails[0])\n\n    def test_bad_news_turns_hold_into_sell(self):\n        base = S.hold_advice(mk(rank=30), True)[1]\n        v, pts, why = S.hold_advice(mk(rank=30), True, S.NewsView(-2.0, \"leadership exit\", \"h\"))\n        self.assertEqual(pts, base - 2)\n        self.assertTrue(why[0].startswith(\"✗ bad news\"))\n\n\nclass ProfitColors(unittest.TestCase):\n    def walk(self, prices):\n        h = S.Holding(\"AMD\", 100.0, \"\", 1)\n        st, out = {}, []\n        for p in prices:\n            out += [a for a in S.holding_alerts(h, mk(symbol=\"AMD\", price=p), True, CFG, st, set())]\n        return out\n\n    def test_tiers(self):\n        al = self.walk([102.2, 108.5, 121.0])\n        self.assertEqual([a.kind for a in al], [\"profit\", \"profit8\", \"profit20\"])\n        self.assertTrue(al[0].title.startswith(\"🟡 SELL OFFER\"))\n        self.assertTrue(al[1].title.startswith(\"🔵 SOLID SELL\"))\n        self.assertTrue(al[2].title.startswith(\"🟢 BIG WIN\"))\n        self.assertEqual(al[1].color, S.COLORS[\"blue\"])\n        self.assertEqual(al[2].color, S.COLORS[\"green\"])\n        self.assertIn(\"+$8.50 on your 1 sh\", al[1].message.split(\"\\n\")[0])\n\n    def test_html(self):\n        a = S.Alert(\"k\", \"x\", \"T\", \"Up <5%> & more\\n\\nWHY\\nline <b>\", 1, color=\"#2563eb\")\n        h = S.to_html(a)\n        self.assertTrue(h.startswith('<font color=\"#2563eb\"><b>Up &lt;5%&gt; &amp; more<\/b><\/font>'))\n        self.assertIn(\"<b>WHY<\/b>\", h)\n        self.assertIn(\"line &lt;b&gt;\", h)\n\n\nclass HoldTime(unittest.TestCase):\n    def test_rules(self):\n        self.assertEqual(S.rule_horizon(mk(rsi=70), None, CFG)[\"horizon\"], \"SHORT-TERM\")\n        self.assertEqual(S.rule_horizon(mk(), S.NewsView(1.0, \"earnings beat\", \"h\"), CFG)[\"horizon\"], \"SHORT-TERM\")\n        self.assertEqual(S.rule_horizon(mk(price=103, sma20=101), None, CFG)[\"horizon\"], \"LONG-TERM\")\n        self.assertEqual(S.rule_horizon(mk(price=103, sma20=101, ret_12_1=10), None, CFG)[\"horizon\"], \"MEDIUM\")\n\n\nclass ClaudeFeatures(unittest.TestCase):\n    \"\"\"Claude rater + hold-time check against a fake API (no real calls).\"\"\"\n    @classmethod\n    def setUpClass(cls):\n        EndToEnd.setUpClass.__func__(cls)\n\n    @classmethod\n    def tearDownClass(cls):\n        EndToEnd.tearDownClass.__func__(cls)\n\n    def setUp(self):\n        Fake.claude_calls = []\n        os.environ[\"ANTHROPIC_API_KEY\"] = \"sk-test\"\n\n    def tearDown(self):\n        os.environ.pop(\"ANTHROPIC_API_KEY\", None)\n\n    def test_rater_parses_and_caps_confidence(self):\n        Fake.world = {\"claude_reply\": 'Here you go: [{\"id\":\"1\",\"symbol\":\"NVDA\",\"category\":\"leadership\",'\n                                      '\"direction\":-1,\"strength\":3,\"confidence\":0.99,\"why\":\"CEO out\"}]'}\n        r = S.rate_with_claude([{\"id\": \"1\", \"symbols\": [\"NVDA\"], \"headline\": \"h\", \"summary\": \"\"}], CFG)\n        self.assertEqual(r[(\"1\", \"NVDA\")][\"confidence\"], 0.85)\n        body = Fake.claude_calls[0]\n        self.assertEqual(body[\"model\"], \"claude-haiku-5-5\")\n        self.assertIn(\"never add outside facts\", body[\"system\"])\n\n    def test_rater_failure_falls_back(self):\n        Fake.world = {\"claude_reply\": None}\n        self.assertIsNone(S.rate_with_claude([{\"id\": \"1\", \"symbols\": [\"X\"], \"headline\": \"h\", \"summary\": \"\"}], CFG))\n        Fake.world = {\"claude_reply\": \"sorry, no json\"}\n        self.assertIsNone(S.rate_with_claude([{\"id\": \"1\", \"symbols\": [\"X\"], \"headline\": \"h\", \"summary\": \"\"}], CFG))\n\n    def test_no_key_no_call(self):\n        os.environ.pop(\"ANTHROPIC_API_KEY\")\n        self.assertIsNone(S.rate_with_claude([{\"id\": \"1\", \"symbols\": [\"X\"], \"headline\": \"h\", \"summary\": \"\"}], CFG))\n        self.assertIsNone(S.ai_horizon(mk(), None, CFG))\n        self.assertEqual(Fake.claude_calls, [])\n\n    def test_ai_horizon(self):\n        Fake.world = {\"claude_reply\": 'Forums are hyped. {\"horizon\":\"short-term\",\"hold_for\":\"about 1 week\",'\n                                      '\"why\":\"hype-driven pop\",\"forum_mood\":\"bullish\",\"risks\":\"fades fast\"}'}\n        hz = S.ai_horizon(mk(), None, CFG)\n        self.assertEqual(hz[\"horizon\"], \"SHORT-TERM\")\n        self.assertEqual(hz[\"forum_mood\"], \"bullish\")\n        body = Fake.claude_calls[0]\n        self.assertEqual(body[\"tools\"][0][\"type\"], CFG[\"web_search_tool\"])\n        self.assertEqual(body[\"tools\"][0][\"max_uses\"], 2)\n        a = S.buy_alert(mk(), CFG, None, hz)\n        self.assertIn(\"Short-term hold: about 1 week\", a.message.split(\"\\n\")[0])\n        self.assertIn(\"Forum mood: bullish\", a.message)\n\n    def test_ai_horizon_bad_answer(self):\n        Fake.world = {\"claude_reply\": '{\"horizon\":\"forever\"}'}\n        self.assertIsNone(S.ai_horizon(mk(), None, CFG))\n\n\ndef news_item(i, sym, headline, ts=\"2030-01-15T13:00:00Z\"):\n    return {\"id\": i, \"headline\": headline, \"summary\": \"\", \"symbols\": sym, \"created_at\": ts,\n            \"url\": f\"https://news.example/{i}\", \"source\": \"benzinga\"}\n\n\nclass NewsEndToEnd(EndToEnd):\n    # These two parent tests assume no news; they're covered by EndToEnd itself.\n    test_full_scan = None\n    test_market_closed_does_nothing = None\n\n    def setUp(self):\n        super().setUp()\n        Fake.world[\"news\"] = [\n            news_item(1, [\"HELD\"], \"HELD CEO resigns amid misconduct probe\"),\n            news_item(2, [\"LEAD\"], \"LEAD beats estimates and raises guidance\"),\n            news_item(3, [], \"Fed cuts rates by half a point in surprise move\"),\n            news_item(4, [\"ZZZZ\"], \"ZZZZ recalls widgets\"),                     # not a stock you track\n            news_item(5, [], \"Celebrity opens restaurant\"),                     # irrelevant\n            news_item(6, [\"S1\"], \"S1 announces share offering\"),\n        ]\n        Fake.world[\"live\"][\"HELD\"] = 100.5   # not at the stop, so the news alert stands out\n\n    def test_news_flow_open_market(self):\n        state = {}\n        holdings = [S.Holding(\"HELD\", 100.0, \"\", 2)]\n        alerts = self.scan(state, holdings)\n        kinds = [a.kind for a in alerts]\n        self.assertIn(\"news\", kinds)\n        self.assertIn(\"mnews\", kinds)\n        news = next(a for a in alerts if a.kind == \"news\")\n        self.assertEqual(news.symbol, \"HELD\")\n        self.assertIn(\"▼ bad\", news.title)\n        self.assertEqual(news.url, \"https://news.example/1\")\n        self.assertIn(\"Advice:\", news.message.split(\"\\n\")[0])\n        ev = state[\"news\"][\"events\"]\n        self.assertIn(\"HELD\", ev); self.assertIn(\"LEAD\", ev); self.assertIn(\"_MARKET\", ev); self.assertIn(\"S1\", ev)\n        self.assertNotIn(\"ZZZZ\", ev)\n        self.assertEqual(sorted(state[\"news\"][\"seen\"]), [\"1\", \"2\", \"3\", \"4\", \"5\", \"6\"])\n        buy = next(a for a in alerts if a.kind == \"buy\")\n        self.assertIn(\"earnings beat\", buy.message)             # good news shown on the buy\n        self.assertIn(\"Short-term\", buy.message.split(\"\\n\")[0])  # fresh catalyst -> short-term\n        # Same headlines next run: nothing new\n        Fake.pushes = []\n        self.assertEqual(self.scan(state, holdings), [])\n\n    def test_closed_market_sends_news_only(self):\n        Fake.world[\"clock\"][\"is_open\"] = False\n        alerts = self.scan({}, [S.Holding(\"HELD\", 100.0, \"\", 2)])\n        self.assertEqual(sorted(a.kind for a in alerts), [\"mnews\", \"news\"])\n        news = next(a for a in alerts if a.kind == \"news\")\n        self.assertIn(\"expect a move at the open\", news.message)\n\n    def test_bad_news_blocks_the_buy(self):\n        Fake.world[\"news\"] = [news_item(9, [\"LEAD\"], \"LEAD CEO ousted after fraud probe\")]\n        alerts = self.scan({}, [])\n        self.assertNotIn(\"LEAD\", [a.symbol for a in alerts if a.kind == \"buy\"])\n\n    def test_news_endpoint_down_is_harmless(self):\n        del Fake.world[\"news\"]\n        alerts = self.scan({}, [S.Holding(\"HELD\", 100.0, \"\", 2)])\n        self.assertIn(\"buy\", [a.kind for a in alerts])\n\n    def test_claude_rates_news_end_to_end(self):\n        os.environ[\"ANTHROPIC_API_KEY\"] = \"sk-test\"\n        def reply(body):\n            if \"tools\" in body:   # hold-time check\n                return '{\"horizon\":\"MEDIUM\",\"hold_for\":\"about 3 weeks\",\"why\":\"steady trend\",\"forum_mood\":\"mixed\"}'\n            items = json.loads(body[\"messages\"][0][\"content\"])\n            return json.dumps([{\"id\": it[\"id\"], \"symbol\": s, \"category\": \"other\", \"direction\": -1,\n                                \"strength\": 2, \"confidence\": 0.6, \"why\": \"test\"}\n                               for it in items for s in it[\"symbols\"]])\n        Fake.world[\"claude_reply\"] = reply\n        Fake.world[\"news\"] = [news_item(1, [\"HELD\"], \"HELD board meets with major shareholders\"),   # unclear\n                              news_item(2, [\"HELD\"], \"HELD CEO resigns amid misconduct probe\"),     # clear\n                              news_item(3, [\"S1\"], \"S1 holds investor day\")]                          # not owned\n        try:\n            alerts = self.scan({}, [S.Holding(\"HELD\", 100.0, \"\", 2)])\n        finally:\n            os.environ.pop(\"ANTHROPIC_API_KEY\", None)\n        rated = [c for c in Fake.claude_calls if \"tools\" not in c]\n        self.assertEqual(len(rated), 1)                                   # one call...\n        sent_items = json.loads(rated[0][\"messages\"][0][\"content\"])\n        self.assertEqual([i[\"id\"] for i in sent_items], [\"1\"])            # ...only for the unclear owned-stock headline\n        news = [a for a in alerts if a.kind == \"news\"]\n        self.assertTrue(any(\"rated by Claude\" in a.message for a in news))\n\n    def test_messages_fit(self):\n        alerts = self.scan({}, [S.Holding(\"HELD\", 100.0, \"\", 2)])\n        po = S.Pushover(\"t\", \"u\", self.cfg)\n        for a in alerts:\n            f = po.payload(a)\n            self.assertLessEqual(len(f[\"message\"]), 1024, a.title)\n            self.assertNotIn(\"WHY\", f[\"message\"].split(\"\\n\")[0])\n\n\nclass NewsCursor(NewsEndToEnd):\n    test_news_flow_open_market = test_closed_market_sends_news_only = None\n    test_bad_news_blocks_the_buy = test_news_endpoint_down_is_harmless = None\n    test_claude_rates_news_end_to_end = test_messages_fit = None\n\n    def test_cursor_moves_even_when_nothing_matters(self):\n        Fake.world[\"news\"] = [news_item(7, [\"ZZZZ\"], \"ZZZZ does a thing\", ts=\"2030-01-15T14:00:00Z\")]\n        state = {}\n        self.scan(state, [])\n        self.assertEqual(state[\"news\"][\"last\"], \"2030-01-15T14:00:00Z\")\n        self.assertEqual(state[\"news\"].get(\"events\", {}), {})\n\n    def test_old_events_are_pruned(self):\n        state = {\"news\": {\"events\": {\"X\": [[\"2029-12-01T00:00:00Z\", -2, \"old\", \"old\"]]}}}\n        Fake.world[\"news\"] = []\n        self.scan(state, [])\n        self.assertNotIn(\"X\", state[\"news\"][\"events\"])\n\n\n# ---------------------------------------------------------------------------\n# Research-first, budgets, memory, stats, ideas\n# ---------------------------------------------------------------------------\n\ndef gnews_xml(n, sites, word=\"beats estimates\"):\n    items = \"\".join(\n        f'<item><title>Story {i} {word} - Site{i % sites}<\/title><link>https://news.google.com/x{i}<\/link>'\n        f'<pubDate>Wed, 18 Nov 2026 10:00:00 GMT<\/pubDate><description>d<\/description>'\n        f'<source url=\"https://www.site{i % sites}.com\">Site{i % sites}<\/source><\/item>' for i in range(n))\n    return f\"<rss><channel>{items}<\/channel><\/rss>\"\n\n\ndef yahoo_xml(n, word=\"raises guidance\"):\n    items = \"\".join(f\"<item><title>Yahoo {i} {word}<\/title><link>https://finance.yahoo.com/n{i}<\/link>\"\n                    f\"<description>&lt;p&gt;x&lt;/p&gt;<\/description><\/item>\" for i in range(n))\n    return f\"<rss><channel>{items}<\/channel><\/rss>\"\n\n\nclass Research(unittest.TestCase):\n    @classmethod\n    def setUpClass(cls):\n        EndToEnd.setUpClass.__func__(cls)\n\n    @classmethod\n    def tearDownClass(cls):\n        EndToEnd.tearDownClass.__func__(cls)\n\n    def setUp(self):\n        Fake.calls = []\n        Fake.world = {}\n\n    def test_parse_and_count(self):\n        Fake.world = {\"gnews\": gnews_xml(12, 9), \"yahoo\": yahoo_xml(6)}\n        r = S.free_research(\"NVDA\", {}, CFG, \"2026-11-18T15:00:00Z\")\n        self.assertEqual(r.articles, 18)\n        self.assertEqual(r.sites, 10)                 # 9 Google sources + Yahoo\n        self.assertTrue(r.complete)\n        self.assertGreater(r.score, 0)\n        self.assertEqual(r.bad, 0)\n        self.assertFalse(r.top[0][1].endswith(\"Site0\"))   # \" - Source\" suffix stripped\n        self.assertEqual(r.sources, [\"Google News\", \"Yahoo Finance\"])\n\n    def test_too_few_sites_is_incomplete(self):\n        Fake.world = {\"gnews\": gnews_xml(20, 3)}\n        r = S.free_research(\"X\", {}, CFG, \"2026-11-18T15:00:00Z\")\n        self.assertFalse(r.complete)\n        self.assertTrue(S.research_uncertain(r))\n\n    def test_dedupe_and_failures(self):\n        Fake.world = {\"gnews\": gnews_xml(5, 5) + \"\", \"yahoo\": \"not xml at all\"}\n        r = S.free_research(\"X\", {\"news\": {\"events\": {\"X\": [[\"t\", -2, \"c\", \"Story 0 beats estimates\"]]}}},\n                            CFG, \"2026-11-18T15:00:00Z\")\n        self.assertEqual(r.articles, 5)               # Benzinga copy of story 0 is a duplicate\n        self.assertIn(\"Benzinga\", r.sources)\n\n    def test_cache(self):\n        Fake.world = {\"gnews\": gnews_xml(3, 3)}\n        k = {}\n        S.get_research(\"X\", {}, k, CFG, \"2026-11-18T15:00:00Z\")\n        S.get_research(\"X\", {}, k, CFG, \"2026-11-18T16:00:00Z\")\n        self.assertEqual(Fake.calls.count(\"gnews\"), 1)\n        S.get_research(\"X\", {}, k, CFG, \"2026-11-18T20:30:00Z\")   # past 4 hours\n        self.assertEqual(Fake.calls.count(\"gnews\"), 2)\n\n\nclass BudgetTests(unittest.TestCase):\n    @classmethod\n    def setUpClass(cls):\n        EndToEnd.setUpClass.__func__(cls)\n\n    @classmethod\n    def tearDownClass(cls):\n        EndToEnd.tearDownClass.__func__(cls)\n\n    def setUp(self):\n        Fake.calls = []\n        os.environ[\"ALPHAVANTAGE_API_KEY\"] = \"av\"\n        os.environ[\"LUNARCRUSH_API_KEY\"] = \"lc\"\n        os.environ[\"FINANCIAL_DATASETS_API_KEY\"] = \"fd\"\n\n    def tearDown(self):\n        for k in (\"ALPHAVANTAGE_API_KEY\", \"LUNARCRUSH_API_KEY\", \"FINANCIAL_DATASETS_API_KEY\"):\n            os.environ.pop(k, None)\n\n    def test_no_key_never_called(self):\n        os.environ.pop(\"LUNARCRUSH_API_KEY\")\n        b = S.Budgets({}, CFG, \"2026-11-18T10:00:00Z\")\n        self.assertIsNone(S.lunar_social(b, \"NVDA\"))\n        self.assertEqual(Fake.calls, [])\n\n    def test_limit_then_one_notice(self):\n        k = {}\n        b = S.Budgets(k, dict(CFG, budget_lunarcrush=2), \"2026-11-18T10:00:00Z\")\n        Fake.world = {\"lunar\": {\"data\": {\"types_sentiment\": {\"x\": 80, \"reddit\": 60}, \"num_posts\": 12,\n                                         \"interactions_24h\": 999, \"trend\": \"up\"}}}\n        self.assertEqual(S.lunar_social(b, \"NVDA\")[\"sentiment\"], 70)\n        S.lunar_social(b, \"NVDA\")\n        self.assertIsNone(S.lunar_social(b, \"NVDA\"))   # 3rd call blocked\n        self.assertIsNone(S.lunar_social(b, \"NVDA\"))\n        self.assertEqual(Fake.calls.count(\"lunar\"), 2)\n        self.assertEqual(len(b.notices), 1)\n        self.assertIn(\"LunarCrush credits used up\", b.notices[0].title)\n        # Same month, new run: still out, no second notice\n        b2 = S.Budgets(k, dict(CFG, budget_lunarcrush=2), \"2026-11-20T10:00:00Z\")\n        self.assertFalse(b2.can(\"lunarcrush\")); self.assertEqual(b2.notices, [])\n        # Next month: fresh\n        b3 = S.Budgets(k, dict(CFG, budget_lunarcrush=2), \"2026-12-01T10:00:00Z\")\n        self.assertTrue(b3.can(\"lunarcrush\"))\n\n    def test_provider_says_out(self):\n        b = S.Budgets({}, CFG, \"2026-11-18T10:00:00Z\")\n        Fake.world = {\"av\": {\"COMPANY_OVERVIEW\": {\"Information\": \"This is a premium endpoint...\"}}, \"fd\": None}\n        self.assertIsNone(S.alpha_vantage(b, {\"function\": \"COMPANY_OVERVIEW\", \"symbol\": \"X\"}))\n        self.assertFalse(b.can(\"alphavantage\"))\n        self.assertIsNone(S.fd_metrics(b, \"X\"))       # 402 Payment Required\n        self.assertFalse(b.can(\"financialdatasets\"))\n        self.assertEqual(sorted(n.title for n in b.notices),\n                         [\"⚠️ Alpha Vantage credits used up\", \"⚠️ Financial Datasets credits used up\"])\n\n    def test_earnings_calendar_once_a_day(self):\n        Fake.world = {\"av\": {\"EARNINGS_CALENDAR\": \"symbol,name,reportDate,fiscalDateEnding,estimate,currency\\n\"\n                                                  \"NVDA,NVIDIA,2026-11-20,2026-10-31,1.2,USD\\n\"}}\n        k = {}\n        b = S.Budgets(k, CFG, \"2026-11-18T10:00:00Z\")\n        self.assertEqual(S.earnings_soon(b, k, \"NVDA\", \"2026-11-18\"), \"2026-11-20\")\n        self.assertIsNone(S.earnings_soon(b, k, \"AAPL\", \"2026-11-18\"))\n        self.assertEqual(Fake.calls.count(\"av:EARNINGS_CALENDAR\"), 1)\n        self.assertEqual(S.trading_days_until(\"2026-11-18\", \"2026-11-20\"), 2)\n        self.assertEqual(S.trading_days_until(\"2026-11-20\", \"2026-11-23\"), 1)   # over a weekend\n\n    def test_fundamentals_cached(self):\n        Fake.world = {\"av\": {\"COMPANY_OVERVIEW\": {\"Name\": \"Acme\", \"PERatio\": \"30\", \"AnalystTargetPrice\": \"120\"},\n                             \"EARNINGS\": {\"quarterlyEarnings\": [{\"surprisePercentage\": \"5\"},\n                                                                {\"surprisePercentage\": \"-1\"}]}}}\n        k = {}\n        b = S.Budgets(k, CFG, \"2026-11-18T10:00:00Z\")\n        f = S.av_fundamentals(b, k, \"ACME\", \"2026-11-18\")\n        self.assertEqual((f[\"pe\"], f[\"target\"], f[\"beat_rate\"]), (30.0, 120.0, 0.5))\n        S.av_fundamentals(b, k, \"ACME\", \"2026-11-20\")\n        self.assertEqual(Fake.calls.count(\"av:COMPANY_OVERVIEW\"), 1)\n\n\nclass LongStats(unittest.TestCase):\n    def test_math(self):\n        closes = [100 * 1.10 ** (i / 252) for i in range(252 * 3)]\n        closes[300] = closes[299] * 0.9      # a crash day\n        dates = [(date(2020, 1, 1) + timedelta(days=int(i * 365 / 252))).isoformat() for i in range(len(closes))]\n        st = S.long_stats_from_closes(dates, closes)\n        self.assertAlmostEqual(st[\"cagr\"], 10.0, delta=0.3)\n        self.assertLess(st[\"max_drawdown\"], -9)\n        self.assertEqual(st[\"drops_4pct\"], 1)\n        self.assertIn(\"%/yr\", S.stats_line(st))\n        self.assertIsNone(S.long_stats_from_closes(dates[:100], closes[:100]))\n\n    def test_long_term_needs_steady_history(self):\n        m = mk(price=103, sma20=101)\n        self.assertEqual(S.rule_horizon(m, None, CFG, {\"cagr\": 15, \"max_drawdown\": -40})[\"horizon\"], \"LONG-TERM\")\n        self.assertEqual(S.rule_horizon(m, None, CFG, {\"cagr\": 2, \"max_drawdown\": -40})[\"horizon\"], \"MEDIUM\")\n\n\nclass TrackAndIdeas(unittest.TestCase):\n    def test_track(self):\n        k = {}\n        S.record_buy(k, \"A\", 100, \"2026-11-01\")\n        S.record_buy(k, \"B\", 100, \"2026-11-01\")\n        S.record_buy(k, \"C\", 100, \"2026-10-01\")\n        S.update_track(k, {\"A\": mk(price=102.5), \"B\": mk(price=97.5), \"C\": mk(price=100.5)}, CFG, \"2026-11-18\")\n        self.assertEqual([t[\"status\"] for t in k[\"track\"]], [\"win\", \"loss\", \"expired\"])\n        self.assertEqual(S.track_summary(k)[\"win_rate\"], 50)\n        self.assertIn(\"1 of 2\", S.track_line(k))\n\n    def test_trending_and_extra_watch(self):\n        k = {}\n        raw = [{\"symbols\": [\"NEWCO\"], \"headline\": \"NewCo beats estimates\", \"created_at\": \"2026-11-18T10:00:00Z\"},\n               {\"symbols\": [\"NEWCO\"], \"headline\": \"Analyst upgrades NewCo\", \"created_at\": \"2026-11-18T11:00:00Z\"},\n               {\"symbols\": [\"BADCO\"], \"headline\": \"BadCo misses estimates\", \"created_at\": \"2026-11-18T11:00:00Z\"},\n               {\"symbols\": [\"NVDA\"], \"headline\": \"Nvidia beats estimates\", \"created_at\": \"2026-11-18T11:00:00Z\"}]\n        S.note_trending(k, raw, {\"NVDA\"}, \"2026-11-18T12:00:00Z\")\n        ideas = S.trending_ideas(k)\n        self.assertEqual([i[\"symbol\"] for i in ideas], [\"NEWCO\"])\n        S.add_dynamic(k, [\"NEWCO\"], \"2026-11-18\", 5, 8)\n        self.assertEqual(S.dynamic_universe(k, \"2026-11-20\"), [\"NEWCO\"])\n        self.assertEqual(S.dynamic_universe(k, \"2026-11-24\"), [])\n        S.note_trending(k, [], set(), \"2026-11-21T12:00:00Z\")   # 48h later: forgotten\n        self.assertEqual(S.trending_ideas(k), [])\n\n\nclass FullFlow(EndToEnd):\n    \"\"\"The whole research-first flow, with fakes for every outside service.\"\"\"\n    test_full_scan = test_summary_near_close = test_market_closed_does_nothing = None\n    test_weak_market_blocks_buys = test_sold_holding_memory_is_cleared = test_todays_partial_bar_is_dropped = None\n\n    def test_clear_free_research_means_no_paid_calls(self):\n        os.environ.update(LUNARCRUSH_API_KEY=\"lc\", ANTHROPIC_API_KEY=\"sk\", FINANCIAL_DATASETS_API_KEY=\"fd\")\n        Fake.world.update(gnews=gnews_xml(14, 10), yahoo=yahoo_xml(4), lunar={\"data\": {}})\n        alerts = self.scan({}, [])\n        buy = next(a for a in alerts if a.kind == \"buy\")\n        self.assertIn(\"articles from\", buy.message)\n        self.assertNotIn(\"lunar\", Fake.calls)\n        self.assertEqual([c for c in Fake.claude_calls], [])\n\n    def test_unclear_free_research_asks_lunarcrush(self):\n        os.environ[\"LUNARCRUSH_API_KEY\"] = \"lc\"\n        Fake.world.update(gnews=gnews_xml(4, 2), lunar={\"data\": {\"types_sentiment\": {\"x\": 75}, \"num_posts\": 40}})\n        alerts = self.scan({}, [])\n        self.assertIn(\"lunar\", Fake.calls)\n        buy = next(a for a in alerts if a.kind == \"buy\")\n        self.assertIn(\"Social (LunarCrush): 75% positive\", buy.message)\n\n    def test_bad_social_blocks(self):\n        os.environ[\"LUNARCRUSH_API_KEY\"] = \"lc\"\n        Fake.world.update(lunar={\"data\": {\"types_sentiment\": {\"x\": 20}}})\n        self.assertNotIn(\"buy\", [a.kind for a in self.scan({}, [])])\n\n    def test_negative_web_news_blocks(self):\n        Fake.world.update(gnews=gnews_xml(15, 10, word=\"misses estimates and cuts guidance\"))\n        self.assertNotIn(\"buy\", [a.kind for a in self.scan({}, [])])\n\n    def test_earnings_blackout(self):\n        os.environ[\"ALPHAVANTAGE_API_KEY\"] = \"av\"\n        Fake.world.update(gnews=gnews_xml(15, 10), av={\"EARNINGS_CALENDAR\":\n                          \"symbol,name,reportDate\\nLEAD,Lead,2030-01-16\\n\"})\n        self.assertNotIn(\"buy\", [a.kind for a in self.scan({}, [])])\n\n    def test_budget_notice_and_memory_files(self):\n        import pathlib, tempfile\n        os.environ[\"ALPHAVANTAGE_API_KEY\"] = \"av\"\n        Fake.world.update(gnews=gnews_xml(15, 10), av={})   # every AV call says \"premium\"\n        d = pathlib.Path(tempfile.mkdtemp())\n        old = S.HERE\n        S.HERE = d\n        try:\n            k, state = {}, {}\n            alerts = self.scan_k(state, [S.Holding(\"HELD\", 100.0, \"\", 2)], k)\n        finally:\n            S.HERE = old\n        self.assertIn(\"budget\", [a.kind for a in alerts])\n        self.assertTrue((d / \"vault\" / \"Bot Memory.md\").exists())\n        self.assertTrue((d / \"vault\" / \"Stocks\" / \"HELD.md\").exists())\n        self.assertTrue((d / \"vault\" / \"Daily\" / \"2030-01-15.md\").exists())\n        dash = json.loads((d / \"app\" / \"dashboard.json\").read_text())\n        self.assertEqual(dash[\"holdings\"][0][\"symbol\"], \"HELD\")\n        self.assertTrue(any(b[\"name\"] == \"Alpha Vantage\" and b[\"out\"] for b in dash[\"budgets\"]))\n        self.assertTrue(k[\"alerts_log\"])\n        self.assertIn(\"LEAD\", [t[\"sym\"] for t in k[\"track\"]])\n\n    def test_ideas_once_a_day(self):\n        Fake.world[\"news\"] = [news_item(i, [\"NEWCO\"], f\"NewCo beats estimates {i}\") for i in range(3)]\n        k, state = {}, {}\n        a1 = self.scan_k(state, [], k)\n        self.assertIn(\"ideas\", [a.kind for a in a1])\n        idea = next(a for a in a1 if a.kind == \"ideas\")\n        self.assertIn(\"NEWCO\", idea.message)\n        self.assertIn(\"NEWCO\", k[\"dynamic\"])\n        a2 = self.scan_k(state, [], k)\n        self.assertNotIn(\"ideas\", [a.kind for a in a2])\n\n    def scan_k(self, state, holdings, k):\n        import pathlib, tempfile\n        old = S.HERE\n        if old == pathlib.Path(S.__file__).resolve().parent:\n            S.HERE = pathlib.Path(tempfile.mkdtemp())   # never write test files into the real repo\n        try:\n            return S.run_scan(self.cfg, S.Alpaca(\"K\", \"SECRET\"), S.Pushover(\"tok\", \"usr\", self.cfg), holdings,\n                              state, knowledge=k, write_files=True)\n        finally:\n            S.HERE = old\n\n\nclass RealNumbersOnly(unittest.TestCase):\n    def test_big_move_is_from_history(self):\n        closes = [100.0]\n        for k in range(300):\n            closes.append(closes[-1] * (1.05 if k % 10 == 0 else 1.001))   # one 5% day in every 10\n        s = S.Series.from_bars(make_bars(closes))\n        m = S.metrics_at(\"X\", s, len(s) - 1)\n        self.assertAlmostEqual(m.big_move_pct, 5.0, delta=0.01)\n        txt = S.dollar_scenarios(100, 2, 1.5, m.big_move_pct)\n        self.assertIn(\"±1.5% = ±$3.00\", txt)\n        self.assertIn(\"±5.0% = ±$10.00\", txt)\n        self.assertNotIn(\"2×\", txt)\n\n\n# ---------------------------------------------------------------------------\n# Robinhood sync (SnapTrade) and alert charts\n# ---------------------------------------------------------------------------\n\nclass FakeSnap(BaseHTTPRequestHandler):\n    accounts = []\n    positions = {}\n    refreshed = []\n    fail = False\n    bad_sigs = 0\n    key = \"ckey\"\n\n    def log_message(self, *a):\n        pass\n\n    def _check(self, body):\n        u = urlparse(self.path)\n        want = S.snap_signature(u.path, u.query, FakeSnap.key, body)\n        if self.headers.get(\"Signature\") != want or \"clientId=cid\" not in u.query or \"timestamp=\" not in u.query:\n            FakeSnap.bad_sigs += 1\n\n    def _send(self, code, obj):\n        b = json.dumps(obj).encode()\n        self.send_response(code); self.send_header(\"Content-Type\", \"application/json\")\n        self.send_header(\"Content-Length\", str(len(b))); self.end_headers(); self.wfile.write(b)\n\n    def do_GET(self):\n        self._check(None)\n        p = urlparse(self.path).path\n        if FakeSnap.fail:\n            return self._send(500, {\"detail\": \"down\"})\n        if p == \"/accounts\":\n            return self._send(200, FakeSnap.accounts)\n        if p.endswith(\"/positions\"):\n            aid = p.split(\"/\")[2]\n            if aid == \"new-api\":\n                return self._send(410, {\"detail\": \"gone\"})\n            return self._send(200, FakeSnap.positions.get(aid, []))\n        if p.endswith(\"/positions/all\"):\n            return self._send(200, {\"results\": FakeSnap.positions.get(p.split(\"/\")[2], [])})\n        self._send(404, {})\n\n    def do_POST(self):\n        n = int(self.headers.get(\"Content-Length\") or 0)\n        body = json.loads(self.rfile.read(n)) if n else None\n        self._check(body)\n        FakeSnap.refreshed.append(urlparse(self.path).path)\n        self._send(200, {\"detail\": \"queued\"})\n\n\ndef old_pos(sym, units, cost, price=0):\n    return {\"symbol\": {\"symbol\": {\"symbol\": sym, \"raw_symbol\": sym}}, \"units\": units,\n            \"average_purchase_price\": cost, \"price\": price or cost}\n\n\nclass RobinhoodSync(unittest.TestCase):\n    @classmethod\n    def setUpClass(cls):\n        cls.srv = HTTPServer((\"127.0.0.1\", 0), FakeSnap)\n        threading.Thread(target=cls.srv.serve_forever, daemon=True).start()\n        cls.snap = S.SnapTrade(\"cid\", \"ckey\", f\"http://127.0.0.1:{cls.srv.server_port}\")\n\n    @classmethod\n    def tearDownClass(cls):\n        cls.srv.shutdown()\n\n    def setUp(self):\n        FakeSnap.accounts = [{\"id\": \"rh1\", \"institution_name\": \"Robinhood\", \"brokerage_authorization\": \"auth1\"},\n                             {\"id\": \"sch\", \"institution_name\": \"Schwab\", \"brokerage_authorization\": \"auth2\"}]\n        FakeSnap.positions = {\"rh1\": [old_pos(\"NVDA\", 0.1, 180.0), old_pos(\"AMD\", 0.2, 150.0),\n                                      {\"symbol\": {\"symbol\": {\"symbol\": \"USD\"}}, \"units\": 5, \"price\": 1,\n                                       \"average_purchase_price\": 1, \"cash_equivalent\": True}],\n                              \"sch\": [old_pos(\"KO\", 3, 60)]}\n        FakeSnap.refreshed, FakeSnap.fail, FakeSnap.bad_sigs = [], False, 0\n\n    def test_signature_matches_docs_algorithm(self):\n        import base64, hashlib, hmac\n        q = \"clientId=PASSIVTEST&timestamp=1635790389\"\n        body = {\"userId\": \"new_user_123\"}\n        canon = '{\"content\":{\"userId\":\"new_user_123\"},\"path\":\"/api/v1/snapTrade/registerUser\",\"query\":\"' + q + '\"}'\n        want = base64.b64encode(hmac.new(b\"KEY\", canon.encode(), hashlib.sha256).digest()).decode()\n        self.assertEqual(S.snap_signature(\"/api/v1/snapTrade/registerUser\", q, \"KEY\", body), want)\n        canon2 = '{\"content\":null,\"path\":\"/accounts\",\"query\":\"' + q + '\"}'\n        want2 = base64.b64encode(hmac.new(b\"KEY\", canon2.encode(), hashlib.sha256).digest()).decode()\n        self.assertEqual(S.snap_signature(\"/accounts\", q, \"KEY\"), want2)\n\n    def test_parse_positions(self):\n        self.assertEqual(S.parse_snap_position(old_pos(\"BRK.B\", 1, 400, 410)), (\"BRK.B\", 1.0, 400.0, 410.0))\n        self.assertEqual(S.parse_snap_position({\"instrument\": {\"symbol\": \"nvda\"}, \"units\": \"0.5\",\n                                                \"cost_basis\": \"120.5\", \"price\": \"130\"}),\n                         (\"NVDA\", 0.5, 120.5, 130.0))\n        self.assertIsNone(S.parse_snap_position({\"symbol\": {\"symbol\": {\"symbol\": \"X\"}}, \"units\": 0,\n                                                 \"average_purchase_price\": 1}))\n        self.assertIsNone(S.parse_snap_position({\"symbol\": {\"symbol\": {\"symbol\": \"AAPL 261218C00200000\"}},\n                                                 \"units\": 1, \"average_purchase_price\": 1}))\n\n    def test_first_sync_then_changes(self):\n        state = {}\n        now = \"2026-11-18T10:00:00-05:00\"\n        holds, notes = S.sync_broker(self.snap, CFG, state, now)\n        self.assertEqual(FakeSnap.bad_sigs, 0)\n        self.assertEqual({h.symbol for h in holds}, {\"NVDA\", \"AMD\"})   # Schwab account filtered out\n        self.assertTrue(all(h.source == \"robinhood\" and h.bought == \"2026-11-18\" for h in holds))\n        self.assertEqual([n.title for n in notes], [\"🔗 Robinhood linked\"])\n        self.assertEqual(FakeSnap.refreshed, [\"/authorizations/auth1/refresh\"])\n        # Next day: bought more AMD, sold NVDA, new buy of MSFT\n        FakeSnap.positions[\"rh1\"] = [old_pos(\"AMD\", 0.3, 152.0), old_pos(\"MSFT\", 0.05, 500)]\n        holds, notes = S.sync_broker(self.snap, CFG, state, \"2026-11-19T10:05:00-05:00\")\n        titles = sorted(n.title for n in notes)\n        self.assertEqual(titles, [\"✅ Robinhood: NVDA sold\", \"🧾 Robinhood: AMD position changed\",\n                                  \"🧾 Robinhood: you bought MSFT\"])\n        amd = next(h for h in holds if h.symbol == \"AMD\")\n        self.assertEqual((amd.buy_price, amd.shares, amd.bought), (152.0, 0.3, \"2026-11-18\"))\n        self.assertEqual(len(FakeSnap.refreshed), 2)\n        # 10 minutes later: no refresh yet (every 30 min), no repeat notices\n        holds, notes = S.sync_broker(self.snap, CFG, state, \"2026-11-19T10:15:00-05:00\")\n        self.assertEqual(notes, [])\n        self.assertEqual(len(FakeSnap.refreshed), 2)\n\n    def test_outage_keeps_last_positions(self):\n        state = {}\n        S.sync_broker(self.snap, CFG, state, \"2026-11-18T10:00:00-05:00\")\n        FakeSnap.fail = True\n        holds, notes = S.sync_broker(self.snap, CFG, state, \"2026-11-18T10:15:00-05:00\")\n        self.assertEqual({h.symbol for h in holds}, {\"NVDA\", \"AMD\"})\n        self.assertEqual(len(notes), 1)\n        self.assertIn(\"sync failed\", notes[0].title)\n        _, notes = S.sync_broker(self.snap, CFG, state, \"2026-11-18T10:30:00-05:00\")\n        self.assertEqual(notes, [])   # only one warning per day\n\n    def test_new_positions_endpoint_fallback(self):\n        FakeSnap.accounts = [{\"id\": \"new-api\", \"institution_name\": \"Robinhood Individual\"}]\n        FakeSnap.positions = {\"new-api\": [{\"instrument\": {\"symbol\": \"AAPL\"}, \"units\": \"2\", \"cost_basis\": \"200\"}]}\n        holds, _ = S.sync_broker(self.snap, CFG, {}, \"2026-11-18T10:00:00-05:00\")\n        self.assertEqual([(h.symbol, h.buy_price, h.shares) for h in holds], [(\"AAPL\", 200.0, 2.0)])\n\n    def test_no_robinhood_account(self):\n        FakeSnap.accounts = [{\"id\": \"sch\", \"institution_name\": \"Schwab\"}]\n        holds, notes = S.sync_broker(self.snap, CFG, {}, \"2026-11-18T10:00:00-05:00\")\n        self.assertEqual(holds, [])\n        self.assertIn(\"no Robinhood account\", notes[0].message)\n\n    def test_merge_prefers_broker(self):\n        manual = [S.Holding(\"NVDA\", 170), S.Holding(\"TSLA\", 300)]\n        broker = [S.Holding(\"NVDA\", 180, \"\", 0.1, \"robinhood\")]\n        self.assertEqual([(h.symbol, h.buy_price) for h in S.merge_holdings(manual, broker)],\n                         [(\"NVDA\", 180), (\"TSLA\", 300)])\n\n    def test_no_keys_no_sync(self):\n        self.assertEqual(S.sync_broker(None, CFG, {}, \"2026-11-18T10:00:00-05:00\"), ([], []))\n\n\nclass AlertCharts(unittest.TestCase):\n    def test_png_is_valid(self):\n        import struct, zlib\n        b = S.chart_png(trend(90, noise=0.01), [(100, \"#e5e7eb\", \"BUY\"), (98, \"#ff3b5c\", \"STOP\")],\n                        \"#2563eb\", \"NVDA\")\n        self.assertTrue(b.startswith(b\"\\x89PNG\\r\\n\\x1a\\n\"))\n        w, h = struct.unpack(\">II\", b[16:24])\n        self.assertEqual((w, h), (720, 400))\n        idat = b[b.index(b\"IDAT\") + 4:b.index(b\"IEND\") - 8]\n        self.assertEqual(len(zlib.decompress(idat)), h * (w * 3 + 1))\n        self.assertLess(len(b), 300_000)\n\n    def test_flat_prices_dont_crash(self):\n        self.assertTrue(S.chart_png([50.0] * 30, [], \"#16a34a\", \"KO\").startswith(b\"\\x89PNG\"))\n\n    def test_pushover_attaches_chart(self):\n        p = S.Pushover(\"tok\", \"usr\", CFG)\n        a = S.Alert(\"k\", \"profit\", \"T\", \"M\", 1, \"NVDA\", color=\"#2563eb\",\n                    chart={\"closes\": trend(60), \"lines\": [(100, \"#e5e7eb\", \"BUY\")]})\n        f = p.payload(a)\n        self.assertEqual(f[\"attachment_type\"], \"image/png\")\n        import base64\n        self.assertTrue(base64.b64decode(f[\"attachment_base64\"]).startswith(b\"\\x89PNG\"))\n        self.assertNotIn(\"attachment_base64\", p.payload(S.Alert(\"k\", \"info\", \"T\", \"M\", 0)))\n        off = dict(CFG, chart_images=False)\n        self.assertNotIn(\"attachment_base64\", S.Pushover(\"t\", \"u\", off).payload(a))\n\n    def test_holding_alert_carries_real_closes_and_app_link(self):\n        cfg = dict(CFG, holdings_edit_url=\"https://me.github.io/NEONTAPE/#log-{symbol}-{price}\")\n        m = mk(symbol=\"NVDA\", price=110, prev_close=109)\n        m.closes = [100, 101, 103, 105, 108, 110]\n        al = S.holding_alerts(S.Holding(\"NVDA\", 100.0), m, True, cfg, {}, set())\n        self.assertTrue(al)\n        self.assertEqual(al[0].chart[\"closes\"], m.closes)\n        self.assertEqual(al[0].url, \"https://me.github.io/NEONTAPE/#stocks\")\n        self.assertEqual(al[0].url_title, \"Open Neon Tape\")\n\n    def test_app_link(self):\n        self.assertEqual(S.app_link(dict(CFG, app_url=\"\", holdings_edit_url=\"\")), \"\")\n        self.assertEqual(S.app_link(dict(CFG, app_url=\"https://x.io/app/\"), \"stocks\"), \"https://x.io/app/#stocks\")\n\nclass TellTheBot(unittest.TestCase):\n    def test_parse(self):\n        P = S.parse_request\n        self.assertEqual(P(\"scan now\"), [{\"scan\": True}])\n        self.assertEqual(P(\"how is $amd doing\"), [{\"check\": \"AMD\"}])\n        self.assertEqual(P(\"should I sell AMD\"), [{\"check\": \"AMD\"}])\n        self.assertEqual(P(\"watch TSLA and PLTR\"), [{\"watch\": \"TSLA\"}, {\"watch\": \"PLTR\"}])\n        self.assertEqual(P(\"stop watching tsla\"), [{\"unwatch\": \"TSLA\"}])\n        self.assertEqual(P(\"set my stop loss to 2.5% and target 4%\"),\n                         [{\"set\": \"stop_pct\", \"value\": 2.5}, {\"set\": \"profit_pct\", \"value\": 4.0}])\n        self.assertEqual(P(\"risk medium\"), [{\"set\": \"risk_level\", \"value\": \"moderate\"}])\n        self.assertEqual(P(\"I have $50\"), [{\"set\": \"account_size\", \"value\": 50.0}])\n        self.assertEqual(P(\"pause alerts\"), [{\"set\": \"paused\", \"value\": True}])\n        self.assertEqual(P(\"make me rich\"), [])\n\n    def test_apply_settings_is_bounded_and_saved(self):\n        with tempfile.TemporaryDirectory() as d:\n            p = Path(d) / \"config.json\"\n            p.write_text('{\"stop_pct\": 2.0}')\n            done = S.apply_settings([{\"set\": \"stop_pct\", \"value\": 3}, {\"set\": \"profit_pct\", \"value\": 500},\n                                     {\"set\": \"risk_level\", \"value\": \"yolo\"}, {\"watch\": \"tsla\"},\n                                     {\"set\": \"max_trades\", \"value\": 1}, {\"set\": \"paused\", \"value\": True}], p)\n            raw = json.loads(p.read_text())\n            self.assertEqual(raw[\"stop_pct\"], 3.0)\n            self.assertNotIn(\"profit_pct\", raw)\n            self.assertNotIn(\"max_trades\", raw)\n            self.assertEqual(raw[\"watch_extra\"], [\"TSLA\"])\n            self.assertTrue(raw[\"paused\"])\n            self.assertEqual(sum(x.startswith(\"✗\") for x in done), 2)\n            S.apply_settings([{\"unwatch\": \"TSLA\"}], p)\n            raw = json.loads(p.read_text())\n            self.assertEqual((raw[\"watch_extra\"], raw[\"ignore\"]), ([], [\"TSLA\"]))\n            cfg = S.load_config(p)\n            self.assertNotIn(\"TSLA\", cfg[\"universe\"])\n            self.assertEqual(cfg[\"stop_pct\"], 3.0)\n\n    def test_watch_extra_joins_universe(self):\n        with tempfile.TemporaryDirectory() as d:\n            p = Path(d) / \"config.json\"\n            p.write_text('{\"watch_extra\": [\"SOFI\"], \"ignore\": [\"TSLA\", \"SPY\"]}')\n            cfg = S.load_config(p)\n            self.assertIn(\"SOFI\", cfg[\"universe\"])\n            self.assertNotIn(\"TSLA\", cfg[\"universe\"])\n            self.assertIn(\"SPY\", cfg[\"universe\"])   # the market gauge can't be ignored\n\n    def test_paused_only_lets_sell_now_through(self):\n        cfg = dict(CFG, paused=True)\n        m = mk(symbol=\"NVDA\", price=97, prev_close=99)\n        al = S.holding_alerts(S.Holding(\"NVDA\", 100.0), m, True, cfg, {}, set())\n        self.assertEqual([a.kind for a in al], [\"stop\"])\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n", "README.md": "# Stock Alerts: momentum + news scanner with iPhone alerts\n\nEvery 15 minutes on weekdays (7 AM – 4 PM Central), this bot:\n\n1. **Reads the news.** It pulls the Benzinga headline feed (free through your Alpaca account) and rates every story about your stocks or the whole market as good or bad, with its size and how confident the rating is. Before the market opens, it still checks news, so overnight stories reach you early.\n2. **Ranks ~70 big, liquid stocks by momentum.** Momentum has been the strongest factor in 2026.\n3. **Alerts you to a BUY** when a top-ranked stock is in a clean uptrend, isn't overextended, has no recent bad news, fits your risk level, and the overall market is healthy. Each buy alert also tells you **how much to buy** and **whether it looks like a short-term or long-term hold, and roughly for how long**.\n4. **Watches the stocks you bought** and alerts you using your rules, plus any big news about them.\n\n## The alerts\n\nOn the lock screen you see **one simple line**. Open the alert to see the full **WHY**, with the first line colored inside the Pushover app.\n\n| Alert | When | Loudness |\n|---|---|---|\n| 🛒 **BUY** | Passes every buy check. Shows suggested $ amount, hold time, and why | High |\n| 🟡 **SELL OFFER** | **+2%** from your buy price (then +4%, +6%) | High |\n| 🔵 **SOLID SELL** | **+8%** or more: a solid gain worth locking in | High |\n| 🟢 **BIG WIN** | **+20%** or more: strongly consider selling, at least part | High |\n| 📰 **News ▲/▼** | Medium or large story about a stock you own, with HOLD/SELL advice | High |\n| 📰 **Market news** | Big market-wide story (Fed, inflation, tariffs…), max 2 a day | Normal |\n| 🟠 **SELL WARNING** | Was up 1.5%+, now fading back to +0.5% | High |\n| 🟠 **NEAR STOP** | Down 1.5%, close to your -2% line | High |\n| 🔴 **SELL NOW** | Down **2%+**. Your rule says sell | **Emergency**: repeats every minute until you tap Acknowledge |\n| 📊 Close summary | About 25 min before the close: your profit/loss, advice, news | Normal |\n\nEvery sell alert includes a **HOLD or SELL read** that scores news, trend (20/50/200-day averages), RSI, momentum rank and the market's health.\n\n> **About colors on iPhone:** iOS doesn't let apps color the notification banner itself. The emoji shows the color on your lock screen, and the text is colored inside the Pushover app.\n>\n> **About \"covering the screen\":** no iPhone app can take over the full screen. The closest you can get is Pushover's **Critical Alerts**, which play sound even on silent or in Focus mode. The 🔴 alert also repeats until you acknowledge it. To make *every* alert an emergency, set all `priority_...` values in `config.json` to `2`.\n\n---\n\n## What the news can and can't do (read this once)\n\n**It can:** spot big stories within about 15 minutes, warn you about stocks you own, block buys right after bad news, push a SELL lean when bad news hits, and explain everything in plain words.\n\n**It can't:** get ahead of professional traders. Big news usually hits the price within **seconds**. When Nvidia's CEO resigned in November 2026, the stock fell as much as 14% at that morning's open, before most people had read the headline. Even \"obviously good\" news isn't guaranteed: Nvidia beat its earnings and guidance a few days later, popped about 4% before the next open, then turned *down* about 3% that day.\n\nSo the bot uses news as a **risk signal**, not a prediction machine. It will never say \"buy a lot because it's guaranteed.\" Position size is capped no matter how good the news looks. Your -2% rule, plus a real stop order in your broker, is what protects you.\n\n---\n\n## How much to buy (sizing)\n\nSet your account in `config.json`:\n```json\n\"account_size\": 30.0,\n\"risk_per_trade_pct\": 1.0,\n\"max_position_pct\": 50.0,\n\"risk_level\": \"moderate\"\n```\nThe bot sizes each buy so that if your -2% stop hits, you lose about **1% of your account**. It never puts more than **50%** in one stock. With $30 that means about **$15 per buy**, and if the stop hits you lose about $0.30. Each buy alert also shows what +2%, +8%, a typical day and the stock's real big days (its 1-in-20 moves over the last year) mean in dollars for that position.\n\n**Risk level:** `low` = only calm stocks (normal daily swing up to 1.5%), `moderate` = up to 2.5%, `any` = up to 3%.\n\nFill in shares in `holdings.txt` (e.g. `NVDA 182.50 2026-11-18 0.08`) and every alert shows your real dollar gain or loss.\n\n---\n\n## How long to hold (on every buy alert)\n\n- **With a Claude API key (recommended):** for each buy alert, Claude searches the web for the last week of news and investor-forum chatter (Reddit, StockTwits, X). It then answers **SHORT-TERM** (days to 2 weeks), **MEDIUM** (2–8 weeks) or **LONG-TERM** (3+ months), with how long, why, the forum mood, and the main risk. Heavy hype is treated as a short-term sign.\n- **Without a key:** built-in rules decide:\n  - Fresh news, stretched or jumpy → **short-term, 3–10 trading days**\n  - Steady 12-month uptrend, calm, top-ranked → **long-term, 3–12 months**. Strong 12-month winners have historically tended to keep outperforming for 3–12 months. A long hold needs a wider stop than 2%, such as below the 50-day average.\n  - Otherwise → **medium, 2–6 weeks**\n\n---\n\n## Costs\n\n| Thing | Cost |\n|---|---|\n| Pushover (iPhone alerts) | Free 30 days, then **$4.99 one time** |\n| Alpaca (prices + Benzinga news) | Free |\n| GitHub (runs the bot) | Free (private repo: about 800–1,000 of your 2,000 free minutes a month) |\n| Claude API (optional: smarter news ratings + forum check) | Pay as you go. Haiku 5.5 is $0.10 / $0.50 per million tokens, and web search is $10 per 1,000 searches. **Expect roughly $1–5/month.** Set a monthly spend limit in the Console to be safe. |\n\n---\n\n## Setup (about 30 minutes, easiest on your PC)\n\n### 1. Pushover: your alert app\n1. On iPhone, install **Pushover Notifications** and create an account.\n2. In the app's **Settings**, turn on **Critical Alerts** (high and emergency priority). Allow it when iOS asks.\n3. At **pushover.net**, copy your **User Key**.\n4. Click **Create an Application/API Token**, name it `Stock Alerts`, and copy the **API Token**.\n\n### 2. Alpaca: free prices and news\n1. Sign up at **alpaca.markets**. A paper account is fine.\n2. On the Paper account, go to **API Keys → Generate** and copy both keys. They're only used to read data; nothing is ever traded.\n\n### 3. Claude API key (optional, recommended)\n1. Go to **platform.claude.com**, sign in, add a few dollars of credit, and set a **monthly spend limit**.\n2. Under **API Keys**, create a key.\n3. If the Console has a setting to allow **web search**, turn it on. The hold-time check needs it; without it, the bot quietly falls back to its rule
